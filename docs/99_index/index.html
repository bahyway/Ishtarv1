<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HeptaScript — Under Construction</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #1a1a2e;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Courier New', monospace;
      overflow: hidden;
      position: relative;
    }

    /* Starfield background */
    .stars {
      position: fixed;
      inset: 0;
      z-index: 0;
    }
    .star {
      position: absolute;
      background: white;
      border-radius: 50%;
      animation: twinkle var(--d, 3s) ease-in-out infinite alternate;
    }
    @keyframes twinkle {
      from { opacity: 0.1; transform: scale(0.8); }
      to   { opacity: 0.9; transform: scale(1.2); }
    }

    /* Logo wrapper */
    .logo-wrap {
      position: relative;
      z-index: 1;
      width: 340px;
      height: 340px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Outer glow ring */
    .glow-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,215,0,0.12) 0%, transparent 70%);
      animation: pulse-glow 3s ease-in-out infinite;
    }
    @keyframes pulse-glow {
      0%, 100% { transform: scale(1);   opacity: 0.7; }
      50%       { transform: scale(1.15); opacity: 1;   }
    }

    /* SVG logo */
    #logo-svg {
      width: 300px;
      height: 300px;
      animation: spin-slow 30s linear infinite;
      filter: drop-shadow(0 0 12px rgba(255,215,0,0.7))
              drop-shadow(0 0 28px rgba(255,215,0,0.4));
    }
    @keyframes spin-slow {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    /* Inner network counter-rotates so it stays upright */
    #inner-net {
      animation: counter-spin 30s linear infinite;
      transform-origin: 150px 150px;
    }
    @keyframes counter-spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(-360deg); }
    }

    /* Labels counter-rotate too */
    #labels {
      animation: counter-spin 30s linear infinite;
      transform-origin: 150px 150px;
    }

    /* Inner dots pulse */
    .net-dot {
      animation: dot-pulse 2s ease-in-out infinite alternate;
    }
    @keyframes dot-pulse {
      from { r: 2.5px; opacity: 0.6; }
      to   { r: 4px;   opacity: 1;   }
    }

    /* Inner lines shimmer */
    .net-line {
      animation: line-fade 2.5s ease-in-out infinite alternate;
    }
    @keyframes line-fade {
      from { opacity: 0.3; }
      to   { opacity: 0.9; }
    }

    /* Star path draw-on effect */
    .star-path {
      stroke-dasharray: 2000;
      stroke-dashoffset: 2000;
      animation: draw-star 3s ease forwards, star-glow 3s ease-in-out 3s infinite alternate;
    }
    @keyframes draw-star {
      to { stroke-dashoffset: 0; }
    }
    @keyframes star-glow {
      from { filter: brightness(1); }
      to   { filter: brightness(1.5); }
    }

    /* Text section */
    .content {
      position: relative;
      z-index: 1;
      text-align: center;
      margin-top: 30px;
      color: #f0e68c;
    }

    .brand {
      font-size: 1.1rem;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      opacity: 0.7;
      margin-bottom: 10px;
      animation: fade-in 2s ease forwards;
    }

    .title {
      font-size: 2.4rem;
      font-weight: bold;
      letter-spacing: 0.15em;
      color: #ffd700;
      text-shadow: 0 0 20px rgba(255,215,0,0.5);
      animation: fade-in 2s ease 0.5s both;
    }

    .subtitle {
      font-size: 0.85rem;
      letter-spacing: 0.2em;
      color: rgba(255,215,0,0.5);
      margin-top: 6px;
      animation: fade-in 2s ease 0.8s both;
    }

    .message {
      margin-top: 36px;
      font-size: 1rem;
      color: rgba(255,255,255,0.75);
      letter-spacing: 0.05em;
      animation: fade-in 2s ease 1.2s both;
    }

    .dots {
      display: inline-block;
      overflow: hidden;
      width: 0;
      animation: grow-dots 1.5s steps(3, end) 2s infinite;
    }
    @keyframes grow-dots {
      0%   { width: 0; }
      33%  { width: 0.6em; }
      66%  { width: 1.2em; }
      100% { width: 1.8em; }
    }

    /* Progress bar */
    .progress-track {
      margin-top: 28px;
      width: 260px;
      height: 3px;
      background: rgba(255,215,0,0.15);
      border-radius: 2px;
      overflow: hidden;
      animation: fade-in 1s ease 1.5s both;
    }
    .progress-bar {
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, #ffd700, #fff5a0, #ffd700);
      background-size: 200% 100%;
      border-radius: 2px;
      animation:
        fill-bar 4s cubic-bezier(0.4,0,0.2,1) 2s forwards,
        shimmer 2s linear 2s infinite;
    }
    @keyframes fill-bar {
      to { width: 72%; }
    }
    @keyframes shimmer {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    .progress-label {
      margin-top: 8px;
      font-size: 0.72rem;
      color: rgba(255,215,0,0.4);
      letter-spacing: 0.15em;
      animation: fade-in 1s ease 1.5s both;
    }

    @keyframes fade-in {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Constants label style */
    .const-label {
      font-family: 'Georgia', serif;
      font-size: 14px;
      fill: #ffd700;
      font-style: italic;
    }
  </style>
</head>
<body>

<!-- Starfield (generated by JS) -->
<div class="stars" id="stars"></div>

<!-- Animated Logo -->
<div class="logo-wrap">
  <div class="glow-ring"></div>

  <svg id="logo-svg" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
        <stop offset="0%"   stop-color="#2a2a4a"/>
        <stop offset="100%" stop-color="#1a1a2e"/>
      </radialGradient>
      <filter id="glow">
        <feGaussianBlur stdDeviation="3" result="blur"/>
        <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>

    <!-- Background circle -->
    <circle cx="150" cy="150" r="148" fill="url(#bgGrad)" stroke="rgba(255,215,0,0.15)" stroke-width="1"/>

    <!-- 7-pointed star (heptagram) — drawn as one continuous path -->
    <!--
      7-point star with skip-3 pattern (same as the logo image).
      Points at angles: 90°, 90+360/7·1, … offset so top point is at top.
    -->
    <!--
      True {7/3} heptagram:
      7 vertices at radius 128, center (150,150), starting at top (-90°).
      P0=(150,22)  P1=(250,70)  P2=(275,178)  P3=(206,265)
      P4=(94,265)  P5=(25,178)  P6=(50,70)
      Connect every 3rd: P0→P3→P6→P2→P5→P1→P4→P0
    -->
    <g filter="url(#glow)">
      <path class="star-path"
        fill="rgba(255,215,0,0.07)"
        stroke="#ffd700"
        stroke-width="3.5"
        stroke-linejoin="round"
        d="M 150,22
           L 206,265
           L 50,70
           L 275,178
           L 25,178
           L 250,70
           L 94,265
           Z"
      />
    </g>

    <!-- Inner network (counter-rotates to stay upright) -->
    <g id="inner-net">
      <!-- 9-node complete graph approximation inside inner circle r≈52 -->
      <g opacity="0.7">
        <!-- Edges -->
        <line class="net-line" x1="150" y1="98"  x2="196" y2="122" stroke="#ffd700" stroke-width="0.8"/>
        <line class="net-line" x1="150" y1="98"  x2="196" y2="170" stroke="#ffd700" stroke-width="0.8" style="animation-delay:0.3s"/>
        <line class="net-line" x1="150" y1="98"  x2="166" y2="202" stroke="#ffd700" stroke-width="0.8" style="animation-delay:0.1s"/>
        <line class="net-line" x1="150" y1="98"  x2="134" y2="202" stroke="#ffd700" stroke-width="0.8" style="animation-delay:0.6s"/>
        <line class="net-line" x1="150" y1="98"  x2="104" y2="170" stroke="#ffd700" stroke-width="0.8" style="animation-delay:0.2s"/>
        <line class="net-line" x1="150" y1="98"  x2="104" y2="122" stroke="#ffd700" stroke-width="0.8" style="animation-delay:0.5s"/>
        <line class="net-line" x1="150" y1="98"  x2="150" y2="200" stroke="#ffd700" stroke-width="0.8" style="animation-delay:0.4s"/>

        <line class="net-line" x1="196" y1="122" x2="196" y2="170" stroke="#ffd700" stroke-width="0.8" style="animation-delay:0.2s"/>
        <line class="net-line" x1="196" y1="122" x2="166" y2="202" stroke="#ffd700" stroke-width="0.8" style="animation-delay:0.7s"/>
        <line class="net-line" x1="196" y1="122" x2="134" y2="202" stroke="#ffd700" stroke-width="0.8" style="animation-delay:0.1s"/>
        <line class="net-line" x1="196" y1="122" x2="104" y2="170" stroke="#ffd700" stroke-width="0.8" style="animation-delay:0.4s"/>
        <line class="net-line" x1="196" y1="122" x2="104" y2="122" stroke="#ffd700" stroke-width="0.8" style="animation-delay:0.3s"/>
        <line class="net-line" x1="196" y1="122" x2="150" y2="200" stroke="#ffd700" stroke-width="0.8" style="animation-delay:0.6s"/>

        <line class="net-line" x1="196" y1="170" x2="166" y2="202" stroke="#ffd700" stroke-width="0.8" style="animation-delay:0.5s"/>
        <line class="net-line" x1="196" y1="170" x2="134" y2="202" stroke="#ffd700" stroke-width="0.8" style="animation-delay:0.2s"/>
        <line class="net-line" x1="196" y1="170" x2="104" y2="170" stroke="#ffd700" stroke-width="0.8" style="animation-delay:0.8s"/>
        <line class="net-line" x1="196" y1="170" x2="104" y2="122" stroke="#ffd700" stroke-width="0.8" style="animation-delay:0.1s"/>
        <line class="net-line" x1="196" y1="170" x2="150" y2="200" stroke="#ffd700" stroke-width="0.8" style="animation-delay:0.4s"/>

        <line class="net-line" x1="166" y1="202" x2="134" y2="202" stroke="#ffd700" stroke-width="0.8" style="animation-delay:0.3s"/>
        <line class="net-line" x1="166" y1="202" x2="104" y2="170" stroke="#ffd700" stroke-width="0.8" style="animation-delay:0.7s"/>
        <line class="net-line" x1="166" y1="202" x2="104" y2="122" stroke="#ffd700" stroke-width="0.8" style="animation-delay:0.2s"/>
        <line class="net-line" x1="134" y1="202" x2="104" y2="170" stroke="#ffd700" stroke-width="0.8" style="animation-delay:0.5s"/>
        <line class="net-line" x1="134" y1="202" x2="104" y2="122" stroke="#ffd700" stroke-width="0.8" style="animation-delay:0.1s"/>
        <line class="net-line" x1="104" y1="170" x2="104" y2="122" stroke="#ffd700" stroke-width="0.8" style="animation-delay:0.6s"/>
        <line class="net-line" x1="104" y1="122" x2="150" y2="200" stroke="#ffd700" stroke-width="0.8" style="animation-delay:0.3s"/>

        <!-- Central dot connections -->
        <line class="net-line" x1="150" y1="150" x2="150" y2="98"  stroke="#ffd700" stroke-width="0.8" style="animation-delay:0.2s"/>
        <line class="net-line" x1="150" y1="150" x2="196" y2="122" stroke="#ffd700" stroke-width="0.8" style="animation-delay:0.4s"/>
        <line class="net-line" x1="150" y1="150" x2="196" y2="170" stroke="#ffd700" stroke-width="0.8" style="animation-delay:0.1s"/>
        <line class="net-line" x1="150" y1="150" x2="166" y2="202" stroke="#ffd700" stroke-width="0.8" style="animation-delay:0.7s"/>
        <line class="net-line" x1="150" y1="150" x2="134" y2="202" stroke="#ffd700" stroke-width="0.8" style="animation-delay:0.3s"/>
        <line class="net-line" x1="150" y1="150" x2="104" y2="170" stroke="#ffd700" stroke-width="0.8" style="animation-delay:0.5s"/>
        <line class="net-line" x1="150" y1="150" x2="104" y2="122" stroke="#ffd700" stroke-width="0.8" style="animation-delay:0.2s"/>
        <line class="net-line" x1="150" y1="150" x2="150" y2="200" stroke="#ffd700" stroke-width="0.8" style="animation-delay:0.6s"/>

        <!-- Nodes -->
        <circle class="net-dot" cx="150" cy="150" r="4"   fill="#ffd700"/>
        <circle class="net-dot" cx="150" cy="98"  r="3"   fill="#ffd700" style="animation-delay:0.3s"/>
        <circle class="net-dot" cx="196" cy="122" r="3"   fill="#ffd700" style="animation-delay:0.5s"/>
        <circle class="net-dot" cx="196" cy="170" r="3"   fill="#ffd700" style="animation-delay:0.2s"/>
        <circle class="net-dot" cx="166" cy="202" r="3"   fill="#ffd700" style="animation-delay:0.7s"/>
        <circle class="net-dot" cx="134" cy="202" r="3"   fill="#ffd700" style="animation-delay:0.1s"/>
        <circle class="net-dot" cx="104" cy="170" r="3"   fill="#ffd700" style="animation-delay:0.4s"/>
        <circle class="net-dot" cx="104" cy="122" r="3"   fill="#ffd700" style="animation-delay:0.6s"/>
        <circle class="net-dot" cx="150" cy="200" r="3"   fill="#ffd700" style="animation-delay:0.8s"/>
      </g>
    </g>

    <!-- Physics constants labels (counter-rotate with inner net) -->
    <g id="labels">
      <!-- ℏ top -->
      <text class="const-label" x="147" y="12"  text-anchor="middle">ℏ</text>
      <!-- k_B top-right -->
      <text class="const-label" x="262" y="88"  text-anchor="start">k<tspan font-size="9" dy="3">B</tspan></text>
      <!-- e right -->
      <text class="const-label" x="278" y="190" text-anchor="start">e</text>
      <!-- c bottom-right -->
      <text class="const-label" x="222" y="294" text-anchor="middle">c</text>
      <!-- π bottom-left -->
      <text class="const-label" x="78"  y="294" text-anchor="middle">π</text>
      <!-- G left -->
      <text class="const-label" x="18"  y="190" text-anchor="end">G</text>
      <!-- 1 top-left -->
      <text class="const-label" x="36"  y="88"  text-anchor="end">1</text>
    </g>
  </svg>
</div>

<!-- Text content -->
<div class="content">
  <div class="brand">BahyWay Ecosystem</div>
  <div class="title">HeptaScript</div>
  <div class="subtitle">HeptaSec v4.0</div>

  <div class="message">
    We're building something extraordinary<span class="dots">...</span>
  </div>

  <div class="progress-track">
    <div class="progress-bar"></div>
  </div>
  <div class="progress-label">INITIALIZING SYSTEMS</div>
</div>

<script>
  // Generate starfield
  const container = document.getElementById('stars');
  for (let i = 0; i < 160; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const size = Math.random() * 2.5 + 0.5;
    s.style.cssText = `
      width:${size}px; height:${size}px;
      top:${Math.random()*100}%; left:${Math.random()*100}%;
      --d:${(Math.random()*4+1).toFixed(2)}s;
      animation-delay:${(Math.random()*5).toFixed(2)}s;
    `;
    container.appendChild(s);
  }
</script>
</body>
</html>
