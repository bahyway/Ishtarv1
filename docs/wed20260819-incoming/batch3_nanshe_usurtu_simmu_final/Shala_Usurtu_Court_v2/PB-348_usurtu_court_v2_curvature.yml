---
# ============================================================================
# PB-348 · UṢURTU COURT v2 — curvature correction of the Šala rehearsal
# ----------------------------------------------------------------------------
# FAULT REPAIRED (found by Bahaa, 2026-08-19):
#   v1 stage drew the Euclidean shadow of the heptagon hierarchy, which
#   shows gaps. GL-MAP-001 forbids empty space: an unowned point is a
#   point where no event-kaki can exist.
#
# LAW ADDITION (GL-MAP-001 §curvature, candidate text):
#   • Empty space = no possible event-kaki = FORBIDDEN in the Unified Pattern.
#   • Seven-sided cells carry an angle deficit: they refuse the flat plane
#     AND the sphere (Euler demands pentagons on positive curvature — the
#     soccer-ball clause). The surface that holds heptagons gaplessly is
#     the hyperbolic bowl; {7,3} is its tiling.
#   • Therefore: index curvature is NEGATIVE ({7,3}, gapless by
#     construction); truth curvature is the geoid (UTM 38N); the veil maps
#     between them. All membrane rehearsals must render the index space
#     through the Poincaré veil — never as a flat Euclidean shadow.
#   • Census clause: any membrane court must be able to hold an
#     empty-space census (sampled witnesses, each must find exactly one
#     owning cell) and journal the verdict.
#
# WAY OF WORK: run FROM the Fedora bare-metal HOST. Šala files are
# prototypes only; production visualization remains egui/WGPU on the host.
# ============================================================================

- name: "PB-348 · Deploy Uṣurtu Court v2 ({7,3} Poincaré) and retire v1"
  hosts: localhost
  connection: local
  become: false
  vars:
    shala_hub: "{{ ansible_env.HOME }}/bahyway/shala"
    src_dir: "{{ playbook_dir }}"
    v2_file: "shala_usurtu_court_v2.html"
    v1_file: "shala_usurtu_court.html"

  tasks:

    - name: "PB-348.1 · Ensure Šala hub directory exists"
      ansible.builtin.file:
        path: "{{ shala_hub }}"
        state: directory
        mode: "0755"

    - name: "PB-348.2 · Deploy v2 court (the curved membrane)"
      ansible.builtin.copy:
        src: "{{ src_dir }}/{{ v2_file }}"
        dest: "{{ shala_hub }}/{{ v2_file }}"
        mode: "0644"
      register: deploy_v2

    - name: "PB-348.3 · Retire v1 into NUZI lineage (never deleted — archived)"
      ansible.builtin.command:
        cmd: mv "{{ shala_hub }}/{{ v1_file }}" "{{ shala_hub }}/nuzi_{{ v1_file }}"
        removes: "{{ shala_hub }}/{{ v1_file }}"
      # NUZI = inward/archival/lineage. The Euclidean shadow becomes
      # provenance: the court remembers what it once wrongly showed.

    - name: "PB-348.4 · Witness the deployment (checksum)"
      ansible.builtin.stat:
        path: "{{ shala_hub }}/{{ v2_file }}"
        checksum_algorithm: sha256
      register: v2_stat

    - name: "PB-348.5 · Verdict"
      ansible.builtin.debug:
        msg: >
          PB-348 complete. Uṣurtu Court v2 deployed (sha256
          {{ v2_stat.stat.checksum | default('n/a') }}).
          The rehearsal now shows {7,3} through the Poincaré veil:
          every point owned, census instrument armed, v1 shadow archived
          under NUZI. GL-MAP-001 §curvature and §census await CSR-08 seal.
