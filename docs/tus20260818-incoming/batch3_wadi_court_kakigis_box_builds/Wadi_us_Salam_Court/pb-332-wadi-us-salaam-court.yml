---
# ============================================================================
# PB-332 — Wadi-us-Salaam Court (Šala tab: OSM + {7,3} mask, Nasaru)
# BahyWay.Ecosystem v4.0 — SilaEngine
# ----------------------------------------------------------------------------
# LAW OF THIS TABLET:
#   * Šala PROTOTYPE ONLY (GL-VIZ-001); production is egui/WGPU on the host.
#   * Basemap: real OpenStreetMap raster tiles, drawn by a sovereign inline
#     canvas tile engine (no Leaflet, no CDN, no external JS). Tiles need
#     internet during rehearsal; offline they show blank while the mask,
#     particles, search and veil all still work.
#     ATTRIBUTION LAW: "(c) OpenStreetMap contributors" is displayed
#     permanently — open data demands its credit.
#   * The {7,3} mask is the INDEX CHART (GL-GEO-002): generated by the
#     reflection group, charted onto the cemetery around the anchor.
#     Truth space remains UTM 38N (PB-328); the chart is for the eye and
#     the address tree, never for measurement.
#   * PALAHU CLAUSE (PB-331) governs ALL search arrivals: veil descent,
#     no aerial traversal over the graves, exact arrival, TALUKU off.
#
# FILE LAYOUT EXPECTED BESIDE THIS PLAYBOOK:
#   files/shala_wadi_us_salaam_heptamask.html
#
# RUN (from the Fedora host — running this is your CSR-08 confirmation):
#   ansible-playbook pb-332-wadi-us-salaam-court.yml
# ============================================================================

- name: "PB-332 | Deploy the Wadi-us-Salaam Court (OSM + {7,3} mask)"
  hosts: localhost
  connection: local
  become: false

  vars:
    workshop_root: /opt/bahyway/workshop/najaf_navi
    shala_dir: "{{ workshop_root }}/shala"

  tasks:

    - name: "1.1 | Assert the workshop stands (PB-325)"
      ansible.builtin.stat:
        path: "{{ workshop_root }}"
      register: ws

    - name: "1.2 | Halt if workshop missing"
      ansible.builtin.assert:
        that: ws.stat.exists
        fail_msg: "REFUSED: run PB-325 first — the Najaf workshop does not stand."

    - name: "2.1 | Deploy the court"
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/files/shala_wadi_us_salaam_heptamask.html"
        dest: "{{ shala_dir }}/shala_wadi_us_salaam_heptamask.html"
        mode: "0640"

    - name: "3.1 | NUZI provenance note"
      ansible.builtin.copy:
        dest: "{{ workshop_root }}/nuzi_provenance/pb-332-note.md"
        mode: "0640"
        content: |
          PB-332 deployed the Wadi-us-Salaam Court:
          OSM basemap (sovereign inline canvas tile engine, OSM attribution
          shown) + {7,3} reflection-group mask charted around the cemetery
          anchor + 3D yaw/tilt/zoom + full Nasaru grammar + PALAHU veil
          descent for every search arrival (no traversal over the graves,
          exact arrival, orbit off). Chart is index-space only; truth
          remains UTM 38N.

    - name: "4.1 | Report"
      ansible.builtin.debug:
        msg:
          - "Court deployed: {{ shala_dir }}/shala_wadi_us_salaam_heptamask.html"
          - "Tiles require internet during rehearsal; all else works offline."
