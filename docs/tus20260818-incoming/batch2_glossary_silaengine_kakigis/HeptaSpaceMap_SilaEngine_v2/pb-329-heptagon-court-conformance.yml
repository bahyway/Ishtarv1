---
# ============================================================================
# PB-329 — HEPTAGON COURT CONFORMANCE fix (Šala prototype v2)
# BahyWay.Ecosystem v4.0 — SilaEngine · honors GL-GEO-002
# ----------------------------------------------------------------------------
# CORRECTION SEALED BY THIS TABLET:
#   * The v1 prototype (PB-327) drew disconnected regular heptagons over a
#     FLAT grid — decoration, in violation of GL-GEO-002
#     ("the heptagon is the true grid — curvature is the premise").
#   * v2 rebuilds the membrane as the ACTUAL {7,3} hyperbolic tiling in a
#     Poincare disk, generated by the reflection group (edge inversions),
#     with true geodesic edges. The tiling's shared edges ARE the Seven
#     Gates. Navigation = Mobius (SU(1,1)) motion through the tiling.
#     Search sweep = geodesic pull of the destination cell to disk center,
#     then descent. Nasaru grammar (GL-VIZ-001) fully preserved.
#   * v1 is moved to deprecated/ — kept for provenance, never shown again.
#
# FILE LAYOUT EXPECTED BESIDE THIS PLAYBOOK:
#   files/shala_silaengine_heptaspacemap_v2.html
#
# RUN (from the Fedora host — running this is your CSR-08 confirmation):
#   ansible-playbook pb-329-heptagon-court-conformance.yml
# ============================================================================

- name: "PB-329 | Šala v2 — {7,3} hyperbolic HeptaSpaceMap (GL-GEO-002)"
  hosts: localhost
  connection: local
  become: false

  vars:
    workshop_root: /opt/bahyway/workshop/najaf_navi
    shala_dir: "{{ workshop_root }}/shala"

  tasks:

    - name: "1.1 | Ensure Šala + deprecated dirs exist"
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0750"
      loop:
        - "{{ shala_dir }}"
        - "{{ shala_dir }}/deprecated"

    - name: "2.1 | Check whether v1 prototype is present"
      ansible.builtin.stat:
        path: "{{ shala_dir }}/shala_silaengine_heptaspacemap.html"
      register: v1

    - name: "2.2 | Deprecate v1 (decorative flat grid — GL-GEO-002 violation)"
      ansible.builtin.command:
        cmd: >
          mv {{ shala_dir }}/shala_silaengine_heptaspacemap.html
             {{ shala_dir }}/deprecated/shala_silaengine_heptaspacemap_v1_FLAT_DEPRECATED.html
      when: v1.stat.exists
      changed_when: true

    - name: "3.1 | Deploy v2 — the {7,3} Heptagon Court"
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/files/shala_silaengine_heptaspacemap_v2.html"
        dest: "{{ shala_dir }}/shala_silaengine_heptaspacemap_v2.html"
        mode: "0640"

    - name: "4.1 | NUZI provenance note"
      ansible.builtin.copy:
        dest: "{{ workshop_root }}/nuzi_provenance/pb-329-note.md"
        mode: "0640"
        content: |
          PB-329 HEPTAGON COURT CONFORMANCE.
          v1 prototype deprecated: flat-grid decorative heptagons violated
          GL-GEO-002 (curvature is the premise; the heptagon tiles exactly
          only on the curved membrane).
          v2 deployed: true {7,3} hyperbolic tiling (reflection group,
          geodesic edges) in Poincare disk; Mobius navigation; geodesic-pull
          LAND-FROM-SKY; tiling edges are the Seven Gates.
          GL-VIZ-001 grammar preserved in full.

    - name: "5.1 | Report"
      ansible.builtin.debug:
        msg:
          - "v1 deprecated -> {{ shala_dir }}/deprecated/"
          - "v2 sealed -> {{ shala_dir }}/shala_silaengine_heptaspacemap_v2.html"
          - "The membrane is now the {7,3} tiling itself. Curvature admitted."
