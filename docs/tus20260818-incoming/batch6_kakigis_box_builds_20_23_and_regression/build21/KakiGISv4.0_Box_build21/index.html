<script>
"use strict";
var stat=document.getElementById('stat');
if(location.protocol==='file:'){
  document.body.innerHTML='<div style="color:#e0b0b0;background:#0a0f1e;'+
   'height:100vh;display:flex;align-items:center;justify-content:center;'+
   'text-align:center;font:18px Georgia;padding:0 10vw;">REFUSED: opened via '+
   'file:// — OSM tiles reject referer-less requests (403).<br><br>'+
   'Open a terminal in this folder and run:<br><br>'+
   '<b style="color:#d4af37;font-family:monospace;">bash run.sh</b><br><br>'+
   'then open <b style="color:#d4af37;">http://127.0.0.1:8090</b></div>';
  throw new Error('file:// refused (KAKIGIS law)');
}
/* ---------------- map (OSM, ODbL attribution mandatory) ------------- */
var map=L.map('map',{zoomControl:true,maxZoom:22}).setView([32.017,44.297],14);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{
  maxZoom:22,maxNativeZoom:19,attribution:'&copy; OpenStreetMap contributors (ODbL)'
}).addTo(map);
map.flyTo=function(){throw new Error('PALAHU: flyTo forbidden — use veilTo');};

/* ---------------- {7,3} generator ----------------------------------- */
function C(re,im){return{re:re,im:im};}
function cadd(a,b){return C(a.re+b.re,a.im+b.im);}
function csub(a,b){return C(a.re-b.re,a.im-b.im);}
function cabs2(a){return a.re*a.re+a.im*a.im;}
function cscale(a,s){return C(a.re*s,a.im*s);}
var coshR=Math.cos(Math.PI/3)/Math.sin(Math.PI/7);
var Rh=Math.log(coshR+Math.sqrt(coshR*coshR-1)),rv=Math.tanh(Rh/2);
var centerVerts=[];
for(var k=0;k<7;k++){var a=2*Math.PI*k/7-Math.PI/2;
  centerVerts.push(C(rv*Math.cos(a),rv*Math.sin(a)));}
function geoCircle(A,B){var den=2*(A.re*B.im-B.re*A.im);
  if(Math.abs(den)<1e-8)return null;
  var A1=cabs2(A)+1,A2=cabs2(B)+1;
  var cx=(A1*B.im-A2*A.im)/den,cy=(A2*A.re-A1*B.re)/den;
  return{c:C(cx,cy),r2:cx*cx+cy*cy-1};}
function reflect(z,A,B){var g=geoCircle(A,B);
  if(!g){var ph=Math.atan2(B.im-A.im,B.re-A.re);
    return C(Math.cos(2*ph)*z.re+Math.sin(2*ph)*z.im,
             Math.sin(2*ph)*z.re-Math.cos(2*ph)*z.im);}
  var d=csub(z,g.c);return cadd(g.c,cscale(d,g.r2/cabs2(d)));}
function sampleGeo(z1,z2,n){var g=geoCircle(z1,z2),pts=[];
  if(!g){for(var i=0;i<=n;i++)
    pts.push(C(z1.re+(z2.re-z1.re)*i/n,z1.im+(z2.im-z1.im)*i/n));return pts;}
  var t1=Math.atan2(z1.im-g.c.im,z1.re-g.c.re);
  var dt=Math.atan2(z2.im-g.c.im,z2.re-g.c.re)-t1;
  while(dt>Math.PI)dt-=2*Math.PI;while(dt<-Math.PI)dt+=2*Math.PI;
  var r=Math.sqrt(Math.max(0,g.r2));
  for(var j=0;j<=n;j++){var th=t1+dt*j/n;
    pts.push(C(g.c.re+r*Math.cos(th),g.c.im+r*Math.sin(th)));}
  return pts;}
function cen7(vs){var x=0,y=0;
  for(var i=0;i<vs.length;i++){x+=vs[i].re;y+=vs[i].im;}
  return C(x/vs.length,y/vs.length);}

/* ---------------- REAL yard: local file OR live OSM API ------------- */
var RE=6378137;
function rad(d){return d*Math.PI/180;}
function m2x(lon){return RE*rad(lon);}
function m2y(lat){return RE*Math.log(Math.tan(Math.PI/4+rad(lat)/2));}
function xy2ll(x,y){return[(2*Math.atan(Math.exp(y/RE))-Math.PI/2)*180/Math.PI,
                           (x/RE)*180/Math.PI];}
var YARD=null,AX=0,AY=0,MASK_R=0;
function installYard(ringLatLon,sourceLabel){
  L.polygon(ringLatLon,{color:'#8c620a',weight:2,fill:false}).addTo(map);
  YARD=ringLatLon.map(function(p){return[m2x(p[1]),m2y(p[0])];});
  AX=0;AY=0;
  for(var i=0;i<YARD.length;i++){AX+=YARD[i][0];AY+=YARD[i][1];}
  AX/=YARD.length;AY/=YARD.length;
  MASK_R=0;
  for(var j=0;j<YARD.length;j++){
    var d=Math.hypot(YARD[j][0]-AX,YARD[j][1]-AY);if(d>MASK_R)MASK_R=d;}
  MASK_R*=1.03;
  var c=xy2ll(AX,AY);
  map.setView(c,14,{animate:false});
  stat.textContent='REAL yard: '+sourceLabel+' ('+YARD.length
    +' vertices) — size the view, press Use mask';
  setTimeout(harvestKudurru,2500);
}
function loadFromOsmApi(){
  stat.textContent='fetching REAL boundary from OSM (way 325851897)…';
  fetch('https://api.openstreetmap.org/api/0.6/way/325851897/full.json')
  .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();})
  .then(function(j){
    var nodes={},way=null;
    j.elements.forEach(function(e){
      if(e.type==='node')nodes[e.id]=[e.lat,e.lon];
      if(e.type==='way'&&String(e.id)==='325851897')way=e;});
    if(!way)throw new Error('way missing in response');
    var ring=way.nodes.map(function(id){return nodes[id];});
    if(ring.length<4)throw new Error('degenerate ring');
    installYard(ring,'OSM live (ODbL, © OpenStreetMap contributors)');
  })
  .catch(function(e){
    stat.textContent='REFUSED: no yard — local file absent and OSM fetch failed ('
      +e.message+'). Internet needed once, or provide data/yard.geojson.';
  });
}
fetch('data/yard.geojson')
.then(function(r){if(!r.ok)throw new Error('absent');return r.json();})
.then(function(gj){
  var ring=gj.features[0].geometry.coordinates[0]
    .map(function(p){return[p[1],p[0]];});
  installYard(ring,'local GeoJSON (PB-335)');
})
.catch(loadFromOsmApi);
function chartLL(z){return xy2ll(AX+z.re*MASK_R,AY+z.im*MASK_R);}

/* ---------------- HeptaSpaceMap layer (on-fly, PB-334 rule) ---------- */
var HeptaLayer=L.Layer.extend({
  onAdd:function(m){this._m=m;
    this._c=L.DomUtil.create('canvas');
    this._c.style.position='absolute';this._c.style.pointerEvents='none';
    m.getPanes().overlayPane.appendChild(this._c);
    m.on('move zoom viewreset resize',this._draw,this);
    this.cells=[];this._draw();},
  onRemove:function(m){m.off('move zoom viewreset resize',this._draw,this);
    L.DomUtil.remove(this._c);},
  generate:function(){
    if(!YARD)return null;
    var t0=performance.now(),m=this._m;
    var out=[],seen={},iter=0;
    var q=[{v:centerVerts,c:cen7(centerVerts),a:[]}];
    seen[this._kk(q[0].c)]=1;
    var sz=m.getSize(),MAXC=2200;
    var MINPX=+((document.getElementById('gran')||{}).value)||24;
    while(q.length&&out.length<MAXC&&iter<16000){
      iter++;var cell=q.shift();
      var px=this._px(cell),s=this._scr(cell.c);
      var mg=px*2+240;
      var near=s.x>-mg&&s.x<sz.x+mg&&s.y>-mg&&s.y<sz.y+mg;
      var vis=s.x>-px&&s.x<sz.x+px&&s.y>-px&&s.y<sz.y+px;
      if(vis&&px>=1.6)out.push(cell);
      if(px>MINPX&&near){
        for(var e=0;e<7;e++){
          var A=cell.v[e],B=cell.v[(e+1)%7],nv=[];
          for(var i=0;i<7;i++)nv.push(reflect(cell.v[i],A,B));
          var nc=cen7(nv);
          if(Math.hypot(nc.re,nc.im)>0.9995)continue;
          var k2=this._kk(nc);if(seen[k2])continue;seen[k2]=1;
          q.push({v:nv,c:nc,a:cell.a.concat([e])});}}}
    this.cells=out;this._draw();
    return{n:out.length,ms:(performance.now()-t0).toFixed(0),cap:out.length>=MAXC};},
  _kk:function(c){return Math.round(c.re*30000)+'_'+Math.round(c.im*30000);},
  _scr:function(c){return this._m.latLngToContainerPoint(chartLL(c));},
  _px:function(cell){var sc=this._scr(cell.c),mx=0;
    for(var i=0;i<7;i++){var sv=this._scr(cell.v[i]);
      var d=Math.hypot(sv.x-sc.x,sv.y-sc.y);if(d>mx)mx=d;}
    return mx;},
  _draw:function(){
    var m=this._m,sz=m.getSize();
    var tl=m.containerPointToLayerPoint([0,0]);
    L.DomUtil.setPosition(this._c,tl);
    this._c.width=sz.x;this._c.height=sz.y;
    var g=this._c.getContext('2d');
    g.clearRect(0,0,sz.x,sz.y);
    if(!this.cells.length||!YARD)return;
    var dimF=navMode?0.4:1;   /* nav: index stays, dimmed under the way */
    g.save();g.beginPath();
    for(var b=0;b<YARD.length;b++){
      var ll=xy2ll(YARD[b][0],YARD[b][1]);
      var p=m.latLngToContainerPoint(ll);
      if(b)g.lineTo(p.x,p.y);else g.moveTo(p.x,p.y);}
    g.closePath();g.clip();
    for(var ci=0;ci<this.cells.length;ci++){
      var cell=this.cells[ci],px=this._px(cell);
      if(px<1.6)continue;
      g.strokeStyle='rgba(140,98,10,'
        +(Math.min(0.8,px*0.006+0.25)*dimF).toFixed(2)+')';
      g.lineWidth=1;
      for(var k=0;k<7;k++){
        var pts=sampleGeo(cell.v[k],cell.v[(k+1)%7],4);
        g.beginPath();
        for(var i=0;i<pts.length;i++){
          var s=m.latLngToContainerPoint(chartLL(pts[i]));
          if(i)g.lineTo(s.x,s.y);else g.moveTo(s.x,s.y);}
        g.stroke();}
      if(px>70){var scp=this._scr(cell.c);
        g.fillStyle='rgba(140,98,10,0.95)';
        g.font='10px monospace';g.textAlign='center';
        g.fillText(addrStr(cell,true),scp.x,scp.y+3);
        g.textAlign='left';}}
    g.restore();}
});
function addrStr(cell,short){
  if(!cell.a||!cell.a.length)return 'SILA\u00b7root';
  var d=cell.a;
  if(short&&d.length>4)return 'SILA\u2026'+d.slice(-3).join('\u00b7');
  return 'SILA\u00b7'+d.join('\u00b7');}
function mPerPx(){var lat=map.getCenter().lat;
  return 156543.03392*Math.cos(lat*Math.PI/180)/Math.pow(2,map.getZoom());}
/* interrogate: click -> smallest containing cell answers with identity */
map.on('click',function(ev){
  if(anchorMode){anchorMode=false;
    setAnchor1(ev.latlng.lat,ev.latlng.lng,'Chosen point');
    stat.textContent='anchor 1 set — now choose the grave (anchor 2)';
    return;}
  if(!hepta.cells.length)return;
  var P=ev.containerPoint,best=null,bestPx=1e12;
  for(var ci=0;ci<hepta.cells.length;ci++){
    var cell=hepta.cells[ci],pts=[],inside=false;
    for(var k=0;k<7;k++)pts.push(hepta._scr(cell.v[k]));
    for(var i=0,j=6;i<7;j=i++){
      if(((pts[i].y>P.y)!=(pts[j].y>P.y))&&
         (P.x<(pts[j].x-pts[i].x)*(P.y-pts[i].y)/(pts[j].y-pts[i].y)+pts[i].x))
        inside=!inside;}
    if(inside){var px=hepta._px(cell);
      if(px<bestPx){bestPx=px;best=cell;}}}
  if(best){
    var wM=(bestPx*2*mPerPx()).toFixed(1);
    L.popup().setLatLng(ev.latlng).setContent(
      '<b>'+addrStr(best,false)+'</b><br>depth '+best.a.length
      +' \u00b7 cell \u2248 '+wM+' m across'
      +'<br>one grave = one leaf \u00b7 truth UTM 38N').openOn(map);}});
/* seal: export materialized cells as the REAL HeptaSpaceMap artifact */
function sealGeoJSON(){
  if(!hepta.cells.length){stat.textContent='seal: no mask yet \u2014 press Use mask first';return;}
  var feats=hepta.cells.map(function(cell){
    var ring=[];
    for(var k=0;k<7;k++){
      var pts=sampleGeo(cell.v[k],cell.v[(k+1)%7],4);
      for(var i=0;i<pts.length-1;i++){
        var ll=chartLL(pts[i]);ring.push([ll[1],ll[0]]);}}
    ring.push(ring[0]);
    return{type:'Feature',properties:{
      hepta_id:'SILA-'+(cell.a.length?cell.a.join(''):'R'),
      gate_path:cell.a.join('\u00b7'),depth:cell.a.length,
      law:'one grave = one leaf; index space {7,3}; truth UTM 38N'},
      geometry:{type:'Polygon',coordinates:[ring]}};});
  var gj={type:'FeatureCollection',
    properties:{name:'HeptaSpaceMap \u2014 Wadi-us-Salaam',
      source:'yard: OSM way 325851897 (ODbL, \u00a9 OpenStreetMap contributors)',
      cells:feats.length,zoom:map.getZoom()},features:feats};
  var b=new Blob([JSON.stringify(gj)],{type:'application/geo+json'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(b);
  a.download='heptaspacemap_wadi_us_salam_z'+map.getZoom()+'.geojson';
  a.click();
  stat.textContent='sealed: '+feats.length+' addressed cells \u2192 GeoJSON (QGIS / susa_outbox ready)';}

var hepta=new HeptaLayer().addTo(map);
var auto=false,regenT=null;
function useMask(){var r=hepta.generate();
  if(!r){stat.textContent='mask: no yard yet — wait for boundary, then retry';return;}
  var first=!auto;auto=true;
  stat.textContent='mask: '+r.n+' cells · '+r.ms+' ms · z'+map.getZoom()
    +' · auto'+(first?' engaged':'')+(r.cap?' · CAP — zoom in or coarsen':'');
  document.getElementById('bUse').classList.add('on');}
document.getElementById('bUse').onclick=useMask;
map.on('moveend zoomend',function(){
  if(!auto)return;clearTimeout(regenT);regenT=setTimeout(useMask,280);});

/* ---------------- plots: SilaEngine bridge, mock fallback ------------ */
var plots=[];
fetch('http://127.0.0.1:7010/plots').then(function(r){return r.json();})
.then(function(j){plots=j;addPlots();})
.catch(function(){
  plots=[
   {name:'Target plot NJF-80211',lat:32.0198,lon:44.2971,addr:'3·5·1·0·2·6·4·1·3',
    who:'Sayyid Jawad al-Musawi',died:'2021',kaki:'A17F 0C22 0102 0000 68B1 D4E3',
    nasab:{ism:'جواد',laqab:'أبو علي',ab:'محمد',jadd:'باقر',fam:'الموسوي',clan:'آل موسى'}},
   {name:'Plot NJF-80272',lat:32.0152,lon:44.2938,addr:'3·5·1·0·2·6·4·2·0',
    who:'Umm Sara Rahima',died:'2016',kaki:'D0AA 0C22 0102 0000 68B3 7C15',
    nasab:{ism:'رحيمة',laqab:'أم سارة',ab:'حسون',jadd:'كاظم',fam:'العبودي',clan:'بني حسن'}},
   {name:'Hasan Ali al-Najafi — NJF-81455',lat:32.01810,lon:44.29950,
    addr:'3·5·1·0·2·6·4·2·5',who:'Hasan Ali al-Najafi (father: Karim)',died:'1998',
    kaki:'C355 0C22 0102 0000 68B2 33D0',
    nasab:{ism:'حسن',laqab:'أبو صادق',ab:'علي',jadd:'كريم',fam:'النجفي',clan:'آل نجم'}},
   {name:'Hasan Ali al-Najafi — NJF-81456',lat:32.01822,lon:44.29962,
    addr:'3·5·1·0·2·6·4·2·6',who:'Hasan Ali al-Najafi (father: Mahdi)',died:'2014',
    kaki:'E4C1 0C22 0102 0000 68B3 90BE',
    nasab:{ism:'حسن',laqab:'أبو زينب',ab:'علي',jadd:'مهدي',fam:'النجفي',clan:'آل فتلة'}},
   {name:'Wadi al-Salam gate 3',lat:32.0093,lon:44.3031,addr:'3·0·—'},
   {name:'Imam Ali shrine',lat:31.9961,lon:44.3142,addr:'anchor'}];
  addPlots();});
function addPlots(){
  plots.forEach(function(p,i){

var _harv=false;
function harvestKudurru(){
 if(_harv||!YARD)return;_harv=true;
 stat.textContent='harvesting kudurru from OSM…';
 var minLa=90,maxLa=-90,minLo=180,maxLo=-180;
 for(var i=0;i<YARD.length;i++){var ll=xy2ll(YARD[i][0],YARD[i][1]);
  if(ll[0]<minLa)minLa=ll[0];if(ll[0]>maxLa)maxLa=ll[0];
  if(ll[1]<minLo)minLo=ll[1];if(ll[1]>maxLo)maxLo=ll[1];}
 var bb=(minLa-0.002)+','+(minLo-0.002)+','+(maxLa+0.002)+','+(maxLo+0.002);
 var qy='[out:json][timeout:25];('
  +'node["historic"~"tomb|memorial"]('+bb+');'
  +'way["historic"~"tomb|memorial"]('+bb+');'
  +'node["cemetery"="grave"]('+bb+');'
  +'way["cemetery"="grave"]('+bb+');'
  +'way["landuse"="cemetery"]["name"]('+bb+');'
  +');out tags center 400;';
 var EPS=['https://overpass-api.de/api/interpreter',
          'https://overpass.kumi.systems/api/interpreter'];
 function attempt(ei){
  if(ei>=EPS.length){
   _harv=false;   /* refusal is loud, and retry stays possible */
   stat.innerHTML='kudurru harvest REFUSED (Overpass busy on all mirrors) · '
    +'<a href="#" style="color:#38c98b" '
    +'onclick="harvestKudurru();return false;">retry ★</a>';
   return;}
  fetch(EPS[ei]+'?data='+encodeURIComponent(qy))
  .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();})
  .then(function(j){
   var n=0;
   j.elements.forEach(function(el){
    var t=el.tags||{},nm=t['name']||t['name:ar']||t['name:en'];
    if(!nm)return;
    if(/وادي|wadi/i.test(nm))return;
    var la=el.lat||(el.center&&el.center.lat);
    var lo=el.lon||(el.center&&el.center.lon);
    if(!la)return;
    for(var q2=0;q2<kudurru.length;q2++)
     if(em([la,lo],[kudurru[q2].lat,kudurru[q2].lon])<30)return;
    var k={name:nm,lat:la,lon:lo,osm:true};
    kudurru.push(k);regK(k);n++;});
   stat.textContent='kudurru harvested from OSM: '+n
    +(ei?' (mirror)':'');
   if(routeLayer&&lastDest)routeTo(lastDest);})
  .catch(function(){attempt(ei+1);});}
 attempt(0);}
/* ---- VOICE (Web Speech, EN/AR) — directions only; never Qur'an ---- */
var lastSteps=[],lastLls=null,lastDest=null,lastRouteInfo=null,_aud=null;
function fillVoices(){var sel=document.getElementById('vvoice');if(!sel)return;
 var vs=speechSynthesis.getVoices(),o=[];
 vs.forEach(function(v,i){
  if(/^ar/i.test(v.lang))o.unshift('<option value="'+i+'">'+v.name+' · '+v.lang+'</option>');
  else if(/^en/i.test(v.lang))o.push('<option value="'+i+'">'+v.name+' · '+v.lang+'</option>');});
 sel.innerHTML='<option value="off">🔇 voice off</option>'
  +(o.length?o.join(''):
   '<option value="">install an ar/en voice in your OS</option>');}
try{speechSynthesis.onvoiceschanged=fillVoices;}catch(e){}
setTimeout(fillVoices,400);
function voiceSel(){
 var sel=document.getElementById('vvoice');
 if(!sel||sel.value===''||sel.value==='off')
  return{v:null,ar:false,off:true};
 var vs=speechSynthesis.getVoices();
 var v=vs[+sel.value]||null;
 return{v:v,ar:v?/^ar/i.test(v.lang):false,off:!v};}
function tSpeak(txt){try{
 var c=voiceSel();
 var u=new SpeechSynthesisUtterance(txt);
 if(c.v){u.voice=c.v;u.lang=c.v.lang;}
 u.rate=0.75;u.pitch=0.85;      /* slow, deliberate, grave */
 speechSynthesis.speak(u);}catch(e){}}
function retryFoot(){var pr=document.getElementById('prof');
 if(pr)pr.value='walking';
 if(lastDest)routeTo(lastDest);}
var _drone=null;
function droneStop(){if(_drone){cancelAnimationFrame(_drone);_drone=null;}}
function droneFly(){
 if(!lastLls||lastLls.length<2)return;
 droneStop();
 var total=0,segs=[0];
 for(var i=1;i<lastLls.length;i++){total+=em(lastLls[i-1],lastLls[i]);segs.push(total);}
 var t0=performance.now(),SPEED=55;
 function fr(now){
  var d=(now-t0)/1000*SPEED;
  if(d>=total){
   map.setView(lastLls[lastLls.length-1],19,{animate:false});
   _drone=null;
   stat.textContent='rehearsal complete — the way is known before it is walked';
   return;}
  var i=1;while(i<segs.length-1&&segs[i]<d)i++;
  var A=lastLls[i-1],B=lastLls[i];
  var f=(d-segs[i-1])/Math.max(1e-6,segs[i]-segs[i-1]);
  var z=16+3*(d/total);          /* main road wide -> narrow lanes tight */
  map.setView([A[0]+(B[0]-A[0])*f,A[1]+(B[1]-A[1])*f],z,{animate:false});
  _drone=requestAnimationFrame(fr);}
 _drone=requestAnimationFrame(fr);
 stat.innerHTML='drone rehearsal — following the way only (Palāḫu honoured) · '
  +'<a href="#" style="color:#e8b8bd" onclick="droneStop();return false;">■ stop</a>';}
map.getContainer().addEventListener('mousedown',droneStop);
function buildSteps(lls,bs){
 var steps=[],cum=0,lastB=null,legStart=0;
 function brg(A,B){return Math.atan2(
  (B[1]-A[1])*Math.cos((A[0]+B[0])*Math.PI/360),(B[0]-A[0]))*180/Math.PI;}
 for(var i=1;i<lls.length;i++){
  var b=brg(lls[i-1],lls[i]),segL=em(lls[i-1],lls[i]);
  if(lastB!==null){var dv=((b-lastB+540)%360)-180;
   if(Math.abs(dv)>38&&cum-legStart>15){
    steps.push({along:cum,type:'turn',dir:dv>0?'right':'left',
     leg:Math.round(cum-legStart)});
    legStart=cum;}}
  lastB=b;cum+=segL;}
 steps.push({along:cum,type:'arrive',leg:Math.round(cum-legStart)});
 bs.forEach(function(x){
  steps.push({along:x.along,type:'beacon',name:x.K.name,side:x.side});});
 steps.sort(function(a,b){return a.along-b.along;});
 return steps;}
function stopVoice(){
 try{speechSynthesis.cancel();}catch(e){}
 if(_aud)_aud.pause();
 stat.textContent='voice stopped';}
addEventListener('keydown',function(e){
 if(e.key==='Escape'){stopVoice();droneStop();}});
function speakWay(){
 var c=voiceSel();
 if(c.off){stat.textContent=
  'voice is off — choose a voice in the left bar to hear the way';return;}
 speechSynthesis.cancel();
 if(/\+/.test(c.v.name))stat.textContent='note: "'+c.v.name
  +'" is a robotic OS voice — install RHVoice or Piper for natural Arabic';
 var ar=c.ar;
 lastSteps.forEach(function(st){
  if(st.type==='turn')tSpeak(ar
   ?'امشِ '+st.leg+' متراً ثم انعطف إلى '+(st.dir==='right'?'اليمين':'اليسار')
    +' في الطريق التالي.'
   :'Walk '+st.leg+' meters, then turn '+st.dir+' into the next way.');
  else if(st.type==='beacon')tSpeak(ar
   ?st.name+' على '+(st.side==='right'?'يمينك':'يسارك')+'.'
   :st.name+' will be on your '+st.side+'.');
  else tSpeak(ar
   ?'امشِ '+st.leg+' متراً. لقد وصلتم إلى القبر. السلام على أهل الديار.'
   :'Walk '+st.leg+' meters. You have arrived at the grave. '
    +'Peace be upon the people of these abodes.');});}
function playRitual(f){
 if(_aud)_aud.pause();
 _aud=new Audio('audio/'+f);
 _aud.play().catch(function(){
  stat.textContent='place your own recording at audio/'+f
   +' — the synthetic voice never recites Qur\u2019an';});}
var beaconFx=[],_promoted=[];
function routeBeacons(lls){
 beaconFx.forEach(function(b){map.removeLayer(b);});beaconFx=[];
 droneStop();
 try{speechSynthesis.cancel();}catch(e){}
 if(_aud)_aud.pause();
 var out=[];
 for(var i=0;i<kudurru.length;i++){var K=kudurru[i];
  var best=null,cum=0;
  for(var s2=1;s2<lls.length;s2++){
   var A=lls[s2-1],B=lls[s2],segL=em(A,B);
   var mid=(A[0]+B[0])*Math.PI/360;
   var bx=(B[1]-A[1])*Math.cos(mid)*111320,by=(B[0]-A[0])*110540;
   var kx=(K.lon-A[1])*Math.cos(mid)*111320,ky=(K.lat-A[0])*110540;
   var L2=bx*bx+by*by;
   if(L2<1e-6){cum+=segL;continue;}
   var t=Math.max(0,Math.min(1,(kx*bx+ky*by)/L2));
   var d=Math.hypot(kx-t*bx,ky-t*by);
   if(!best||d<best.d){
    best={d:d,along:cum+t*segL,side:(bx*ky-by*kx)>0?'left':'right'};}
   cum+=segL;}
  if(best&&best.d<=220)out.push({K:K,d:best.d,along:best.along,side:best.side});}
 out.sort(function(a,b){return a.along-b.along;});
 for(var j=0;j<out.length;j++){
  beaconFx.push(L.circle([out[j].K.lat,out[j].K.lon],{radius:30,
   color:'#d4af37',weight:2,fill:false,dashArray:'4 4'}).addTo(map));}
 out.forEach(function(x){var K=x.K;
  if(!(K.big||K.m)){try{K.marker.unbindTooltip();
   K.marker.bindTooltip('★ '+K.name,{permanent:true,direction:'top',
    offset:[0,-8],className:'ktip'});}catch(e){}
   _promoted.push(K);}});
 return out;}
/* ---------------- Palahu veil arrival -------------------------------- */
var veil=document.getElementById('veil');
function veilTo(p){
  veil.style.opacity='1';
  setTimeout(function(){
    map.setView([p.lat,p.lon],19,{animate:false});
    setTimeout(function(){
      veil.style.opacity='0';
      var errM=map.distance(map.getCenter(),L.latLng(p.lat,p.lon));
      stat.textContent='Palāḫu arrival — '+p.name+' · error '
        +(errM*100).toFixed(1)+' cm';
      p.marker.openPopup();
      if(auto)useMask();
      requestVerify(p);
    },160);
  },160);}
var q=document.getElementById('q'),res=document.getElementById('results');
q.addEventListener('input',function(){
  var v=q.value.trim().toLowerCase();
  if(!v){res.style.display='none';return;}
  var m=plots.filter(function(p){return p.name.toLowerCase().indexOf(v)>=0;});
  res.innerHTML=m.map(function(p){
    return '<div data-n="'+plots.indexOf(p)+'">'+p.name
      +'<span class="hid">'+(p.died?('d. '+p.died+' · '):'')+p.addr
      +'</span></div>';}).join('')
    ||'<div>no orbit particle answers</div>';
  res.style.display='block';});
document.getElementById('bSeal').onclick=sealGeoJSON;
document.getElementById('bHarv').onclick=harvestKudurru;
document.getElementById('astart').onchange=function(){
 var v=this.value;
 if(v==='gps'&&navigator.geolocation){
  navigator.geolocation.getCurrentPosition(function(pos){
   setAnchor1(pos.coords.latitude,pos.coords.longitude,'My location (GPS)');
   stat.textContent='anchor 1 set: GPS position';},
  function(){stat.textContent='GPS refused — choose another start';});}
 else if(v==='click'){anchorMode=true;
  stat.textContent='click the map to set the family location (anchor 1)';}
 else{var g3=null;
  for(var i=0;i<plots.length;i++)if(/gate/i.test(plots[i].name))g3=plots[i];
  if(g3)setAnchor1(g3.lat,g3.lon,g3.name);}};
res.addEventListener('click',function(e){
  var el=e.target.closest('div[data-n]');if(!el)return;
  res.style.display='none';q.value='';
  veilTo(plots[+el.dataset.n]);});
</script>
