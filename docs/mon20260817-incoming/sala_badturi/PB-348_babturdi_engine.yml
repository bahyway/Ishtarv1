---
# ============================================================
#  PB-348 — BabTurdiEngine (semantic cost-attribution)
#  BahyWay.Ecosystem v4.0 — Law GL-NRG-001-A2
#  Run from the Fedora bare-metal HOST (WoW rule 1)
#
#  ansible-playbook -i inventory PB-348_babturdi_engine.yml
#  Running this playbook is the CSR-08 confirmation point.
# ============================================================
- name: PB-348 BabTurdiEngine scaffold
  hosts: bahyway_host
  gather_facts: false
  vars:
    v4_root: "{{ bahyway_v4_root | default('/home/bahaa/BahyWay.Ecosystem/v4.0') }}"
    crate_dir: "{{ v4_root }}/services/nergal/babturdi-engine"
    tablets_dir: "{{ v4_root }}/tablets"
    tablet_src: "GL-NRG-001-A2_BabTurdiEngine.md"

  tasks:
    - name: Ensure directories
      ansible.builtin.file: {path: "{{ item }}", state: directory, mode: "0755"}
      loop: ["{{ crate_dir }}/src", "{{ crate_dir }}/tests", "{{ tablets_dir }}"]

    - name: Deposit BabTurdiEngine tablet
      ansible.builtin.copy: {src: "{{ tablet_src }}", dest: "{{ tablets_dir }}/{{ tablet_src }}", mode: "0644"}

    - name: Cargo.toml
      ansible.builtin.copy:
        dest: "{{ crate_dir }}/Cargo.toml"
        mode: "0644"
        content: |
          [package]
          name = "babturdi-engine"
          version = "0.1.0"
          edition = "2021"
          description = "Semantic cost-attribution over the Bab Turdi log (GL-NRG-001-A2)"
          license = "LicenseRef-BahyWay-Sovereign"
          [dependencies]

    - name: src/lib.rs
      ansible.builtin.copy:
        dest: "{{ crate_dir }}/src/lib.rs"
        mode: "0644"
        content: |
          //! BabTurdiEngine (GL-NRG-001-A2): cluster a client's REFUSED stream
          //! by meaning, attribute defense cost with tau, gate the reward tier.
          //! NEVER links a Non-Particle to an inner Particle (No-Contamination).
          #![forbid(unsafe_code)]
          use std::collections::BTreeMap;

          /// A refused Record on the SUSA ledger — NO KAKI, by construction.
          #[derive(Clone)]
          pub struct Refused {
              pub client: String,
              pub endpoint: String,
              pub vec: [f64; 4],     // semantic embedding of the refusal reason
              pub on_hot_spot: bool, // did it land on the strained patch?
              pub severity: f64,     // 0 formatting .. 1 malware payload
          }

          /// A cost-attribution result. NOTE: there is NO field for a Particle
          /// identity anywhere in this type — the No-Contamination boundary is
          /// enforced by the type system (L61).
          #[derive(Clone, Debug)]
          pub struct CostSignature {
              pub client: String,
              pub n: usize,
              pub hot_share: f64,        // fraction on the strained spot
              pub malware_share: f64,    // fraction high-severity
              pub cost: f64,             // attributed defense cost
              pub tau: f64,              // uncertainty (never a bare number, L62)
              pub monthly: Vec<f64>,     // per-window costs, NEVER averaged (L64)
          }

          fn cosine(a: &[f64; 4], b: &[f64; 4]) -> f64 {
              let (mut d, mut na, mut nb) = (0.0, 0.0, 0.0);
              for i in 0..4 { d += a[i]*b[i]; na += a[i]*a[i]; nb += b[i]*b[i]; }
              d / (na.sqrt()*nb.sqrt() + 1e-9)
          }

          /// Cost model: each refused record costs base + severity weight +
          /// hot-spot surcharge (defending the strained patch is dearer).
          fn record_cost(r: &Refused) -> f64 {
              1.0 + 2.5*r.severity + if r.on_hot_spot { 1.8 } else { 0.0 }
          }

          /// Attribute cost to ONE client from the outer ledger only.
          pub fn attribute(client: &str, log: &[Refused], windows: usize)
              -> CostSignature {
              let mine: Vec<&Refused> = log.iter().filter(|r| r.client == client).collect();
              let n = mine.len();
              let hot = mine.iter().filter(|r| r.on_hot_spot).count() as f64 / n.max(1) as f64;
              let mal = mine.iter().filter(|r| r.severity > 0.6).count() as f64 / n.max(1) as f64;
              let costs: Vec<f64> = mine.iter().map(|r| record_cost(r)).collect();
              let total: f64 = costs.iter().sum();
              let mean = total / n.max(1) as f64;
              let var = costs.iter().map(|c| (c-mean).powi(2)).sum::<f64>() / n.max(1) as f64;
              let tau = (var / n.max(1) as f64).sqrt();
              // per-window costs (never averaged into one blaming number, L64)
              let mut monthly = vec![0.0; windows];
              for (k, r) in mine.iter().enumerate() { monthly[k % windows] += record_cost(r); }
              CostSignature { client: client.into(), n, hot_share: hot,
                  malware_share: mal, cost: total, tau, monthly }
          }

          /// Reward gate: the low-cost tier is EARNED by measured low cost,
          /// never granted by default. Above the cohort median -> not earned (L63).
          #[derive(PartialEq, Debug)]
          pub enum Reward { LowCostEarned, NotEarned }
          pub fn reward_tier(sig: &CostSignature, cohort_median: f64) -> Reward {
              if sig.cost <= cohort_median { Reward::LowCostEarned }
              else { Reward::NotEarned }
          }

          /// Semantic clustering of a client's stream by meaning (for the WHY).
          pub fn cluster_by_meaning(client: &str, log: &[Refused],
                                    centroids: &[[f64; 4]]) -> Vec<usize> {
              let mut counts = vec![0usize; centroids.len()];
              for r in log.iter().filter(|r| r.client == client) {
                  let mut best = 0; let mut bs = -2.0;
                  for (ci, c) in centroids.iter().enumerate() {
                      let s = cosine(&r.vec, c);
                      if s > bs { bs = s; best = ci; }
                  }
                  counts[best] += 1;
              }
              counts
          }

          pub fn cohort_median(sigs: &[CostSignature]) -> f64 {
              let mut c: Vec<f64> = sigs.iter().map(|s| s.cost).collect();
              c.sort_by(|a,b| a.partial_cmp(b).unwrap());
              if c.is_empty() { 0.0 } else { c[c.len()/2] }
          }

    - name: tests/law_tests.rs
      ansible.builtin.copy:
        dest: "{{ crate_dir }}/tests/law_tests.rs"
        mode: "0644"
        content: |
          use babturdi_engine::*;

          fn rec(client: &str, hot: bool, sev: f64) -> Refused {
              Refused { client: client.into(), endpoint: "edge-najaf".into(),
                  vec: [0.9,0.1,0.1,0.2], on_hot_spot: hot, severity: sev }
          }
          fn log() -> Vec<Refused> {
              let mut v = Vec::new();
              // Client-B: heavy, hot-spot, malware
              for _ in 0..40 { v.push(rec("clientB", true, 0.9)); }
              // Client-A: light, cold, formatting-only
              for _ in 0..10 { v.push(rec("clientA", false, 0.1)); }
              v
          }

          #[test]
          fn l61_no_particle_identity_in_cost_output() {
              // The CostSignature type has NO field for a Particle KAKI.
              // This test documents the type-enforced No-Contamination boundary:
              // a cost signature is buildable ONLY from outer-ledger data.
              let sig = attribute("clientB", &log(), 3);
              // exercise all fields — none is or contains an inner identity
              let _ = (&sig.client, sig.n, sig.hot_share, sig.malware_share,
                       sig.cost, sig.tau, &sig.monthly);
              assert_eq!(sig.client, "clientB");
              // the boundary holds structurally; nothing here can name a Particle
          }

          #[test]
          fn l62_cost_carries_tau_never_bare() {
              let sig = attribute("clientB", &log(), 3);
              assert!(sig.tau >= 0.0);
              assert!(sig.cost > 0.0);
              // hot + malware share must reflect Client-B's heavy stream
              assert!(sig.hot_share > 0.9 && sig.malware_share > 0.9);
          }

          #[test]
          fn l63_above_median_does_not_earn_low_cost_tier() {
              let b = attribute("clientB", &log(), 3);
              let a = attribute("clientA", &log(), 3);
              let median = cohort_median(&[a.clone(), b.clone()]);
              // Client-B (heavy) must NOT earn the low-cost tier; A may.
              assert_eq!(reward_tier(&b, median), Reward::NotEarned,
                  "a costly client wrongly earned the low-cost reward");
              assert_eq!(reward_tier(&a, median), Reward::LowCostEarned);
              // the lever: if B sends cleaner data, its cost falls
              let clean: Vec<Refused> = (0..40).map(|_| rec("clientB", false, 0.1)).collect();
              let b2 = attribute("clientB", &clean, 3);
              assert!(b2.cost < b.cost, "cleaner data must lower the cost basis");
          }

          #[test]
          fn l64_quiet_and_siege_windows_never_averaged() {
              let sig = attribute("clientB", &log(), 3);
              assert_eq!(sig.monthly.len(), 3, "per-window costs must be preserved");
              // the distribution is kept; there is no single averaged number
              let spread = sig.monthly.iter().cloned().fold(0.0_f64, f64::max)
                         - sig.monthly.iter().cloned().fold(f64::MAX, f64::min);
              assert!(spread >= 0.0, "windows must be individually inspectable");
          }

    - name: cargo build
      ansible.builtin.command: {cmd: cargo build --release, chdir: "{{ crate_dir }}"}
      register: build
      changed_when: false
    - name: cargo test (law tests L61–L64)
      ansible.builtin.command: {cmd: cargo test --release, chdir: "{{ crate_dir }}"}
      register: test
      changed_when: false
    - name: Report
      ansible.builtin.debug:
        msg: ["PB-348 complete — babturdi-engine at {{ crate_dir }}", "{{ test.stdout_lines[-3:] }}"]
