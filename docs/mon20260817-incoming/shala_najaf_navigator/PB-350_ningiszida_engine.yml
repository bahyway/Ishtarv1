---
# ============================================================
#  PB-350 — Ninĝišzida Engine (sovereign offline navigation)
#  BahyWay.Ecosystem v4.0 — Law GL-NAV-001
#  Run FROM the Fedora bare-metal HOST.
#
#  ansible-playbook -i inventory PB-350_ningiszida_engine.yml
#  Running this playbook is the CSR-08 confirmation point.
# ============================================================
- name: PB-350 Ningiszida Engine scaffold
  hosts: bahyway_host
  gather_facts: false
  vars:
    v4_root: "{{ bahyway_v4_root | default('/home/bahaa/BahyWay.Ecosystem/v4.0') }}"
    crate_dir: "{{ v4_root }}/services/nav/ningiszida"
    tiles_dir: "{{ v4_root }}/nuzi/najaf-tiles"
    tablets_dir: "{{ v4_root }}/tablets"
    tablet_src: "GL-NAV-001_Ningiszida_Engine.md"
  tasks:
    - name: Ensure directories
      ansible.builtin.file: {path: "{{ item }}", state: directory, mode: "0755"}
      loop: ["{{ crate_dir }}/src", "{{ crate_dir }}/tests", "{{ tiles_dir }}", "{{ tablets_dir }}"]

    - name: Deposit tablet
      ansible.builtin.copy: {src: "{{ tablet_src }}", dest: "{{ tablets_dir }}/{{ tablet_src }}", mode: "0644"}

    - name: Cargo.toml
      ansible.builtin.copy:
        dest: "{{ crate_dir }}/Cargo.toml"
        mode: "0644"
        content: |
          [package]
          name = "ningiszida"
          version = "0.1.0"
          edition = "2021"
          description = "Sovereign offline heptagonal navigation of the narrow roads (GL-NAV-001)"
          license = "LicenseRef-BahyWay-Sovereign"
          [dependencies]

    - name: src/lib.rs
      ansible.builtin.copy:
        dest: "{{ crate_dir }}/src/lib.rs"
        mode: "0644"
        content: |
          //! Ningiszida (GL-NAV-001): offline navigation over a heptagonal
          //! graveyard field. Reads only the daily tile snapshot; routes use
          //! only road cells; every grave is one distinct cell.
          #![forbid(unsafe_code)]

          #[derive(Clone, Copy, PartialEq, Debug)]
          pub enum Cell { Grave(u32), Road, Landmark }

          /// The daily snapshot — the ONLY source read at navigation time.
          pub struct Snapshot { pub date: &'static str, pub cells: Vec<Vec<Cell>> }

          /// L69: navigation reads ONLY the snapshot. This function has no
          /// network access and no argument that could carry a live handle.
          pub fn navigate(snap: &Snapshot, from: (usize,usize), to: (usize,usize))
              -> Option<Vec<(usize,usize)>> {
              // BFS over ROAD cells only (never step through a Grave cell, L70)
              use std::collections::{VecDeque, HashMap};
              let h = snap.cells.len(); let w = snap.cells[0].len();
              let is_walk = |r: usize, c: usize| matches!(snap.cells[r][c], Cell::Road)
                  || (r,c)==from || (r,c)==to;
              let mut q = VecDeque::new(); let mut prev: HashMap<(usize,usize),(usize,usize)> = HashMap::new();
              q.push_back(from); prev.insert(from, from);
              while let Some((r,c)) = q.pop_front() {
                  if (r,c)==to {
                      let mut path = vec![to]; let mut cur = to;
                      while cur != from { cur = prev[&cur]; path.push(cur); }
                      path.reverse(); return Some(path);
                  }
                  let nbrs = [(r.wrapping_sub(1),c),(r+1,c),(r,c.wrapping_sub(1)),(r,c+1)];
                  for (nr,nc) in nbrs {
                      if nr<h && nc<w && !prev.contains_key(&(nr,nc)) && is_walk(nr,nc) {
                          prev.insert((nr,nc),(r,c)); q.push_back((nr,nc));
                      }
                  }
              }
              None
          }

          /// L70 check: a route must never stand on a Grave cell (except endpoints).
          pub fn route_avoids_graves(snap: &Snapshot, route: &[(usize,usize)]) -> bool {
              if route.len() < 2 { return true; }
              route[1..route.len()-1].iter().all(|&(r,c)| snap.cells[r][c] == Cell::Road)
          }

          /// L71: every grave id appears in exactly one cell.
          pub fn each_grave_one_cell(snap: &Snapshot) -> bool {
              use std::collections::HashMap;
              let mut seen: HashMap<u32, usize> = HashMap::new();
              for row in &snap.cells { for cell in row {
                  if let Cell::Grave(id) = cell { *seen.entry(*id).or_default() += 1; }
              }}
              seen.values().all(|&n| n == 1)
          }

    - name: tests/law_tests.rs
      ansible.builtin.copy:
        dest: "{{ crate_dir }}/tests/law_tests.rs"
        mode: "0644"
        content: |
          use ningiszida::*;
          fn snap() -> Snapshot {
              // 5x5: two grave blocks separated by a road cross
              let g = Cell::Grave; let R = Cell::Road;
              Snapshot { date: "2026-08-18", cells: vec![
                vec![g(1), g(2), R,   g(3), g(4)],
                vec![g(5), g(6), R,   g(7), g(8)],
                vec![R,    R,    R,   R,    R   ],
                vec![g(9), g(10),R,   g(11),g(12)],
                vec![g(13),g(14),R,   g(15),g(16)],
              ]}
          }
          #[test]
          fn l70_route_uses_only_road_cells() {
              let s = snap();
              let route = navigate(&s, (0,2), (4,2)).expect("route exists on the road");
              assert!(route_avoids_graves(&s, &route), "route stepped through a grave");
          }
          #[test]
          fn l71_each_grave_is_one_cell() {
              assert!(each_grave_one_cell(&snap()), "a grave appeared in two cells");
          }
          #[test]
          fn l70b_no_route_through_solid_graves() {
              // from inside a block with no road-adjacency to a far block:
              // endpoints allowed, but interior must be road — here reachable via the cross
              let s = snap();
              let r = navigate(&s, (0,0), (4,4));
              assert!(r.is_some(), "should reach via roads");
              assert!(route_avoids_graves(&s, &r.unwrap()));
          }
          #[test]
          fn l69_navigate_signature_is_offline() {
              // The navigate() signature takes only &Snapshot — no socket, no URL,
              // no live handle. Offline-by-construction (documented invariant).
              let s = snap();
              let _ = navigate(&s, (2,0), (2,4));
              assert_eq!(s.date, "2026-08-18");
          }

    - name: cargo build
      ansible.builtin.command: {cmd: cargo build --release, chdir: "{{ crate_dir }}"}
      changed_when: false
    - name: cargo test (L69-L72)
      ansible.builtin.command: {cmd: cargo test --release, chdir: "{{ crate_dir }}"}
      register: test
      changed_when: false
    - name: Report
      ansible.builtin.debug:
        msg: ["PB-350 complete — ningiszida at {{ crate_dir }}", "daily tile store: {{ tiles_dir }}", "{{ test.stdout_lines[-3:] }}"]

    - name: Note on the daily snapshot (offline discipline)
      ansible.builtin.debug:
        msg: >
          Tile ingest is a SEPARATE once-daily job (drone/satellite or Google Earth imagery),
          landing tiles in {{ tiles_dir }} via the Birth Gate. Navigation reads only this
          directory — no live service at use time (L69). Lilu F4 compiles the cinematic scene
          (birdfly / land / focus) against this snapshot.
