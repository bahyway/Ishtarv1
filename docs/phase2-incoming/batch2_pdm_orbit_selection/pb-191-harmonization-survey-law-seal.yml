---
# ============================================================================
# PB-191 — Harmonization Survey & Shape Unification Law: Concept Seal
#          (GL-MDM-001)
# BahyWay.Ecosystem v4.0 — BeeMDM · CompareEngine · NabuEngine SSE
# ----------------------------------------------------------------------------
# PURPOSE:
#   Seals GL-MDM-001, the governance instrument of BeeMDM: the
#   similarity survey across multiple tribes (departments), multiple
#   houses (all seven EnkiDB types), and multiple BIGRINGs, by which
#   divergent data shapes are DISCOVERED, clustered, unified into
#   canonical Templates, and ENFORCED per DAMA-DMBOK discipline.
#   Elevates the semantic tier (SSE + Jaccard) from search
#   convenience to governance mandate — divergence is the disease;
#   only a fuzzy instrument can diagnose it.
#   CONCEPT DOCUMENT ONLY — implementation queued behind PB-160.
#
# GUARDED BOUNDARY:
#   The survey compares SHAPES, never client values (GL-TPL-001
#   Clause 4 abstraction discipline governs all cross-tenant work).
#   Discovery proposes; the steward decrees; engines execute.
#
# SOVEREIGNTY:
#   - Run by the Architect (DUB.SAR 𒁾) from host → eriduous-vdi (CSR-08).
#
# TARGET: eriduous-vdi (192.168.122.214) — sovereign law catalog node
# ============================================================================

- name: "PB-191 | Seal Harmonization Survey & Shape Unification Law (GL-MDM-001)"
  hosts: eriduous_vdi
  become: false
  vars:
    bahyway_docs_root: "{{ ansible_env.HOME }}/bahyway/docs/beemdm"
    doc_id: "GL-MDM-001"
    doc_file: "{{ bahyway_docs_root }}/GL-MDM-001-harmonization-survey.md"
    catalog_file: "{{ ansible_env.HOME }}/bahyway/docs/catalog/CAT-001-index.md"

  tasks:

    - name: "Ensure BeeMDM documentation directory exists"
      ansible.builtin.file:
        path: "{{ bahyway_docs_root }}"
        state: directory
        mode: "0755"

    - name: "Deploy GL-MDM-001 — Harmonization Survey & Shape Unification Law"
      ansible.builtin.copy:
        dest: "{{ doc_file }}"
        mode: "0644"
        content: |
          # GL-MDM-001 — Harmonization Survey & Shape Unification Law
          **Status:** SEALED (concept). Implementation queued behind PB-160.
          **Owners:** BeeMDM (governance loop); CompareEngine
          (structural Jaccard, MinHash, LSH); NabuEngine SSE
          (semantic witness, candle embeddings, offline);
          DataStructure Station (shape inference & validation);
          MADANU court (decrees); Shakkanakku (sealed reports).

          ## Clause 1 — Survey Scope
          The harmonization survey runs CROSS-CUTTING: across
          multiple tribes (client departments), multiple houses
          (all seven EnkiDB types, WRITE and READ), and multiple
          BIGRINGs (per client, per house). Its object is the
          SHAPE — the Template inferred by the DataStructure
          Station per department's data — never the record.
          GL-TPL-001 Clause 4 abstraction governs absolutely:
          shapes may be compared across tenants; values may not.

          ## Clause 2 — The Two-Witness Shape Verdict
          Same-entity candidacy requires two independent
          witnesses (the ecosystem's standing verdict pattern,
          third application):
            (a) STRUCTURAL — Jaccard over shape shingles
                (normalized field paths, type pairs, nesting
                signatures), computed as MinHash signatures with
                LSH banding so the survey scales across every
                BIGRING at once;
            (b) SEMANTIC — NabuEngine embedding proximity of
                field names and shape descriptions, bridging
                languages and naming cultures (KLANT_NAAM ~
                customer_name), fully offline via candle.
          Both high  -> same-entity cluster, confident.
          Disagree   -> steward review in the MADANU court.
          Both low   -> genuinely distinct entities; left alone.
          Thresholds are EAV attributes, tunable per domain.

          ## Clause 3 — Canonical Minting
          A confirmed cluster enters the GL-TPL-001 minting rite.
          The steward names and approves the CANONICAL SHAPE
          Template — the unified shape DMBOK's Reference & Master
          Data discipline demands — with each department's
          divergent shape linked to it by CrossTribe-KAKI mapping
          particles (field-level correspondence, versioned,
          sealed). The canonical is a full KAKI particle in
          EnkiMDB · 7006, HeptaScript-queryable like all law.

          ## Clause 4 — Enforcement Is the Contract
          From approval forward, the canonical IS the contract:
          - The DataStructure Station validates every future
            ingest against it; conformance passes silently.
          - Divergence coalesces into a ticket (GL-TKT-001,
            one cause one ticket) and the steward decrees the
            mapping or the REWORK in MADANU (GL-DST-003 —
            appended, reasoned, sealed).
          - DMBOK-derived unification policies live as rules in
            AkkadiRulesEngine; enforcement is policy execution,
            not persuasion.

          ## Clause 5 — Drift Watch
          The survey recurs on schedule (Shakkanakku-governed).
          Each department carries a DIVERGENCE METRIC — distance
          of its live shapes from canonical — trended over time
          and inscribed into Shakkanakku's Ed25519-sealed
          stakeholder reports. Unification ceases to be a meeting
          argument and becomes a signed number falling to zero.

          ## Clause 6 — DMBOK Alignment
          This loop executes, as one instrument, the DAMA-DMBOK
          knowledge areas of Data Governance, Data Architecture,
          Reference & Master Data, Metadata, and Data Quality.
          The claim for the whitepaper: shape discovery,
          canonicalization, enforcement, and drift audit in a
          single sovereign pipeline, cryptographically sealed at
          every step.

          ## Clause 7 — Candidate Algebraic Ground (pending)
          The Puhu Law (PH-002, nucleus exchange invariance in
          TOP Algebra) is proposed — NOT yet sealed — as the
          formal ground of same-entity identity under exchanged
          representation: four costumes, one customer, as a
          theorem rather than a heuristic. The Architect rules
          whether Puhu bears this weight.

          ## Authority Note
          Inherits all standing law: pattern minting (GL-TPL-001);
          ticket law (GL-TKT-001); append-only decrees
          (GL-DST-003); event ontology (GL-STY-001); Tupsimati
          binding (GL-DST-002); witness scopes (GL-VIZ-002);
          CSR-08; NL-001 orthography; the 1-billion-particles-
          under-1-second law.

          — Inscribed for DUB.SAR 𒁾, BahyWay.Ecosystem v4.0.

    - name: "Compute seal checksum of GL-MDM-001"
      ansible.builtin.stat:
        path: "{{ doc_file }}"
        checksum_algorithm: sha256
      register: gl_mdm_001_stat

    - name: "Append GL-MDM-001 to CAT-001 sovereign catalog index"
      ansible.builtin.lineinfile:
        path: "{{ catalog_file }}"
        line: "| {{ doc_id }} | Harmonization Survey & Shape Unification Law | SEALED-CONCEPT | sha256:{{ gl_mdm_001_stat.stat.checksum }} | PB-191 |"
        create: true
        mode: "0644"

    - name: "Report seal result"
      ansible.builtin.debug:
        msg: >
          PB-191 complete. {{ doc_id }} sealed at {{ doc_file }}
          (sha256 {{ gl_mdm_001_stat.stat.checksum }}).
          The survey crosses every tribe, house, and BIGRING; two
          witnesses verdict the cluster; the steward mints the
          canonical; the canonical is the contract; and divergence
          becomes a signed number falling to zero. Implementation
          remains QUEUED behind PB-160.
