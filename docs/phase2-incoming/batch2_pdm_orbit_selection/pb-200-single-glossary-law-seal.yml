---
# ============================================================================
# PB-200 — Single Glossary Law: Concept Seal (GL-DOC-001)
# BahyWay.Ecosystem v4.0 — documentation · CAT-001 canonical registry
# ----------------------------------------------------------------------------
# PURPOSE:
#   Seals GL-DOC-001, the antidote to naming cognitive-tax. Not a new
#   naming scheme (which would add load) but a single flat GLOSSARY:
#   one line per named thing — name, role, governing law, status — in
#   CAT-001, the one place to look any name up. Names stay SINGLE and
#   STABLE; the version axis is carried by eras (kings) and playbooks
#   (sequence), never bolted onto the name. This law is itself the
#   moratorium working: a discipline that reduces the number of things
#   the Architect must hold in memory, rather than another named engine.
#   CONCEPT DOCUMENT ONLY for its enforcement tooling — the registry
#   discipline applies immediately.
#
# NUMBERING NOTE: PB-200 taken; the bare-metal migration law renumbers
#   to PB-201 and the nightly docs-sedimentation rite to PB-202 on call.
#
# SOVEREIGNTY:
#   - Run by the Architect (DUB.SAR 𒁾) from host → law-catalog node (CSR-08).
#
# TARGET: eriduous-vdi (192.168.122.214) — sovereign law catalog node
# ============================================================================

- name: "PB-200 | Seal Single Glossary Law (GL-DOC-001)"
  hosts: eriduous_vdi
  become: false
  vars:
    bahyway_docs_root: "{{ ansible_env.HOME }}/bahyway/docs/foundational"
    doc_id: "GL-DOC-001"
    doc_file: "{{ bahyway_docs_root }}/GL-DOC-001-single-glossary.md"
    catalog_file: "{{ ansible_env.HOME }}/bahyway/docs/catalog/CAT-001-index.md"
    glossary_file: "{{ ansible_env.HOME }}/bahyway/docs/catalog/CAT-001-glossary.md"

  tasks:

    - name: "Ensure foundational documentation directory exists"
      ansible.builtin.file:
        path: "{{ bahyway_docs_root }}"
        state: directory
        mode: "0755"

    - name: "Deploy GL-DOC-001 — Single Glossary Law"
      ansible.builtin.copy:
        dest: "{{ doc_file }}"
        mode: "0644"
        content: |
          # GL-DOC-001 — Single Glossary Law
          **Status:** SEALED (concept). Registry discipline applies now.
          **Scope:** every named thing in the ecosystem — engines,
          structures, eras, laws, patterns, calculi, agents, artifacts.

          ## The Problem It Solves
          The pantheon grew faster than the code. For a solo Architect,
          every named thing is a lookup cost, and the risk is not
          running out of names but holding too many in memory. The cure
          is NOT a cleverer naming scheme (version-numbered names add a
          second axis and make the load worse) — it is ONE PLACE to
          look any name up.

          ## Clause 1 — One Flat Glossary
          There is a single canonical glossary at
          CAT-001-glossary.md. Every named thing has exactly ONE line:
              <name> → <role> → <governing law/PB> → <status>
          Example:
              Nabu → knowledge-graph engine → GL-NAV-001 → sealed-concept
              EnkiDW → warehouse projection (port 7005) → GL-DDB-001 → sealed-concept
              Shakkanakku → automation/report governor → (report law) → sealed-concept
          One line, four fields, no prose. The glossary is a lookup
          table, not a document to read.

          ## Clause 2 — Names Stay Single and Stable
          A named thing keeps ONE stable name for its whole life.
          Version is NEVER bolted onto the name (no NabuEngine.v3).
          The version axis already exists twice and is reused:
          - ERAS (kings, NL-001) carry release version — "NabuEngine
            as it stands in the Uruinimagina era."
          - PLAYBOOKS (PB-nnn) carry change sequence and lineage.
          Adding a third version axis to the name is forbidden as
          duplicative and load-increasing.

          ## Clause 3 — Register Before First Use
          A named thing is added to the glossary the moment it is
          named — before it appears in prose, a prototype, or code.
          An unregistered name is not yet real. Status field tracks
          its life: proposed → sealed-concept → implemented → retired.
          Retired names keep their line (status: retired); names are
          never reused (mirrors the GX registry rule, PB-195).

          ## Clause 4 — The Ruling Ledger Lives Here Too
          Unratified names (the "ruling ledger") are glossary lines
          with status: proposed. Ratification flips the status; it does
          not create a new line. The ledger and the glossary are the
          same table at different statuses — one place, one lookup.

          ## Clause 5 — The Moratorium Clause
          This law is the naming moratorium made concrete: prefer
          reducing the count of named things to formatting them better.
          No new named engine is registered while an existing one
          remains status: proposed or sealed-concept without progress —
          a name earns its keep by being USED (implemented), not by
          being coined. The glossary makes the backlog visible so the
          Architect can see when naming has outrun building.

          ## Authority Note
          Foundational documentation law. Complements GL-STY-001
          (sedimentation), the GX registry (PB-195), NL-001 (naming
          orthography and eras). CSR-08; the 1-billion-particles law.

          — Inscribed for DUB.SAR 𒁾, BahyWay.Ecosystem v4.0.

    - name: "Found the canonical glossary (idempotent header)"
      ansible.builtin.copy:
        dest: "{{ glossary_file }}"
        mode: "0644"
        force: false
        content: |
          # CAT-001 Glossary — the one place to look any name up (GL-DOC-001)
          # Format: <name> → <role> → <governing law/PB> → <status>
          # status: proposed | sealed-concept | implemented | retired
          # Names are single and stable; version lives in eras (kings) and PBs.

          Enki → graph-RAG database family root → GL-DDB-001 → sealed-concept
          EnkiSDB → source/ingest store (7001) → GL-DDB-001 → sealed-concept
          EnkiODB → object/staging store (7002) → GL-DDB-001 → sealed-concept
          EnkiQDB → query-gate projection (7004) → GL-DDB-001 → sealed-concept
          EnkiDB → trusted GOLDEN store (7004) → GL-DST-003 → sealed-concept
          EnkiDW → warehouse projection (7005) → GL-DDB-001 → sealed-concept
          EnkiMDB → master/arsenal store (7006) → GL-TPL-001 → sealed-concept
          EnkiDDB → documents store (7007) → GL-DDB-001 → sealed-concept
          Marduk → data-mining surface → GL-DST-002/003 → sealed-concept
          Nabu → knowledge-graph engine → GL-NAV-001 → sealed-concept
          Lamassu → persistent-homology / TDA engine → GL-VIZ-002 → sealed-concept
          Ninurta → physics / dynamics engine → GL-PHY-001 → proposed
          Shakkanakku → automation & report governor → (report law) → sealed-concept
          Madanu → court / judgment surface → GL-DST-003 → sealed-concept
          Dayyalu → lawful pattern-reconnaissance method → GL-PAT-001 → proposed
          Haia → document-similarity engine (candidate) → (tbd) → proposed
          Ninshubur → ticket engine (candidate) → GL-TKT-001 → proposed
          Kulla → template engine (candidate) → GL-TPL-001 → proposed
          Gula → healing engine (candidate) → GL-ORG-001 → proposed
          Uruinimagina → release era (documentation-transparency) → NL-001 → proposed
          Girsu → code-workbench structure (VSCodium) → NL-001 → implemented
          # append one line per named thing; never delete, flip status to retired.

    - name: "Append GL-DOC-001 to CAT-001 sovereign catalog index"
      ansible.builtin.lineinfile:
        path: "{{ catalog_file }}"
        line: "| {{ doc_id }} | Single Glossary Law (FOUNDATIONAL-DOC) | SEALED-CONCEPT | see CAT-001-glossary.md | PB-200 |"
        create: true
        mode: "0644"

    - name: "Report seal result"
      ansible.builtin.debug:
        msg: >
          PB-200 complete. GL-DOC-001 sealed; the canonical glossary is
          founded at {{ glossary_file }}. One line per named thing, one
          place to look it up, names single and stable, version carried
          by eras and playbooks. The ruling ledger now lives as
          proposed-status lines. Naming tax addressed by a lookup table,
          not a scheme. Implementation of enforcement tooling QUEUED
          behind PB-160.
