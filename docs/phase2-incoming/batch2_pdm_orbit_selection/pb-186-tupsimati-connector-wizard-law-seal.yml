---
# ============================================================================
# PB-186 — Tupsimati Connector Wizard Law: Concept Seal (GL-DST-002)
# BahyWay.Ecosystem v4.0 — DubSar Theater (Godot 4.7)
# ----------------------------------------------------------------------------
# PURPOSE:
#   Seals GL-DST-002, the law of the Database Connector Wizard on the
#   DubSar Theater stage. The wizard is the Theater surface of
#   ConEngine's sovereign connection law: it binds the stage to any
#   of the fourteen EnkiDB nodes so the Architect / data steward can
#   witness the orbits camped in ANY house of the pipeline — because
#   data mining works on all seven databases, never on EnkiDW alone.
#   Name derives from the sealed Tupsimati configuration panel
#   (Tablet of Destinies — the tablet that decides which world the
#   stage is bound to). CONCEPT DOCUMENT ONLY — implementation
#   queued behind PB-160 per the Governing Law.
#
# GUARDED BOUNDARY:
#   Connecting is witnessing. The wizard binds and reads; it never
#   mutates state. Steward decisions are EMITted as advisory
#   recommendation particles — actual state change happens only in
#   the sovereign Rust engines, per NINSUN/Namtila and CSR-08.
#
# SOVEREIGNTY:
#   - Run by the Architect (DUB.SAR 𒁾) from host → eriduous-vdi (CSR-08).
#
# TARGET: eriduous-vdi (192.168.122.214) — sovereign law catalog node
# ============================================================================

- name: "PB-186 | Seal Tupsimati Connector Wizard Law (GL-DST-002)"
  hosts: eriduous_vdi
  become: false
  vars:
    bahyway_docs_root: "{{ ansible_env.HOME }}/bahyway/docs/theater"
    doc_id: "GL-DST-002"
    doc_file: "{{ bahyway_docs_root }}/GL-DST-002-tupsimati-connector-wizard.md"
    catalog_file: "{{ ansible_env.HOME }}/bahyway/docs/catalog/CAT-001-index.md"

  tasks:

    - name: "Ensure Theater documentation directory exists"
      ansible.builtin.file:
        path: "{{ bahyway_docs_root }}"
        state: directory
        mode: "0755"

    - name: "Deploy GL-DST-002 — Tupsimati Connector Wizard Law"
      ansible.builtin.copy:
        dest: "{{ doc_file }}"
        mode: "0644"
        content: |
          # GL-DST-002 — Tupsimati Connector Wizard Law
          **Status:** SEALED (concept). Implementation queued behind PB-160.
          **Stage:** DubSar Theater (Godot 4.7) — extends the sealed
          Tupsimati configuration panel (GDExtension).
          **Governed by:** ConEngine sovereign connection law.
          **Serves:** GL-VIZ-002 (Orbit Witness & Isolation),
          GL-DST-001 (seven lenses), the data steward workflow.

          ## Clause 1 — Fourteen Doors, One Rite
          The wizard presents all fourteen EnkiDB nodes as bindable
          destinies: seven WRITE nodes (EnkiSDB..EnkiDDB, ports
          7001-7007) and seven READ nodes (ports 7101-7107), as
          deployed in Podman quadlets. Binding is a ConEngine rite:
          HEPT handshake (magic 0x48455054), session sealed as an
          immutable KAKI Connection Event, provenance on every
          byte that crosses. READ is the steward's default; WRITE
          binding requires explicit Architect selection.

          ## Clause 2 — Every House Owns Its Own BIGRING
          Upon binding, the ORBIT 3D lens renders the bound house's
          OWN BIGRING: only the tribe orbits whose particles are
          camped in that database, re-laid as quantized concentric
          shells with sacred void between them. The whole-pipeline
          BIGRING (all houses superposed) is the unbound default.
          Data mining is thereby lawful over EVERY station of the
          Flow Particles Pipeline — never over EnkiDW alone.

          ## Clause 3 — The Census Precedes the Query
          The bound view carries live counters: particles per orbit
          (colour and state) per house, average dwell, and the
          count of particles AWAITING STEWARD DECISION (FUZZY past
          the dwell threshold). Counters are computed by each Enki
          node from its own ENLIL ring indexes and returned over
          HEPT — the Theater witnesses totals, it never counts.
          Every counter is a query launcher: selecting it composes
          the corresponding HeptaScript (WHERE home, WHAT state,
          WHEN dwell > Nd) for the Architect to run.

          ## Clause 4 — The Chronicle Is a Must
          Picking any particle in any bound house retrieves its
          complete pipeline event history from StoryEngine over
          NUZI: genesis, every orbit shift with its KISPU commit,
          dwell at every station, PROVE certificate or death rite.
          The chronicle is the etiology behind the census's
          symptom — it is how the steward answers WHY a particle
          has existed so long in a station.

          ## Clause 5 — Stage, Never Truth; Advise, Never Decide
          The wizard reads and witnesses. Steward judgments made at
          the stage EMIT advisory Recommendation particles
          (NINSUN/Namtila pattern — never blocking, never
          mutating). State transitions execute exclusively in the
          sovereign Rust engines behind HEPT, upon the Architect's
          CSR-08 confirmation. Any Godot-side write to particle
          state is a violation of this law and of GL-DST-001.

          ## Authority Note
          Inherits all standing law: NL-001 orthography; CSR-08
          Architect Sovereignty; the 1-billion-particles-under-
          1-second runtime law; Nisaba's TUPSARRU doctrine.
          Rehearsal twin: Šala MARDUK tab v3 (rehearsal only,
          Way-of-Work rule 5).

          — Inscribed for DUB.SAR 𒁾, BahyWay.Ecosystem v4.0.

    - name: "Compute seal checksum of GL-DST-002"
      ansible.builtin.stat:
        path: "{{ doc_file }}"
        checksum_algorithm: sha256
      register: gl_dst_002_stat

    - name: "Append GL-DST-002 to CAT-001 sovereign catalog index"
      ansible.builtin.lineinfile:
        path: "{{ catalog_file }}"
        line: "| {{ doc_id }} | Tupsimati Connector Wizard Law | SEALED-CONCEPT | sha256:{{ gl_dst_002_stat.stat.checksum }} | PB-186 |"
        create: true
        mode: "0644"

    - name: "Report seal result"
      ansible.builtin.debug:
        msg: >
          PB-186 complete. {{ doc_id }} sealed at {{ doc_file }}
          (sha256 {{ gl_dst_002_stat.stat.checksum }}).
          Fourteen doors, one rite; every house owns its own
          BIGRING; the census precedes the query; the chronicle
          is a must; the stage advises, never decides.
          Implementation remains QUEUED behind PB-160.
