---
# ============================================================================
# PB-196 — Physics Service Law: Concept Seal (GL-PHY-001)
# BahyWay.Ecosystem v4.0 — NinurtaEngine (proposed) · dynamics central
# ----------------------------------------------------------------------------
# PURPOSE:
#   Seals GL-PHY-001: the ecosystem gains a central Physics service —
#   the executor of dynamics standing beside GeoEngine's timeless
#   truth. GeoEngine seals the equations; the Physics service steps
#   them through time: integrators, force generators, constraint
#   solving, trajectory computation, phase-space tooling. It consumes
#   sealed law and NEVER defines its own. Seals the Two-Tier Physics
#   Law (presentation vs truth), the epsilon-source mandate, the
#   scope discipline (computes dynamics, emits states — builds no UI,
#   no extensions), and the shared-kernel clause for both GPU faces.
#   NAMING: NinurtaEngine proposed — god of force directed to purpose,
#   binder of Anzu, and as Ningirsu the lord of Girsu itself —
#   PENDING the Architect's NL-001 ruling.
#   CONCEPT DOCUMENT ONLY — implementation queued behind PB-160.
#
# NUMBERING NOTE: PB-196 taken by this seal; the nightly
#   docs-sedimentation rite renumbers to PB-197 upon the Architect's call.
#
# SOVEREIGNTY:
#   - Run by the Architect (DUB.SAR 𒁾) from host → eriduous-vdi (CSR-08).
#
# TARGET: eriduous-vdi (192.168.122.214) — sovereign law catalog node
# ============================================================================

- name: "PB-196 | Seal Physics Service Law (GL-PHY-001)"
  hosts: eriduous_vdi
  become: false
  vars:
    bahyway_docs_root: "{{ ansible_env.HOME }}/bahyway/docs/physics"
    doc_id: "GL-PHY-001"
    doc_file: "{{ bahyway_docs_root }}/GL-PHY-001-physics-service.md"
    catalog_file: "{{ ansible_env.HOME }}/bahyway/docs/catalog/CAT-001-index.md"

  tasks:

    - name: "Ensure Physics documentation directory exists"
      ansible.builtin.file:
        path: "{{ bahyway_docs_root }}"
        state: directory
        mode: "0755"

    - name: "Deploy GL-PHY-001 — Physics Service Law"
      ansible.builtin.copy:
        dest: "{{ doc_file }}"
        mode: "0644"
        content: |
          # GL-PHY-001 — Physics Service Law
          **Status:** SEALED (concept). Implementation queued behind PB-160.
          **Engine:** NinurtaEngine (proposed — god of force directed
          to purpose; as Ningirsu, lord of Girsu — god-name PENDING
          the Architect's NL-001 ruling).
          **Stands beside:** GeoEngine (KG-000 nucleus). GeoEngine is
          timeless truth; the Physics service is truth IN MOTION.

          ## Clause 1 — Charter and Boundary
          The Physics service is the ecosystem's single executor of
          dynamics: numerical integration, force generators (gravity
          to a nucleus, springs, drag, damping, orbital correction),
          constraint solving (rods, cables, lattices), trajectory
          computation, and phase-space tooling. It CONSUMES equations
          sealed by GeoEngine and certified at Gate G4; it NEVER
          defines physical law of its own. One place where time steps
          forward correctly — so Enbilulu, Girra, Igigi, the GL-ORG-001
          twins, and NabuEngine's citation gravity stop reimplementing
          integrators separately.

          ## Clause 2 — The Two-Tier Physics Law
          (a) PRESENTATION PHYSICS — stage-side, GPU, cosmetic, free
              to approximate because it asserts nothing: bounce and
              flight easing, the MADANU bench's calm lattice, spring
              auto-layout of the Shape Operator canvas (wires as
              springs), ETL flow animation. Game-grade integrators
              (semi-implicit Euler, Verlet) are lawful here.
          (b) TRUTH PHYSICS — engine-side, certificate-bearing: twin
              trajectories, GOLDEN-basin re-entry tests, domain defect
              propagation. Certificate-grade integrators ONLY:
              adaptive step with computed error estimates.
          The tiers never mix: stage integrators may not sign
          certificates; certificate integrators are not spent on
          decoration. Every emission is tagged with its tier.

          ## Clause 3 — The Epsilon Source Mandate
          GL-ORG-001's Humility Clause requires epsilon to be a
          NUMBER, not a mood. The truth tier's adaptive integrators
          are the ecosystem's epsilon source: every trajectory
          certificate carries its computed local/global error bound,
          feeding the twin-license machinery directly. A trajectory
          without an error bound is presentation, whatever it claims.

          ## Clause 4 — Scope Discipline
          The Physics service computes dynamics and EMITS STATES.
          It builds no UI, no banners, no Theater extensions — those
          belong to ShoWEngine, the Theater surfaces, and the Girsu
          GX registry, which CONSUME its outputs: force fields for
          layout extensions, flow states for ETL animation, phase-
          space trajectories for the GL-ORG-001 visualization
          mandate, spring states for the steward's bench. An engine
          that also builds UI is two engines wearing one name.

          ## Clause 5 — Shared Kernels, Two Faces
          Force and integration kernels are authored once (GLSL/WGSL
          compute) and consumed by both lawful faces — Godot
          RenderingDevice on bare-metal Fedora and the egui/WGPU
          sovereign side — the same one-core-two-faces law that
          governs pdm-graph-core and the Buzu bivector.

          ## Clause 6 — Curriculum Note (the Architect's study path)
          Millington, Game Physics Engine Development (2nd ed.):
          the particle/mass-aggregate half (forces, integrators,
          springs, rods, cables) is the presentation tier's complete
          curriculum and ports cleanly to Rust; the rigid-body half
          is education, not implementation. Its game-grade numerics
          are LAWFUL ONLY in tier (a) — the truth tier is built from
          the same vocabulary with error-controlled integration.
          Pairs with the Vulkan cookbook: what to compute, and how
          to compute a million of them per frame.

          ## Authority Note
          Inherits all standing law: GeoEngine single-truth (KG-000);
          stage-never-truth (GL-DST-001); GL-ORG-001 twins and
          epsilon; GL-VIZ-002 witness scopes; Z3 design-time only;
          CSR-08; NL-001 orthography; the 1-billion-particles-under-
          1-second law.

          — Inscribed for DUB.SAR 𒁾, BahyWay.Ecosystem v4.0.

    - name: "Compute seal checksum of GL-PHY-001"
      ansible.builtin.stat:
        path: "{{ doc_file }}"
        checksum_algorithm: sha256
      register: gl_phy_001_stat

    - name: "Append GL-PHY-001 to CAT-001 sovereign catalog index"
      ansible.builtin.lineinfile:
        path: "{{ catalog_file }}"
        line: "| {{ doc_id }} | Physics Service Law | SEALED-CONCEPT | sha256:{{ gl_phy_001_stat.stat.checksum }} | PB-196 |"
        create: true
        mode: "0644"

    - name: "Report seal result"
      ansible.builtin.debug:
        msg: >
          PB-196 complete. {{ doc_id }} sealed at {{ doc_file }}
          (sha256 {{ gl_phy_001_stat.stat.checksum }}).
          GeoEngine holds what is true; the Physics service moves it
          through time; presentation decorates, truth certifies, and
          epsilon is a number. NinurtaEngine awaits the Architect's
          ruling. Implementation remains QUEUED behind PB-160.
