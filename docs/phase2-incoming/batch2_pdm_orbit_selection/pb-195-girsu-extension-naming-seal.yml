---
# ============================================================================
# PB-195 — NL-001 Amendment: Girsu Extension Naming Clause + GX Registry
# BahyWay.Ecosystem v4.0 — Girsu VSCodium workbench
# ----------------------------------------------------------------------------
# PURPOSE:
#   Seals the Architect's ratified naming pattern for Girsu extensions:
#   NAMES FOR BEINGS, NUMBERS FOR THE REGISTRY. Display names are
#   unbroken CamelCase per the NL-001 Orthography Clause, patterned
#   Girsu + ServedComponent + Function (e.g. GirsuEnkiDBConnector);
#   technical package ids follow platform kebab-case (the same
#   accommodation the Rust crates make); sequence lives ONLY in the
#   GX-nnn registry lines of CAT-001, never in the name. Serial
#   suffixes (Ext01, Ext02) and underscores are unlawful.
#   Founds the GX registry retroactively with the three extensions
#   already shipped in the Girsu wardrobe.
#
# NUMBERING NOTE: PB-195 taken by this seal; the nightly
#   docs-sedimentation rite renumbers to PB-196 upon the Architect's call.
#
# SOVEREIGNTY:
#   - Run by the Architect (DUB.SAR 𒁾) from host → eriduous-vdi (CSR-08).
#
# TARGET: eriduous-vdi (192.168.122.214) — sovereign law catalog node
# ============================================================================

- name: "PB-195 | Seal Girsu extension naming clause + found GX registry"
  hosts: eriduous_vdi
  become: false
  vars:
    nl_doc: "{{ ansible_env.HOME }}/bahyway/docs/naming/NL-001-release-codename-law.md"
    catalog_file: "{{ ansible_env.HOME }}/bahyway/docs/catalog/CAT-001-index.md"

  tasks:

    - name: "PB-195.1 | Append the Girsu Extension Clause to NL-001"
      ansible.builtin.blockinfile:
        path: "{{ nl_doc }}"
        create: true
        mode: "0644"
        marker: "<!-- {mark} PB-195 GIRSU EXTENSION CLAUSE -->"
        block: |
          ## Girsu Extension Clause (sealed by the Architect, PB-195)
          1. NAMES FOR BEINGS, NUMBERS FOR RITES. Girsu extensions are
             components, not playbooks: they carry NAMES. Sequence
             lives only in the GX registry, never in the name.
          2. Display-name pattern: Girsu + ServedComponent + Function,
             one unbroken CamelCase word per the Orthography Clause —
             e.g. GirsuEnkiDBConnector, GirsuHeptaScriptLinter,
             GirsuKakiInspector. No underscores, no hyphens, no
             serial suffixes (Ext01-class names are unlawful).
          3. Technical id: the package.json identifier follows the
             VSCodium platform's lowercase kebab-case (e.g.
             girsu-enkidb-connector) — the same lawful accommodation
             the Rust crates make to their toolchain. Display name
             obeys NL-001; technical id obeys the platform.
          4. Registry: every extension registers a GX-nnn line in
             CAT-001 (name · technical id · status · sha256 of the
             .vsix). Retirement flips status; the number is never
             reused. Ordering, lineage, and audit live here.

    - name: "PB-195.2 | Found the GX registry with the existing wardrobe"
      ansible.builtin.blockinfile:
        path: "{{ catalog_file }}"
        create: true
        mode: "0644"
        marker: "<!-- {mark} PB-195 GX REGISTRY -->"
        block: |
          ## GX — Girsu Extension Registry (founded PB-195)
          | GX | Display name | Technical id | Status |
          |----|--------------|--------------|--------|
          | GX-001 | Apsu theme (pre-clause name stands; rename to GirsuApsuTheme at next release, Architect's option) | apsu-theme | SHIPPED |
          | GX-002 | Markasu theme (as above → GirsuMarkasuTheme) | markasu-theme | SHIPPED |
          | GX-003 | BahyWay Elements icon theme (as above → GirsuBahyWayElements) | bahyway-elements | SHIPPED |
          | GX-004+ | reserved — all future extensions register here before first install | — | — |

    - name: "PB-195.3 | Report"
      ansible.builtin.debug:
        msg: >
          PB-195 complete. The Girsu Extension Clause is law: names for
          beings, GX numbers for the registry, display names unbroken,
          technical ids platform-lawful, and the wardrobe's three
          shipped extensions stand registered as GX-001..003. Serial
          suffixes are unlawful from this seal forward.
