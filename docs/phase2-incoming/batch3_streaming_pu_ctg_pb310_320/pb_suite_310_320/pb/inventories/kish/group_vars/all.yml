# ── URUK stream variables — REVIEW EVERY VALUE BEFORE FIRST RUN ──
bahyway_stream: kish
bahyway_root: /var/lib/bahyway
kaki_runs: /var/lib/bahyway/kaki/pb_runs.jsonl
enkidb_ports: { sdb: 7001, odb: 7002, qdb: 7003, db: 7004, dw: 7005, mdb: 7006, ddb: 7007 }
ledger_dir: /var/lib/enkidb/ledger          # on write node, XFS on raw LV
ledger_lv: /dev/bahyvg/enkidb_ledger
projections_dir: /var/lib/enkidb/projections # on read node, expendable
ship_user: lahamu
ship_target_host: vault-lib                  # later: kish box
ship_target_dir: /vault/hot/ledger_segments
watermark_file: /var/lib/enkidb/ledger/WATERMARK
vault_pool: nuzivault
vault_datasets: [enkisdb, enkiodb, enkiqdb, enkidb, enkidw, enkimdb, enkiddb, forge, assets]
vault_mount: /nuzivault
nas_disks: [/dev/sda, /dev/sdb, /dev/sdc, /dev/sdd, /dev/sde, /dev/sdf, /dev/sdg]  # VERIFY!
signing_key: /root/.bahyway/keys/zagesi_ed25519   # keep an off-box copy of this key
forge_subvol: /home/bfadam/Forge
vm_images_dir: /var/lib/libvirt/images
host_vg: bahyvg
host_pv: /dev/nvme0n1p5                      # VERIFY partition before running PB-319!
retention_days: { ledger: 90, dw: 30, staging: 7, quarantine_open: 999999 }
smoke_cmd: "/usr/local/bin/bahyway-smoke --stream {{ bahyway_stream }}"
pinned_manifest: /vault/manifests/zagesi_current.json   # KISH builds ONLY from a signed manifest
