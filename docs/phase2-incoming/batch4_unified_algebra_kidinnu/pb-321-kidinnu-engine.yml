- name: "PB-321 · kidinnu-engine — Civil Protection Calculus (DRAFT)"
  hosts: dubsar_workstation
  vars:
    crate_dir: "/home/bahaa/bahyway/crates/kidinnu-engine"
    crate_name: "kidinnu-engine"
  tasks:

