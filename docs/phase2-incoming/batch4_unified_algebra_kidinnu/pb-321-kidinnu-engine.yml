        mode: "0644"
        content: |
          [package]
          name = "kidinnu-engine"       # PROPOSED name — NL-001, Architect grants
          version = "0.1.0-draft"
          edition = "2021"
          description = "Civil Protection Calculus (GL-ALG-001-A2): minimax refuge directives, capacity-honest, epsilon-floored, Ed25519-sealed, offline-first."
          license = "UNLICENSED"

