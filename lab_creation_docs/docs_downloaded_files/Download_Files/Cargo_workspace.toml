# RustLab - BahyWay Ecosystem Workspace
# Monorepo for all BahyWay Rust applications

[workspace]
resolver = "2"

members = [
    "bdbway_extension",        # Core: BDBWay v1.0 PostgreSQL extension
    "akkadian_dsl",            # Core: Akkadian v3.4 query language
    "ontoway",                 # App: Knowledge Graph Editor
    "tribeway",                # App: Tribal Visualization & Validation
    "najafway",                # App: Cemetery Management & Stress Testing
    "particlesway",            # App: Sovereign Gem Activation
    "fuzzy_engine",            # Library: Fuzzy Logic Rules Engine
    "score_engine",            # Library: Quality Scoring Engine
    "shared",                  # Library: Shared types and utilities
]

# Workspace-wide dependencies
[workspace.dependencies]
# Database
tokio-postgres = { version = "0.7", features = ["with-uuid-1", "with-serde_json-1"] }
sqlx = { version = "0.7", features = ["postgres", "runtime-tokio-native-tls", "uuid", "json"] }
deadpool-postgres = "0.12"

# Async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

# Web framework (for APIs)
axum = { version = "0.7", features = ["macros", "ws"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# GraphQL (for OntoWay)
async-graphql = { version = "7", features = ["uuid", "chrono"] }
async-graphql-axum = "7"

# 3D Graphics (for visualization)
wgpu = "0.18"
winit = "0.29"

# Fuzzy logic
fuzzy-logic = "0.3"

# Graph algorithms
petgraph = "0.6"

# Error handling
thiserror = "1"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Testing
criterion = "0.5"

# PGRX for PostgreSQL extensions
pgrx = "0.11"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
debug = true
