version: '3.8'

services:
  # Rust development container for Four Pillars
  fourpillars-dev:
    image: rust:latest
    container_name: bahyway_fourpillars
    working_dir: /workspace/bahyway-fourpillarsway
    volumes:
      # Mount your Windows folder to the container
      - C:/BahyWay/bahyway-fourpillarsway:/workspace/bahyway-fourpillarsway
      # Cache cargo registry and git
      - cargo-registry:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
    command: bash -c "tail -f /dev/null"
    stdin_open: true
    tty: true
    networks:
      - bahyway-network

  # PostgreSQL for BDBWay (if you need it)
  postgres:
    image: postgres:16
    container_name: bdbway_postgres_fourpillars
    environment:
      POSTGRES_USER: akkad
      POSTGRES_PASSWORD: sovereign
      POSTGRES_DB: bdbway
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - bahyway-network

volumes:
  cargo-registry:
  cargo-git:
  postgres-data:

networks:
  bahyway-network:
    driver: bridge
