# ── Shala launcher: Gilgamesh Master Key ────────────────────────────────
# Runs playbook_285 with -e tool=gilgamesh via Shala2 -- the Architect Key
# ceremony tool -- instead of typing the ansible-playbook command by hand.
#
# USE FROM SHALA: sign in with an Architect passport, go to Shala2, type
# "launchers/launch_gilgamesh_master_key.toml" into the config field,
# click Load, then Run.

[run]
playbook_dir = "playbooks"
playbooks = ["playbook_285_launch_sargon_or_gilgamesh_key_tool.yml"]
inventory = "ansible/inventory.ini"
simulate = false
fix_dir = "fixes"
report_dir = "docs/SHEDU/anu_governor_reports"
chronicle_dir = "docs/SHEDU/anu_governor_chronicle"
seal_key = "secrets/anu_governor_seal.key"

[[parameters]]
key = "tool"
value = "gilgamesh"
