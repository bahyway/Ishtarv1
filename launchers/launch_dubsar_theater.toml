# ── Shala launcher: DubSar Theater ──────────────────────────────────────
# Runs playbook_226_launch_dubsar_godot_ide.yml (run mode: login screen
# directly, no editor chrome) via Shala2 (AnuGovernor's corpus runner),
# instead of typing the ansible-playbook command by hand.
#
# USE FROM SHALA: sign in with an Architect passport, go to Shala2, type
# "launchers/launch_dubsar_theater.toml" into the config field, click
# Load, then Run.

[run]
playbook_dir = "playbooks"
playbooks = ["playbook_226_launch_dubsar_godot_ide.yml"]
inventory = "ansible/inventory.ini"
simulate = false
fix_dir = "fixes"
report_dir = "docs/SHEDU/anu_governor_reports"
chronicle_dir = "docs/SHEDU/anu_governor_chronicle"
seal_key = "secrets/anu_governor_seal.key"
