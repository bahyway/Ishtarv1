# ── Shala launcher: Sargon Passport Manager ─────────────────────────────
# Runs playbook_285 with -e tool=sargon via Shala2, instead of typing the
# ansible-playbook command by hand.
#
# USE FROM SHALA: sign in with an Architect passport, go to Shala2, type
# "launchers/launch_sargon_passport_manager.toml" into the config field,
# click Load, then Run.

[run]
playbook_dir = "playbooks"
playbooks = ["playbook_285_launch_sargon_or_gilgamesh_key_tool.yml"]
inventory = "ansible/inventory.ini"
simulate = false
fix_dir = "fixes"
report_dir = "docs/SHEDU/shakkanakku_reports"
chronicle_dir = "docs/SHEDU/shakkanakku_chronicle"
seal_key = "secrets/shakkanakku_seal.key"

[[parameters]]
key = "tool"
value = "sargon"
