[package]
name = "dubsar-kernel"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "DubSar IDE: Rust Jupyter kernel with Vulkan compute for 7D particle simulation"

[[bin]]
name = "dubsar-kernel"
path = "src/main.rs"

[dependencies]
# Workspace deps
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# Jupyter ZMQ protocol
zeromq = "0.4"
bytes = "1"
uuid = { version = "1", features = ["v4"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }

# Vulkan (Ash – official low-level Rust bindings)
ash = { version = "0.38", features = ["linked"] }
gpu-allocator = "0.27"

# wgpu as higher-level fallback / software rendering for VM
wgpu = { version = "22", features = [] }
bytemuck = { version = "1", features = ["derive"] }

# Math
nalgebra = { version = "0.33", features = ["serde-serialize"] }
rand = "0.8"

# Image output for notebooks
image = "0.25"
base64 = "0.22"

# GLSL → SPIR-V compilation
shaderc = "0.8"

# Polars for data model analysis
polars = { version = "0.43", features = ["ndarray"], optional = true }

[features]
default = ["wgpu-backend"]
wgpu-backend = []       # Software/WebGPU-compatible backend (works in VM, no GPU passthrough)
vulkan-backend = []     # Raw Ash/Vulkan backend (requires host GPU)
data-analysis = ["polars"]
