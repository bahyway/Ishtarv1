# Real inventory for BahyWay.Ecosystem v4.0's Ansible playbooks.
#
# Missing until PB-210 (2026-07-19): every playbook in playbooks/
# targets `hosts: eriduous-vdi`, but no inventory file anywhere in this
# repo ever defined what "eriduous-vdi" resolves to -- discovered live
# when `ansible-playbook playbooks/playbook_192_...yml` produced
# `[WARNING]: Could not match supplied host pattern, ignoring: eriduous-vdi`
# and a PLAY RECAP with zero tasks run, on a run that otherwise looked
# clean (no red FAILED text) and could easily be mistaken for success.
#
# PB-212 (2026-07-19): the real fleet is a 4-VM topology, not a single
# host -- confirmed against the Architect's own real VM inventory
# (Virtual Machine Manager) and connection details from their uploaded
# `09_sovereign_vm_restart.yml`:
#   eriduous-vdi       192.168.122.214  -- DubSar (Godot) IDE, Ansible
#                                          control node, whole-ecosystem
#                                          monitoring. Playbooks are run
#                                          FROM here (ansible_connection=
#                                          local), reaching out to the two
#                                          node VMs over real SSH.
#   enkidb-node-write  192.168.122.101  -- every EnkiDB Type's Write-role
#                                          Podman containers (EnkiDDB,
#                                          EnkiMDB today; the other 5
#                                          types once their own Write/Read
#                                          server binaries exist).
#   enkidb-node-read   192.168.122.107  -- every EnkiDB Type's Read-role
#                                          Podman containers, same pairing.
#
# PB-269 (2026-07-30): EriduOS-VDI (the KVM/libvirt VM at 192.168.122.214
# above) is retired as of v4.0 -- no longer used. The control-node role
# moves to the bare-metal Fedora Workstation 44 host (see PB-265/268,
# already written against that same real machine). At that time the
# `eriduous-vdi` alias was deliberately KEPT rather than renamed, to avoid
# invasively editing ~89 historical playbook files for zero functional
# benefit, and because it doubles as the GitHub Actions self-hosted-runner
# label in `.github/workflows/isimud-engine.yml` (`runs-on: [self-hosted,
# eriduous-vdi]`).
#
# Phase 2 reconciliation (2026-08-14): the Architect has now confirmed
# eriduous-vdi is fully deprecated -- there is no VM of any kind left in
# the ecosystem, VDI or otherwise -- and named the real control node
# `uruk`, with `kish` reserved for a second physical machine under
# consideration (see the Architect's hardware-buying research and the
# PB-310-320 continuity/storage suite, both of which independently use
# uruk/kish for exactly this two-host topology).
#
# `uruk` is added below as the canonical alias for the bare-metal Fedora
# Workstation 44 box and is what all Phase 2 playbooks (PB-301 onward)
# target. `eriduous-vdi` is KEPT alongside it, unchanged, pointing at the
# same local connection -- purely so the ~89 pre-Phase-2 playbooks and the
# CI workflow's runner label keep working without a repo-wide rename. That
# rename is a deliberately separate, larger decision: it would also
# require re-registering the physical GitHub Actions runner under a new
# label on GitHub's side (a manual step this repo cannot perform), so it
# is left for the Architect to do explicitly, on its own, rather than as a
# side effect of this integration pass.
#
# `kish` is NOT yet defined with real connection details below -- no
# second machine exists yet. Any Phase 2 playbook targeting `hosts: kish`
# will fail cleanly with Ansible's "could not match supplied host pattern"
# rather than silently running somewhere unintended, until the Architect
# adds it here with a real ansible_host once the second box exists.
#
# SSH from uruk to both node VMs is confirmed already set up
# (Architect, 2026-07-19) -- no key-distribution step needed here. SSH
# directly BETWEEN enkidb-node-write and enkidb-node-read is NOT assumed
# to exist; cross-host sync (playbooks/tasks/enkiddb_cross_host_sync.yml)
# relays through the control node (fetch from write, copy to read)
# instead of requiring that second trust relationship.
#
# FIXED (2026-07-26): enkidb-node-write/enkidb-node-read never had
# ansible_connection explicitly set, on the assumption that Ansible's
# default (ssh) would apply. That default only holds for a play whose
# own `hosts:` targets them directly (PB-212's style). PB-213 targets
# `hosts: localhost` with a play-level `connection: local`, then reaches
# these two hosts via `delegate_to:` on individual tasks -- and a
# play-level `connection: local` bleeds through to delegated hosts that
# don't set their own ansible_connection, silently running the "remote"
# command locally on eriduous-vdi instead. Confirmed live: PB-213's
# FLUSH task connected to eriduous-vdi's own 127.0.0.1:7101 (nothing
# there) instead of enkidb-node-write's, failing with a plain
# ConnectionRefusedError that looked exactly like a dead container --
# `ansible -vvvv` showed the real cause: "ESTABLISH LOCAL CONNECTION FOR
# USER: bahyway" where an SSH command line should have been. Explicit
# ansible_connection=ssh below makes delegate_to correctly override the
# play-level default, for this and any future localhost+delegate_to
# playbook.
[all]
eriduous-vdi ansible_connection=local
uruk ansible_connection=local

[all:vars]
ansible_ssh_common_args='-o StrictHostKeyChecking=accept-new'

[enkidb_write]
enkidb-node-write ansible_host=192.168.122.101 ansible_user=bahyway ansible_connection=ssh

[enkidb_read]
enkidb-node-read ansible_host=192.168.122.107 ansible_user=bahyway ansible_connection=ssh
