# Ansible collections required by playbooks/ (install with:
#   ansible-galaxy collection install -r requirements.yml
# ).
# Discovered missing 2026-08-26 during the PB-672 Phase-3 corpus walk:
# playbook_632 (ansible.posix.mount) and playbook_633/634 (community.docker.
# docker_container) failed with "couldn't resolve module/action" because
# neither collection ships with ansible-core and neither had ever been
# declared anywhere in this repo. community.docker.docker_container also
# needs the `docker` and `requests` Python packages on whatever host runs
# it -- see requirements-ansible-python.txt.
#
# containers.podman added 2026-08-26: this ecosystem's real container
# runtime is Podman everywhere (7 Podman containers on each of the two
# CQRS node VMs, no Docker anywhere) -- community.docker above is used
# ONLY for the two services in playbook_633/634 that target a real UGOS
# Pro NAS, whose own app center is Docker-based. When those two
# playbooks run against the current hardware instead (no dedicated NAS
# yet, nas_dedicated=false), they use containers.podman.podman_container,
# matching the rest of the ecosystem -- see the `nas_dedicated` gate in
# both files.
collections:
  - name: ansible.posix
  - name: community.docker
  - name: containers.podman
