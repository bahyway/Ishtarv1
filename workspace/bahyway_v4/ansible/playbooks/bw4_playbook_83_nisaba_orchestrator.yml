---
# ══════════════════════════════════════════════════════════════════════════════
# 𒁾 playbook_83_nisaba_orchestrator.yml
# NISABA 𒀭𒀭𒂗𒍪 — Pattern Orchestrator + Template Proposer
# BahyWay.Ecosystem v4.0 — DUB.SAR Bahaa Fadam
#
# NISABA is now:
#   Part oracle   — sees patterns before humans do
#   Part scribe   — names and registers what she discovers
#   Part proposer — asks DUB.SAR permission before sealing
#   Part teacher  — transfers patterns to KIBRATU-HAJJ
#   Part narrator — explains everything to stakeholders live
#
# DUB.SAR PERMISSION PROTOCOL (sealed):
#   Threshold 2: pattern seen 3+ times → NISABA proposes
#   DUB.SAR: APPROVE / REJECT / PERMANENT_REJECT
#   APPROVE  → MĀŠŠARU verifies → UTNAPISHTIM seals
#   REJECT   → observed not templated → propose again after 3 more
#   PERMANENT_REJECT → PUZRU_PATTERN → never proposed again
#   Every decision → Permission-KAKI (immutable audit)
#
# CROWD PATTERN → ETL TEMPLATE TRANSLATION:
#   Physical crowd pattern = universal law of flow
#   Same law governs data movement in BahyWay pipeline
#   NISABA translates physical → digital
#
# Target  : eriduous-vdi (192.168.122.214)
# Run from: EnkiLab HOST
# ansible-playbook -i inventory/vdi.yml playbooks/83_nisaba_orchestrator.yml
# ══════════════════════════════════════════════════════════════════════════════

- name: "PLAYBOOK 83 — NISABA 𒀭𒀭𒂗𒍪 Orchestrator + Template Proposer"
  hosts: eriduous_vdi
  gather_facts: false
  become: false

  vars:
    forge_root:  "/home/bahyway/Forge/bahyway_v4"
    dubsar_root: "/home/bahyway/Forge/bahyway_v4/apps/dubsar-ide"
    script_path: "/tmp/bw_83_nisaba_orch.py"

  tasks:

    - name: "1.0 | Write bw_83_nisaba_orch.py"
      ansible.builtin.copy:
        dest: "{{ script_path }}"
        mode: "0755"
        content: |
          #!/usr/bin/env python3
          # NISABA Orchestrator — BahyWay.Ecosystem v4.0 — DUB.SAR 𒁾
          import os, subprocess, sys, textwrap

          FORGE   = "/home/bahyway/Forge/bahyway_v4"
          CRATE   = f"{FORGE}/crates/nisaba-orchestrator"
          SRC     = f"{CRATE}/src"
          DUBSAR  = f"{FORGE}/apps/dubsar-ide"
          SCRIPTS = f"{DUBSAR}/scripts"

          for d in [SRC, SCRIPTS]:
              os.makedirs(d, exist_ok=True)

          write = lambda p, c: open(p, "w").write(c)

          write(f"{CRATE}/Cargo.toml", textwrap.dedent("""\
          [package]
          name        = "nisaba-orchestrator"
          version     = "4.0.0"
          edition     = "2021"
          authors     = ["DUB.SAR 𒁾 — Bahaa Fadam"]
          description = "NISABA Pattern Orchestrator + DUB.SAR Template Permission"
          [dependencies]
          shamash     = { path = "../shamash" }
          enkidb-kaki = { path = "../enkidb-kaki" }
          mashsharu   = { path = "../mashsharu" }
          serde       = { version = "1", features = ["derive"] }
          serde_json  = "1"
          """))

          write(f"{SRC}/lib.rs", textwrap.dedent("""\
          //! NISABA 𒀭𒀭𒂗𒍪 — Pattern Orchestrator + Template Proposer
          //! BahyWay.Ecosystem v4.0 — DUB.SAR 𒁾
          //!
          //! "NISABA names what exists.
          //!  She discovered it in the crowd.
          //!  She recognises it in the data.
          //!  They are the same truth in different forms."
          //!
          //! DUB.SAR PERMISSION PROTOCOL (sealed):
          //!   Step 1: NISABA discovers pattern
          //!   Step 2: NISABA generates draft .tmpl
          //!   Step 3: MĀŠŠARU verifies draft
          //!   Step 4: NISABA presents to DUB.SAR
          //!   Step 5: DUB.SAR: APPROVE / REJECT / PERMANENT_REJECT
          //!   Step 6: APPROVE → UTNAPISHTIM seals into tribe.templates
          //!
          //! THRESHOLD 2:
          //!   Pattern seen < 3 times → stored, not proposed
          //!   Pattern seen >= 3 times → NISABA proposes to DUB.SAR

          #![forbid(unsafe_code)]

          pub mod registry;
          pub mod namer;
          pub mod translator;
          pub mod permission;
          pub mod template_gen;

          pub use registry::{PatternRegistry, CrowdPattern, PatternStatus};
          pub use namer::AkkadianNamer;
          pub use translator::CrowdToEtlTranslator;
          pub use permission::{PermissionRequest, PermissionDecision, PermissionKaki};
          pub use template_gen::NisabaTemplateGenerator;

          /// Observation threshold before NISABA proposes to DUB.SAR
          pub const PROPOSAL_THRESHOLD: u32 = 3;

          /// Minimum additional observations before re-proposing after rejection
          pub const REPROPOSAL_THRESHOLD: u32 = 3;
          """))

          write(f"{SRC}/registry.rs", textwrap.dedent("""\
          //! Pattern Registry — NISABA's accumulating knowledge library

          #![forbid(unsafe_code)]

          use shamash::tribe::{VisualTribe, TribeType};
          use enkidb_kaki::Kaki;
          use crate::namer::AkkadianNamer;
          use crate::PROPOSAL_THRESHOLD;

          #[derive(Debug, Clone, PartialEq, serde::Serialize, serde::Deserialize)]
          pub enum PatternStatus {
              /// Seen but not yet at proposal threshold
              Observed { times_seen: u32 },
              /// At threshold — awaiting DUB.SAR decision
              PendingApproval,
              /// DUB.SAR approved — sealed in tribe.templates
              Sealed { template_kaki: String },
              /// DUB.SAR rejected — not templated
              Rejected { times_since_rejection: u32 },
              /// DUB.SAR permanent rejection — PUZRU — never proposed again
              PuzruPattern,
          }

          /// A discovered crowd pattern in NISABA's registry
          #[derive(Debug, Clone, serde::Serialize, serde::Deserialize)]
          pub struct CrowdPattern {
              /// Pattern-KAKI (κ[7]=0xE0 PATTERN_DISCOVERY)
              pub pattern_kaki:      String,
              /// Akkadian name assigned by NISABA
              pub name:              String,
              /// Dominant tribe type that characterises this pattern
              pub tribe_type:        TribeType,
              /// 7D signature vector (HeptaMap coordinates)
              pub signature:         [f32; 7],
              /// Discovery site and time
              pub first_site:        String,
              pub first_epoch:       u64,
              /// Observation history
              pub times_seen:        u32,
              pub times_since_last_rejection: u32,
              /// Status in DUB.SAR approval pipeline
              pub status:            PatternStatus,
              /// Maximum TIAMAT level this pattern has triggered
              pub max_tiamat:        u8,
              /// Has this pattern ever reached ERRA or KUR?
              pub is_dangerous:      bool,
              /// GA blade vector for KIBRATU-HAJJ
              pub ga_blade:          [f32; 7],
          }

          impl CrowdPattern {
              pub fn new(
                  tribe_type:  TribeType,
                  signature:   [f32; 7],
                  site:        impl Into<String>,
                  epoch:       u64,
                  tiamat:      u8,
              ) -> Self {
                  let name = AkkadianNamer::name(&tribe_type, &signature, epoch);
                  let hash = enkidb_kaki::fnv1a_u32(name.as_bytes());
                  let kaki = Kaki::mint(hash, 0x0001,
                      enkidb_kaki::KakiType::Event, 0xE0);
                  let kaki_hex = kaki.bytes.iter()
                      .map(|b| format!("{:02X}", b)).collect::<String>();
                  let dangerous = tiamat >= 3;
                  Self {
                      pattern_kaki: kaki_hex,
                      name,
                      tribe_type,
                      signature,
                      first_site:  site.into(),
                      first_epoch: epoch,
                      times_seen:  1,
                      times_since_last_rejection: 0,
                      status: PatternStatus::Observed { times_seen: 1 },
                      max_tiamat:  tiamat,
                      is_dangerous: dangerous,
                      ga_blade:    signature,
                  }
              }

              pub fn observe(&mut self, tiamat: u8) {
                  self.times_seen += 1;
                  if tiamat > self.max_tiamat { self.max_tiamat = tiamat; }
                  if tiamat >= 3 { self.is_dangerous = true; }

                  match &mut self.status {
                      PatternStatus::Observed { times_seen } => {
                          *times_seen += 1;
                          if *times_seen >= PROPOSAL_THRESHOLD {
                              self.status = PatternStatus::PendingApproval;
                              println!("[NISABA] Pattern {} ready for DUB.SAR approval \
                                  ({} observations)", self.name, self.times_seen);
                          }
                      }
                      PatternStatus::Rejected { times_since_rejection } => {
                          *times_since_rejection += 1;
                          if *times_since_rejection >= crate::REPROPOSAL_THRESHOLD {
                              println!("[NISABA] Pattern {} seen {} more times since \
                                  rejection — re-proposing to DUB.SAR", self.name,
                                  times_since_rejection);
                              self.status = PatternStatus::PendingApproval;
                          }
                      }
                      _ => {}
                  }
              }

              pub fn needs_proposal(&self) -> bool {
                  matches!(self.status, PatternStatus::PendingApproval)
              }
          }

          /// NISABA's complete pattern knowledge library
          #[derive(Debug, Default)]
          pub struct PatternRegistry {
              pub patterns:    Vec<CrowdPattern>,
              pub total_seen:  u64,
              pub total_sealed: u32,
          }

          impl PatternRegistry {
              pub fn new() -> Self { Self::default() }

              /// Record a new pattern observation
              /// Returns true if this is a new discovery (first observation)
              pub fn observe(
                  &mut self,
                  tribe_type: TribeType,
                  signature:  [f32; 7],
                  site:       &str,
                  epoch:      u64,
                  tiamat:     u8,
              ) -> bool {
                  self.total_seen += 1;
                  // Check if similar pattern already exists (cosine similarity > 0.95)
                  if let Some(existing) = self.find_similar_mut(&signature) {
                      existing.observe(tiamat);
                      return false;
                  }
                  // New pattern discovered
                  let pattern = CrowdPattern::new(
                      tribe_type, signature, site, epoch, tiamat);
                  println!("[NISABA] 𒀭𒀭𒂗𒍪 NEW PATTERN DISCOVERED: {}",
                      pattern.name);
                  self.patterns.push(pattern);
                  true
              }

              /// Find pattern with signature similarity > 0.95
              fn find_similar_mut(&mut self, sig: &[f32; 7]) -> Option<&mut CrowdPattern> {
                  self.patterns.iter_mut().find(|p| {
                      let dot: f32 = p.signature.iter().zip(sig.iter())
                          .map(|(a,b)| a*b).sum();
                      let ma: f32  = p.signature.iter().map(|x| x*x).sum::<f32>().sqrt();
                      let mb: f32  = sig.iter().map(|x| x*x).sum::<f32>().sqrt();
                      if ma * mb < 1e-6 { false }
                      else { dot / (ma * mb) > 0.95 }
                  })
              }

              /// Patterns awaiting DUB.SAR decision
              pub fn pending_proposals(&self) -> Vec<&CrowdPattern> {
                  self.patterns.iter()
                      .filter(|p| p.needs_proposal())
                      .collect()
              }

              pub fn sealed_count(&self) -> usize {
                  self.patterns.iter()
                      .filter(|p| matches!(p.status, PatternStatus::Sealed { .. }))
                      .count()
              }
          }

          #[cfg(test)]
          mod tests {
              use super::*;

              fn sig() -> [f32; 7] { [0.5, 0.8, 0.3, 0.6, 0.4, 0.7, 0.2] }

              #[test]
              fn test_pattern_discovered_on_first_observation() {
                  let mut reg = PatternRegistry::new();
                  let is_new = reg.observe(TribeType::StaticCluster, sig(),
                      "Najaf", 0, 1);
                  assert!(is_new);
                  assert_eq!(reg.patterns.len(), 1);
              }

              #[test]
              fn test_proposal_threshold_at_3() {
                  let mut reg = PatternRegistry::new();
                  reg.observe(TribeType::StaticCluster, sig(), "Najaf", 0, 1);
                  reg.observe(TribeType::StaticCluster, sig(), "Najaf", 1, 1);
                  // Not yet at threshold
                  assert!(reg.pending_proposals().is_empty());
                  // Third observation triggers proposal
                  reg.observe(TribeType::StaticCluster, sig(), "Najaf", 2, 1);
                  assert!(!reg.pending_proposals().is_empty());
              }

              #[test]
              fn test_similar_pattern_not_duplicated() {
                  let mut reg = PatternRegistry::new();
                  let sig2 = [0.51, 0.79, 0.31, 0.61, 0.41, 0.69, 0.21];
                  reg.observe(TribeType::StaticCluster, sig(),  "Najaf", 0, 1);
                  reg.observe(TribeType::StaticCluster, sig2,   "Najaf", 1, 1);
                  // Similar signatures → same pattern, not two
                  assert_eq!(reg.patterns.len(), 1);
              }

              #[test]
              fn test_rejection_then_reproposal_after_3_more() {
                  let mut reg = PatternRegistry::new();
                  // 3 observations → pending
                  for i in 0..3 {
                      reg.observe(TribeType::CounterFlow, sig(), "Najaf", i, 1);
                  }
                  // Simulate rejection
                  reg.patterns[0].status =
                      PatternStatus::Rejected { times_since_rejection: 0 };
                  // 2 more → not yet reproposed
                  reg.observe(TribeType::CounterFlow, sig(), "Najaf", 4, 1);
                  reg.observe(TribeType::CounterFlow, sig(), "Najaf", 5, 1);
                  assert!(!reg.pending_proposals().is_empty() == false ||
                          reg.patterns[0].times_seen > 4);
                  // 3rd after rejection → repropose
                  reg.observe(TribeType::CounterFlow, sig(), "Najaf", 6, 1);
                  assert!(matches!(reg.patterns[0].status,
                      PatternStatus::PendingApproval | PatternStatus::Rejected { .. }));
              }
          }
          """))

          write(f"{SRC}/namer.rs", textwrap.dedent("""\
          //! Akkadian Pattern Namer — NISABA assigns sovereign names
          //! "In É-DUBBA, the scribe names what exists."

          #![forbid(unsafe_code)]

          use shamash::tribe::TribeType;

          pub struct AkkadianNamer;

          impl AkkadianNamer {
              /// Assign an Akkadian name to a discovered pattern
              /// Name = PREFIX_SUFFIX where:
              ///   PREFIX = god name based on tribe type
              ///   SUFFIX = characteristic based on signature dimensions
              pub fn name(tribe_type: &TribeType, sig: &[f32; 7], epoch: u64) -> String {
                  let prefix = match tribe_type {
                      TribeType::FlowNorth | TribeType::FlowSouth |
                      TribeType::FlowEast  | TribeType::FlowWest  |
                      TribeType::FlowNorthEast | TribeType::FlowNorthWest |
                      TribeType::FlowSouthEast | TribeType::FlowSouthWest
                                          => "ENLIL",
                      TribeType::StaticCluster    => "NANNA",
                      TribeType::DenseConvergence => "INANNA",
                      TribeType::CounterFlow      => "ERESHKIGAL",
                      TribeType::Vortex           => "ABZU",
                      TribeType::Dispersal        => "ENLIL",
                      TribeType::Chaotic          => "TIAMAT",
                      TribeType::Unknown          => "NAMMU",
                  };

                  // Suffix from dominant signature dimension
                  let suffix = Self::suffix_from_signature(sig, tribe_type);

                  format!("{}_{}", prefix, suffix)
              }

              fn suffix_from_signature(sig: &[f32; 7], tribe_type: &TribeType) -> &'static str {
                  // D0: heading, D1: speed, D2: density
                  // D3: clothing hue, D4: clothing coherence
                  // D5: posture consensus, D6: dwell time
                  let speed     = sig[1];
                  let density   = sig[2];
                  let coherence = sig[4];
                  let dwell     = sig[6];

                  match tribe_type {
                      TribeType::StaticCluster => {
                          if dwell > 0.7       { "ISLAND" }    // long dwell = island
                          else if density > 0.8 { "PRESS" }     // dense static
                          else                  { "PAUSE" }     // brief stop
                      }
                      TribeType::DenseConvergence => {
                          if density > 0.9     { "CONVERGENCE" }
                          else if density > 0.7 { "DESCENT" }
                          else                  { "GATE" }
                      }
                      TribeType::CounterFlow => {
                          if coherence > 0.8   { "PULL" }       // organised counter
                          else                  { "CURRENT" }    // chaotic counter
                      }
                      TribeType::Vortex => {
                          if speed > 0.6       { "SPIRAL" }
                          else                  { "RING" }
                      }
                      TribeType::Chaotic => "VORTEX",
                      _ => {
                          if speed > 0.7       { "BREATH" }     // fast flow
                          else if speed > 0.4   { "MARCH" }     // steady flow
                          else                  { "TIDE" }      // slow pulse
                      }
                  }
              }

              /// Format a NISABA proposal narration string
              pub fn proposal_narration(
                  name: &str, times_seen: u32,
                  first_site: &str, tiamat: u8,
                  mashsharu_passed: bool,
              ) -> String {
                  let tiamat_desc = match tiamat {
                      0 => "NOMINAL",
                      1 => "DILBAT (amber) — monitoring",
                      2 => "KAKKAB (orange) — act soon",
                      3 => "ERRA (crimson) — urgent",
                      4 => "KUR (indigo) — critical",
                      _ => "UNKNOWN",
                  };
                  let mashsharu = if mashsharu_passed {
                      "MĀŠŠARU ✓ CERTIFIED — mathematically sound"
                  } else {
                      "MĀŠŠARU ✗ FAILED — cannot seal"
                  };
                  format!(
                      "𒀭𒀭𒂗𒍪 NISABA TEMPLATE PROPOSAL\n\
                       Pattern:     {}\n\
                       First seen:  {} ({} observations)\n\
                       TIAMAT:      {}\n\
                       {}\n\n\
                       𒁾 DUB.SAR — shall I seal this template?",
                      name, first_site, times_seen, tiamat_desc, mashsharu
                  )
              }
          }

          #[cfg(test)]
          mod tests {
              use super::*;

              #[test]
              fn test_static_island_named_nanna_island() {
                  let sig = [0.0, 0.05, 0.3, 0.0, 0.5, 0.7, 0.85]; // high dwell
                  let name = AkkadianNamer::name(&TribeType::StaticCluster, &sig, 0);
                  assert_eq!(name, "NANNA_ISLAND");
              }

              #[test]
              fn test_convergence_named_inanna() {
                  let sig = [0.0, 0.4, 0.95, 0.0, 0.6, 0.8, 0.1]; // high density
                  let name = AkkadianNamer::name(&TribeType::DenseConvergence, &sig, 0);
                  assert!(name.starts_with("INANNA_"));
              }

              #[test]
              fn test_counter_flow_named_ereshkigal() {
                  let sig = [0.5, 0.6, 0.4, 0.0, 0.9, 0.8, 0.2]; // high coherence
                  let name = AkkadianNamer::name(&TribeType::CounterFlow, &sig, 0);
                  assert_eq!(name, "ERESHKIGAL_PULL");
              }

              #[test]
              fn test_chaotic_named_tiamat_vortex() {
                  let sig = [0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5];
                  let name = AkkadianNamer::name(&TribeType::Chaotic, &sig, 0);
                  assert_eq!(name, "TIAMAT_VORTEX");
              }
          }
          """))

          write(f"{SRC}/translator.rs", textwrap.dedent("""\
          //! Crowd → ETL Translator
          //! "The physical law and the data law are the same truth."
          //! Translates crowd pattern observations into ETL pipeline templates.

          #![forbid(unsafe_code)]

          use shamash::tribe::TribeType;

          /// How a crowd pattern maps to BeeMDM pipeline behaviour
          #[derive(Debug, Clone, serde::Serialize, serde::Deserialize)]
          pub struct EtlMapping {
              pub data_behaviour:   String,
              pub pipeline_path:    Vec<String>,
              pub bypass_stations:  Vec<String>,
              pub required_stations: Vec<String>,
              pub tiamat_threshold: String,
              pub particle_entry:   String,
              pub particle_goal:    String,
          }

          pub struct CrowdToEtlTranslator;

          impl CrowdToEtlTranslator {
              /// Translate a crowd tribe type to its ETL equivalent
              pub fn translate(tribe_type: &TribeType,
                                sig: &[f32; 7]) -> EtlMapping {
                  let speed   = sig[1];
                  let density = sig[2];
                  let dwell   = sig[6];

                  match tribe_type {
                      // ENLIL_BREATH / ENLIL_MARCH / ENLIL_TIDE
                      // High-volume directional flow → clean bulk ingest
                      TribeType::FlowNorth | TribeType::FlowSouth |
                      TribeType::FlowEast  | TribeType::FlowWest  |
                      TribeType::FlowNorthEast | TribeType::FlowNorthWest |
                      TribeType::FlowSouthEast | TribeType::FlowSouthWest
                      | TribeType::Dispersal => {
                          let path = if speed > 0.7 {
                              // Fast flow = clean data → bypass deep checks
                              vec!["S0".into(), "S1".into(), "S6".into()]
                          } else {
                              // Slower flow = more variation → standard path
                              vec!["S0".into(), "S1".into(), "S2".into(), "S6".into()]
                          };
                          EtlMapping {
                              data_behaviour:    "HIGH_VOLUME_DIRECTIONAL_FLOW".into(),
                              pipeline_path:     path,
                              bypass_stations:   vec!["S3".into(), "S4".into()],
                              required_stations: vec!["S1".into()],
                              tiamat_threshold:  "NOMINAL".into(),
                              particle_entry:    "GOLDEN_ALIVE".into(),
                              particle_goal:     "GOLDEN_GEM".into(),
                          }
                      }

                      // NANNA_ISLAND / NANNA_PAUSE / NANNA_PRESS
                      // Stationary cluster → resistance to transformation
                      TribeType::StaticCluster => EtlMapping {
                          data_behaviour:    "RESISTANCE_TO_TRANSFORM".into(),
                          pipeline_path:     vec!["S0".into(),"S1".into(),
                              "S2".into(),"S3".into(),"S5".into(),"S6".into()],
                          bypass_stations:   vec![],
                          required_stations: vec!["S3".into(),"S5".into()],
                          tiamat_threshold:  "DILBAT".into(),
                          particle_entry:    "FUZZY_GRAY".into(),
                          particle_goal:     "GOLDEN_ALIVE".into(),
                      },

                      // INANNA_DESCENT / INANNA_CONVERGENCE / INANNA_GATE
                      // Dense convergence → fan-in merge, multiple sources
                      TribeType::DenseConvergence => EtlMapping {
                          data_behaviour:    "FAN_IN_MERGE_MULTIPLE_SOURCES".into(),
                          pipeline_path:     vec!["S0_MULTI".into(),"S2".into(),
                              "S1".into(),"S4".into(),"S6".into()],
                          bypass_stations:   vec![],
                          required_stations: vec!["S2".into(),"S4".into()],
                          tiamat_threshold:  "KAKKAB".into(),
                          particle_entry:    "FUZZY_AGED".into(),
                          particle_goal:     "GOLDEN_ALIVE".into(),
                      },

                      // ERESHKIGAL_PULL / ERESHKIGAL_CURRENT
                      // Counter-flow → schema conflict, fighting the model
                      TribeType::CounterFlow => EtlMapping {
                          data_behaviour:    "SCHEMA_CONFLICT_COUNTER_SCHEMA".into(),
                          pipeline_path:     vec!["S0".into(),"S1".into(),
                              "S3".into(),"S5".into(),"S7".into()],
                          bypass_stations:   vec!["S6".into()],
                          required_stations: vec!["S3".into(),"S5".into(),"S7".into()],
                          tiamat_threshold:  "KAKKAB".into(),
                          particle_entry:    "FUZZY_DECAY".into(),
                          particle_goal:     "GOLDEN_ALIVE".into(),
                      },

                      // ABZU_SPIRAL / ABZU_RING
                      // Vortex → circular dependency in data
                      TribeType::Vortex => EtlMapping {
                          data_behaviour:    "CIRCULAR_DEPENDENCY_DETECTED".into(),
                          pipeline_path:     vec!["S0".into(),"S1".into(),
                              "S2".into(),"S3".into(),"EDUBBA".into()],
                          bypass_stations:   vec!["S4".into(),"S5".into(),"S6".into()],
                          required_stations: vec!["S3".into(),"EDUBBA".into()],
                          tiamat_threshold:  "ERRA".into(),
                          particle_entry:    "FUZZY_DECAY".into(),
                          particle_goal:     "GOLDEN_ALIVE".into(),
                      },

                      // TIAMAT_VORTEX — Chaotic → unstructured, É-DUBBA needed
                      TribeType::Chaotic => EtlMapping {
                          data_behaviour:    "UNSTRUCTURED_NO_SCHEMA_DETECTED".into(),
                          pipeline_path:     vec!["S0".into(),"HALT".into(),
                              "EDUBBA".into()],
                          bypass_stations:   vec!["S1".into(),"S2".into(),"S3".into(),
                              "S4".into(),"S5".into(),"S6".into()],
                          required_stations: vec!["EDUBBA".into()],
                          tiamat_threshold:  "ERRA".into(),
                          particle_entry:    "DEAD_EXPIRED".into(),
                          particle_goal:     "FUZZY_ALIVE".into(),
                      },

                      // NAMMU (unknown) → discovery mode
                      TribeType::Unknown => EtlMapping {
                          data_behaviour:    "UNKNOWN_AWAITING_NISABA_ANALYSIS".into(),
                          pipeline_path:     vec!["S0".into(),"S1".into(),"MONITOR".into()],
                          bypass_stations:   vec!["S2".into(),"S3".into(),"S4".into(),
                              "S5".into(),"S6".into()],
                          required_stations: vec!["MONITOR".into()],
                          tiamat_threshold:  "DILBAT".into(),
                          particle_entry:    "FUZZY_GRAY".into(),
                          particle_goal:     "GOLDEN_ALIVE".into(),
                      },
                  }
              }

              /// Generate the .tmpl file content from pattern + ETL mapping
              pub fn generate_tmpl(
                  pattern_name: &str,
                  pattern_kaki: &str,
                  tribe_type:   &TribeType,
                  sig:          &[f32; 7],
                  site:         &str,
                  epoch:        u64,
                  times_seen:   u32,
                  max_tiamat:   u8,
              ) -> String {
                  let mapping    = Self::translate(tribe_type, sig);
                  let tiamat_str = match max_tiamat {
                      0 => "NOMINAL", 1 => "DILBAT", 2 => "KAKKAB",
                      3 => "ERRA",    4 => "KUR",    _ => "UNKNOWN",
                  };
                  let dangerous  = max_tiamat >= 3;
                  // String concatenation only — no format! — Jinja2 safe
                  let mut t = String::with_capacity(1024);
                  t += "; NISABA Template: "; t += pattern_name; t += "\n";
                  t += "; BahyWay.Ecosystem v4.0 — DUB.SAR\n";
                  t += "; Approved by DUB.SAR — sealed by UTNAPISHTIM\n\n";
                  t += "[meta]\n";
                  t += "name              = "; t += pattern_name; t += "\n";
                  t += "version           = 1.0.0\n";
                  t += "source            = NISABA_PATTERN_DISCOVERY\n";
                  t += "pattern_kaki      = "; t += pattern_kaki; t += "\n";
                  t += "discovery_site    = "; t += site; t += "\n";
                  t += "discovery_epoch   = "; t += &epoch.to_string(); t += "\n";
                  t += "pattern_type      = "; t += &mapping.data_behaviour; t += "\n";
                  t += "times_observed    = "; t += &times_seen.to_string(); t += "\n";
                  t += "max_tiamat        = "; t += tiamat_str; t += "\n";
                  t += "dangerous         = "; t += &dangerous.to_string(); t += "\n";
                  t += "\n[etl_mapping]\n";
                  t += "data_behaviour    = "; t += &mapping.data_behaviour; t += "\n";
                  t += "pipeline_path     = "; t += &mapping.pipeline_path.join("->"); t += "\n";
                  t += "bypass_stations   = "; t += &mapping.bypass_stations.join(","); t += "\n";
                  t += "required_stations = "; t += &mapping.required_stations.join(","); t += "\n";
                  t += "tiamat_threshold  = "; t += &mapping.tiamat_threshold; t += "\n";
                  t += "\n[particle_behaviour]\n";
                  t += "orbital_entry     = "; t += &mapping.particle_entry; t += "\n";
                  t += "expected_exit     = "; t += &mapping.particle_goal; t += "\n";
                  t += "failure_exit      = DEAD_EXPIRED\n";
                  t += "\n[nisaba_narration]\n";
                  t += "on_detect  = \"NISABA recognises "; t += pattern_name; t += ". Routing accordingly.\"\n";
                  t += "on_resolve = \""; t += pattern_name; t += " resolved.\"\n";
                  t += "on_failure = \""; t += pattern_name; t += " unresolved. Escalating to ERRA.\"\n";
                  t += "\n[way_defense]\n";
                  t += "DEFEND tribe:ALL FROM force_transform_attack\n";
                  t
              }
          }

