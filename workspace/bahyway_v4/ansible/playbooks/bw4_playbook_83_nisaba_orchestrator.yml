          //! NISABA Template Generator — full pipeline from pattern to .tmpl
          //! Integrates: Registry → Namer → MĀŠŠARU → Permission → UTNAPISHTIM

          #![forbid(unsafe_code)]

          use crate::registry::{PatternRegistry, PatternStatus};
          use crate::translator::CrowdToEtlTranslator;
          use crate::permission::{PermissionRequest, PermissionDecision, PermissionKaki};
          use shamash::tribe::TribeType;

          pub struct NisabaTemplateGenerator {
              pub registry:     PatternRegistry,
              pub permissions:  Vec<PermissionKaki>,
              pub sealed_templates: Vec<String>,  // sealed .tmpl contents
          }

          impl NisabaTemplateGenerator {
              pub fn new() -> Self {
                  Self {
                      registry:         PatternRegistry::new(),
                      permissions:      Vec::new(),
                      sealed_templates: Vec::new(),
                  }
              }

              /// Main pipeline: observe → check threshold → prepare proposal
              pub fn observe_and_propose(
                  &mut self,
                  tribe_type: TribeType,
                  signature:  [f32; 7],
                  site:       &str,
                  epoch:      u64,
                  tiamat:     u8,
              ) -> Option<PermissionRequest> {
                  let _is_new = self.registry.observe(
                      tribe_type, signature, site, epoch, tiamat);

                  // Check for patterns at proposal threshold
                  let proposals: Vec<_> = self.registry.pending_proposals()
                      .into_iter()
                      .filter_map(|p| {
                          // Generate draft .tmpl
                          let tmpl = CrowdToEtlTranslator::generate_tmpl(
                              &p.name, &p.pattern_kaki,
                              &p.tribe_type, &p.signature,
                              &p.first_site, p.first_epoch,
                              p.times_seen, p.max_tiamat,
                          );
                          // Simulate MĀŠŠARU proof (pass if pattern seen 3+ times)
                          let mashsharu = if p.times_seen >= 3 {
                              Some(format!("MASHSHARU_CERT_{}", &p.pattern_kaki[..8]))
                          } else { None };

                          if mashsharu.is_some() {
                              Some(PermissionRequest::from_pattern(p, tmpl, mashsharu))
                          } else { None }
                      })
                      .collect();

                  proposals.into_iter().next()
              }

              /// Process DUB.SAR's decision
              pub fn process_decision(
                  &mut self,
                  request:  &PermissionRequest,
                  decision: PermissionDecision,
                  epoch:    u64,
              ) {
                  let tmpl_kaki = if decision == PermissionDecision::Approved {
                      Some(format!("TMPL_{}", &request.pattern_kaki[..8]))
                  } else { None };

                  // Update registry pattern status
                  if let Some(pattern) = self.registry.patterns.iter_mut()
                      .find(|p| p.name == request.pattern_name) {
                      pattern.status = match &decision {
                          PermissionDecision::Approved =>
                              PatternStatus::Sealed {
                                  template_kaki: tmpl_kaki.clone()
                                      .unwrap_or_default()
                              },
                          PermissionDecision::Rejected { .. } =>
                              PatternStatus::Rejected { times_since_rejection: 0 },
                          PermissionDecision::PermanentReject { .. } =>
                              PatternStatus::PuzruPattern,
                      };
                  }

                  // If approved → seal the template (UTNAPISHTIM fires)
                  if decision == PermissionDecision::Approved {
                      let tmpl = request.draft_tmpl.clone();
                      self.sealed_templates.push(tmpl);
                      self.registry.total_sealed += 1;
                      println!("[UTNAPISHTIM] 𒌓𒍣𒅁𒀭 Template '{}' sealed",
                          request.pattern_name);
                  }

                  // Mint Permission-KAKI (immutable audit)
                  let pk = PermissionKaki::new(request, decision, epoch, tmpl_kaki);
                  self.permissions.push(pk);
              }

              pub fn stats(&self) -> String {
                  format!(
                      "[NISABA] Patterns observed: {} | Sealed templates: {} | \
                       Pending approval: {} | Decisions: {}",
                      self.registry.patterns.len(),
                      self.registry.total_sealed,
                      self.registry.pending_proposals().len(),
                      self.permissions.len(),
                  )
              }
          }

          impl Default for NisabaTemplateGenerator {
              fn default() -> Self { Self::new() }
          }

          #[cfg(test)]
          mod tests {
              use super::*;

              fn nanna_sig() -> [f32; 7] { [0.0,0.05,0.3,0.0,0.5,0.7,0.85] }

              #[test]
              fn test_full_approval_pipeline() {
                  let mut gen  = NisabaTemplateGenerator::new();
                  let site     = "Najaf_Test";
                  let mut proposal = None;

                  // Observe 3 times → triggers proposal at threshold
                  for i in 0..3u64 {
                      proposal = gen.observe_and_propose(
                          TribeType::StaticCluster, nanna_sig(), site, i, 1);
                  }

                  assert!(proposal.is_some(),
                      "NISABA should propose after 3 observations");
                  let req = proposal.unwrap();
                  assert!(req.pattern_name.starts_with("NANNA_"));

                  // DUB.SAR approves
                  gen.process_decision(&req, PermissionDecision::Approved, 100);
                  assert_eq!(gen.sealed_templates.len(), 1);
                  assert_eq!(gen.registry.sealed_count(), 1);
              }

              #[test]
              fn test_rejection_stores_not_seals() {
                  let mut gen = NisabaTemplateGenerator::new();
                  let mut proposal = None;
                  for i in 0..3u64 {
                      proposal = gen.observe_and_propose(
