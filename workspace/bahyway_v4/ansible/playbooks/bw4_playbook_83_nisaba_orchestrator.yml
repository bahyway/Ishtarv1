          	btn_permanent.add_theme_color_override("font_color", Color("#800000"))
          	
          	btn_approve.pressed.connect(
          		func(): _on_dubsar_approve(pattern_name, panel))
          	btn_reject.pressed.connect(
          		func(): _on_dubsar_reject(pattern_name, panel, false))
          	btn_review.pressed.connect(
          		func(): _show_draft_tmpl(draft_tmpl))
          	btn_permanent.pressed.connect(
          		func(): _on_dubsar_reject(pattern_name, panel, true))
          	
          	hbox.add_child(btn_approve)
          	hbox.add_child(btn_reject)
          	hbox.add_child(btn_review)
          	hbox.add_child(btn_permanent)
          	vbox.add_child(hbox)
          	
          	return panel

          func _on_dubsar_approve(pattern_name: String, dialog: Control) -> void:
          	print("[DUB.SAR 𒁾] APPROVED: %s" % pattern_name)
          	_set_crown_colour(Color("#FFD700"))  # gold flash
          	_crown_flash_gold()
          	_show_whisper(
          		"𒀭𒀭𒂗𒍪 Thank you, DUB.SAR.\n%s is sealed.\nUTNAPISHTIM is generating."
          		% pattern_name
          	)
          	_update_pattern_card(pattern_name, "SEALED")
          	dialog.queue_free()
          	# Signal to Rust backend
          	emit_signal("dubsar_approved", pattern_name)

          func _on_dubsar_reject(pattern_name: String, dialog: Control,
          		permanent: bool) -> void:
          	var decision := "PERMANENT_REJECT" if permanent else "REJECTED"
          	print("[DUB.SAR 𒁾] %s: %s" % [decision, pattern_name])
          	var msg := (
          		"𒀭𒀭𒂗𒍪 Understood.\n%s will not be proposed again." % pattern_name
          		if permanent else
          		"𒀭𒀭𒂗𒍪 Understood, DUB.SAR.\nI will watch for more evidence."
          	)
          	_show_whisper(msg)
          	_update_pattern_card(pattern_name, "REJECTED" if not permanent else "PUZRU")
          	dialog.queue_free()
          	emit_signal("dubsar_rejected", pattern_name, permanent)

          func _show_draft_tmpl(draft: String) -> void:
          	print("[NISABA] Showing draft .tmpl to DUB.SAR")
          	# In production: opens tmpl viewer panel in 2D theater
          	print(draft)

          # ── Signals emitted to Rust backend ───────────────────────────────
          signal dubsar_approved(pattern_name: String)
          signal dubsar_rejected(pattern_name: String, permanent: bool)

          # ── Internal helpers (stubs — implemented in full nisaba.gd) ──────
          func _set_crown_speed(_speed: float) -> void: pass
          func _set_crown_colour(_colour: Color) -> void: pass
          func _cone_look_at(_pos: Vector3) -> void: pass
          func _flash_zone_white(_pos: Vector3) -> void: pass
          func _show_whisper(_text: String) -> void: pass
          func _spawn_pattern_card(_name: String, _status: String) -> void: pass
          func _update_pattern_card(_name: String, _status: String) -> void: pass
          func _crown_flash_gold() -> void: pass
          """))

          # Register + build
          ws = f"{FORGE}/Cargo.toml"
          with open(ws) as f: c = f.read()
          if '"crates/nisaba-orchestrator"' not in c:
              c = c.replace('members = [',
                  'members = [\n    "crates/nisaba-orchestrator",')
              open(ws, "w").write(c)

          r = subprocess.run(["cargo", "build", "-p", "nisaba-orchestrator"],
              cwd=FORGE, capture_output=True, text=True)
          if r.returncode != 0:
              print("✗ BUILD FAILED:"); print(r.stderr[-3000:]); sys.exit(1)

          t = subprocess.run(
              ["cargo", "test", "-p", "nisaba-orchestrator", "--", "--nocapture"],
              cwd=FORGE, capture_output=True, text=True)
          if t.returncode != 0:
              print("✗ TESTS FAILED:"); print(t.stdout[-2000:]); sys.exit(1)

          print("""
          ══════════════════════════════════════════════════════════
            PLAYBOOK 83 — NISABA ORCHESTRATOR COMPLETE

            Crowd Pattern Registry:
              Observe → threshold 3 → NISABA proposes
              MĀŠŠARU verifies draft template
              DUB.SAR: APPROVE / REJECT / PERMANENT_REJECT
              Permission-KAKI minted for every decision

            Akkadian Naming System:
              NANNA_ISLAND / INANNA_DESCENT / ERESHKIGAL_PULL
              TIAMAT_VORTEX / ENLIL_BREATH / ABZU_SPIRAL
              Names from physical reality — sovereign forever

            Crowd → ETL Translation:
              NANNA_ISLAND   → RESISTANCE_TO_TRANSFORM
              INANNA_DESCENT → FAN_IN_MERGE
              ERESHKIGAL     → SCHEMA_CONFLICT
              TIAMAT_VORTEX  → É-DUBBA required
              ENLIL_BREATH   → CLEAN_BULK_INGEST

            Godot Mode 4: PATTERN_DISCOVERY (white sparks)
            Godot Mode 5: TIAMAT_TEACHING (Maroon connection)
            DUB.SAR Dialog: 4 buttons in DubSar Theater

            "NISABA names what exists.
             She discovers it in the crowd.
             She recognises it in the data.
             They are the same truth in different forms."
             𒁾 Sealed.
          ══════════════════════════════════════════════════════════
          """)

    - name: "2.0 | Execute"
      ansible.builtin.command: "python3 {{ script_path }}"
      register: p83_out
      changed_when: true
    - name: "2.1 | Show"
      ansible.builtin.debug:
        msg: "{{ p83_out.stdout_lines }}"
    - name: "2.2 | Assert"
      ansible.builtin.assert:
        that: p83_out.rc == 0
