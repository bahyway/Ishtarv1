          //! DUB.SAR Permission Protocol
          //! "DUB.SAR is the sovereign authority. NISABA is the proposer."
          //! Every approval and rejection = immutable Permission-KAKI

          #![forbid(unsafe_code)]

          use enkidb_kaki::Kaki;
          use crate::registry::CrowdPattern;

          #[derive(Debug, Clone, PartialEq, serde::Serialize, serde::Deserialize)]
          pub enum PermissionDecision {
              /// DUB.SAR approved — UTNAPISHTIM will seal
              Approved,
              /// DUB.SAR rejected — observe more, re-propose after 3 more
              Rejected { reason: Option<String> },
              /// DUB.SAR permanent rejection — PUZRU_PATTERN forever
              PermanentReject { reason: String },
          }

          /// The request NISABA presents to DUB.SAR
          #[derive(Debug, Clone)]
          pub struct PermissionRequest {
              pub pattern_name:    String,
              pub pattern_kaki:    String,
              pub times_seen:      u32,
              pub first_site:      String,
              pub max_tiamat:      u8,
              pub is_dangerous:    bool,
              pub mashsharu_cert:  Option<String>,
              pub draft_tmpl:      String,
              pub nisaba_narration: String,
          }

          impl PermissionRequest {
              pub fn from_pattern(
                  pattern:         &CrowdPattern,
                  draft_tmpl:      String,
                  mashsharu_cert:  Option<String>,
              ) -> Self {
                  use crate::namer::AkkadianNamer;
                  let narration = AkkadianNamer::proposal_narration(
                      &pattern.name,
                      pattern.times_seen,
                      &pattern.first_site,
                      pattern.max_tiamat,
                      mashsharu_cert.is_some(),
                  );
                  Self {
                      pattern_name:    pattern.name.clone(),
                      pattern_kaki:    pattern.pattern_kaki.clone(),
                      times_seen:      pattern.times_seen,
                      first_site:      pattern.first_site.clone(),
                      max_tiamat:      pattern.max_tiamat,
                      is_dangerous:    pattern.is_dangerous,
                      mashsharu_cert,
                      draft_tmpl,
                      nisaba_narration: narration,
                  }
              }
          }

          /// Immutable record of DUB.SAR's decision
          /// Every decision = Permission-KAKI in zakāru journal
          #[derive(Debug, Clone, serde::Serialize, serde::Deserialize)]
          pub struct PermissionKaki {
              /// κ[6]=0x02 Event, κ[7]=0xD0 DUB_SAR_DECISION
              pub kaki_hex:        String,
              pub pattern_name:    String,
              pub decision:        PermissionDecision,
              pub decided_by:      String,  // always "DUB.SAR 𒁾"
              pub decision_epoch:  u64,
              pub mashsharu_cert:  Option<String>,
              pub template_kaki:   Option<String>,
          }

          impl PermissionKaki {
              pub fn new(
                  request:    &PermissionRequest,
                  decision:   PermissionDecision,
                  epoch:      u64,
                  tmpl_kaki:  Option<String>,
              ) -> Self {
                  let hash = enkidb_kaki::fnv1a_u32(
                      format!("{}_{}", request.pattern_name, epoch).as_bytes()
                  );
                  let kaki = Kaki::mint(hash, 0x0001,
                      enkidb_kaki::KakiType::Event, 0xD0);
                  let kaki_hex = kaki.bytes.iter()
                      .map(|b| format!("{:02X}", b)).collect::<String>();

                  let decision_label = match &decision {
                      PermissionDecision::Approved          => "APPROVED",
                      PermissionDecision::Rejected { .. }   => "REJECTED",
                      PermissionDecision::PermanentReject {..} => "PERMANENT_REJECT",
                  };
                  println!(
                      "[DUB.SAR 𒁾] Decision on '{}': {} — immutable KAKI: {}",
                      request.pattern_name, decision_label, &kaki_hex[..16]
                  );

                  Self {
                      kaki_hex,
                      pattern_name:   request.pattern_name.clone(),
                      decision,
                      decided_by:     "DUB.SAR 𒁾".into(),
                      decision_epoch: epoch,
                      mashsharu_cert: request.mashsharu_cert.clone(),
                      template_kaki:  tmpl_kaki,
                  }
              }
          }

          #[cfg(test)]
          mod tests {
              use super::*;
              use crate::registry::{CrowdPattern, PatternStatus};
              use shamash::tribe::TribeType;

              #[test]
              fn test_permission_kaki_immutable() {
                  let req = PermissionRequest {
                      pattern_name: "NANNA_ISLAND".into(),
                      pattern_kaki: "ABC123".into(),
                      times_seen: 3, first_site: "Najaf".into(),
                      max_tiamat: 1, is_dangerous: false,
                      mashsharu_cert: Some("CERT_001".into()),
                      draft_tmpl: "draft".into(),
                      nisaba_narration: "narration".into(),
                  };
                  let pk1 = PermissionKaki::new(
                      &req, PermissionDecision::Approved, 1000, None);
                  let pk2 = PermissionKaki::new(
                      &req, PermissionDecision::Approved, 1001, None);
                  // Different epochs → different KAKIs (immutable per decision)
                  assert_ne!(pk1.kaki_hex, pk2.kaki_hex);
              }

              #[test]
              fn test_decided_by_is_always_dubsar() {
                  let req = PermissionRequest {
                      pattern_name: "TEST".into(), pattern_kaki: "".into(),
                      times_seen: 3, first_site: "test".into(),
                      max_tiamat: 0, is_dangerous: false,
                      mashsharu_cert: None, draft_tmpl: "".into(),
                      nisaba_narration: "".into(),
                  };
                  let pk = PermissionKaki::new(
                      &req, PermissionDecision::Approved, 0, None);
                  assert_eq!(pk.decided_by, "DUB.SAR 𒁾");
              }
          }
          """))

