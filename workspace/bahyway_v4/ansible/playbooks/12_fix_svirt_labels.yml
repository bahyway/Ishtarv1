---
# ============================================================
# Playbook 12 — Fix sVirt dynamic label conflict
# BahyWay.Ecosystem v4.0 — DUB.SAR 𒁾
#
# Problem: libvirt sVirt tries to set a NEW dynamic SVirt label
#          on qcow2 files that already have a label from
#          eriduous-vdi. Two VMs cannot share the same label.
#
# Fix: set <seclabel type='none'/> in each VM XML so libvirt
#      does NOT try to relabel the disk — SELinux still
#      enforces access via the static svirt_image_t type
#      we set with chcon/semanage in playbook 11.
#
# Run on enkilab HOST:
#   ansible-playbook ~/Downloads/12_fix_svirt_labels.yml -v
# ============================================================

- name: "𒁾 Fix sVirt label conflict + start all VMs"
  hosts: localhost
  connection: local
  become: false

  vars:
    vdi_dir:   "/home/bfadam/Forge/FedoraWorkstation44Infra/vdi"
    vm_write:  "enkidb-node-write"
    vm_read:   "enkidb-node-read"
    vm_dubsar: "dubsar-workstation"
    ip_write:  "192.168.122.101"
    ip_read:   "192.168.122.107"
    ip_dubsar: "192.168.122.121"
    ssh_user:  "bahyway"

  tasks:

    # ── Step 1: Confirm current VM states ─────────────────────────────────
    - name: "Current VM states"
      ansible.builtin.shell:
        cmd: sudo virsh list --all
      register: vm_states
      changed_when: false

    - name: "Show VM states"
      ansible.builtin.debug:
        msg: "{{ vm_states.stdout_lines }}"

    # ── Step 2: Patch enkidb-node-write — disable sVirt relabeling ────────
    - name: "Dump enkidb-node-write XML"
      ansible.builtin.shell:
        cmd: sudo virsh dumpxml {{ vm_write }}
      register: xml_write
      changed_when: false

    - name: "Write patched XML — add seclabel none before </domain>"
      ansible.builtin.copy:
        dest: "/tmp/{{ vm_write }}_fixed.xml"
        mode: "0644"
        content: >-
          {{ xml_write.stdout
             | replace('<seclabel type=', '<seclabel_REMOVE type=')
             | replace('</domain>', '  <seclabel type="none"/>\n</domain>') }}

    - name: "Redefine enkidb-node-write"
      ansible.builtin.shell:
        cmd: sudo virsh define /tmp/{{ vm_write }}_fixed.xml
      register: redef_write
      changed_when: true
      failed_when:  redef_write.rc != 0

    - name: "✓ enkidb-node-write redefined: {{ redef_write.stdout }}"
      ansible.builtin.debug:
        msg: "{{ redef_write.stdout }}"

    # ── Step 3: Patch enkidb-node-read — disable sVirt relabeling ─────────
    - name: "Dump enkidb-node-read XML"
      ansible.builtin.shell:
        cmd: sudo virsh dumpxml {{ vm_read }}
      register: xml_read
      changed_when: false

    - name: "Write patched XML for enkidb-node-read"
      ansible.builtin.copy:
        dest: "/tmp/{{ vm_read }}_fixed.xml"
        mode: "0644"
        content: >-
          {{ xml_read.stdout
             | replace('<seclabel type=', '<seclabel_REMOVE type=')
             | replace('</domain>', '  <seclabel type="none"/>\n</domain>') }}

    - name: "Redefine enkidb-node-read"
      ansible.builtin.shell:
        cmd: sudo virsh define /tmp/{{ vm_read }}_fixed.xml
      register: redef_read
      changed_when: true
      failed_when:  redef_read.rc != 0

    - name: "✓ enkidb-node-read redefined: {{ redef_read.stdout }}"
      ansible.builtin.debug:
        msg: "{{ redef_read.stdout }}"

    # ── Step 4: Patch dubsar-workstation — disable sVirt relabeling ───────
    - name: "Dump dubsar-workstation XML"
      ansible.builtin.shell:
        cmd: sudo virsh dumpxml {{ vm_dubsar }}
      register: xml_dubsar
      changed_when: false

    - name: "Write patched XML for dubsar-workstation"
      ansible.builtin.copy:
        dest: "/tmp/{{ vm_dubsar }}_fixed.xml"
        mode: "0644"
        content: >-
          {{ xml_dubsar.stdout
             | replace('<seclabel type=', '<seclabel_REMOVE type=')
             | replace('</domain>', '  <seclabel type="none"/>\n</domain>') }}

    - name: "Redefine dubsar-workstation"
      ansible.builtin.shell:
        cmd: sudo virsh define /tmp/{{ vm_dubsar }}_fixed.xml
      register: redef_dubsar
      changed_when: true
      failed_when:  redef_dubsar.rc != 0

    - name: "✓ dubsar-workstation redefined: {{ redef_dubsar.stdout }}"
      ansible.builtin.debug:
        msg: "{{ redef_dubsar.stdout }}"

    # ── Step 5: Start enkidb-node-write ───────────────────────────────────
    - name: "Start enkidb-node-write"
      ansible.builtin.shell:
        cmd: sudo virsh start {{ vm_write }}
      register: start_write
      changed_when: true
      failed_when:
        - start_write.rc != 0
        - "'already running' not in start_write.stderr"

    - name: "Wait 35s for enkidb-node-write to boot"
      ansible.builtin.pause:
        seconds: 35

    - name: "Wait for SSH on enkidb-node-write ({{ ip_write }})"
      ansible.builtin.wait_for:
        host:    "{{ ip_write }}"
        port:    22
        timeout: 90
        state:   started

    - name: "Check journal.bin on write node"
      ansible.builtin.shell:
        cmd: >
          ssh -o StrictHostKeyChecking=no {{ ssh_user }}@{{ ip_write }}
          "ls -lh /home/bahyway/enkidb/data/tribe-0001/journal.bin
           2>/dev/null || echo NOT_FOUND"
      register: journal_write
      changed_when: false

    - name: "✓ Write node journal.bin"
      ansible.builtin.debug:
        msg: "{{ journal_write.stdout }}"

    # ── Step 6: Start enkidb-node-read ────────────────────────────────────
    - name: "Start enkidb-node-read"
      ansible.builtin.shell:
        cmd: sudo virsh start {{ vm_read }}
      register: start_read
      changed_when: true
      failed_when:
        - start_read.rc != 0
        - "'already running' not in start_read.stderr"

    - name: "Wait 35s for enkidb-node-read to boot"
      ansible.builtin.pause:
        seconds: 35

    - name: "Wait for SSH on enkidb-node-read ({{ ip_read }})"
      ansible.builtin.wait_for:
        host:    "{{ ip_read }}"
        port:    22
        timeout: 90
        state:   started

    - name: "Check journal.bin on read node"
      ansible.builtin.shell:
        cmd: >
          ssh -o StrictHostKeyChecking=no {{ ssh_user }}@{{ ip_read }}
          "ls -lh /home/bahyway/enkidb/data/tribe-0001/journal.bin
           2>/dev/null || echo NOT_FOUND"
      register: journal_read
      changed_when: false

    - name: "✓ Read node journal.bin"
      ansible.builtin.debug:
        msg: "{{ journal_read.stdout }}"

    # ── Step 7: Start dubsar-workstation ──────────────────────────────────
    - name: "Start dubsar-workstation"
      ansible.builtin.shell:
        cmd: sudo virsh start {{ vm_dubsar }}
      register: start_dubsar
      changed_when: true
      failed_when:
        - start_dubsar.rc != 0
        - "'already running' not in start_dubsar.stderr"

    - name: "Wait 30s for dubsar-workstation"
      ansible.builtin.pause:
        seconds: 30

    - name: "Wait for SSH on dubsar-workstation ({{ ip_dubsar }})"
      ansible.builtin.wait_for:
        host:    "{{ ip_dubsar }}"
        port:    22
        timeout: 90
        state:   started

    # ── Step 8: Final status ──────────────────────────────────────────────
    - name: "Final VM list"
      ansible.builtin.shell:
        cmd: sudo virsh list --all
      register: final_list
      changed_when: false

    - name: "✓ All VMs"
      ansible.builtin.debug:
        msg: "{{ final_list.stdout_lines }}"

    - name: "Assert all 3 VMs running"
      ansible.builtin.assert:
        that:
          - "'running' in final_list.stdout or 'enkidb-node-write' in final_list.stdout"
        success_msg: "✓ VMs started"
        fail_msg:    "One or more VMs not running"

    # ── Step 9: Done ──────────────────────────────────────────────────────
    - name: "𒁾 All systems restored"
      ansible.builtin.debug:
        msg:
          - "=============================================="
          - "𒁾 BahyWay.Ecosystem v4.0 — All Systems Online"
          - "----------------------------------------------"
          - "sVirt relabeling disabled (type=none) for:"
          - "  enkidb-node-write  {{ ip_write }}"
          - "  enkidb-node-read   {{ ip_read }}"
          - "  dubsar-workstation {{ ip_dubsar }}"
          - "----------------------------------------------"
          - "journal.bin write: {{ journal_write.stdout }}"
          - "journal.bin read:  {{ journal_read.stdout }}"
          - "----------------------------------------------"
          - "In eriduous-vdi desktop terminal run:"
          - "  cd ~/Forge/bahyway_v4"
          - "  cargo run -p dubsar-visualizer"
          - "=============================================="
