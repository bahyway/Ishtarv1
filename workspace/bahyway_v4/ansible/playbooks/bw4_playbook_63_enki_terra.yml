- name: "PLAYBOOK 63 — ENKI-TERRA 𒀭𒂗𒆳𒆳 Environmental Intelligence Foundation"
  hosts: eriduous_vdi
  gather_facts: false
  become: false

  vars:
    forge_root:  "/home/bahyway/Forge/bahyway_v4"
    script_path: "/tmp/bw_63_enki_terra.py"

  tasks:

    - name: "1.0 | Write bw_63_enki_terra.py"
      ansible.builtin.copy:
        dest: "{{ script_path }}"
        mode: "0755"
        content: |
          #!/usr/bin/env python3
          # ENKI-TERRA Foundation — BahyWay.Ecosystem v4.0 — DUB.SAR 𒁾
          import os, subprocess, sys, textwrap

          FORGE  = "/home/bahyway/Forge/bahyway_v4"
          CRATE  = f"{FORGE}/crates/enki-terra"
          SRC    = f"{CRATE}/src"

          for d in [SRC,
              f"{SRC}/spectral", f"{SRC}/linear",
              f"{SRC}/fusion",   f"{SRC}/particle"]:
              os.makedirs(d, exist_ok=True)

          write = lambda p, c: open(p, "w").write(c)

          # ── Cargo.toml ────────────────────────────────────────────────
          write(f"{CRATE}/Cargo.toml", textwrap.dedent("""\
          [package]
          name    = "enki-terra"
          version = "4.0.0"
          edition = "2021"
          authors = ["DUB.SAR 𒁾 — Bahaa Fadam"]
          description = "ENKI-TERRA 𒀭𒂗𒆳𒆳 Sovereign Environmental Intelligence"

          [dependencies]
          enkidb-kaki = { path = "../enkidb-kaki" }
          serde       = { version = "1", features = ["derive"] }
          """))

          # ── lib.rs ────────────────────────────────────────────────────
          write(f"{SRC}/lib.rs", textwrap.dedent("""\
          //! ENKI-TERRA 𒀭𒂗𒆳𒆳 — Sovereign Environmental Intelligence Foundation
          //! BahyWay.Ecosystem v4.0 — DUB.SAR 𒁾
          //!
          //! CONSTITUTIONAL AXIOM (sealed permanently):
          //!   "The people who need water most are the people whose infrastructure
          //!    is least documented. The families who waited 35 years deserve to
          //!    find their dead. ENKI-TERRA makes the invisible sovereign.
          //!    Every detection is a particle. Every particle is immutable.
          //!    Every particle belongs to the people above it."
          //!
          //! THREE ENGINES:
          //!   Engine 1: SpectralAnomalyDetector (HSI band analysis)
          //!   Engine 2: LinearFeatureExtractor  (Jordan NF eigenvectors)
          //!   Engine 3: MultiTemporalFusion     (CORONA + Sentinel + Drone)
          //!
          //! SIX ŠĀRU ACCUMULATORS (CORRECTED — was listed as FOUR):
          //!   ŠĀRU_water    ŠĀRU_health  ŠĀRU_thirst
          //!   ŠĀRU_sediment ŠĀRU_justice ŠĀRU_memory
          //!
          //! KAKI v4.0: quality in EAV only, κ[6]=kaki_type, κ[7]=kaki_role

          #![forbid(unsafe_code)]

          pub mod spectral;
          pub mod linear;
          pub mod fusion;
          pub mod particle;

          // ── SIX ŠĀRU Accumulator Types (sealed) ──────────────────────

          /// CORRECTED: SIX accumulators (not four as in original header)
          #[derive(Debug, Clone, PartialEq, serde::Serialize, serde::Deserialize)]
          pub enum SharuType {
              /// Water volume loss × days (pipeline / river)
              Water,
              /// Population × contamination × days (Basra drinking water)
              Health,
              /// Population × (daily_need - access) × days (Sahel dry season)
              Thirst,
              /// Sediment_rate × days (Iraqi river dredging urgency)
              Sediment,
              /// (1 - identification_confidence) × days_since_death (mass graves)
              Justice,
              /// (1 - grave_confidence) × days_since_burial (Wadi al-Salam)
              Memory,
          }

          /// One ŠĀRU accumulation event — minted as Event-KAKI
          #[derive(Debug, Clone, serde::Serialize, serde::Deserialize)]
          pub struct SharuEvent {
              /// Which accumulator type
              pub sharu_type:   SharuType,
              /// Accumulated deficit value
              pub value:        f64,
              /// Number of days accumulating
              pub days:         u32,
              /// The geographic zone (tribe_id maps to zone)
              pub zone_id:      u16,
              /// Confidence in the measurement (EAV quality — not KAKI bytes)
              pub eav_quality:  f32,
          }

          impl SharuEvent {
              pub fn water(volume_loss: f64, days: u32, zone_id: u16, confidence: f32) -> Self {
                  Self { sharu_type: SharuType::Water,
                      value: volume_loss * days as f64, days, zone_id,
                      eav_quality: confidence }
              }

              pub fn justice(id_confidence: f32, days_since_death: u32,
                             zone_id: u16) -> Self {
                  Self { sharu_type: SharuType::Justice,
                      value: (1.0 - id_confidence as f64) * days_since_death as f64,
                      days: days_since_death, zone_id,
                      eav_quality: id_confidence }
              }

              pub fn memory(grave_confidence: f32, days_since_burial: u32,
                            zone_id: u16) -> Self {
                  Self { sharu_type: SharuType::Memory,
                      value: (1.0 - grave_confidence as f64) * days_since_burial as f64,
                      days: days_since_burial, zone_id,
                      eav_quality: grave_confidence }
              }
          }

          /// Detection confidence levels map to TIAMAT alert levels
          /// (EAV quality field — never KAKI bytes)
          pub fn tiamat_level(eav_quality: f32) -> u8 {
              if eav_quality >= 0.70 { 1 }       // DILBAT — monitoring
              else if eav_quality >= 0.55 { 2 }  // KAKKAB — act soon
              else if eav_quality >= 0.40 { 3 }  // ERRA   — urgent
              else { 4 }                           // KUR    — critical
          }

          /// KUR threshold (sealed: 0.40)
          pub const KUR_THRESHOLD: f32 = 0.40;

          /// Colour constants (sealed)
          pub const COLOUR_KUR:   &str = "#1A0A2E";  // sovereign indigo
          pub const COLOUR_ERRA:  &str = "#CC2244";  // crimson
          pub const COLOUR_DEAD:  &str = "#404040";  // dark grey (NOT #800000)
          // NOTE: #800000 Maroon = NERGAL AV engine only — never used here

          #[cfg(test)]
          mod tests {
              use super::*;

              #[test]
              fn test_six_sharu_accumulators() {
                  // CORRECTED: six not four
                  let types = [
                      SharuType::Water, SharuType::Health, SharuType::Thirst,
                      SharuType::Sediment, SharuType::Justice, SharuType::Memory,
                  ];
                  assert_eq!(types.len(), 6);
              }

              #[test]
              fn test_justice_sharu_1991_victim() {
                  // 1991 victim: 35 years × 365 = 12,775 days
                  let ev = SharuEvent::justice(0.05, 12775, 1);
                  assert!(ev.value > 10000.0);
                  // When family finds victim: ŠĀRU stops
                  let found = SharuEvent::justice(1.0, 12775, 1);
                  assert_eq!(found.value, 0.0);
              }

              #[test]
              fn test_kur_colour_not_maroon() {
                  assert_eq!(COLOUR_KUR, "#1A0A2E");
                  assert_ne!(COLOUR_DEAD, "#800000");
                  assert_eq!(COLOUR_DEAD, "#404040");
              }

              #[test]
              fn test_tiamat_level_kur_below_threshold() {
                  assert_eq!(tiamat_level(0.35), 4); // KUR
                  assert_eq!(tiamat_level(0.45), 3); // ERRA
                  assert_eq!(tiamat_level(0.65), 2); // KAKKAB
                  assert_eq!(tiamat_level(0.85), 1); // DILBAT
              }
          }
          """))

          # ── spectral/mod.rs ───────────────────────────────────────────
          write(f"{SRC}/spectral/mod.rs", textwrap.dedent("""\
          //! ENKI-TERRA Engine 1 — SpectralAnomalyDetector
          //! Hyperspectral Imaging (HSI) band analysis
          //! Detects: pipeline leaks, contamination plumes,
          //!          settlement water topology, burial site signatures

          #![forbid(unsafe_code)]

          /// HSI spectral band in nanometres
          #[derive(Debug, Clone, Copy)]
          pub struct SpectralBand {
              pub centre_nm:   f32,
              pub width_nm:    f32,
              pub reflectance: f32,  // 0.0–1.0
          }

          /// Spectral anomaly detection result
          #[derive(Debug, Clone)]
          pub struct SpectralAnomaly {
              /// Geographic coordinates of detection
              pub lat: f64,
              pub lon: f64,
              /// Dominant anomaly type
              pub anomaly_type: AnomalyType,
              /// Detection confidence (becomes eav_quality in EAV)
              pub confidence: f32,
              /// Primary bands that triggered detection
              pub trigger_bands: Vec<SpectralBand>,
          }

          #[derive(Debug, Clone, PartialEq)]
          pub enum AnomalyType {
              /// Pipeline water loss (moisture + vegetation anomaly)
              PipelineLeak,
              /// Sewage contamination (chlorophyll-a + thermal)
              SewageOutfall,
              /// Oil field contamination (BTEX 2280-2350nm)
              OilfieldContamination,
              /// Soil disturbance (mass grave signature)
              SoilDisturbance,
              /// Phreatophyte vegetation (groundwater indicator)
              GroundwaterIndicator,
              /// Encalcification (calcium carbonate 2340nm)
              RiverEncalcification,
          }

          pub struct SpectralAnomalyDetector {
              pub sensitivity: f32,  // 0.0–1.0
          }

          impl SpectralAnomalyDetector {
              pub fn new(sensitivity: f32) -> Self { Self { sensitivity } }

              /// Detect anomalies from a set of spectral bands at a location
              pub fn detect(
                  &self,
                  lat: f64, lon: f64,
                  bands: &[SpectralBand],
              ) -> Vec<SpectralAnomaly> {
                  let mut anomalies = Vec::new();

                  // Pipeline leak: moisture retention at 1450nm + 1940nm
                  let moisture_1450 = bands.iter().find(|b| (b.centre_nm - 1450.0).abs() < 50.0);
                  if let Some(b) = moisture_1450 {
                      if b.reflectance > 0.15 * self.sensitivity {
                          anomalies.push(SpectralAnomaly {
                              lat, lon,
                              anomaly_type: AnomalyType::PipelineLeak,
                              confidence: b.reflectance.min(0.95),
                              trigger_bands: vec![*b],
                          });
                      }
                  }

                  // Soil disturbance: backfill NIR anomaly 750-900nm
                  let nir = bands.iter().find(|b| (b.centre_nm - 800.0).abs() < 80.0);
                  if let Some(b) = nir {
                      if b.reflectance < 0.20 && b.reflectance > 0.05 {
                          anomalies.push(SpectralAnomaly {
                              lat, lon,
                              anomaly_type: AnomalyType::SoilDisturbance,
                              confidence: (0.20 - b.reflectance) * 3.0,
                              trigger_bands: vec![*b],
                          });
                      }
                  }

                  anomalies
              }
          }

          #[cfg(test)]
          mod tests {
              use super::*;

              #[test]
              fn test_pipeline_leak_detected() {
                  let detector = SpectralAnomalyDetector::new(0.8);
                  let bands = vec![
                      SpectralBand { centre_nm: 1450.0, width_nm: 30.0, reflectance: 0.25 }
                  ];
                  let results = detector.detect(33.0, 44.0, &bands);
                  assert!(!results.is_empty());
                  assert_eq!(results[0].anomaly_type, AnomalyType::PipelineLeak);
              }

              #[test]
              fn test_soil_disturbance_mass_grave() {
                  let detector = SpectralAnomalyDetector::new(0.7);
                  let bands = vec![
                      SpectralBand { centre_nm: 800.0, width_nm: 50.0, reflectance: 0.12 }
                  ];
                  let results = detector.detect(32.5, 44.5, &bands);
                  assert!(!results.is_empty());
                  assert_eq!(results[0].anomaly_type, AnomalyType::SoilDisturbance);
              }
          }
          """))

          # ── linear/mod.rs ─────────────────────────────────────────────
          write(f"{SRC}/linear/mod.rs", textwrap.dedent("""\
          //! ENKI-TERRA Engine 2 — LinearFeatureExtractor
          //! Jordan Normal Form eigenvector analysis
          //! Detects: buried pipeline routes, ancient channels,
          //!          settlement water network topology

          #![forbid(unsafe_code)]

          /// A detected linear feature (pipeline, channel, fault)
          #[derive(Debug, Clone)]
          pub struct LinearFeature {
              pub start_lat: f64, pub start_lon: f64,
              pub end_lat:   f64, pub end_lon:   f64,
              pub feature_type: LinearType,
              pub confidence:   f32,
              pub length_m:     f32,
          }

          #[derive(Debug, Clone, PartialEq)]
          pub enum LinearType {
              BuriedPipeline,
              AncientChannel,   // palaeo-channel → groundwater
              FaultLine,        // structural geology
              WaterNetwork,     // informal settlement organic topology
              RoadAlignment,    // infrastructure context
          }

          pub struct LinearFeatureExtractor {
              pub min_length_m: f32,
          }

          impl LinearFeatureExtractor {
              pub fn new(min_length_m: f32) -> Self { Self { min_length_m } }

              /// Extract linear features from elevation + SAR data
              /// Production: Jordan NF eigenvector decomposition
              /// MVP: directional gradient threshold detection
              pub fn extract(&self, samples: &[(f64, f64, f32)]) -> Vec<LinearFeature> {
                  let mut features = Vec::new();
                  if samples.len() < 2 { return features; }

                  for window in samples.windows(3) {
                      let (lat1, lon1, v1) = window[0];
                      let (lat2, lon2, v2) = window[1];
                      let (_lat3, _lon3, v3) = window[2];

                      // Detect linear gradient pattern
                      let d1 = (v2 - v1).abs();
                      let d2 = (v3 - v2).abs();

                      if d1 > 0.3 && d2 > 0.3 && (d1 - d2).abs() < 0.1 {
                          let length = Self::haversine_m(lat1, lon1, lat2, lon2);
                          if length >= self.min_length_m {
                              features.push(LinearFeature {
                                  start_lat: lat1, start_lon: lon1,
                                  end_lat:   lat2, end_lon:   lon2,
                                  feature_type: LinearType::BuriedPipeline,
                                  confidence:   ((d1 + d2) / 2.0).min(0.90),
                                  length_m: length,
                              });
                          }
                      }
                  }
                  features
              }

              fn haversine_m(lat1: f64, lon1: f64, lat2: f64, lon2: f64) -> f32 {
                  let r = 6_371_000.0f64;
                  let dlat = (lat2 - lat1).to_radians();
                  let dlon = (lon2 - lon1).to_radians();
                  let a = (dlat/2.0).sin().powi(2)
                      + lat1.to_radians().cos()
                      * lat2.to_radians().cos()
                      * (dlon/2.0).sin().powi(2);
                  (r * 2.0 * a.sqrt().atan2((1.0-a).sqrt())) as f32
              }
          }
          """))

          # ── fusion/mod.rs ─────────────────────────────────────────────
          write(f"{SRC}/fusion/mod.rs", textwrap.dedent("""\
          //! ENKI-TERRA Engine 3 — MultiTemporalFusion
          //! Fuses: CORONA declassified (1960s-80s) + Sentinel + Drone
          //! Change detection across decades
          //! Reveals: pre-crime vs post-crime soil disturbance

          #![forbid(unsafe_code)]

          #[derive(Debug, Clone, PartialEq)]
          pub enum ImageSource {
              Corona1960s,   // declassified spy satellite
              Sentinel2,     // ESA multispectral
              Sentinel1Sar,  // penetrates dry sand 1-2m
              Drone,         // local high-resolution
              Grace,         // NASA/DLR gravity (aquifer detection)
          }

          #[derive(Debug, Clone)]
          pub struct TemporalImage {
              pub source:    ImageSource,
              pub epoch:     i64,   // unix timestamp
              pub bands:     Vec<f32>,
          }

          #[derive(Debug, Clone)]
          pub struct TemporalChange {
              pub lat:       f64,
              pub lon:       f64,
              pub from_epoch: i64,
              pub to_epoch:  i64,
              pub magnitude: f32,
              pub change_type: ChangeType,
              pub confidence: f32,
          }

          #[derive(Debug, Clone, PartialEq)]
          pub enum ChangeType {
              SoilDisturbed,       // mass grave / construction
              VegetationAnomaly,   // groundwater / contamination
              WaterBodyChange,     // river / pipeline
              ThermalAnomaly,      // underground cavity / decomposition
          }

          pub struct MultiTemporalFusion;

          impl MultiTemporalFusion {
              /// Detect changes between two temporal images at same location
              pub fn detect_change(
                  before: &TemporalImage,
                  after:  &TemporalImage,
                  lat: f64, lon: f64,
              ) -> Option<TemporalChange> {
                  if before.bands.len() != after.bands.len() { return None; }

                  let magnitude = before.bands.iter().zip(after.bands.iter())
                      .map(|(b, a)| (a - b).abs())
                      .sum::<f32>() / before.bands.len() as f32;

                  if magnitude < 0.05 { return None; }

                  let change_type = if magnitude > 0.5 {
                      ChangeType::SoilDisturbed
                  } else if magnitude > 0.3 {
                      ChangeType::VegetationAnomaly
                  } else {
                      ChangeType::WaterBodyChange
                  };

                  Some(TemporalChange {
                      lat, lon,
                      from_epoch: before.epoch,
                      to_epoch:   after.epoch,
                      magnitude,
                      change_type,
                      confidence: (magnitude * 1.5).min(0.95),
                  })
              }
          }

          #[cfg(test)]
          mod tests {
              use super::*;

              #[test]
              fn test_pre_post_crime_change_detected() {
                  let before = TemporalImage {
                      source: ImageSource::Corona1960s,
                      epoch: -200_000_000,  // 1963
                      bands: vec![0.4, 0.3, 0.5],
                  };
                  let after = TemporalImage {
                      source: ImageSource::Sentinel2,
                      epoch: 700_000_000,  // 1992
                      bands: vec![0.8, 0.7, 0.9],
                  };
                  let change = MultiTemporalFusion::detect_change(&before, &after, 32.0, 44.5);
                  assert!(change.is_some());
                  assert_eq!(change.unwrap().change_type, ChangeType::SoilDisturbed);
              }
          }
          """))

          # ── particle/mod.rs ───────────────────────────────────────────
          write(f"{SRC}/particle/mod.rs", textwrap.dedent("""\
          //! ENKI-TERRA — Detection Particle Minter
          //! Every detection becomes an immutable KAKI particle
          //!
          //! KAKI v4.0:
          //!   κ[6] = 0x02 Event-KAKI
          //!   κ[7] = detection role (see DetectionRole)
          //!   eav_quality = detection confidence (EAV — never KAKI bytes)

          #![forbid(unsafe_code)]

          use enkidb_kaki::Kaki;
          use crate::SharuType;

          #[repr(u8)]
          pub enum DetectionRole {
              PipelineLeak      = 0x10,
              WaterContamination = 0x11,
              GroundwaterSite   = 0x12,
              SoilDisturbance   = 0x13,  // possible mass grave
              BurialSite        = 0x14,  // Wadi al-Salam
              MassGraveSite     = 0x15,
          }

          pub struct DetectionParticle {
              pub kaki:        Kaki,
              pub lat:         f64,
              pub lon:         f64,
              /// EAV — detection confidence — NEVER in KAKI bytes
              pub eav_quality: f32,
              pub sharu_type:  SharuType,
              pub sharu_value: f64,
          }

          impl DetectionParticle {
              pub fn mint(
                  lat: f64, lon: f64,
                  confidence: f32,
                  role: DetectionRole,
                  tribe_id: u16,
                  sharu_type: SharuType,
                  sharu_value: f64,
              ) -> Self {
                  let geo_hash = enkidb_kaki::fnv1a_u32(
                      format!("{:.6}:{:.6}", lat, lon).as_bytes()
                  );
                  Self {
                      kaki: Kaki::mint(geo_hash, tribe_id,
                          enkidb_kaki::KakiType::Event, role as u8),
                      lat, lon,
                      eav_quality: confidence,  // EAV — not KAKI bytes
                      sharu_type,
                      sharu_value,
                  }
              }
          }
          """))

          # ── Register + build ──────────────────────────────────────────
          ws = f"{FORGE}/Cargo.toml"
          with open(ws) as f: c = f.read()
          if '"crates/enki-terra"' not in c:
              c = c.replace('members = [', 'members = [\n    "crates/enki-terra",')
              open(ws, "w").write(c)

          r = subprocess.run(["cargo", "build", "-p", "enki-terra"],
              cwd=FORGE, capture_output=True, text=True)
          if r.returncode != 0: print(r.stderr[-3000:]); sys.exit(1)

          t = subprocess.run(["cargo", "test", "-p", "enki-terra", "--", "--nocapture"],
              cwd=FORGE, capture_output=True, text=True)
          if t.returncode != 0: print(t.stdout[-2000:]); sys.exit(1)

          print("""
          ══════════════════════════════════════════════════════════
            PLAYBOOK 63 — ENKI-TERRA 𒀭𒂗𒆳𒆳 COMPLETE
            3 engines + 6 ŠĀRU accumulators + particle minter
            Constitutional axiom sealed.
            Every detection is a particle. Every particle is immutable.
            Every particle belongs to the people above it.
          ══════════════════════════════════════════════════════════
          """)

    - name: "2.0 | Execute"
      ansible.builtin.command: "python3 {{ script_path }}"
      register: p63_out
      changed_when: true
    - name: "2.1 | Show"
      ansible.builtin.debug:
        msg: "{{ p63_out.stdout_lines }}"
    - name: "2.2 | Assert"
      ansible.builtin.assert:
        that: p63_out.rc == 0
        success_msg: "✓ ENKI-TERRA 𒀭𒂗𒆳𒆳 foundation sealed"
        fail_msg:    "✗ ENKI-TERRA build failed"
