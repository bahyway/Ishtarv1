    # ── Add to workspace Cargo.toml ───────────────────────────────────────────
    - name: "Add con-engine to workspace"
      ansible.builtin.copy:
        dest: "/tmp/bw_add_con_engine.py"
        mode: "0755"
        content: |
          #!/usr/bin/env python3
          import sys
          PATH = "/home/bahyway/Forge/bahyway_v4/Cargo.toml"
          with open(PATH) as f:
              src = f.read()
          if '"crates/con-engine"' in src:
              print("already in workspace"); sys.exit(0)
          src = src.replace(
              '"crates/enkidb-enlil-index"',
              '"crates/enkidb-enlil-index",\n    "crates/con-engine"'
          )
          with open(PATH, "w") as f:
              f.write(src)
          print("SUCCESS — con-engine added to workspace")

