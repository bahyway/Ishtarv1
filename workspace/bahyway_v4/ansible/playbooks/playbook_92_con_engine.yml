    # ── lib.rs ───────────────────────────────────────────────────────────────
    - name: "Write lib.rs — the sovereign wall"
      ansible.builtin.copy:
        dest: "{{ crate }}/src/lib.rs"
        content: |
          //! # ConEngine — Sovereign Connection Law
          //!
          //! One wall. One law. One debug point.
          //!
          //! Nothing in BahyWay touches EnkiDB directly.
          //! Everything speaks to ConEngine.
          //!
          //! ## 7 Connection Sovereignty Rules (CSR):
          //!   CSR-01  SargonPassport gates every connection
          //!   CSR-02  SovereignRole gates WRITE vs READ
          //!   CSR-03  Every frame NARU-journaled before wire
          //!   CSR-04  Credentials in AkkadiSafeEngine, never TOML
          //!   CSR-05  CrossTribe KAKI requires Gilgamesh Passport
          //!   CSR-06  Failures → KIBRATU event emission
          //!   CSR-07  Tribe isolation per connection
          //!
          //! ## Zero async runtime — std::net + std::thread only.
          //! ## NARU WAL pattern — file first, EnkiDB via NARU-SYNC later.
          //! ## CredentialStore trait — stub now, AkkadiSafeEngine later.

          #![forbid(unsafe_code)]

          pub mod error;
          pub mod rules;
          pub mod session;
          pub mod naru;
          pub mod fanout;

          use std::sync::Arc;

          pub use error::{ConEngineError, ConResult};
          pub use session::descriptor::{
              SargonPassport, GilgameshPassport, SovereignRole,
              KakiType, NodeType, SessionRole,
          };
          pub use rules::csr04_credentials::{CredentialStore, StubCredentialStore};
          pub use rules::csr06_kibratu::{KibratuSink, LogKibratuSink};

          use session::{SessionRegistry, ConnectionPool};
          use naru::NaruJournal;

          /// ConEngine configuration.
          pub struct ConEngineConfig {
              pub sessions_path: String,
              pub naru_path:     String,
              pub passport:      SargonPassport,
              pub role:          SovereignRole,
              pub credentials:   Box<dyn CredentialStore>,
              pub kibratu:       Box<dyn KibratuSink>,
              pub gilgamesh:     Option<GilgameshPassport>,
          }

          /// Query request — ŠUMU-UKIN fills this after PHYSICS predicate parse.
          pub struct ConQuery {
              pub tribe_ids:  Vec<u16>,
              pub node_type:  NodeType,
              pub frame:      Vec<u8>,
              pub kaki_type:  KakiType,
          }

          /// Write request — KISPU path.
          pub struct ConWrite {
              pub tribe_id: u16,
              pub frame:    Vec<u8>,
          }

          /// The sovereign connection wall.
          pub struct ConEngine {
              passport:  SargonPassport,
              role:      SovereignRole,
              gilgamesh: Option<GilgameshPassport>,
              registry:  SessionRegistry,
              pool:      Arc<ConnectionPool>,
              naru:      NaruJournal,
              kibratu:   Box<dyn KibratuSink>,
          }

          impl ConEngine {
              /// Boot ConEngine — call once at ŠUMU-UKIN or Godot IDE startup.
              pub fn boot(cfg: ConEngineConfig) -> ConResult<Self> {
                  // CSR-01: passport must be valid at boot
                  rules::csr01_sargon::check(&cfg.passport)?;

                  let registry = SessionRegistry::load(&cfg.sessions_path)?;
                  let naru     = NaruJournal::open(&cfg.naru_path)?;

                  // Boot pool — connect to all enabled sessions
                  let pool = Arc::new(
                      ConnectionPool::boot(
                          registry.all_enabled().cloned()
                      )
                  );

                  eprintln!("𒁾 ConEngine booted — {} sessions active",
                      pool.session_ids().len());

                  Ok(Self {
                      passport:  cfg.passport,
                      role:      cfg.role,
                      gilgamesh: cfg.gilgamesh,
                      registry,
                      pool,
                      naru,
                      kibratu:   cfg.kibratu,
                  })
              }

              /// Read query — fan-out across all sessions serving tribe_ids.
              pub fn query(&self, req: ConQuery) -> ConResult<Vec<fanout::FanOutResult>> {
                  // CSR-01
                  rules::csr01_sargon::check(&self.passport)?;
                  // CSR-05: CrossTribe requires Gilgamesh
                  for &tid in &req.tribe_ids {
                      rules::csr05_gilgamesh::check(
                          &req.kaki_type,
                          self.gilgamesh.as_ref(),
                          tid,
                      )?;
                  }
                  // Resolve sessions — CSR-02 enforced inside
                  let sessions = self.registry.resolve_multi(
                      &req.tribe_ids, &self.role, false
                  )?;
                  // CSR-03: NARU entry before any frame
                  for s in &sessions {
                      rules::csr03_naru::journal_before_frame(
                          &self.naru, &s.id,
                          req.tribe_ids.first().copied().unwrap_or(0),
                          &format!("{:?}", self.role),
                          &req.frame,
                      ).unwrap_or_else(|e|
                          eprintln!("NARU write failed (non-fatal): {e}")
                      );
                  }
                  // Fan-out
                  let targets: Vec<(String, u16)> = sessions.iter()
                      .flat_map(|s| {
                          if s.tribes.is_empty() {
                              req.tribe_ids.iter().map(|&t| (s.id.clone(), t)).collect::<Vec<_>>()
                          } else {
                              s.tribes.iter()
                                  .filter(|t| req.tribe_ids.contains(t))
                                  .map(|&t| (s.id.clone(), t))
                                  .collect()
                          }
                      })
                      .collect();

                  Ok(fanout::QueryFanOut::execute(
                      Arc::clone(&self.pool),
                      targets,
                      req.frame,
                  ))
              }

              /// Write — KISPU path. DubSar / TabletWriter only.
              pub fn write(&self, req: ConWrite) -> ConResult<Vec<u8>> {
                  // CSR-01
                  rules::csr01_sargon::check(&self.passport)?;
                  // CSR-02
                  rules::csr02_role::check_write(&self.role)?;
                  // Resolve WRITE session
                  let session = self.registry.resolve(req.tribe_id, &self.role, true)?;
                  // CSR-03
                  rules::csr03_naru::journal_before_frame(
                      &self.naru, &session.id, req.tribe_id,
                      &format!("{:?}", self.role), &req.frame,
                  ).unwrap_or_else(|e|
                      eprintln!("NARU write failed (non-fatal): {e}")
                  );
                  // Send frame
                  match self.pool.get(&session.id) {
                      Some(conn) => conn.send_frame(&req.frame, req.tribe_id),
                      None => {
                          let e = ConEngineError::ConnectionFailed {
                              host:   session.host.clone(),
                              port:   session.port,
                              reason: "session not in pool".into(),
                          };
                          rules::csr06_kibratu::emit_for_error(
                              self.kibratu.as_ref(), &e, &session.id
                          );
                          Err(e)
                      }
                  }
              }
          }

