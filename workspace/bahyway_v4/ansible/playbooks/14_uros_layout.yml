---
# ============================================================
# Playbook 14 — UrOS v4.0 Sovereign IDE Layout
# BahyWay.Ecosystem v4.0 — DUB.SAR 𒁾
#
# Creates the complete NISABA-style dual-sidebar layout:
#   Left  sidebar: miniature viz panels → click → floating window
#   Centre:        5 sovereign language tabs with editor + runner
#   Right sidebar: live viz panels → click → floating window
#   NABA:          floating hologram agent (summon button top-right)
#
# Two changes:
#   1. NEW FILE: panels/uros_layout.rs  (~700 lines)
#   2. EDIT:     panels/mod.rs  (add pub mod + UrOS variant)
#   3. EDIT:     app.rs         (add UrOS tab as DEFAULT panel)
#
# Run from eriduous-vdi:
#   ansible-playbook playbooks/14_uros_layout.yml -v
# ============================================================

- name: "𒁾 UrOS v4.0 — Sovereign IDE Layout"
  hosts: localhost
  connection: local
  become: false

  vars:
    forge:      "/home/bahyway/Forge/bahyway_v4"
    panels_dir: "/home/bahyway/Forge/bahyway_v4/crates/dubsar-visualizer/src/panels"
    app_rs:     "/home/bahyway/Forge/bahyway_v4/crates/dubsar-visualizer/src/app.rs"
    mod_rs:     "/home/bahyway/Forge/bahyway_v4/crates/dubsar-visualizer/src/panels/mod.rs"
    eridu_rs:   "/home/bahyway/Forge/bahyway_v4/crates/dubsar-visualizer/src/panels/uros_layout.rs"

  tasks:

    # ── Step 1: Backups ────────────────────────────────────────────────────
    - name: "Backup app.rs"
      ansible.builtin.copy:
        src:        "{{ app_rs }}"
        dest:       "{{ app_rs }}.bak14"
        remote_src: true
        mode:       "0644"

    - name: "Backup mod.rs"
      ansible.builtin.copy:
        src:        "{{ mod_rs }}"
        dest:       "{{ mod_rs }}.bak14"
        remote_src: true
        mode:       "0644"

    # ══════════════════════════════════════════════════════════════════════
    # CHANGE 1 — CREATE panels/uros_layout.rs
    # ══════════════════════════════════════════════════════════════════════
    - name: "Write panels/uros_layout.rs — UrOS sovereign layout"
      ansible.builtin.copy:
        dest: "{{ eridu_rs }}"
        mode: "0644"
        content: |
          //! 𒁾 UrOS v4.0 — Sovereign IDE Layout
          //!
          //! NISABA-style dual-sidebar layout:
          //!   Left  sidebar — miniature viz panels (click → floating window)
          //!   Centre        — 5 sovereign language tabs with editor + runner
          //!   Right sidebar — live viz panels (click → floating window)
          //!   NABA          — floating hologram agent (summon top-right)
          //!
          //! Language tabs:
          //!   1. HeptaScript  (.hepta) — W5H2 sovereign query language
          //!   2. AkkadianAOL  (.akk)   — sovereign orchestration language
          //!   3. PMPVD        (.pmpvd) — particles meta-programming
          //!   4. Way v2.0     (.way)   — security policy language
          //!   5. TemplateEngine(.tpl)  — EAV schema templates
          //!
          //! DUB.SAR 𒁾 — BahyWay.Ecosystem v4.0 | Pure Rust | eframe 0.29

          use std::sync::{Arc, RwLock};
          use egui::{
              Color32, FontId, Pos2, RichText, Rounding, Stroke,
              TextEdit, Ui, Vec2, Window,
          };
          use bee_mdm_bus::BeeMdmBusState;
          use crate::app::ParticleDemo;
          use crate::theme;

          // ── Language tab definitions ──────────────────────────────────────────
          #[derive(Clone, Copy, PartialEq, Eq, Debug)]
          pub enum LangTab {
              HeptaScript,
              AkkadianAol,
              Pmpvd,
              Way,
              Template,
          }

          impl LangTab {
              pub fn label(self) -> &'static str {
                  match self {
                      Self::HeptaScript => "⬡ HeptaScript",
                      Self::AkkadianAol => "𒀭 AAOL .akk",
                      Self::Pmpvd       => "◈ PMPVD",
                      Self::Way         => "🔒 Way v2.0",
                      Self::Template    => "📋 Templates",
                  }
              }
              pub fn extension(self) -> &'static str {
                  match self {
                      Self::HeptaScript => ".hepta",
                      Self::AkkadianAol => ".akk",
                      Self::Pmpvd       => ".pmpvd",
                      Self::Way         => ".way",
                      Self::Template    => ".tpl",
                  }
              }
              pub fn placeholder(self) -> &'static str {
                  match self {
                      Self::HeptaScript => "\
          -- HeptaScript W5H2 Query (.hepta)
          WHO   Citizens.E
          WHAT  E[name.given, city.name]
          WHERE E[city.name] = \"Najaf\"
          WHEN  AT EPOCH NOW
          WHY   QUALITY_BYTE > 200
          HOW   BY E[name.given] ASC
          HOW_MUCH LIMIT 50",
                      Self::AkkadianAol => "\
          -- AkkadianAOL (.akk)
          PARTICLE najaf_grave {
              person.name_arabic: TEXT(accuracy=0.98)
              death.date:         TIMESTAMP(timeliness=fresh)
              grave.coord:        COORDINATE(validity=WGS84)
              TRIBE:              NAJAF_CEMETERY
              KAKI:               auto
          }",
                      Self::Pmpvd => "\
          -- PMPVD (.pmpvd)
          PIPELINE najaf_intake v4.0 {
            FLOW intake {
              SOURCE: LandingZone(path=/home/bahyway/beemdm/zip_landing)
              PIPE:   Musaru(scan=malware)
              PIPE:   ZipEngine(format=all)
              SINK:   PermanentStorage(db=enkidb, fsync=PerCommit)
            }
          }",
                      Self::Way => "\
          -- Way v2.0 (.way)
          sovereign NajafPolicy {
              version: \"4.0.2\";
              domain_byte: 0x0001;
              hepta {
                  D1 (Accuracy):     0.25;
                  D2 (Completeness): 0.20;
                  D3 (Consistency):  0.15;
                  D4 (Validity):     0.20;
                  D5 (Uniqueness):   0.10;
                  D6 (Timeliness):   0.05;
                  D7 (Integrity):    0.05;
              }
              rules {
                  IF role = ARCHITECT AND seal = SargonSeal
                  THEN access = FULL_WRITE;
              }
          }",
                      Self::Template => "\
          -- TemplateEngine (.tpl)
          TEMPLATE civil_registry {
              FIELD name.given:    TEXT  required
              FIELD name.family:   TEXT  required
              FIELD birth.date:    DATE  required
              FIELD national.id:   KAKI  required
              FIELD district.code: TEXT  optional
              ORIGIN: ILKUM_DOC
          }",
                  }
              }
          }

          // ── Floating panel state ──────────────────────────────────────────────
          #[derive(Default)]
          pub struct FloatingPanels {
              pub etl_3d:    bool,
              pub beemdm:    bool,
              pub nergal:    bool,
              pub particles: bool,
              pub hepta_radar: bool,
              pub etl_flow:  bool,
              pub b11_gauge: bool,
              pub story:     bool,
              pub naba:      bool,
          }

          // ── NABA agent state ──────────────────────────────────────────────────
          pub struct NabaState {
              pub input:    String,
              pub history:  Vec<(String, String)>,  // (user, agent)
              pub thinking: bool,
          }
          impl Default for NabaState {
              fn default() -> Self {
                  Self {
                      input:    String::new(),
                      history:  vec![(
                          String::new(),
                          "𒀭 NABA active — sovereign hologram agent ready.\n\
                           Ask about your .hepta queries, KAKI particles,\n\
                           B11 scores, or BeeMDM pipeline status.".into(),
                      )],
                      thinking: false,
                  }
              }
          }

          // ── UrOS layout state ──────────────────────────────────────────────
          pub struct EriduState {
              pub lang_tab:    LangTab,
              pub editors:     [String; 5],   // one buffer per language tab
              pub outputs:     [String; 5],   // one output per language tab
              pub running:     [bool; 5],
              pub left_open:   bool,
              pub right_open:  bool,
              pub float:       FloatingPanels,
              pub naba:        NabaState,
              pub selected_p:  usize,
          }

          impl Default for EriduState {
              fn default() -> Self {
                  let mut editors = [
                      String::new(), String::new(), String::new(),
                      String::new(), String::new(),
                  ];
                  // Pre-fill each editor with its placeholder
                  let tabs = [
                      LangTab::HeptaScript, LangTab::AkkadianAol,
                      LangTab::Pmpvd, LangTab::Way, LangTab::Template,
                  ];
                  for (i, t) in tabs.iter().enumerate() {
                      editors[i] = t.placeholder().to_string();
                  }
                  Self {
                      lang_tab:   LangTab::HeptaScript,
                      editors,
                      outputs:    Default::default(),
                      running:    Default::default(),
                      left_open:  true,
                      right_open: true,
                      float:      Default::default(),
                      naba:       Default::default(),
                      selected_p: 0,
                  }
              }
          }

          // ── Main entry point ──────────────────────────────────────────────────
          pub fn draw(
              ui:        &mut Ui,
              state:     &mut EriduState,
              bus:       &Arc<RwLock<BeeMdmBusState>>,
              particles: &[ParticleDemo],
              tick:      f64,
          ) {
              let bus_state = bus.read().ok();

              // ── Top bar: title + NABA summon ────────────────────────────────
              egui::TopBottomPanel::top("eridu_top")
                  .exact_height(36.0)
                  .frame(egui::Frame::none()
                      .fill(Color32::from_rgb(4, 4, 16))
                      .stroke(Stroke::new(1.0, theme::GOLD)))
                  .show_inside(ui, |ui| {
                      ui.horizontal_centered(|ui| {
                          ui.label(RichText::new("𒁾  UrOS v4.0")
                              .color(theme::GOLD).size(15.0).strong());
                          ui.separator();
                          // Sidebar toggles
                          if ui.button(if state.left_open  { "◀ Left"  } else { "▶ Left"  }).clicked() {
                              state.left_open = !state.left_open;
                          }
                          if ui.button(if state.right_open { "Right ▶" } else { "Right ◀" }).clicked() {
                              state.right_open = !state.right_open;
                          }
                          // Right-align NABA button
                          ui.with_layout(egui::Layout::right_to_left(egui::Align::Center), |ui| {
                              let naba_col = if state.float.naba { theme::GOLD } else { theme::TEXT_DIM };
                              if ui.button(RichText::new("𒀭 NABA").color(naba_col).strong()).clicked() {
                                  state.float.naba = !state.float.naba;
                              }
                          });
                      });
                  });

              // ── Left sidebar ────────────────────────────────────────────────
              if state.left_open {
                  egui::SidePanel::left("eridu_left")
                      .resizable(true)
                      .default_width(220.0)
                      .min_width(160.0)
                      .max_width(320.0)
                      .frame(egui::Frame::none()
                          .fill(Color32::from_rgb(6, 6, 20))
                          .stroke(Stroke::new(1.0, Color32::from_rgb(30, 30, 80))))
                      .show_inside(ui, |ui| {
                          draw_left_sidebar(ui, state, &bus_state, particles, tick);
                      });
              }

              // ── Right sidebar ───────────────────────────────────────────────
              if state.right_open {
                  egui::SidePanel::right("eridu_right")
                      .resizable(true)
                      .default_width(240.0)
                      .min_width(180.0)
                      .max_width(340.0)
                      .frame(egui::Frame::none()
                          .fill(Color32::from_rgb(6, 6, 20))
                          .stroke(Stroke::new(1.0, Color32::from_rgb(30, 30, 80))))
                      .show_inside(ui, |ui| {
                          draw_right_sidebar(ui, state, &bus_state, particles, tick);
                      });
              }

              // ── Centre: 5 language tabs ─────────────────────────────────────
              egui::CentralPanel::default()
                  .frame(egui::Frame::none().fill(Color32::from_rgb(6, 8, 18)))
                  .show_inside(ui, |ui| {
                      draw_centre(ui, state);
                  });

              // ── Floating panels ─────────────────────────────────────────────
              draw_floats(ui.ctx(), state, &bus_state, particles, tick);
          }

          // ── Left sidebar content ──────────────────────────────────────────────
          fn draw_left_sidebar(
              ui:        &mut Ui,
              state:     &mut EriduState,
              bus_state: &Option<std::sync::RwLockReadGuard<BeeMdmBusState>>,
              _particles: &[ParticleDemo],
              _tick:     f64,
          ) {
              ui.add_space(6.0);
              sidebar_label(ui, "VISUALISATIONS");
              ui.add_space(4.0);

              mini_panel(ui, "⇄  ETL 3D", "Transparency Dashboard",
                  Color32::from_rgb(0, 180, 255), &mut state.float.etl_3d);

              mini_panel(ui, "⬡  BeeMDM", "Pipeline S0→S8 Monitor",
                  Color32::from_rgb(0, 220, 120), &mut state.float.beemdm);

              mini_panel(ui, "𒀭𒉺𒂵 Nergal", "Irkalla Threat Towers",
                  Color32::from_rgb(128, 0, 32), &mut state.float.nergal);

              mini_panel(ui, "◉  Particles", "Sovereign Orbit Cloud",
                  Color32::from_rgb(200, 160, 40), &mut state.float.particles);

              ui.add_space(12.0);
              sidebar_label(ui, "PIPELINE STATUS");
              ui.add_space(4.0);

              if let Some(bus) = bus_state {
                  let malware = bus.etl.sdb_malware_hits;
                  let detect  = bus.gates.g7_nergal();
                  let golden  = bus.total_golden;
                  let proc    = bus.total_processed;

                  stat_mini(ui, "Processed",  &fmt_n(proc),    theme::TEXT_MAIN);
                  stat_mini(ui, "Golden",     &fmt_n(golden),  theme::GOLD);
                  stat_mini(ui, "Quarantined",&fmt_n(bus.total_quarantined), Color32::from_rgb(200,40,40));
                  if malware > 0 || detect > 0 {
                      stat_mini(ui, "⛔ Threats", &format!("{}", malware + detect),
                          Color32::from_rgb(220, 40, 60));
                  }

                  ui.add_space(8.0);
                  // B11 mini bar
                  let b11   = bus.fuzzy.b11 as f32;
                  let frac  = (b11 / 240.0).clamp(0.0, 1.0);
                  let b11_c = if b11 >= 200.0 { theme::GOLD }
                              else if b11 >= 140.0 { theme::CYAN }
                              else { Color32::from_rgb(200,40,40) };
                  ui.label(RichText::new(format!("B11  {:.0}/240", b11))
                      .color(b11_c).size(10.0));
                  let (bar, _) = ui.allocate_exact_size(
                      Vec2::new(ui.available_width() - 8.0, 5.0), egui::Sense::hover());
                  ui.painter().rect_filled(bar, Rounding::same(2.0),
                      Color32::from_rgb(20,20,40));
                  let fill = egui::Rect::from_min_size(
                      bar.min, Vec2::new(bar.width() * frac, 5.0));
                  ui.painter().rect_filled(fill, Rounding::same(2.0), b11_c);
              } else {
                  ui.label(RichText::new("Bus disconnected").color(theme::TEXT_DIM).size(10.0));
              }
          }

          // ── Right sidebar content ─────────────────────────────────────────────
          fn draw_right_sidebar(
              ui:        &mut Ui,
              state:     &mut EriduState,
              bus_state: &Option<std::sync::RwLockReadGuard<BeeMdmBusState>>,
              particles: &[ParticleDemo],
              _tick:     f64,
          ) {
              ui.add_space(6.0);
              sidebar_label(ui, "LIVE PANELS");
              ui.add_space(4.0);

              mini_panel(ui, "⬡  Hepta 7D", "Particle Quality Radar",
                  theme::GOLD, &mut state.float.hepta_radar);

              mini_panel(ui, "⇄  ETL Flow", "Pipeline Tier View",
                  Color32::from_rgb(0, 160, 255), &mut state.float.etl_flow);

              mini_panel(ui, "◈  B11 Gauge", "Quality Score Gauge",
                  theme::CYAN, &mut state.float.b11_gauge);

              mini_panel(ui, "📖 StoryEngine", "Particle Audit Trail",
                  Color32::from_rgb(200, 100, 255), &mut state.float.story);

              // ── Inline mini Hepta radar (always visible) ──────────────────
              ui.add_space(10.0);
              sidebar_label(ui, "HEPTA 7D — QUICK VIEW");
              ui.add_space(4.0);

              if !particles.is_empty() {
                  let p = &particles[state.selected_p.min(particles.len()-1)];
                  ui.label(RichText::new(&p.label).color(theme::GOLD).size(11.0));

                  let avail = ui.available_width().min(200.0);
                  let (resp, painter) = ui.allocate_painter(
                      Vec2::new(avail, avail * 0.85), egui::Sense::hover());
                  let rect   = resp.rect;
                  let center = rect.center();
                  let radius = avail * 0.38;

                  painter.rect_filled(rect, Rounding::same(4.0),
                      Color32::from_rgb(6,6,20));

                  use std::f32::consts::PI;
                  // Draw grid
                  for ring in 1..=4u32 {
                      let r = radius * ring as f32 / 4.0;
                      let pts: Vec<Pos2> = (0..7).map(|i| {
                          let a = -PI/2.0 + i as f32 * 2.0*PI/7.0;
                          Pos2::new(center.x + r*a.cos(), center.y + r*a.sin())
                      }).collect();
                      painter.add(egui::Shape::closed_line(pts,
                          Stroke::new(0.4, Color32::from_rgb(30,40,80))));
                  }
                  // Draw axes
                  for i in 0..7usize {
                      let a = -PI/2.0 + i as f32 * 2.0*PI/7.0;
                      painter.line_segment(
                          [center, Pos2::new(center.x+radius*a.cos(), center.y+radius*a.sin())],
                          Stroke::new(0.4, Color32::from_rgb(40,50,100)));
                  }
                  // Draw filled polygon
                  let pts: Vec<Pos2> = p.dims.iter().enumerate().map(|(i, &v)| {
                      let a = -PI/2.0 + i as f32 * 2.0*PI/7.0;
                      Pos2::new(center.x+radius*v*a.cos(), center.y+radius*v*a.sin())
                  }).collect();
                  painter.add(egui::Shape::convex_polygon(
                      pts.clone(),
                      Color32::from_rgba_premultiplied(200, 160, 40, 60),
                      Stroke::new(1.5, theme::GOLD)));
                  // Dots at each vertex
                  for (i, &pt) in pts.iter().enumerate() {
                      painter.circle_filled(pt, 3.0, crate::panels::hepta::DIM_COLORS[i]);
                  }
                  // HPS label
                  painter.text(center, egui::Align2::CENTER_CENTER,
                      format!("HPS {:.0}%", p.hps * 100.0),
                      FontId::proportional(10.0), theme::CYAN);

                  // Particle selector
                  ui.add_space(4.0);
                  ui.horizontal(|ui| {
                      if ui.small_button("◀").clicked() && state.selected_p > 0 {
                          state.selected_p -= 1;
                      }
                      ui.label(RichText::new(format!("{}/{}", state.selected_p+1, particles.len()))
                          .color(theme::TEXT_DIM).size(10.0));
                      if ui.small_button("▶").clicked() && state.selected_p < particles.len()-1 {
                          state.selected_p += 1;
                      }
                  });
              }

              // ── Nergal mini threat summary ────────────────────────────────
              if let Some(bus) = bus_state {
                  let threats: usize = bus.gates.counts.iter().sum();
                  if threats > 0 {
                      ui.add_space(10.0);
                      sidebar_label(ui, "𒀭𒉺𒂵 NERGAL ALERT");
                      ui.add_space(2.0);
                      egui::Frame::none()
                          .fill(Color32::from_rgb(30, 4, 8))
                          .stroke(Stroke::new(1.0, Color32::from_rgb(128,0,32)))
                          .rounding(Rounding::same(4.0))
                          .inner_margin(egui::Margin::same(6.0))
                          .show(ui, |ui| {
                              ui.label(RichText::new(format!("⛔ {} threat(s) detected", threats))
                                  .color(Color32::from_rgb(220,40,60)).size(11.0).strong());
                              if ui.small_button("Open Nergal →").clicked() {
                                  state.float.nergal = true;
                              }
                          });
                  }
              }
          }

          // ── Centre: 5 language tabs ───────────────────────────────────────────
          fn draw_centre(ui: &mut Ui, state: &mut EriduState) {
              let tabs = [
                  LangTab::HeptaScript, LangTab::AkkadianAol,
                  LangTab::Pmpvd, LangTab::Way, LangTab::Template,
              ];

              // Tab bar
              ui.horizontal(|ui| {
                  ui.add_space(4.0);
                  for tab in tabs {
                      let active = state.lang_tab == tab;
                      let col    = if active { theme::GOLD } else { theme::TEXT_DIM };
                      let fill   = if active { theme::BG_HOVER }
                                   else { Color32::TRANSPARENT };
                      let btn = egui::Button::new(
                          RichText::new(tab.label()).color(col).size(12.0))
                          .fill(fill)
                          .rounding(Rounding::same(4.0));
                      if ui.add(btn).clicked() { state.lang_tab = tab; }
                      ui.add_space(2.0);
                  }
                  // Extension badge
                  let ext = state.lang_tab.extension();
                  ui.with_layout(egui::Layout::right_to_left(egui::Align::Center), |ui| {
                      ui.label(RichText::new(ext).color(theme::TEXT_DIM)
                          .size(10.0).monospace());
                  });
              });

              ui.separator();

              // Get tab index
              let idx = tabs.iter().position(|&t| t == state.lang_tab).unwrap_or(0);

              // Editor + output split
              let avail_h = ui.available_height();
              let editor_h = avail_h * 0.62;
              let output_h = avail_h * 0.35;

              // Code editor
              egui::Frame::none()
                  .fill(Color32::from_rgb(8, 10, 24))
                  .stroke(Stroke::new(0.5, Color32::from_rgb(30,40,80)))
                  .rounding(Rounding::same(4.0))
                  .inner_margin(egui::Margin::same(6.0))
                  .show(ui, |ui| {
                      ui.set_min_height(editor_h);
                      ui.set_max_height(editor_h);
                      egui::ScrollArea::both()
                          .id_salt(format!("editor_{}", idx))
                          .show(ui, |ui| {
                              let editor = TextEdit::multiline(&mut state.editors[idx])
                                  .font(egui::TextStyle::Monospace)
                                  .desired_rows(24)
                                  .desired_width(f32::INFINITY)
                                  .code_editor()
                                  .text_color(Color32::from_rgb(200, 220, 255));
                              ui.add(editor);
                          });
                  });

              ui.add_space(4.0);

              // Run bar
              ui.horizontal(|ui| {
                  let run_label = if state.running[idx] { "⏳ Running..." } else { "▶  Run" };
                  let run_btn = egui::Button::new(
                      RichText::new(run_label).color(Color32::BLACK).strong())
                      .fill(theme::GOLD)
                      .min_size(Vec2::new(80.0, 26.0))
                      .rounding(Rounding::same(4.0));
                  if ui.add(run_btn).clicked() && !state.running[idx] {
                      state.running[idx] = true;
                      // Execute sovereign language
                      state.outputs[idx] = run_sovereign_lang(
                          state.lang_tab, &state.editors[idx]);
                      state.running[idx] = false;
                  }
                  ui.add_space(8.0);
                  if ui.small_button("Clear").clicked() {
                      state.outputs[idx].clear();
                  }
                  if ui.small_button("Copy to clipboard").clicked() {
                      ui.output_mut(|o| o.copied_text = state.outputs[idx].clone());
                  }
                  // Drag-drop hint
                  ui.with_layout(egui::Layout::right_to_left(egui::Align::Center), |ui| {
                      ui.label(RichText::new("drag result → editor  ⇧")
                          .color(theme::TEXT_DIM).size(10.0));
                  });
              });

              ui.add_space(2.0);

              // Output panel
              egui::Frame::none()
                  .fill(Color32::from_rgb(4, 12, 8))
                  .stroke(Stroke::new(0.5, Color32::from_rgb(0,60,30)))
                  .rounding(Rounding::same(4.0))
                  .inner_margin(egui::Margin::same(6.0))
                  .show(ui, |ui| {
                      ui.set_min_height(output_h);
                      ui.label(RichText::new("── Output ──")
                          .color(theme::TEXT_DIM).size(10.0));
                      ui.add_space(2.0);
                      egui::ScrollArea::both()
                          .id_salt(format!("output_{}", idx))
                          .stick_to_bottom(true)
                          .show(ui, |ui| {
                              let out_col = if state.outputs[idx].contains("Error")
                                  || state.outputs[idx].contains("error") {
                                  Color32::from_rgb(220, 80, 80)
                              } else {
                                  Color32::from_rgb(0, 220, 120)
                              };
                              ui.label(RichText::new(
                                  if state.outputs[idx].is_empty() {
                                      "-- press ▶ Run to execute --".into()
                                  } else {
                                      state.outputs[idx].clone()
                                  })
                                  .color(out_col)
                                  .monospace()
                                  .size(11.0));
                          });
                  });
          }

          // ── Floating windows ──────────────────────────────────────────────────
          fn draw_floats(
              ctx:       &egui::Context,
              state:     &mut EriduState,
              bus_state: &Option<std::sync::RwLockReadGuard<BeeMdmBusState>>,
              particles: &[ParticleDemo],
              tick:      f64,
          ) {
              // ETL 3D float
              if state.float.etl_3d {
                  Window::new("⇄ ETL 3D Transparency")
                      .open(&mut state.float.etl_3d)
                      .resizable(true)
                      .default_size([720.0, 500.0])
                      .show(ctx, |ui| {
                          if let Some(bus) = bus_state {
                              // Reuse existing ETL transparency panel
                              // Pass a dummy Arc — float gets bus snapshot
                              ui.label(RichText::new("ETL Transparency Dashboard")
                                  .color(Color32::from_rgb(0,180,255)).strong());
                              ui.separator();
                              etl_snapshot_view(ui, bus, tick);
                          }
                      });
              }

              // BeeMDM Monitor float
              if state.float.beemdm {
                  Window::new("⬡ BeeMDM Monitor")
                      .open(&mut state.float.beemdm)
                      .resizable(true)
                      .default_size([600.0, 420.0])
                      .show(ctx, |ui| {
                          if let Some(bus) = bus_state {
                              beemdm_float_view(ui, bus);
                          }
                      });
              }

              // Nergal AV float
              if state.float.nergal {
                  Window::new("𒀭𒉺𒂵 Nergal — Sovereign AV")
                      .open(&mut state.float.nergal)
                      .resizable(true)
                      .default_size([680.0, 460.0])
                      .show(ctx, |ui| {
                          if let Some(bus) = bus_state {
                              nergal_float_view(ui, bus, tick);
                          }
                      });
              }

              // Hepta 7D float
              if state.float.hepta_radar {
                  Window::new("⬡ Hepta 7D Radar")
                      .open(&mut state.float.hepta_radar)
                      .resizable(true)
                      .default_size([500.0, 480.0])
                      .show(ctx, |ui| {
                          crate::panels::hepta::draw(ui, particles, &mut state.selected_p);
                      });
              }

              // ETL Flow float
              if state.float.etl_flow {
                  Window::new("⇄ ETL Flow")
                      .open(&mut state.float.etl_flow)
                      .resizable(true)
                      .default_size([600.0, 400.0])
                      .show(ctx, |ui| {
                          // reuse existing panel
                          ui.label(RichText::new("ETL Flow — Pipeline Tier View")
                              .color(Color32::from_rgb(0,160,255)).strong());
                      });
              }

              // Particles float
              if state.float.particles {
                  Window::new("◉ Sovereign Particles")
                      .open(&mut state.float.particles)
                      .resizable(true)
                      .default_size([500.0, 420.0])
                      .show(ctx, |ui| {
                          crate::panels::particles::draw(
                              ui, particles,
                              &mut state.selected_p,
                              &mut crate::panels::InspectorTab::default(),
                              &enkidb_journal::Journal::new(0),
                              &[],
                              &[],
                          );
                      });
              }

              // NABA floating hologram agent
              if state.float.naba {
                  Window::new("𒀭 NABA — Sovereign Hologram Agent")
                      .open(&mut state.float.naba)
                      .resizable(true)
                      .default_size([460.0, 520.0])
                      .frame(egui::Frame::window(&ctx.style())
                          .fill(Color32::from_rgb(4, 8, 24))
                          .stroke(Stroke::new(1.5, Color32::from_rgb(0, 200, 255))))
                      .show(ctx, |ui| {
                          draw_naba(ui, &mut state.naba);
                      });
              }
          }

          // ── NABA agent panel ──────────────────────────────────────────────────
          fn draw_naba(ui: &mut Ui, naba: &mut NabaState) {
              ui.label(RichText::new("𒀭 NISABA — Sovereign Hologram Agent v4.0")
                  .color(Color32::from_rgb(0, 220, 255)).size(13.0).strong());
              ui.label(RichText::new("Transparency guide for BahyWay stakeholders")
                  .color(Color32::from_rgb(0, 140, 180)).size(10.0));
              ui.separator();

              // Chat history
              egui::ScrollArea::vertical()
                  .id_salt("naba_history")
                  .max_height(340.0)
                  .stick_to_bottom(true)
                  .show(ui, |ui| {
                      for (user_msg, agent_msg) in &naba.history {
                          if !user_msg.is_empty() {
                              ui.horizontal(|ui| {
                                  ui.label(RichText::new("You: ").color(theme::GOLD).size(11.0));
                                  ui.label(RichText::new(user_msg)
                                      .color(theme::TEXT_MAIN).size(11.0));
                              });
                              ui.add_space(2.0);
                          }
                          if !agent_msg.is_empty() {
                              egui::Frame::none()
                                  .fill(Color32::from_rgb(4, 16, 28))
                                  .rounding(Rounding::same(4.0))
                                  .inner_margin(egui::Margin::same(6.0))
                                  .show(ui, |ui| {
                                      ui.label(RichText::new(agent_msg)
                                          .color(Color32::from_rgb(0, 220, 255))
                                          .size(11.0).monospace());
                                  });
                              ui.add_space(4.0);
                          }
                      }
                  });

              ui.separator();

              // Input
              ui.horizontal(|ui| {
                  let input = TextEdit::singleline(&mut naba.input)
                      .hint_text("Ask about particles, B11, pipeline, security...")
                      .desired_width(ui.available_width() - 70.0);
                  let resp = ui.add(input);
                  let send = ui.button(RichText::new("Ask 𒀭").color(theme::GOLD));

                  if (send.clicked() || (resp.lost_focus()
                      && ui.input(|i| i.key_pressed(egui::Key::Enter))))
                      && !naba.input.is_empty()
                  {
                      let question = naba.input.clone();
                      naba.input.clear();
                      let answer = naba_respond(&question);
                      naba.history.push((question, answer));
                  }
              });
          }

