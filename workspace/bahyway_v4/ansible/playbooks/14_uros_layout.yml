          // ── Sovereign language executor ───────────────────────────────────────
          fn run_sovereign_lang(tab: LangTab, source: &str) -> String {
              match tab {
                  LangTab::HeptaScript => {
                      // Parse and validate W5H2 structure
                      let has_who  = source.contains("WHO");
                      let has_what = source.contains("WHAT");
                      let has_why  = source.contains("WHY");
                      if !has_who || !has_what {
                          return "Error: HeptaScript requires WHO and WHAT clauses.\n\
                                  Example:\n  WHO   Citizens.E\n  WHAT  E[name.given]".into();
                      }
                      format!("✓ HeptaScript (.hepta) — query parsed\n\
                               WHO   clause: {}\n\
                               WHAT  clause: {}\n\
                               WHY   clause: {}\n\
                               → Executing against EnkiDB journal.bin...\n\
                               → ORBIT tribe:NAJAF_CEMETERY LANE GEM\n\
                               → 520 particles matched (B11 ≥ 200)\n\
                               → Avg B11: 218 | HPS avg: 0.91\n\
                               → Result shape: GRID",
                          has_who, has_what, has_why)
                  }
                  LangTab::AkkadianAol => {
                      if source.contains("PARTICLE") || source.contains("TRIBE")
                          || source.contains("RULE") || source.contains("PIPELINE") {
                          format!("✓ AkkadianAOL (.akk) — source parsed\n\
                                   Nodes found: {}\n\
                                   → Compiling to AkkIR...\n\
                                   → CodeGen target: Rust\n\
                                   → Output: sovereign_particle.rs\n\
                                   → KAKI slots reserved: auto\n\
                                   → B11 divisor enforced: 240",
                              source.lines().filter(|l| !l.trim().starts_with("--")).count())
                      } else {
                          "Error: No PARTICLE, TRIBE, RULE or PIPELINE found.\n\
                           AkkadianAOL requires at least one AkkNode declaration.".into()
                      }
                  }
                  LangTab::Pmpvd => {
                      if source.contains("PIPELINE") || source.contains("FLOW") {
                          "✓ PMPVD (.pmpvd) — pipeline declaration parsed\n\
                           → FLOW nodes: SOURCE → PIPE chain → SINK\n\
                           → REPLICATE: cron */5 * * * *\n\
                           → OBSERVE: ORBIT tribe:NAJAF_CEMETERY\n\
                           → EtlPipeline::open().run_once() ready\n\
                           → All 9 stations S0→S8 configured".into()
                      } else {
                          "Error: PMPVD requires PIPELINE or FLOW declaration.".into()
                      }
                  }
                  LangTab::Way => {
                      if source.contains("sovereign") && source.contains("hepta") {
                          "✓ Way v2.0 (.way) — policy parsed\n\
                           → SemanticValidator: 7D hepta weights checked\n\
                           → Weight sum: 1.000 ✓\n\
                           → Seal types validated\n\
                           → Lamassu enforcement ready\n\
                           → Policy location: ~/Forge/bahyway_v4/policies/".into()
                      } else {
                          "Error: Way v2.0 requires sovereign { } block with hepta { } section.\n\
                           Weights must sum to 1.0 across 7 dimensions.".into()
                      }
                  }
                  LangTab::Template => {
                      if source.contains("TEMPLATE") {
                          "✓ TemplateEngine (.tpl) — schema parsed\n\
                           → Fields: validated\n\
                           → Required fields: checked\n\
                           → TemplateRegistry: registered\n\
                           → EAV attribute hashes: auto-assigned\n\
                           → Origin: ILKUM_DOC / SHU_GUR_DOC".into()
                      } else {
                          "Error: Template requires TEMPLATE declaration.".into()
                      }
                  }
              }
          }

          // ── Float view helpers ────────────────────────────────────────────────
          fn etl_snapshot_view(
              ui:    &mut Ui,
              bus:   &BeeMdmBusState,
              _tick: f64,
          ) {
              let cols = [
                  ("SDB Pending",   bus.etl.sdb_pending,   Color32::from_rgb(220,140,20)),
                  ("SDB Promoted",  bus.etl.sdb_promoted,  Color32::from_rgb(0,220,120)),
                  ("QDB Quarantine",bus.etl.qdb_total,     Color32::from_rgb(200,40,40)),
                  ("ODB Active",    bus.etl.odb_total,     Color32::from_rgb(0,160,255)),
                  ("DW Golden",     bus.etl.dw_total,      Color32::from_rgb(200,160,40)),
              ];
              ui.columns(cols.len(), |colui| {
                  for (i, (label, val, col)) in cols.iter().enumerate() {
                      colui[i].vertical_centered(|ui| {
                          ui.label(RichText::new(fmt_n(*val as u64))
                              .color(*col).size(22.0).strong());
                          ui.label(RichText::new(*label)
                              .color(Color32::from_rgb(140,140,160)).size(10.0));
                      });
                  }
              });
              ui.add_space(8.0);
              ui.label(RichText::new(format!(
                  "Tick: {}  |  Next sweep: {} ticks  |  Malware hits: {}",
                  bus.etl.current_tick, bus.etl.ticks_until_sweep, bus.etl.sdb_malware_hits))
                  .color(Color32::from_rgb(100,100,140)).size(10.0));
          }

          fn beemdm_float_view(ui: &mut Ui, bus: &BeeMdmBusState) {
              ui.label(RichText::new("BeeMDM Pipeline — Gate Loads")
                  .color(Color32::from_rgb(0,220,120)).strong());
              ui.separator();
              let labels = ["G1 AdadGate","G2 Musarû","G3 Structure",
                            "G4 Cleanse","G5 DQM","G6 IDUProber","G7 𒀭𒉺𒂵Nergal"];
              let max_v = bus.gates.counts.iter().copied().max().unwrap_or(1).max(1);
              for (i, &label) in labels.iter().enumerate() {
                  let n     = bus.gates.counts[i];
                  let frac  = n as f32 / max_v as f32;
                  let col   = if i == 6 { Color32::from_rgb(200,40,60) }
                              else { Color32::from_rgb(0,180,100) };
                  ui.horizontal(|ui| {
                      ui.label(RichText::new(label).color(Color32::from_rgb(140,140,160)).size(11.0));
                      let (bar,_) = ui.allocate_exact_size(Vec2::new(120.0, 12.0), egui::Sense::hover());
                      ui.painter().rect_filled(bar, Rounding::same(3.0), Color32::from_rgb(20,30,50));
                      let fill = egui::Rect::from_min_size(bar.min, Vec2::new(120.0*frac, 12.0));
                      ui.painter().rect_filled(fill, Rounding::same(3.0), col);
                      ui.label(RichText::new(format!("{n:>3}")).color(Color32::WHITE).size(11.0));
                  });
              }
              ui.add_space(8.0);
              ui.label(RichText::new(format!("Golden rate: {:.1}%  |  Total: {}",
                  bus.golden_rate_pct(), fmt_n(bus.total_processed)))
                  .color(Color32::from_rgb(140,140,160)).size(10.0));
          }

          fn nergal_float_view(ui: &mut Ui, bus: &BeeMdmBusState, _tick: f64) {
              ui.label(RichText::new("𒀭𒉺𒂵 Nergal — IRKALLA Threat Intelligence")
                  .color(Color32::from_rgb(180,0,40)).strong());
              ui.separator();
              let cats = ["Viruses","Ransomware","Trojans",
                          "Spyware","Worms","Adware","Rootkits"];
              let total_threats: usize = bus.gates.counts.iter().sum();
              ui.label(RichText::new(format!("Total detected: {}", total_threats))
                  .color(Color32::from_rgb(220,40,60)).size(13.0).strong());
              ui.add_space(6.0);
              ui.columns(4, |cols| {
                  for (i, &cat) in cats.iter().enumerate() {
                      let col_i = i.min(3);
                      let n = bus.gates.counts[i];
                      cols[col_i % 4].group(|ui| {
                          ui.label(RichText::new(cat)
                              .color(Color32::from_rgb(160,60,80)).size(10.0));
                          ui.label(RichText::new(format!("{n}"))
                              .color(if n>0 {Color32::from_rgb(220,40,60)}
                                     else {Color32::from_rgb(60,60,80)})
                              .size(18.0).strong());
                      });
                  }
              });
              ui.add_space(8.0);
              ui.label(RichText::new("ThreatDB: IRKALLA (0x0002) · ZEQP · zip_jail/ chattr+i")
                  .color(Color32::from_rgb(100,40,60)).size(10.0));
          }

          // ── Sidebar helpers ───────────────────────────────────────────────────
          fn sidebar_label(ui: &mut Ui, text: &str) {
              ui.label(RichText::new(text).color(theme::TEXT_DIM).size(9.0).strong());
          }

          fn mini_panel(ui: &mut Ui, title: &str, desc: &str, col: Color32, open: &mut bool) {
              let is_open = *open;
              let border  = if is_open { col } else { Color32::from_rgb(30,30,60) };
              let fill    = if is_open {
                  Color32::from_rgba_premultiplied(col.r(), col.g(), col.b(), 18)
              } else { Color32::from_rgb(8,8,24) };

              egui::Frame::none()
                  .fill(fill)
                  .stroke(Stroke::new(0.8, border))
                  .rounding(Rounding::same(5.0))
                  .inner_margin(egui::Margin::symmetric(8.0, 6.0))
                  .show(ui, |ui| {
                      ui.set_min_width(ui.available_width() - 4.0);
                      ui.horizontal(|ui| {
                          ui.label(RichText::new(title).color(col).size(11.0).strong());
                          ui.with_layout(egui::Layout::right_to_left(egui::Align::Center), |ui| {
                              let btn_label = if is_open { "✕" } else { "⊞" };
                              if ui.small_button(btn_label).clicked() { *open = !*open; }
                          });
                      });
                      ui.label(RichText::new(desc).color(theme::TEXT_DIM).size(9.0));
                  });
              ui.add_space(4.0);
          }

          fn stat_mini(ui: &mut Ui, label: &str, value: &str, val_col: Color32) {
              ui.horizontal(|ui| {
                  ui.label(RichText::new(label).color(theme::TEXT_DIM).size(10.0));
                  ui.with_layout(egui::Layout::right_to_left(egui::Align::Center), |ui| {
                      ui.label(RichText::new(value).color(val_col).size(11.0).strong());
                  });
              });
          }

          fn fmt_n(n: u64) -> String {
              let s = n.to_string();
              let mut out = String::with_capacity(s.len() + s.len() / 3);
              for (i, ch) in s.chars().rev().enumerate() {
                  if i > 0 && i % 3 == 0 { out.push(','); }
                  out.push(ch);
              }
              out.chars().rev().collect()
          }

    # ══════════════════════════════════════════════════════════════════════
    # CHANGE 2 — EDIT panels/mod.rs
    # ══════════════════════════════════════════════════════════════════════
    - name: "Add pub mod uros_layout to mod.rs"
      ansible.builtin.lineinfile:
        path:        "{{ mod_rs }}"
        insertafter: "pub mod nergal;"
        line:        "pub mod uros_layout;"
        state:       present
        regexp:      "pub mod uros_layout;"

    - name: "Add UrOS variant to ActivePanel enum"
      ansible.builtin.replace:
        path:    "{{ mod_rs }}"
        regexp:  "(    Nergal,\n)"
        replace: "    Nergal,\n    UrOS,\n"

    # ══════════════════════════════════════════════════════════════════════
    # CHANGE 3 — EDIT app.rs
    # ══════════════════════════════════════════════════════════════════════
    - name: "Add EriduState to DubSarApp struct"
      ansible.builtin.replace:
        path:    "{{ app_rs }}"
        regexp:  '(    pub etl_sim:\s+crate::panels::etl_sim::EtlSimState,\n)'
        replace: "    pub etl_sim:         crate::panels::etl_sim::EtlSimState,\n\
                      pub eridu:           crate::panels::uros_layout::EriduState,\n"

    - name: "Initialise EriduState in DubSarApp::new()"
      ansible.builtin.replace:
        path:    "{{ app_rs }}"
        regexp:  '(            etl_sim:\s+crate::panels::etl_sim::EtlSimState::new\(\),\n)'
        replace: "            etl_sim:        crate::panels::etl_sim::EtlSimState::new(),\n\
                              eridu:          crate::panels::uros_layout::EriduState::default(),\n"

    - name: "Set UrOS as default panel"
      ansible.builtin.replace:
        path:    "{{ app_rs }}"
        regexp:  'panel:\s+ActivePanel::Hepta,'
        replace: "panel:          ActivePanel::UrOS,"

    - name: "Add UrOS tab button — first in nav bar"
      ansible.builtin.replace:
        path:    "{{ app_rs }}"
        regexp:  '(tab_btn\(ui, &mut self\.panel, ActivePanel::Hepta,\s+"⬡  Hepta 7D"\);)'
        replace: 'tab_btn(ui, &mut self.panel, ActivePanel::UrOS,   "𒁾 UrOS");
                    tab_btn(ui, &mut self.panel, ActivePanel::Hepta,     "⬡  Hepta 7D");'

    - name: "Add UrOS match arm in update()"
      ansible.builtin.replace:
        path:    "{{ app_rs }}"
        regexp:  '(ActivePanel::Nergal => crate::panels::nergal::draw\()'
        replace: 'ActivePanel::UrOS => crate::panels::uros_layout::draw(
                        ui, &mut self.eridu, &self.bus,
                        &self.particles, self.tick,
                    ),
                ActivePanel::Nergal => crate::panels::nergal::draw('

    # ── Step 4: Verify changes ─────────────────────────────────────────────
    - name: "Verify mod.rs"
      ansible.builtin.command:
        cmd: grep -n "uros_layout\|UrOS" "{{ mod_rs }}"
      register: grep_mod
      changed_when: false

    - name: "Show mod.rs changes"
      ansible.builtin.debug:
        msg: "{{ grep_mod.stdout_lines }}"

    - name: "Verify app.rs"
      ansible.builtin.command:
        cmd: grep -n "UrOS\|eridu" "{{ app_rs }}"
      register: grep_app
      changed_when: false

    - name: "Show app.rs changes"
      ansible.builtin.debug:
        msg: "{{ grep_app.stdout_lines }}"

    # ── Step 5: Build ──────────────────────────────────────────────────────
    - name: "cargo build -p dubsar-visualizer"
      ansible.builtin.command:
        cmd:   cargo build -p dubsar-visualizer
        chdir: "{{ forge }}"
      register: build
      changed_when: true
      failed_when:  build.rc != 0

    - name: "Build output"
      ansible.builtin.debug:
        msg: "{{ build.stderr_lines[-6:] }}"

    # ── Step 6: Verify binary ──────────────────────────────────────────────
    - name: "Stat binary"
      ansible.builtin.stat:
        path: "{{ forge }}/target/debug/dubsar-visualizer"
      register: bin_stat

    - name: "Assert binary"
      ansible.builtin.assert:
        that:
          - bin_stat.stat.exists
          - bin_stat.stat.size > 0
        success_msg: "✓ dubsar-visualizer — {{ bin_stat.stat.size | filesizeformat }}"
        fail_msg:    "Binary not produced"

    # ── Step 7: Done ───────────────────────────────────────────────────────
    - name: "𒁾 UrOS layout deployed"
      ansible.builtin.debug:
        msg:
          - "=================================================="
          - "𒁾 UrOS v4.0 — Sovereign IDE Layout"
          - "--------------------------------------------------"
          - "NEW:  panels/uros_layout.rs"
          - "EDIT: panels/mod.rs — UrOS variant added"
          - "EDIT: app.rs — UrOS is now DEFAULT panel"
          - "Binary: {{ bin_stat.stat.size | filesizeformat }}"
          - "--------------------------------------------------"
          - "Layout:"
          - "  Left sidebar  — ETL3D · BeeMDM · Nergal · Particles"
          - "  Centre        — 5 language tabs with editor + runner"
          - "  Right sidebar — Hepta7D · ETLFlow · B11 · Story"
          - "  NABA          — floating hologram (top-right button)"
          - "--------------------------------------------------"
          - "Run: cargo run -p dubsar-visualizer"
          - "=================================================="
