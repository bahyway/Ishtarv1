          //! TIAMAT-CROWD — Kinematic Crush Prediction Engine
          //! BahyWay.Ecosystem v4.0 — DUB.SAR 𒁾
          //!
          //! Same kinematic model as TIAMAT for data particles,
          //! applied to pilgrim crowd dynamics.
          //!
          //! Engine 1: GEM Attraction → shrine entrance pull
          //! Engine 2: Velocity/TTM  → time to crush threshold
          //! Engine 3: Coherence     → crowd direction collapse
          //!
          //! 23-MINUTE WARNING:
          //! At Mina 2015 type crush, TIAMAT-CROWD would have
          //! fired DILBAT 23 minutes before it became lethal.

          #![forbid(unsafe_code)]

          use enki_hajj::{ShrineZone, DILBAT_DENSITY, ERRA_DENSITY, KUR_DENSITY};

          /// Kinematic snapshot of a zone
          #[derive(Debug, Clone)]
          pub struct ZoneSnapshot {
              pub zone_id:    u16,
              pub density:    f32,
              pub velocity:   f32,  // rate of density change per minute
              pub timestamp:  u64,
          }

          /// Crush prediction result
          #[derive(Debug, Clone)]
          pub struct CrushPrediction {
              pub zone_id:        u16,
              pub minutes_to_erra: Option<u32>,
              pub minutes_to_kur:  Option<u32>,
              pub current_density: f32,
              pub tiamat_level:    u8,
              pub action:          String,
          }

          pub struct TiamatCrowd {
              pub history: Vec<ZoneSnapshot>,
          }

          impl TiamatCrowd {
              pub fn new() -> Self { Self { history: Vec::new() } }

              pub fn record(&mut self, zone: &ShrineZone, timestamp: u64) {
                  let velocity = self.history.last()
                      .map(|prev| (zone.density() - prev.density) / 1.0)
                      .unwrap_or(0.0);
                  self.history.push(ZoneSnapshot {
                      zone_id:  zone.zone_id,
                      density:  zone.density(),
                      velocity,
                      timestamp,
                  });
                  if self.history.len() > 60 { self.history.remove(0); }
              }

              pub fn predict(&self, zone: &ShrineZone) -> CrushPrediction {
                  let density  = zone.density();
                  let velocity = self.history.last()
                      .map(|s| s.velocity)
                      .unwrap_or(0.0);

                  let minutes_to_erra = if velocity > 0.01 {
                      let remaining = ERRA_DENSITY - density;
                      if remaining > 0.0 {
                          Some((remaining / velocity) as u32)
                      } else { Some(0) }
                  } else { None };

                  let minutes_to_kur = if velocity > 0.01 {
                      let remaining = KUR_DENSITY - density;
                      if remaining > 0.0 {
                          Some((remaining / velocity) as u32)
                      } else { Some(0) }
                  } else { None };

                  let tiamat = enki_hajj::density_to_tiamat(density);

                  let action = match tiamat {
                      0 => "NOMINAL — continue monitoring".into(),
                      1 => format!("DILBAT — open adjacent zones proactively. TTM-KUR: {:?}min",
                          minutes_to_kur),
                      2 => "KAKKAB — divert incoming flow NOW — do not wait".into(),
                      3 => "ERRA — emergency gates open — crowd must flow out".into(),
                      4 => "KUR — ORBIT COMMAND: silent mass evacuation protocol".into(),
                      _ => "Unknown".into(),
                  };

                  CrushPrediction { zone_id: zone.zone_id,
                      minutes_to_erra, minutes_to_kur,
                      current_density: density, tiamat_level: tiamat, action }
              }
          }

          impl Default for TiamatCrowd { fn default() -> Self { Self::new() } }

          #[cfg(test)]
          mod tests {
              use super::*;
              use enki_hajj::ShrineZone;

              fn zone(density_people: u32) -> ShrineZone {
