                  format!(
                      "𒌓𒍣𒅁𒀭 UTNAPISHTIM-PASS — Sovereign Pilgrim Record\\n\
                       ═══════════════════════════════════════\\n\
                       Shrine:    {}\\n\
                       Date:      {}\\n\
                       Entry:     Gate {} at {}\\n\
                       Exit:      {}\\n\
                       Duration:  {}\\n\
                       KAKI:      {}\\n\
                       ═══════════════════════════════════════\\n\
                       This record belongs to you.\\n\
                       It is sovereign, immutable.\\n\
                       No government can take it from you.\\n\
                       𒁾 BahyWay.Ecosystem v4.0",
                      self.shrine,
                      self.visit_date,
                      self.entry_gate,
                      self.entry_time,
                      self.exit_time.as_deref().unwrap_or("—"),
                      duration_str,
                      &self.kaki_hex[..16],
                  )
              }

              fn epoch_to_date(epoch: u64) -> String {
                  let days  = epoch / 86400;
                  let year  = 1970 + days / 365;
                  let month = (days % 365) / 30 + 1;
                  let day   = (days % 365) % 30 + 1;
                  format!("{:04}-{:02}-{:02}", year, month, day)
              }

              fn epoch_to_time(epoch: u64) -> String {
                  let h = (epoch % 86400) / 3600;
                  let m = (epoch % 3600)  / 60;
                  format!("{:02}:{:02}", h, m)
              }
          }

