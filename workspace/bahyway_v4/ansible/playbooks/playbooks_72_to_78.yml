              t = subprocess.run(["cargo", "test", "-p", name, "--", "--nocapture"],
                  cwd=FORGE, capture_output=True, text=True)
              if t.returncode != 0:
                  print(f"✗ {name} tests:"); print(t.stdout[-1000:]); sys.exit(1)
              print(f"✓ {name} — build + tests pass")

