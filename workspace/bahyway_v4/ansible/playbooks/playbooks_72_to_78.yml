          }

          impl CompoundSuspicion {
              /// GA-inspired compound score.
              /// Independent dimensions confirming each other → higher grade.
              /// Simple sum would be wrong — independence is key.
              pub fn compound_score(&self) -> f32 {
                  let scores = [
                      self.topo.score(),
                      self.thermal.score(),
                      self.behav.score(),
                      self.chem.score(),
                      self.em.score(),
                  ];

                  // Count dimensions above threshold (0.40)
                  let active: Vec<f32> = scores.iter()
                      .filter(|&&s| s >= 0.40)
                      .cloned()
                      .collect();

                  if active.is_empty() {
                      return scores.iter().cloned().fold(0.0f32, f32::max) * 0.5;
                  }

                  // GA outer product grade corresponds to number of confirming dims
                  // More independent confirmations = higher compound score
                  let grade = active.len() as f32;
                  let mean  = active.iter().sum::<f32>() / active.len() as f32;

                  // Grade-weighted compound: 1 dim → ×0.5, 4 dims → ×0.95
                  let grade_weight = match active.len() {
                      1 => 0.50, 2 => 0.70, 3 => 0.85, _ => 0.95,
                  };

                  (mean * grade_weight).clamp(0.0, 1.0)
              }

              /// TIAMAT alert level from compound score
              pub fn tiamat_level(&self) -> u8 {
                  let s = self.compound_score();
                  if s >= 0.85 { 4 }       // KUR   → silent evacuation
                  else if s >= 0.70 { 3 }  // ERRA  → medical tent cover
                  else if s >= 0.55 { 2 }  // KAKKAB → plain-clothes
                  else if s >= 0.40 { 1 }  // DILBAT → silent camera
                  else { 0 }
              }

