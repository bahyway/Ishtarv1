# ══════════════════════════════════════════════════════════════════════════════
# 𒁾 playbook_73_gilgamesh_gate.yml
# GILGAMESH-GATE — Sovereign Entry Registration
# PLAYBOOK 74: KIBRATU-HAJJ — Multi-Modal Crowd Security
# PLAYBOOK 75: NAMTAR-HAJJ — Lost Person System
# ══════════════════════════════════════════════════════════════════════════════

- name: "PLAYBOOKS 73–75 — GILGAMESH-GATE + KIBRATU-HAJJ + NAMTAR-HAJJ"
  hosts: eriduous_vdi
  gather_facts: false
  become: false

  vars:
    forge_root:  "/home/bahyway/Forge/bahyway_v4"
    script_path: "/tmp/bw_73_75_hajj.py"

  tasks:

    - name: "1.0 | Write bw_73_75_hajj.py"
      ansible.builtin.copy:
        dest: "{{ script_path }}"
        mode: "0755"
        content: |
          #!/usr/bin/env python3
          # GILGAMESH-GATE + KIBRATU-HAJJ + NAMTAR-HAJJ
          # BahyWay.Ecosystem v4.0 — DUB.SAR 𒁾
          import os, subprocess, sys, textwrap

          FORGE  = "/home/bahyway/Forge/bahyway_v4"
          write  = lambda p, c: open(p, "w").write(c)

          def make_crate(name, desc, deps, content):
              crate = f"{FORGE}/crates/{name}"
              src   = f"{crate}/src"
              os.makedirs(src, exist_ok=True)
              dep_str = "\n".join(f'{k} = {{ path = "../{v}" }}' for k,v in deps.items())
              write(f"{crate}/Cargo.toml", f'[package]\nname = "{name}"\nversion = "4.0.0"\n'
                    f'edition = "2021"\nauthors = ["DUB.SAR 𒁾"]\n'
                    f'[dependencies]\n{dep_str}\n')
              write(f"{src}/lib.rs", content)

          # ── GILGAMESH-GATE ────────────────────────────────────────────
          make_crate("gilgamesh-gate",
          "GILGAMESH-GATE Sovereign Entry Registration",
          {"enki-hajj": "enki-hajj", "enkidb-kaki": "enkidb-kaki"},
          textwrap.dedent("""\
          //! GILGAMESH-GATE — Sovereign Entry Registration
          //! < 3 seconds per pilgrim at 20M+ scale
          //! BahyWay.Ecosystem v4.0 — DUB.SAR 𒁾
          //!
          //! Options:
          //!   A) QR wristband scan (pre-registered)
          //!   B) Passport/ID scan → KAKI minted instantly
          //!   C) Face biometric (sovereign on-device — no cloud)
          //!   D) Family group token (one token per family)

          #![forbid(unsafe_code)]

          use enkidb_kaki::Kaki;
          use enki_hajj::{PilgrimRole, pilgrim::PilgrimParticle};

          pub struct GilgameshGate {
              pub gate_id:   u8,
              pub zone_id:   u16,
              pub site_name: String,
          }

          impl GilgameshGate {
              pub fn new(gate_id: u8, zone_id: u16, site_name: impl Into<String>) -> Self {
                  Self { gate_id, zone_id, site_name: site_name.into() }
              }

              /// Register pilgrim — < 3 seconds target
              /// Returns minted PilgrimParticle
              pub fn register(
                  &self,
                  passport_hash: u32,
                  role:          PilgrimRole,
                  group_id:      Option<u16>,
                  entry_epoch:   u64,
              ) -> PilgrimParticle {
                  let pilgrim = PilgrimParticle::mint(
                      passport_hash, self.zone_id,
                      role, group_id,
                      self.gate_id, entry_epoch,
                  );
                  println!("[GILGAMESH-GATE {}] Pilgrim registered: KAKI {:02X?}",
                      self.gate_id, &pilgrim.kaki.bytes[0..4]);
                  pilgrim
              }

              /// Register family group — one token, multiple pilgrims
              pub fn register_group(
                  &self,
                  member_hashes: &[u32],
                  lead_role:     PilgrimRole,
                  entry_epoch:   u64,
              ) -> Vec<PilgrimParticle> {
                  let group_id = Some(enkidb_kaki::fnv1a_u32(
                      &member_hashes[0].to_be_bytes()) as u16);
                  member_hashes.iter().enumerate().map(|(i, &hash)| {
                      let role = if i == 0 { lead_role } else { PilgrimRole::Domestic };
                      self.register(hash, role, group_id, entry_epoch)
                  }).collect()
              }
          }

          #[cfg(test)]
          mod tests {
              use super::*;

              #[test]
              fn test_gate_registration_under_3_seconds() {
                  let gate  = GilgameshGate::new(1, 1, "Imam Ali North Gate");
                  let start = std::time::Instant::now();
                  let p     = gate.register(0xDEADBEEF, PilgrimRole::Domestic, None, 1_750_000_000);
                  let ms    = start.elapsed().as_millis();
                  assert!(ms < 3000, "Registration took {}ms — must be < 3000ms", ms);
                  assert_eq!(p.kaki.bytes[6], 0x01); // Identity-KAKI
                  assert_eq!(p.kaki.bytes[7], PilgrimRole::Domestic as u8);
              }

              #[test]
              fn test_family_group_shares_group_id() {
                  let gate  = GilgameshGate::new(2, 1, "South Gate");
                  let group = gate.register_group(
                      &[0x0001, 0x0002, 0x0003],
                      PilgrimRole::Domestic,
                      1_750_000_000,
                  );
                  assert_eq!(group.len(), 3);
                  let gid = group[0].group_id;
                  assert!(gid.is_some());
                  assert!(group.iter().all(|p| p.group_id == gid));
              }
          }
          """))

          # ── KIBRATU-HAJJ ──────────────────────────────────────────────
          make_crate("kibratu-hajj",
          "KIBRATU-HAJJ Multi-Modal Crowd Security Algorithm",
          {"enki-hajj": "enki-hajj", "enkidb-kaki": "enkidb-kaki"},
          textwrap.dedent("""\
          //! KIBRATU-HAJJ 𒆪𒁀𒊒𒀭𒌑 — Multi-Modal Crowd Security
          //! "The Four Directions of the Sacred Journey"
          //! BahyWay.Ecosystem v4.0 — DUB.SAR 𒁾
          //!
          //! FIVE SUSPICION DIMENSIONS (GA outer product):
          //!   e_topo  — Simplicial complex topology anomaly
          //!   e_therm — Thermal signature (C4/stress/concealment)
          //!   e_behav — Behavioural pattern (scanning/avoidance)
          //!   e_chem  — Chemical trace (IMS/Raman spectroscopy)
          //!   e_em    — Electromagnetic (device activation burst)
          //!
          //! COMPOUND SCORE via GA outer product:
          //!   Grade-1 → DILBAT (1 dimension) — silent camera track
          //!   Grade-2 → KAKKAB (2 agree)     — plain-clothes approach
          //!   Grade-3 → ERRA   (3 agree)      — medical tent cover
          //!   Grade-4 → KUR    (4 agree)      — silent zone evacuation
          //!
          //! MASHSHARU verifies before every alert fires.
          //! DIGNITY FIRST — cover not confrontation.
          //! False positive target: < 0.01%
          //! Every detection = immutable Event-KAKI with WHY clause.
          //!
          //! SOVEREIGN PRINCIPLE:
          //!   Watches TOPOLOGY — not identity.
          //!   No facial recognition. No political use.
          //!   System auditable by human rights observers.

          #![forbid(unsafe_code)]

          use enkidb_kaki::Kaki;

          // ── Five suspicion dimensions ─────────────────────────────────

          /// Topological suspicion — simplicial complex behaviour anomaly
          #[derive(Debug, Clone, Default)]
          pub struct TopoSuspicion {
              /// Bond count anomaly (too few = avoided, too many = controlling)
              pub bond_anomaly:        f32,
              /// Bond stability (abnormally stable group in moving crowd)
              pub stability_anomaly:   f32,
              /// Heading consensus (moving against all bonds)
              pub heading_anomaly:     f32,
              /// Cross-zone bond count (coordinating across zones)
              pub cross_zone_bonds:    u8,
          }

          impl TopoSuspicion {
              pub fn score(&self) -> f32 {
                  (self.bond_anomaly    * 0.25 +
                   self.stability_anomaly * 0.30 +
                   self.heading_anomaly * 0.25 +
                   (self.cross_zone_bonds as f32 / 5.0).min(1.0) * 0.20)
                  .clamp(0.0, 1.0)
              }
          }

          /// Thermal suspicion — concealed explosive signature
          #[derive(Debug, Clone, Default)]
          pub struct ThermalSuspicion {
              /// Torso temp above crowd baseline (concealed heat source)
              pub torso_delta:      f32,
              /// Forehead below baseline (stress vasoconstriction)
              pub forehead_deficit: f32,
              /// Thermal gradient reversal (torso hotter than face)
              pub gradient_reversal: bool,
              /// Localized hot spot detected
              pub hot_spot:         bool,
              /// Hot spot location
              pub hot_spot_zone:    Option<BodyZone>,
          }

          #[derive(Debug, Clone, PartialEq)]
          pub enum BodyZone { Belt, Chest, Backpack, Leg }

          impl ThermalSuspicion {
              pub fn score(&self) -> f32 {
                  let mut s = 0.0f32;
                  s += (self.torso_delta / 6.0).min(0.35);
                  s += (self.forehead_deficit / 2.0).min(0.25);
                  if self.gradient_reversal { s += 0.25; }
                  if self.hot_spot {
                      s += 0.35;
                      if matches!(self.hot_spot_zone,
                          Some(BodyZone::Belt) | Some(BodyZone::Chest)) {
                          s += 0.15;
                      }
                  }
                  s.clamp(0.0, 1.0)
              }
          }

          /// Behavioural suspicion
          #[derive(Debug, Clone, Default)]
          pub struct BehaviouralSuspicion {
              pub scanning_rate:     f32,  // head rotation vs crowd mean
              pub hesitation_loops:  u8,   // returns to same position
              pub checkpoint_avoidance: f32,
              pub gait_asymmetry:    f32,  // carrying concealed weight
          }

          impl BehaviouralSuspicion {
              pub fn score(&self) -> f32 {
                  ((self.scanning_rate / 3.0).min(0.20) +
                   (self.hesitation_loops as f32 / 3.0).min(0.25) +
                   self.checkpoint_avoidance * 0.30 +
                   self.gait_asymmetry * 0.25)
                  .clamp(0.0, 1.0)
              }
          }

          /// Chemical trace suspicion
          #[derive(Debug, Clone, Default)]
          pub struct ChemicalSuspicion {
              /// IMS (Ion Mobility Spectrometry) positive
              pub ims_positive:    bool,
              /// Raman spectroscopy score
              pub raman_score:     f32,
              /// PID (Photoionization) ambient concentration
              pub pid_level:       f32,
          }

          impl ChemicalSuspicion {
              pub fn score(&self) -> f32 {
                  let mut s = 0.0f32;
                  if self.ims_positive { s = 0.90; }
                  s = s.max(self.raman_score * 0.75);
