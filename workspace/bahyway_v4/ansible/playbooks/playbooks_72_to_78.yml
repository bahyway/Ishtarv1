---
# ══════════════════════════════════════════════════════════════════════════════
# 𒁾 BATCH 3 — ENKI-HAJJ Suite — Playbooks 72–78
# Sovereign Pilgrimage Management System
# BahyWay.Ecosystem v4.0 — DUB.SAR Bahaa Fadam
#
# Constitutional Axiom (sealed):
#   "A pilgrim who makes the most sacred journey of their life
#    deserves to arrive, worship, and return home safely.
#    Every person in that crowd is a sovereign particle.
#    ENKI-HAJJ makes the invisible crowd sovereign."
#
# ENKI-HAJJ 𒀭𒂗𒆳𒀭𒌑 Suite:
#   PB 72: ENKI-HAJJ Foundation (ŠĀRU_crowd + core types)
#   PB 73: GILGAMESH-GATE (entry registration + KAKI minting)
#   PB 74: KIBRATU-HAJJ (multi-modal crowd security algorithm)
#   PB 75: NAMTAR-HAJJ (lost person sovereign system)
#   PB 76: TIAMAT-CROWD (kinematic crush prediction)
#   PB 77: ORBIT-COMMAND (real-time 3D command visualization)
#   PB 78: UTNAPISHTIM-PASS + NISABA-HAJJ (pilgrim record + voice)
#
# Target  : eriduous-vdi (192.168.122.214)
# Run from: EnkiLab HOST
# ansible-playbook -i inventory/vdi.yml playbooks/72_enki_hajj_foundation.yml
# ══════════════════════════════════════════════════════════════════════════════

- name: "PLAYBOOK 72 — ENKI-HAJJ 𒀭𒂗𒆳𒀭𒌑 Foundation"
  hosts: eriduous_vdi
  gather_facts: false
  become: false

  vars:
    forge_root:  "/home/bahyway/Forge/bahyway_v4"
    script_path: "/tmp/bw_72_enki_hajj.py"

  tasks:

    - name: "1.0 | Write bw_72_enki_hajj.py"
      ansible.builtin.copy:
        dest: "{{ script_path }}"
        mode: "0755"
        content: |
          #!/usr/bin/env python3
          # ENKI-HAJJ Foundation — BahyWay.Ecosystem v4.0 — DUB.SAR 𒁾
          import os, subprocess, sys, textwrap

          FORGE  = "/home/bahyway/Forge/bahyway_v4"
          CRATE  = f"{FORGE}/crates/enki-hajj"
          SRC    = f"{CRATE}/src"
          os.makedirs(SRC, exist_ok=True)
          write = lambda p, c: open(p, "w").write(c)

          write(f"{CRATE}/Cargo.toml", textwrap.dedent("""\
          [package]
          name    = "enki-hajj"
          version = "4.0.0"
          edition = "2021"
          authors = ["DUB.SAR 𒁾 — Bahaa Fadam"]
          description = "ENKI-HAJJ Sovereign Pilgrimage Management"
          [dependencies]
          enkidb-kaki = { path = "../enkidb-kaki" }
          serde       = { version = "1", features = ["derive"] }
          """))

          write(f"{SRC}/lib.rs", textwrap.dedent("""\
          //! ENKI-HAJJ 𒀭𒂗𒆳𒀭𒌑 — Sovereign Pilgrimage Management
          //! "Enki of the Sacred Journey"
          //! BahyWay.Ecosystem v4.0 — DUB.SAR 𒁾
          //!
          //! CONSTITUTIONAL AXIOM (sealed):
          //!   "A pilgrim who makes the most sacred journey of their life
          //!    deserves to arrive, worship, and return home safely.
          //!    Every person in that crowd is a sovereign particle.
          //!    ENKI-HAJJ makes the invisible crowd sovereign."
          //!
          //! SCALE:
          //!   Arbaeen 2023: 21 million pilgrims in 2 weeks
          //!   Daily normal: 50,000–200,000 per shrine
          //!   Largest peaceful human gathering on Earth
          //!
          //! ŠĀRU_crowd = Σ (density - safe_threshold) × minutes
          //!   Accumulates when zone density exceeds safe capacity
          //!   TIAMAT fires at DILBAT before crush becomes lethal
          //!
          //! KAKI v4.0:
          //!   Every pilgrim = Identity-KAKI particle
          //!   Every gate event = Event-KAKI
          //!   κ[6]=kaki_type κ[7]=kaki_role — never quality
          //!   Quality (safety level) in EAV — not KAKI bytes

          #![forbid(unsafe_code)]

          pub mod pilgrim;
          pub mod zone;
          pub mod sharu_crowd;

          // ── Pilgrim Categories ────────────────────────────────────────

          #[repr(u8)]
          #[derive(Debug, Clone, Copy, PartialEq)]
          pub enum PilgrimRole {
              Domestic      = 0x01,
              International = 0x02,
              Elderly       = 0x03,  // mobility needs — priority routing
              Child         = 0x04,  // under 12 — NAMTAR-HAJJ monitored
              Lost          = 0x05,  // NAMTAR-HAJJ alert
              SecurityStaff = 0x06,  // plain-clothes (KIBRATU-HAJJ)
              Medical       = 0x07,  // shrine medical team
          }

          // ── Shrine Zones ──────────────────────────────────────────────

          #[derive(Debug, Clone, PartialEq, serde::Serialize, serde::Deserialize)]
          pub enum ShrineSite {
              ImamAliNajaf,
              ImamHusseinKarbala,
              ImamAbbaKarbala,
              WadiAlSalamCemetery,
          }

          /// Safe crowd density (persons per m²)
          pub const SAFE_DENSITY_PER_M2: f32 = 2.0;
          /// DILBAT density — TIAMAT fires warning
          pub const DILBAT_DENSITY: f32 = 3.0;
          /// KAKKAB density — divert incoming flow
          pub const KAKKAB_DENSITY: f32 = 4.0;
          /// ERRA density — emergency diversion
          pub const ERRA_DENSITY:   f32 = 5.5;
          /// KUR density — crush risk — evacuate NOW
          pub const KUR_DENSITY:    f32 = 7.0;

          /// TIAMAT alert from crowd density
          pub fn density_to_tiamat(density: f32) -> u8 {
              if density >= KUR_DENSITY    { 4 }
              else if density >= ERRA_DENSITY   { 3 }
              else if density >= KAKKAB_DENSITY { 2 }
              else if density >= DILBAT_DENSITY { 1 }
              else { 0 }
          }

          #[cfg(test)]
          mod tests {
              use super::*;

              #[test]
              fn test_density_tiamat_mapping() {
                  assert_eq!(density_to_tiamat(1.5), 0); // safe
                  assert_eq!(density_to_tiamat(3.5), 1); // DILBAT
                  assert_eq!(density_to_tiamat(4.5), 2); // KAKKAB
                  assert_eq!(density_to_tiamat(6.0), 3); // ERRA
                  assert_eq!(density_to_tiamat(8.0), 4); // KUR
              }

              #[test]
              fn test_pilgrim_roles_sealed() {
                  assert_eq!(PilgrimRole::Domestic as u8,      0x01);
                  assert_eq!(PilgrimRole::International as u8, 0x02);
                  assert_eq!(PilgrimRole::Child as u8,         0x04);
                  assert_eq!(PilgrimRole::Lost as u8,          0x05);
              }
          }
          """))

          write(f"{SRC}/pilgrim.rs", textwrap.dedent("""\
          //! Pilgrim particle — sovereign identity + location

          #![forbid(unsafe_code)]

          use enkidb_kaki::Kaki;
          use crate::PilgrimRole;

          #[derive(Debug, Clone)]
          pub struct PilgrimParticle {
              /// Identity-KAKI — κ[6]=0x01 Identity, κ[7]=PilgrimRole
              pub kaki:         Kaki,
              pub role:         PilgrimRole,
              /// Current zone_id (shrine section)
              pub zone_id:      u16,
              /// Position within zone
              pub x:            f32,
              pub y:            f32,
              /// Movement
              pub heading_deg:  f32,
              pub speed_m_s:    f32,
              /// EAV — safety level (1.0=safe 0.0=emergency) — NOT KAKI bytes
              pub eav_quality:  f32,
              /// Entry gate and time
              pub entry_gate:   u8,
              pub entry_epoch:  u64,
              /// Group ID (family/tour group)
              pub group_id:     Option<u16>,
              /// Wristband BLE token
              pub ble_token:    Option<[u8; 8]>,
          }

          impl PilgrimParticle {
              pub fn mint(
                  passport_hash: u32,
                  zone_id:       u16,
                  role:          PilgrimRole,
                  group_id:      Option<u16>,
                  entry_gate:    u8,
                  entry_epoch:   u64,
              ) -> Self {
                  Self {
                      kaki: Kaki::mint(
                          passport_hash, zone_id,
                          enkidb_kaki::KakiType::Identity,
                          role as u8,
                      ),
                      role, zone_id,
                      x: 0.0, y: 0.0,
                      heading_deg: 0.0, speed_m_s: 0.8,
                      eav_quality: 1.0,  // healthy pilgrim
                      entry_gate, entry_epoch,
                      group_id, ble_token: None,
                  }
              }

              /// Update position — called by BLE beacon or camera tracking
              pub fn update_position(&mut self, x: f32, y: f32,
                                      heading: f32, speed: f32) {
                  self.x = x; self.y = y;
                  self.heading_deg = heading; self.speed_m_s = speed;
              }
          }
          """))

          write(f"{SRC}/zone.rs", textwrap.dedent("""\
          //! Shrine zone — crowd density monitoring

          #![forbid(unsafe_code)]

          use crate::{SAFE_DENSITY_PER_M2, density_to_tiamat};

          #[derive(Debug, Clone)]
          pub struct ShrineZone {
              pub zone_id:     u16,
              pub name:        String,
              pub area_m2:     f32,
              pub capacity:    u32,
              pub current_count: u32,
              pub adjacent_zones: Vec<u16>,
          }

          impl ShrineZone {
              pub fn density(&self) -> f32 {
                  self.current_count as f32 / self.area_m2
              }

              pub fn occupancy_pct(&self) -> f32 {
                  self.current_count as f32 / self.capacity as f32 * 100.0
              }

              pub fn tiamat_level(&self) -> u8 {
                  density_to_tiamat(self.density())
              }

              pub fn is_safe(&self) -> bool {
                  self.density() < SAFE_DENSITY_PER_M2
              }
          }
          """))

          write(f"{SRC}/sharu_crowd.rs", textwrap.dedent("""\
          //! ŠĀRU_crowd — Crowd Density Deficit Accumulator
          //!
          //! ŠĀRU_crowd = Σ (density - safe_threshold) × minutes
          //! Accumulates when zone density exceeds safe capacity.
          //! This is a NEW ŠĀRU type specific to pilgrimage management.

          #![forbid(unsafe_code)]

          use crate::{ShrineZone, SAFE_DENSITY_PER_M2};

          #[derive(Debug, Clone, Default)]
          pub struct SharuCrowdAccumulator {
              pub zone_id:         u16,
              pub accumulated:     f64,  // density-excess × minutes
              pub peak_density:    f32,
              pub minutes_unsafe:  u32,
          }

          impl SharuCrowdAccumulator {
              pub fn new(zone_id: u16) -> Self {
                  Self { zone_id, ..Default::default() }
              }

              /// Tick — called every minute per zone
              pub fn tick(&mut self, zone: &ShrineZone) {
                  let density = zone.density();
                  if density > SAFE_DENSITY_PER_M2 {
                      let excess = density - SAFE_DENSITY_PER_M2;
                      self.accumulated  += excess as f64;
                      self.minutes_unsafe += 1;
                  }
                  if density > self.peak_density {
                      self.peak_density = density;
                  }
              }

              /// Reset when zone returns to safe density for 5+ minutes
              pub fn reset_if_safe(&mut self, zone: &ShrineZone) {
                  if zone.density() < SAFE_DENSITY_PER_M2 * 0.7 {
                      self.accumulated    = 0.0;
                      self.minutes_unsafe = 0;
                  }
              }
          }

          #[cfg(test)]
          mod tests {
              use super::*;

              fn test_zone(density_people: u32) -> ShrineZone {
                  ShrineZone {
                      zone_id: 1, name: "Test Zone".into(),
                      area_m2: 1000.0, capacity: 2000,
                      current_count: density_people,
                      adjacent_zones: vec![2],
                  }
              }

              #[test]
              fn test_sharu_accumulates_over_safe_threshold() {
                  let mut acc = SharuCrowdAccumulator::new(1);
                  let zone    = test_zone(5000);  // 5.0 per m² > safe 2.0
                  acc.tick(&zone);
                  acc.tick(&zone);
                  acc.tick(&zone);
                  assert!(acc.accumulated > 0.0);
                  assert_eq!(acc.minutes_unsafe, 3);
              }

              #[test]
              fn test_sharu_zero_in_safe_zone() {
                  let mut acc = SharuCrowdAccumulator::new(1);
                  let zone    = test_zone(1000);  // 1.0 per m² — safe
                  acc.tick(&zone);
                  assert_eq!(acc.accumulated, 0.0);
                  assert_eq!(acc.minutes_unsafe, 0);
              }
          }
          """))

          ws = f"{FORGE}/Cargo.toml"
          with open(ws) as f: c = f.read()
          if '"crates/enki-hajj"' not in c:
              c = c.replace('members = [', 'members = [\n    "crates/enki-hajj",')
              open(ws, "w").write(c)

          r = subprocess.run(["cargo", "build", "-p", "enki-hajj"],
              cwd=FORGE, capture_output=True, text=True)
          if r.returncode != 0: print(r.stderr[-2000:]); sys.exit(1)
          t = subprocess.run(["cargo", "test", "-p", "enki-hajj", "--", "--nocapture"],
              cwd=FORGE, capture_output=True, text=True)
          if t.returncode != 0: print(t.stdout[-1000:]); sys.exit(1)
          print("✓ ENKI-HAJJ 𒀭𒂗𒆳𒀭𒌑 — foundation + ŠĀRU_crowd — tests pass")
          print("✓ PLAYBOOK 72 — ENKI-HAJJ FOUNDATION COMPLETE")

    - name: "2.0 | Execute"
      ansible.builtin.command: "python3 {{ script_path }}"
      register: p72_out
      changed_when: true
    - name: "2.1 | Show"
      ansible.builtin.debug:
        msg: "{{ p72_out.stdout_lines }}"

