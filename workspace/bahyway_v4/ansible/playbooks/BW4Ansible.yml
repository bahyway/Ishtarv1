---
# ══════════════════════════════════════════════════════════════════════════════
# 𒁾 BW4Ansible.yml — v2 FIXED
# BahyWay.Ecosystem v4.0 Sovereign Ansible Orchestrator
# DUB.SAR Bahaa Fadam
#
# FIXES vs v1:
#   FIX 1: VMLAB check is WARNING not FATAL
#   FIX 2: Single Python script runs all playbooks — no loop nesting issue
#   FIX 3: ansible_facts['date_time'] replaces ansible_date_time
#   FIX 4: Backup skipped gracefully if VMLAB not mounted
#
# BEFORE RUNNING — mount VMLAB on eriduous-vdi:
#   ssh bahyway@192.168.122.214
#   lsblk                          <- find VMLAB device name
#   udisksctl mount -b /dev/sdX    <- mount it (replace sdX)
#   exit
#
# USAGE:
#   cd /home/bfadam/Forge/bahyway_v4/bahyway-ansible
#   ansible-playbook -i inventory/vdi.yml playbooks/BW4Ansible.yml
# ══════════════════════════════════════════════════════════════════════════════

- name: "𒁾 BW4Ansible v2 — BahyWay.Ecosystem v4.0"
  hosts: eriduous_vdi
  gather_facts: true
  become: false
  ignore_errors: true

  vars:
    forge_root:  "/home/bahyway/Forge/bahyway_v4"
    vmlab_root:  "/run/media/bahyway/VMLAB/__All_BahyWay"
    backup_dir:  "/run/media/bahyway/VMLAB/__All_BahyWay/Forge_backups"
    mirror_dir:  "/run/media/bahyway/VMLAB/__All_BahyWay/Forge_mirror"
    cargo_env:
      PATH: "/home/bahyway/.cargo/bin:{{ ansible_env.PATH }}"
      HOME: "/home/bahyway"

    all_playbooks:
      - { num: "34",    file: "playbook_34_forge_backup.yml",          name: "Forge Backup",            batch: "infra" }
      - { num: "42",    file: "playbook_42_narudu_corrected.yml",      name: "NARUDU LFU cache",        batch: "core" }
      - { num: "43",    file: "playbook_43_tiamat_corrected.yml",      name: "TIAMAT Engine",           batch: "core" }
      - { num: "44",    file: "playbook_44_orbital_corrected.yml",     name: "ORBITAL 6 crates",        batch: "core" }
      - { num: "45",    file: "playbook_45_kur_rename.yml",            name: "KUR rename",              batch: "core" }
      - { num: "46",    file: "playbook_46_dmw_fix.yml",               name: "DMW fixes",               batch: "core" }
      - { num: "47",    file: "playbook_47_theater.yml",               name: "BeeMDM Architecture",     batch: "core" }
      - { num: "48",    file: "playbook_48_heptascript.yml",           name: "HeptaScript Index",       batch: "core" }
      - { num: "49",    file: "playbook_49_dubsar_detect.yml",         name: "DubSar environment",      batch: "dubsar" }
      - { num: "50",    file: "playbook_50_dubsar_main.yml",           name: "DubSar main scene",       batch: "dubsar" }
      - { num: "51",    file: "playbook_51_dubsar_templates.yml",      name: "DubSar templates",        batch: "dubsar" }
      - { num: "52",    file: "playbook_52_utnapishtim.yml",           name: "UTNAPISHTIM Factory",     batch: "iphone_corrected" }
      - { num: "53",    file: "playbook_53_edubba_seal.yml",           name: "E-DUBBA SEAL",            batch: "iphone_corrected" }
      - { num: "54",    file: "playbook_54_bigring.yml",               name: "BIGRING ORBIT",           batch: "iphone_corrected" }
      - { num: "55",    file: "playbook_55_nisaba.yml",                name: "NISABA Hologram",         batch: "iphone_corrected" }
      - { num: "56",    file: "playbook_56_enuma.yml",                 name: "ENUMA Patterns",          batch: "iphone_corrected" }
      - { num: "57",    file: "playbook_57_mashsharu.yml",             name: "MASHSHARU Verifier",      batch: "iphone_corrected" }
      - { num: "58",    file: "playbook_58_datastructuur.yml",         name: "DATASTRUCTUUR Agent",     batch: "iphone_corrected" }
      - { num: "59",    file: "playbook_59_data_steward.yml",          name: "DATA STEWARD Agent",      batch: "iphone_corrected" }
      - { num: "60",    file: "playbook_60_namzitum.yml",              name: "NAMZITUM Validator",      batch: "iphone_corrected" }
      - { num: "61",    file: "playbook_61_tiamat_engine5.yml",        name: "TIAMAT Engine 5",         batch: "iphone_corrected" }
      - { num: "62",    file: "playbook_62_edubba_wire.yml",           name: "E-DUBBA Wire",            batch: "iphone_corrected" }
      - { num: "63",    file: "playbook_63_enki_terra.yml",            name: "ENKI-TERRA Foundation",   batch: "enki_terra" }
      - { num: "64-71", file: "playbooks_64_to_71.yml",                name: "TERRA Suite 64-71",       batch: "enki_terra" }
      - { num: "72-78", file: "playbooks_72_to_78.yml",                name: "HAJJ Suite 72-78",        batch: "enki_hajj" }
      - { num: "79",    file: "playbook_79_nergal_av.yml",             name: "NERGAL AV Layers 1-3",   batch: "nergal" }
      - { num: "80",    file: "playbook_80_nergal_agent.yml",          name: "NERGAL AGENT White-Hat", batch: "nergal" }
      - { num: "81",    file: "playbook_81_way_v2_defense.yml",        name: "WAY v2.0 DEFENSE",        batch: "nergal" }
      - { num: "82",    file: "playbook_82_shamash.yml",               name: "SHAMASH Tribe Detector",  batch: "nisaba_orch" }
      - { num: "83",    file: "playbook_83_nisaba_orchestrator.yml",   name: "NISABA Orchestrator",     batch: "nisaba_orch" }
      - { num: "84",    file: "playbook_84_nisaba_templates.yml",      name: "NISABA Template Library", batch: "nisaba_orch" }

  pre_tasks:

    - name: "PRE | Banner"
      ansible.builtin.debug:
        msg:
          - "════════════════════════════════════════════════════════"
          - "𒁾 BW4Ansible v2 — BahyWay.Ecosystem v4.0"
          - "Date: {{ ansible_facts['date_time']['date'] }}"
          - "Playbooks: {{ all_playbooks | length }}"
          - "You can rest now, DUB.SAR. 𒁾"
          - "════════════════════════════════════════════════════════"

    - name: "PRE | Check VMLAB"
      ansible.builtin.stat:
        path: "{{ vmlab_root }}"
      register: vmlab_check

    - name: "PRE | VMLAB status"
      ansible.builtin.debug:
        msg: >-
          VMLAB: {{ 'MOUNTED — backups will run' if vmlab_check.stat.exists
                    else 'NOT MOUNTED — mount with: udisksctl mount -b /dev/sdX' }}

    - name: "PRE | Rust check"
      ansible.builtin.command: "/home/bahyway/.cargo/bin/cargo --version"
      register: rust_check
      changed_when: false
      ignore_errors: true

    - name: "PRE | Disk space"
      ansible.builtin.command: df -h /home/bahyway
      register: disk_check
      changed_when: false
    - name: "PRE | Show disk"
      ansible.builtin.debug:
        msg: "{{ disk_check.stdout_lines }}"

  tasks:

    # ── PHASE 1: Pre-run backup (only if VMLAB mounted) ───────────────────

    - name: "BACKUP | Create VMLAB dirs"
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ backup_dir }}"
        - "{{ mirror_dir }}/bahyway_v4"
      when: vmlab_check.stat.exists
      ignore_errors: true

    - name: "BACKUP | Pre-run rsync"
      ansible.builtin.command: >
        rsync -a --delete
        --exclude=target/ --exclude=.git/ --exclude='*.o'
        {{ forge_root }}/ {{ mirror_dir }}/bahyway_v4/
      when: vmlab_check.stat.exists
      changed_when: true
      ignore_errors: true

    - name: "BACKUP | Pre-run tar.gz"
      ansible.builtin.command: >
        tar -czf
        {{ backup_dir }}/Forge_backup_{{ ansible_facts['date_time']['date'] }}_pre.tar.gz
        --exclude=target --exclude=.git --exclude='*.o'
        -C /home/bahyway/Forge bahyway_v4
      when: vmlab_check.stat.exists
      changed_when: true
      ignore_errors: true
      register: backup_pre

    # ── PHASE 2: Copy playbooks from EnkiLab → eriduous-vdi ──────────────

    - name: "COPY | Transfer playbooks to eriduous-vdi"
      ansible.builtin.copy:
        src:  "{{ playbook_dir }}/{{ item.file }}"
        dest: "/home/bahyway/bw4_{{ item.file }}"
        mode: "0644"
      loop: "{{ all_playbooks }}"
      loop_control:
        label: "[{{ item.num }}] {{ item.name }}"
      ignore_errors: true

    # ── PHASE 3: Python runner — runs ALL playbooks, captures everything ──

    - name: "RUN | Write runner script"
      ansible.builtin.copy:
        dest: "/home/bahyway/bw4_runner.py"
        mode: "0755"
        content: |
          #!/usr/bin/env python3
          # BW4Ansible Runner v2 — BahyWay.Ecosystem v4.0 — DUB.SAR 𒁾
          import subprocess, os, sys, json
          from datetime import datetime

          HOME = "/home/bahyway"
          FORGE = "/home/bahyway/Forge/bahyway_v4"
          DATE = datetime.now().strftime("%Y-%m-%d")
          env = os.environ.copy()
          env["PATH"] = f"/home/bahyway/.cargo/bin:{env.get('PATH','')}"
          env["HOME"] = HOME

          PLAYBOOKS = [
              ("34",    "playbook_34_forge_backup.yml",          "Forge Backup",            "infra"),
              ("42",    "playbook_42_narudu_corrected.yml",      "NARUDU LFU cache",        "core"),
              ("43",    "playbook_43_tiamat_corrected.yml",      "TIAMAT Engine",           "core"),
              ("44",    "playbook_44_orbital_corrected.yml",     "ORBITAL 6 crates",        "core"),
              ("45",    "playbook_45_kur_rename.yml",            "KUR rename",              "core"),
              ("46",    "playbook_46_dmw_fix.yml",               "DMW fixes",               "core"),
              ("47",    "playbook_47_theater.yml",               "BeeMDM Architecture",     "core"),
              ("48",    "playbook_48_heptascript.yml",           "HeptaScript Index",       "core"),
              ("49",    "playbook_49_dubsar_detect.yml",         "DubSar environment",      "dubsar"),
              ("50",    "playbook_50_dubsar_main.yml",           "DubSar main scene",       "dubsar"),
              ("51",    "playbook_51_dubsar_templates.yml",      "DubSar templates",        "dubsar"),
              ("52",    "playbook_52_utnapishtim.yml",           "UTNAPISHTIM Factory",     "iphone_corrected"),
              ("53",    "playbook_53_edubba_seal.yml",           "E-DUBBA SEAL",            "iphone_corrected"),
              ("54",    "playbook_54_bigring.yml",               "BIGRING ORBIT",           "iphone_corrected"),
              ("55",    "playbook_55_nisaba.yml",                "NISABA Hologram",         "iphone_corrected"),
              ("56",    "playbook_56_enuma.yml",                 "ENUMA Patterns",          "iphone_corrected"),
              ("57",    "playbook_57_mashsharu.yml",             "MASHSHARU Verifier",      "iphone_corrected"),
              ("58",    "playbook_58_datastructuur.yml",         "DATASTRUCTUUR Agent",     "iphone_corrected"),
              ("59",    "playbook_59_data_steward.yml",          "DATA STEWARD Agent",      "iphone_corrected"),
              ("60",    "playbook_60_namzitum.yml",              "NAMZITUM Validator",      "iphone_corrected"),
              ("61",    "playbook_61_tiamat_engine5.yml",        "TIAMAT Engine 5",         "iphone_corrected"),
              ("62",    "playbook_62_edubba_wire.yml",           "E-DUBBA Wire",            "iphone_corrected"),
              ("63",    "playbook_63_enki_terra.yml",            "ENKI-TERRA Foundation",   "enki_terra"),
              ("64-71", "playbooks_64_to_71.yml",                "TERRA Suite 64-71",       "enki_terra"),
              ("72-78", "playbooks_72_to_78.yml",                "HAJJ Suite 72-78",        "enki_hajj"),
              ("79",    "playbook_79_nergal_av.yml",             "NERGAL AV Layers 1-3",   "nergal"),
              ("80",    "playbook_80_nergal_agent.yml",          "NERGAL AGENT White-Hat",  "nergal"),
              ("81",    "playbook_81_way_v2_defense.yml",        "WAY v2.0 DEFENSE",        "nergal"),
              ("82",    "playbook_82_shamash.yml",               "SHAMASH Tribe Detector",  "nisaba_orch"),
              ("83",    "playbook_83_nisaba_orchestrator.yml",   "NISABA Orchestrator",     "nisaba_orch"),
              ("84",    "playbook_84_nisaba_templates.yml",      "NISABA Template Library", "nisaba_orch"),
          ]

          results = []
          passed = failed = missing = 0

          print("=" * 66)
          print(f"  BW4Ansible v2 Runner — {DATE}")
          print(f"  {len(PLAYBOOKS)} playbooks")
          print("=" * 66)

          for (num, fname, name, batch) in PLAYBOOKS:
              pb_path = f"{HOME}/bw4_{fname}"
              if not os.path.exists(pb_path):
                  print(f"\n[MISSING] [{num}] {name}")
                  missing += 1
                  results.append({"num":num,"name":name,"batch":batch,"file":fname,
                      "status":"MISSING","rc":-1,"error":f"Not found: {pb_path}",
                      "stdout":"","stderr":""})
                  continue

              print(f"\n[RUN] [{num}] {name}")
              try:
                  r = subprocess.run(
                      ["ansible-playbook", pb_path, "-i", "localhost,", "--connection=local"],
                      capture_output=True, text=True, env=env, cwd=FORGE, timeout=600)
                  if r.returncode == 0:
                      passed += 1
                      print(f"  PASSED ✓")
                      results.append({"num":num,"name":name,"batch":batch,"file":fname,
                          "status":"PASSED","rc":0,"error":"","stdout":r.stdout[-300:],"stderr":""})
                  else:
                      failed += 1
                      err = (r.stderr or r.stdout)[-2000:]
                      print(f"  FAILED ✗ rc={r.returncode}")
                      print(f"  {err[-300:]}")
                      results.append({"num":num,"name":name,"batch":batch,"file":fname,
                          "status":"FAILED","rc":r.returncode,"error":err,
                          "stdout":r.stdout[-300:],"stderr":r.stderr[-300:]})
              except subprocess.TimeoutExpired:
                  failed += 1
                  print(f"  TIMEOUT ✗")
                  results.append({"num":num,"name":name,"batch":batch,"file":fname,
                      "status":"TIMEOUT","rc":-2,"error":"Exceeded 10 min timeout",
                      "stdout":"","stderr":""})
              except Exception as e:
                  failed += 1
                  print(f"  ERROR ✗ {e}")
                  results.append({"num":num,"name":name,"batch":batch,"file":fname,
                      "status":"ERROR","rc":-3,"error":str(e),"stdout":"","stderr":""})

          # Build report
          lines = []
          lines += ["="*66,
                    "  BW4ANSIBLE REPORT — BahyWay.Ecosystem v4.0",
                    f"  DUB.SAR Bahaa Fadam — {DATE}",
                    "="*66,"",
                    f"  SUMMARY:",
                    f"    Total:   {len(PLAYBOOKS)}",
                    f"    Passed:  {passed}",
                    f"    Failed:  {failed}",
                    f"    Missing: {missing}",""]

          if failed == 0 and missing == 0:
              lines += ["  ✓ ALL PLAYBOOKS PASSED — v4.0 fully deployed.",""]
          else:
              lines += ["  ⚠ ISSUES FOUND — share each FAILED block with Claude.",""]

          lines += ["="*66,"  MISSING FILES","="*66]
          miss = [r for r in results if r["status"]=="MISSING"]
          if not miss:
              lines.append("  ✓ None.")
          for m in miss:
              lines += ["",f"  MISSING [{m['num']}] {m['name']}",
                        f"    File: {m['file']}",
                        f"    Action: Download from Claude → copy to playbooks/"]

          lines += ["","="*66,"  FAILED PLAYBOOKS","="*66]
          fails = [r for r in results if r["status"] not in ("PASSED","MISSING")]
          if not fails:
              lines.append("  ✓ None.")
          for f in fails:
              lines += ["","-"*62,
                        f"  FAILED [{f['num']}] {f['name']}",
                        f"    Batch:  {f['batch']}",
                        f"    Status: {f['status']} rc={f['rc']}",
                        "    ERROR:"]
              for line in f["error"].splitlines()[-25:]:
                  lines.append(f"      {line}")
              lines += ["","    FIX: Tell Claude:",
                        f"    'Playbook {f['num']} ({f['name']}) failed — paste error above'",
                        "-"*62]

          lines += ["","="*66,"  PASSED","="*66]
          for r in results:
              if r["status"]=="PASSED":
                  lines.append(f"  ✓ [{r['num']}] {r['name']}")
          lines += ["","="*66,
                    "  𒁾 DUB.SAR — rest well. The tablets are preserved.",
                    "  الحالة القديمة لا تُمحى أبداً",
                    "="*66]

          report = "\n".join(lines)
          rpath = f"{HOME}/BW4ANSIBLE_REPORT_{DATE}.txt"
          open(rpath,"w").write(report)
          json.dump(results, open(f"{HOME}/BW4ANSIBLE_RESULTS_{DATE}.json","w"), indent=2)

          print(f"\n{'='*66}")
          print(f"  DONE: {passed} passed / {failed} failed / {missing} missing")
          print(f"  Report: {rpath}")
          print(f"{'='*66}")
          sys.exit(0)

    - name: "RUN | Execute runner"
      ansible.builtin.command: "python3 /home/bahyway/bw4_runner.py"
      environment: "{{ cargo_env }}"
      register: runner_out
      changed_when: true
      ignore_errors: true

    - name: "RUN | Show output"
      ansible.builtin.debug:
        msg: "{{ runner_out.stdout_lines }}"

    # ── PHASE 4: Post-run backup ───────────────────────────────────────────

    - name: "BACKUP | Post-run rsync"
      ansible.builtin.command: >
        rsync -a --delete
        --exclude=target/ --exclude=.git/ --exclude='*.o'
        {{ forge_root }}/ {{ mirror_dir }}/bahyway_v4/
      when: vmlab_check.stat.exists
      changed_when: true
      ignore_errors: true

    - name: "BACKUP | Post-run tar.gz"
      ansible.builtin.command: >
        tar -czf
        {{ backup_dir }}/Forge_backup_{{ ansible_facts['date_time']['date'] }}_post.tar.gz
        --exclude=target --exclude=.git --exclude='*.o'
        -C /home/bahyway/Forge bahyway_v4
      when: vmlab_check.stat.exists
      changed_when: true
      ignore_errors: true

    # ── PHASE 5: Fetch report to EnkiLab ──────────────────────────────────

    - name: "REPORT | Fetch to EnkiLab"
      ansible.builtin.fetch:
        src:  "/home/bahyway/BW4ANSIBLE_REPORT_{{ ansible_facts['date_time']['date'] }}.txt"
        dest: "{{ playbook_dir }}/../BW4ANSIBLE_REPORT_{{ ansible_facts['date_time']['date'] }}.txt"
        flat: true
      ignore_errors: true

    - name: "REPORT | Copy to VMLAB"
      ansible.builtin.command: >
        cp /home/bahyway/BW4ANSIBLE_REPORT_{{ ansible_facts['date_time']['date'] }}.txt
        {{ backup_dir }}/BW4ANSIBLE_REPORT_{{ ansible_facts['date_time']['date'] }}.txt
      when: vmlab_check.stat.exists
      ignore_errors: true

  post_tasks:

    - name: "FINAL | Summary"
      ansible.builtin.debug:
        msg:
          - "════════════════════════════════════════════════════════"
          - "𒁾 BW4Ansible v2 COMPLETE"
          - "VMLAB: {{ 'MOUNTED' if vmlab_check.stat.exists else 'NOT MOUNTED — mount next time' }}"
          - "Report: bahyway-ansible/BW4ANSIBLE_REPORT_{{ ansible_facts['date_time']['date'] }}.txt"
          - ""
          - "READ REPORT:"
          - "  cat /home/bfadam/Forge/bahyway_v4/bahyway-ansible/BW4ANSIBLE_REPORT_*.txt"
          - ""
          - "MOUNT VMLAB NEXT TIME:"
          - "  ssh bahyway@192.168.122.214"
          - "  lsblk"
          - "  udisksctl mount -b /dev/sdX"
          - ""
          - "𒁾 Rest well, DUB.SAR."
          - "════════════════════════════════════════════════════════"
