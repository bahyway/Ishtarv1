        dest: "{{ crate }}/src/fanout/geometry.rs"
        content: |
          //! GeometryFanOut — parallel query across all four shards.
          //! std::thread + mpsc — zero async runtime.
          //! Merges results by OrbitalPosition — caller gets unified view.
          use std::sync::{Arc, mpsc};
          use crate::laws::geo01_e7::OrbitalPosition;
          use crate::laws::geo03_betti::BettiNumbers;
          use crate::registry::particle::ParticleStore;

          #[derive(Debug, Clone)]
          pub struct UnifiedEntry {
              pub surrogate: u32,
              pub tribe_id:  u16,
              pub position:  OrbitalPosition,
              pub store:     ParticleStore,
          }

          #[derive(Debug)]
          pub struct ShardQueryResult {
              pub store:   ParticleStore,
              pub entries: Vec<UnifiedEntry>,
          }

          #[derive(Debug)]
          pub struct UnifiedQueryResult {
              pub shard_results:  Vec<ShardQueryResult>,
              pub unified_entries: Vec<UnifiedEntry>,
              pub global_betti:   BettiNumbers,
              pub total_found:    usize,
          }

          pub struct GeometryFanOut;

          impl GeometryFanOut {
              /// Fan-out query across 4 shards in parallel.
              /// Each shard runs in its own thread — zero async.
              pub fn query_tribe(
                  enkidb:   Arc<crate::shard::EnkiDbShard>,
                  enkisdb:  Arc<crate::shard::EnkiSdbShard>,
                  enkiodb:  Arc<crate::shard::EnkiOdbShard>,
                  inflight: Arc<crate::shard::InFlightShard>,
                  tribe_id: u16,
              ) -> UnifiedQueryResult {
                  let (tx, rx) = mpsc::channel::<ShardQueryResult>();

                  // EnkiDB shard
                  let tx1 = tx.clone();
                  let db1 = Arc::clone(&enkidb);
                  std::thread::spawn(move || {
                      let entries = db1.query_tribe(tribe_id).into_iter().map(|e| UnifiedEntry {
                          surrogate: e.surrogate, tribe_id: e.tribe_id,
                          position: e.position, store: ParticleStore::EnkiDB,
                      }).collect();
                      let _ = tx1.send(ShardQueryResult { store: ParticleStore::EnkiDB, entries });
                  });

                  // EnkiSDB shard
                  let tx2 = tx.clone();
                  let db2 = Arc::clone(&enkisdb);
                  std::thread::spawn(move || {
                      let entries = db2.query_tribe(tribe_id).into_iter().map(|e| UnifiedEntry {
                          surrogate: e.surrogate, tribe_id: e.tribe_id,
                          position: e.position, store: ParticleStore::EnkiSDB,
                      }).collect();
                      let _ = tx2.send(ShardQueryResult { store: ParticleStore::EnkiSDB, entries });
                  });

                  // EnkiODB shard
                  let tx3 = tx.clone();
                  let db3 = Arc::clone(&enkiodb);
                  std::thread::spawn(move || {
                      let entries = db3.query_tribe(tribe_id).into_iter().map(|e| UnifiedEntry {
                          surrogate: e.surrogate, tribe_id: e.tribe_id,
                          position: e.position, store: ParticleStore::EnkiODB,
                      }).collect();
                      let _ = tx3.send(ShardQueryResult { store: ParticleStore::EnkiODB, entries });
                  });

                  // InFlight shard
                  let tx4 = tx.clone();
                  let db4 = Arc::clone(&inflight);
                  std::thread::spawn(move || {
                      let entries = db4.query_tribe(tribe_id).into_iter().map(|p| UnifiedEntry {
                          surrogate: p.surrogate, tribe_id: p.tribe_id,
                          position: p.position, store: ParticleStore::InFlight,
                      }).collect();
                      let _ = tx4.send(ShardQueryResult { store: ParticleStore::InFlight, entries });
                  });

                  drop(tx);

                  let mut shard_results = Vec::new();
                  for r in rx { shard_results.push(r); }

                  let mut unified: Vec<UnifiedEntry> = shard_results.iter()
                      .flat_map(|r| r.entries.iter().cloned())
                      .collect();

                  // Sort by orbital position for deterministic merge
                  unified.sort_by(|a, b| a.surrogate.cmp(&b.surrogate));
                  let total_found = unified.len();

                  // Compute global Betti from zone occupancy
                  let zone_counts = vec![total_found / 7; 7]; // simplified
                  let global_betti = crate::laws::geo03_betti::compute_betti(&zone_counts, 1);

                  UnifiedQueryResult { shard_results, unified_entries: unified, global_betti, total_found }
              }
          }

