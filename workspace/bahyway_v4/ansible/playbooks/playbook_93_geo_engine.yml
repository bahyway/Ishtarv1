        content: |
          //! # GeoEngine — Sovereign Geometry Engine
          //!
          //! Single source of ALL mathematical truth in BahyWay v4.0.
          //! Mirrors ConEngine: one wall, one law, one debug point.
          //!
          //! ## 7 GeoLaws:
          //!   GeoLaw-01  E7 lattice — the ONLY orbital zone decomposition
          //!   GeoLaw-02  B11 = round(H × 240) — Plimpton 322 ONLY
          //!   GeoLaw-03  Betti β₀/β₁/β₂ — computed ONLY here
          //!   GeoLaw-04  Gap(n) = Θ_E7(n) − Θ_found(n) — ONLY here
          //!   GeoLaw-05  Jordan Normal Form — orbit stability
          //!   GeoLaw-06  VGCA∆ — tribe algebra
          //!   GeoLaw-07  Pauli Exclusion — no two KAKIs same position
          //!
          //! ## 4 Shards:
          //!   EnkiDB   — committed particles (KISPU sealed)
          //!   EnkiSDB  — staging (processing in É-DUBBA gates)
          //!   EnkiODB  — ontology (CrossTribe registered)
          //!   InFlight — THE CROWN JEWEL (predicted, moving, not committed)
          //!
          //! ## WPD Engine:
          //!   spawn_inflight() → TIAMAT-predicted leak gets orbital position
          //!   tick()           → leak bleeds upstream, position advances
          //!   promote()        → physical confirmation → commits to EnkiDB

          #![forbid(unsafe_code)]

          pub mod error;
          pub mod laws;
          pub mod registry;
          pub mod shard;
          pub mod fanout;

          use std::sync::Arc;

          pub use error::{GeoEngineError, GeoResult};
          pub use laws::geo01_e7::OrbitalPosition;
          pub use laws::geo03_betti::BettiNumbers;
          pub use laws::geo04_gap::{gap, theta_e7, GapEvent, classify_gap};
          pub use laws::geo06_vgca::{VgcaRegistry, TribeOrbitCentre};
          pub use laws::geo07_pauli::PauliTable;
          pub use registry::particle::{
              UnifiedParticleRegistry, ParticleLocation, ParticleStore, GateId,
          };
          pub use shard::inflight::{InFlightSpawn, OrbitalVelocity, BleedStep};
          pub use fanout::geometry::UnifiedQueryResult;

          use shard::{EnkiDbShard, EnkiSdbShard, EnkiOdbShard, InFlightShard};
          use laws::geo07_pauli::PauliTable as Pauli;

          /// GeoEngine configuration.
          #[derive(Default)]
          pub struct GeoEngineConfig {
              pub max_shells: usize,
          }

          /// The sovereign geometry wall.
          pub struct GeoEngine {
              pub enkidb:   Arc<EnkiDbShard>,
              pub enkisdb:  Arc<EnkiSdbShard>,
              pub enkiodb:  Arc<EnkiOdbShard>,
              pub inflight: Arc<InFlightShard>,
              pub registry: UnifiedParticleRegistry,
              pub vgca:     VgcaRegistry,
              pub pauli:    Pauli,
          }

          impl GeoEngine {
              /// Boot GeoEngine — call once at ŠUMU-UKIN startup.
              pub fn boot(_cfg: GeoEngineConfig) -> Self {
                  eprintln!("𒁾 GeoEngine booted — 7 GeoLaws active, 4 shards ready");
                  Self {
                      enkidb:   Arc::new(EnkiDbShard::new()),
                      enkisdb:  Arc::new(EnkiSdbShard::new()),
                      enkiodb:  Arc::new(EnkiOdbShard::new()),
                      inflight: Arc::new(InFlightShard::new()),
                      registry: UnifiedParticleRegistry::new(),
                      vgca:     VgcaRegistry::new(),
                      pauli:    Pauli::new(),
                  }
              }

              /// Register a tribe orbit centre (WPD Engine: pipeline district).
              pub fn register_tribe(&mut self, centre: TribeOrbitCentre) {
                  self.vgca.register(centre);
              }

              /// Spawn an InFlight particle (TIAMAT prediction).
              /// GeoLaw-07: Pauli Exclusion enforced.
              pub fn spawn_inflight(&mut self, spawn: InFlightSpawn) -> GeoResult<()> {
                  let pos = spawn.position;
                  // GeoLaw-07: check Pauli Exclusion
                  self.pauli.occupy(pos.r, pos.theta, pos.phi, spawn.tribe_id, spawn.surrogate)?;
                  // Register in unified registry
                  let (shell, zone) = laws::geo01_e7::position_to_zone(&pos);
                  self.registry.register(ParticleLocation {
                      surrogate: spawn.surrogate,
                      store:     ParticleStore::InFlight,
                      position:  pos,
                      tribe_id:  spawn.tribe_id,
                      gate:      spawn.gate,
                      shell,
                      zone,
                  });
                  self.inflight.spawn(spawn);
                  Ok(())
              }

              /// Advance all InFlight particles by one tick.
              /// WPD Engine: call every sensor cycle.
              pub fn tick(&self) {
                  self.inflight.tick();
              }

              /// Promote InFlight → EnkiDB on physical confirmation.
              /// Returns sealed bleed trail for NĀRU journal.
              pub fn promote_to_enkidb(
                  &mut self,
                  surrogate: u32,
                  entry:     shard::CommittedEntry,
              ) -> Option<Vec<BleedStep>> {
                  let trail = self.inflight.promote(surrogate);
                  self.enkidb.insert(entry);
                  self.registry.update_store(surrogate, ParticleStore::EnkiDB);
                  // Release Pauli position
                  if let Some(loc) = self.registry.get(surrogate) {
                      let pos = loc.position;
                      self.pauli.release(pos.r, pos.theta, pos.phi, loc.tribe_id);
                  }
                  trail
              }

              /// Unified query across all 4 shards — the sovereign view.
              pub fn query_tribe(&self, tribe_id: u16) -> UnifiedQueryResult {
                  fanout::GeometryFanOut::query_tribe(
                      Arc::clone(&self.enkidb),
                      Arc::clone(&self.enkisdb),
                      Arc::clone(&self.enkiodb),
                      Arc::clone(&self.inflight),
                      tribe_id,
                  )
              }

              /// GeoLaw-04: Gap scan across all shells.
              pub fn gap_scan(&self) -> Vec<GapEvent> {
                  (0..7).map(|shell| {
                      let found = self.enkidb.count() + self.inflight.count();
                      classify_gap(shell, found / 7)
                  }).collect()
              }

              /// GeoLaw-03: Global Betti numbers across all shards.
              pub fn global_betti(&self) -> BettiNumbers {
                  let total = self.registry.total();
                  let zone_counts = vec![total / 7; 7];
                  laws::geo03_betti::compute_betti(&zone_counts, 1)
              }
          }

