    - name: "Write shard/inflight.rs — the crown jewel"
      ansible.builtin.copy:
        dest: "{{ crate }}/src/shard/inflight.rs"
        content: |
          //! InFlight Shard — THE CROWN JEWEL of GeoEngine.
          //!
          //! Tracks particles that no database has committed yet but are
          //! geometrically real — moving through the 7 É-DUBBA gates,
          //! or predicted by TIAMAT (e.g. WPD Engine pipeline leaks).
          //!
          //! Every ŠUMU-UKIN query hits this shard alongside committed stores.
          //! The caller sees a unified orbital view — never knows which store.
          //!
          //! WPD Engine use case:
          //!   TIAMAT predicts junction J-047 will leak in 23 days.
          //!   spawn_inflight() creates KAKI_LEAK_J047 with GPS position.
          //!   tick() advances its position as the leak bleeds upstream.
          //!   promote_to_enkidb() commits it when physically confirmed.

          use std::collections::HashMap;
          use std::sync::RwLock;
          use crate::laws::geo01_e7::OrbitalPosition;
          use crate::registry::particle::GateId;

          /// Velocity vector — how fast the particle moves per tick.
          /// WPD Engine: pressure gradient → velocity.
          #[derive(Debug, Clone, Copy)]
          pub struct OrbitalVelocity {
              pub delta_r:     f64,
              pub delta_theta: f64,
              pub delta_phi:   f64,
          }

          impl OrbitalVelocity {
              pub fn zero() -> Self {
                  Self { delta_r: 0.0, delta_theta: 0.0, delta_phi: 0.0 }
              }

              /// Convert pressure gradient (Pa/m) to orbital velocity.
              pub fn from_pressure_gradient(gradient: f64) -> Self {
                  Self {
                      delta_r:     0.0,
                      delta_theta: gradient * 0.001,
                      delta_phi:   gradient * 0.0005,
                  }
              }
          }

          /// A step in the particle's bleed trail — for audit and Nisaba.
          #[derive(Debug, Clone)]
          pub struct BleedStep {
              pub tick:     u64,
              pub position: OrbitalPosition,
          }

          /// An InFlight particle — geometrically real, not yet committed.
          #[derive(Debug, Clone)]
          pub struct InFlightParticle {
              pub surrogate:         u32,
              pub tribe_id:          u16,
              pub position:          OrbitalPosition,
              pub velocity:          OrbitalVelocity,
              pub gate:              Option<GateId>,
              pub tiamat_confidence: f64,    // 0.0–1.0 prediction confidence
              pub bleed_trail:       Vec<BleedStep>,
              pub tick:              u64,
          }

          impl InFlightParticle {
              /// Advance position by one tick using velocity vector.
              pub fn advance(&mut self) {
                  self.bleed_trail.push(BleedStep {
                      tick:     self.tick,
                      position: self.position,
                  });
                  self.position.r     += self.velocity.delta_r;
                  self.position.theta += self.velocity.delta_theta;
                  self.position.phi   += self.velocity.delta_phi;
                  // Wrap phi to [0, 2π)
                  self.position.phi = self.position.phi
                      .rem_euclid(2.0 * std::f64::consts::PI);
                  self.tick += 1;
              }
          }

          /// Spawn parameters for a new InFlight particle.
          pub struct InFlightSpawn {
              pub surrogate:         u32,
              pub tribe_id:          u16,
              pub position:          OrbitalPosition,
              pub velocity:          OrbitalVelocity,
              pub tiamat_confidence: f64,
              pub gate:              Option<GateId>,
          }

          /// InFlight shard — all in-transit particles.
          pub struct InFlightShard {
              particles: RwLock<HashMap<u32, InFlightParticle>>,
          }

          impl InFlightShard {
              pub fn new() -> Self {
                  Self { particles: RwLock::new(HashMap::new()) }
              }

              /// Spawn a new InFlight particle (TIAMAT prediction or gate entry).
              pub fn spawn(&self, spawn: InFlightSpawn) {
                  let particle = InFlightParticle {
                      surrogate:         spawn.surrogate,
                      tribe_id:          spawn.tribe_id,
                      position:          spawn.position,
                      velocity:          spawn.velocity,
                      gate:              spawn.gate,
                      tiamat_confidence: spawn.tiamat_confidence,
                      bleed_trail:       Vec::new(),
                      tick:              0,
                  };
                  self.particles.write().unwrap().insert(spawn.surrogate, particle);
              }

              /// Advance all InFlight particles by one tick.
              pub fn tick(&self) {
                  for p in self.particles.write().unwrap().values_mut() {
                      p.advance();
                  }
              }

              /// Advance gate for a particle moving through É-DUBBA.
              pub fn advance_gate(&self, surrogate: u32, gate: GateId) {
                  if let Some(p) = self.particles.write().unwrap().get_mut(&surrogate) {
                      p.gate = Some(gate);
                  }
              }

              /// Remove particle from InFlight on promotion to EnkiDB.
              /// Returns the sealed bleed trail for NĀRU journal.
              pub fn promote(&self, surrogate: u32) -> Option<Vec<BleedStep>> {
                  self.particles.write().unwrap()
                      .remove(&surrogate)
                      .map(|p| p.bleed_trail)
              }

              /// Query — return all particles for tribe_id.
              pub fn query_tribe(&self, tribe_id: u16) -> Vec<InFlightParticle> {
                  self.particles.read().unwrap()
                      .values()
                      .filter(|p| p.tribe_id == tribe_id)
                      .cloned()
                      .collect()
              }

              pub fn count(&self) -> usize {
                  self.particles.read().unwrap().len()
              }

              pub fn get(&self, surrogate: u32) -> Option<InFlightParticle> {
                  self.particles.read().unwrap().get(&surrogate).cloned()
              }
          }

          impl Default for InFlightShard {
              fn default() -> Self { Self::new() }
          }

