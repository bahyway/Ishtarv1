    - name: "Write laws/geo01_e7.rs"
      ansible.builtin.copy:
        dest: "{{ crate }}/src/laws/geo01_e7.rs"
        content: |
          //! GeoLaw-01: E7 lattice — the ONLY orbital zone decomposition.
          //! Maryna Viazovska's Fields Medal proof: 126 kissing neighbours.
          //! 7 polar bands × 18 azimuthal sectors = 126 zones per shell.

          pub const E7_KISSING_NUMBER: usize = 126;
          pub const POLAR_BANDS:       usize = 7;
          pub const AZIMUTH_SECTORS:   usize = 18;
          pub const ZONES_PER_SHELL:   usize = 126; // 7 × 18
          pub const MAX_SHELLS:        usize = 7;
          pub const TOTAL_ZONES:       usize = 882; // 7 shells × 126 zones

          /// Spherical orbital position.
          #[derive(Debug, Clone, Copy, PartialEq)]
          pub struct OrbitalPosition {
              pub r:     f64,  // radial distance  [0, ∞)
              pub theta: f64,  // polar angle      [0, π]
              pub phi:   f64,  // azimuthal angle  [0, 2π)
          }

          impl OrbitalPosition {
              pub fn new(r: f64, theta: f64, phi: f64) -> Self {
                  Self { r, theta, phi }
              }

              /// Convert GPS coordinates to orbital position.
              /// lat/lon → (theta, phi), altitude → r
              pub fn from_gps(lat: f64, lon: f64, alt_km: f64) -> Self {
                  let theta = (90.0 - lat).to_radians();
                  let phi   = (lon + 180.0).to_radians();
                  Self { r: alt_km.max(0.1), theta, phi }
              }
          }

          /// Map orbital position to (shell, zone) index pair.
          /// Shell = discrete radial band. Zone = E7 heptagonal bucket.
          pub fn position_to_zone(pos: &OrbitalPosition) -> (usize, usize) {
              let shell = (pos.r.floor() as usize).min(MAX_SHELLS - 1);
              let band  = ((pos.theta / std::f64::consts::PI) * POLAR_BANDS as f64)
                              .floor() as usize;
              let band  = band.min(POLAR_BANDS - 1);
              let sector = ((pos.phi / (2.0 * std::f64::consts::PI)) * AZIMUTH_SECTORS as f64)
                              .floor() as usize;
              let sector = sector.min(AZIMUTH_SECTORS - 1);
              let zone   = band * AZIMUTH_SECTORS + sector;
              (shell, zone)
          }

          /// The 126 E7 kissing neighbours of a zone.
          /// Returns (shell, zone) pairs — wraps at boundaries.
          pub fn kissing_neighbours(shell: usize, zone: usize) -> Vec<(usize, usize)> {
              let mut neighbours = Vec::with_capacity(E7_KISSING_NUMBER);
              let band   = zone / AZIMUTH_SECTORS;
              let sector = zone % AZIMUTH_SECTORS;

              // Same shell — adjacent zones (E7 lattice connectivity)
              for db in 0..POLAR_BANDS {
                  for ds in 0..AZIMUTH_SECTORS {
                      if db == band && ds == sector { continue; }
                      let dist = ((db as isize - band as isize).abs()
                                + (ds as isize - sector as isize).abs()) as usize;
                      if dist <= 2 {
                          neighbours.push((shell, db * AZIMUTH_SECTORS + ds));
                      }
                  }
              }
              // Adjacent shells
              if shell > 0 {
                  neighbours.push((shell - 1, zone));
              }
              if shell < MAX_SHELLS - 1 {
                  neighbours.push((shell + 1, zone));
              }
              neighbours.truncate(E7_KISSING_NUMBER);
              neighbours
          }

    - name: "Write laws/geo02_plimpton.rs"
      ansible.builtin.copy:
        dest: "{{ crate }}/src/laws/geo02_plimpton.rs"
        content: |
          //! GeoLaw-02: B11 = round(H(P) × 240) — Plimpton 322 ONLY.
          //! 240 is the ONLY valid divisor. Never 255.

          pub const PLIMPTON_322_DIVISOR: u16 = 240;

          /// Compute ColourID B11 from a hash value H in [0.0, 1.0].
          /// GeoLaw-02: result is always in [0, 240].
          pub fn colour_id_b11(h: f64) -> u16 {
              let h = h.clamp(0.0, 1.0);
              (h * PLIMPTON_322_DIVISOR as f64).round() as u16
          }

          /// Compute H(P) from KAKI bytes (uuid_hash κ[0..3]).
          pub fn hash_from_kaki(kaki: &[u8; 16]) -> f64 {
              let raw = u32::from_le_bytes([kaki[0], kaki[1], kaki[2], kaki[3]]);
              raw as f64 / u32::MAX as f64
          }

          /// Derive B11 directly from KAKI bytes.
          pub fn b11_from_kaki(kaki: &[u8; 16]) -> u16 {
              colour_id_b11(hash_from_kaki(kaki))
          }

          #[cfg(test)]
          mod tests {
              use super::*;
              #[test]
              fn b11_never_exceeds_240() {
                  assert!(colour_id_b11(1.0) <= 240);
                  assert_ne!(colour_id_b11(1.0), 255);
              }
              #[test]
              fn b11_at_zero_is_zero() {
                  assert_eq!(colour_id_b11(0.0), 0);
              }
          }

    - name: "Write laws/geo03_betti.rs"
      ansible.builtin.copy:
        dest: "{{ crate }}/src/laws/geo03_betti.rs"
        content: |
          //! GeoLaw-03: Betti numbers β₀/β₁/β₂ — computed ONLY in GeoEngine.
          //! β₀ = connected components (clusters)
          //! β₁ = loops (pressure loops in WPD, cyclic patterns in data)
          //! β₂ = voids (empty orbital zones — hidden patterns)

          #[derive(Debug, Clone, Copy, Default, PartialEq)]
          pub struct BettiNumbers {
              pub b0: usize,  // clusters
              pub b1: usize,  // loops
              pub b2: usize,  // voids
          }

          impl BettiNumbers {
              /// Nisaba trigger: β₁ > 0 → loop detected → generate ṬUPŠARRU art
              pub fn nisaba_loop_trigger(&self) -> bool { self.b1 > 0 }

              /// Nisaba memorial trigger: β₂ > 0 → void detected → The Void is Sacred
              pub fn nisaba_memorial_trigger(&self) -> bool { self.b2 > 0 }

              /// KIBRATU trigger: β₀ deviation from expected cluster count
              pub fn kibratu_cluster_deviation(&self, expected_clusters: usize) -> i64 {
                  self.b0 as i64 - expected_clusters as i64
              }

              /// Combine Betti numbers from multiple zones
              pub fn combine(numbers: &[BettiNumbers]) -> Self {
                  Self {
                      b0: numbers.iter().map(|b| b.b0).sum(),
                      b1: numbers.iter().map(|b| b.b1).sum(),
                      b2: numbers.iter().map(|b| b.b2).sum(),
                  }
              }
          }

          /// Compute Betti numbers from zone particle counts.
          /// Simplified topological analysis from particle density.
          pub fn compute_betti(zone_counts: &[usize], threshold: usize) -> BettiNumbers {
              let occupied: Vec<bool> = zone_counts.iter().map(|&c| c >= threshold).collect();
              let n = occupied.len();

              // β₀: count connected components (adjacent occupied zones)
              let mut b0 = 0usize;
              let mut visited = vec![false; n];
              for i in 0..n {
                  if occupied[i] && !visited[i] {
                      b0 += 1;
                      // Simple flood fill
                      let mut stack = vec![i];
                      while let Some(j) = stack.pop() {
                          if visited[j] { continue; }
                          visited[j] = true;
                          // Neighbours in linear approximation
                          if j > 0 && occupied[j-1] && !visited[j-1] { stack.push(j-1); }
                          if j < n-1 && occupied[j+1] && !visited[j+1] { stack.push(j+1); }
                      }
                  }
              }

              // β₁: loops — zones with all neighbours occupied (enclosed regions)
              let b1 = (0..n).filter(|&i| {
                  occupied[i]
                      && i > 0 && occupied[i-1]
                      && i < n-1 && occupied[i+1]
              }).count() / 3; // rough approximation

              // β₂: voids — unoccupied zones surrounded by occupied zones
              let b2 = (1..n-1).filter(|&i| {
                  !occupied[i] && occupied[i-1] && occupied[i+1]
              }).count();

              BettiNumbers { b0, b1, b2 }
          }

    - name: "Write laws/geo04_gap.rs"
      ansible.builtin.copy:
        dest: "{{ crate }}/src/laws/geo04_gap.rs"
        content: |
          //! GeoLaw-04: Gap(n) = Θ_E7(n) − Θ_found(n)
          //! Positive gap → HIDDEN_PATTERN (missing particles)
          //! Negative gap → INTRUDER_CORRUPT (injected particles)
          //! Zero gap     → sovereign balance

          use super::geo01_e7::ZONES_PER_SHELL;

          /// E7 theta series: expected particle count at shell n.
          /// Shell 1 = 126, Shell 2 = 756, Shell 3 = 2520...
          /// Based on Viazovska's E7 theta series coefficients.
          pub fn theta_e7(shell: usize) -> usize {
              match shell {
                  0 => 1,
                  1 => 126,
                  2 => 756,
                  3 => 2520,
                  4 => 5670,
                  5 => 9072,
                  6 => 11592,
                  _ => shell * ZONES_PER_SHELL,
              }
          }

          /// Gap(n) = Θ_E7(n) − Θ_found(n)
          /// Returns signed gap — positive = missing, negative = excess.
          pub fn gap(shell: usize, found: usize) -> i64 {
              theta_e7(shell) as i64 - found as i64
          }

          #[derive(Debug, Clone)]
          pub enum GapEvent {
              /// Positive gap — KIBRATU cause: HIDDEN_PATTERN
              HiddenPattern { shell: usize, missing: usize },
              /// Negative gap — KIBRATU cause: INTRUDER_CORRUPT
              IntruderCorrupt { shell: usize, excess: usize },
              /// Zero gap — sovereign balance
              Sovereign { shell: usize },
          }

          pub fn classify_gap(shell: usize, found: usize) -> GapEvent {
              let g = gap(shell, found);
              match g.cmp(&0) {
                  std::cmp::Ordering::Greater =>
                      GapEvent::HiddenPattern { shell, missing: g as usize },
                  std::cmp::Ordering::Less =>
                      GapEvent::IntruderCorrupt { shell, excess: (-g) as usize },
                  std::cmp::Ordering::Equal =>
                      GapEvent::Sovereign { shell },
              }
          }

    - name: "Write laws/geo05_jordan.rs"
      ansible.builtin.copy:
        dest: "{{ crate }}/src/laws/geo05_jordan.rs"
        content: |
          //! GeoLaw-05: Jordan Normal Form — orbit stability validation.
          //! An orbit is stable if all eigenvalues lie inside the unit disc.
          //! Used by WPD Engine to predict whether a leak will stabilise.

          /// 2×2 real matrix (orbit state transition matrix)
          #[derive(Debug, Clone, Copy)]
          pub struct Matrix2x2 {
              pub a: f64, pub b: f64,
              pub c: f64, pub d: f64,
          }

          impl Matrix2x2 {
              /// Characteristic polynomial eigenvalues via quadratic formula.
              pub fn eigenvalues(&self) -> (f64, f64) {
                  let tr   = self.a + self.d;
                  let det  = self.a * self.d - self.b * self.c;
                  let disc = tr * tr - 4.0 * det;
                  if disc >= 0.0 {
                      let sq = disc.sqrt();
                      ((tr + sq) / 2.0, (tr - sq) / 2.0)
                  } else {
                      // Complex eigenvalues — use magnitude
                      let mag = det.sqrt();
                      (mag, mag)
                  }
              }

              /// GeoLaw-05: orbit is stable iff |λ| < 1 for all eigenvalues.
              pub fn is_stable(&self) -> bool {
                  let (l1, l2) = self.eigenvalues();
                  l1.abs() < 1.0 && l2.abs() < 1.0
              }

              /// WPD Engine: will a leak stabilise given current pressure matrix?
              pub fn leak_will_stabilise(&self) -> bool {
                  self.is_stable()
              }
          }

    - name: "Write laws/geo06_vgca.rs"
      ansible.builtin.copy:
        dest: "{{ crate }}/src/laws/geo06_vgca.rs"
        content: |
          //! GeoLaw-06: VGCA∆ tribe algebra — governs tribe interactions.
          //! Tribes form a group under the VGCA∆ operation.
          //! Only GeoEngine may compute tribe fanout partitions.

          use std::collections::{HashMap, HashSet};

          /// Tribe orbit centre — spatial anchor for a tribe's particles.
          #[derive(Debug, Clone)]
          pub struct TribeOrbitCentre {
              pub tribe_id: u16,
              pub r:        f64,   // orbital radius
              pub theta:    f64,   // polar angle
              pub phi:      f64,   // azimuthal angle
              pub radius:   f64,   // orbit spread radius
          }

          /// VGCA∆ tribe algebra registry.
          pub struct VgcaRegistry {
              tribes: HashMap<u16, TribeOrbitCentre>,
          }

          impl VgcaRegistry {
              pub fn new() -> Self { Self { tribes: HashMap::new() } }

              pub fn register(&mut self, centre: TribeOrbitCentre) {
                  self.tribes.insert(centre.tribe_id, centre);
              }

              pub fn is_registered(&self, tribe_id: u16) -> bool {
                  self.tribes.contains_key(&tribe_id)
              }

              /// VGCA∆ partition: distribute tribe_ids across fan-out workers.
              /// Returns partition sets — one per worker thread.
              pub fn partition_for_fanout(
                  &self,
                  tribe_ids: &[u16],
                  workers:   usize,
              ) -> Vec<Vec<u16>> {
                  let mut partitions = vec![Vec::new(); workers.max(1)];
                  for (i, &tid) in tribe_ids.iter().enumerate() {
                      partitions[i % workers.max(1)].push(tid);
                  }
                  partitions
              }

              /// CrossTribe pairs — tribes that share orbital overlap.
              pub fn cross_tribe_pairs(&self) -> Vec<(u16, u16)> {
                  let ids: Vec<u16> = self.tribes.keys().copied().collect();
                  let mut pairs = Vec::new();
                  for i in 0..ids.len() {
                      for j in i+1..ids.len() {
                          let a = &self.tribes[&ids[i]];
                          let b = &self.tribes[&ids[j]];
                          let dist = ((a.r - b.r).powi(2)
                                    + (a.theta - b.theta).powi(2)
                                    + (a.phi - b.phi).powi(2)).sqrt();
                          if dist < a.radius + b.radius {
                              pairs.push((ids[i], ids[j]));
                          }
                      }
                  }
                  pairs
              }
          }

          impl Default for VgcaRegistry {
              fn default() -> Self { Self::new() }
          }

    - name: "Write laws/geo07_pauli.rs"
      ansible.builtin.copy:
        dest: "{{ crate }}/src/laws/geo07_pauli.rs"
        content: |
          //! GeoLaw-07: Pauli Exclusion — no two KAKIs at same (r,θ,φ,tribe).
          //! GeoEngine REJECTS any insert that violates this across all four shards.
          //! This is the sovereign Pauli Exclusion enforced at index level.

          use std::collections::HashMap;
          use crate::error::{GeoEngineError, GeoResult};

          /// Quantised orbital position key — discretises (r,θ,φ) to grid.
          #[derive(Debug, Clone, PartialEq, Eq, Hash)]
          pub struct OrbitalKey {
              pub r_bin:     u32,  // r discretised to 3 decimal places
              pub theta_bin: u32,
              pub phi_bin:   u32,
              pub tribe_id:  u16,
          }

          impl OrbitalKey {
              pub fn from_position(r: f64, theta: f64, phi: f64, tribe_id: u16) -> Self {
                  Self {
                      r_bin:     (r     * 1000.0).round() as u32,
                      theta_bin: (theta * 1000.0).round() as u32,
                      phi_bin:   (phi   * 1000.0).round() as u32,
                      tribe_id,
                  }
              }
          }

          /// Pauli Exclusion table — one per GeoEngine instance.
          #[derive(Default)]
          pub struct PauliTable {
              occupied: HashMap<OrbitalKey, u32>,  // key → surrogate
          }

          impl PauliTable {
              pub fn new() -> Self { Self::default() }

              /// Attempt to occupy a position. Returns error if already occupied.
              pub fn occupy(
                  &mut self,
                  r: f64, theta: f64, phi: f64,
                  tribe_id:  u16,
                  surrogate: u32,
              ) -> GeoResult<()> {
                  let key = OrbitalKey::from_position(r, theta, phi, tribe_id);
                  if let Some(&occupant) = self.occupied.get(&key) {
                      return Err(GeoEngineError::PauliExclusion { r, theta, phi, occupant });
                  }
                  self.occupied.insert(key, surrogate);
                  Ok(())
              }

              /// Release a position when a particle is promoted or removed.
              pub fn release(&mut self, r: f64, theta: f64, phi: f64, tribe_id: u16) {
                  let key = OrbitalKey::from_position(r, theta, phi, tribe_id);
                  self.occupied.remove(&key);
              }

              pub fn is_occupied(&self, r: f64, theta: f64, phi: f64, tribe_id: u16) -> bool {
                  let key = OrbitalKey::from_position(r, theta, phi, tribe_id);
                  self.occupied.contains_key(&key)
              }
          }

    - name: "Write registry/particle.rs"
      ansible.builtin.copy:
        dest: "{{ crate }}/src/registry/particle.rs"
        content: |
          //! UnifiedParticleRegistry — single source of truth for particle location.
          //! Maps surrogate_u32 → {store, OrbitalPosition, GateId}
          //! Callers never need to know which physical database holds a particle.

          use std::collections::HashMap;
          use crate::laws::geo01_e7::OrbitalPosition;

          /// Which physical store currently holds this particle.
          #[derive(Debug, Clone, Copy, PartialEq, Eq)]
          pub enum ParticleStore {
              EnkiDB,       // committed — KISPU sealed
              EnkiSDB,      // staging — processing in É-DUBBA gates
              EnkiODB,      // ontology — CrossTribe registered
              InFlight,     // in transit — TIAMAT predicted, not yet committed
          }

          /// É-DUBBA gate identifier (1–7).
          #[derive(Debug, Clone, Copy, PartialEq, Eq)]
          pub struct GateId(pub u8);

          impl GateId {
              pub const MASHSHARU:    GateId = GateId(1);
              pub const NAMZITUM:     GateId = GateId(2);
              pub const TIAMAT5:      GateId = GateId(3);
              pub const PASHIRU:      GateId = GateId(4);
              pub const KISPU:        GateId = GateId(5);
              pub const UTNAPISHTIM:  GateId = GateId(6);
              pub const NISABA:       GateId = GateId(7);
          }

          /// Full particle location record.
          #[derive(Debug, Clone)]
          pub struct ParticleLocation {
              pub surrogate:  u32,
              pub store:      ParticleStore,
              pub position:   OrbitalPosition,
              pub tribe_id:   u16,
              pub gate:       Option<GateId>,   // Some if in-flight through É-DUBBA
              pub shell:      usize,
              pub zone:       usize,
          }

          /// UnifiedParticleRegistry — surrogate → location.
          #[derive(Default)]
          pub struct UnifiedParticleRegistry {
              locations: HashMap<u32, ParticleLocation>,
          }

          impl UnifiedParticleRegistry {
              pub fn new() -> Self { Self::default() }

              pub fn register(&mut self, loc: ParticleLocation) {
                  self.locations.insert(loc.surrogate, loc);
              }

              pub fn get(&self, surrogate: u32) -> Option<&ParticleLocation> {
                  self.locations.get(&surrogate)
              }

              pub fn update_store(&mut self, surrogate: u32, store: ParticleStore) {
                  if let Some(loc) = self.locations.get_mut(&surrogate) {
                      loc.store = store;
                      loc.gate  = None; // cleared when promoted
                  }
              }

              pub fn update_position(&mut self, surrogate: u32, pos: OrbitalPosition) {
                  if let Some(loc) = self.locations.get_mut(&surrogate) {
                      loc.position = pos;
                  }
              }

              pub fn advance_gate(&mut self, surrogate: u32, gate: GateId) {
                  if let Some(loc) = self.locations.get_mut(&surrogate) {
                      loc.gate = Some(gate);
                  }
              }

              pub fn remove(&mut self, surrogate: u32) {
                  self.locations.remove(&surrogate);
              }

              pub fn by_store(&self, store: ParticleStore) -> Vec<&ParticleLocation> {
                  self.locations.values().filter(|l| l.store == store).collect()
              }

              pub fn by_tribe(&self, tribe_id: u16) -> Vec<&ParticleLocation> {
                  self.locations.values().filter(|l| l.tribe_id == tribe_id).collect()
              }

              pub fn total(&self) -> usize { self.locations.len() }
          }

