          fn gen_project(topo: &ClientTopology) -> String {{
              format!(r#"; UTNAPISHTIM 𒌓𒍣𒅁𒀭 — Generated Sovereign PDM IDE
          ; Client: {{}} (0x{{:04X}}) — BahyWay.Ecosystem v4.0 — DUB.SAR 𒁾
