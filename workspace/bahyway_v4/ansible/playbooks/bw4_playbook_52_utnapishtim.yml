          window/size/viewport_width=1440
          window/size/viewport_height=900
          "#, topo.client_name, topo.client_id, topo.client_name)
          }}

          fn gen_orbital_manager(topo: &ClientTopology) -> String {{
              let tribe_block = topo.tribes.iter().map(|t| {{
                  format!(
                      "\t\t{{ \\"id\\": {{}}, \\"name\\": \\"{{}}\\"  \
                       \\"ring_radius\\": {{:.2}}, \\"colour_hex\\": \\"{{}}\\" }},",
                      t.tribe_id, t.tribe_name, t.ring_radius, t.colour_hex
                  )
              }}).collect::<Vec<_>>().join("\\n");

              format!(r#"# orbital_manager.gd
          # UTNAPISHTIM 𒌓𒍣𒅁𒀭 — Orbital Manager
          # BahyWay.Ecosystem v4.0 — DUB.SAR 𒁾
          #
          # SOVEREIGN RULES:
          # κ[6] = kaki_type_byte  κ[7] = kaki_role_byte  (NEVER quality)
          # ColourID from EAV — NEVER from KAKI bytes
          # B11 = round(eav_quality × {PLIMPTON_322_DIVISOR}) Plimpton 322 — NEVER 255
          # orbital_radius = particle property (OrbitalSubtype via EAV)
          # ring_radius    = decorative visual ring only (tribe separation)
          # Dead particle  = #404040 dark grey (NOT #800000 — Nergal AV only)
          # KUR terminal   = #1A0A2E sovereign indigo
          # TIAMAT levels: 1=DILBAT 2=KAKKAB 3=ERRA 4=KUR (all four)
          extends Node3D

          const PLIMPTON_322: float = {PLIMPTON_322_DIVISOR}
          const GOLDEN_ANGLE: float = {GOLDEN_ANGLE_DEG}
          const KUR_THRESHOLD: float = 0.40

          # Seven sealed particle orbital radii (OrbitalSubtype)
          # These are PARTICLE properties — NOT tribe ring radii
          const PARTICLE_RADII: Array[float] = [
          \t{ORBITAL_GOLDEN_GEM},   # 0 GOLDEN_GEM   B11>=200
          \t{ORBITAL_GOLDEN_ALIVE},  # 1 GOLDEN_ALIVE
          \t{ORBITAL_FUZZY_AGED},   # 2 FUZZY_AGED
          \t{ORBITAL_FUZZY_GRAY},   # 3 FUZZY_GRAY
          \t{ORBITAL_FUZZY_DECAY},  # 4 FUZZY_DECAY  TIAMAT DILBAT fires
          \t{ORBITAL_DEAD_EXPIRED}, # 5 DEAD_EXPIRED #404040
          \t{ORBITAL_DEAD_SEALED},  # 6 DEAD_SEALED  PUZRU
          ]

          # Tribe config (decorative ring_radius — NOT particle orbital_radius)
          var TRIBES: Array = [
          {{tribe_block}}
          ]

          func _ready() -> void:
          \t_build_decorative_rings()
          \t_seed_demo_particles()

          func _build_decorative_rings() -> void:
          \tfor tribe in TRIBES:
          \t\t# ring_radius = decorative visual separation
          \t\t# NOT particle orbital_radius
          \t\tvar torus := _make_ring(tribe["ring_radius"], Color(tribe["colour_hex"]))
          \t\t$OrbitalRings.add_child(torus)

          func _make_ring(ring_radius: float, colour: Color) -> MeshInstance3D:
          \tvar mesh := TorusMesh.new()
          \tmesh.inner_radius = ring_radius - 0.02
          \tmesh.outer_radius = ring_radius + 0.02
          \tmesh.rings = 128
          \tvar mat := StandardMaterial3D.new()
          \tmat.albedo_color = colour
          \tmat.transparency = BaseMaterial3D.TRANSPARENCY_ALPHA
          \tmat.albedo_color.a = 0.22
          \tvar mi := MeshInstance3D.new()
          \tmi.mesh = mesh
          \tmi.material_override = mat
          \treturn mi

          func _seed_demo_particles() -> void:
          \t# orbital_radius from PARTICLE_RADII (OrbitalSubtype property)
          \tfor si in range(PARTICLE_RADII.size()):
          \t\tvar orbital_r := PARTICLE_RADII[si]
          \t\tfor _i in range(50):
          \t\t\t_spawn_particle(orbital_r, si)

          func _spawn_particle(orbital_radius: float, subtype: int) -> void:
          \t# orbital_radius = particle property from OrbitalSubtype via EAV
          \tvar theta := randf() * TAU
          \tvar phi   := PI / 2.0 + (randf() - 0.5) * 0.1
          \tvar x := orbital_radius * sin(phi) * cos(theta)
          \tvar y := orbital_radius * cos(phi)
          \tvar z := orbital_radius * sin(phi) * sin(theta)
          \tvar pn := _create_particle_node(Vector3(x, y, z), subtype)
          \t$ParticlePool.add_child(pn)

          func _create_particle_node(pos: Vector3, subtype: int) -> MeshInstance3D:
          \tvar mi := MeshInstance3D.new()
          \tvar s  := SphereMesh.new()
          \ts.radius = 0.018; s.height = 0.036
          \tmi.mesh  = s
          \tmi.position = pos
          \treturn mi

          func compute_b11(eav_quality: float) -> int:
          \t# B11 = round(eav_quality × 240) — Plimpton 322 — NEVER 255
          \treturn int(round(eav_quality * PLIMPTON_322))
          "#)
          }}

          fn gen_particle_node() -> String {{
              format!(r#"# particle_node.gd
          # UTNAPISHTIM 𒌓𒍣𒅁𒀭 — Sovereign Particle Node
          # BahyWay.Ecosystem v4.0 — DUB.SAR 𒁾
          #
          # KAKI v4.0 byte layout (sealed permanently):
          #   κ[0..3] = uuid_hash
          #   κ[4..5] = tribe_id
          #   κ[6]    = kaki_type_byte  (0x01/0x02/0x03 — NOT quality)
          #   κ[7]    = kaki_role_byte  (NOT quality)
          #
          # ColourID from EAV eav_quality — NEVER from KAKI bytes
          # B11 = round(eav_quality × 240.0) Plimpton 322 — NEVER 255
          # orbital_radius from OrbitalSubtype via EAV — NEVER from tribe
          #
          # COLOUR MAP (CORRECTED):
          #   GOLDEN_GEM   → #FFD700  gold
          #   FUZZY zone   → #4A90E2  blue
          #   DEAD_EXPIRED → #404040  dark grey  (NOT #800000 — Nergal AV only)
          #   KUR terminal → #1A0A2E  sovereign indigo (TIAMAT overlay)
          extends MeshInstance3D

          # KAKI fields — immutable after mint
          var uuid_hash:      int   = 0
          var tribe_id:       int   = 0
          var kaki_type_byte: int   = 0x01  # κ[6] — NOT quality
          var kaki_role_byte: int   = 0x00  # κ[7] — NOT quality

          # EAV Mandatory Attribute — source of ColourID and B11
          var eav_quality:    float = 1.0

          # OrbitalSubtype (0–6) from EAV — drives orbital_radius
          var orbital_subtype: int  = 1

          # Orbital position (from OrbitalSubtype via EAV — NOT from tribe)
          var orbital_radius: float = {ORBITAL_GOLDEN_ALIVE}
          var theta:          float = 0.0
          var phi:            float = PI / 2.0

          # PUZRU — sovereign concealment (NEVER delete)
          var is_puzru:       bool  = false

          const PLIMPTON_322: float = {PLIMPTON_322_DIVISOR}

          # Seven sealed orbital radii (CORRECTED: particle property)
          const PARTICLE_RADII: Array[float] = [
          \t{ORBITAL_GOLDEN_GEM},   {ORBITAL_GOLDEN_ALIVE},  {ORBITAL_FUZZY_AGED},
          \t{ORBITAL_FUZZY_GRAY},   {ORBITAL_FUZZY_DECAY},
          \t{ORBITAL_DEAD_EXPIRED}, {ORBITAL_DEAD_SEALED},
          ]

          func _ready() -> void:
          \tvar sphere := SphereMesh.new()
          \tsphere.radius = 0.018
          \tmesh = sphere
          \t_apply_colour()

          func set_eav_quality(q: float) -> void:
          \t# ColourID derived from EAV — NEVER from KAKI bytes
          \teav_quality = clamp(q, 0.0, 1.0)
          \t_apply_colour()
          \t_update_orbital_radius()

          func compute_b11() -> int:
          \t# B11 = round(eav_quality × 240) — Plimpton 322 — NEVER 255
          \treturn int(round(eav_quality * PLIMPTON_322))

          func apply_puzru() -> void:
          \t# Sovereign concealment — particle exists but invisible
          \t# NEVER delete a particle — PUZRU only
          \tis_puzru = true
          \tvisible  = false

          func _apply_colour() -> void:
          \tvar mat := StandardMaterial3D.new()
          \tif eav_quality >= 0.83:       # B11 >= 200 → GOLDEN_GEM
          \t\tmat.albedo_color = Color("#FFD700")
          \telif eav_quality >= 0.40:     # FUZZY zone
          \t\tmat.albedo_color = Color("#4A90E2")
          \telse:
          \t\t# DEAD_EXPIRED → #404040 dark grey
          \t\t# CORRECTED: was #800000 — that is NERGAL AV engine colour
          \t\tmat.albedo_color = Color("#404040")
          \tmaterial_override = mat

          func _update_orbital_radius() -> void:
          \t# Map eav_quality → orbital_subtype → orbital_radius
          \t# orbital_radius is a PARTICLE property via OrbitalSubtype from EAV
          \tif   eav_quality >= 0.83: orbital_subtype = 0  # GoldenGem
          \telif eav_quality >= 0.70: orbital_subtype = 1  # GoldenAlive
          \telif eav_quality >= 0.55: orbital_subtype = 2  # FuzzyAged
          \telif eav_quality >= 0.40: orbital_subtype = 3  # FuzzyGray
          \telif eav_quality >= 0.20: orbital_subtype = 4  # FuzzyDecay
          \telif eav_quality >= 0.05: orbital_subtype = 5  # DeadExpired
          \telse:                      orbital_subtype = 6  # DeadSealed
          \torbital_radius = PARTICLE_RADII[orbital_subtype]
          "#)
          }}

