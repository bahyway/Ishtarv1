---
# ══════════════════════════════════════════════════════════════════════════════
# 𒁾 playbook_52_utnapishtim.yml
# UTNAPISHTIM 𒌓𒍣𒅁𒀭 — Sovereign Application Factory
# BahyWay.Ecosystem v4.0 — DUB.SAR Bahaa Fadam
#
# "He Who Found Life / He Who Saw Life"
# Survivor of the great flood. Preserver of all knowledge.
# The sovereign application factory that generates and seals
# every client's PDM tools from their É-DUBBA session.
#
# THREE RESPONSIBILITIES:
#   1. GENERATES — Godot 4 PDM IDE + Three.js web viewer per client
#   2. PRESERVES — Every output sealed as PARZU-KAKI in tribe.templates
#   3. ACCUMULATES — Topology library grows with every client session
#
# CORRECTIONS vs iPhone session (PB45+46):
#   C1: particle_node.gd #800000 → #404040 (Maroon = Nergal AV, not particle)
#   C2: _orbital_radius_for_tribe() removed — radius is particle property not tribe
#   C3: enkidb_connector query → W5H2 sovereign syntax (not FETCH...WITHIN)
#   C4: inventory vdi.ini → vdi.yml, hosts: eriduous_vdi
#   C5: KUR_THRESHOLD = 0.40 (Plimpton 322 divisor 240 already correct)
#   C6: Dead particle colour = #404040 dark grey, KUR overlay = #1A0A2E indigo
#
# KAKI v4.0 (sealed — no exceptions):
#   κ[0..3] uuid_hash | κ[4..5] tribe_id
#   κ[6] kaki_type_byte | κ[7] kaki_role_byte
#   Quality/ColourID → EAV Mandatory Attributes ONLY
#   B11 = round(eav_quality × 240) — Plimpton 322 — NEVER 255
#   #800000 Maroon = NERGAL AV engine ONLY — never particle colour
#   KUR terminal = #1A0A2E sovereign indigo
#
# Target  : eriduous-vdi (192.168.122.214)
# Run from: EnkiLab HOST
# ansible-playbook -i inventory/vdi.yml playbooks/52_utnapishtim.yml
# ══════════════════════════════════════════════════════════════════════════════

- name: "PLAYBOOK 52 — UTNAPISHTIM 𒌓𒍣𒅁𒀭 Sovereign Application Factory"
  hosts: eriduous_vdi
  gather_facts: false
  become: false

  vars:
    forge_root:  "/home/bahyway/Forge/bahyway_v4"
    script_path: "/tmp/bw_52_utnapishtim.py"

  tasks:

    - name: "1.0 | Write bw_52_utnapishtim.py to eriduous-vdi"
      ansible.builtin.copy:
        dest: "{{ script_path }}"
        mode: "0755"
        content: |
          #!/usr/bin/env python3
          # ════════════════════════════════════════════════════════════════
          # bw_52_utnapishtim.py
          # UTNAPISHTIM 𒌓𒍣𒅁𒀭 — Sovereign Application Factory
          # BahyWay.Ecosystem v4.0 — DUB.SAR 𒁾
          # ════════════════════════════════════════════════════════════════
          import os, subprocess, sys, textwrap

          FORGE  = "/home/bahyway/Forge/bahyway_v4"
          CRATES = f"{FORGE}/crates"
          CRATE  = f"{CRATES}/utnapishtim"
          SRC    = f"{CRATE}/src"
          OUTPUT = f"{FORGE}/utnapishtim_output"

          for d in [
              SRC,
              f"{SRC}/threejs",
              f"{SRC}/godot",
              f"{SRC}/manifest",
              f"{SRC}/repository",
              f"{SRC}/generator",
              OUTPUT,
          ]:
              os.makedirs(d, exist_ok=True)

          # ── Cargo.toml ────────────────────────────────────────────────
          write = lambda path, content: open(path, "w").write(content)

          write(f"{CRATE}/Cargo.toml", textwrap.dedent("""\
          [package]
          name        = "utnapishtim"
          version     = "4.0.0"
          edition     = "2021"
          authors     = ["DUB.SAR 𒁾 — Bahaa Fadam"]
          description = "UTNAPISHTIM 𒌓𒍣𒅁𒀭 — Sovereign Application Factory"

          [lib]
          name = "utnapishtim"
          path = "src/lib.rs"

          [dependencies]
          serde      = { version = "1", features = ["derive"] }
          serde_json = "1"

          [dev-dependencies]
          # none — sovereign tests only
          """))

          # ── lib.rs ────────────────────────────────────────────────────
          write(f"{SRC}/lib.rs", textwrap.dedent("""\
          //! UTNAPISHTIM 𒌓𒍣𒅁𒀭
          //! "He Who Found Life / He Who Saw Life"
          //! Sovereign Application Factory — BahyWay.Ecosystem v4.0
          //! DUB.SAR 𒁾
          //!
          //! #![forbid(unsafe_code)]
          //!
          //! SOVEREIGN RULES (sealed permanently):
          //!   B11 = round(eav_quality × 240.0) — Plimpton 322 — NEVER 255
          //!   ColourID from PĀŠIRU via golden angle — NEVER from KAKI bytes
          //!   κ[6] = kaki_type_byte  κ[7] = kaki_role_byte  (never quality)
          //!   Dead particles → #404040 dark grey
          //!   KUR terminal   → #1A0A2E sovereign indigo
          //!   #800000 Maroon → NERGAL AV engine ONLY — never used here
          //!   Orbital radius → particle property (OrbitalSubtype via EAV)
          //!                    NOT a tribe property

          #![forbid(unsafe_code)]

          pub mod generator;
          pub mod godot;
          pub mod manifest;
          pub mod repository;
          pub mod threejs;

          // ── Sovereign constants ───────────────────────────────────────

          /// B11 divisor — Plimpton 322. NEVER 255.
          pub const PLIMPTON_322_DIVISOR: f32 = 240.0;

          /// Golden angle for tribe ColourID — PĀŠIRU
          /// hue = (tribe_id - 1) × 137.508° mod 360°
          pub const GOLDEN_ANGLE_DEG: f64 = 137.507_764;

          /// KUR threshold — quality below this → particle in Great Below
          pub const KUR_THRESHOLD: f32 = 0.40;

          /// Seven sealed orbital radii (particle property — NOT tribe property)
          pub const ORBITAL_GOLDEN_GEM:   f32 = 0.10;
          pub const ORBITAL_GOLDEN_ALIVE: f32 = 0.30;
          pub const ORBITAL_FUZZY_AGED:   f32 = 0.40;
          pub const ORBITAL_FUZZY_GRAY:   f32 = 0.57;
          pub const ORBITAL_FUZZY_DECAY:  f32 = 0.72;
          pub const ORBITAL_DEAD_EXPIRED: f32 = 0.85;
          pub const ORBITAL_DEAD_SEALED:  f32 = 0.95;

          /// Sovereign colour constants
          pub const COLOUR_GOLDEN_GEM:   &str = "#FFD700";  // pure gold
          pub const COLOUR_DEAD_EXPIRED: &str = "#404040";  // dark grey
          pub const COLOUR_DEAD_SEALED:  &str = "#282828";  // near-black PUZRU
          pub const COLOUR_KUR:          &str = "#1A0A2E";  // sovereign indigo
          // NOTE: #800000 Maroon = NERGAL AV engine — never used in UTNAPISHTIM

          /// Compute B11 from EAV quality — Plimpton 322
          pub fn compute_b11(eav_quality: f32) -> u8 {
              (eav_quality.clamp(0.0, 1.0) * PLIMPTON_322_DIVISOR).round() as u8
          }

          /// Compute golden-angle hue for a tribe (PĀŠIRU)
          pub fn golden_hue(tribe_id: u16) -> f64 {
              ((tribe_id as f64 - 1.0) * GOLDEN_ANGLE_DEG) % 360.0
          }

          /// OrbitalSubtype → radius (particle property — not tribe property)
          pub fn orbital_radius(subtype: u8) -> f32 {
              match subtype {
                  0 => ORBITAL_GOLDEN_GEM,
                  1 => ORBITAL_GOLDEN_ALIVE,
                  2 => ORBITAL_FUZZY_AGED,
                  3 => ORBITAL_FUZZY_GRAY,
                  4 => ORBITAL_FUZZY_DECAY,
                  5 => ORBITAL_DEAD_EXPIRED,
                  6 => ORBITAL_DEAD_SEALED,
                  _ => ORBITAL_GOLDEN_ALIVE,
              }
          }

          #[derive(Debug, Clone, serde::Serialize, serde::Deserialize)]
          pub struct TribeDefinition {
              pub tribe_id:   u16,
              pub tribe_name: String,
              /// hue = golden_hue(tribe_id) — PĀŠIRU, never from KAKI
              pub hue_deg:    f64,
              /// RGB hex from PĀŠIRU — never from KAKI bytes
              pub colour_hex: String,
              /// Visual ring radius in Three.js/Godot (decorative only)
              /// NOT the same as particle orbital_radius
              pub ring_radius: f32,
          }

          #[derive(Debug, Clone, serde::Serialize, serde::Deserialize)]
          pub struct ClientTopology {
              pub client_id:   u16,
              pub client_name: String,
              pub tribes:      Vec<TribeDefinition>,
              pub sealed_at:   i64,
          }

          impl ClientTopology {
              pub fn validate(&self) -> Result<(), String> {
                  if self.tribes.is_empty() {
                      return Err("topology must have at least one tribe".into());
                  }
                  if self.client_name.is_empty() {
                      return Err("client_name must not be empty".into());
                  }
                  Ok(())
              }

              /// Build tribes with sovereign PĀŠIRU colours
              pub fn build_tribes(client_id: u16, names: &[&str]) -> Vec<TribeDefinition> {
                  names.iter().enumerate().map(|(i, name)| {
                      let tribe_id  = (i + 1) as u16;
                      let hue       = golden_hue(tribe_id);
                      let colour    = hue_to_hex(hue);
                      TribeDefinition {
                          tribe_id,
                          tribe_name: name.to_string(),
                          hue_deg:    hue,
                          colour_hex: colour,
                          // Decorative ring radius — visual separation only
                          // NOT particle orbital_radius
                          ring_radius: 1.5 + (i as f32 * 1.2),
                      }
                  }).collect()
              }
          }

          pub fn hue_to_hex(hue: f64) -> String {
              let h = hue / 60.0;
              let s = 0.75f64;
              let l = 0.55f64;
              let c = (1.0 - (2.0 * l - 1.0).abs()) * s;
              let x = c * (1.0 - ((h % 2.0) - 1.0).abs());
              let m = l - c / 2.0;
              let (r, g, b) = match h as u32 {
                  0 => (c, x, 0.0),
                  1 => (x, c, 0.0),
                  2 => (0.0, c, x),
                  3 => (0.0, x, c),
                  4 => (x, 0.0, c),
                  _ => (c, 0.0, x),
              };
              format!("#{:02X}{:02X}{:02X}",
                  ((r + m) * 255.0) as u8,
                  ((g + m) * 255.0) as u8,
                  ((b + m) * 255.0) as u8,
              )
          }

          #[cfg(test)]
          mod tests {
              use super::*;

              #[test]
              fn test_b11_plimpton_322_not_255() {
                  // B11 MUST use 240, never 255
                  assert_eq!(compute_b11(1.0), 240);
                  assert_eq!(compute_b11(0.5), 120);
                  assert_ne!((1.0f32 * 255.0).round() as u8, compute_b11(1.0));
              }

              #[test]
              fn test_dead_particle_not_maroon() {
                  // #800000 Maroon = NERGAL AV engine ONLY
                  // Dead particles = #404040 dark grey
                  assert_eq!(COLOUR_DEAD_EXPIRED, "#404040");
                  assert_ne!(COLOUR_DEAD_EXPIRED, "#800000");
              }

              #[test]
              fn test_kur_colour_sovereign_indigo() {
                  assert_eq!(COLOUR_KUR, "#1A0A2E");
                  assert_ne!(COLOUR_KUR, "#800000");
              }

              #[test]
              fn test_orbital_radius_is_particle_not_tribe_property() {
                  // Tribe has ring_radius (decorative)
                  // Particle has orbital_radius (from OrbitalSubtype via EAV)
                  // They are different concepts
                  assert_eq!(orbital_radius(0), ORBITAL_GOLDEN_GEM);
                  assert_eq!(orbital_radius(1), ORBITAL_GOLDEN_ALIVE);
                  assert_eq!(orbital_radius(6), ORBITAL_DEAD_SEALED);
              }

              #[test]
              fn test_golden_angle_tribe_colour() {
                  let h1 = golden_hue(1);
                  let h2 = golden_hue(2);
                  assert!((h1 - 0.0).abs() < 0.001);
                  assert!((h2 - 137.507_764).abs() < 0.001);
                  // Same tribe_id always same colour — everywhere
                  assert_eq!(golden_hue(5), golden_hue(5));
              }

              #[test]
              fn test_topology_validate() {
                  let topo = ClientTopology {
                      client_id:   1,
                      client_name: "Najaf Cemetery".into(),
                      tribes:      ClientTopology::build_tribes(1, &["Graves", "Records"]),
                      sealed_at:   0,
                  };
                  assert!(topo.validate().is_ok());
              }
          }
          """))

          # ── threejs/mod.rs ─────────────────────────────────────────────
          write(f"{SRC}/threejs/mod.rs", textwrap.dedent(f"""\
          //! UTNAPISHTIM — Three.js Sovereign Web Viewer Generator
          //! Generates self-contained HTML per client
          //! Deployed to: client.bahyway.com/dubsar
          //!
          //! CORRECTIONS applied:
          //!   - Dead particle colour = #404040 (NOT #800000 Maroon)
          //!   - KUR overlay = #1A0A2E sovereign indigo
          //!   - Orbital radius = particle property (NOT tribe ring radius)
          //!   - ring_radius = decorative visual separation only
          //!   - W5H2 query syntax in TCP refresh (anti-SQL sovereign)

          #![forbid(unsafe_code)]
          use crate::{{ClientTopology, PLIMPTON_322_DIVISOR, GOLDEN_ANGLE_DEG}};
          use crate::{{
              ORBITAL_GOLDEN_GEM, ORBITAL_GOLDEN_ALIVE, ORBITAL_FUZZY_AGED,
              ORBITAL_FUZZY_GRAY,  ORBITAL_FUZZY_DECAY,
              ORBITAL_DEAD_EXPIRED, ORBITAL_DEAD_SEALED,
              COLOUR_DEAD_EXPIRED, COLOUR_KUR,
          }};

          pub fn generate_threejs_viewer(topo: &ClientTopology) -> String {
              let tribe_js   = build_tribe_js(topo);
              let orbital_js = build_orbital_constants();
              let client_name = &topo.client_name;
              let client_id   = topo.client_id;
              let sealed_at   = topo.sealed_at;

              format!(r#"<!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8"/>
            <title>DubSar Orbital Viewer — {{client_name}}</title>
            <!--
              UTNAPISHTIM 𒌓𒍣𒅁𒀭 — He Who Found Life
              BahyWay.Ecosystem v4.0 — DUB.SAR 𒁾
              Client: {{client_name}} (0x{{client_id:04X}})
              Sealed at epoch: {{sealed_at}}

              SOVEREIGN RULES (locked permanently):
              B11 = round(eav_quality × {{PLIMPTON_322_DIVISOR}}) — Plimpton 322 — NEVER 255
              ColourID from PĀŠIRU golden angle — NEVER from KAKI bytes
              Orbital radius = particle OrbitalSubtype — NOT tribe ring radius
              Dead particles: #404040 dark grey (NOT #800000 — that is Nergal AV)
              KUR terminal:   #1A0A2E sovereign indigo
              TCP query: W5H2 sovereign syntax — anti-SQL — no SELECT/FROM/WHERE
            -->
            <style>
              * {{ margin:0; padding:0; box-sizing:border-box }}
              body {{ background:#0a0618; overflow:hidden; font-family:monospace }}
              #hud {{
                position:absolute; top:18px; left:24px;
                color:#8899aa; font-size:11px; line-height:1.8;
              }}
              .title  {{ color:#c8a84b; font-size:14px; letter-spacing:2px }}
              .glyph  {{ color:#556677; font-size:20px }}
              #refresh-bar {{
                position:absolute; bottom:0; left:0;
                height:2px; background:#c8a84b; width:0%;
              }}
            </style>
          </head>
          <body>
            <canvas id="canvas"></canvas>
            <div id="hud">
              <div class="title">DUBSAR ORBITAL VIEWER</div>
              <div class="glyph">𒌓𒍣𒅁𒀭 UTNAPISHTIM · 𒁾 DUB.SAR</div>
              <div>{{client_name}}</div>
              <div id="particle-count">Particles: —</div>
              <div id="live-status">Connecting to EnkiDB…</div>
            </div>
            <div id="refresh-bar"></div>

            <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js">
            </script>
            <script>
          // ════════════════════════════════════════════════════
          // UTNAPISHTIM 𒌓𒍣𒅁𒀭 — DubSar Three.js Orbital Viewer
          // BahyWay.Ecosystem v4.0 — DUB.SAR 𒁾
          // ════════════════════════════════════════════════════

          // ── Sovereign particle orbital radii (sealed v4.0) ──
          // These are PARTICLE properties (from OrbitalSubtype via EAV)
          // NOT tribe ring radii (those are decorative only)
          {{orbital_js}}

          // ── Plimpton 322 — B11 computation ─────────────────
          // B11 = round(eav_quality × {{PLIMPTON_322_DIVISOR}}) — NEVER 255
          function computeB11(eav_quality) {{
            return Math.round(eav_quality * {{PLIMPTON_322_DIVISOR}});
          }}

          // ── Sovereign colour mapping ─────────────────────────
          // ColourID from PĀŠIRU — NEVER from KAKI bytes
          // Dead = #404040 dark grey  (NOT #800000 — that is Nergal AV)
          // KUR  = #1A0A2E sovereign indigo
          function orbitalColour(eav_quality) {{
            const b11 = computeB11(eav_quality);
            if (b11 >= 200)          return '#FFD700'; // GOLDEN_GEM
            if (eav_quality >= 0.70) return '#C8B830'; // GOLDEN_ALIVE
            if (eav_quality >= 0.55) return '#8090A0'; // FUZZY_AGED
            if (eav_quality >= 0.40) return '#607080'; // FUZZY_GRAY
            if (eav_quality >= 0.00) return '#404040'; // DEAD (#800000 is Nergal AV)
            return '#1A0A2E';  // KUR sovereign indigo
          }}

          // ── Client topology (PĀŠIRU golden angle colours) ───
          // hue = (tribe_id − 1) × {{GOLDEN_ANGLE_DEG}}° mod 360°
          // ring_radius = DECORATIVE visual separation only
          // (NOT particle orbital radius)
          {{tribe_js}}

          // ── Scene ────────────────────────────────────────────
          const canvas   = document.getElementById('canvas');
          const renderer = new THREE.WebGLRenderer({{ canvas, antialias:true }});
          renderer.setSize(innerWidth, innerHeight);
          renderer.setClearColor(0x0a0618, 1);
          const scene  = new THREE.Scene();
          const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.01, 500);
          camera.position.set(0, 2, 14);

          // Decorative tribe rings (ring_radius = visual separation)
          TRIBES.forEach(tribe => {{
            const geo = new THREE.RingGeometry(
              tribe.ring_radius - 0.01, tribe.ring_radius + 0.01, 128);
            const mat = new THREE.MeshBasicMaterial({{
              color: tribe.colour, side: THREE.DoubleSide,
              transparent: true, opacity: 0.22
            }});
            scene.add(new THREE.Mesh(geo, mat));
          }});

          // Particle pool (orbital_radius = particle OrbitalSubtype property)
          const MAX_P = 80272;
          const geo   = new THREE.BufferGeometry();
          const pos   = new Float32Array(MAX_P * 3);
          const col   = new Float32Array(MAX_P * 3);
          geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
          geo.setAttribute('color',    new THREE.BufferAttribute(col, 3));
          const mat = new THREE.PointsMaterial({{
            size:0.06, vertexColors:true, transparent:true, opacity:0.88
          }});
          const points = new THREE.Points(geo, mat);
          scene.add(points);
          let live = 0;

          function placeParticle(idx, orbital_radius, eav_quality) {{
            // orbital_radius = particle property from OrbitalSubtype
            const hex = orbitalColour(eav_quality);
            const c   = new THREE.Color(hex);
            const a   = Math.random() * Math.PI * 2;
            pos[idx*3]   = Math.cos(a) * orbital_radius;
            pos[idx*3+1] = (Math.random() - 0.5) * 0.12;
            pos[idx*3+2] = Math.sin(a) * orbital_radius;
            col[idx*3]   = c.r;
            col[idx*3+1] = c.g;
            col[idx*3+2] = c.b;
          }}

          // Seed demo particles across seven orbital subtypes
          const ORBITAL_RADII = [
            ORB_GOLDEN_GEM, ORB_GOLDEN_ALIVE, ORB_FUZZY_AGED,
            ORB_FUZZY_GRAY, ORB_FUZZY_DECAY,
            ORB_DEAD_EXPIRED, ORB_DEAD_SEALED
          ];
          const QUALITY_MAP = [0.95, 0.80, 0.63, 0.56, 0.47, 0.30, 0.10];
          ORBITAL_RADII.forEach((r, si) => {{
            const count = Math.floor(MAX_P / ORBITAL_RADII.length);
            for (let i = 0; i < count; i++) {{
              if (live >= MAX_P) break;
              placeParticle(live++, r, QUALITY_MAP[si]);
            }}
          }});
          geo.attributes.position.needsUpdate = true;
          geo.attributes.color.needsUpdate    = true;
          geo.setDrawRange(0, live);
          document.getElementById('particle-count').textContent =
            'Particles: ' + live.toLocaleString();

          // Camera drift
          let t = 0;
          (function animate() {{
            requestAnimationFrame(animate);
            t += 0.0003;
            camera.position.x = Math.sin(t * 0.7) * 1.2;
            camera.position.y = 2 + Math.sin(t * 0.4) * 0.6;
            camera.lookAt(0,0,0);
            renderer.render(scene, camera);
          }})();

          // ── EnkiDB TCP refresh (W5H2 sovereign syntax) ───────
          // Anti-SQL: no SELECT, no FROM, no WHERE, no LIMIT
          function queryEnkiDB() {{
            const query = [
              'WHO   tribe:ALL',
              'WHAT  kaki_hex, eav_quality, orbital_subtype, colour_hex',
              'HOW   AllEntities',
              'WHERE state != DEAD_SEALED',
              'WHEN  AllTime',
              'WHY   "UTNAPISHTIM live particle refresh 30s cycle"',
              'HOW_MANY 1000'
            ].join('\\n');
            // TCP send via WebSocket bridge (sovereign gateway)
            document.getElementById('live-status').textContent =
              '⟳ EnkiDB W5H2 refresh — ' + new Date().toISOString();
          }}
          setInterval(queryEnkiDB, 30000);

          window.addEventListener('resize', () => {{
            camera.aspect = innerWidth/innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(innerWidth, innerHeight);
          }});
            </script>
          </body>
          </html>"#)
          }}

          fn build_tribe_js(topo: &ClientTopology) -> String {{
              let mut lines = vec!["const TRIBES = [".to_string()];
              for tribe in &topo.tribes {{
                  lines.push(format!(
                      "  {{ id:{}, name:{:?}, ring_radius:{:.2}, \
                       colourHex:{:?}, colour:0x{} }},",
                      tribe.tribe_id,
                      tribe.tribe_name,
                      tribe.ring_radius,
                      tribe.colour_hex,
                      tribe.colour_hex.trim_start_matches('#'),
                  ));
              }}
              lines.push("];".to_string());
              lines.join("\\n")
          }}

          fn build_orbital_constants() -> String {{
              format!(
                  "// Particle orbital radii (sealed v4.0) — OrbitalSubtype property\\n\
                   const ORB_GOLDEN_GEM   = {ORBITAL_GOLDEN_GEM};   // B11>=200 #FFD700\\n\
                   const ORB_GOLDEN_ALIVE = {ORBITAL_GOLDEN_ALIVE};  // quality>=0.70\\n\
                   const ORB_FUZZY_AGED   = {ORBITAL_FUZZY_AGED};   // quality>=0.55\\n\
                   const ORB_FUZZY_GRAY   = {ORBITAL_FUZZY_GRAY};   // quality>=0.40\\n\
                   const ORB_FUZZY_DECAY  = {ORBITAL_FUZZY_DECAY};  // TIAMAT DILBAT fires\\n\
                   const ORB_DEAD_EXPIRED = {ORBITAL_DEAD_EXPIRED}; // #404040 dark grey\\n\
                   const ORB_DEAD_SEALED  = {ORBITAL_DEAD_SEALED};  // PUZRU #282828\\n\
                   // NEVER: #800000 = NERGAL AV engine ONLY\\n\
                   // KUR terminal overlay = #1A0A2E sovereign indigo"
              )
          }}
          """))

          # ── godot/mod.rs ──────────────────────────────────────────────
          write(f"{SRC}/godot/mod.rs", textwrap.dedent(f"""\
          //! UTNAPISHTIM — Godot 4 Sovereign PDM IDE Generator
          //!
          //! CORRECTIONS applied:
