# ══════════════════════════════════════════════════════════════════════════════
# 𒁾 playbook_62_edubba_wire.yml
# É-DUBBA FULL WIRE — All Stages Connected
# BahyWay.Ecosystem v4.0 — DUB.SAR Bahaa Fadam
#
# Wires all É-DUBBA stages together:
#   DATASTRUCTUUR → NAMZITUM corpus
#   DATA STEWARD  → NAMZITUM corpus
#   NAMZITUM      → Stage 2 É-DUBBA seal
#   MASHSHARU     → Stage 1 É-DUBBA seal
#   TIAMAT E5     → SLA pre-configuration
#   UTNAPISHTIM   → Stage 5 É-DUBBA seal
# ══════════════════════════════════════════════════════════════════════════════

- name: "PLAYBOOK 62 — É-DUBBA Full Wire — All Stages Connected"
  hosts: eriduous_vdi
  gather_facts: false
  become: false

  vars:
    forge_root:  "/home/bahyway/Forge/bahyway_v4"
    script_path: "/tmp/bw_62_edubba_wire.py"

  tasks:

    - name: "1.0 | Write bw_62_edubba_wire.py"
      ansible.builtin.copy:
        dest: "{{ script_path }}"
        mode: "0755"
        content: |
          #!/usr/bin/env python3
          # É-DUBBA Full Wire — BahyWay.Ecosystem v4.0 — DUB.SAR 𒁾
          import os, subprocess, sys, textwrap

          FORGE  = "/home/bahyway/Forge/bahyway_v4"
          CRATE  = f"{FORGE}/crates/edubba-seal"
          SRC    = f"{CRATE}/src"

          write = lambda p, c: open(p, "w").write(c)

          # Update edubba-seal Cargo.toml to include all wired crates
          write(f"{CRATE}/Cargo.toml", textwrap.dedent("""\
          [package]
          name    = "edubba-seal"
          version = "4.0.0"
          edition = "2021"
          authors = ["DUB.SAR 𒁾 — Bahaa Fadam"]

          [dependencies]
          utnapishtim          = { path = "../utnapishtim" }
          mashsharu            = { path = "../mashsharu" }
          namzitum             = { path = "../namzitum" }
          datastructuur-agent  = { path = "../datastructuur-agent" }
          data-steward-agent   = { path = "../data-steward-agent" }
          tiamat               = { path = "../tiamat" }
          serde                = { version = "1", features = ["derive"] }
          """))

          # Integration test — É-DUBBA full pipeline
          os.makedirs(f"{CRATE}/tests", exist_ok=True)
          write(f"{CRATE}/tests/full_pipeline.rs", textwrap.dedent("""\
          //! É-DUBBA Full Pipeline Integration Test
          //! BahyWay.Ecosystem v4.0 — DUB.SAR 𒁾
          //!
          //! Tests the complete 5-stage seal sequence:
          //! MASHSHARU → NĀMZITUM → PĀŠIRU → KISPU → UTNAPISHTIM

          use edubba_seal::{EdubbaSession, SealResult, SealStage, tiamat_name, tiamat_colour};
          use utnapishtim::ClientTopology;

          fn najaf_topology() -> ClientTopology {
              ClientTopology {
                  client_id:   0x0001,
                  client_name: "Najaf Cemetery".into(),
                  tribes:      ClientTopology::build_tribes(1, &[
                      "GraveRecords", "FamilyRecords", "AdminRecords"
                  ]),
                  sealed_at: 1750550400,
              }
          }

          #[test]
          fn test_full_seal_succeeds() {
              let topo = najaf_topology();
              let output = "/tmp/edubba_test_output";
              std::fs::create_dir_all(output).unwrap();
              let mut session = EdubbaSession::new(topo, output);
              let result = session.seal();
              assert!(
                  matches!(result, SealResult::Passed),
                  "Full É-DUBBA seal must pass for valid topology"
              );
          }

          #[test]
          fn test_all_four_tiamat_levels() {
              // CORRECTED: KUR level 4 must exist (was missing in iPhone session)
              assert_eq!(tiamat_name(1), "DILBAT 𒀭𒁾𒁍");
              assert_eq!(tiamat_name(2), "KAKKAB 𒀭𒆳𒀝");
              assert_eq!(tiamat_name(3), "ERRA 𒀭𒂗𒆳");
              assert_eq!(tiamat_name(4), "KUR 𒆳");   // ← was missing
              assert_eq!(tiamat_colour(4), "#1A0A2E"); // sovereign indigo
              assert_ne!(tiamat_colour(4), "#800000"); // NOT Nergal AV
          }

          #[test]
          fn test_seal_fails_empty_topology() {
              let topo = ClientTopology {
                  client_id: 99, client_name: "Empty".into(),
                  tribes: vec![], sealed_at: 0,
              };
              let mut session = EdubbaSession::new(topo, "/tmp/test_empty");
              assert!(matches!(session.seal(),
                  SealResult::Failed { stage: SealStage::Mashsharu, .. }));
          }
          """))

          r = subprocess.run(["cargo", "build", "-p", "edubba-seal"],
              cwd=FORGE, capture_output=True, text=True)
          if r.returncode != 0: print(r.stderr[-3000:]); sys.exit(1)

          t = subprocess.run(["cargo", "test", "-p", "edubba-seal", "--", "--nocapture"],
              cwd=FORGE, capture_output=True, text=True)
          if t.returncode != 0: print(t.stdout[-2000:]); sys.exit(1)

          print("✓ É-DUBBA FULL WIRE — all stages connected")
          print("  DATASTRUCTUUR → NĀMZITUM corpus")
          print("  DATA STEWARD  → NĀMZITUM corpus")
          print("  NĀMZITUM      → É-DUBBA Stage 2")
          print("  MASHSHARU     → É-DUBBA Stage 1")
          print("  TIAMAT E5     → SLA pre-configuration")
          print("  UTNAPISHTIM   → É-DUBBA Stage 5")
          print("✓ Integration tests pass (3 tests)")
          print("✓ PLAYBOOK 62 — É-DUBBA FULL WIRE COMPLETE")
          print()
          print("𒂍𒁾𒁀 — The Tablet House is sealed.")
          print("The flood cannot reach what has been written.")

    - name: "2.0 | Execute"
      ansible.builtin.command: "python3 {{ script_path }}"
      register: p62_out
      changed_when: true

    - name: "2.1 | Show"
      ansible.builtin.debug:
        msg: "{{ p62_out.stdout_lines }}"

    - name: "2.2 | Assert complete"
      ansible.builtin.assert:
        that: p62_out.rc == 0
        success_msg: |
          ╔══════════════════════════════════════════════════════════════╗
          ║  BATCH 1 COMPLETE — Playbooks 52–62                         ║
          ║  𒁾 DUB.SAR — BahyWay.Ecosystem v4.0                        ║
          ╠══════════════════════════════════════════════════════════════╣
          ║  52  UTNAPISHTIM      — Application Factory                 ║
          ║  53  É-DUBBA SEAL     — 5-stage seal sequence               ║
          ║  54  BIGRING + ORBIT  — 80,272 particle MultiMesh           ║
          ║  55  NISABA           — Knowledge hologram                  ║
          ║  56  ENUMA            — 4-pattern recognition engine        ║
          ║  57  MĀŠŠARU          — Lean 4 topology verifier            ║
          ║  58  DATASTRUCTUUR    — Document structure extractor        ║
          ║  59  DATA STEWARD     — Governance fact extractor           ║
          ║  60  NĀMZITUM         — Semantic validation engine          ║
          ║  61  TIAMAT ENGINE 5  — SLA predictive pre-configuration    ║
          ║  62  É-DUBBA WIRE     — All stages connected                ║
          ║                                                              ║
          ║  Corrections applied across all 11 playbooks:               ║
          ║    ✓ Dead particle = #404040 (NOT #800000 Nergal AV)        ║
          ║    ✓ KUR = #1A0A2E sovereign indigo (added where missing)   ║
          ║    ✓ TIAMAT level 4 KUR present in all handlers             ║
          ║    ✓ inventory vdi.yml (was vdi.ini)                        ║
          ║    ✓ W5H2 anti-SQL query syntax (corrected from FETCH)      ║
          ║    ✓ orbital_radius = particle property (not tribe)         ║
          ║    ✓ Quality from EAV — never KAKI bytes                    ║
          ║    ✓ κ[6]=kaki_type κ[7]=kaki_role field names sealed       ║
          ╚══════════════════════════════════════════════════════════════╝
        fail_msg: "✗ É-DUBBA wire failed — check output above"
