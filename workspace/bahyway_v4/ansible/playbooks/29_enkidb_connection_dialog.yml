          '''.strip()

          # ──────────────────────────────────────────────────────────────────
          # 3. Rewrite mod.rs  (keeps existing Connection panel, adds dialog)
          # ──────────────────────────────────────────────────────────────────
          MOD_RS = r'''
          //! EnkiDB Connect panel — mod.rs
          //! Playbook 29  |  DUB.SAR 𒁾 Bahaa Fadam

          pub mod connection_dialog;
          pub mod heptascript_runner;

          use connection_dialog::{ConnStatus, EnkiDbConnectionDialog};
          use egui::{Color32, RichText, Ui};
          use heptascript_runner::{HeptaScriptRunner, ResultView};

          const COL_ACCENT: Color32 = Color32::from_rgb(0x4A, 0x8F, 0xD4);
          const COL_DIM:    Color32 = Color32::from_rgb(0x55, 0x55, 0x66);

          pub struct EnkiDbConnectPanel {
              pub dialog:  EnkiDbConnectionDialog,
              pub runner:  HeptaScriptRunner,
              /// True once a Connect was confirmed.
              pub connected: bool,
          }

          impl Default for EnkiDbConnectPanel {
              fn default() -> Self {
                  Self {
                      dialog:    EnkiDbConnectionDialog::new(),
                      runner:    HeptaScriptRunner::default(),
                      connected: false,
                  }
              }
          }

          impl EnkiDbConnectPanel {
              /// Top bar: shows connection status + "⊞ New Connection" button.
              pub fn show_toolbar(&mut self, ui: &mut Ui) {
                  ui.horizontal(|ui| {
                      if self.connected {
                          ui.label(
                              RichText::new(format!(
                                  "⬤  {}",
                                  self.dialog.profile.name
                              ))
                              .color(Color32::from_rgb(0x4C, 0xAF, 0x50))
                              .strong()
                          );
                      } else {
                          ui.label(
                              RichText::new("⬤  Not connected")
                                  .color(COL_DIM)
                          );
                      }
                      ui.add_space(12.0);
                      if ui.button(
                          RichText::new("⊞ New Connection").color(COL_ACCENT)
                      ).clicked() {
                          self.dialog.open = true;
                      }
                  });
              }

              /// Call this every frame — draws dialog overlay + runner panel.
              pub fn show(&mut self, ctx: &egui::Context, ui: &mut Ui, dt: f32) {
                  // Toolbar
                  self.show_toolbar(ui);
                  ui.add(egui::Separator::default().spacing(4.0));

                  // HeptaScript runner (always visible)
                  self.runner.show(ui, dt, self.connected);

                  // Floating dialog (renders on top via egui::Window)
                  if self.dialog.show(ctx) {
                      self.connected = true;
                  }
              }
          }
          '''.strip()

          # ──────────────────────────────────────────────────────────────────
          # Write files
          # ──────────────────────────────────────────────────────────────────
          write(f"{PANEL_DIR}/connection_dialog.rs",  CONNECTION_DIALOG  + "\n")
          write(f"{PANEL_DIR}/heptascript_runner.rs", HEPTASCRIPT_RUNNER + "\n")
          write(f"{PANEL_DIR}/mod.rs",                MOD_RS             + "\n")

          print("\nPlaybook 29 patch complete.")

