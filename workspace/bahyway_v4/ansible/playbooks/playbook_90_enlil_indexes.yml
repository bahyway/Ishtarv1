        dest: "/tmp/bw_patch_engine.py"
        mode: "0755"
        content: |
          #!/usr/bin/env python3
          import sys
          PATH = "/home/bahyway/Forge/bahyway_v4/crates/heptascript/src/engine.rs"
          with open(PATH) as f:
              src = f.read()
          if "eval_station" in src:
              print("engine.rs already patched"); sys.exit(0)

          # 1. Add station filter in the execute() pipeline
          # STATION is a PHYSICS predicate — runs BEFORE EAV scan
          src = src.replace(
              "        if !eval_where(&query.r#where, &eav) { return None; }",
              "        if !eval_station_on_eav(&query.station, &eav) { return None; }\n        if !eval_where(&query.r#where, &eav) { return None; }"
          )

          # 2. Add eval_station_on_eav function before eval_where
          STATION_EVAL = '''
          // ── STATION evaluation (PHYSICS predicate) ───────────────────────────────────
          // STATION maps to the BeeMDM gate stored in EAV as "beemm.station" attribute.
          // In full ENLIL index: this becomes a NATIRU RoaringBitmap gate lookup.
          // Current: EAV-based fallback until NATIRU bitmaps are built.

          fn eval_station_on_eav(station: &Option<crate::query::StationClause>, map: &EavMap) -> bool {
              let station = match station {
                  Some(s) => s,
                  None    => return true, // no STATION clause — pass all
              };
              if station.stations.is_empty() { return true; }

              let stored_station = match get_val(map, "beemm.station") {
                  Some(AkkValue::Text(s)) => s.clone(),
                  Some(AkkValue::Int(n))  => format!("S{n}"),
                  _ => return false, // particle has no station attribute
              };

              let mut result = eval_station_cond(&station.stations[0], &stored_station);
              for cond in &station.stations[1..] {
                  let this = eval_station_cond(cond, &stored_station);
                  result = match cond.combinator {
                      crate::query::Combinator::And => result && this,
                      crate::query::Combinator::Or  => result || this,
                  };
              }
              result
          }

          fn eval_station_cond(
              cond:    &crate::query::StationCondition,
              stored:  &str,
          ) -> bool {
              let physical  = cond.value.physical_name();
              let akkadian  = cond.value.akkadian_name();
              stored == physical
                  || stored.to_uppercase() == physical
                  || stored.to_uppercase() == akkadian
                  || stored == akkadian
          }

          '''

          src = src.replace(
              "// ── WHERE evaluation",
              STATION_EVAL + "// ── WHERE evaluation"
          )

          with open(PATH, "w") as f:
              f.write(src)
          print("SUCCESS — engine.rs patched with eval_station PHYSICS predicate")

    - name: "Run engine.rs patch"
      ansible.builtin.command:
        cmd: "python3 /tmp/bw_patch_engine.py"
      register: r
      changed_when: true
