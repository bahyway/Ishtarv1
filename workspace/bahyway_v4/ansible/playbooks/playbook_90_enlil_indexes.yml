        content: |
          //! ENLIL Four-Layer Sovereign Index Stack
          //!
          //! Index 0 — SurrogateMap   : KAKI-16 ↔ u32 Golden Key
          //! Index 1 — KISPU HeadStore: columnar attribute arrays O(1) lookup
          //! Index 2 — NATIRU         : RoaringBitmap per orbital state + gate
          //! Index 3 — BTreeRange     : epoch / quality / b11 range index
