    - name: "Patch parser.rs — add station + orbit parsing"
      ansible.builtin.copy:
        dest: "/tmp/bw_patch_parser.py"
        mode: "0755"
        content: |
          #!/usr/bin/env python3
          import sys
          PATH = "/home/bahyway/Forge/bahyway_v4/crates/heptascript/src/parser.rs"
          with open(PATH) as f:
              src = f.read()
          if "maybe_parse_station" in src:
              print("parser.rs already patched"); sys.exit(0)

          # 1. Add station + orbit to the parse() return
          src = src.replace(
              "        Ok(HeptaQuery { who, what, r#where, when, why, how, how_much })",
              "        let station = self.maybe_parse_station()?;\n        let orbit   = self.maybe_parse_orbit()?;\n        Ok(HeptaQuery { who, what, r#where, when, why, how, how_much, station, orbit })"
          )

          # 2. Add parsing methods before the closing impl Parser
          STATION_PARSER = '''
              // ── STATION ──────────────────────────────────────────────────────────────

              fn maybe_parse_station(&mut self) -> Result<Option<StationClause>, ParseError> {
                  if !matches!(self.peek(), Token::Station) { return Ok(None); }
                  self.advance();
                  self.expect(&Token::Eq)?;
                  let first_val = self.parse_station_value()?;
                  let mut stations = vec![StationCondition {
                      combinator: Combinator::And,
                      value:      first_val,
                  }];
                  loop {
                      match self.peek().clone() {
                          Token::And => {
                              self.advance();
                              let v = self.parse_station_value()?;
                              stations.push(StationCondition { combinator: Combinator::And, value: v });
                          }
                          Token::Or => {
                              self.advance();
                              let v = self.parse_station_value()?;
                              stations.push(StationCondition { combinator: Combinator::Or, value: v });
                          }
                          _ => break,
                      }
                  }
                  Ok(Some(StationClause { stations }))
              }

              fn parse_station_value(&mut self) -> Result<StationValue, ParseError> {
                  match self.advance() {
                      Token::S1 => Ok(StationValue::S1),
                      Token::S2 => Ok(StationValue::S2),
                      Token::S3 => Ok(StationValue::S3),
                      Token::S4 => Ok(StationValue::S4),
                      Token::S5 => Ok(StationValue::S5),
                      Token::S6 => Ok(StationValue::S6),
                      Token::S7 => Ok(StationValue::S7),
                      Token::S8 => Ok(StationValue::S8),
                      t => Err(ParseError(format!(
                          "expected station name (S1-S8 or Akkadian equivalent), got {t:?}"
                      ))),
                  }
              }

              // ── ORBIT ─────────────────────────────────────────────────────────────────

              fn maybe_parse_orbit(&mut self) -> Result<Option<OrbitClause>, ParseError> {
                  if !matches!(self.peek(), Token::Orbit) { return Ok(None); }
                  self.advance();
                  // ORBIT tribe: TRIBE_NAME [db: EnkiDB, EnkiSDB, ...]
                  // Simplified: parse tribe name then optional db targets
                  let tribe = match self.advance() {
                      Token::Ident(s) => s,
                      t => return Err(ParseError(format!("expected tribe name after ORBIT, got {t:?}"))),
                  };
                  let mut db_types = vec![DbTarget::EnkiDB]; // default
                  // Parse optional db target list
                  if matches!(self.peek(), Token::Ident(_)) {
                      // Could be "db:" prefix
                      if let Token::Ident(s) = self.peek().clone() {
                          if s.to_uppercase() == "DB" {
                              self.advance();
                              // expect colon — skip if present
                              if matches!(self.peek(), Token::Colon) { self.advance(); }
                              db_types = self.parse_db_targets()?;
                          }
                      }
                  }
                  Ok(Some(OrbitClause { tribe, db_types }))
              }

              fn parse_db_targets(&mut self) -> Result<Vec<DbTarget>, ParseError> {
                  let mut targets = vec![self.parse_db_target()?];
                  while matches!(self.peek(), Token::Comma) {
                      self.advance();
                      targets.push(self.parse_db_target()?);
                  }
                  Ok(targets)
              }

              fn parse_db_target(&mut self) -> Result<DbTarget, ParseError> {
                  match self.advance() {
                      Token::Ident(s) => match s.to_uppercase().as_str() {
                          "ENKIDB"  => Ok(DbTarget::EnkiDB),
                          "ENKIDW"  => Ok(DbTarget::EnkiDW),
                          "ENKISDB" => Ok(DbTarget::EnkiSDB),
                          "ENKIODB" => Ok(DbTarget::EnkiODB),
                          "ENKIQDB" => Ok(DbTarget::EnkiQDB),
                          other => Err(ParseError(format!("unknown DB target: {other}"))),
                      },
                      t => Err(ParseError(format!("expected DB target name, got {t:?}"))),
                  }
              }
          '''

          # Insert before the last closing brace of impl Parser
          # Find the #[cfg(test)] marker which comes after impl Parser closes
          src = src.replace(
