              S2,  // DATACOMPARE    — data comparison
              S3,  // NAMZITUM       — semantic validation
              S4,  // DATAENRICH     — enrichment
              S5,  // TIAMAT5        — SLA predictive pre-configuration
              S6,  // DATALINK       — cross-tribe linking
              S7,  // DATASTEWARD    — governance / Way policy draft
              S8,  // DATAARCHIVE    — archival
          }

          impl StationValue {
              /// Akkadian logical name
              pub fn akkadian_name(&self) -> &'static str {
                  match self {
                      StationValue::S1 => "DATASTRUCTUUR",
                      StationValue::S2 => "DATACOMPARE",
                      StationValue::S3 => "NAMZITUM",
                      StationValue::S4 => "DATAENRICH",
                      StationValue::S5 => "TIAMAT_ENGINE5",
                      StationValue::S6 => "DATALINK",
                      StationValue::S7 => "DATA_STEWARD",
                      StationValue::S8 => "DATAARCHIVE",
                  }
              }
              /// BeeMDM physical name
              pub fn physical_name(&self) -> &'static str {
                  match self {
                      StationValue::S1 => "S1",
                      StationValue::S2 => "S2",
                      StationValue::S3 => "S3",
                      StationValue::S4 => "S4",
                      StationValue::S5 => "S5",
                      StationValue::S6 => "S6",
                      StationValue::S7 => "S7",
                      StationValue::S8 => "S8",
                  }
              }
              /// Gate bitmap index (0-based) for NATIRU RoaringBitmap lookup
              pub fn gate_index(&self) -> u8 {
                  match self {
                      StationValue::S1 => 0,
                      StationValue::S2 => 1,
                      StationValue::S3 => 2,
                      StationValue::S4 => 3,
                      StationValue::S5 => 4,
                      StationValue::S6 => 5,
                      StationValue::S7 => 6,
                      StationValue::S8 => 7,
                  }
              }
          }

          // ── ORBIT (tribe routing target) ──────────────────────────────────────────────

          /// ORBIT clause — specifies which sovereign EnkiDB store(s) to query.
          #[derive(Debug, Clone)]
          pub struct OrbitClause {
              pub tribe:    String,
