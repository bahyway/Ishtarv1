          //!
          //! NATIRU maintains seven orbital state bitmaps per tribe:
          //!   GOLDEN_GEM / GOLDEN_ALIVE / FUZZY_AGED / FUZZY_GRAY /
          //!   FUZZY_DECAY / DEAD_EXPIRED / DEAD_SEALED
          //!
          //! Plus eight BeeMDM gate bitmaps (S1-S8) for STATION predicate.
          //! Plus KAKI type bitmaps: Identity / Event / CrossTribe.
          //!
          //! Partition pruning: STATION = S3 → bitmap AND before any EAV touch.

          use roaring::RoaringBitmap;

          /// Seven canonical orbital states (EAV-only — never in KAKI bytes).
          #[derive(Debug, Clone, Copy, PartialEq, Eq, Hash)]
          pub enum OrbitalState {
              GoldenGem    = 0,
              GoldenAlive  = 1,
              FuzzyAged    = 2,
              FuzzyGray    = 3,
              FuzzyDecay   = 4,
              DeadExpired  = 5,
              DeadSealed   = 6,
          }

          impl OrbitalState {
              pub fn from_index(i: u8) -> Option<Self> {
                  match i {
                      0 => Some(Self::GoldenGem),
                      1 => Some(Self::GoldenAlive),
                      2 => Some(Self::FuzzyAged),
                      3 => Some(Self::FuzzyGray),
                      4 => Some(Self::FuzzyDecay),
                      5 => Some(Self::DeadExpired),
                      6 => Some(Self::DeadSealed),
                      _ => None,
                  }
              }

              pub fn sovereign_name(&self) -> &'static str {
                  match self {
                      Self::GoldenGem   => "GOLDEN_GEM",
                      Self::GoldenAlive => "GOLDEN_ALIVE",
                      Self::FuzzyAged   => "FUZZY_AGED",
                      Self::FuzzyGray   => "FUZZY_GRAY",
                      Self::FuzzyDecay  => "FUZZY_DECAY",
                      Self::DeadExpired => "DEAD_EXPIRED",
                      Self::DeadSealed  => "DEAD_SEALED",
                  }
              }
          }

          /// NATIRU — Index 2 of the ENLIL stack.
          pub struct Natiru {
              /// Seven orbital state bitmaps. Index = OrbitalState as u8.
              orbital: [RoaringBitmap; 7],
              /// Eight BeeMDM gate bitmaps (S1-S8). Index = gate_index (0-7).
              gate:    [RoaringBitmap; 8],
              /// Three KAKI type bitmaps: Identity=0, Event=1, CrossTribe=2.
              kaki_type: [RoaringBitmap; 3],
          }

          impl Natiru {
              pub fn new() -> Self {
                  Self {
                      orbital:   std::array::from_fn(|_| RoaringBitmap::new()),
                      gate:      std::array::from_fn(|_| RoaringBitmap::new()),
                      kaki_type: std::array::from_fn(|_| RoaringBitmap::new()),
                  }
              }

              /// Set orbital state for a surrogate (removes from all others first).
              pub fn set_orbital(&mut self, surrogate: u32, state: OrbitalState) {
                  for bm in self.orbital.iter_mut() { bm.remove(surrogate); }
                  self.orbital[state as usize].insert(surrogate);
              }

              /// Set BeeMDM gate for a surrogate (gate_index 0-7 = S1-S8).
              pub fn set_gate(&mut self, surrogate: u32, gate_index: u8) {
                  if gate_index < 8 {
                      for bm in self.gate.iter_mut() { bm.remove(surrogate); }
                      self.gate[gate_index as usize].insert(surrogate);
                  }
              }

              /// Set KAKI type for a surrogate (0=Identity, 1=Event, 2=CrossTribe).
              pub fn set_kaki_type(&mut self, surrogate: u32, kaki_type: u8) {
                  if kaki_type < 3 {
                      for bm in self.kaki_type.iter_mut() { bm.remove(surrogate); }
                      self.kaki_type[kaki_type as usize].insert(surrogate);
                  }
              }

              /// Bitmap of surrogates at a given orbital state.
              pub fn orbital_bitmap(&self, state: OrbitalState) -> &RoaringBitmap {
                  &self.orbital[state as usize]
              }

              /// Bitmap of surrogates at a given BeeMDM gate (gate_index 0-7).
              pub fn gate_bitmap(&self, gate_index: u8) -> Option<&RoaringBitmap> {
                  self.gate.get(gate_index as usize)
              }

              /// STATION predicate: returns surrogates matching gate_index.
              /// This is the PHYSICS predicate — runs before EAV scan.
              pub fn station_candidates(&self, gate_index: u8) -> Option<&RoaringBitmap> {
                  self.gate_bitmap(gate_index)
              }

              /// Intersection of orbital state AND gate bitmaps.
              pub fn orbital_and_gate(
                  &self,
                  state:      OrbitalState,
                  gate_index: u8,
              ) -> RoaringBitmap {
                  match self.gate_bitmap(gate_index) {
                      Some(g) => &self.orbital[state as usize] & g,
                      None    => RoaringBitmap::new(),
                  }
              }

              /// Total surrogates tracked.
              pub fn total_surrogates(&self) -> u64 {
                  self.orbital.iter().map(|b| b.len()).sum()
              }
          }

          impl Default for Natiru {
              fn default() -> Self { Self::new() }
          }

    - name: "Write btree_range.rs"
      ansible.builtin.copy:
        dest: "/home/bahyway/Forge/bahyway_v4/crates/enkidb-enlil-index/src/btree_range.rs"
        content: |
          //! Index 3 — BTreeRange + idx_eav
          //!
          //! BTreeRange: ordered index for range queries on epoch, quality, b11.
          //! idx_eav:    exact-match index on EAV attribute hash + value hash.
          //!
          //! Both are META predicates — run after NATIRU bitmap pruning.

          use std::collections::{BTreeMap, HashMap};

          /// BTreeRange — ordered range index for numeric predicates.
          /// Key: (value, surrogate) — enables range scan + surrogate retrieval.
          pub struct BTreeRange {
              /// epoch index: epoch_u64 → set of surrogates
              pub epoch:   BTreeMap<u64, Vec<u32>>,
              /// quality index: quality_byte u8 → set of surrogates
              pub quality: BTreeMap<u8, Vec<u32>>,
              /// b11 index: b11 u16 → set of surrogates
              pub b11:     BTreeMap<u16, Vec<u32>>,
          }

          impl BTreeRange {
              pub fn new() -> Self {
                  Self {
                      epoch:   BTreeMap::new(),
                      quality: BTreeMap::new(),
                      b11:     BTreeMap::new(),
                  }
              }

              pub fn insert_epoch(&mut self, epoch: u64, surrogate: u32) {
                  self.epoch.entry(epoch).or_default().push(surrogate);
              }

              pub fn insert_quality(&mut self, quality: u8, surrogate: u32) {
                  self.quality.entry(quality).or_default().push(surrogate);
              }

              pub fn insert_b11(&mut self, b11: u16, surrogate: u32) {
                  self.b11.entry(b11).or_default().push(surrogate);
              }

              /// Surrogates with quality_byte >= min_quality.
              pub fn quality_gte(&self, min_quality: u8) -> Vec<u32> {
                  self.quality.range(min_quality..)
                      .flat_map(|(_, s)| s.iter().copied())
                      .collect()
              }

              /// Surrogates with quality_byte <= max_quality.
              pub fn quality_lte(&self, max_quality: u8) -> Vec<u32> {
                  self.quality.range(..=max_quality)
                      .flat_map(|(_, s)| s.iter().copied())
                      .collect()
              }

              /// Surrogates with epoch in [from, to].
              pub fn epoch_range(&self, from: u64, to: u64) -> Vec<u32> {
                  self.epoch.range(from..=to)
                      .flat_map(|(_, s)| s.iter().copied())
                      .collect()
              }

              /// Surrogates with b11 >= min_b11.
              pub fn b11_gte(&self, min_b11: u16) -> Vec<u32> {
                  self.b11.range(min_b11..)
                      .flat_map(|(_, s)| s.iter().copied())
                      .collect()
              }
          }

          impl Default for BTreeRange {
              fn default() -> Self { Self::new() }
          }

          /// idx_eav — exact attribute-value match index.
          /// Key: (attr_hash u32, value_hash u32) → Vec<surrogate u32>
          pub struct IdxEav {
              index: HashMap<(u32, u32), Vec<u32>>,
          }

          impl IdxEav {
              pub fn new() -> Self {
                  Self { index: HashMap::new() }
              }

              /// Insert a (attr_hash, value_hash) → surrogate mapping.
              pub fn insert(&mut self, attr_hash: u32, value_hash: u32, surrogate: u32) {
                  self.index.entry((attr_hash, value_hash)).or_default().push(surrogate);
              }

              /// Exact match lookup: which surrogates have attr=value?
              pub fn lookup(&self, attr_hash: u32, value_hash: u32) -> &[u32] {
                  self.index.get(&(attr_hash, value_hash))
                      .map(|v| v.as_slice())
                      .unwrap_or(&[])
              }

              /// All surrogates that have any value for attr_hash.
              pub fn surrogates_with_attr(&self, attr_hash: u32) -> Vec<u32> {
                  self.index.iter()
                      .filter(|((ah, _), _)| *ah == attr_hash)
                      .flat_map(|(_, s)| s.iter().copied())
                      .collect()
              }
          }

          impl Default for IdxEav {
              fn default() -> Self { Self::new() }
          }

    - name: "Write enlil_stack.rs"
      ansible.builtin.copy:
        dest: "/home/bahyway/Forge/bahyway_v4/crates/enkidb-enlil-index/src/enlil_stack.rs"
        content: |
          //! ENLIL Stack — the four indexes unified into one sovereign structure.
          //!
          //! Query execution order (sovereign sargability):
          //!   1. NATIRU bitmap  — STATION / orbital state pruning (PHYSICS)
          //!   2. BTreeRange     — epoch / quality / b11 range filter (PHYSICS)
          //!   3. idx_eav        — exact attr=value match (META)
          //!   4. KISPU HeadStore— project requested attributes (META)
          //!   5. SurrogateMap   — resolve surrogate → KAKI for result (Golden Key)
          //!
          //! All five EnkiDB types share this stack structure.
          //! NATIRU gate bitmaps differ per type (EnkiSDB=S1-S4, EnkiODB=S4-S7, etc.)

          use crate::{
              surrogate_map::SurrogateMap,
              kispu::KispuHeadStore,
              natiru::Natiru,
              btree_range::{BTreeRange, IdxEav},
          };

          /// The four-index ENLIL sovereign stack.
          pub struct EnlilStack {
              /// Index 0: SurrogateMap — Golden Key KAKI↔u32
              pub surrogate: SurrogateMap,
              /// Index 1: KISPU HeadStore — columnar attribute arrays
              pub kispu:     KispuHeadStore,
              /// Index 2: NATIRU — RoaringBitmap orbital + gate bitmaps
              pub natiru:    Natiru,
              /// Index 3a: BTreeRange — epoch/quality/b11 range index
              pub btree:     BTreeRange,
              /// Index 3b: idx_eav — exact attr=value match
              pub idx_eav:   IdxEav,
          }

          impl EnlilStack {
              pub fn new() -> Self {
                  Self {
                      surrogate: SurrogateMap::new(),
                      kispu:     KispuHeadStore::new(),
                      natiru:    Natiru::new(),
                      btree:     BTreeRange::new(),
                      idx_eav:   IdxEav::new(),
                  }
              }

              /// Register a new KAKI — assigns surrogate and initialises all indexes.
              pub fn register_kaki(
                  &mut self,
                  kaki:       [u8; 16],
                  kaki_type:  u8,    // 0=Identity, 1=Event, 2=CrossTribe
                  gate_index: u8,    // BeeMDM gate S1-S8 (0-7)
                  epoch:      u64,
                  quality:    u8,
              ) -> u32 {
                  let (surrogate, _) = self.surrogate.get_or_insert(kaki);
                  self.natiru.set_kaki_type(surrogate, kaki_type);
                  self.natiru.set_gate(surrogate, gate_index);
                  self.btree.insert_epoch(epoch, surrogate);
                  self.btree.insert_quality(quality, surrogate);
                  surrogate
              }

              /// Stats summary for SUMU-UKIN display.
              pub fn stats(&self) -> EnlilStats {
                  EnlilStats {
                      total_kakis:  self.surrogate.len(),
                      kispu_cols:   self.kispu.column_count(),
                      natiru_total: self.natiru.total_surrogates(),
                  }
              }
          }

          impl Default for EnlilStack {
              fn default() -> Self { Self::new() }
          }

          #[derive(Debug, Clone)]
          pub struct EnlilStats {
              pub total_kakis:  usize,
              pub kispu_cols:   usize,
              pub natiru_total: u64,
          }

