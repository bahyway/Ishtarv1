    - name: "Write surrogate_map.rs"
      ansible.builtin.copy:
        dest: "/home/bahyway/Forge/bahyway_v4/crates/enkidb-enlil-index/src/surrogate_map.rs"
        content: |
          //! Index 0 — SurrogateMap: KAKI-16 ↔ u32 Golden Key
          //!
          //! The SurrogateMap eliminates full KAKI-16 byte comparison from hot paths.
          //! Every KAKI gets a compact u32 surrogate ("Golden Key") assigned at
          //! ingestion time. All other indexes reference this u32 — never the raw KAKI.
          //!
          //! Golden Key assignment: sequential monotonic counter, tribe-scoped.
          //! Lookup: O(1) via Vec<[u8;16]> indexed by surrogate u32.
          //! Reverse: HashMap<[u8;16], u32> for KAKI→surrogate resolution.

          use std::collections::HashMap;

          /// SurrogateMap — Index 0 of the ENLIL stack.
          #[derive(Default)]
          pub struct SurrogateMap {
              /// Forward: surrogate u32 → KAKI 16 bytes. Index = surrogate.
              forward: Vec<[u8; 16]>,
              /// Reverse: KAKI 16 bytes → surrogate u32.
              reverse: HashMap<[u8; 16], u32>,
          }

          impl SurrogateMap {
              pub fn new() -> Self { Self::default() }

              /// Get or assign a surrogate for a KAKI.
              /// Returns (surrogate, was_new).
              pub fn get_or_insert(&mut self, kaki: [u8; 16]) -> (u32, bool) {
                  if let Some(&s) = self.reverse.get(&kaki) {
                      return (s, false);
                  }
                  let s = self.forward.len() as u32;
                  self.forward.push(kaki);
                  self.reverse.insert(kaki, s);
                  (s, true)
              }

              /// Resolve surrogate → KAKI bytes. O(1).
              pub fn kaki(&self, surrogate: u32) -> Option<&[u8; 16]> {
                  self.forward.get(surrogate as usize)
              }

              /// Resolve KAKI bytes → surrogate. O(1) via HashMap.
              pub fn surrogate(&self, kaki: &[u8; 16]) -> Option<u32> {
                  self.reverse.get(kaki).copied()
              }

              /// Total number of registered KAKIs.
              pub fn len(&self) -> usize { self.forward.len() }

              pub fn is_empty(&self) -> bool { self.forward.is_empty() }
          }

    - name: "Write kispu.rs"
      ansible.builtin.copy:
        dest: "/home/bahyway/Forge/bahyway_v4/crates/enkidb-enlil-index/src/kispu.rs"
        content: |
          //! Index 1 — KISPU HeadStore: columnar attribute arrays
          //!
          //! KISPU stores EAV attributes in columnar layout:
          //! one Vec<(u32, AkkValue)> per attribute hash, sorted by surrogate.
          //!
          //! Lookup: binary search by surrogate → O(log n) per attribute column.
          //! Projection: iterate only the columns referenced in WHAT clause.
          //! Update: four-way atomic commit sealed in KISPU.

          use std::collections::HashMap;
          use akkvalue::AkkValue;

          /// KISPU HeadStore — Index 1 of the ENLIL stack.
          pub struct KispuHeadStore {
              /// attr_hash → sorted Vec<(surrogate, value)>
              columns: HashMap<u32, Vec<(u32, AkkValue)>>,
          }

          impl KispuHeadStore {
              pub fn new() -> Self {
                  Self { columns: HashMap::new() }
              }

              /// Insert or update an attribute value for a surrogate.
              /// Last-write-wins per (surrogate, attr_hash).
              pub fn upsert(&mut self, surrogate: u32, attr_hash: u32, value: AkkValue) {
                  let col = self.columns.entry(attr_hash).or_default();
                  match col.binary_search_by_key(&surrogate, |&(s, _)| s) {
                      Ok(idx)  => col[idx].1 = value,
                      Err(idx) => col.insert(idx, (surrogate, value)),
                  }
              }

              /// Lookup a single attribute for a surrogate. O(log n).
              pub fn get(&self, surrogate: u32, attr_hash: u32) -> Option<&AkkValue> {
                  let col = self.columns.get(&attr_hash)?;
                  let idx = col.binary_search_by_key(&surrogate, |&(s, _)| s).ok()?;
                  Some(&col[idx].1)
              }

              /// Project multiple attributes for a surrogate.
              /// Returns Vec<(attr_hash, &AkkValue)> for found attributes only.
              pub fn project<'a>(
                  &'a self,
                  surrogate:  u32,
                  attr_hashes: &[u32],
              ) -> Vec<(u32, &'a AkkValue)> {
                  attr_hashes.iter().filter_map(|&h| {
                      self.get(surrogate, h).map(|v| (h, v))
                  }).collect()
              }

              /// All surrogates that have a value for attr_hash.
              pub fn surrogates_with_attr(&self, attr_hash: u32) -> &[(u32, AkkValue)] {
                  self.columns.get(&attr_hash).map(|v| v.as_slice()).unwrap_or(&[])
              }

              pub fn column_count(&self) -> usize { self.columns.len() }
          }

          impl Default for KispuHeadStore {
              fn default() -> Self { Self::new() }
          }

