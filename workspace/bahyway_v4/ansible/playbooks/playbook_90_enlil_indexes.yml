          // ── STATION ──────────────────────────────────────────────────────────────────

          /// STATION clause — sovereign BeeMDM gate / pipeline station filter.
          /// PHYSICS predicate: maps to NATIRU RoaringBitmap gate bitmaps.
          /// Accepts both Akkadian logical names and BeeMDM physical names (S1-S8).
