          /// Target EnkiDB instance type for multi-store routing.
          #[derive(Debug, Clone, PartialEq, Eq)]
          pub enum DbTarget {
              EnkiDB,   // Core CQRS sovereign store
              EnkiDW,   // Data warehouse
              EnkiSDB,  // Staging database
              EnkiODB,  // Operation database
