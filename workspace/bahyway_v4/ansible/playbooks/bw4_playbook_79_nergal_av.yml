                      if bytes.len() == 16 {
                          let mut arr = [0u8; 16];
                          arr.copy_from_slice(&bytes);
                          let mut sc = KakiScanner::new();
                          match sc.scan_kaki(&arr, epoch) {
                              nergal_av::scanner::ScanResult::Clean =>
                                  println!("✓ KAKI clean"),
