          //! ZEQP — Batch Pre-Scan Protocol
          //! Zero Entry Queue Protocol — scans BEFORE BeeMDM pipeline
          //! Every file batch scanned here first
          //! Clean → BeeMDM S0 Landing Zone
          //! Threat → IRKALLA quarantine → zip_jail/ chattr+i

          #![forbid(unsafe_code)]

          use std::path::{Path, PathBuf};
          use crate::scanner::{KakiScanner, ScanResult};
          use crate::irkalla::Irkalla;
          use crate::ThreatDetection;

          /// Result of a ZEQP batch scan
          #[derive(Debug, Clone)]
          pub struct ZeqpBatchResult {
              pub batch_name:   String,
              pub total_files:  usize,
              pub clean_files:  usize,
              pub threat_files: usize,
              pub threats:      Vec<ThreatDetection>,
              /// true = batch can proceed to BeeMDM S0
              pub cleared:      bool,
          }

          pub struct ZeqpScanner {
              pub scanner:  KakiScanner,
              pub jail_dir: PathBuf,
          }

          impl ZeqpScanner {
              pub fn new(jail_dir: impl Into<PathBuf>) -> Self {
                  Self {
                      scanner:  KakiScanner::new(),
                      jail_dir: jail_dir.into(),
                  }
              }

              /// Scan a batch of files BEFORE BeeMDM ingestion
              /// Option A: if ANY threat found → entire batch HALTED
              pub fn scan_batch(
                  &mut self,
                  batch_name: impl Into<String>,
                  files: &[(String, Vec<u8>)],  // (filename, content)
                  epoch: u64,
              ) -> ZeqpBatchResult {
                  let batch_name = batch_name.into();
                  let mut threats     = Vec::new();
                  let mut clean_count = 0usize;

                  for (filename, content) in files {
                      let results = self.scanner.scan_file_batch(filename, content, epoch);
                      let mut file_clean = true;
                      for result in results {
                          match result {
                              ScanResult::Clean => {}
                              ScanResult::Threat(det) => {
                                  // Option A: collect and will halt the batch
                                  threats.push(det);
                                  file_clean = false;
                              }
                          }
                      }
                      if file_clean { clean_count += 1; }
                  }

                  let cleared = threats.is_empty();

                  if !cleared {
                      println!(
                          "[ZEQP] BATCH HALTED: {} — {} threats in {} files",
                          batch_name, threats.len(), files.len()
                      );
                      println!("[ZEQP] Option A: HALT AND REPORT — batch does not enter BeeMDM");
                  } else {
                      println!(
                          "[ZEQP] BATCH CLEARED: {} — {} files clean → BeeMDM S0",
                          batch_name, clean_count
                      );
                  }

                  ZeqpBatchResult {
                      batch_name,
                      total_files:  files.len(),
                      clean_files:  clean_count,
                      threat_files: files.len() - clean_count,
                      threats,
                      cleared,
                  }
              }

              /// Sentence all threats from a halted batch to IRKALLA
              pub fn sentence_batch(
                  &mut self,
                  result: ZeqpBatchResult,
                  irkalla: &mut Irkalla,
              ) -> std::io::Result<()> {
                  for det in result.threats {
                      irkalla.sentence(det)?;
                  }
                  Ok(())
              }
          }

          #[cfg(test)]
          mod tests {
              use super::*;

              #[test]
              fn test_clean_batch_cleared() {
                  let jail = std::env::temp_dir().join("zeqp_test_1");
                  std::fs::create_dir_all(&jail).unwrap();
                  let mut zeqp = ZeqpScanner::new(&jail);
                  let files = vec![
                      ("record.csv".into(), b"name,id\nAhmed,001".to_vec()),
                  ];
                  let result = zeqp.scan_batch("najaf_test", &files, 0);
                  assert!(result.cleared);
                  assert_eq!(result.clean_files, 1);
                  assert_eq!(result.threat_files, 0);
              }

              #[test]
              fn test_eicar_batch_halted() {
                  let jail = std::env::temp_dir().join("zeqp_test_2");
                  std::fs::create_dir_all(&jail).unwrap();
                  let mut zeqp = ZeqpScanner::new(&jail);
                  let eicar = b"X5O!P%@AP[4\\PZX54(P^)7CC)7}$EICAR-STANDARD-ANTIVIRUS-TEST-FILE!$H+H*";
                  let files = vec![
                      ("normal.csv".into(), b"clean data".to_vec()),
                      ("test.zip".into(),   eicar.to_vec()),
                  ];
                  let result = zeqp.scan_batch("test_batch", &files, 0);
                  // Option A: batch HALTED because one file has threat
                  assert!(!result.cleared);
                  assert!(!result.threats.is_empty());
              }

              #[test]
              fn test_option_a_all_threats_reported_immediately() {
                  // Every detection is immediate — not batched or delayed
                  let jail = std::env::temp_dir().join("zeqp_test_3");
                  std::fs::create_dir_all(&jail).unwrap();
                  let mut zeqp = ZeqpScanner::new(&jail);
                  let eicar = b"X5O!P%@AP[4\\PZX54(P^)7CC)7}$EICAR-STANDARD-ANTIVIRUS-TEST-FILE!$H+H*";
                  let files = vec![("bad.zip".into(), eicar.to_vec())];
                  let result = zeqp.scan_batch("immediate_test", &files, 0);
                  // All threats present immediately — not deferred
                  for det in &result.threats {
                      assert!(matches!(det.state, crate::NergalState::Halt { .. }));
                  }
              }
          }
