          //! NERGAL Layer 2 — Website Firewall
          //! Guards all W5H2 queries from browser → EnkiDB TCP
          //! Every query passes through NERGAL before execution

          #![forbid(unsafe_code)]

          use crate::scanner::{KakiScanner, ScanResult};
