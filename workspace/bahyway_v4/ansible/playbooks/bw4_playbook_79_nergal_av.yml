          [[bin]]
          name = "nergal-av"
          path = "src/main.rs"
          """))

          # ── lib.rs ────────────────────────────────────────────────────────
          write(f"{SRC}/lib.rs", textwrap.dedent("""\
          //! NERGAL 𒀭𒉺𒂵 — Sovereign Anti-Virus Engine
          //! BahyWay.Ecosystem v4.0 — DUB.SAR 𒁾
          //!
          //! "Only NERGAL can enter KUR and return."
          //!
          //! SEALED CONSTANTS:
          //!   #800000 Maroon  = NERGAL alarm colour (nowhere else)
          //!   IRKALLA 0x0002  = quarantine tribe
          //!   Finding-KAKI    = κ[6]=0x02 Event, κ[7]=0xFF
          //!   B11             = round(severity × 240) Plimpton 322
          //!   Option A        = HALT AND REPORT immediately
          //!
          //! FIVE LAYERS:
          //!   Layer 1: DubSar (Godot) panel
          //!   Layer 2: Website Firewall (Three.js)
          //!   Layer 3: Standalone AV product
          //!   Layer 4: White-Hat Agent (nergal-agent crate)
          //!   Layer 5: WAY v2.0 DEFENSE extension

          #![forbid(unsafe_code)]

          pub mod scanner;
          pub mod irkalla;
          pub mod firewall;
          pub mod zeqp;

          // ── Sealed NERGAL constants ───────────────────────────────────────

          /// NERGAL alarm colour — used NOWHERE ELSE in BahyWay
          pub const NERGAL_MAROON:      &str = "#800000";

          /// IRKALLA quarantine tribe — all threat KAKIs go here
          pub const IRKALLA_TRIBE_ID:   u16  = 0x0002;

          /// Finding-KAKI role byte (κ[7])
          pub const NERGAL_FINDING_ROLE: u8  = 0xFF;

          /// NERGAL AV role byte for stream scanner
          pub const NERGAL_SCAN_ROLE:   u8   = 0xF0;

          /// B11 divisor — Plimpton 322 — NEVER 255
          pub const PLIMPTON_322:       f32  = 240.0;

          /// Threat severity → B11 (higher severity = higher B11 in IRKALLA)
          /// Note: IRKALLA inverts the quality model
          ///   higher severity = worse threat = higher B11 (opposite of normal)
          pub fn threat_b11(severity: f32) -> u8 {
              (severity.clamp(0.0, 1.0) * PLIMPTON_322).round() as u8
          }

          /// NERGAL alert state
          #[derive(Debug, Clone, PartialEq, serde::Serialize, serde::Deserialize)]
          pub enum NergalState {
              /// Monitoring — no threat detected
              Watch,
              /// Threat detected — HALTED — report minted (Option A)
              Halt { reason: String },
              /// Threat jailed into IRKALLA — zip_jail/ chattr+i
              Jailed { kaki_hex: String },
              /// Finding sent to MĀŠŠARU for verification
              Reported { finding_kaki: String },
          }

          /// Threat category (maps to IRKALLA tower in Three.js)
          #[derive(Debug, Clone, PartialEq, serde::Serialize, serde::Deserialize)]
          pub enum ThreatCategory {
              Virus,
              Ransomware,
              Trojan,
              Spyware,
              Worm,
              Adware,
              Rootkit,
              KakiInjection,      // BahyWay-specific: malformed KAKI bytes
              ReplayAttack,       // Event-KAKI minted twice
              JournalTamper,      // journal.bin write-order violation
              QueryInjection,     // malformed W5H2 WHY clause
              PuzruBypass,        // unauthorized read of concealed particle
              TribeEscalation,    // tribe_id privilege escalation attempt
          }

          impl ThreatCategory {
              pub fn severity(&self) -> f32 {
                  match self {
                      // BahyWay-specific threats are critical
                      Self::KakiInjection   => 0.95,
                      Self::ReplayAttack    => 0.90,
                      Self::JournalTamper   => 0.98,
                      Self::QueryInjection  => 0.75,
                      Self::PuzruBypass     => 0.85,
                      Self::TribeEscalation => 0.92,
                      // Standard AV categories
                      Self::Ransomware      => 0.95,
                      Self::Rootkit         => 0.88,
                      Self::Trojan          => 0.75,
                      Self::Worm            => 0.70,
                      Self::Virus           => 0.65,
                      Self::Spyware         => 0.60,
                      Self::Adware          => 0.30,
                  }
              }

              pub fn tower_index(&self) -> usize {
                  // Maps to IRKALLA Three.js tower (0-6)
                  match self {
                      Self::Virus | Self::KakiInjection    => 0,
                      Self::Ransomware | Self::ReplayAttack => 1,
                      Self::Trojan | Self::QueryInjection   => 2,
                      Self::Spyware | Self::PuzruBypass     => 3,
                      Self::Worm | Self::TribeEscalation    => 4,
                      Self::Adware                          => 5,
                      Self::Rootkit | Self::JournalTamper   => 6,
                  }
              }
          }

          /// A NERGAL threat detection event
          #[derive(Debug, Clone, serde::Serialize, serde::Deserialize)]
          pub struct ThreatDetection {
              /// Finding-KAKI κ[6]=0x02, κ[7]=0xFF
              pub finding_kaki:  String,
              pub category:      ThreatCategory,
              pub severity:      f32,
              /// B11 = round(severity × 240) — Plimpton 322
              pub b11:           u8,
              pub source:        String,    // file, query, or KAKI being scanned
              pub description:   String,
              pub proof:         String,    // exact payload / evidence
              pub epoch:         u64,
              pub state:         NergalState,
              /// PUZRU until MĀŠŠARU verifies — then unsealed to audit
              pub is_puzru:      bool,
          }

          impl ThreatDetection {
              pub fn new(
                  category:    ThreatCategory,
                  source:      impl Into<String>,
                  description: impl Into<String>,
                  proof:       impl Into<String>,
                  epoch:       u64,
              ) -> Self {
                  let severity = category.severity();
                  let b11      = threat_b11(severity);

                  // Mint Finding-KAKI
                  let source_str = source.into();
                  let hash = enkidb_kaki::fnv1a_u32(source_str.as_bytes());
                  let kaki = enkidb_kaki::Kaki::mint(
                      hash,
                      IRKALLA_TRIBE_ID,
                      enkidb_kaki::KakiType::Event,
                      NERGAL_FINDING_ROLE,  // 0xFF
                  );
                  let kaki_hex = kaki.bytes.iter()
                      .map(|b| format!("{:02X}", b)).collect::<String>();

                  Self {
                      finding_kaki: kaki_hex,
                      category,
                      severity,
                      b11,
                      source:      source_str,
                      description: description.into(),
                      proof:       proof.into(),
                      epoch,
                      // Option A: HALT AND REPORT immediately
                      state: NergalState::Halt {
                          reason: "NERGAL: HALT AND REPORT — Option A protocol".into()
                      },
                      is_puzru: true,  // sealed until MĀŠŠARU verifies
                  }
              }

              /// Promote to JAILED state — moves to zip_jail/ chattr+i
              pub fn jail(&mut self) {
                  self.state = NergalState::Jailed {
                      kaki_hex: self.finding_kaki.clone()
                  };
              }

              /// Unseal after MĀŠŠARU verifies the patch
              pub fn unseal_after_patch(&mut self) {
                  self.is_puzru = false;
                  self.state = NergalState::Reported {
                      finding_kaki: self.finding_kaki.clone()
                  };
              }
          }

          #[cfg(test)]
          mod tests {
              use super::*;

              #[test]
              fn test_nergal_maroon_colour_sealed() {
                  assert_eq!(NERGAL_MAROON, "#800000");
                  // This colour belongs to NERGAL ONLY
                  // Not particles (#404040), not KUR (#1A0A2E)
              }

              #[test]
              fn test_finding_kaki_bytes() {
                  let det = ThreatDetection::new(
                      ThreatCategory::KakiInjection,
                      "test_source", "Test injection", "payload", 0
                  );
                  // κ[6] = 0x02 Event, κ[7] = 0xFF NERGAL_FINDING
                  assert!(det.finding_kaki.len() == 32); // 16 bytes hex
              }

              #[test]
              fn test_b11_plimpton_322() {
                  // Maximum severity → B11 = 240 (never 255)
                  assert_eq!(threat_b11(1.0), 240);
                  // Never 255
                  assert_ne!(threat_b11(1.0), 255);
              }

              #[test]
              fn test_option_a_halt_immediately() {
                  let det = ThreatDetection::new(
                      ThreatCategory::JournalTamper,
                      "journal.bin", "Write order violated", "proof", 0
                  );
                  // Option A: immediately HALTED — never continue probing
                  assert!(matches!(det.state, NergalState::Halt { .. }));
                  // Sealed until MĀŠŠARU verifies
                  assert!(det.is_puzru);
              }

              #[test]
              fn test_journal_tamper_highest_severity() {
                  // journal.bin integrity is the most critical
                  assert_eq!(ThreatCategory::JournalTamper.severity(), 0.98);
                  assert!(ThreatCategory::JournalTamper.severity() >
                          ThreatCategory::KakiInjection.severity());
              }

              #[test]
              fn test_irkalla_tribe_sealed() {
                  assert_eq!(IRKALLA_TRIBE_ID, 0x0002);
              }
          }
          """))

          # ── scanner/mod.rs ─────────────────────────────────────────────
          write(f"{SRC}/scanner/mod.rs", textwrap.dedent("""\
          //! NERGAL Stream Scanner — inline KAKI validation
          //! Runs on every write before it lands in journal.bin
          //! Speed target: < 1ms per KAKI (inline with KISPU)

          #![forbid(unsafe_code)]

          use crate::{ThreatDetection, ThreatCategory, NergalState};

          /// Result of scanning one KAKI
          #[derive(Debug, Clone)]
          pub enum ScanResult {
              Clean,
              Threat(ThreatDetection),
          }

          pub struct KakiScanner {
              pub scan_count: u64,
              pub threat_count: u64,
          }

          impl KakiScanner {
              pub fn new() -> Self {
                  Self { scan_count: 0, threat_count: 0 }
              }

              /// Scan a 16-byte KAKI — called inline with every KISPU commit
              /// Returns Clean or Threat (Option A: caller must HALT on Threat)
              pub fn scan_kaki(&mut self, bytes: &[u8; 16], epoch: u64) -> ScanResult {
                  self.scan_count += 1;

                  // ── Check 1: Pauli Exclusion (via CRC-16) ────────────────
                  let crc_stored = u16::from_be_bytes([bytes[14], bytes[15]]);
                  let crc_computed = Self::crc16(&bytes[0..14]);
                  if crc_stored != crc_computed {
                      self.threat_count += 1;
                      return ScanResult::Threat(ThreatDetection::new(
                          ThreatCategory::KakiInjection,
                          format!("KAKI:{:02X?}", &bytes[0..4]),
                          "CRC-16 mismatch — KAKI bytes tampered",
                          format!("stored={:#06X} computed={:#06X}",
                              crc_stored, crc_computed),
                          epoch,
                      ));
                  }

                  // ── Check 2: Reserved bytes must be zero ──────────────────
                  if bytes[8..12].iter().any(|&b| b != 0) {
                      self.threat_count += 1;
                      return ScanResult::Threat(ThreatDetection::new(
                          ThreatCategory::KakiInjection,
                          format!("KAKI:{:02X?}", &bytes[0..4]),
                          "Reserved bytes κ[8..11] non-zero — possible encoding attack",
                          format!("reserved bytes: {:02X?}", &bytes[8..12]),
                          epoch,
                      ));
                  }

                  // ── Check 3: kaki_type must be 0x01/0x02/0x03 ────────────
                  let kaki_type = bytes[6]; // κ[6] = kaki_type
                  if ![0x01u8, 0x02, 0x03].contains(&kaki_type) {
                      self.threat_count += 1;
                      return ScanResult::Threat(ThreatDetection::new(
                          ThreatCategory::KakiInjection,
                          format!("KAKI type byte: {:#04X}", kaki_type),
                          "Invalid kaki_type byte κ[6] — not 0x01/0x02/0x03",
                          format!("κ[6]={:#04X}", kaki_type),
                          epoch,
                      ));
                  }

                  // ── Check 4: tribe_id cannot be 0x0000 or 0xFFFF ─────────
                  let tribe = u16::from_be_bytes([bytes[4], bytes[5]]);
                  if tribe == 0x0000 || tribe == 0xFFFF {
                      self.threat_count += 1;
                      return ScanResult::Threat(ThreatDetection::new(
                          ThreatCategory::TribeEscalation,
                          format!("tribe_id={:#06X}", tribe),
                          "Tribe ID in reserved range 0x0000 or 0xFFFF",
                          format!("κ[4..5]={:#06X}", tribe),
                          epoch,
                      ));
                  }

                  ScanResult::Clean
              }

              /// Scan a W5H2 query string for injection
              pub fn scan_query(&mut self, query: &str, epoch: u64) -> ScanResult {
                  self.scan_count += 1;

                  // WHY clause is mandatory — empty WHY = unauthorised
                  if !query.contains("WHY") || query.contains("WHY  \"\"") ||
                     query.contains("WHY \"\"") {
                      self.threat_count += 1;
                      return ScanResult::Threat(ThreatDetection::new(
                          ThreatCategory::QueryInjection,
                          "W5H2 query",
                          "WHY clause missing or empty — unauthorised query",
                          query.chars().take(120).collect::<String>(),
                          epoch,
                      ));
                  }

                  // SQL injection attempt via WHY clause
                  let sql_keywords = ["SELECT", "DROP", "DELETE", "INSERT",
                      "UPDATE", "EXEC", "--", "/*", "*/", "UNION"];
                  for kw in &sql_keywords {
                      if query.to_uppercase().contains(kw) {
                          self.threat_count += 1;
                          return ScanResult::Threat(ThreatDetection::new(
                              ThreatCategory::QueryInjection,
                              "W5H2 query",
                              format!("SQL keyword '{}' detected in W5H2 query", kw),
                              query.chars().take(120).collect::<String>(),
                              epoch,
                          ));
                      }
                  }

                  ScanResult::Clean
              }

              /// Scan a file batch (Layer 3 standalone product)
              pub fn scan_file_batch(
                  &mut self,
                  file_path: &str,
                  content:   &[u8],
                  epoch:     u64,
              ) -> Vec<ScanResult> {
                  let mut results = Vec::new();

                  // EICAR test string (standard AV test)
                  let eicar = b"X5O!P%@AP[4\\PZX54(P^)7CC)7}$EICAR-STANDARD-ANTIVIRUS-TEST-FILE!$H+H*";
                  if content.windows(eicar.len()).any(|w| w == eicar) {
                      self.threat_count += 1;
                      results.push(ScanResult::Threat(ThreatDetection::new(
                          ThreatCategory::Virus,
                          file_path,
                          "EICAR test signature detected",
                          "EICAR-STANDARD-ANTIVIRUS-TEST-FILE",
                          epoch,
                      )));
                  }

                  // Ransomware patterns: common header bytes
                  let ransom_magic = [0x52u8, 0x61, 0x6E, 0x73]; // "Rans"
                  if content.windows(4).any(|w| w == ransom_magic) {
                      self.threat_count += 1;
                      results.push(ScanResult::Threat(ThreatDetection::new(
                          ThreatCategory::Ransomware,
                          file_path,
                          "Ransomware signature header detected",
                          format!("magic bytes: {:02X?}", ransom_magic),
                          epoch,
                      )));
                  }

                  // Check for journal.bin structure markers outside expected context
                  if file_path.ends_with(".zip") || file_path.ends_with(".tar") {
                      let journal_magic = b"ENKIDB_JOURNAL_V4";
                      if content.windows(journal_magic.len())
                          .any(|w| w == journal_magic) {
                          self.threat_count += 1;
                          results.push(ScanResult::Threat(ThreatDetection::new(
                              ThreatCategory::JournalTamper,
                              file_path,
                              "EnkiDB journal structure found inside archive — possible exfiltration",
                              "ENKIDB_JOURNAL_V4 magic in archive",
                              epoch,
                          )));
                      }
                  }

                  if results.is_empty() {
                      results.push(ScanResult::Clean);
                  }
                  results
              }

              /// Fast CRC-16 (CCITT) — sovereign, no external deps
              fn crc16(data: &[u8]) -> u16 {
                  let mut crc: u16 = 0xFFFF;
                  for &byte in data {
                      crc ^= (byte as u16) << 8;
                      for _ in 0..8 {
                          if crc & 0x8000 != 0 {
                              crc = (crc << 1) ^ 0x1021;
                          } else {
                              crc <<= 1;
                          }
                      }
                  }
                  crc
              }

              pub fn stats(&self) -> String {
                  let clean = self.scan_count.saturating_sub(self.threat_count);
                  format!(
                      "[NERGAL] Scanned: {} | Clean: {} | Threats: {} | Rate: {:.2}%",
                      self.scan_count, clean, self.threat_count,
                      if self.scan_count > 0 {
                          self.threat_count as f64 / self.scan_count as f64 * 100.0
                      } else { 0.0 }
                  )
              }
          }

          impl Default for KakiScanner { fn default() -> Self { Self::new() } }

          #[cfg(test)]
          mod tests {
              use super::*;

              fn zero_kaki_with_valid_crc() -> [u8; 16] {
                  let mut b = [0u8; 16];
                  b[4] = 0x00; b[5] = 0x01; // tribe_id = 1
                  b[6] = 0x01;               // kaki_type = Identity
                  b[7] = 0x00;               // kaki_role = 0
                  let crc = KakiScanner::crc16(&b[0..14]);
                  b[14] = (crc >> 8) as u8;
                  b[15] = (crc & 0xFF) as u8;
                  b
              }

              #[test]
              fn test_clean_kaki_passes() {
                  let mut sc = KakiScanner::new();
                  let kaki   = zero_kaki_with_valid_crc();
                  assert!(matches!(sc.scan_kaki(&kaki, 0), ScanResult::Clean));
              }

              #[test]
              fn test_crc_tamper_detected() {
                  let mut sc = KakiScanner::new();
                  let mut kaki = zero_kaki_with_valid_crc();
                  kaki[0] ^= 0xFF; // tamper uuid_hash
                  assert!(matches!(
                      sc.scan_kaki(&kaki, 0),
                      ScanResult::Threat(_)
                  ));
              }

              #[test]
              fn test_reserved_bytes_attack_detected() {
                  let mut sc   = KakiScanner::new();
                  let mut kaki = zero_kaki_with_valid_crc();
                  kaki[8] = 0xDE; // reserved byte non-zero
                  // Recompute CRC so it passes CRC check but fails reserved check
                  let crc = KakiScanner::crc16(&kaki[0..14]);
                  kaki[14] = (crc >> 8) as u8;
                  kaki[15] = (crc & 0xFF) as u8;
                  assert!(matches!(
                      sc.scan_kaki(&kaki, 0),
                      ScanResult::Threat(_)
                  ));
              }

              #[test]
              fn test_invalid_kaki_type_detected() {
                  let mut sc   = KakiScanner::new();
                  let mut kaki = zero_kaki_with_valid_crc();
                  kaki[6] = 0x99; // invalid kaki_type
                  let crc  = KakiScanner::crc16(&kaki[0..14]);
                  kaki[14] = (crc >> 8) as u8;
                  kaki[15] = (crc & 0xFF) as u8;
                  assert!(matches!(
                      sc.scan_kaki(&kaki, 0),
                      ScanResult::Threat(_)
                  ));
              }

              #[test]
              fn test_sql_injection_in_query_detected() {
                  let mut sc = KakiScanner::new();
                  let bad_q  = "WHO tribe:ALL\nWHAT kaki_hex\nWHY \"test\"\nSELECT * FROM";
                  assert!(matches!(
                      sc.scan_query(bad_q, 0),
                      ScanResult::Threat(_)
                  ));
              }

              #[test]
              fn test_empty_why_blocked() {
                  let mut sc = KakiScanner::new();
                  let no_why = "WHO tribe:ALL\nWHAT kaki_hex\nHOW_MANY 100";
                  assert!(matches!(
                      sc.scan_query(no_why, 0),
                      ScanResult::Threat(_)
                  ));
              }

              #[test]
              fn test_eicar_file_detected() {
                  let mut sc = KakiScanner::new();
                  let eicar  = b"X5O!P%@AP[4\\PZX54(P^)7CC)7}$EICAR-STANDARD-ANTIVIRUS-TEST-FILE!$H+H*";
                  let results = sc.scan_file_batch("test.zip", eicar, 0);
                  assert!(results.iter().any(|r| matches!(r, ScanResult::Threat(_))));
              }
          }
          """))

          # ── irkalla/mod.rs ─────────────────────────────────────────────
          write(f"{SRC}/irkalla/mod.rs", textwrap.dedent("""\
          //! IRKALLA 𒄭𒆳𒆳 — The Great Below — Quarantine Tribe
          //! All threat KAKIs are sentenced to IRKALLA (tribe 0x0002)
          //! Physical jail: zip_jail/ directory, chattr+i immutable

          #![forbid(unsafe_code)]

          use std::path::{Path, PathBuf};
          use crate::{ThreatDetection, NergalState, IRKALLA_TRIBE_ID};

          pub struct Irkalla {
              pub jail_path: PathBuf,
              pub detections: Vec<ThreatDetection>,
          }

          impl Irkalla {
              pub fn new(jail_path: impl Into<PathBuf>) -> Self {
                  Self {
                      jail_path: jail_path.into(),
                      detections: Vec::new(),
                  }
              }

              /// Sentence a threat to IRKALLA — Option A: immediate
              pub fn sentence(&mut self, mut detection: ThreatDetection)
                  -> std::io::Result<()>
              {
                  // Write finding to jail (immutable record)
                  let filename = format!("nergal_{}.json", detection.finding_kaki);
                  let jail_file = self.jail_path.join(&filename);

                  let json = serde_json::to_string_pretty(&detection)
                      .unwrap_or_else(|_| "{}".into());
                  std::fs::write(&jail_file, &json)?;

                  // In production: chattr +i jail_file
                  // (makes file immutable at filesystem level)
                  // Here we set read-only permissions as equivalent
                  let mut perms = std::fs::metadata(&jail_file)?.permissions();
                  use std::os::unix::fs::PermissionsExt;
                  perms.set_mode(0o444); // read-only — immutable
                  std::fs::set_permissions(&jail_file, perms)?;

                  println!("[IRKALLA] Sentenced: {} → {:?}",
                      detection.finding_kaki, jail_file);

                  detection.jail();
                  self.detections.push(detection);

                  Ok(())
              }

              /// Count of jailed threats per category tower
              pub fn tower_counts(&self) -> [usize; 7] {
                  let mut counts = [0usize; 7];
                  for det in &self.detections {
                      let idx = det.category.tower_index();
                      counts[idx] += 1;
                  }
                  counts
              }

              /// Export current state as JSON for Three.js dashboard
              pub fn dashboard_json(&self) -> String {
                  let towers = self.tower_counts();
                  let total  = self.detections.len();
                  let jailed = self.detections.iter()
                      .filter(|d| matches!(d.state, NergalState::Jailed { .. }))
                      .count();
                  format!(
                      r#"{{"tribe":"IRKALLA","tribe_id":"0x{:04X}","total_threats":{},"jailed":{},\
                       "towers":[{},{},{},{},{},{},{}],"colour":"{}"}}"#,
                      IRKALLA_TRIBE_ID, total, jailed,
                      towers[0], towers[1], towers[2], towers[3],
                      towers[4], towers[5], towers[6],
                      crate::NERGAL_MAROON,
                  )
              }

              pub fn unseal_after_patch(&mut self, finding_kaki: &str) {
                  for det in &mut self.detections {
                      if det.finding_kaki == finding_kaki {
                          det.unseal_after_patch();
                          println!("[IRKALLA] Finding {} unsealed after patch", finding_kaki);
                      }
                  }
              }
          }

