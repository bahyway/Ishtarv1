          /// Firewall verdict for an incoming request
          #[derive(Debug, Clone)]
          pub enum FirewallVerdict {
              Allow,
              Block { detection: ThreatDetection },
          }

          pub struct NergalFirewall {
              pub scanner:       KakiScanner,
              pub blocked_count: u64,
              pub allowed_count: u64,
          }

          impl NergalFirewall {
              pub fn new() -> Self {
                  Self {
                      scanner:       KakiScanner::new(),
                      blocked_count: 0,
                      allowed_count: 0,
                  }
              }

              /// Gate every incoming W5H2 query
              /// Called before HeptaScript executor receives the query
              pub fn gate_query(&mut self, query: &str, epoch: u64) -> FirewallVerdict {
                  match self.scanner.scan_query(query, epoch) {
                      ScanResult::Clean => {
                          self.allowed_count += 1;
                          FirewallVerdict::Allow
                      }
                      ScanResult::Threat(det) => {
                          self.blocked_count += 1;
                          println!("[NERGAL FIREWALL] BLOCKED: {} — {}",
                              det.category.tower_index(), det.description);
                          FirewallVerdict::Block { detection: det }
                      }
                  }
              }

              /// Gate a raw TCP connection (IP-level filtering)
              pub fn gate_connection(&self, source_ip: &str) -> bool {
                  // Deny known bad actors — production: connects to threat feed
                  // Sovereign: no external API calls — local blocklist only
                  let blocklist = ["10.0.0.0", "192.168.0.0"]; // example
                  !blocklist.iter().any(|&blocked| source_ip.starts_with(blocked))
              }

              pub fn firewall_stats(&self) -> String {
                  format!("[NERGAL FIREWALL] Allowed: {} | Blocked: {}",
                      self.allowed_count, self.blocked_count)
              }
          }

