                          println!("Error: KAKI must be 32 hex chars (16 bytes)");
                      }
                  }

                  "--query" if args.len() >= 3 => {
                      println!("[NERGAL] Scanning query");
                      let mut sc = KakiScanner::new();
                      match sc.scan_query(&args[2..].join(" "), epoch) {
                          nergal_av::scanner::ScanResult::Clean =>
                              println!("✓ Query clean — allowed through firewall"),
                          nergal_av::scanner::ScanResult::Threat(det) => {
                              println!("✗ QUERY BLOCKED: {}", det.description);
                              irkalla.sentence(det).ok();
                          }
                      }
                  }

                  path => {
                      println!("[NERGAL] Scanning file: {}", path);
                      match std::fs::read(path) {
                          Ok(content) => {
                              let files = vec![(path.to_string(), content)];
                              let result = zeqp.scan_batch("cli_scan", &files, epoch);
