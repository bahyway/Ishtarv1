                  .duration_since(std::time::UNIX_EPOCH)
                  .map(|d| d.as_secs()).unwrap_or(0);

              match args[1].as_str() {
                  "--kaki" if args.len() >= 3 => {
                      println!("[NERGAL] Scanning KAKI: {}", args[2]);
                      let bytes: Vec<u8> = args[2]
                          .chars().collect::<Vec<_>>()
                          .chunks(2)
                          .filter_map(|c| {
