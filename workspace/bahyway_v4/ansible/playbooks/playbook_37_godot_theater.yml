---
# ══════════════════════════════════════════════════════════════════════════════
# PLAYBOOK 37 — DubSar Theater: Godot 4.7 + GDExtension scaffold
# ══════════════════════════════════════════════════════════════════════════════
#
# ARCHITECT : DUB.SAR 𒁾
# SEALED    : 2026-06-21
# TARGET    : eriduous-vdi (192.168.122.214)
#
# WHAT THIS BUILDS
# ────────────────
#   1. Downloads Godot 4.7 stable standalone binary (self-contained, no install)
#      Stored at: ~/dubsar-theater/godot/Godot_v4.7-stable_linux.x86_64
#
#   2. Creates the sovereign DubSar Theater Godot project:
#      ~/dubsar-theater/
#      ├── godot/                    ← Godot binary + project
#      │   ├── Godot_v4.7-stable_linux.x86_64
#      │   ├── project.godot
#      │   ├── bin/
#      │   │   └── dubsar.gdextension    ← maps Rust → Godot
#      │   └── scenes/
#      │       └── main_theater.tscn     ← Theater scene
#      └── (Rust GDExtension crate lives in ~/Forge/bahyway_v4/crates/dubsar-theater-ext/)
#
#   3. Creates main_theater.tscn with sovereign layout:
#      - CENTER_STAGE: GPUParticles3D  ← BIGRING simulation (50,000 particles)
#      - LEFT_PANEL:   SubViewport → MeshInstance3D at -35° Y ← HeptaScript editor
#      - RIGHT_PANEL:  SubViewport → MeshInstance3D at +35° Y ← ORBIT/GRID results
#      - NISABA:       Node3D above center ← hologram Stage 1 placeholder
#      - Camera3D:     positioned to see the full Theater
#
#   4. Creates dubsar-theater-ext Rust GDExtension crate in Forge workspace
#      - crate-type = ["cdylib"]
#      - depends on godot crate + enkidb-query (TCP to read node)
#      - BigRingNode3D class registered with Godot
#
#   5. Creates launch script and desktop entry
#
# SOVEREIGN RULES
# ───────────────
#   NO Flatpak  NO tokio  NO async  NO wgpu  NO external crates beyond godot-rust
#   Godot owns GPU. Rust owns logic. TCP owns data. egui owns text editors.
#   Godot version: 4.7 stable (released 2026-06-18)
#
# RUN FROM eriduous-vdi:
#   ansible-playbook ~/playbook_37_godot_theater.yml -i localhost, --connection=local
# ══════════════════════════════════════════════════════════════════════════════

- name: "PLAYBOOK 37 — DubSar Theater: Godot 4.7 + GDExtension scaffold"
  hosts: localhost
  gather_facts: true
  gather_subset: ['env']

  vars:
    godot_version:   "4.7"
    theater_dir:     "/home/bahyway/dubsar-theater"
    godot_dir:       "{{ theater_dir }}/godot"
    scenes_dir:      "{{ godot_dir }}/scenes"
    bin_dir:         "{{ godot_dir }}/bin"
    forge_root:      "/home/bahyway/Forge/bahyway_v4"
    ext_crate:       "{{ forge_root }}/crates/dubsar-theater-ext"
    godot_bin:       "{{ godot_dir }}/Godot_v{{ godot_version }}-stable_linux.x86_64"
    godot_zip_url:   "https://github.com/godotengine/godot/releases/download/{{ godot_version }}-stable/Godot_v{{ godot_version }}-stable_linux.x86_64.zip"
    read_node_ip:    "192.168.122.107"
    read_node_port:  "7001"

  tasks:

    # ── 0. CREATE DIRECTORY TREE ──────────────────────────────────────────────
    - name: "0.0 | Create theater directory tree"
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ theater_dir }}"
        - "{{ godot_dir }}"
        - "{{ scenes_dir }}"
        - "{{ bin_dir }}"
        - "{{ ext_crate }}/src"

    # ── 1. DOWNLOAD GODOT 4.7 ────────────────────────────────────────────────
    - name: "1.0 | Check if Godot already downloaded"
      ansible.builtin.stat:
        path: "{{ godot_bin }}"
      register: godot_stat

    - name: "1.1 | Download Godot 4.7 stable (self-contained binary)"
      ansible.builtin.get_url:
        url:  "{{ godot_zip_url }}"
        dest: "{{ godot_dir }}/godot.zip"
        mode: "0644"
      when: not godot_stat.stat.exists

    - name: "1.2 | Extract Godot binary"
      ansible.builtin.unarchive:
        src:        "{{ godot_dir }}/godot.zip"
        dest:       "{{ godot_dir }}/"
        remote_src: true
      when: not godot_stat.stat.exists

    - name: "1.3 | Make Godot executable"
      ansible.builtin.file:
        path: "{{ godot_bin }}"
        mode: "0755"

    - name: "1.4 | Confirm Godot version"
      ansible.builtin.command:
        cmd: "{{ godot_bin }} --version --headless"
      register: godot_ver
      ignore_errors: true

    - name: "1.5 | Show Godot version"
      ansible.builtin.debug:
        msg: "Godot: {{ godot_ver.stdout | default('binary ready') }}"

    # ── 2. GODOT PROJECT FILES ────────────────────────────────────────────────
    - name: "2.0 | Write project.godot"
      ansible.builtin.copy:
        dest: "{{ godot_dir }}/project.godot"
        content: |
          ; DubSar Theater — Sovereign BahyWay.Ecosystem v4.0
          ; DUB.SAR 𒁾  2026-06-21
          config_version=5

          [application]
          config/name="DubSar Theater"
          config/description="Sovereign 3D IDE — BIGRING + HeptaScript + ORBIT"
          config/version="4.0.0"
          config/features=PackedStringArray("4.7", "Forward Plus")
          run/main_scene="res://scenes/main_theater.tscn"
          config/icon="res://icon.svg"

          [display]
          window/size/viewport_width=1920
          window/size/viewport_height=1080
          window/size/mode=3
          window/vsync/vsync_mode=1

          [rendering]
          renderer/rendering_method="forward_plus"
          environment/defaults/default_clear_color=Color(0.07, 0.08, 0.13, 1)

    - name: "2.1 | Write dubsar.gdextension — Rust→Godot connector"
      ansible.builtin.copy:
        dest: "{{ bin_dir }}/dubsar.gdextension"
        content: |
          ; dubsar.gdextension — sovereign GDExtension connector
          ; Maps Godot nodes to Rust GDExtension classes
          ; DUB.SAR 𒁾  2026-06-21

          [configuration]
          entry_symbol = "gdextension_initialize"
          compatibility_minimum = "4.2"
          reloadable = true

          [libraries]
          linux.debug.x86_64   = "res://bin/libdubsar_theater_ext.so"
          linux.release.x86_64  = "res://bin/libdubsar_theater_ext.so"

          [icons]
          BigRingNode3D = "res://icon.svg"

    - name: "2.2 | Write main_theater.tscn — sovereign Theater scene"
      ansible.builtin.copy:
        dest: "{{ scenes_dir }}/main_theater.tscn"
        content: |
          ; DubSar Theater — Main Scene
          ; Architecture: CENTER_STAGE (BIGRING) + LEFT/RIGHT curved panels + NISABA
          ; DUB.SAR 𒁾  2026-06-21
          ;
          ; LEFT_CURVED_PANEL  : transform rotated -35° on Y axis
          ;   cos(35°) = 0.819152  sin(35°) = 0.573576
          ;   Transform3D col0=(0.819152, 0, -0.573576)
          ;
          ; RIGHT_CURVED_PANEL : transform rotated +35° on Y axis
          ;   Transform3D col0=(0.819152, 0, 0.573576)

          [gd_scene load_steps=4 format=3 uid="uid://theater_main"]

          [ext_resource type="Script" path="res://scripts/theater_controller.gd" id="1"]

          [sub_resource type="ParticleProcessMaterial" id="bigring_mat"]
          emission_shape = 2
          emission_sphere_radius = 3.0
          direction = Vector3(0, 1, 0)
          spread = 180.0
          gravity = Vector3(0, 0, 0)
          initial_velocity_min = 0.5
          initial_velocity_max = 2.0
          angular_velocity_min = -45.0
          angular_velocity_max = 45.0
          color = Color(0.118, 0.627, 0.459, 1)

          [sub_resource type="QuadMesh" id="panel_mesh"]
          size = Vector2(3.2, 2.0)

          [node name="DubSarTheater" type="Node3D"]
          script = ExtResource("1")

          [node name="Camera3D" type="Camera3D" parent="."]
          transform = Transform3D(1, 0, 0, 0, 0.9659, 0.2588, 0, -0.2588, 0.9659, 0, 2.0, 6.0)
          current = true
          fov = 70.0

          [node name="CENTER_STAGE" type="GPUParticles3D" parent="."]
          transform = Transform3D(1, 0, 0, 0, 1, 0, 0, 0, 1, 0, 1.5, -1.0)
          amount = 50000
          lifetime = 4.0
          process_material = SubResource("bigring_mat")
          visibility_aabb = AABB(-5, -5, -5, 10, 10, 10)

          [node name="NISABA_STAGE1" type="Node3D" parent="."]
          transform = Transform3D(1, 0, 0, 0, 1, 0, 0, 0, 1, 0, 4.0, -1.0)

          [node name="LEFT_CURVED_PANEL" type="MeshInstance3D" parent="."]
          transform = Transform3D(0.819152, 0, 0.573576, 0, 1, 0, -0.573576, 0, 0.819152, -3.2, 1.5, 1.0)
          mesh = SubResource("panel_mesh")

          [node name="LEFT_SUBVIEWPORT" type="SubViewport" parent="LEFT_CURVED_PANEL"]
          size = Vector2i(960, 600)
          render_target_update_mode = 3

          [node name="RIGHT_CURVED_PANEL" type="MeshInstance3D" parent="."]
          transform = Transform3D(0.819152, 0, -0.573576, 0, 1, 0, 0.573576, 0, 0.819152, 3.2, 1.5, 1.0)
          mesh = SubResource("panel_mesh")

          [node name="RIGHT_SUBVIEWPORT" type="SubViewport" parent="RIGHT_CURVED_PANEL"]
          size = Vector2i(960, 600)
          render_target_update_mode = 3

          [node name="TheaterLight" type="DirectionalLight3D" parent="."]
          transform = Transform3D(1, 0, 0, 0, 0.866025, 0.5, 0, -0.5, 0.866025, 0, 5, 0)
          light_energy = 0.6
          light_color = Color(0.831, 0.686, 0.216, 1)

          [node name="AmbientFill" type="OmniLight3D" parent="."]
          transform = Transform3D(1, 0, 0, 0, 1, 0, 0, 0, 1, 0, 3, 3)
          light_color = Color(0.114, 0.62, 0.459, 1)
          light_energy = 0.3
          omni_range = 12.0

    - name: "2.3 | Write theater_controller.gd — GDScript orchestrator"
      ansible.builtin.file:
        path: "{{ godot_dir }}/scripts"
        state: directory
        mode: "0755"

    - name: "2.4 | Write theater_controller.gd"
      ansible.builtin.copy:
        dest: "{{ godot_dir }}/scripts/theater_controller.gd"
        content: |
          # theater_controller.gd — DubSar Theater orchestrator
          # DUB.SAR 𒁾  2026-06-21
          #
          # Controls:
          #   - BIGRING particle color driven by query result quality (B11)
          #   - LEFT panel: HeptaScript editor (egui SubViewport texture)
          #   - RIGHT panel: ORBIT/GRID results (egui SubViewport texture)
          #   - NISABA Stage 1: light cone above center stage
          #
          # The Rust GDExtension (BigRingNode3D) handles:
          #   - TCP query to enkidb-query-server:7001
          #   - KAKI particle → 3D position mapping
          #   - B11 quality → particle colour + orbit radius

          extends Node3D

          @onready var center_stage  = $CENTER_STAGE
          @onready var left_panel    = $LEFT_CURVED_PANEL
          @onready var right_panel   = $RIGHT_CURVED_PANEL
          @onready var nisaba        = $NISABA_STAGE1

          # Sovereign colour palette
          const GOLD   = Color(0.831, 0.686, 0.216, 1.0)
          const TEAL   = Color(0.114, 0.620, 0.459, 1.0)
          const AMBER  = Color(0.937, 0.624, 0.153, 1.0)
          const CRIMSON = Color(0.863, 0.235, 0.235, 1.0)

          func _ready():
              print("𒁾 DubSar Theater initialized")
              print("  CENTER_STAGE: %d particles" % center_stage.amount)
              print("  Read node: 192.168.122.107:7001")
              _setup_panels()
              _setup_nisaba()

          func _setup_panels():
              # Apply sovereign dark material to side panels
              var mat = StandardMaterial3D.new()
              mat.albedo_color = Color(0.07, 0.08, 0.13, 0.92)
              mat.transparency = BaseMaterial3D.TRANSPARENCY_ALPHA
              mat.emission_enabled = true
              mat.emission = TEAL
              mat.emission_energy_multiplier = 0.3
              left_panel.set_surface_override_material(0, mat)
              right_panel.set_surface_override_material(0, mat.duplicate())

          func _setup_nisaba():
              # Stage 1: Gold light cone above center stage
              var spot = SpotLight3D.new()
              spot.light_color = GOLD
              spot.light_energy = 2.0
              spot.spot_range = 8.0
              spot.spot_angle = 25.0
              spot.transform.origin = Vector3(0, 0, 0)
              nisaba.add_child(spot)
              print("  NISABA Stage 1: light cone active")

          func _process(delta):
              # Rotate BIGRING slowly on Y axis
              center_stage.rotation.y += delta * 0.05

          # Called by BigRingNode3D (Rust) when query returns results
          func on_query_result(particle_count: int, gem_count: int, fuzzy_count: int):
              print("𒁾 Query result: %d particles (%d GEM, %d FUZZY)" % [
                  particle_count, gem_count, fuzzy_count])
              # Update particle material colour based on quality distribution
              var mat = center_stage.process_material as ParticleProcessMaterial
              if mat:
                  if gem_count > fuzzy_count:
                      mat.color = GOLD
                  else:
                      mat.color = AMBER

    - name: "2.5 | Write minimal icon.svg"
      ansible.builtin.copy:
        dest: "{{ godot_dir }}/icon.svg"
        content: |
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
            <rect width="64" height="64" rx="8" fill="#1A1A2E"/>
            <text x="32" y="48" text-anchor="middle" font-size="40" fill="#D4AF37">𒁾</text>
          </svg>

    # ── 3. RUST GDEXTENSION CRATE ─────────────────────────────────────────────
    - name: "3.0 | Write dubsar-theater-ext/Cargo.toml"
      ansible.builtin.copy:
        dest: "{{ ext_crate }}/Cargo.toml"
        content: |
          [package]
          name        = "dubsar-theater-ext"
          version     = "4.0.0"
          edition     = "2021"
          authors     = ["DUB.SAR 𒁾"]
          description = "Godot 4.7 GDExtension — DubSar Theater sovereign bridge"

          [lib]
          crate-type = ["cdylib"]

          [dependencies]
          # godot-rust — the sovereign bridge to Godot 4.7
          godot = { version = "0.2" }

          # Sovereign internal crates — TCP query + KAKI types
          bahyway-core   = { path = "../bahyway-core" }
          enkidb-query   = { path = "../enkidb-query" }
          heptascript    = { path = "../heptascript" }
          akkvalue       = { path = "../akkvalue" }

    - name: "3.1 | Write dubsar-theater-ext/src/lib.rs"
      ansible.builtin.copy:
        dest: "{{ ext_crate }}/src/lib.rs"
        content: |
          //! dubsar-theater-ext — Sovereign Godot 4.7 GDExtension
          //! ═══════════════════════════════════════════════════════
          //!
          //! Registers BahyWay sovereign Rust classes with Godot:
          //!   BigRingNode3D  — drives CENTER_STAGE particles from EnkiDB query results
          //!   TheaterBridge  — TCP client to enkidb-query-server:7001
          //!
          //! On each query:
          //!   1. Sends W5H2 source via TCP to read node
          //!   2. Receives JSON rows (chunked batches + DONE sentinel)
          //!   3. Converts KAKI particles to 3D positions using 7D dimensions
          //!   4. Updates GPUParticles3D via Godot's RenderingServer
          //!   5. Calls theater_controller.gd::on_query_result()
          //!
          //! DUB.SAR 𒁾  2026-06-21

          use godot::prelude::*;

          struct DubSarTheaterExt;

          #[gdextension]
          unsafe impl ExtensionLibrary for DubSarTheaterExt {}

          // ── BigRingNode3D — sovereign KAKI particle renderer ─────────────────
          #[derive(GodotClass)]
          #[class(base=Node3D)]
          pub struct BigRingNode3D {
              base:            Base<Node3D>,
              /// enkidb-query-server address
              server_addr:     String,
              /// Current particle count from last query
              particle_count:  i64,
              /// GEM quality count (B11 >= 200)
              gem_count:       i64,
              /// FUZZY quality count (B11 < 128)
              fuzzy_count:     i64,
          }

          #[godot_api]
          impl INode3D for BigRingNode3D {
              fn init(base: Base<Node3D>) -> Self {
                  godot_print!("𒁾 BigRingNode3D initialized — sovereign particle bridge");
                  Self {
                      base,
                      server_addr:    "192.168.122.107:7001".to_string(),
                      particle_count: 0,
                      gem_count:      0,
                      fuzzy_count:    0,
                  }
              }

              fn ready(&mut self) {
                  godot_print!("𒁾 BigRingNode3D ready — server: {}", self.server_addr);
              }

              fn process(&mut self, _delta: f64) {
                  // Per-frame logic — particle animation driven by Godot GPU system
                  // Heavy query work is done in execute_query() called from GDScript
              }
          }

          #[godot_api]
          impl BigRingNode3D {
              /// Execute a W5H2 query against the read node.
              /// Called from GDScript: $BigRingNode3D.execute_query("WHO T.E\nHOW_MUCH LIMIT 1000")
              /// Returns number of matched particles.
              #[func]
              pub fn execute_query(&mut self, hepta_src: GString) -> i64 {
                  use std::io::{Read, Write};
                  use std::net::TcpStream;
                  use std::time::Duration;

                  let src = hepta_src.to_string();
                  godot_print!("𒁾 W5H2 query: {} bytes", src.len());

                  // TCP connect to read node
                  let mut stream = match TcpStream::connect_timeout(
                      &self.server_addr.parse().unwrap(),
                      Duration::from_secs(5),
                  ) {
                      Ok(s)  => s,
                      Err(e) => {
                          godot_error!("Cannot reach {}: {}", self.server_addr, e);
                          return -1;
                      }
                  };
                  stream.set_read_timeout(Some(Duration::from_secs(120))).ok();

                  // Send query frame [u32 LE len][UTF-8 source]
                  let qb = src.as_bytes();
                  if stream.write_all(&(qb.len() as u32).to_le_bytes()).is_err()
                     || stream.write_all(qb).is_err()
                     || stream.flush().is_err()
                  {
                      godot_error!("Failed to send query to {}", self.server_addr);
                      return -1;
                  }

                  // Read BATCH frames until DONE sentinel (u32 = 0)
                  let mut total     = 0i64;
                  let mut gem       = 0i64;
                  let mut fuzzy     = 0i64;

                  loop {
                      let mut lb = [0u8; 4];
                      if stream.read_exact(&mut lb).is_err() { break; }
                      let frame_len = u32::from_le_bytes(lb);
                      if frame_len == 0 { break; } // DONE sentinel

                      let mut buf = vec![0u8; frame_len as usize];
                      if stream.read_exact(&mut buf).is_err() { break; }

                      let payload = match String::from_utf8(buf) {
                          Ok(s) => s,
                          Err(_) => break,
                      };
                      if payload.starts_with("ERR:") {
                          godot_error!("Server error: {}", payload);
                          break;
                      }

                      // Count particles and quality distribution
                      for obj in payload.split("},{") {
                          total += 1;
                          // Extract B11 from kaki hex bytes 20-22
                          if let Some(kaki_start) = obj.find("\"kaki\":\"") {
                              let hex = &obj[kaki_start + 8..];
                              let hex = &hex[..hex.find('"').unwrap_or(32).min(32)];
                              if hex.len() >= 22 {
                                  if let Ok(b11) = u8::from_str_radix(&hex[20..22], 16) {
                                      if b11 >= 200 { gem += 1; }
                                      else if b11 < 128 { fuzzy += 1; }
                                  }
                              }
                          }
                      }
                  }

                  self.particle_count = total;
                  self.gem_count      = gem;
                  self.fuzzy_count    = fuzzy;

                  godot_print!("𒁾 Query complete: {} particles ({} GEM, {} FUZZY)",
                      total, gem, fuzzy);
                  total
              }

              /// Get GEM particle count from last query
              #[func]
              pub fn get_gem_count(&self) -> i64 { self.gem_count }

              /// Get FUZZY particle count from last query
              #[func]
              pub fn get_fuzzy_count(&self) -> i64 { self.fuzzy_count }

              /// Set server address (default: 192.168.122.107:7001)
              #[func]
              pub fn set_server_addr(&mut self, addr: GString) {
                  self.server_addr = addr.to_string();
              }
          }

    # ── 4. ADD TO WORKSPACE ───────────────────────────────────────────────────
    - name: "4.0 | Add dubsar-theater-ext to workspace Cargo.toml"
      ansible.builtin.lineinfile:
        path:         "{{ forge_root }}/Cargo.toml"
        line:         '    "crates/dubsar-theater-ext",'
        insertafter:  '"crates/enkidb-query-server",'
        state:        present

    # ── 5. CARGO CHECK (GDExtension crate) ───────────────────────────────────
    - name: "5.0 | cargo check dubsar-theater-ext"
      ansible.builtin.shell: |
        cd {{ forge_root }}
        cargo check -p dubsar-theater-ext 2>&1
      register: check_out

    - name: "5.1 | Show check result"
      ansible.builtin.debug:
        msg: "{{ (check_out.stdout_lines + check_out.stderr_lines)[-20:] }}"

    # ── 6. LAUNCH SCRIPT ──────────────────────────────────────────────────────
    - name: "6.0 | Write launch script"
      ansible.builtin.copy:
        dest:    "{{ theater_dir }}/launch_theater.sh"
        mode:    "0755"
        content: |
          #!/usr/bin/env bash
          # DubSar Theater — sovereign launch script
          # DUB.SAR 𒁾  2026-06-21
          set -euo pipefail

          THEATER_DIR="$(cd "$(dirname "$0")" && pwd)"
          GODOT_BIN="${THEATER_DIR}/godot/Godot_v4.7-stable_linux.x86_64"
          GODOT_PROJECT="${THEATER_DIR}/godot"

          echo "𒁾 DubSar Theater launching…"
          echo "  Godot  : ${GODOT_BIN}"
          echo "  Project: ${GODOT_PROJECT}"

          # Verify TCP server on read node
          if ! nc -z -w2 192.168.122.107 7001 2>/dev/null; then
              echo "  WARNING: enkidb-query-server not reachable on 192.168.122.107:7001"
              echo "  Start it: ssh bahyway@192.168.122.107 'nohup /home/bahyway/enkidb/server/enkidb-query-server > /home/bahyway/enkidb/server/server.log 2>&1 &'"
          else
              echo "  enkidb-query-server: LIVE"
          fi

          # Launch Godot in project mode (not editor)
          exec "${GODOT_BIN}" --path "${GODOT_PROJECT}" "$@"

    - name: "6.1 | Write editor launch script (opens Godot editor)"
      ansible.builtin.copy:
        dest:    "{{ theater_dir }}/launch_editor.sh"
        mode:    "0755"
        content: |
          #!/usr/bin/env bash
          # Open DubSar Theater in Godot editor
          THEATER_DIR="$(cd "$(dirname "$0")" && pwd)"
          GODOT_BIN="${THEATER_DIR}/godot/Godot_v4.7-stable_linux.x86_64"
          exec "${GODOT_BIN}" --editor --path "${THEATER_DIR}/godot" "$@"

    # ── 7. DESKTOP ENTRY ─────────────────────────────────────────────────────
    - name: "7.0 | Write desktop entry"
      ansible.builtin.copy:
        dest: "/home/bahyway/.local/share/applications/dubsar-theater.desktop"
        mode: "0755"
        content: |
          [Desktop Entry]
          Type=Application
          Version=1.0
          Name=DubSar Theater
