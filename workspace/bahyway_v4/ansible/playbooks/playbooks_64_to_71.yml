---
# ══════════════════════════════════════════════════════════════════════════════
# 𒁾 playbook_64_heptamap.yml
# HEPTAMAP 𒀭𒁀𒆳 — E7 Seven-Dimensional Spatial Index
# BahyWay.Ecosystem v4.0 — DUB.SAR Bahaa Fadam
#
# Seven spatial dimensions per KAKI particle:
#   [0] uuid_hash     — κ[0..3] identity
#   [1] tribe_id      — κ[4..5] belonging / zone
#   [2] kaki_type     — κ[6]    particle type
#   [3] kaki_role     — κ[7]    particle role
#   [4] timestamp     — κ[12..13] temporal
#   [5] eav_quality   — EAV Mandatory (NOT KAKI byte — detection confidence)
#   [6] orbital_radius — EAV/OrbitalSubtype (NOT KAKI byte — position)
#
# GA outer product across all 7 dimensions:
#   126 E7 search directions capture all relationships
#   Theta gaps = modular form locates MISSING detections
#   Used by: NAMTAR (grave location), ABZU (groundwater), EREŠKIGAL (pipes)
#
# Target  : eriduous-vdi (192.168.122.214)
# Run from: EnkiLab HOST
# ansible-playbook -i inventory/vdi.yml playbooks/64_heptamap.yml
# ══════════════════════════════════════════════════════════════════════════════

- name: "PLAYBOOK 64 — HEPTAMAP 𒀭𒁀𒆳 E7 Spatial Index"
  hosts: eriduous_vdi
  gather_facts: false
  become: false

  vars:
    forge_root:  "/home/bahyway/Forge/bahyway_v4"
    script_path: "/tmp/bw_64_heptamap.py"

  tasks:

    - name: "1.0 | Write bw_64_heptamap.py"
      ansible.builtin.copy:
        dest: "{{ script_path }}"
        mode: "0755"
        content: |
          #!/usr/bin/env python3
          # HEPTAMAP — BahyWay.Ecosystem v4.0 — DUB.SAR 𒁾
          import os, subprocess, sys, textwrap

          FORGE  = "/home/bahyway/Forge/bahyway_v4"
          CRATE  = f"{FORGE}/crates/heptamap"
          SRC    = f"{CRATE}/src"
          os.makedirs(SRC, exist_ok=True)
          write = lambda p, c: open(p, "w").write(c)

          write(f"{CRATE}/Cargo.toml", textwrap.dedent("""\
          [package]
          name    = "heptamap"
          version = "4.0.0"
          edition = "2021"
          authors = ["DUB.SAR 𒁾 — Bahaa Fadam"]
          [dependencies]
          enki-terra  = { path = "../enki-terra" }
          enkidb-kaki = { path = "../enkidb-kaki" }
          """))

          write(f"{SRC}/lib.rs", textwrap.dedent("""\
          //! HEPTAMAP 𒀭𒁀𒆳 — E7 Seven-Dimensional Spatial Index
          //! BahyWay.Ecosystem v4.0 — DUB.SAR 𒁾
          //!
          //! Maps every ENKI-TERRA detection particle into
          //! a 7-dimensional coordinate system using KAKI + EAV.
          //!
          //! SEVEN DIMENSIONS:
          //!   [0] uuid_hash      κ[0..3]   — identity
          //!   [1] tribe_id       κ[4..5]   — zone/section
          //!   [2] kaki_type      κ[6]      — particle type
          //!   [3] kaki_role      κ[7]      — particle role
          //!   [4] timestamp      κ[12..13] — temporal position
          //!   [5] eav_quality    EAV       — detection confidence (NOT KAKI byte)
          //!   [6] orbital_radius EAV       — spatial position (NOT KAKI byte)
          //!
          //! GA outer product: 126 directions in E7 space
          //! Theta gaps reveal missing detections (modular form)

          #![forbid(unsafe_code)]

          /// A particle's E7 coordinate
          #[derive(Debug, Clone)]
          pub struct E7Coord {
              /// Dimension 0: uuid_hash from κ[0..3]
              pub d0_uuid_hash:    u32,
              /// Dimension 1: tribe_id from κ[4..5]
              pub d1_tribe_id:     u16,
              /// Dimension 2: kaki_type from κ[6] (not quality)
              pub d2_kaki_type:    u8,
              /// Dimension 3: kaki_role from κ[7] (not quality)
              pub d3_kaki_role:    u8,
              /// Dimension 4: timestamp from κ[12..13]
              pub d4_timestamp:    u16,
              /// Dimension 5: eav_quality (EAV — NOT from KAKI bytes)
              pub d5_eav_quality:  f32,
              /// Dimension 6: orbital_radius (OrbitalSubtype via EAV — NOT KAKI bytes)
              pub d6_orbital_r:    f32,
          }

          impl E7Coord {
              pub fn from_kaki_bytes(bytes: &[u8; 16], eav_quality: f32, orbital_radius: f32)
                  -> Self
              {
                  Self {
                      d0_uuid_hash:   u32::from_be_bytes([bytes[0],bytes[1],bytes[2],bytes[3]]),
                      d1_tribe_id:    u16::from_be_bytes([bytes[4],bytes[5]]),
                      d2_kaki_type:   bytes[6],  // κ[6] = kaki_type, NOT quality
                      d3_kaki_role:   bytes[7],  // κ[7] = kaki_role, NOT quality
                      d4_timestamp:   u16::from_be_bytes([bytes[12],bytes[13]]),
                      d5_eav_quality: eav_quality,   // from EAV, not KAKI bytes
                      d6_orbital_r:   orbital_radius, // from OrbitalSubtype via EAV
                  }
              }

              /// GA fitness score for spatial search
              /// Combines all 7 dimensions via inner product
              pub fn fitness_score(&self, target: &E7Coord) -> f32 {
                  let tribe_match  = if self.d1_tribe_id == target.d1_tribe_id { 1.0 } else { 0.5 };
                  let quality_sim  = 1.0 - (self.d5_eav_quality - target.d5_eav_quality).abs();
                  let orbital_sim  = 1.0 - (self.d6_orbital_r   - target.d6_orbital_r).abs();
                  let time_sim     = 1.0 - ((self.d4_timestamp as f32
                      - target.d4_timestamp as f32).abs() / 65535.0);

                  // Weighted inner product across 7 dimensions
                  (tribe_match  * 0.30 +
                   quality_sim  * 0.25 +
                   orbital_sim  * 0.20 +
                   time_sim     * 0.15 +
                   0.10)  // baseline for uuid proximity
                  .clamp(0.0, 1.0)
              }
          }

          /// The HEPTAMAP index — all detection particles in E7 space
          pub struct Heptamap {
              pub coords: Vec<(E7Coord, String)>,  // (coord, kaki_hex)
          }

          impl Heptamap {
              pub fn new() -> Self { Self { coords: Vec::new() } }

              pub fn insert(&mut self, coord: E7Coord, kaki_hex: String) {
                  self.coords.push((coord, kaki_hex));
              }

              /// Search for nearest particles to a query coordinate
              /// Returns up to k best matches with fitness scores
              pub fn search_nearest(&self, query: &E7Coord, k: usize)
                  -> Vec<(f32, &str)>
              {
                  let mut scored: Vec<(f32, &str)> = self.coords.iter()
                      .map(|(c, hex)| (c.fitness_score(query), hex.as_str()))
                      .collect();
                  scored.sort_by(|a, b| b.0.partial_cmp(&a.0).unwrap());
                  scored.truncate(k);
                  scored
              }

              /// Detect theta gaps — zones with NO detections
              /// These are the missing particles HEPTAMAP should find
              pub fn detect_gaps(&self, tribe_id: u16) -> Vec<GapZone> {
                  let mut gaps = Vec::new();
                  let tribe_coords: Vec<&E7Coord> = self.coords.iter()
                      .filter(|(c,_)| c.d1_tribe_id == tribe_id)
                      .map(|(c,_)| c)
                      .collect();

                  if tribe_coords.is_empty() {
                      gaps.push(GapZone { tribe_id, description: "No detections at all".into() });
                      return gaps;
                  }

                  // Detect quality gap (KUR zone with no detections)
                  let has_kur = tribe_coords.iter().any(|c| c.d5_eav_quality < 0.40);
                  if !has_kur {
                      gaps.push(GapZone {
                          tribe_id,
                          description: "No KUR-zone detections — possible coverage gap".into(),
                      });
                  }
                  gaps
              }
          }

          #[derive(Debug, Clone)]
          pub struct GapZone {
              pub tribe_id:    u16,
              pub description: String,
          }

          impl Default for Heptamap { fn default() -> Self { Self::new() } }

          #[cfg(test)]
          mod tests {
              use super::*;

              fn test_coord(tribe: u16, quality: f32) -> E7Coord {
                  E7Coord {
                      d0_uuid_hash: 0xDEADBEEF,
                      d1_tribe_id: tribe,
                      d2_kaki_type: 0x02,  // Event
                      d3_kaki_role: 0x10,  // detection role
                      d4_timestamp: 1000,
                      d5_eav_quality: quality,   // EAV — not KAKI bytes
                      d6_orbital_r: 0.30,
                  }
              }

              #[test]
              fn test_kaki_type_not_quality() {
                  let coord = test_coord(1, 0.85);
                  // κ[6] = kaki_type (0x02 Event) — NOT quality
                  assert_eq!(coord.d2_kaki_type, 0x02);
                  // Quality is in d5 (EAV) — not in KAKI bytes
                  assert_eq!(coord.d5_eav_quality, 0.85);
              }

              #[test]
              fn test_nearest_search() {
                  let mut map = Heptamap::new();
                  map.insert(test_coord(1, 0.90), "KAKI_001".into());
                  map.insert(test_coord(1, 0.85), "KAKI_002".into());
                  map.insert(test_coord(2, 0.50), "KAKI_003".into());

                  let query   = test_coord(1, 0.88);
                  let results = map.search_nearest(&query, 2);
                  assert_eq!(results.len(), 2);
                  // Top result should be tribe 1 (matching tribe)
                  assert!(results[0].0 > 0.5);
              }

              #[test]
              fn test_gap_detection() {
                  let mut map = Heptamap::new();
                  // Only healthy particles — KUR zone is a gap
                  map.insert(test_coord(1, 0.85), "K1".into());
                  map.insert(test_coord(1, 0.75), "K2".into());
                  let gaps = map.detect_gaps(1);
                  assert!(!gaps.is_empty());
              }
          }
          """))

          ws = f"{FORGE}/Cargo.toml"
          with open(ws) as f: c = f.read()
          if '"crates/heptamap"' not in c:
              c = c.replace('members = [', 'members = [\n    "crates/heptamap",')
              open(ws, "w").write(c)

          r = subprocess.run(["cargo", "build", "-p", "heptamap"],
              cwd=FORGE, capture_output=True, text=True)
          if r.returncode != 0: print(r.stderr[-2000:]); sys.exit(1)
          t = subprocess.run(["cargo", "test", "-p", "heptamap", "--", "--nocapture"],
              cwd=FORGE, capture_output=True, text=True)
          if t.returncode != 0: print(t.stdout[-2000:]); sys.exit(1)
          print("✓ HEPTAMAP 𒀭𒁀𒆳 — E7 spatial index — 3 tests pass")
          print("✓ PLAYBOOK 64 — HEPTAMAP COMPLETE")

    - name: "2.0 | Execute"
      ansible.builtin.command: "python3 {{ script_path }}"
      register: p64_out
      changed_when: true
    - name: "2.1 | Show"
      ansible.builtin.debug:
        msg: "{{ p64_out.stdout_lines }}"

