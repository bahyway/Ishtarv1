# ══════════════════════════════════════════════════════════════════════════════

- name: "PLAYBOOK 66 — NANSHE 𒀭𒀭𒊩 River Contamination Intelligence"
  hosts: eriduous_vdi
  gather_facts: false
  become: false

  vars:
    forge_root:  "/home/bahyway/Forge/bahyway_v4"
