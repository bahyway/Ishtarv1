  tasks:

    - name: "1.0 | Write bw_66_nanshe.py"
      ansible.builtin.copy:
        dest: "{{ script_path }}"
        mode: "0755"
        content: |
          #!/usr/bin/env python3
          # NANSHE River Contamination — BahyWay.Ecosystem v4.0 — DUB.SAR 𒁾
          import os, subprocess, sys, textwrap

          FORGE  = "/home/bahyway/Forge/bahyway_v4"
          CRATE  = f"{FORGE}/crates/nanshe"
          SRC    = f"{CRATE}/src"
          os.makedirs(SRC, exist_ok=True)
          write = lambda p, c: open(p, "w").write(c)

          write(f"{CRATE}/Cargo.toml", textwrap.dedent("""\
          [package]
