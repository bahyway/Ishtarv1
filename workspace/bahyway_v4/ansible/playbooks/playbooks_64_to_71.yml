                  // Lower Tigris: 50000/0.21 = 238095
                  // Marshes:      80000/0.71 = 112676
                  assert_eq!(zones[0].tribe_id, tribes::LOWER_TIGRIS);
              }

              #[test]
              fn test_seven_tribes_defined() {
                  assert_eq!(tribes::COASTAL, 7);
              }
          }
          """))

          # ── NAMTAR-NAVIGATOR — Godot Android Offline ──────────────────
          make_crate("namtar-navigator", "NAMTAR-NAVIGATOR Godot Android Offline Navigator",
          {"namtar": "namtar", "abzu": "abzu", "namtar-dinum": "namtar-dinum"},
          textwrap.dedent("""\
          //! NAMTAR-NAVIGATOR 𒀭𒂗𒋻𒁾 — Sovereign Offline Navigation
          //! Godot 4 → Android export — no internet required
          //! Arabic / Persian / Kurdish / Urdu NISABA voice
          //! BahyWay.Ecosystem v4.0 — DUB.SAR 𒁾
          //!
          //! THREE MODES:
          //!   Mode 1: WADI AL-SALAM GRAVE NAVIGATOR
          //!     Compass bearing + distance to grave candidates
          //!     Arabic NISABA guides to location offline
          //!
          //!   Mode 2: MASS GRAVE FAMILY FINDER
          //!     Arabic voice: "أخبريني عن ابنك"
          //!     Natural language → VictimSearch
          //!     All data stays on device (privacy sovereign)
          //!
          //!   Mode 3: GROUNDWATER DRILLER NAVIGATOR (ABZU)
          //!     Nearest confirmed/probable water sources
          //!     Drill depth + yield estimates
          //!     Community verification status
          //!
          //! OFFLINE ARCHITECTURE:
          //!   Downloads 50km radius data package
          //!   HeptaMap cells cached locally
          //!   Syncs when connected — uploads community verifications
          //!   Works at 0% connectivity

          #![forbid(unsafe_code)]

          /// Navigator mode
          #[derive(Debug, Clone, PartialEq)]
          pub enum NavigatorMode {
              WadiAlSalamGrave,
              MassGraveFamilyFinder,
              GroundwaterDriller,
          }

          /// Navigation instruction in a supported language
          #[derive(Debug, Clone)]
          pub struct NavigationInstruction {
              pub mode:          NavigatorMode,
              pub language:      Language,
              pub bearing_deg:   f32,
              pub distance_m:    f32,
              pub text:          String,
              pub confidence:    f32,
          }

          #[derive(Debug, Clone, PartialEq)]
          pub enum Language {
              Arabic,  // primary — Iraqi dialect
              Persian, // Iranian pilgrims to Najaf
              Kurdish, // Sorani + Kurmanji
              Urdu,    // South Asian pilgrims
              English, // fallback
          }

          pub struct Navigator {
              pub mode:     NavigatorMode,
              pub language: Language,
          }

          impl Navigator {
              pub fn new(mode: NavigatorMode, language: Language) -> Self {
                  Self { mode, language }
              }

              /// Generate navigation instruction to target
              pub fn navigate_to(
                  &self,
                  user_lat: f64, user_lon: f64,
                  target_lat: f64, target_lon: f64,
                  confidence: f32,
              ) -> NavigationInstruction {
                  let bearing  = Self::bearing(user_lat, user_lon, target_lat, target_lon);
                  let distance = Self::distance_m(user_lat, user_lon, target_lat, target_lon);
                  let text = self.compose_instruction(bearing, distance, confidence);

                  NavigationInstruction {
                      mode:       self.mode.clone(),
                      language:   self.language.clone(),
                      bearing_deg: bearing,
                      distance_m:  distance,
                      text,
                      confidence,
                  }
              }

              fn compose_instruction(&self, bearing: f32, dist: f32, conf: f32) -> String {
                  let dir = Self::bearing_to_direction(bearing);
                  match (&self.language, &self.mode) {
                      (Language::Arabic, NavigatorMode::WadiAlSalamGrave) =>
                          format!("اتجه {} لمسافة {:.0} متر — الثقة: {:.0}%",
                              dir, dist, conf * 100.0),
                      (Language::Arabic, NavigatorMode::MassGraveFamilyFinder) =>
                          format!("الموقع المحتمل: {} — {:.0} متر — {:.0}% تطابق",
                              dir, dist, conf * 100.0),
                      (Language::Arabic, NavigatorMode::GroundwaterDriller) =>
                          format!("المياه الجوفية: {} — {:.0} متر — الثقة {:.0}%",
                              dir, dist, conf * 100.0),
                      _ =>
                          format!("Head {} for {:.0}m — confidence {:.0}%",
                              dir, dist, conf * 100.0),
                  }
              }

              fn bearing_to_direction(deg: f32) -> &'static str {
                  match (deg as u32 + 22) / 45 % 8 {
                      0 | 8 => "north",     1 => "northeast",
                      2     => "east",      3 => "southeast",
                      4     => "south",     5 => "southwest",
                      6     => "west",      _ => "northwest",
                  }
              }

              fn bearing(lat1: f64, lon1: f64, lat2: f64, lon2: f64) -> f32 {
                  let dlon  = (lon2 - lon1).to_radians();
                  let lat1r = lat1.to_radians();
                  let lat2r = lat2.to_radians();
                  let y     = dlon.sin() * lat2r.cos();
                  let x     = lat1r.cos() * lat2r.sin()
                              - lat1r.sin() * lat2r.cos() * dlon.cos();
                  let b     = y.atan2(x).to_degrees() as f32;
                  if b < 0.0 { b + 360.0 } else { b }
              }

              fn distance_m(lat1: f64, lon1: f64, lat2: f64, lon2: f64) -> f32 {
                  let r    = 6_371_000.0f64;
                  let dlat = (lat2 - lat1).to_radians();
                  let dlon = (lon2 - lon1).to_radians();
                  let a    = (dlat/2.0).sin().powi(2)
                      + lat1.to_radians().cos() * lat2.to_radians().cos()
                      * (dlon/2.0).sin().powi(2);
                  (r * 2.0 * a.sqrt().atan2((1.0-a).sqrt())) as f32
              }
          }

