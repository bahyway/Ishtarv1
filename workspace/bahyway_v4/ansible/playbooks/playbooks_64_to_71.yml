          authors = ["DUB.SAR 𒁾 — Bahaa Fadam"]
          [dependencies]
          enki-terra  = { path = "../enki-terra" }
          enkidb-kaki = { path = "../enkidb-kaki" }
          """))

          write(f"{SRC}/lib.rs", textwrap.dedent("""\
          //! NANSHE 𒀭𒀭𒊩 — River Contamination Intelligence
          //! Sumerian goddess of rivers, fish, and social justice.
          //! Daughter of Enki. Protected the poor. Governed water.
          //! BahyWay.Ecosystem v4.0 — DUB.SAR 𒁾
          //!
          //! FIVE DETECTION MODULES:
          //!   1. SewageOutfallDetector   — chlorophyll-a blooms
          //!   2. RiverBedMapper          — encalcification / sediment
          //!   3. OilfieldContamination   — BTEX compounds 2280-2350nm
          //!   4. SaltwaterIntrusion      — Shatt al-Arab advancing front
          //!   5. MarshRestorationMapper  — Mesopotamian Marshes (UNESCO)
          //!
          //! ŠĀRU_sediment = sediment_rate × days (dredging urgency)
          //! ŠĀRU_health   = population × contamination × days

          #![forbid(unsafe_code)]

          use enki_terra::{SharuType, SharuEvent};

          #[derive(Debug, Clone, PartialEq)]
          pub enum ContaminationType {
              SewageOutfall,       // chlorophyll-a 665/709nm + thermal
              OilfieldBtex,        // BTEX 2280-2350nm
              SaltwaterIntrusion,  // Shatt al-Arab
