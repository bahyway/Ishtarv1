# ══════════════════════════════════════════════════════════════════════════════
# 𒁾 playbook_65_ereskigal.yml
# EREŠKIGAL 𒀭𒊩𒆠𒃲 — Informal Settlement Pipeline Topology
# "Queen of the Underworld — She knows every hidden path"
# BahyWay.Ecosystem v4.0 — DUB.SAR Bahaa Fadam
# ══════════════════════════════════════════════════════════════════════════════

- name: "PLAYBOOK 65 — EREŠKIGAL 𒀭𒊩𒆠𒃲 Informal Settlement Pipeline"
  hosts: eriduous_vdi
  gather_facts: false
  become: false

  vars:
    forge_root:  "/home/bahyway/Forge/bahyway_v4"
    script_path: "/tmp/bw_65_ereskigal.py"

  tasks:

    - name: "1.0 | Write bw_65_ereskigal.py"
      ansible.builtin.copy:
        dest: "{{ script_path }}"
        mode: "0755"
        content: |
          #!/usr/bin/env python3
          # EREŠKIGAL — BahyWay.Ecosystem v4.0 — DUB.SAR 𒁾
          import os, subprocess, sys, textwrap

          FORGE  = "/home/bahyway/Forge/bahyway_v4"
          CRATE  = f"{FORGE}/crates/ereskigal"
          SRC    = f"{CRATE}/src"
          os.makedirs(SRC, exist_ok=True)
          write = lambda p, c: open(p, "w").write(c)

          write(f"{CRATE}/Cargo.toml", textwrap.dedent("""\
          [package]
          name    = "ereskigal"
          version = "4.0.0"
          edition = "2021"
          authors = ["DUB.SAR 𒁾 — Bahaa Fadam"]
          [dependencies]
          enki-terra  = { path = "../enki-terra" }
          heptamap    = { path = "../heptamap" }
          enkidb-kaki = { path = "../enkidb-kaki" }
          """))

          write(f"{SRC}/lib.rs", textwrap.dedent("""\
          //! EREŠKIGAL 𒀭𒊩𒆠𒃲 — Informal Settlement Pipeline Topology
          //! "Queen of the Underworld — She knows every hidden path"
          //! BahyWay.Ecosystem v4.0 — DUB.SAR 𒁾
          //!
          //! Organic topology reconstructor for informal settlements:
          //!   Favelas (Rocinha), Kibera, Dharavi, Arab informal settlements
          //!
          //! TWO ENGINES:
          //!   Engine 1 — OrganicTopologyReconstructor
          //!     Pipes follow social network logic not engineering grids
          //!     Anchors: water entry points + roof tank terminals
          //!     Traces moisture signatures through organic building fabric
          //!     Flags gato connections (illegal taps — actively hidden)
          //!
          //!   Engine 2 — CommunityTestimonyIntegrator
          //!     Residents mark known junction locations
          //!     agueiro (community water coordinator) knowledge
          //!     SPECTRAL + COMMUNITY = highest confidence
          //!     CrossTribe-KAKI for each pipe segment relationship

          #![forbid(unsafe_code)]

          /// A node in the organic water network
          #[derive(Debug, Clone)]
          pub struct NetworkNode {
              pub lat:       f64,
              pub lon:       f64,
              pub node_type: NodeType,
              /// Detection confidence → eav_quality (EAV — not KAKI bytes)
              pub eav_quality: f32,
          }

          #[derive(Debug, Clone, PartialEq)]
          pub enum NodeType {
              EntryPoint,      // formal water entry into settlement
              RoofTank,        // blue water tank on rooftop (terminal)
              Junction,        // pipe junction (spectral detected)
              GatoTap,         // illegal tap (hidden)
              CommunityMeter,  // agueiro-registered point
          }

          /// A pipe segment connecting two nodes
          #[derive(Debug, Clone)]
          pub struct PipeSegment {
              pub from_node:   usize,
              pub to_node:     usize,
              pub segment_type: SegmentType,
              pub confidence:  f32,
              pub length_m:    f32,
          }

          #[derive(Debug, Clone)]
          pub enum SegmentType {
              FormalPipe,     // registered infrastructure
              OrganicPipe,    // spectral-detected, unregistered
              GatoConnection, // illegal tap connection
          }

          /// Community testimony record
          #[derive(Debug, Clone)]
          pub struct CommunityTestimony {
              pub witness_role: WitnessRole,
              pub lat:          f64,
              pub lon:          f64,
              pub description:  String,
              pub confidence:   f32,
          }

          #[derive(Debug, Clone)]
          pub enum WitnessRole {
              Agueiro,    // community water coordinator
              Resident,   // local resident
              Technician, // informal plumber
          }

          /// Engine 1: Organic Topology Reconstructor
          pub struct OrganicTopologyReconstructor;

          impl OrganicTopologyReconstructor {
              /// Reconstruct pipe network from entry points + roof tanks
              /// Production: traces spectral moisture signatures
              /// MVP: graph traversal from anchors
              pub fn reconstruct(
                  entries:    &[NetworkNode],
                  roof_tanks: &[NetworkNode],
              ) -> (Vec<NetworkNode>, Vec<PipeSegment>) {
                  let mut nodes    = Vec::new();
                  let mut segments = Vec::new();

                  // Add entry points
                  for (i, e) in entries.iter().enumerate() {
                      nodes.push(e.clone());
                      // Connect each entry to nearest roof tanks
                      for (j, tank) in roof_tanks.iter().enumerate() {
                          let dist = haversine_m(e.lat, e.lon, tank.lat, tank.lon);
                          if dist < 500.0 {
                              let tank_idx = entries.len() + j;
                              segments.push(PipeSegment {
                                  from_node:    i,
                                  to_node:      tank_idx,
                                  segment_type: SegmentType::OrganicPipe,
                                  confidence:   (e.eav_quality + tank.eav_quality) / 2.0,
                                  length_m:     dist,
                              });
                          }
                      }
                  }
                  for tank in roof_tanks { nodes.push(tank.clone()); }

                  (nodes, segments)
              }
          }

          /// Engine 2: Community Testimony Integrator
          pub struct CommunityTestimonyIntegrator;

          impl CommunityTestimonyIntegrator {
              /// Integrate spectral detections with community testimony
              /// SPECTRAL + COMMUNITY = highest confidence (synergy)
              pub fn integrate(
                  spectral_nodes: &mut Vec<NetworkNode>,
                  testimonies:    &[CommunityTestimony],
              ) {
                  for testimony in testimonies {
                      // Find nearest spectral node
                      let nearest = spectral_nodes.iter_mut().min_by(|a, b| {
                          let da = haversine_m(a.lat, a.lon, testimony.lat, testimony.lon);
                          let db = haversine_m(b.lat, b.lon, testimony.lat, testimony.lon);
                          da.partial_cmp(&db).unwrap()
                      });

                      if let Some(node) = nearest {
                          let dist = haversine_m(node.lat, node.lon, testimony.lat, testimony.lon);
                          if dist < 30.0 {
                              // Boost confidence when community confirms spectral
                              node.eav_quality = (node.eav_quality + testimony.confidence) / 2.0
                                  * 1.15;  // synergy boost
                              node.eav_quality = node.eav_quality.min(0.98);
                          }
                      } else {
                          // New node from testimony only
                          spectral_nodes.push(NetworkNode {
                              lat: testimony.lat, lon: testimony.lon,
                              node_type: match testimony.witness_role {
                                  WitnessRole::Agueiro => NodeType::CommunityMeter,
                                  _ => NodeType::Junction,
                              },
                              eav_quality: testimony.confidence * 0.85,
                          });
                      }
                  }
              }
          }

          fn haversine_m(lat1: f64, lon1: f64, lat2: f64, lon2: f64) -> f32 {
              let r    = 6_371_000.0f64;
              let dlat = (lat2 - lat1).to_radians();
              let dlon = (lon2 - lon1).to_radians();
              let a    = (dlat/2.0).sin().powi(2)
                  + lat1.to_radians().cos()
                  * lat2.to_radians().cos()
                  * (dlon/2.0).sin().powi(2);
              (r * 2.0 * a.sqrt().atan2((1.0-a).sqrt())) as f32
          }

          #[cfg(test)]
          mod tests {
              use super::*;

              #[test]
              fn test_organic_topology_reconstructed() {
                  let entries = vec![NetworkNode {
                      lat: -22.900, lon: -43.170,
                      node_type: NodeType::EntryPoint, eav_quality: 0.85
                  }];
                  let tanks = vec![NetworkNode {
                      lat: -22.901, lon: -43.171,
                      node_type: NodeType::RoofTank, eav_quality: 0.80
                  }];
                  let (nodes, segs) = OrganicTopologyReconstructor::reconstruct(&entries, &tanks);
                  assert_eq!(nodes.len(), 2);
                  assert!(!segs.is_empty());
              }

              #[test]
              fn test_community_testimony_boosts_confidence() {
                  let mut nodes = vec![NetworkNode {
                      lat: -22.900, lon: -43.170,
                      node_type: NodeType::Junction, eav_quality: 0.70
                  }];
                  let testimonies = vec![CommunityTestimony {
                      witness_role: WitnessRole::Agueiro,
                      lat: -22.900, lon: -43.170,
                      description: "Pipe junction here confirmed".into(),
                      confidence: 0.85,
                  }];
                  let initial_q = nodes[0].eav_quality;
                  CommunityTestimonyIntegrator::integrate(&mut nodes, &testimonies);
                  assert!(nodes[0].eav_quality > initial_q);
              }
          }
          """))

          ws = f"{FORGE}/Cargo.toml"
          with open(ws) as f: c = f.read()
          if '"crates/ereskigal"' not in c:
              c = c.replace('members = [', 'members = [\n    "crates/ereskigal",')
              open(ws, "w").write(c)

          r = subprocess.run(["cargo", "build", "-p", "ereskigal"],
              cwd=FORGE, capture_output=True, text=True)
          if r.returncode != 0: print(r.stderr[-2000:]); sys.exit(1)
          t = subprocess.run(["cargo", "test", "-p", "ereskigal", "--", "--nocapture"],
              cwd=FORGE, capture_output=True, text=True)
          if t.returncode != 0: print(t.stdout[-2000:]); sys.exit(1)
          print("✓ EREŠKIGAL 𒀭𒊩𒆠𒃲 — organic topology + community testimony")
          print("✓ PLAYBOOK 65 — EREŠKIGAL COMPLETE")

    - name: "2.0 | Execute"
      ansible.builtin.command: "python3 {{ script_path }}"
      register: p65_out
      changed_when: true
    - name: "2.1 | Show"
      ansible.builtin.debug:
        msg: "{{ p65_out.stdout_lines }}"

