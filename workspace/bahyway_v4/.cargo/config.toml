# Workaround for CMake >=4.0 removing support for `cmake_minimum_required`
# below 3.5. z3-sys (pulled in by bahyway-z3's "static-link-z3" feature,
# PB-87 Gate G4) vendors an old z3 CMakeLists.txt that still declares an old
# minimum, so a fresh CMake refuses to configure it at all. CMake reads this
# env var the same as `-DCMAKE_POLICY_VERSION_MINIMUM=3.5` (supported since
# CMake 3.31.3, added specifically for this class of break) -- and cargo's
# [env] table propagates to every build script's child processes, including
# z3-sys's own `cmake` invocation. Fixes the whole workspace once, here,
# instead of per-machine shell exports or per-playbook environment blocks.
[env]
CMAKE_POLICY_VERSION_MINIMUM = "3.5"
