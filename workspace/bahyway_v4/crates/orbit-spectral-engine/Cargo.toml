[package]
name        = "orbit-spectral-engine"
version     = "4.0.0"
edition     = "2021"
description = "BahyWay v4.0 — orbit-spectral-engine: nearest-neighbor spacing statistics (GUE vs Poisson) for orbit return-time sequences. Complements LamassuEngine's shape (persistent homology) with rhythm (spectral statistics), per GL-MRD-003. Design-time-only Riemann/trace-formula derivation stays in the tablet-house; what ships is cheap: spacing histogram + Kolmogorov-Smirnov distance."
authors     = ["DUB.SAR 𒁾 Bahaa Fadam"]

# Zero external dependencies — even the erf() approximation needed for the
# GUE Wigner-surmise CDF is implemented locally (Abramowitz & Stegun 7.1.26).
[dependencies]

[lib]
name = "orbit_spectral_engine"
