[package]
name              = "buzu-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
description       = "BUZU: bivector orbit encoding (GL-VIZ-001) -- billion-particle rendering law. We do not draw a billion positions; we draw orbits, and particles are phases upon them. A bivector plane element (from bahyway-algebra's Cl(7,0) substrate) is uploaded once; position is evaluated as a function of phase via rotor exponentiation, collapsing per-frame traffic to a scalar."

[dependencies]
bahyway-algebra = { path = "../bahyway-algebra" }
