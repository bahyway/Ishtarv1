[package]
name              = "pdm-gdext"
version.workspace = true
edition.workspace = true
authors.workspace = true
description       = "GDExtension bridge exposing bahyway-algebra's 20 topology operators + najaf-engine's simplicial-complex machinery to Godot, for DubSar PDM (Particle Data Modeling)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bahyway-algebra = { path = "../bahyway-algebra" }
najaf-engine    = { path = "../najaf-engine" }
godot           = { version = "0.5", features = ["api-4-3"] }
