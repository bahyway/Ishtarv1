[package]
name        = "ashnan-ingest"
version     = "0.1.0"
edition     = "2021"
description = "ASHNAN — Climate-agriculture-livestock intelligence — NARAMSIN ingest entry (BC-AGRI-001)"

[dependencies]
naramsin-bridge = { path = "../naramsin-bridge" }
naramsin-audit  = { path = "../naramsin-audit" }
uuid            = { version = "1", features = ["v4"] }
tracing         = "0.1"

[[bin]]
name = "ashnan-ingest"
path = "src/main.rs"

[lib]
name = "ashnan_ingest"
path = "src/lib.rs"
