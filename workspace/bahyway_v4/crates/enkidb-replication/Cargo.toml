[package]
name        = "enkidb-replication"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "EnkiDB sovereign replication — KAKI-signed append-only log with 7-layer verification"

[dependencies]
bahyway-core        = { path = "../bahyway-core" }
enkidb-kaki         = { path = "../enkidb-kaki" }
enkidb-journal      = { path = "../enkidb-journal" }
enkidb-readnode     = { path = "../enkidb-readnode" }
kupru               = { path = "../kupru" }
hepta-sec-firewall  = { path = "../hepta-sec-firewall" }
hepta-sec-policy    = { path = "../hepta-sec-policy" }
hepta-sec-sentinel  = { path = "../hepta-sec-sentinel" }
sha3                = { version = "0.10" }
subtle              = { version = "2" }

[dev-dependencies]
bahyway-crc         = { path = "../bahyway-crc" }
akkvalue            = { path = "../akkvalue" }
