[package]
name              = "dubsar-visualizer"
version.workspace = true
edition.workspace = true
authors.workspace = true
description       = "DubSar IDE v4.0 — egui/wgpu sovereign visualizer: Hepta 7D Radar · Particles · Baghdad WPD · Najaf Cemetery"

[[bin]]
name = "dubsar-visualizer"
path = "src/main.rs"

[lib]
name = "dubsar_visualizer"
path = "src/lib.rs"

[dependencies]
bahyway-core  = { path = "../bahyway-core" }
enkidb-kaki   = { path = "../enkidb-kaki" }
score-engine  = { path = "../score-engine" }
wpd-engine    = { path = "../wpd-engine" }
najaf-engine  = { path = "../najaf-engine" }
enkidb-journal   = { path = "../enkidb-journal" }
enkidb-snapshot  = { path = "../enkidb-snapshot" }
story-engine     = { path = "../story-engine" }
eframe        = { version = "0.29", default-features = false, features = ["wgpu", "x11", "wayland"] }
egui          = "0.29"
enkidullm-chat   = { path = "../enkidullm-chat" }
ea-agent-chat    = { path = "../ea-agent-chat" }
bee-mdm-bus      = { path = "../bee-mdm-bus" }
storage-sector   = { path = "../storage-sector" }
nisaba           = { path = "../nisaba" }
naming-registry  = { path = "../naming-registry" }
