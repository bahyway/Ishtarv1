[package]
name        = "esarhaddon-ingest"
version     = "0.1.0"
edition     = "2021"
description = "ESARHADDON — Earthquake rescue intelligence — NARAMSIN ingest entry (BC-QUAKE-001)"

[dependencies]
naramsin-bridge = { path = "../naramsin-bridge" }
naramsin-audit  = { path = "../naramsin-audit" }
uuid            = { version = "1", features = ["v4"] }
tracing         = "0.1"

[[bin]]
name = "esarhaddon-ingest"
path = "src/main.rs"

[lib]
name = "esarhaddon_ingest"
path = "src/lib.rs"
