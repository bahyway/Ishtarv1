[package]
name              = "enkidb-particle-store"
version.workspace = true
edition.workspace = true
authors.workspace = true
description       = "Real local KAKI-backed particle store shared by bahyway-enkidb and bahyway-lamassu -- not a network protocol, an honest local substrate for the CLIs that speak for a not-yet-networked EnkiDB Type"

[dependencies]
bahyway-core = { path = "../bahyway-core" }
bahyway-crc  = { path = "../bahyway-crc" }
enkidb-kaki  = { path = "../enkidb-kaki" }
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
serde_yaml   = "0.9"
