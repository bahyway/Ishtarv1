[package]
name = "gula-federation-advisory"
version = "0.1.0"
edition = "2021"
description = "SUSA-gated read-only advisory face of GulaFederationEngine. Advisory-only (Namtila principle): never blocks, never reserves."

[workspace]  # standalone crate -- not a member of the workspace/bahyway_v4 monorepo

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
base64 = "0.22"
time = { version = "0.3", features = ["formatting"] }
tower-http = { version = "0.5", features = ["cors"] }
