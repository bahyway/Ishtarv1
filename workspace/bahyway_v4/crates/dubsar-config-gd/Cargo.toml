[package]
name              = "dubsar-config-gd"
version.workspace = true
edition.workspace = true
authors.workspace = true
description       = "GDExtension bridge exposing tupsimati's sealed-configuration-tablet model to Godot, for a future DubSar IDE configuration panel (EnkiDB seven / SLA / Tertu FIS tabs). Stateless, matching kupru-gdext/pdm-gdext/navi-translate-gdext's own FFI-boundary law -- the tablet's accumulated field state lives in GDScript, not behind a long-lived Rust handle."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
tupsimati = { path = "../tupsimati" }
kupru     = { path = "../kupru" }
godot     = { version = "0.5", features = ["api-4-3"] }
