[package]
name              = "enkidb-readnode"
version.workspace = true
edition.workspace = true
authors.workspace = true
description       = "ADR-012 Read Node: materializes a Journal's current EAV state into enkidb-datafile Data Files once, then serves HeptaScript queries with no journal replay on open and no full scan per query"

[dependencies]
bahyway-core    = { path = "../bahyway-core" }
bahyway-crc     = { path = "../bahyway-crc" }
akkvalue        = { path = "../akkvalue" }
enkidb-kaki     = { path = "../enkidb-kaki" }
enkidb-journal  = { path = "../enkidb-journal" }
enkidb-indexes  = { path = "../enkidb-indexes" }
enkidb-datafile = { path = "../enkidb-datafile" }
heptascript     = { path = "../heptascript" }
