[package]
name              = "kupru-vault"
version.workspace = true
edition.workspace = true
authors.workspace = true
description       = "Shared Sargon-vault open+authenticate logic, extracted so kupru-vault-cli and any future server-side authorizer call ONE real implementation instead of a third copy of anu_governor::web_auth's own logic."

[dependencies]
kupru       = { path = "../kupru" }
heptascript = { path = "../heptascript" }
serde       = { version = "1", features = ["derive"] }
serde_json  = { version = "1" }
hex         = { version = "0.4" }
