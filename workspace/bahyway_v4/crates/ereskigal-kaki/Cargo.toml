[package]
name        = "ereskigal-kaki"
version     = "0.1.0"
edition     = "2021"
description = "EREŠKIGAL Informal Settlement Intelligence — KAKI schema stub"

[dependencies]
uuid       = { version = "1", features = ["v4", "serde"] }
chrono     = { version = "0.4", features = ["serde"] }
serde      = { version = "1", features = ["derive"] }
thiserror  = "1"
tracing    = "0.1"

[lib]
name = "ereskigal_kaki"
path = "src/lib.rs"
