[package]
name        = "namtar-kaki"
version     = "0.1.0"
edition     = "2021"
description = "NAMTAR Sacred Burial Intelligence — KAKI schema stub (BC-NAMTAR-001)"

[dependencies]
uuid       = { version = "1", features = ["v4", "serde"] }
chrono     = { version = "0.4", features = ["serde"] }
serde      = { version = "1", features = ["derive"] }
thiserror  = "1"
tracing    = "0.1"

[lib]
name = "namtar_kaki"
path = "src/lib.rs"
