[package]
name        = "algebra-arsenal"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "𒁾 DUB.SAR — SUPERSEDED 2026-08-01. The Algebra Arsenal Index moved into bahyway-algebra::arsenal at the Architect's direct instruction to put ALL BahyWay mathematics in one central, named place. This crate is now a thin re-export of bahyway_algebra::arsenal plus the one piece that cannot move there (ammas-engine::markov -- ammas-engine already depends on bahyway-algebra, so pulling markov INTO bahyway-algebra would be circular). Kept per ADR-006 (no-delete); use bahyway-algebra directly in new code."

