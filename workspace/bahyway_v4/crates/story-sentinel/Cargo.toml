[package]
name        = "story-sentinel"
version     = "4.0.0"
edition     = "2021"
description = "BahyWay v4.0 — StoryEngine's alert bridge to the Data Steward Station: reuses the Enbilulu/Terru/Milu diagnosis pattern, scoped to ProjectedState."
authors     = ["DUB.SAR 𒁾 Bahaa Fadam"]

# story-engine cannot depend on alert-engine directly (alert-engine ->
# score-engine -> story-engine is already a path, which would cycle).
# This crate sits above both instead: it reads a story-engine
# ProjectedState and emits an alert-engine Alert.
[dependencies]
bahyway-core = { path = "../bahyway-core" }
story-engine = { path = "../story-engine" }
alert-engine = { path = "../alert-engine" }

[dev-dependencies]
enkidb-kaki = { path = "../enkidb-kaki" }

[lib]
name = "story_sentinel"
