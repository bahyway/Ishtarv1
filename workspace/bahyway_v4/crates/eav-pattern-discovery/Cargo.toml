[package]
name              = "eav-pattern-discovery"
version.workspace = true
edition.workspace = true
authors.workspace = true
description       = "Two-track EAV pattern-discovery engine for ETL station outcomes: Track A finds patterns in the 7 mandatory attributes' own values (via fuzzy-engine's real Mamdani membership functions), Track B finds SMD (Semantic Modeling for Data) attribute-name equivalences across an organization's departments. Mints discovered patterns as real EnkiMDB particles via enkimdb::PatternEmitter -- no separate store."

[dependencies]
bahyway-core   = { path = "../bahyway-core" }
enkidb-kaki    = { path = "../enkidb-kaki" }
fuzzy-engine   = { path = "../fuzzy-engine" }
nisaba         = { path = "../nisaba" }
enkimdb        = { path = "../enkimdb" }
