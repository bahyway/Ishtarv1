[package]
name              = "navi-photog-bridge"
version.workspace = true
edition.workspace = true
authors.workspace = true
description       = "Bridges photogrammetry-ingest point clouds into navi-engine's ParticleMap: georeferencing (UTM<->WGS84) plus grave-marker placement and candidate shortcut-path edges, so MachineRouter's existing A* can route between drone-surveyed graves. Does not reimplement structure-from-motion or routing -- both are real, existing engines this crate connects."

[dependencies]
bahyway-core           = { path = "../bahyway-core" }
photogrammetry-ingest  = { path = "../photogrammetry-ingest" }
navi-engine            = { path = "../navi-engine" }
