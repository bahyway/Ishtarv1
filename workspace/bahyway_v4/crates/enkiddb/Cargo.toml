[package]
name              = "enkiddb"
version.workspace = true
edition.workspace = true
authors.workspace = true
description       = "EnkiDDB — Documentation Database: BahyWay documents as KAKI-sealed EAV particles. CQRS: writenode (Journal, real WAL) + readnode (materialized Data Files, ADR-012)."

[dependencies]
bahyway-core     = { path = "../bahyway-core" }
enkidb-kaki      = { path = "../enkidb-kaki" }
enkidb-particles = { path = "../enkidb-particles" }
akkvalue         = { path = "../akkvalue" }
enkidb-journal   = { path = "../enkidb-journal" }
enkidb-ingest    = { path = "../enkidb-ingest" }
enkidb-readnode  = { path = "../enkidb-readnode" }
heptascript      = { path = "../heptascript" }
adapa-recall     = { path = "../adapa-recall" }
musaru-security  = { path = "../musaru-security" }
