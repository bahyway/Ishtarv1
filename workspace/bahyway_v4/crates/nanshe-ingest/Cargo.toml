[package]
name        = "nanshe-ingest"
version     = "0.1.0"
edition     = "2021"
description = "NANSHE — Diyala River environmental intelligence — NARAMSIN ingest entry (BC-ENV-001)"

[dependencies]
naramsin-bridge = { path = "../naramsin-bridge" }
naramsin-audit  = { path = "../naramsin-audit" }
uuid            = { version = "1", features = ["v4"] }
tracing         = "0.1"

[[bin]]
name = "nanshe-ingest"
path = "src/main.rs"

[lib]
name = "nanshe_ingest"
path = "src/lib.rs"
