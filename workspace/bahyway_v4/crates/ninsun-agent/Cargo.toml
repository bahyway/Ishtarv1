[package]
name        = "ninsun-agent"
version     = "0.1.0"
edition     = "2021"
description = "NINSUN Agent — Healer / Progressive Refiner (𒀭𒊩𒇻)"

[dependencies]
uuid       = { version = "1", features = ["v4", "serde"] }
chrono     = { version = "0.4", features = ["serde"] }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror  = "1"
tracing    = "0.1"

[lib]
name = "ninsun_agent"
path = "src/lib.rs"
