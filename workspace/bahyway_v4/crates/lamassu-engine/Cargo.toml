[package]
name        = "lamassu-engine"
version     = "4.0.0"
edition     = "2021"
description = "BahyWay v4.0 — LamassuEngine: the TDA sentinel. Samples orbital point clouds per Tribe and reads bahyway-algebra::persistence (GeoEngine) for GOLDEN/FUZZY/DEAD topological signatures. Never recomputes homology itself."
authors     = ["DUB.SAR 𒁾 Bahaa Fadam"]

# One internal dependency only. No external crates. No async.
# bahyway-algebra::persistence is the sole math-truth source (GeoEngine).
[dependencies]
bahyway-algebra = { path = "../bahyway-algebra" }

[lib]
name = "lamassu_engine"
