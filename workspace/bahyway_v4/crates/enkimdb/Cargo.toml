[package]
name              = "enkimdb"
version.workspace = true
edition.workspace = true
authors.workspace = true
description       = "EnkiMDB — Metadata Database: BahyWay's own crates, playbooks and services as KAKI-sealed EAV particles. CQRS: writenode (Journal, real WAL) + readnode (materialized Data Files, ADR-012)."

[dependencies]
bahyway-core     = { path = "../bahyway-core" }
enkidb-kaki      = { path = "../enkidb-kaki" }
enkidb-particles = { path = "../enkidb-particles" }
akkvalue         = { path = "../akkvalue" }
enkidb-journal   = { path = "../enkidb-journal" }
enkidb-ingest    = { path = "../enkidb-ingest" }
enkidb-readnode  = { path = "../enkidb-readnode" }
heptascript      = { path = "../heptascript" }
template-engine  = { path = "../template-engine" }
kupru            = { path = "../kupru" }
hex              = { version = "0.4" }
serde            = { version = "1", features = ["derive"] }
# Girsu IDE's "mark as final" KAKI generator (tablet.rs): real .akk
# structure via aaol::PmpvdParser, plus the hash for every tablet kind.
aaol             = { path = "../aaol" }
sha2             = { version = "0.10" }
# Pattern-KAKI particles (2026-07-31): patterns migrated from
# enki-pattern's own separate store into EnkiMDB, per the Architect's law
# ("no particle stays or evaluates outside the 7 Types EnkiDB"). nisaba
# supplies DiscoveredPattern; enki-pattern is reused ONLY for its pure
# StorageTier::from_age classification, never its own PatternRegistry
# store.
nisaba           = { path = "../nisaba" }
enki-pattern     = { path = "../enki-pattern" }
