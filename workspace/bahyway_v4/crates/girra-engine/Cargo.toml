[package]
name              = "girra-engine"
version.workspace = true
edition.workspace = true
authors.workspace = true
description       = "Sovereign pure-Rust monitoring dashboard -- the lamp of the ecosystem. From the iPhone-session PB-166 review ('NuskuEngine'), renamed: nusku-engine/nusku-score/nusku-fuzzy already exist and mean something else real (body-scan security-threat classification). Named for Girra, the Mesopotamian fire and light god -- same 'illuminator/observability as illumination' metaphor the original design intended."

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["wgpu", "x11", "wayland"] }
egui   = "0.29"

[[bin]]
name = "girra-dashboard"
path = "src/main.rs"
