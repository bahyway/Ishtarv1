[package]
name = "gula-advisory-verify"
version = "0.1.0"
edition = "2021"
description = "Client-side Ed25519 verification of GulaFederation sealed advisories."

[workspace]  # standalone crate -- not a member of the workspace/bahyway_v4 monorepo

[lib]
crate-type = ["rlib", "cdylib"]   # cdylib ready for GDExtension wrap

[dependencies]
ed25519-dalek = "2"
base64 = "0.22"
serde_json = "1"
