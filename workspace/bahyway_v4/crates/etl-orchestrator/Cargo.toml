[package]
name              = "etl-orchestrator"
version.workspace = true
edition.workspace = true
authors.workspace = true
description       = "Per-entry-point etl_schema + real batch/chunk movement across EnkiSDB/EnkiODB -- the Architect's named gap: 'these processes need an orchestration to let them move in the pipeline as batches or chunks,' not just individual per-record station calls or State-attribute polling. Does not reimplement bee-watchdog's file-format-specific DQ scoring chain (Musaru/VGCA/ZIP/adad-gate) -- that stays real, separate, already-built work."

[dependencies]
bahyway-core   = { path = "../bahyway-core" }
enkidb-kaki    = { path = "../enkidb-kaki" }
enkidb-journal = { path = "../enkidb-journal" }
enkisdb        = { path = "../enkisdb" }
enkiodb        = { path = "../enkiodb" }
