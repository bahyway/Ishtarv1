[package]
name              = "bahyway-web"
version.workspace = true
edition.workspace = true
authors.workspace = true
description       = "BahyWay sovereign website — HeptaScript Notebook + EnkiDB Live Pipeline (no WebGL)"

[lib]
name       = "bahyway_web"
crate-type = ["cdylib", "rlib"]

[[bin]]
name              = "bahyway-web"
path              = "src/main.rs"
required-features = ["native"]

[features]
native = []

[dependencies]
bahyway-core   = { path = "../bahyway-core" }
enkidb-kaki    = { path = "../enkidb-kaki" }
eridu-runtime  = { path = "../eridu-runtime" }
enkisdb     = { path = "../enkisdb" }
enkiodb     = { path = "../enkiodb" }
enkiqdb     = { path = "../enkiqdb" }
enkidb-journal = { path = "../enkidb-journal" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen         = "0.2"
wasm-bindgen-futures = "0.4"
js-sys               = "0.3"
web-sys = { version = "0.3", features = [
    "Window", "Performance",
    "Document", "Element", "HtmlElement",
    "HtmlCanvasElement", "HtmlTextAreaElement",
    "HtmlButtonElement", "HtmlInputElement", "HtmlSelectElement",
    "CanvasRenderingContext2d",
    "EventTarget", "MouseEvent", "InputEvent", "Event",
    "Node", "DomRect", "console",
    "Request", "Response", "Headers",
] }
