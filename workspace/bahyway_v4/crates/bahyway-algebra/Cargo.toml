[package]
name              = "bahyway-algebra"
version.workspace = true
edition.workspace = true
authors.workspace = true
description       = "BahyWay Unified Algebra (BUA) — Decode/Interpret/Evolve functors, topological operators, HOMT axioms, and Enbilulu Calculus. This is the crate the sealed concept documents call 'GeoEngine.'"

[dependencies]
bahyway-core     = { path = "../bahyway-core" }
enkidb-kaki      = { path = "../enkidb-kaki" }
alert-engine     = { path = "../alert-engine" }

# Absorbed from algebra-arsenal (2026-08-01): every math domain that does
# NOT already depend on bahyway-algebra itself -- pulling those in here
# would create a circular dependency (ammas-engine and homt-engine and
# compare-tribe-schema already depend on bahyway-algebra, so their math
# stays indexed one level up; see arsenal.rs's own doc comment).
bahyway-field    = { path = "../bahyway-field" }
kinetic-engine   = { path = "../kinetic-engine" }
hepta-score      = { path = "../hepta-score" }
najaf-engine     = { path = "../najaf-engine" }
ea-agent-algebra = { path = "../ea-agent-algebra" }
ea-agent-core    = { path = "../ea-agent-core" }
ea-agent-oracle  = { path = "../ea-agent-oracle" }
vgca-engine      = { path = "../vgca-engine" }
vgca-validation  = { path = "../vgca-validation" }
graph-engine     = { path = "../graph-engine" }
