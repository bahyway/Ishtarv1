[package]
name              = "navi-translate-gdext"
version.workspace = true
edition.workspace = true
authors.workspace = true
description       = "GDExtension bridge exposing navi-engine's Arabic/English EAV naming convention (ATTR_NAME/ATTR_NAME_ARABIC) + adapa-recall's TF-IDF/cosine retrieval, for DubSar IDE's AR-EN Navigator glossary plugin (Najaf/Baghdad navigation)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
navi-engine  = { path = "../navi-engine" }
adapa-recall = { path = "../adapa-recall" }
godot        = { version = "0.5", features = ["api-4-3"] }
