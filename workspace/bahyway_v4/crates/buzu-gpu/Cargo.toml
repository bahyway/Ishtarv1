[package]
name              = "buzu-gpu"
version.workspace = true
edition.workspace = true
authors.workspace = true
description       = "BUZU GPU path (GL-VIZ-001 follow-up): a wgpu compute shader that evaluates orbit positions from a sealed BuzuChunk, verified against buzu-core's tested CPU rotor and benchmarked for the real >1B particles/<1s condition. wgpu/bytemuck/pollster are already in this workspace's dependency graph via eframe -- no new external dependency class introduced."

[dependencies]
buzu-core = { path = "../buzu-core" }
wgpu      = "22"
pollster  = "0.3"
bytemuck  = { version = "1", features = ["derive"] }
