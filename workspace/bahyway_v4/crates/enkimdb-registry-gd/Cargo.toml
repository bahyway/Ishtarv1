[package]
name              = "enkimdb-registry-gd"
version.workspace = true
edition.workspace = true
authors.workspace = true
description       = "GDExtension bridge exposing enkimdb-registry's real workspace scan to Godot, for DubSar IDE's Engine Map tab -- the tool showing how every built engine/crate/playbook fits together"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
enkimdb-registry = { path = "../enkimdb-registry" }
godot             = { version = "0.5", features = ["api-4-3"] }
