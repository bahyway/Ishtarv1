[package]
name              = "kupru-gdext"
version.workspace = true
edition.workspace = true
authors.workspace = true
description       = "GDExtension bridge exposing kupru's real sovereign crypto (Argon2id, Ed25519, Shamir M-of-N) to Godot"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
kupru      = { path = "../kupru" }
godot      = { version = "0.5", features = ["api-4-3"] }
serde_json = { version = "1" }
sha3       = { version = "0.10" }
