[package]
name              = "marduk-gdext"
version.workspace = true
edition.workspace = true
authors.workspace = true
description       = "GDExtension bridge exposing MardukEngine's implemented verbs (Position, Horizon, Topology) to Godot -- DubSar Theater's Marduk panel."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
godot        = { version = "0.5", features = ["api-4-3"] }
marduk-engine = { path = "../marduk-engine" }
