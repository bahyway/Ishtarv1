[package]
name              = "enki-meta-doc-bridge"
version.workspace = true
edition.workspace = true
authors.workspace = true
description       = "Read-time bridge from a Golden/Warehouse particle's own tribe to its related EnkiMDB metadata and EnkiDDB documentation entries -- a LINK, never a copy. No data is written to EnkiDB/EnkiDW; this only resolves what already exists under a shared TribeId."

[dependencies]
bahyway-core   = { path = "../bahyway-core" }
enkidb-kaki    = { path = "../enkidb-kaki" }
enkidb-journal = { path = "../enkidb-journal" }
