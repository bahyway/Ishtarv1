[package]
name              = "naming-registry-gd"
version.workspace = true
edition.workspace = true
authors.workspace = true
description       = "GDExtension bridge exposing naming-registry's Akkadian/Sumerian name catalog to Godot -- DubSar Theater's Glossary tab."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
naming-registry = { path = "../naming-registry" }
godot            = { version = "0.5", features = ["api-4-3"] }
