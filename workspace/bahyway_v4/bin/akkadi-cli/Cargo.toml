[package]
name              = "akkadi-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
description       = "akkadi — sovereign CLI + notebook for BahyWay.Ecosystem"

[[bin]]
name = "akkadi"
path = "src/main.rs"

[dependencies]
aaol     = { path = "../../crates/aaol" }
akkadi   = { path = "../../crates/akkadi" }

serde        = { version = "1",    features = ["derive"] }
serde_json   = { version = "1" }
uuid         = { version = "1",    features = ["v4"] }
chrono       = { version = "0.4",  features = ["serde"] }
dirs         = { version = "5" }
toml         = { version = "0.8" }
ureq         = { version = "2" }

[features]
wasm = ["wasm-bindgen"]

[dependencies.wasm-bindgen]
version  = "0.2"
optional = true
