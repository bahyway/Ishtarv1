[package]
name              = "najaf-gen"
version.workspace = true
edition.workspace = true
authors.workspace = true
description       = "Generates real, scale-testable synthetic Wadi Al-Salaam civil-registry CSV/TSV data (and optionally STORE-zips it via enkidw::zip_engine) for EnkiDW LandingZone/EtlPipeline load testing at 100M/1B-row scale."

[[bin]]
name = "najaf-gen"
path = "src/main.rs"

[dependencies]
enkidw = { path = "../../crates/enkidw" }

[dev-dependencies]
enkidb-kaki  = { path = "../../crates/enkidb-kaki" }
bahyway-core = { path = "../../crates/bahyway-core" }
