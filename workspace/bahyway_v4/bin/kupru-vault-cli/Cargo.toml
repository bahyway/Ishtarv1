[package]
name              = "kupru-vault-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
description       = "Shell/Ansible-callable Sargon vault identity check -- decrypts a vault, verifies the strongest passport's seal, gates on minimum privilege_level. Same vault format shakkanakku-web's login already opens."

[[bin]]
name = "kupru-vault-cli"
path = "src/main.rs"

[dependencies]
kupru-vault = { path = "../../crates/kupru-vault" }
