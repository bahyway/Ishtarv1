[package]
name              = "enkimdb-write-server"
version.workspace = true
edition.workspace = true
authors.workspace = true
description       = "EnkiMDB (Euphrates) Write Node — sovereign TCP catalog server. Scans workspace crates/playbooks, journals them, periodic materialize to Data Files."

[[bin]]
name = "enkimdb-write-server"
path = "src/main.rs"

[dependencies]
bahyway-core = { path = "../../crates/bahyway-core" }
enkidb-kaki  = { path = "../../crates/enkidb-kaki" }
enkimdb      = { path = "../../crates/enkimdb" }
serde_json   = { version = "1" }
