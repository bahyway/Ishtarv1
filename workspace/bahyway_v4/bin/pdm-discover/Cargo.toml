[package]
name              = "pdm-discover"
version.workspace = true
edition.workspace = true
authors.workspace = true
description       = "CLI front end for pdm-discovery: takes one CSV file per table, runs the v1 join-key detection + clique-complex-persistence pipeline, and prints the discovered-schema proposal as JSON — the interface DubSar PDM's Conceptual/Logical tabs are meant to eventually call into."

[[bin]]
name = "pdm-discover"
path = "src/main.rs"

[dependencies]
pdm-discovery = { path = "../../crates/pdm-discovery" }
