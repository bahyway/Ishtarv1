[package]
name              = "enkiddb-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
description       = "EnkiDDB CLI — local directory-ingest bulk loader: scan, categorize, run (with the git-based team-authorship gate)."

[[bin]]
name = "enkiddb-cli"
