[package]
name              = "dubsar"
version.workspace = true
edition.workspace = true
authors.workspace = true
description       = "DubSar IDE — BahyWay v4.0 sovereign terminal environment"

[[bin]]
name = "dubsar"
path = "src/main.rs"

[dependencies]
bahyway-core      = { path = "../../crates/bahyway-core" }
enkidb-engine     = { path = "../../crates/enkidb-engine" }
enkidb-persist    = { path = "../../crates/enkidb-persist" }
enkidb-storage    = { path = "../../crates/enkidb-storage" }
enkidb-query      = { path = "../../crates/enkidb-query" }
enkidb-kaki       = { path = "../../crates/enkidb-kaki" }
adad-gate         = { path = "../../crates/adad-gate" }
musaru-security   = { path = "../../crates/musaru-security" }
vgca-validation   = { path = "../../crates/vgca-validation" }
permanent-storage = { path = "../../crates/permanent-storage" }
template-library  = { path = "../../crates/template-library" }
template-engine   = { path = "../../crates/template-engine" }
story-engine      = { path = "../../crates/story-engine" }
score-engine      = { path = "../../crates/score-engine" }
dubsar-ide        = { path = "../../crates/dubsar-ide" }
dubsar-visualizer    = { path = "../../crates/dubsar-visualizer" }
