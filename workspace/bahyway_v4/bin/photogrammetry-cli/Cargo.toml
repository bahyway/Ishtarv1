[package]
name              = "photogrammetry-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
description       = "CLI front end for photogrammetry-ingest: parse a point-cloud file, run an external SfM engine, or detect voids (missing survey data) -- the interface Girsu IDE's VS Code tasks call into."

[[bin]]
name = "photogrammetry-cli"
path = "src/main.rs"

[dependencies]
photogrammetry-ingest = { path = "../../crates/photogrammetry-ingest" }
