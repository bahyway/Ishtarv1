[package]
name              = "enkiddb-asset-server"
version.workspace = true
edition.workspace = true
authors.workspace = true
description       = "Central Shared Asset Storage — pure-Rust, read-only HTTP server for the physical files (markdown, scripts, images) shared by EnkiDDB's Write and Read nodes. No MinIO, no NFS, no external service: this is the one job (serve a known file by path) owned outright, in keeping with the sovereign/zero-external-dependency axiom."

[[bin]]
name = "enkiddb-asset-server"
path = "src/main.rs"

[dependencies]
