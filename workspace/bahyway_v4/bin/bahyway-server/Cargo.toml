[package]
name              = "bahyway-server"
version.workspace = true
edition.workspace = true
authors.workspace = true
description       = "Main BahyWay daemon"

[[bin]]
name = "bahyway-server"
path = "src/main.rs"

[dependencies]
bahyway-core     = { path = "../../crates/bahyway-core" }
enkidb-engine    = { path = "../../crates/enkidb-engine" }
eridu-runtime    = { path = "../../crates/eridu-runtime" }
eridu-scheduler  = { path = "../../crates/eridu-scheduler" }
eridu-supervisor = { path = "../../crates/eridu-supervisor" }
snapshot-job     = { path = "../../crates/snapshot-job" }
