[package]
name              = "enkidw-write-server"
version.workspace = true
edition.workspace = true
authors.workspace = true
description       = "EnkiDW Data Warehouse Write Node — sovereign TCP daemon wrapping the real EtlPipeline (LandingZone -> PersistedDb), periodically materializing into Data Files for enkidw-read-server."

[[bin]]
name = "enkidw-write-server"
path = "src/main.rs"

[dependencies]
bahyway-core     = { path = "../../crates/bahyway-core" }
enkidb-storage   = { path = "../../crates/enkidb-storage" }
enkidb-readnode  = { path = "../../crates/enkidb-readnode" }
enkidw           = { path = "../../crates/enkidw" }
