[package]
name              = "enkisdb-write-server"
version.workspace = true
edition.workspace = true
authors.workspace = true
description       = "EnkiSDB Stage pipeline daemon — LandingZone ingest + ValidationSweep, draining Promoted/Quarantined particles into EnkiODB/EnkiQDB in the same process (real Journals, no JSON on the wire)."

[[bin]]
name = "enkisdb-write-server"
path = "src/main.rs"

[dependencies]
bahyway-core    = { path = "../../crates/bahyway-core" }
enkidb-kaki     = { path = "../../crates/enkidb-kaki" }
enkidb-journal  = { path = "../../crates/enkidb-journal" }
enkidb-readnode = { path = "../../crates/enkidb-readnode" }
enkisdb         = { path = "../../crates/enkisdb" }
enkiodb         = { path = "../../crates/enkiodb" }
enkiqdb         = { path = "../../crates/enkiqdb" }
