[package]
name              = "enkidb-query-server"
version.workspace = true
edition.workspace = true
authors.workspace = true
description       = "Sovereign TCP query server — HeptaScript over enkidb-persist journal"

[[bin]]
name = "enkidb-query-server"
path = "src/main.rs"

[dependencies]
bahyway-core    = { path = "../../crates/bahyway-core" }
bahyway-algebra = { path = "../../crates/bahyway-algebra" }
enkidb-persist  = { path = "../../crates/enkidb-persist" }
enkidb-storage  = { path = "../../crates/enkidb-storage" }
heptascript     = { path = "../../crates/heptascript" }
akkvalue        = { path = "../../crates/akkvalue" }

[dev-dependencies]
enkidb-kaki     = { path = "../../crates/enkidb-kaki" }
enkidb-journal  = { path = "../../crates/enkidb-journal" }
bahyway-crc     = { path = "../../crates/bahyway-crc" }
