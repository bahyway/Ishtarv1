[package]
name              = "girsu-mint"
version.workspace = true
edition.workspace = true
authors.workspace = true
description       = "Girsu IDE's 'mark as final' KAKI generator: mints a real Identity-Kaki for a .akk/.way/.tmpl tablet, journals it into EnkiMDB, and materializes it into a real, HeptaScript-queryable Euphrates generation."

[[bin]]
name = "girsu-mint"
path = "src/main.rs"

[dependencies]
bahyway-core    = { path = "../../crates/bahyway-core" }
enkidb-kaki     = { path = "../../crates/enkidb-kaki" }
enkimdb         = { path = "../../crates/enkimdb" }
chrono          = { version = "0.4", default-features = false, features = ["clock"] }
serde           = { version = "1", features = ["derive"] }
serde_json      = { version = "1" }
hex             = { version = "0.4" }

