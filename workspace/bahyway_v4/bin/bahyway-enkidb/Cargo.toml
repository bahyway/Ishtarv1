[package]
name              = "bahyway-enkidb"
version.workspace = true
edition.workspace = true
authors.workspace = true
description       = "bahyway-enkidb -- real local KAKI-orbit CLI for the seven EnkiDB Types (present/orbit/prove/trace/clone-tribe/decree/rehearse/segment-policy/splits/snapshots)"

[[bin]]
name = "bahyway-enkidb"
path = "src/main.rs"

[dependencies]
enkidb-kaki           = { path = "../../crates/enkidb-kaki" }
enkidb-particle-store = { path = "../../crates/enkidb-particle-store" }
serde_json            = "1"
