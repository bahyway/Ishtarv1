<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="BahyWay — Sovereign Ecosystem v4.0. The Way of Sovereignty. Coming soon.">
  <title>BahyWay — BahyWay Ecosystem v4.0</title>
  <style>
    /* =====================================================================
       BahyWay Ecosystem v4.0 — GitHub Pages "Under Construction"
       BahyWay | bahyway.com
       Standalone: all CSS and JS inlined — no external dependencies.
       ===================================================================== */

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-deep:    #040d20;
      --bg-mid:     #080f2d;
      --gold:       #f5c518;
      --glow:       #ffd700;
      --gold-dim:   #c9a227;
      --text-dim:   #8899aa;
      --text-faint: #4a5a6a;
      --bar-track:  #0d1a30;
    }

    html, body {
      width: 100%;
      min-height: 100vh;
      background: radial-gradient(ellipse at 50% 30%, var(--bg-mid) 0%, var(--bg-deep) 100%);
      color: var(--gold);
      font-family: 'Courier New', Courier, monospace;
      overflow-x: hidden;
    }

    /* Stars */
    #stars { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
    .star {
      position: absolute;
      background: #fff;
      border-radius: 50%;
      opacity: 0;
      animation: twinkle var(--dur, 3s) var(--delay, 0s) infinite ease-in-out;
    }
    @keyframes twinkle {
      0%, 100% { opacity: var(--lo, 0.1); }
      50%       { opacity: var(--hi, 0.7); }
    }

    /* Scene */
    #scene {
      position: relative; z-index: 1;
      min-height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 40px 20px 60px;
      text-align: center;
    }

    /* Logo */
    #logo-wrap {
      position: relative;
      width: 220px; height: 220px;
      margin-bottom: 32px;
    }
    #logo-wrap svg {
      width: 100%; height: 100%;
      filter: drop-shadow(0 0 18px rgba(255,215,0,0.55));
      animation: logo-pulse 4s ease-in-out infinite;
    }
    @keyframes logo-pulse {
      0%, 100% { filter: drop-shadow(0 0 16px rgba(255,215,0,0.5)); }
      50%       { filter: drop-shadow(0 0 32px rgba(255,215,0,0.85)); }
    }

    /* Orbit rings */
    .orbit-ring {
      position: absolute; border-radius: 50%;
      border: 1px solid rgba(245,197,24,0.12);
      top: 50%; left: 50%;
      transform: translate(-50%,-50%);
      animation: orbit-spin var(--ospeed, 20s) linear infinite;
    }
    @keyframes orbit-spin {
      from { transform: translate(-50%,-50%) rotate(0deg); }
      to   { transform: translate(-50%,-50%) rotate(360deg); }
    }
    .orbit-dot {
      position: absolute;
      width: 5px; height: 5px; border-radius: 50%;
      background: var(--gold);
      top: -2.5px; left: calc(50% - 2.5px);
      opacity: 0.7;
    }

    /* Text */
    #ecosystem-label {
      font-size: 11px; letter-spacing: 4px;
      color: var(--text-dim); text-transform: uppercase;
      margin-bottom: 10px;
    }
    #site-title {
      font-family: Georgia, 'Times New Roman', serif;
      font-size: clamp(38px, 8vw, 64px);
      font-weight: 400; color: var(--gold);
      letter-spacing: 2px; line-height: 1.1;
      text-shadow: 0 0 30px rgba(255,215,0,0.4);
      margin-bottom: 10px;
    }
    #site-subtitle {
      font-size: clamp(13px, 2.5vw, 16px);
      color: var(--gold-dim); letter-spacing: 1px;
      margin-bottom: 8px;
    }
    #site-tag {
      display: inline-block; font-size: 11px; letter-spacing: 2px;
      color: var(--text-dim);
      border: 1px solid rgba(245,197,24,0.25);
      padding: 4px 14px; border-radius: 3px;
      margin-bottom: 28px;
    }
    #tagline {
      font-size: clamp(12px, 2vw, 15px);
      color: var(--text-dim); font-style: italic;
      margin-bottom: 40px; max-width: 480px;
    }

    /* Progress bar */
    #progress-wrap { width: 100%; max-width: 400px; }
    #progress-label {
      font-size: 10px; letter-spacing: 3px;
      color: var(--text-faint); margin-bottom: 8px;
      text-transform: uppercase;
    }
    #progress-track {
      width: 100%; height: 3px;
      background: var(--bar-track);
      border-radius: 2px; overflow: hidden;
    }
    #progress-fill {
      height: 100%; width: 0%; border-radius: 2px;
      background: linear-gradient(90deg, var(--gold-dim), var(--glow));
      animation: progress-grow 3.5s cubic-bezier(0.4,0,0.2,1) forwards,
                 progress-pulse 2.5s 3.5s ease-in-out infinite;
      box-shadow: 0 0 8px rgba(255,215,0,0.6);
    }
    @keyframes progress-grow {
      0%   { width: 0%;  }
      60%  { width: 65%; }
      80%  { width: 68%; }
      100% { width: 66%; }
    }
    @keyframes progress-pulse {
      0%, 100% { opacity: 1;   box-shadow: 0 0 8px  rgba(255,215,0,0.6); }
      50%       { opacity: 0.6; box-shadow: 0 0 16px rgba(255,215,0,0.9); }
    }

    #footer-note {
      margin-top: 36px; font-size: 11px;
      color: var(--text-faint); letter-spacing: 1px;
    }

    @media (max-width: 480px) {
      #logo-wrap { width: 180px; height: 180px; }
    }
  </style>
</head>
<body>

  <!-- Star field (populated by JS below) -->
  <div id="stars"></div>

  <div id="scene">

    <!-- Heptagonal logo -->
    <div id="logo-wrap">

      <!-- Decorative orbit rings -->
      <div class="orbit-ring" style="width:260px;height:260px;--ospeed:28s;">
        <div class="orbit-dot"></div>
      </div>
      <div class="orbit-ring" style="width:300px;height:300px;--ospeed:42s;animation-direction:reverse;">
        <div class="orbit-dot" style="opacity:0.4;background:#8899aa;"></div>
      </div>

      <!-- Inline SVG heptagram — viewBox 400×400, center (200,200), r=160 -->
      <svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" aria-label="BahyWay Heptagram">
        <defs>
          <filter id="glow-filter" x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
          <filter id="glow-strong" x="-60%" y="-60%" width="220%" height="220%">
            <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur"/>
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>

        <!-- Outer halo circle -->
        <circle cx="200" cy="200" r="168" fill="none"
                stroke="rgba(245,197,24,0.08)" stroke-width="1"/>
        <circle cx="200" cy="200" r="145" fill="none"
                stroke="rgba(245,197,24,0.05)" stroke-width="1"/>

        <!-- Skip-2 heptagram: vertices 0→2→4→6→1→3→5→0 -->
        <!-- v0(200,40) v2(355.99,235.60) v4(130.58,344.16) v6(74.91,100.24)
             v1(325.09,100.24) v3(269.42,344.16) v5(44.01,235.60) back to v0 -->
        <polygon
          points="200.00,40.00 355.99,235.60 130.58,344.16 74.91,100.24 325.09,100.24 269.42,344.16 44.01,235.60"
          fill="rgba(245,197,24,0.07)"
          stroke="#f5c518"
          stroke-width="1.8"
          stroke-linejoin="round"
          filter="url(#glow-filter)"
          opacity="0.85"/>

        <!-- Vertex dots -->
        <circle cx="200.00" cy="40.00"  r="4" fill="#ffd700" filter="url(#glow-filter)"/>
        <circle cx="325.09" cy="100.24" r="4" fill="#ffd700" filter="url(#glow-filter)"/>
        <circle cx="355.99" cy="235.60" r="4" fill="#ffd700" filter="url(#glow-filter)"/>
        <circle cx="269.42" cy="344.16" r="4" fill="#ffd700" filter="url(#glow-filter)"/>
        <circle cx="130.58" cy="344.16" r="4" fill="#ffd700" filter="url(#glow-filter)"/>
        <circle cx="44.01"  cy="235.60" r="4" fill="#ffd700" filter="url(#glow-filter)"/>
        <circle cx="74.91"  cy="100.24" r="4" fill="#ffd700" filter="url(#glow-filter)"/>

        <!-- Center point -->
        <circle cx="200" cy="200" r="5" fill="#f5c518" filter="url(#glow-strong)" opacity="0.9"/>

        <!-- Physics constant labels at each vertex (r≈185 from center) -->
        <!-- v0 top: ℏ -->
        <text x="200.00" y="15.00" text-anchor="middle" dominant-baseline="hanging"
              font-family="Georgia, serif" font-size="13" fill="#f5c518" opacity="0.9">&#x210F;</text>
        <!-- v1 upper-right: k_B -->
        <text x="349.64" y="77.65" text-anchor="start" dominant-baseline="middle"
              font-family="Georgia, serif" font-size="11" fill="#f5c518" opacity="0.9">k&#x2082;</text>
        <!-- v2 lower-right: G -->
        <text x="385.36" y="241.17" text-anchor="start" dominant-baseline="middle"
              font-family="Georgia, serif" font-size="13" fill="#f5c518" opacity="0.9">G</text>
        <!-- v3 lower-right-bottom: e -->
        <text x="283.27" y="371.68" text-anchor="middle" dominant-baseline="auto"
              font-family="Georgia, serif" font-size="13" fill="#f5c518" opacity="0.9">e</text>
        <!-- v4 lower-left-bottom: π -->
        <text x="116.73" y="371.68" text-anchor="middle" dominant-baseline="auto"
              font-family="Georgia, serif" font-size="13" fill="#f5c518" opacity="0.9">&#x3C0;</text>
        <!-- v5 lower-left: c -->
        <text x="14.64" y="241.17" text-anchor="end" dominant-baseline="middle"
              font-family="Georgia, serif" font-size="13" fill="#f5c518" opacity="0.9">c</text>
        <!-- v6 upper-left: 1 -->
        <text x="50.36" y="77.65" text-anchor="end" dominant-baseline="middle"
              font-family="Georgia, serif" font-size="13" fill="#f5c518" opacity="0.9">1</text>
      </svg>
    </div><!-- /#logo-wrap -->

    <div id="ecosystem-label">BahyWay Ecosystem</div>
    <div id="site-title">BahyWay</div>
    <div id="site-subtitle">Sovereign Ecosystem v4.0</div>
    <div id="site-tag">The Way of Sovereignty</div>
    <div id="tagline">Seven pillars. One ecosystem. Sovereign by design.</div>

    <div id="progress-wrap">
      <div id="progress-label">Initializing Systems</div>
      <div id="progress-track">
        <div id="progress-fill"></div>
      </div>
    </div>

    <div id="footer-note">bahyway.com &mdash; BahyWay Ecosystem v4.0</div>
  </div><!-- /#scene -->

  <script>
    /* ── Star field ─────────────────────────────────────── */
    (function() {
      var container = document.getElementById('stars');
      var count = 150;
      var frag = document.createDocumentFragment();
      for (var i = 0; i < count; i++) {
        var s = document.createElement('div');
        s.className = 'star';
        var size = Math.random() < 0.7 ? 1 : (Math.random() < 0.6 ? 2 : 3);
        var x = Math.random() * 100;
        var y = Math.random() * 100;
        var dur = (2 + Math.random() * 4).toFixed(2);
        var delay = (Math.random() * 6).toFixed(2);
        var lo = (0.05 + Math.random() * 0.15).toFixed(2);
        var hi = (0.4 + Math.random() * 0.6).toFixed(2);
        s.style.cssText = [
          'width:'  + size + 'px',
          'height:' + size + 'px',
          'left:'   + x + '%',
          'top:'    + y + '%',
          '--dur:'   + dur   + 's',
          '--delay:' + delay + 's',
          '--lo:'    + lo,
          '--hi:'    + hi
        ].join(';');
        frag.appendChild(s);
      }
      container.appendChild(frag);
    })();
  </script>
</body>
</html>
