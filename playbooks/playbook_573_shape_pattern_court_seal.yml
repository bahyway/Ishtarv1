# =============================================================================
# PB-573 — The Shape & Pattern Court: Concept Seal (GL-DST-004)
# BahyWay.Ecosystem v4.0 — 2026-08-21
#
# WHY THIS PLAYBOOK EXISTS
#   Seals GL-DST-004, the Bell Veto: a tab in DubSar PDM (never a
#   second IDE, never a Theater or Girsu tab, because only PDM holds
#   the custody verbs correct/approve/release). While MARKASU or RIGMU
#   is active on a tribe -- while its nabalkutu register is non-empty
#   -- approval of its Data Shape and release into KAKIv4.0 are
#   PROHIBITED regardless of Data Steward signature. The approve/
#   release controls are physically disabled, not warned. The Loss-
#   Explanation Clause requires a W5H2 explanation particle before
#   approval for any Curve Loss or Census Loss, lawful or not. The
#   only door through the veto is a Madanu decree bearing the
#   Architect's CSR-08 seal, journaled with the dissenting bell state
#   and its tau cost -- never silent.
#
#   Landed from a parallel Claude session's Sun20260816 thread,
#   evaluated file-by-file against this repo before landing and
#   RENUMBERED per this repo's standing rule: the other session's own
#   PB-334 -> PB-573 here. See
#   shala-prototypes/batch13_sunday_shape_labiru_courts/README.md for
#   the full renumbering table and the materialization-pattern note
#   (this playbook does not replicate the source's Ansible-copy
#   kernel-writing style).
#
# WHAT THIS PLAYBOOK DOES
#   PROVEs the tablet's own four stated law tests (L13-L16, continuing
#   the GL-DST-004/GL-NSR-001-A1 shared numbering) are present, PROVEs
#   the Bell Veto and Loss-Explanation clauses are sealed verbatim, and
#   PROVEs the Sala court renders the physically-disabled approve
#   control and both named harms. Deposits nothing new -- docs and
#   Sala tab are committed directly into docs/ and shala-prototypes/,
#   this playbook is a pointer/verification record.
#
# Running this playbook = CSR-08 confirmation. Review -> --check -> live.
# =============================================================================

- name: "PB-573 | Seal the Shape & Pattern Court (GL-DST-004)"
  hosts: localhost
  connection: local
  become: false
  vars:
    repo_root: "{{ playbook_dir }}/.."
    tablet_file: "{{ repo_root }}/docs/09_observatory/GL-DST-004_Shape_Pattern_Court.md"
    court_file: "{{ repo_root }}/shala-prototypes/batch13_sunday_shape_labiru_courts/shala_shape_pattern_court.html"

  tasks:

    - name: "0.1 | Confirm the tablet and the Sala court are landed"
      ansible.builtin.stat:
        path: "{{ item }}"
      register: land_stat
      loop:
        - "{{ tablet_file }}"
        - "{{ court_file }}"
      loop_control: { label: "{{ item }}" }

    - name: "FAIL | required file missing"
      ansible.builtin.fail:
        msg: "{{ item.item }} not found -- nothing to seal."
      loop: "{{ land_stat.results }}"
      loop_control: { label: "{{ item.item }}" }
      when: not item.stat.exists

    - name: "1.1 | PROVE the Bell Veto is sealed verbatim, including the physical-disable clause"
      ansible.builtin.shell: |
        set -e
        grep -qF "approval of its Data Shape (SC, Simplicial Complexity class) and release into version KAKIv4.0 are PROHIBITED" "{{ tablet_file }}"
        grep -qF "physically disabled" "{{ tablet_file }}"
        grep -qF "The bell outranks the seal; only the court outranks the bell" "{{ tablet_file }}"
        echo "PROVEN: the Bell Veto clause and the physically-disabled (not warned) approve/release rule are sealed"
      register: prove_veto
      changed_when: false

    - name: "1.2 | PROVE the Loss-Explanation Clause and the no-silent-override path are sealed"
      ansible.builtin.shell: |
        set -e
        grep -qF "Loss-Explanation Clause" "{{ tablet_file }}"
        grep -qF "Madanu decree bearing the Architect's seal (CSR-08)" "{{ tablet_file }}"
        grep -qF "no administrative override, no steward escalation, no quiet path" "{{ tablet_file }}"
        echo "PROVEN: unexplained loss vetoes even with silent bells, and the override path is never silent"
      register: prove_loss
      changed_when: false

    - name: "1.3 | PROVE the Sala court renders the physically-dead approve control and both named harms"
      ansible.builtin.shell: |
        set -e
        grep -qF "nabalkutu" "{{ court_file }}"
        grep -qF "CURVE LOSS" "{{ court_file }}"
        grep -qF "CENSUS LOSS" "{{ court_file }}"
        grep -qF "MADANU" "{{ court_file }}"
        echo "PROVEN: the court stages the nabalkutu register, both named harms, and the Madanu decree row"
      register: prove_court
      changed_when: false

    - name: "2.1 | Report"
      ansible.builtin.debug:
        msg: >
          PB-573 complete. GL-DST-004 sealed: the placement decree
          (governance sits only where custody verbs live -- DubSar
          PDM), the three-instrument bench (Shape Reader / Lattice /
          Mint with its Minting Stability Gate), the two named harms
          (Curve Loss, Census Loss), the nabalkutu register, and the
          Bell Veto itself -- approve/release physically disabled
          while bells ring, unexplained loss vetoes regardless of
          signature, override only via a journaled Madanu decree --
          all hold. The Sala court renders the physically-dead approve
          button, both harm panels, and the decree row. Renumbered
          from the source session's PB-334; see
          shala-prototypes/batch13_sunday_shape_labiru_courts/README.md
          for the full renumbering table.
