# =============================================================================
# PB-243 -- Puhu Law: TOP Algebra & nucleus-exchange invariance
# (docs/01_mathematics/PH-002_Puhu_Law.md). BahyWay.Ecosystem v4.0 -- 2026-07-25
#
# WHY THIS SUPERSEDES THE EARLIER PB-178 DRAFT: the draft's Corollary 1
# ("nucleus-exchange invariance") had no real evidence behind it --
# the massartu-core test suite it would have cited only ever drove
# identical hardcoded kappa data through different exposure values
# (see playbook_242 / docs/07_file_formats/SPEC-MAS-001.md). This playbook depends on
# playbook_242 having already landed and passed: PH-002's Corollary 1
# now cites a real test
# (massartu-core::tests::nucleus_exchange::
# same_watch_cycle_drives_a_real_physics_nucleus_and_a_manual_one)
# that drives the identical watch_cycle against a real-physics
# electricity nucleus and a generic/manual nucleus with no dedicated
# engine, and states plainly what that evidence does and does not
# establish (two nuclei, not a formal proof over all possible future
# nuclei). PH-002 also corrects an honesty gap in how PH-001 was
# being cited: no standalone docs/PH-001.md exists in this repo as of
# this build, only a verification record
# (docs/13_changelog/BATCH5_RM001_RM002_PBCOLLECTIONS_PH001_VERIFIED_2026-07-07.md)
# -- PH-002 cites that record directly rather than pointing at a
# first-party tablet that doesn't exist yet.
#
# GOVERNING LAW NOTICE: Gated behind PB-160 completion law AND
# playbook_242 (Corollary 1's cited test must exist and pass before
# this law can honestly be sealed). Running this playbook = CSR-08
# Architect confirmation of the Puhu Law text.
#
# USAGE (run from eriduous-vdi, inside a checkout of this repo, after
# `git pull origin claude/iphone-playbooks-crosstribe-eval-nbc5sw`,
# and AFTER playbook_242 has been run successfully):
#   ansible-playbook playbooks/playbook_243_puhu_law_top_algebra.yml
# =============================================================================

- name: "PB-243 -- Puhu Law: TOP Algebra & nucleus-exchange invariance"
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    repo_root: "{{ playbook_dir }}/../workspace/bahyway_v4"
    law_path: "{{ playbook_dir }}/../docs/01_mathematics/PH-002_Puhu_Law.md"
    spec_path: "{{ playbook_dir }}/../docs/07_file_formats/SPEC-MAS-001.md"

  tasks:
    - name: "Confirm the Puhu Law tablet and its dependency spec are present (committed source, not authored here)"
      ansible.builtin.stat:
        path: "{{ item }}"
      register: file_checks
      loop:
        - "{{ law_path }}"
        - "{{ spec_path }}"
        - "{{ repo_root }}/crates/massartu-core/src/lib.rs"

    - name: "Fail clearly if any expected file is missing"
      ansible.builtin.fail:
        msg: >-
          {{ item.item }} not found. Run
          `git pull origin claude/iphone-playbooks-crosstribe-eval-nbc5sw`
          first -- these are committed source, this playbook only
          verifies and re-proves them.
      loop: "{{ file_checks.results }}"
      when: not item.stat.exists

    - name: "Re-run Corollary 1's cited evidence -- the nucleus-exchange proof test must pass NOW, not just at playbook_242 time"
      ansible.builtin.shell: >-
        cd {{ repo_root }} &&
        cargo test --release -p massartu-core nucleus_exchange > /tmp/pb243_test.log 2>&1
      register: proof_test_result
      failed_when: proof_test_result.rc != 0

    - name: "Fail clearly if Corollary 1's evidence does not actually hold on this machine"
      ansible.builtin.fail:
        msg: >-
          PH-002 Corollary 1 cites
          massartu-core::tests::nucleus_exchange::
          same_watch_cycle_drives_a_real_physics_nucleus_and_a_manual_one
          as its evidence -- that test just failed on this host
          (rc={{ proof_test_result.rc }}), so this law cannot be
          honestly sealed here. Full output: /tmp/pb243_test.log
      when: proof_test_result.rc is defined and proof_test_result.rc != 0

    - name: "Slurp the law tablet to confirm its core claims are present"
      ansible.builtin.slurp:
        src: "{{ law_path }}"
      register: law_contents

    - name: "Fail clearly if the tablet is missing a load-bearing section"
      ansible.builtin.fail:
        msg: >-
          docs/01_mathematics/PH-002_Puhu_Law.md is missing the "{{ item }}" marker
          expected in the sealed Puhu Law text. Re-run
          `git pull origin claude/iphone-playbooks-crosstribe-eval-nbc5sw`
          and confirm the branch is up to date.
      loop:
        - "TOP Algebra"
        - "Nucleus-Exchange Invariance"
        - "šar pūḫi"
        - "Honest Limits"
        - "PH-001"
      when: item not in (law_contents.content | b64decode)

    - name: "Report"
      ansible.builtin.debug:
        msg: >-
          PB-243 complete -- docs/01_mathematics/PH-002_Puhu_Law.md (TOP Algebra:
          Tribe + Orbit + Particle; "the Tribe is the throne, not the
          king") is sealed with its Corollary 1 (nucleus-exchange
          invariance) backed by a real test that was re-run and passed
          on this host, not merely cited from an earlier build. The
          law's honest-limits section stands: this is empirical
          evidence from two nuclei, not a formal proof over all
          possible future nuclei, and no King-plot residual classifier
          exists anywhere in this ecosystem yet. PH-001's real content
          is cited via its verification record
          (docs/13_changelog/BATCH5_RM001_RM002_PBCOLLECTIONS_PH001_VERIFIED_2026-07-07.md)
          since no standalone docs/PH-001.md exists in this repo --
          flagged as an open follow-on item, not silently glossed
          over. This closes the playbook_241/242/243 sequence for the
          four newly-evaluated documents.
