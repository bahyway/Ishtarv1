# =============================================================================
# PB-601 — The Lišānu Law: Concept Seal (GL-LSN-001)
# BahyWay.Ecosystem v4.0 — 2026-08-23
#
# WHY THIS PLAYBOOK EXISTS
#   Seals GL-LSN-001, the charter of the Gula grammar-minting agent: a
#   wound exists only once one structural signature has accumulated
#   three or more distinct Hubullu glosses across the corpus (S1.2),
#   and may TRIGGER graft-minting only when witnessed by two or more
#   independent engines -- a wound seen by a single engine remains
#   OBSERVED, never TRIGGERED (S1.3, the Two-Witness rule sibling to
#   GL-AGE-001 Sibu). The agent may mint unsealed dialect tablets
#   staged in uruk/ only, and possesses no write path to Kish -- the
#   Kish crossing, new axioms, core AkkadianAOL grammar, and all
#   naming remain Bahaa's alone (S2, S3). Any candidate carrying
#   foreign constructs (SQL keywords, embedded DSL directives) is
#   REJECTED as foreign tissue before staging, never silently (S4).
#   No more than one dialect candidate per wound, and no candidate may
#   cite another unsealed candidate as ancestry (S5.2, the autograft
#   regulatory layer against self-similar overgrowth).
#
#   Landed from a standalone Architect-supplied zip
#   (files_Lisanu_Law.zip, 2026-08-23), evaluated against this repo
#   before landing. The tablet's own header reads "PROPOSED -- awaiting
#   Bahaa's word (CSR-08)", carried verbatim, not normalized -- per
#   this repo's practice of landing a tablet's own stated status
#   rather than silently upgrading it (same treatment as GL-NER-001 in
#   batch19). The accompanying PB-357_gula_agent_scaffold.yml targets
#   the Architect's own separate host project
#   (~/BahyWay.Ecosystem-v4.0/engines/gula/), not this repo -- kept in
#   shala-prototypes/batch32_lisanu_law_gula_scaffold/ as reference
#   only, never renumbered into this repo's playbook_NNN sequence,
#   never executed. See that batch's own README.md.
#
# WHAT THIS PLAYBOOK DOES
#   PROVEs the Three-Gloss wound trigger, the Two-Witness rule, the
#   Uruk-only staging restriction with no write path to Kish, the
#   foreign-tissue rejection clause, and the one-graft-per-wound
#   regulatory layer are all sealed verbatim. PROVEs the Sala court
#   (the Lisanu Court, PB-357's Sala tab) renders the wound/graft arc
#   and the TRIGGERED/OBSERVED verdict vocabulary. Deposits nothing
#   new -- the tablet is committed directly into docs/, this playbook
#   is a pointer/verification record.
#
# Running this playbook = CSR-08 confirmation. Review -> --check -> live.
# =============================================================================

- name: "PB-601 | Seal the Lišānu Law (GL-LSN-001)"
  hosts: localhost
  connection: local
  become: false
  vars:
    repo_root: "{{ playbook_dir }}/.."
    tablet_file: "{{ repo_root }}/docs/09_observatory/GL-LSN-001_Lisanu_Law.md"
    court_file: "{{ repo_root }}/shala-prototypes/batch32_lisanu_law_gula_scaffold/sala_PB-357_lisanu_court.html"

  tasks:

    - name: "0.1 | Confirm the tablet and the Sala court are landed"
      ansible.builtin.stat:
        path: "{{ item }}"
      register: land_stat
      loop:
        - "{{ tablet_file }}"
        - "{{ court_file }}"
      loop_control: { label: "{{ item }}" }

    - name: "FAIL | required file missing"
      ansible.builtin.fail:
        msg: "{{ item.item }} not found -- nothing to seal."
      loop: "{{ land_stat.results }}"
      loop_control: { label: "{{ item.item }}" }
      when: not item.stat.exists

    - name: "1.1 | PROVE the Three-Gloss wound trigger is sealed"
      ansible.builtin.shell: |
        set -e
        grep -qF "three" "{{ tablet_file }}"
        grep -qF "distinct Ḫubullu glosses" "{{ tablet_file }}"
        grep -qF "Three glosses for one shape is proof the shared notation is missing" "{{ tablet_file }}"
        echo "PROVEN: the three-gloss wound definition is sealed"
      register: prove_wound
      changed_when: false

    - name: "1.2 | PROVE the Two-Witness rule is sealed"
      ansible.builtin.shell: |
        set -e
        grep -qF "witnessed by" "{{ tablet_file }}"
        grep -qF "two or more" "{{ tablet_file }}"
        grep -qF "A wound seen by one engine alone remains OBSERVED, never TRIGGERED" "{{ tablet_file }}"
        echo "PROVEN: the Two-Witness trigger rule is sealed"
      register: prove_witness
      changed_when: false

    - name: "1.3 | PROVE Uruk-only staging and the no-Kish-path clause are sealed"
      ansible.builtin.shell: |
        set -e
        grep -qF "URUK stream" "{{ tablet_file }}"
        grep -qF "no write path to Kish" "{{ tablet_file }}"
        echo "PROVEN: the agent is staged Uruk-only with no code path to Kish"
      register: prove_uruk
      changed_when: false

    - name: "1.4 | PROVE the foreign-tissue rejection clause is sealed"
      ansible.builtin.shell: |
        set -e
        grep -qF "REJECTED as foreign tissue" "{{ tablet_file }}"
        grep -qF "no silent close" "{{ tablet_file }}"
        echo "PROVEN: the immune clause is sealed"
      register: prove_immune
      changed_when: false

    - name: "1.5 | PROVE the one-graft-per-wound regulatory layer is sealed"
      ansible.builtin.shell: |
        set -e
        grep -qF "one" "{{ tablet_file }}"
        grep -qF "dialect candidate per wound" "{{ tablet_file }}"
        grep -qF "Grafts grow from sealed flesh only" "{{ tablet_file }}"
        echo "PROVEN: the autograft regulatory layer against overgrowth is sealed"
      register: prove_autograft
      changed_when: false

    - name: "1.6 | PROVE the Sala court renders the wound/graft arc"
      ansible.builtin.shell: |
        set -e
        grep -qF "TRIGGERED" "{{ court_file }}"
        grep -qF "OBSERVED" "{{ court_file }}"
        grep -qF "GRAFT" "{{ court_file }}"
        grep -qF "foreign tissue" "{{ court_file }}"
        grep -qF "STAGED-URUK" "{{ court_file }}"
        echo "PROVEN: the Lišānu Court renders the wound-to-graft arc and its verdict vocabulary"
      register: prove_court
      changed_when: false

    - name: "2.1 | Report"
      ansible.builtin.debug:
        msg: >
          PB-601 complete. GL-LSN-001 sealed (status PROPOSED, carried
          verbatim, awaiting the Architect's CSR-08 word): a wound is
          three or more glosses on one signature; it triggers grafting
          only under two independent witnesses; every graft is staged
          Uruk-only with no code path to Kish; foreign constructs are
          rejected as tissue, never silently; and no more than one
          graft may grow per wound. The accompanying Gula agent
          scaffold (PB-357) targets the Architect's own separate host
          and is kept reference-only in
          shala-prototypes/batch32_lisanu_law_gula_scaffold/ — never
          executed from this repo.
