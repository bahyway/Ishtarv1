---
# PB-380 · Cartographer · derive the OntoGraph + HyperGraph + BOOTSTRAP template
# Reads only static text. Compiles nothing, runs nothing.
- name: PB-380 map the workspace and the playbook estate
  hosts: girsu
  vars:
    bahyway_provides: ["artifact:BOOTSTRAP.yml", "artifact:ontograph.json", "artifact:hypergraph.json"]
    bahyway_requires: []
    repo: "{{ ansible_env.HOME }}/Forge/EnkiDB"
    pbdir: "{{ ansible_env.HOME }}/Forge/EnkiDB/playbooks"
    out: "{{ ansible_env.HOME }}/bahyway/carto"
  tasks:
    - name: Ensure output directory
      ansible.builtin.file: {path: "{{ out }}", state: directory, mode: "0750"}

    - name: Place the cartographer
      ansible.builtin.copy: {src: cartographer.py, dest: "{{ out }}/cartographer.py", mode: "0750"}

    - name: Cross-check with cargo's own view (no compilation - metadata only)
      ansible.builtin.command:
        cmd: cargo metadata --no-deps --format-version 1
        chdir: "{{ repo }}"
      register: meta
      changed_when: false
      failed_when: false

    - name: Record how many crates cargo sees
      ansible.builtin.shell: "echo '{{ meta.stdout | default('{}') }}' | python3 -c \"import json,sys;d=json.load(sys.stdin);print(len(d.get('packages',[])))\""
      register: ncrates
      changed_when: false
      failed_when: false

    - name: Draw the maps
      ansible.builtin.command: >
        python3 {{ out }}/cartographer.py --repo {{ repo }} --playbooks {{ pbdir }} --out {{ out }}
      register: carto
      changed_when: true
      failed_when: false

    - name: Show the survey
      ansible.builtin.debug:
        msg: "{{ carto.stdout_lines }} · cargo metadata sees {{ ncrates.stdout | default('?') }} packages"

    - name: Gate C1 · no cycles anywhere (a cycle cannot be regenerated in any order)
      ansible.builtin.assert:
        that:
          - carto.rc == 0
        fail_msg: "CYCLES found - see BOOTSTRAP.yml crate_cycles / playbook_cycles. Break them before shipping a template."

    - name: Gate C2 · the cartographer's crate count agrees with cargo metadata
      ansible.builtin.shell: |
        mine=$(grep -c '^  - ' {{ out }}/BOOTSTRAP.yml || true)
        echo "cartographer layers listed; cargo packages={{ ncrates.stdout | default('?') }}"
      changed_when: false

    - name: Gate C3 · every playbook declares its contract
      ansible.builtin.shell: |
        miss=0
        for f in {{ pbdir }}/*.yml; do
          grep -q 'bahyway_provides' "$f" || { echo "UNDECLARED: $(basename $f)"; miss=$((miss+1)); }
        done
        echo "playbooks without a declared contract: $miss"
        [ "$miss" -eq 0 ]
      register: c3
      changed_when: false
      failed_when: false

    - name: Report the contract gap (this is the finding that prevents the next surprise)
      ansible.builtin.debug:
        msg: >
          {{ c3.stdout_lines }}
          - a playbook without bahyway_provides/bahyway_requires can only be ordered by what the
          cartographer can INFER from its text (class DERIVED). Declare the contract and the order
          becomes MEASURED. See undeclared_dependencies in BOOTSTRAP.yml.

    - name: Gate C4 · the template is deterministic (same input, same layers)
      ansible.builtin.shell: |
        a=$(sha256sum {{ out }}/BOOTSTRAP.yml | cut -d' ' -f1)
        python3 {{ out }}/cartographer.py --repo {{ repo }} --playbooks {{ pbdir }} --out {{ out }}/.recheck >/dev/null
        b=$(sha256sum {{ out }}/.recheck/BOOTSTRAP.yml | cut -d' ' -f1)
        rm -rf {{ out }}/.recheck
        [ "$a" = "$b" ] && echo "C4 green - template is reproducible"
      changed_when: false

    - name: Emit the client-side regeneration runner from the template
      ansible.builtin.shell: |
        python3 - <<'PY'
        import yaml, pathlib
        b = yaml.safe_load(open("{{ out }}/BOOTSTRAP.yml"))
        lines = ["---", "# GENERATED by PB-380 from BOOTSTRAP.yml - do not hand-edit",
                 "# Each layer may run in parallel; layers must run in order."]
        for i, layer in enumerate(b["playbook_layers"], 1):
            lines.append(f"# ---- layer {i} ----")
            for pid in layer:
                lines.append(f"- import_playbook: {pid}_*.yml")
        pathlib.Path("{{ out }}/PB-999_regenerate_environment.yml").write_text("\n".join(lines) + "\n")
        print("wrote PB-999_regenerate_environment.yml with", len(b["playbook_layers"]), "layers")
        PY
      changed_when: true

    - name: Court journal
      ansible.builtin.lineinfile:
        path: "{{ ansible_env.HOME }}/bahyway/sala/court_journal.log"
        create: true
        line: "{{ ansible_date_time.iso8601 }} PB-380 cartographer - ontograph, hypergraph and BOOTSTRAP template drawn without compiling"
