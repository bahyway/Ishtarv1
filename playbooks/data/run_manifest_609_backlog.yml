# Regenerated 2026-08-23: strict ascending PB-number order.
# The prior version concatenated three separately-authored lists
# (the PB-310-320 suite, then ANU_GOVERNOR_PB_MANUAL.md's Runnable-now
# table in its own presentation order, then its Runnable-with-VMs
# table) -- which is why the walk visibly jumped around (PB-570 then
# PB-430 then back to PB-502). Only two real dependencies exist in this
# backlog (found via each playbook's own preflight/chain-gate checks,
# not guessed): PB-437 requires PB-427..436 to have journaled first,
# PB-530 requires PB-515..529. Every other item is independent -- no
# other preflight/chain-gate references another backlog item. Both real
# dependencies point at LOWER numbers by construction (a gate is always
# written after what it gates), so a plain ascending sort satisfies both
# automatically and eliminates the jumping, with zero files renamed.
# The `group` field is kept for reference (which original table an item
# came from) but no longer drives ordering.
