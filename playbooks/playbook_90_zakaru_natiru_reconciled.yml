---
# ════════════════════════════════════════════════════════════════════════════
#  playbook_90_zakaru_natiru_reconciled.yml
#  BahyWay.Ecosystem v4.0 — PB-90 Reconciled: zakāru/NATIRU → enkidb-journal + Index 6 (NĀṬIRU)
#
#  SCP to EriduOS-VDI then run:
#    ansible-playbook playbook_90_zakaru_natiru_reconciled.yml -i "localhost," -c local -v
#
#  Why this file exists (not the original playbook_90_zakaru_natiru_init.yml):
#    The uploaded PB-90 scaffolds two standalone crates — zakaru-journal and
#    natiru-bitmap — both depending on a kaki-types crate. None of the three
#    exist in this repo. That design was superseded before this branch's
#    history begins: the append-only event log is enkidb-journal, and the
#    per-tribe RoaringBitmap state index is enkidb-indexes::nairu_index —
#    both real, tested, and already wired into EnkiDb. Running the original
#    PB-90 verbatim would create dead, disconnected crates.
#
#    This file is PB-90's REAL replacement: it verifies the crates that
#    actually carry PB-90's intent today, with test counts confirmed by
#    direct execution before being written into this playbook (not guessed):
#      enkidb-journal        : 12 passed (original baseline; 21 passed as
#                               of the 2026-07-25 reconfirmation below)
#      enkidb-indexes         : 54 passed (original baseline, includes
#                               nairu_index: 7 of the 54; 58 passed as of
#                               the 2026-07-25 reconfirmation below)
#
#  2026-07-25 FIXES: the nairu_index VERIFY task checked for a directory
#  named "nairu_index" -- the real module is a single file,
#  "nairu_index.rs" -- so the check always reported not-found and the
#  playbook failed at the FAIL task immediately after, even though both
#  successor crates were genuinely present. Fixed the stat path. Also
#  found the two ASSERT tasks hard-matching the literal strings "12
#  passed"/"54 passed" would have failed next (both crates have grown
#  past those counts since this file was written); switched both to the
#  same ">= baseline, 0 failed" pattern playbook_90_phase_a_
#  foundation_confirmation.yml already uses for enkidb-indexes, so
#  legitimate growth no longer requires editing this file, while an
#  actual regression (fewer tests, or any failure) still fails loudly.
# ════════════════════════════════════════════════════════════════════════════
- name: "PB-90 (Reconciled) | zakāru→enkidb-journal, NATIRU→Index 6 nairu_index"
  hosts: localhost
  connection: local
  gather_facts: true

  vars:
    forge_root:    "{{ ansible_env.HOME }}/Forge/EnkiDB"
    workspace:     "{{ forge_root }}/workspace/bahyway_v4"
    cargo:         "{{ ansible_env.HOME }}/.cargo/bin/cargo"
    target_branch: "claude/iphone-playbooks-crosstribe-eval-nbc5sw"
    session_date:  "{{ ansible_date_time.date }}"
    docs_dir:      "{{ forge_root }}/docs/SHEDU"
    report_file:   "{{ docs_dir }}/PB90_RECONCILED_{{ session_date }}.txt"

  tasks:

    - name: "PREP | Ensure report dir exists"
      ansible.builtin.file:
        path: "{{ docs_dir }}"
        state: directory
        mode: "0755"

    # ── Sync verification — NO git on this host ────────────────────────────
    # EriduOS-VDI is not a GitHub-connected clone. GitHub lives on the
    # laptop (Fedora host). Workflow: laptop runs git pull, then scp -r
    # the updated workspace/bahyway_v4 to this host at {{ workspace }}.
    # This playbook only verifies that sync already happened.
    - name: "VERIFY | Workspace present (scp'd from laptop)"
      ansible.builtin.stat:
        path: "{{ workspace }}/Cargo.toml"
      register: ws_check

    - name: "FAIL | Workspace not synced — run the laptop-side sync first"
      ansible.builtin.fail:
        msg: >
          {{ workspace }}/Cargo.toml not found on this host. EriduOS-VDI has
          no GitHub access. On your Fedora laptop: git pull origin
          {{ target_branch }}, then scp -r workspace/bahyway_v4
          bahaa@eriduos-vdi:{{ workspace }}. Re-run this playbook after that.
      when: not ws_check.stat.exists

    - name: "VERIFY | enkidb-journal crate exists (zakāru successor)"
      ansible.builtin.stat:
        path: "{{ workspace }}/crates/enkidb-journal/Cargo.toml"
      register: journal_crate

    - name: "VERIFY | enkidb-indexes crate exists (NATIRU successor, nairu_index module)"
      ansible.builtin.stat:
        path: "{{ workspace }}/crates/enkidb-indexes/src/nairu_index.rs"
      register: nairu_module

    - name: "FAIL | successor crates not found — stale sync — re-run the laptop scp step"
      ansible.builtin.fail:
        msg: "enkidb-journal and/or enkidb-indexes::nairu_index not found after sync."
      when: not journal_crate.stat.exists or not nairu_module.stat.exists

    - name: "TEST | cargo test -p enkidb-journal"
      ansible.builtin.command:
        cmd: "{{ cargo }} test -p enkidb-journal"
        chdir: "{{ workspace }}"
      register: test_journal
      changed_when: false
      failed_when: test_journal.rc != 0

    - name: "PARSE | enkidb-journal passed-test count"
      ansible.builtin.set_fact:
        journal_passed_count: "{{ (test_journal.stdout | regex_search('([0-9]+) passed', '\\1') | first) | int }}"

    - name: "ASSERT | enkidb-journal has zero failures and at least the PB-90 baseline of passing tests"
      ansible.builtin.assert:
        that:
          - "'0 failed' in test_journal.stdout"
          - journal_passed_count >= 12
        fail_msg: >-
          Expected at least 12 passed, 0 failed. Got {{ journal_passed_count }}
          passed. Full output: {{ test_journal.stdout }}
        success_msg: >-
          enkidb-journal: {{ journal_passed_count }} passed, 0 failed
          (>= baseline 12 -- reconfirmed 21 passed on 2026-07-25; this
          crate has grown since this playbook was first written, same
          drift PB-90 Phase A found in enkidb-indexes).

    - name: "TEST | cargo test -p enkidb-indexes"
      ansible.builtin.command:
        cmd: "{{ cargo }} test -p enkidb-indexes"
        chdir: "{{ workspace }}"
      register: test_indexes
      changed_when: false
      failed_when: test_indexes.rc != 0

    - name: "PARSE | enkidb-indexes passed-test count"
      ansible.builtin.set_fact:
        indexes_passed_count: "{{ (test_indexes.stdout | regex_search('([0-9]+) passed', '\\1') | first) | int }}"

    - name: "ASSERT | enkidb-indexes has zero failures and at least the PB-90 baseline of passing tests (nairu_index: 7 of the original 54)"
      ansible.builtin.assert:
        that:
          - "'0 failed' in test_indexes.stdout"
          - indexes_passed_count >= 54
        fail_msg: >-
          Expected at least 54 passed, 0 failed. Got {{ indexes_passed_count }}
          passed. Full output: {{ test_indexes.stdout }}
        success_msg: >-
          enkidb-indexes: {{ indexes_passed_count }} passed, 0 failed
          (>= baseline 54 -- reconfirmed 58 passed on 2026-07-25, same
          growth PB-90 Phase A already found).

    - name: "WRITE | Report"
      ansible.builtin.copy:
        dest: "{{ report_file }}"
        mode: "0644"
        content: |
          BahyWay.Ecosystem v4.0 — PB-90 Reconciled Report
          Date : {{ session_date }}

          Original PB-90 (zakaru-journal + natiru-bitmap, kaki-types dep):
          SUPERSEDED — none of the three crates exist in this repo.

          Real successors verified this run:
            enkidb-journal  : {{ journal_passed_count }} passed, 0 failed  (zakāru event log successor; original baseline 12)
            enkidb-indexes  : {{ indexes_passed_count }} passed, 0 failed  (NATIRU successor: nairu_index, 7 of the original 54)

          No new code written by this playbook — verification only.

    - name: "DONE | PB-90 Reconciled COMPLETE"
      ansible.builtin.debug:
        msg: "PB-90 reconciled and verified against real repo state. Report: {{ report_file }}"
