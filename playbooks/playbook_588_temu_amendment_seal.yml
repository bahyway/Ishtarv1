# =============================================================================
# PB-588 — The Ṭēmu Amendment: Concept Seal (GL-ISR-002-A2)
# BahyWay.Ecosystem v4.0 — 2026-08-23
#
# WHY THIS PLAYBOOK EXISTS
#   Seals GL-ISR-002-A2, the Twin Witness Theorem: on any membrane
#   admitted under the Alaa Doctrine, a verdict of regime, hazard, or
#   hidden structure requires two independent witness classes -- the
#   Flow witness (PIV/PTV motion) and the Law witness (a
#   stochastic-geometry deficit functional against a declared
#   reference arrangement law). One class crossing alone routes to
#   WATCH, never to verdict. Charters five membranes (Sea, Air, Fire
#   with EMBER-STORM ASSEMBLY, Flood with ROUTE-SEVERANCE FORESEEN,
#   Ground-of-the-Dead with the Cemetery Fingerprint Clause) and seals
#   an inviolable sample-size floor for every SG statistic.
#
#   Landed from a standalone Architect-supplied upload (2026-08-23),
#   evaluated file-by-file against this repo before landing and
#   RENUMBERED per this repo's standing rule: the source deposit's own
#   PB-ISR-004 -> PB-588 here. See
#   shala-prototypes/batch17_shedu_temu_sky_courts/README.md for the
#   full renumbering table. This tablet is the direct parent this repo
#   was missing for GL-LAT-001 (the Kulla Law, landed in batch15) --
#   closing that batch's remaining open dependency for Kulla's parent
#   chain (GL-ALG-002/Napharu, the shared grandparent, remains
#   unsealed in docs/09_observatory/).
#
# WHAT THIS PLAYBOOK DOES
#   PROVEs the tablet's own four stated proof obligations (ISR-PO-12
#   through ISR-PO-15) are named, PROVEs the Twin Witness Theorem and
#   the inviolable sample-size floor are sealed verbatim, and PROVEs
#   the Fire Court rehearsal renders the two-needle WATCH-vs-verdict
#   distinction and the EMBER-STORM ASSEMBLY verdict. Deposits nothing
#   new -- docs and Sala tab are committed directly into docs/ and
#   shala-prototypes/, this playbook is a pointer/verification record.
#
# Running this playbook = CSR-08 confirmation. Review -> --check -> live.
# =============================================================================

- name: "PB-588 | Seal the Ṭēmu Amendment (GL-ISR-002-A2)"
  hosts: localhost
  connection: local
  become: false
  vars:
    repo_root: "{{ playbook_dir }}/.."
    tablet_file: "{{ repo_root }}/docs/09_observatory/GL-ISR-002-A2_Temu_Amendment.md"
    court_file: "{{ repo_root }}/shala-prototypes/batch17_shedu_temu_sky_courts/sala_gl_isr_002_a2_temu_fire_court.html"

  tasks:

    - name: "0.1 | Confirm the tablet and the Sala court are landed"
      ansible.builtin.stat:
        path: "{{ item }}"
      register: land_stat
      loop:
        - "{{ tablet_file }}"
        - "{{ court_file }}"
      loop_control: { label: "{{ item }}" }

    - name: "FAIL | required file missing"
      ansible.builtin.fail:
        msg: "{{ item.item }} not found -- nothing to seal."
      loop: "{{ land_stat.results }}"
      loop_control: { label: "{{ item.item }}" }
      when: not item.stat.exists

    - name: "1.1 | PROVE the tablet's own four proof obligations (ISR-PO-12..15) are named"
      ansible.builtin.shell: |
        set -e
        grep -qF "ISR-PO-12" "{{ tablet_file }}"
        grep -qF "ISR-PO-13" "{{ tablet_file }}"
        grep -qF "ISR-PO-14" "{{ tablet_file }}"
        grep -qF "ISR-PO-15" "{{ tablet_file }}"
        echo "PROVEN: ISR-PO-12..15 all present"
      register: prove_pos
      changed_when: false

    - name: "1.2 | PROVE the Twin Witness Theorem is sealed verbatim"
      ansible.builtin.shell: |
        set -e
        grep -qF "the Flow witness" "{{ tablet_file }}"
        grep -qF "the Law witness" "{{ tablet_file }}"
        grep -qF "One class crossing alone routes to WATCH, never to verdict" "{{ tablet_file }}"
        echo "PROVEN: the Twin Witness Theorem is sealed"
      register: prove_twin
      changed_when: false

    - name: "1.3 | PROVE the inviolable sample-size floor is sealed"
      ansible.builtin.shell: |
        set -e
        grep -qF "Sample-size floor (inviolable)" "{{ tablet_file }}"
        grep -qF "K-function computed on seven points is numerology, not law" "{{ tablet_file }}"
        echo "PROVEN: the sample-size floor is sealed"
      register: prove_floor
      changed_when: false

    - name: "1.4 | PROVE the Fire and Flood court verdicts are chartered"
      ansible.builtin.shell: |
        set -e
        grep -qF "**EMBER-STORM ASSEMBLY**" "{{ tablet_file }}"
        grep -qF "**ROUTE-SEVERANCE FORESEEN**" "{{ tablet_file }}"
        grep -qF "refused by the geometry" "{{ tablet_file }}"
        echo "PROVEN: EMBER-STORM ASSEMBLY, ROUTE-SEVERANCE FORESEEN, and the Cemetery Fingerprint refusal are all sealed"
      register: prove_courts
      changed_when: false

    - name: "1.5 | PROVE the Fire Court rehearsal renders the two-needle distinction and the ember-storm verdict"
      ansible.builtin.shell: |
        set -e
        grep -qF "FLOW" "{{ court_file }}"
        grep -qF "LAW" "{{ court_file }}"
        grep -qF "One needle crossing = WATCH" "{{ court_file }}"
        grep -qF "EMBER-STORM ASSEMBLY" "{{ court_file }}"
        grep -qF "INFLECTION fired" "{{ court_file }}"
        echo "PROVEN: the Fire Court renders the twin-needle WATCH-vs-verdict distinction and INFLECTION"
      register: prove_court
      changed_when: false

    - name: "2.1 | Report"
      ansible.builtin.debug:
        msg: >
          PB-588 complete. GL-ISR-002-A2 sealed: verdicts on any
          Alaa-admitted membrane require the Flow witness AND the Law
          witness together, a single crossing routes only to WATCH,
          every SG statistic carries an inviolable sample-size floor,
          and five membranes are chartered including EMBER-STORM
          ASSEMBLY (Fire) and ROUTE-SEVERANCE FORESEEN (Flood).
          Renumbered from the source deposit's PB-ISR-004; see
          shala-prototypes/batch17_shedu_temu_sky_courts/README.md for
          the full renumbering table. This tablet resolves the
          dependency gap batch15 reported for GL-LAT-001 (Kulla)'s
          Ṭēmu parent.
