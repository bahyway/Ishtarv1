---
# ════════════════════════════════════════════════════════════════════════════
#  playbook_140_edubba_seal_integration_reconciled.yml
#  BahyWay.Ecosystem v4.0 — PB-140 Reconciled: workspace check real, live stages deferred
#
#  SCP to EriduOS-VDI then run:
#    ansible-playbook playbook_140_edubba_seal_integration_reconciled.yml -i "localhost," -c local -v
#
#  Why this file does NOT assert what the original asserted:
#    Three independent problems confirmed before shipping this:
#
#    1. Depends on "ashnan-kaki" (crate stat + cargo test -p ashnan-kaki).
#       Confirmed absent — superseded by the real `ashnan` crate
#       (see playbook_117_ashnan_kaki_schema_v2_reconciled.yml).
#
#    2. Its Stage 6 query ("PRESENT WHAT: EAV.* WHEN: all LIMIT: 10",
#       colon-separated) is the same syntax confirmed broken against the
#       current parser in playbook_112's reconciliation
#       ("Unexpected character: ':'").
#
#    3. Depends on a test corpus (ashnan_test_zip.zip) that was never
#       generated, and on live SSH to both enkidb-node-write and
#       enkidb-node-read — none of which this sandbox can exercise, and
#       none of which exist as committed artifacts in this repo.
#
#    This file verifies what's real and checkable today — the full
#    workspace compiles, and ColourID B11 (Stage 4, PASHIRU) is real and
#    tested (via the real `ashnan` crate, not ashnan-kaki) — and clearly
#    marks the remaining stages (1-3, 5-7, live network stages) as
#    genuinely unverified rather than asserting a pass that would be
#    false today.
# ════════════════════════════════════════════════════════════════════════════
- name: "PB-140 (Reconciled) | É-DUBBA seal — workspace + ColourID B11 real, rest deferred"
  hosts: localhost
  connection: local
  gather_facts: true

  vars:
    forge_root:    "{{ ansible_env.HOME }}/Forge/EnkiDB"
    workspace:     "{{ forge_root }}/workspace/bahyway_v4"
    cargo:         "{{ ansible_env.HOME }}/.cargo/bin/cargo"
    target_branch: "claude/iphone-playbooks-crosstribe-eval-nbc5sw"
    docs_dir:      "{{ forge_root }}/docs/SHEDU"
    session_date:  "{{ ansible_date_time.date }}"
    report_file:   "{{ docs_dir }}/PB140_RECONCILED_{{ session_date }}.txt"

  tasks:

    - name: "PREP | Ensure docs dir exists"
      ansible.builtin.file: { path: "{{ docs_dir }}", state: directory, mode: "0755" }

    - name: "VERIFY | Workspace present (scp'd from laptop)"
      ansible.builtin.stat:
        path: "{{ workspace }}/Cargo.toml"
      register: ws_check

    - name: "FAIL | Workspace not synced — run the laptop-side sync first"
      ansible.builtin.fail:
        msg: >
          {{ workspace }}/Cargo.toml not found on this host. EriduOS-VDI has
          no GitHub access. On your Fedora laptop: git pull origin
          {{ target_branch }}, then scp -r workspace/bahyway_v4
          bahaa@eriduos-vdi:{{ workspace }}. Re-run this playbook after that.
      when: not ws_check.stat.exists

    - name: "CARGO | cargo check --workspace (all crates)"
      ansible.builtin.command:
        cmd: "{{ cargo }} check --workspace"
        chdir: "{{ workspace }}"
      register: ws_build_check
      changed_when: false
      failed_when: ws_build_check.rc != 0

    - name: "STAGE 4 | PASHIRU — ColourID B11 gate (real crate: ashnan, not ashnan-kaki)"
      ansible.builtin.command:
        cmd: "{{ cargo }} test -p ashnan colour -- --nocapture"
        chdir: "{{ workspace }}"
      register: colour_test
      changed_when: false
      failed_when: colour_test.rc != 0

    - name: "ASSERT | ColourID B11 tests pass (never 255)"
      ansible.builtin.assert:
        that: "((colour_test.stdout | regex_search('([0-9]+) passed', '\\\\1') | first | int) >= 2)"
        fail_msg: "Expected 2 ColourID B11 tests to pass. Got: {{ colour_test.stdout }}"
        success_msg: "Stage 4 PASS — ColourID B11 confirmed via real ashnan crate."

    - name: "WRITE | Integration report"
      ansible.builtin.copy:
        dest: "{{ report_file }}"
        mode: "0644"
        content: |
          BahyWay.Ecosystem v4.0 — PB-140 Reconciled Report
          Date : {{ session_date }}

          Original PB-140 depended on ashnan-kaki (absent — superseded
          by ashnan), an unbuilt test corpus, live SSH to two nodes, and
          the old colon-syntax query confirmed broken against the
          current parser. None of that is asserted here.

          Verified this run (real, checkable today):
            cargo check --workspace : PASS
            Stage 4 PASHIRU (ColourID B11, via real ashnan crate) : PASS (2/2)

          NOT verified (deliberately, and why):
            Stage 1+2 MASHSHARU+NAMZITUM — needs the ASHNAN test corpus
              (never generated) and naramsin-bridge's archive-unwrap
              wiring (confirmed deferred — playbook_115's reconciliation)
            Stage 3 TIAMAT indices        — same corpus dependency
            Stage 5 KISPU journal.bin     — needs live SSH to
              enkidb-node-write (192.168.122.101)
            Stage 6 UTNAPISHTIM read path — needs live SSH to
              enkidb-node-read (192.168.122.107) AND the query syntax
              fix already documented in playbook_112's reconciliation
            Stage 7 Nisaba art trigger    — not yet built anywhere in
              this repo (unrelated to this playbook's scope)

          Real follow-up: once the ASHNAN corpus exists and naramsin-
          bridge's Stage 0-1 wiring lands, re-run against live nodes
          using the corrected binary-frame query client from
          playbook_112_kispu_headstore_benchmark_reconciled.yml, not
          raw nc + colon syntax.

    - name: "DONE | PB-140 Reconciled COMPLETE"
      ansible.builtin.debug:
        msg: "PB-140 reconciled — real stages verified, rest honestly deferred. Report: {{ report_file }}"
