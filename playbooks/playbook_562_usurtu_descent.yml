# =============================================================================
# PB-562 — Two Witnesses of Place: Uṣurtu Descent Seal (GL-NIM-002)
# BahyWay.Ecosystem v4.0 — 2026-08-20
#
# WHY THIS PLAYBOOK EXISTS
#   Seals GL-NIM-002, the address-depth decree marrying continuous
#   leak-witness coordinates to the {7,3} hyperbolic Usurtu index: a
#   verdict is interred only with two witnesses of place -- UTM truth
#   (Enbilulu's localization, sigma_d under the Cramer-Rao gate) and a
#   hepta-address (the owning cell chain via the Usurtu codec). Address
#   depth is DERIVED, never chosen: d* = ceil(log_sqrt7(E0/(k*sigma_d))),
#   so the address is exactly as deep as the localization math paid for
#   -- deeper is false precision, shallower wastes what was proven.
#   Doctrine under GL-STK-001 (PB-560), binds GL-MAP-001 to GL-NIM-001.
#   CONCEPT DOCUMENT ONLY, landed as a Sala rehearsal.
#
#   Landed from the same Thu20260820 "Nimrud Stack" thread, renumbered
#   from the source session's PB-355 per this repo's standing rule.
#   IMPORTANT: this tablet cites GL-MAP-001 (the Usurtu Court law,
#   sqrt7 aperture, no-empty-space, interment) and PB-347 (the Usurtu
#   codec) -- NEITHER is landed in this repo. Only a screenshot of
#   "PB-348 - Usurtu Court v2" was shown in chat, with no source file.
#   This playbook PROVEs GL-NIM-002 itself is landed correctly; it
#   cannot and does not verify GL-MAP-001, which does not exist here.
#   See shala-prototypes/batch10_nimrud_stack/README.md.
#
# GUARDED BOUNDARY:
#   Witness assignment to a cell is deterministic geometry, not pattern
#   minting -- unstructured is NOT unborn, and EEEngine is never
#   summoned for it (Clause P3).
#
# WHAT THIS PLAYBOOK DOES
#   PROVEs the two-witnesses-of-place clause (P1), the address-depth
#   formula (P2), deterministic ownership (P3), and the Sala descent
#   court's address-depth meter, false-precision lock, and
#   owned-but-silent record (L87-L90) are present.
#
# Running this playbook = CSR-08 confirmation. Review -> --check -> live.
# =============================================================================

- name: "PB-562 | Seal Two Witnesses of Place (GL-NIM-002)"
  hosts: localhost
  connection: local
  become: false
  vars:
    repo_root: "{{ playbook_dir }}/.."
    tablet_file: "{{ repo_root }}/docs/09_observatory/GL-NIM-002_Two_Witnesses_of_Place.md"
    descent_file: "{{ repo_root }}/shala-prototypes/batch10_nimrud_stack/shala_usurtu_descent.html"

  tasks:

    - name: "0.1 | Confirm the tablet and the Sala descent court are landed"
      ansible.builtin.stat:
        path: "{{ item }}"
      register: land_stat
      loop:
        - "{{ tablet_file }}"
        - "{{ descent_file }}"
      loop_control: { label: "{{ item }}" }

    - name: "FAIL | required file missing"
      ansible.builtin.fail:
        msg: "{{ item.item }} not found -- nothing to seal."
      loop: "{{ land_stat.results }}"
      loop_control: { label: "{{ item.item }}" }
      when: not item.stat.exists

    - name: "1.1 | PROVE P1 -- both witnesses of place are named, address never enters kappa bytes"
      ansible.builtin.shell: |
        set -e
        grep -q "UTM truth" "{{ tablet_file }}"
        grep -q "Hepta-address" "{{ tablet_file }}"
        grep -q "never enters" "{{ tablet_file }}"
        echo "PROVEN: UTM witness and hepta-address witness both required; address stays out of the locked KAKI bytes"
      register: prove_p1
      changed_when: false

    - name: "1.2 | PROVE P2 -- the derived address-depth formula and rehearsal figure (d*=11) are present"
      ansible.builtin.shell: |
        set -e
        grep -q "false precision" "{{ tablet_file }}"
        grep -q "11 shells" "{{ tablet_file }}"
        echo "PROVEN: address-depth is derived from sigma_d, not chosen; rehearsal figure d*=11 shells stated"
      register: prove_p2
      changed_when: false

    - name: "1.3 | PROVE P3 -- ownership is deterministic geometry, EEEngine not summoned"
      ansible.builtin.shell: |
        set -e
        grep -q "unstructured .* unborn\|unstructured ≠ unborn" "{{ tablet_file }}"
        grep -q "not summoned" "{{ tablet_file }}"
        echo "PROVEN: unstructured explicitly distinguished from unborn; EEEngine explicitly not summoned for cell assignment"
      register: prove_p3
      changed_when: false

    - name: "1.4 | PROVE L88-L90 -- the Sala descent court renders the address-depth meter, false-precision lock, and owned-but-silent record"
      ansible.builtin.shell: |
        set -e
        grep -qi "address.depth\|d\*" "{{ descent_file }}"
        grep -q "DEEPER IS FALSE PRECISION" "{{ descent_file }}"
        grep -qi "owned but silent\|owned-but-silent" "{{ descent_file }}"
        echo "PROVEN: address-depth meter, false-precision lock at the derived floor, and owned-but-silent record all render"
      register: prove_court
      changed_when: false

    - name: "2.1 | Report"
      ansible.builtin.debug:
        msg: >
          PB-562 complete. GL-NIM-002 sealed: a leak verdict is interred
          only with two witnesses of place (UTM truth + hepta-address,
          the address riding as an EnkiMDB facet and never touching the
          locked KAKI bytes), address depth is derived from Enbilulu's
          own sigma_d rather than chosen (rehearsal figure: 11 shells),
          and cell ownership is deterministic geometry, not pattern
          minting. The Sala descent court renders the address-depth
          meter, the false-precision lock, and the owned-but-silent
          record. Renumbered from the source session's PB-355. NOTE:
          this tablet cites GL-MAP-001 and PB-347, NEITHER of which is
          landed in this repo -- see
          shala-prototypes/batch10_nimrud_stack/README.md before
          treating this as a fully closed dependency chain.
