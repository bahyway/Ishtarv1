# =============================================================================
# PB-572 — Land the remaining Saturday rehearsal suite + provenance record
# BahyWay.Ecosystem v4.0 — 2026-08-21
#
# WHY THIS PLAYBOOK EXISTS
#   Registers the Sat20260815 batch's remaining files that carry no
#   dedicated GL law tablet of their own: shala_nasaru_leak_court.html
#   (v1, Nebuchadnezzar-pattern leak court) and its v2 (full BWVL
#   camera-deck extension), shala_sixth_court_living_derivation.html
#   (OntoGraph FCA closure staged over the Sixth Court's home work),
#   shala_membrane_court_v3.html (the single-court geodesic-K(r)
#   predecessor of the already-landed five-court batch8 v4 build),
#   00_Create_OntoGraph_For_Nasaru_Instrument.md (the design
#   conversation behind GL-ONT-001/PB-322, both already landed in
#   corrected form from an earlier batch), and
#   __ClaudeCode_EVL_All_1Week_Files_.md (the other session's own
#   9,661-line transcript of its week cataloguing the original 7-batch
#   Phase 2 corpus this repo already integrated -- kept as an
#   audit-trail/provenance record, not renumbered as new content).
#
#   PURE REHEARSAL/RESEARCH MATERIAL -- no GL law tablet exists for
#   this group (unlike GL-ALG-003, GL-LIT-001, GL-ISM-001, GL-NJF-001,
#   or GL-NSR-001 and its amendments, sealed separately as PB-566/565/
#   567/571/568-570). This playbook is a landing/verification record,
#   matching playbook_559's and playbook_564's own precedent, not a
#   law seal.
#
#   UPDATE 2026-08-23: shala_nasaru_leak_court.html and _v2.html both cite
#   **GL-ALG-002** ("𝒟_Θ deficit") as a dependency. This note originally
#   flagged GL-ALG-002 as absent repo-wide -- it landed 2026-08-21 as
#   docs/09_observatory/GL-ALG-002_Napharu_Theorem.md, found live by this
#   playbook's own self-check (task 1.1), which now PROVEs the dependency
#   is landed rather than proving it's still missing. See
#   shala-prototypes/batch12_nasaru_saturday_courts/README.md.
#
# WHAT THIS PLAYBOOK DOES
#   PROVEs the six-file manifest is landed, PROVEs the GL-ALG-002
#   dependency is cited-but-unlanded (confirming the flag is still
#   accurate rather than stale), and spot-checks one distinguishing
#   content marker per file. Deposits nothing new -- docs and Sala tabs
#   are committed directly into docs/ and shala-prototypes/, this
#   playbook is a pointer/verification record.
#
# Running this playbook = CSR-08 confirmation. Review -> --check -> live.
# =============================================================================

- name: "PB-572 | Land the Saturday rehearsal suite + provenance record"
  hosts: localhost
  connection: local
  become: false
  vars:
    repo_root: "{{ playbook_dir }}/.."
    batch_dir: "{{ repo_root }}/shala-prototypes/batch12_nasaru_saturday_courts"

  tasks:

    - name: "0.1 | Confirm the six-file manifest is landed"
      ansible.builtin.stat:
        path: "{{ batch_dir }}/{{ item }}"
      register: manifest_stat
      loop:
        - "shala_nasaru_leak_court.html"
        - "shala_nasaru_leak_court_v2.html"
        - "shala_sixth_court_living_derivation.html"
        - "shala_membrane_court_v3.html"
        - "00_Create_OntoGraph_For_Nasaru_Instrument.md"
        - "__ClaudeCode_EVL_All_1Week_Files_.md"
      loop_control: { label: "{{ item }}" }

    - name: "FAIL | manifest file missing"
      ansible.builtin.fail:
        msg: "{{ item.item }} not found under {{ batch_dir }} -- batch incomplete."
      loop: "{{ manifest_stat.results }}"
      loop_control: { label: "{{ item.item }}" }
      when: not item.stat.exists

    # 2026-08-23: flipped from "prove GL-ALG-002 is still absent" to "prove
    # it's now landed" -- this task's own self-check caught the tablet's
    # real 2026-08-21 landing live, exactly as its exit-1 branch intended.
    - name: "1.1 | PROVE both leak-court builds cite the GL-ALG-002 dependency and confirm it is now landed"
      ansible.builtin.shell: |
        set -e
        grep -qF "GL-ALG-002" "{{ batch_dir }}/shala_nasaru_leak_court.html"
        grep -qF "GL-ALG-002" "{{ batch_dir }}/shala_nasaru_leak_court_v2.html"
        find "{{ repo_root }}/docs" -iname "GL-ALG-002*" | grep -q .
        echo "PROVEN: both builds cite GL-ALG-002, confirmed landed at docs/09_observatory/GL-ALG-002_Napharu_Theorem.md"
      register: prove_dependency
      changed_when: false

    - name: "1.2 | PROVE v2 adds the full BWVL camera deck over v1"
      ansible.builtin.shell: |
        set -e
        grep -qF "Bird Eye" "{{ batch_dir }}/shala_nasaru_leak_court_v2.html"
        grep -qF "Ground" "{{ batch_dir }}/shala_nasaru_leak_court_v2.html"
        grep -qF "camera" "{{ batch_dir }}/shala_nasaru_leak_court_v2.html"
        ! grep -qF "Bird Eye" "{{ batch_dir }}/shala_nasaru_leak_court.html"
        echo "PROVEN: v2 carries the BWVL camera deck (Bird Eye/Ground/camera controls) absent from v1"
      register: prove_leak_v2
      changed_when: false

    - name: "1.3 | PROVE the Sixth Court stages an FCA/lattice closure"
      ansible.builtin.shell: |
        set -e
        grep -qF "Sixth Court" "{{ batch_dir }}/shala_sixth_court_living_derivation.html"
        grep -qF "lattice" "{{ batch_dir }}/shala_sixth_court_living_derivation.html"
        echo "PROVEN: Sixth Court staged as a living OntoGraph/FCA lattice derivation"
      register: prove_sixth
      changed_when: false

    - name: "1.4 | PROVE Membrane Court v3 carries the single-court geodesic K(r) instrument"
      ansible.builtin.shell: |
        set -e
        grep -qF "K(r)" "{{ batch_dir }}/shala_membrane_court_v3.html"
        grep -qF "Poisson" "{{ batch_dir }}/shala_membrane_court_v3.html"
        grep -qF "geodesic" "{{ batch_dir }}/shala_membrane_court_v3.html"
        echo "PROVEN: geodesic K(r)-vs-Poisson-null instrument present, matching batch8 v4's own already-landed grammar"
      register: prove_membrane_v3
      changed_when: false

    - name: "1.5 | PROVE the OntoGraph design conversation names the already-landed GL-ONT-001/PB-322"
      ansible.builtin.shell: |
        set -e
        grep -qF "GL-ONT-001" "{{ batch_dir }}/00_Create_OntoGraph_For_Nasaru_Instrument.md"
        grep -qF "PB-322" "{{ batch_dir }}/00_Create_OntoGraph_For_Nasaru_Instrument.md"
        echo "PROVEN: the conversation that produced this repo's already-landed GL-ONT-001/PB-322 is preserved as provenance"
      register: prove_ontograph
      changed_when: false

    - name: "1.6 | PROVE the provenance transcript is the full 9661-line record, not a partial copy"
      ansible.builtin.command: "wc -l {{ batch_dir }}/__ClaudeCode_EVL_All_1Week_Files_.md"
      register: prove_transcript
      changed_when: false
      failed_when: (prove_transcript.stdout.split()[0] | int) < 9661

    - name: "2.1 | Report"
      ansible.builtin.debug:
        msg: >
          PB-572 complete. Six files landed: the Nasaru Leak Court
          (v1 Nebuchadnezzar-pattern build, v2 full BWVL camera deck --
          both citing the still-unlanded GL-ALG-002 dependency, flag
          confirmed accurate), the Sixth Court living derivation (an
          OntoGraph FCA closure staged over its home work), Membrane
          Court v3 (the single-court geodesic K(r) predecessor of the
          already-landed batch8 five-court v4), the OntoGraph design
          conversation that produced this repo's already-landed
          GL-ONT-001/PB-322, and the other session's own full
          9,661-line provenance transcript of its week cataloguing the
          original Phase 2 corpus. Pure rehearsal/research material --
          no GL law tablet, this is a landing record, not a seal.
