---
# PB-681 · Seal GL-AGT-001 · Tablet of the Watcher
# CSR-08: running this playbook IS the confirmation of the seal.
- name: PB-681 seal GL-AGT-001
  hosts: girsu
  gather_facts: true
  vars:
    law_root: "{{ ansible_env.HOME }}/bahyway/laws"
    tablet: GL-AGT-001_the_watcher.md
    tablet_id: GL-AGT-001
    seal_key: "{{ ansible_env.HOME }}/bahyway/keys/akkadian_seal_ed25519"
  tasks:
    - name: Ensure law and seal directories
      ansible.builtin.file: {path: "{{ item }}", state: directory, mode: "0750"}
      loop: ["{{ law_root }}", "{{ law_root }}/sealed", "{{ law_root }}/receipts"]

    - name: Refuse to re-seal an already sealed tablet
      ansible.builtin.stat: {path: "{{ law_root }}/sealed/{{ tablet }}"}
      register: existing
    - name: Gate G0 · no silent overwrite of a sealed tablet
      ansible.builtin.assert:
        that: not existing.stat.exists
        fail_msg: "{{ tablet_id }} is already sealed. Amendments require GL-AGT-001-A1 and a fresh CSR-08 rite."
        success_msg: "G0 green - tablet not yet sealed"

    - name: Place the tablet
      ansible.builtin.copy: {src: "{{ tablet }}", dest: "{{ law_root }}/sealed/{{ tablet }}", mode: "0440"}

    - name: Gate G1 · all thirteen sections present (§0..§12)
      ansible.builtin.shell: |
        set -e
        for i in $(seq 0 12); do
          grep -q "## §$i" "{{ law_root }}/sealed/{{ tablet }}" || { echo "missing §$i"; exit 1; }
        done
        echo "G1 green - thirteen sections (§0..§12)"
      changed_when: false

    - name: Gate G2 · no SQL syntax anywhere in the tablet
      # Bare-keyword matching on SELECT/FROM/EXISTS false-positives on ordinary
      # English prose -- real SQL syntax needs SELECT...FROM together, EXISTS(,
      # or an INNER/LEFT JOIN phrase. Same fix as playbook_618/619/620/654.
      ansible.builtin.shell: |
        ! grep -Eiq 'SELECT +[A-Za-z*].{0,200}\bFROM\b|INNER JOIN|LEFT JOIN|EXISTS *\(' "{{ law_root }}/sealed/{{ tablet }}"
      changed_when: false

    - name: Gate G3 · the five unamendable clauses are named
      ansible.builtin.shell: |
        grep -q '§1, §3, §4, §5 and §9 may not be amended' "{{ law_root }}/sealed/{{ tablet }}"
        echo "G3 green - determinism, no fake, no hidden, never above the operator, the judge is not the player"
      changed_when: false

    - name: Compute Ed25519 AkkadianSeal
      ansible.builtin.shell: |
        openssl pkeyutl -sign -rawin -inkey "{{ seal_key }}" \
          -in "{{ law_root }}/sealed/{{ tablet }}" | base64 -w0
      register: seal
      changed_when: true
      no_log: false

    - name: Write the Kanīku receipt
      ansible.builtin.copy:
        dest: "{{ law_root }}/receipts/{{ tablet_id }}.kaniku.yml"
        mode: "0440"
        content: |
          tablet: {{ tablet_id }}
          file: {{ tablet }}
          sha256: "{{ (lookup('pipe', 'sha256sum ' + law_root + '/sealed/' + tablet)).split()[0] }}"
          seal_ed25519: "{{ seal.stdout }}"
          sealed_on: "{{ ansible_date_time.iso8601 }}"
          sealed_by: "DUB.SAR"
          rite: CSR-08
          governs: [agent:nisaba.watcher, tribe:mdb.template]
          unamendable: ["§1 the same job each time", "§3 no fake", "§4 no hidden", "§5 never above the operator", "§9 the judge is not the player"]

    - name: Register in the law registry
      ansible.builtin.lineinfile:
        path: "{{ law_root }}/REGISTRY.log"
        create: true
        mode: "0640"
        line: "{{ ansible_date_time.iso8601 }} SEALED {{ tablet_id }} sha256={{ (lookup('pipe', 'sha256sum ' + law_root + '/sealed/' + tablet)).split()[0] }}"

    - name: Court journal
      ansible.builtin.lineinfile:
        path: "{{ ansible_env.HOME }}/bahyway/sala/court_journal.log"
        create: true
        line: "{{ ansible_date_time.iso8601 }} PB-681 {{ tablet_id }} SEALED - the Watcher enters the ecosystem: she signs and records, she does not decide"
