# =============================================================================
# PB-596 — The Naṣāru Instrument Standard: Concept Seal (SALA-STD-001)
# BahyWay.Ecosystem v4.0 — 2026-08-23
#
# WHY THIS PLAYBOOK EXISTS
#   Seals SALA-STD-001: eight instruments (N1-N8) are now mandatory,
#   unasked, in every future Šala HTML court -- StoryEngine (N1),
#   zoom/bounce (N2), Landing-from-Space (N3), Bird-Flight (N4), the
#   rites menu and Workbench (N5), the Šurinnu stele legend-as-
#   controller (N6), the journal/honesty banners (N7), and the
#   compile+runtime gates (N8). The tablet also carries the
#   architect's own decree verbatim as its authority ("I do not like
#   to repeat myself") and settles a naming boundary explicitly: N6
#   names the legend panel Šurinnu, never Kudurru -- Kudurru remains
#   reserved for KAKIGIS's own beacon landmarks along Wadi al-Salam.
#
#   Landed from a standalone Architect-supplied upload (2026-08-23),
#   the second zip round from Sat20260822. See
#   shala-prototypes/batch20_nasaru_standard_agu_salmu_hypergraph/README.md
#   for the full account of this round, including a same-round upload
#   of the SUPERSEDED pre-correction "Kudurru Legend" draft (received,
#   deliberately not landed under that name -- this repo's own
#   docs/tus20260818-incoming/ already carries an extensive, unrelated
#   KAKIGIS Kudurru corpus, confirming the collision this tablet's own
#   N6 clause warns against is real in this repo, not hypothetical).
#   GL-VIZ-002 (referenced by N6 as "the Šurinnu Standard['s] grammar")
#   was never delivered as its own dedicated tablet -- only this
#   SALA-STD-001 standard, which folds the Šurinnu legend in as one of
#   eight mandatory instruments, was actually sealed.
#
# WHAT THIS PLAYBOOK DOES
#   PROVEs all eight mandatory instruments (N1 through N8) are named,
#   PROVEs the architect's decree is quoted verbatim as the tablet's
#   authority, and PROVEs the Naṣāru/Šurinnu closing line and the
#   Kudurru-reservation clause are sealed. PROVEs the Sala court
#   renders the Šurinnu stele's three cell-states as a controller and
#   names its own drop-in dependencies. Deposits nothing new -- docs
#   and Sala tab are committed directly into docs/ and
#   shala-prototypes/, this playbook is a pointer/verification record.
#
# Running this playbook = CSR-08 confirmation. Review -> --check -> live.
# =============================================================================

- name: "PB-596 | Seal the Naṣāru Instrument Standard (SALA-STD-001)"
  hosts: localhost
  connection: local
  become: false
  vars:
    repo_root: "{{ playbook_dir }}/.."
    tablet_file: "{{ repo_root }}/docs/09_observatory/SALA-STD-001_Nasaru_Instrument_Standard.md"
    court_file: "{{ repo_root }}/shala-prototypes/batch20_nasaru_standard_agu_salmu_hypergraph/sala_surinnu_legend_standard.html"

  tasks:

    - name: "0.1 | Confirm the tablet and the Sala court are landed"
      ansible.builtin.stat:
        path: "{{ item }}"
      register: land_stat
      loop:
        - "{{ tablet_file }}"
        - "{{ court_file }}"
      loop_control: { label: "{{ item }}" }

    - name: "FAIL | required file missing"
      ansible.builtin.fail:
        msg: "{{ item.item }} not found -- nothing to seal."
      loop: "{{ land_stat.results }}"
      loop_control: { label: "{{ item.item }}" }
      when: not item.stat.exists

    - name: "1.1 | PROVE all eight mandatory instruments (N1..N8) are named"
      ansible.builtin.shell: |
        set -e
        grep -qF "N1 · STORYENGINE" "{{ tablet_file }}"
        grep -qF "N2 · ZOOM & BOUNCE" "{{ tablet_file }}"
        grep -qF "N3 · LANDING-FROM-SPACE" "{{ tablet_file }}"
        grep -qF "N4 · BIRD-FLIGHT" "{{ tablet_file }}"
        grep -qF "N5 · RITES MENU & WORKBENCH" "{{ tablet_file }}"
        grep -qF "N6 · ŠURINNU STELE" "{{ tablet_file }}"
        grep -qF "N7 · COURT JOURNAL & HONESTY" "{{ tablet_file }}"
        grep -qF "N8 · THE GATES" "{{ tablet_file }}"
        echo "PROVEN: all eight mandatory instruments N1..N8 are named"
      register: prove_eight
      changed_when: false

    - name: "1.2 | PROVE the architect's decree is quoted verbatim as authority"
      ansible.builtin.shell: |
        set -e
        grep -qF "All these must be DEFAULT to any Šala" "{{ tablet_file }}"
        grep -qF "I do not like to repeat myself" "{{ tablet_file }}"
        echo "PROVEN: the architect's decree is sealed verbatim"
      register: prove_decree
      changed_when: false

    - name: "1.3 | PROVE the Kudurru-reservation clause is sealed"
      ansible.builtin.shell: |
        set -e
        grep -qF "Kudurru remains the sealed" "{{ tablet_file }}"
        grep -qF "never of panels" "{{ tablet_file }}"
        echo "PROVEN: the Kudurru-vs-Šurinnu naming boundary is sealed"
      register: prove_naming
      changed_when: false

    - name: "1.4 | PROVE the closing doctrine line is sealed"
      ansible.builtin.shell: |
        set -e
        grep -qF "The watcher's instruments are the watch itself" "{{ tablet_file }}"
        grep -qF "a court without them is a" "{{ tablet_file }}"
        echo "PROVEN: the closing doctrine is sealed"
      register: prove_closing
      changed_when: false

    - name: "1.5 | PROVE the Sala court renders the Šurinnu stele as a controller and names its drop-ins"
      ansible.builtin.shell: |
        set -e
        grep -qF "HOLLOW · FILLED · PULSING" "{{ court_file }}"
        grep -qF "bahyway_surinnu_legend.js" "{{ court_file }}"
        grep -qF "bahyway_nasaru_instruments.js" "{{ court_file }}"
        grep -qF "The Kudurru name is already sealed where it belongs" "{{ court_file }}"
        echo "PROVEN: the court renders the controller stele and honors the naming boundary"
      register: prove_court
      changed_when: false

    - name: "2.1 | Report"
      ansible.builtin.debug:
        msg: >
          PB-596 complete. SALA-STD-001 sealed: eight instruments
          (StoryEngine, zoom/bounce, Landing-from-Space, Bird-Flight,
          rites menu/Workbench, the Šurinnu stele, journal/honesty,
          compile+runtime gates) are now mandatory in every future
          Šala court, unasked. The legend panel is named Šurinnu, never
          Kudurru -- reserved for KAKIGIS's own beacon landmarks, a
          collision confirmed real in this very repo's
          docs/tus20260818-incoming/ corpus. See
          shala-prototypes/batch20_nasaru_standard_agu_salmu_hypergraph/README.md
          for the full round, including the superseded Kudurru-named
          draft received but not landed.
