# =============================================================================
# PB-568 — The Nasaru Alert Law: Concept Seal (GL-NSR-001)
# BahyWay.Ecosystem v4.0 — 2026-08-21
#
# WHY THIS PLAYBOOK EXISTS
#   Seals GL-NSR-001, MARKASU-01: Nasaru's first alert on motion rather
#   than position -- the early warning that homeostasis is failing
#   while position still looks healthy. The mooring model is an
#   Ornstein-Uhlenbeck process (dX = theta(mu-X)dt + sigma dW) around
#   a tribe's Apsu center; the alert fires only on two independent
#   witnesses agreeing (Witness A -- lag-1 autocorrelation reversion
#   rate; Witness B -- increment-variance reversion rate), each beyond
#   its own estimator epsilon, for W consecutive windows. One witness
#   alone journals as FUZZY -- no bell rings on a single estimator.
#
#   Landed from a parallel Claude session's Sat20260815 thread,
#   evaluated file-by-file against this repo before landing and
#   RENUMBERED per this repo's standing rule: the other session's own
#   PB-330 -> PB-568 here. See
#   shala-prototypes/batch12_nasaru_saturday_courts/README.md for the
#   full renumbering table. Its amendments (Temennu baseline and Rigmu
#   escalation) are sealed separately as PB-569/GL-NSR-001-A1.
#
# WHAT THIS PLAYBOOK DOES
#   PROVEs the tablet's own four stated law tests (L1-L4) are present
#   verbatim, and PROVEs both Sala court builds render the OU mooring
#   model and both named witnesses. Deposits nothing new -- docs and
#   Sala tab are committed directly into docs/ and shala-prototypes/,
#   this playbook is a pointer/verification record.
#
# Running this playbook = CSR-08 confirmation. Review -> --check -> live.
# =============================================================================

- name: "PB-568 | Seal the Nasaru Alert Law (GL-NSR-001)"
  hosts: localhost
  connection: local
  become: false
  vars:
    repo_root: "{{ playbook_dir }}/.."
    tablet_file: "{{ repo_root }}/docs/09_observatory/GL-NSR-001_Markasu_Alert_Law.md"
    batch_dir: "{{ repo_root }}/shala-prototypes/batch12_nasaru_saturday_courts"

  tasks:

    - name: "0.1 | Confirm the tablet and both court builds are landed"
      ansible.builtin.stat:
        path: "{{ item }}"
      register: land_stat
      loop:
        - "{{ tablet_file }}"
        - "{{ batch_dir }}/shala_markasu_court.html"
        - "{{ batch_dir }}/shala_markasu_court_v2.html"
      loop_control: { label: "{{ item }}" }

    - name: "FAIL | required file missing"
      ansible.builtin.fail:
        msg: "{{ item.item }} not found -- nothing to seal."
      loop: "{{ land_stat.results }}"
      loop_control: { label: "{{ item.item }}" }
      when: not item.stat.exists

    - name: "1.1 | PROVE the tablet's own four law tests (L1-L4) are sealed"
      ansible.builtin.shell: |
        set -e
        grep -qF "L1** — healthy tribe" "{{ tablet_file }}"
        grep -qF "L2** — scripted slackening" "{{ tablet_file }}"
        grep -qF "L3** — estimator consistency" "{{ tablet_file }}"
        grep -qF "L4** — two-witness enforced" "{{ tablet_file }}"
        echo "PROVEN: L1-L4 all present"
      register: prove_law_tests
      changed_when: false

    - name: "1.2 | PROVE the two-witness PROVE-form and OU mooring model are sealed"
      ansible.builtin.shell: |
        set -e
        grep -qF "dX = θ (μ − X) dt + σ dW" "{{ tablet_file }}"
        grep -qF "Witness A — the rope's memory" "{{ tablet_file }}"
        grep -qF "Witness B — the rope's slack" "{{ tablet_file }}"
        grep -qF "One witness alone → FUZZY observation, journaled, no bell" "{{ tablet_file }}"
        echo "PROVEN: OU mooring model and both named witnesses sealed, single-witness-no-bell rule sealed"
      register: prove_model
      changed_when: false

    - name: "1.3 | PROVE both court builds render the OU mooring model and both witnesses"
      ansible.builtin.shell: |
        set -e
        for f in shala_markasu_court.html shala_markasu_court_v2.html; do
          grep -qF "Ornstein" "{{ batch_dir }}/$f"
          grep -qF "mooring" "{{ batch_dir }}/$f"
          grep -qF "autocorrelation" "{{ batch_dir }}/$f"
        done
        echo "PROVEN: OU mooring model and autocorrelation witness render in both v1 and v2"
      register: prove_court
      changed_when: false

    - name: "2.1 | Report"
      ansible.builtin.debug:
        msg: >
          PB-568 complete. GL-NSR-001 sealed: MARKASU-01, Nasaru's
          first motion alert -- the OU mooring model, the mandatory
          two-witness PROVE-form (autocorrelation reversion rate +
          increment-variance reversion rate, both required, W
          consecutive windows), and the single-witness-journals-FUZZY-
          no-bell rule -- all hold, proven against the tablet's own
          four stated law tests L1-L4. Both Sala court builds render
          the mooring model and the autocorrelation witness.
          Renumbered from the source session's PB-330; see
          shala-prototypes/batch12_nasaru_saturday_courts/README.md for
          the full renumbering table.
