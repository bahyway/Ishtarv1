---
# ════════════════════════════════════════════════════════════════════════════
#  playbook_116_enki_terra_suite_wire_reconciled.yml
#  BahyWay.Ecosystem v4.0 — PB-116 Reconciled: already tried, already corrected
#
#  SCP to EriduOS-VDI then run:
#    ansible-playbook playbook_116_enki_terra_suite_wire_reconciled.yml -i "localhost," -c local -v
#
#  Why this file exists (not the original playbook_116_enki_terra_suite_wire.yml):
#    This is the strongest supersession finding in this whole batch: the
#    real repo's ashnan-ingest crate carries this exact comment in its
#    own source (crates/ashnan-ingest/src/lib.rs):
#
#      "Redesigned against the real bridge API — an earlier playbook
#       draft (PB-116) assumed FileProvenance / NaruJournal /
#       SchemaRegistry types that were never actually implemented in
#       naramsin-bridge."
#
#    That is THIS EXACT UPLOADED PLAYBOOK, already identified as wrong
#    and already fixed, by a prior session, before this one even started.
#    nanshe-ingest, esarhaddon-ingest, and ashnan-ingest all already
#    exist, all wired against the real naramsin-bridge::process()
#    signature (not the FileProvenance/NaruJournal/SchemaRegistry one
#    this upload assumes).
#
#    This file verifies the real, corrected crates:
#      nanshe-ingest     : 3 passed
#      esarhaddon-ingest : 3 passed
#      ashnan-ingest      : 3 passed
# ════════════════════════════════════════════════════════════════════════════
- name: "PB-116 (Reconciled) | ENKI-TERRA ingest crates — already real, already corrected"
  hosts: localhost
  connection: local
  gather_facts: true

  vars:
    forge_root:    "{{ ansible_env.HOME }}/Forge/EnkiDB"
    workspace:     "{{ forge_root }}/workspace/bahyway_v4"
    cargo:         "{{ ansible_env.HOME }}/.cargo/bin/cargo"
    target_branch: "claude/iphone-playbooks-crosstribe-eval-nbc5sw"
    session_date:  "{{ ansible_date_time.date }}"
    docs_dir:      "{{ forge_root }}/docs/SHEDU"
    report_file:   "{{ docs_dir }}/PB116_RECONCILED_{{ session_date }}.txt"

  tasks:

    - name: "PREP | Ensure report dir exists"
      ansible.builtin.file: { path: "{{ docs_dir }}", state: directory, mode: "0755" }

    - name: "VERIFY | Workspace present (scp'd from laptop)"
      ansible.builtin.stat:
        path: "{{ workspace }}/Cargo.toml"
      register: ws_check

    - name: "FAIL | Workspace not synced — run the laptop-side sync first"
      ansible.builtin.fail:
        msg: >
          {{ workspace }}/Cargo.toml not found on this host. EriduOS-VDI has
          no GitHub access. On your Fedora laptop: git pull origin
          {{ target_branch }}, then scp -r workspace/bahyway_v4
          bahaa@eriduos-vdi:{{ workspace }}. Re-run this playbook after that.
      when: not ws_check.stat.exists

    - name: "CHECK | Confirm the repo's own self-correction comment is present"
      ansible.builtin.command:
        cmd: "grep -c 'never actually implemented in .naramsin-bridge' {{ workspace }}/crates/ashnan-ingest/src/lib.rs"
      register: self_correction_check
      changed_when: false
      failed_when: false

    - name: "TEST | cargo test -p nanshe-ingest"
      ansible.builtin.command:
        cmd: "{{ cargo }} test -p nanshe-ingest"
        chdir: "{{ workspace }}"
      register: test_nanshe
      changed_when: false
      failed_when: test_nanshe.rc != 0

    - name: "ASSERT | nanshe-ingest reports 3 passed"
      ansible.builtin.assert:
        that: ["((test_nanshe.stdout | regex_search('([0-9]+) passed', '\\\\1') | first | int) >= 3)", "'0 failed' in test_nanshe.stdout"]
        fail_msg: "Expected '3 passed; 0 failed'. Got: {{ test_nanshe.stdout }}"
        success_msg: "nanshe-ingest: 3/3 confirmed."

    - name: "TEST | cargo test -p esarhaddon-ingest"
      ansible.builtin.command:
        cmd: "{{ cargo }} test -p esarhaddon-ingest"
        chdir: "{{ workspace }}"
      register: test_esar
      changed_when: false
      failed_when: test_esar.rc != 0

    - name: "ASSERT | esarhaddon-ingest reports 3 passed"
      ansible.builtin.assert:
        that: ["((test_esar.stdout | regex_search('([0-9]+) passed', '\\\\1') | first | int) >= 3)", "'0 failed' in test_esar.stdout"]
        fail_msg: "Expected '3 passed; 0 failed'. Got: {{ test_esar.stdout }}"
        success_msg: "esarhaddon-ingest: 3/3 confirmed."

    - name: "TEST | cargo test -p ashnan-ingest"
      ansible.builtin.command:
        cmd: "{{ cargo }} test -p ashnan-ingest"
        chdir: "{{ workspace }}"
      register: test_ashnan
      changed_when: false
      failed_when: test_ashnan.rc != 0

    - name: "ASSERT | ashnan-ingest reports 3 passed"
      ansible.builtin.assert:
        that: ["((test_ashnan.stdout | regex_search('([0-9]+) passed', '\\\\1') | first | int) >= 3)", "'0 failed' in test_ashnan.stdout"]
        fail_msg: "Expected '3 passed; 0 failed'. Got: {{ test_ashnan.stdout }}"
        success_msg: "ashnan-ingest: 3/3 confirmed."

    - name: "WRITE | Report"
      ansible.builtin.copy:
        dest: "{{ report_file }}"
        mode: "0644"
        content: |
          BahyWay.Ecosystem v4.0 — PB-116 Reconciled Report
          Date : {{ session_date }}

          Original PB-116 assumed FileProvenance/NaruJournal/
          SchemaRegistry types in naramsin-bridge that were never
          implemented. Confirmed this is not a new finding — the repo's
          own ashnan-ingest source already documents this exact mistake
          and its correction (self-correction comment found: {{ 'yes' if (self_correction_check.stdout | trim | int) > 0 else 'not found — check manually' }}).

          Verified this run (real, corrected crates):
            nanshe-ingest      : 3/3 tests PASS
            esarhaddon-ingest  : 3/3 tests PASS
            ashnan-ingest       : 3/3 tests PASS

    - name: "DONE | PB-116 Reconciled COMPLETE"
      ansible.builtin.debug:
        msg: "PB-116 reconciled — real corrected crates verified. Report: {{ report_file }}"
