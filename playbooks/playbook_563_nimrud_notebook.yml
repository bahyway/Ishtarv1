# =============================================================================
# PB-563 — Nimrud Notebook: Interrogation Stage Seal (GL-NTB-001)
# BahyWay.Ecosystem v4.0 — 2026-08-20
#
# WHY THIS PLAYBOOK EXISTS
#   Seals GL-NTB-001, the read-only stakeholder console over the whole
#   Nimrud arc: HeptaScript cells whose results render as four joined
#   views -- Orbit, Data, Membrane, Particles -- all bound on one key,
#   the hepta-address x epoch window (GL-NIM-002 Clause P4). Stage
#   never truth (GL-DST-001): the Notebook reads OntoGraph and sealed
#   verdicts, writes nothing past its own journal, and EMIT is disabled
#   in rehearsal. SQL is refused at parse, not errored -- a SELECT cell
#   gets the same refusal-record dignity as any unborn thing. Doctrine
#   under GL-STK-001 (PB-560), binds GL-DST-001, GL-NIM-001, GL-NIM-002.
#   CONCEPT DOCUMENT ONLY, landed as a Sala rehearsal.
#
#   Landed from the same Thu20260820 "Nimrud Stack" thread, renumbered
#   from the source session's PB-356 per this repo's standing rule --
#   see shala-prototypes/batch10_nimrud_stack/README.md.
#
# GUARDED BOUNDARY:
#   A view never strips the epistemic class (Clause B4) -- a chart of
#   an estimate is still an estimate, and says so on its face.
#
# WHAT THIS PLAYBOOK DOES
#   PROVEs the language law (B1: HeptaScript-only, SQL refused at
#   parse), stage-never-truth (B2), the address-as-join-key (B3), and
#   the Sala notebook's four view cells plus its one SQL refusal cell
#   (L91-L94) are present.
#
# Running this playbook = CSR-08 confirmation. Review -> --check -> live.
# =============================================================================

- name: "PB-563 | Seal the Nimrud Notebook (GL-NTB-001)"
  hosts: localhost
  connection: local
  become: false
  vars:
    repo_root: "{{ playbook_dir }}/.."
    tablet_file: "{{ repo_root }}/docs/09_observatory/GL-NTB-001_Nimrud_Notebook.md"
    notebook_file: "{{ repo_root }}/shala-prototypes/batch10_nimrud_stack/shala_nimrud_notebook.html"

  tasks:

    - name: "0.1 | Confirm the tablet and the Sala notebook are landed"
      ansible.builtin.stat:
        path: "{{ item }}"
      register: land_stat
      loop:
        - "{{ tablet_file }}"
        - "{{ notebook_file }}"
      loop_control: { label: "{{ item }}" }

    - name: "FAIL | required file missing"
      ansible.builtin.fail:
        msg: "{{ item.item }} not found -- nothing to seal."
      loop: "{{ land_stat.results }}"
      loop_control: { label: "{{ item.item }}" }
      when: not item.stat.exists

    - name: "1.1 | PROVE B1 -- HeptaScript-only, SQL refused at parse"
      ansible.builtin.shell: |
        set -e
        grep -q "HeptaScript v1.1" "{{ tablet_file }}"
        grep -q "SQL is refused at parse" "{{ tablet_file }}"
        echo "PROVEN: language law states HeptaScript-only, SQL explicitly refused at parse (not errored)"
      register: prove_b1
      changed_when: false

    - name: "1.2 | PROVE B2 + B3 -- stage never truth, address is the join key"
      ansible.builtin.shell: |
        set -e
        grep -q "Stage Never Truth" "{{ tablet_file }}"
        grep -q "EMIT is disabled" "{{ tablet_file }}"
        grep -qi "join key" "{{ tablet_file }}"
        echo "PROVEN: read-only stage, EMIT disabled in rehearsal, hepta-address x epoch stated as the join key"
      register: prove_b2b3
      changed_when: false

    - name: "1.3 | PROVE B4 -- stamps travel into every view"
      ansible.builtin.shell: |
        set -e
        grep -q "A view never strips the class" "{{ tablet_file }}"
        echo "PROVEN: epistemic-class-preservation clause present"
      register: prove_b4
      changed_when: false

    - name: "1.4 | PROVE L91-L94 -- the Sala notebook renders all four views and the SQL refusal cell"
      ansible.builtin.shell: |
        set -e
        grep -qi "orbit view" "{{ notebook_file }}"
        grep -qi "data view" "{{ notebook_file }}"
        grep -qi "membrane view" "{{ notebook_file }}"
        grep -qi "particles view" "{{ notebook_file }}"
        grep -q "SELECT \* FROM" "{{ notebook_file }}"
        grep -q "REHEARSAL DATA" "{{ notebook_file }}"
        echo "PROVEN: all four view cells present, SQL cell present (for refusal), REHEARSAL banner present"
      register: prove_notebook
      changed_when: false

    - name: "2.1 | Report"
      ansible.builtin.debug:
        msg: >
          PB-563 complete. GL-NTB-001 sealed: every cell speaks
          HeptaScript v1.1 only, with SQL refused at parse rather than
          errored; the Notebook reads OntoGraph and sealed verdicts but
          writes nothing past its own append-only journal, with EMIT
          disabled in rehearsal; all four views (Orbit, Data, Membrane,
          Particles) bind on one join key, the hepta-address times
          epoch window, and never strip the epistemic class off a
          value. The Sala notebook renders all four view cells plus the
          struck-through SELECT cell whose refusal record is the point.
          Renumbered from the source session's PB-356; see
          shala-prototypes/batch10_nimrud_stack/README.md.
