# =============================================================================
# PB-599 — The Ummânu Law: Concept Seal (GL-HSQ-002)
# BahyWay.Ecosystem v4.0 — 2026-08-23
#
# WHY THIS PLAYBOOK EXISTS
#   Seals GL-HSQ-002: every proposed HeptaScript clause, vessel kind,
#   or shelf enrollment enters algebra_schema as a FUZZY particle and
#   exits through exactly two doors -- FUZZY -> GOLDEN when all six
#   review seats pass and the King seals via CSR-08, or FUZZY -> DEAD
#   the instant any seat refuses, archived forever with its reason
#   inscribed (§2). An undecided proposal auto-routes to DEAD as
#   LAPSED -- the language never accumulates maybes. Six seats vote as
#   gates, unanimously, never by majority (§3-4); a per-era Complexity
#   Budget (seven clauses for the Gudea era) forces one-in-one-out
#   growth (§5); every sitting is recorded in the append-only NĀRU
#   journal (§6).
#
#   Landed from a standalone Architect-supplied upload (2026-08-23),
#   the third zip round from Sat20260822. Evaluated file-by-file
#   against this repo before landing and RENUMBERED per this repo's
#   standing rule: the source deposit's own PB-HSQ-002 -> PB-599 here.
#   See shala-prototypes/batch21_shetu_tirku_ummanu/README.md for the
#   full renumbering table and the open dependency-gap note (this
#   tablet's parent EN-DDB-004/Eṭemmu, the Ghost Logarithm, is not
#   delivered and does not exist anywhere in this repo).
#
# WHAT THIS PLAYBOOK DOES
#   PROVEs the tablet's own four stated proof obligations (UMN-PO-1
#   through UMN-PO-4) are named, PROVEs the FUZZY-to-GOLDEN/DEAD
#   lifecycle, the unanimous-gate quorum rule, and the Complexity
#   Budget's one-in-one-out clause are sealed verbatim. PROVEs the
#   Sala court (the Ummânu Court) renders a full sitting that passes to
#   the King's Seal and three crafted violations each dying at a named
#   seat. Deposits nothing new -- docs and Sala tab are committed
#   directly into docs/ and shala-prototypes/, this playbook is a
#   pointer/verification record.
#
# Running this playbook = CSR-08 confirmation. Review -> --check -> live.
# =============================================================================

- name: "PB-599 | Seal the Ummânu Law (GL-HSQ-002)"
  hosts: localhost
  connection: local
  become: false
  vars:
    repo_root: "{{ playbook_dir }}/.."
    tablet_file: "{{ repo_root }}/docs/09_observatory/GL-HSQ-002_Ummanu_Law.md"
    court_file: "{{ repo_root }}/shala-prototypes/batch21_shetu_tirku_ummanu/sala_gl_hsq_002_ummanu_court.html"

  tasks:

    - name: "0.1 | Confirm the tablet and the Sala court are landed"
      ansible.builtin.stat:
        path: "{{ item }}"
      register: land_stat
      loop:
        - "{{ tablet_file }}"
        - "{{ court_file }}"
      loop_control: { label: "{{ item }}" }

    - name: "FAIL | required file missing"
      ansible.builtin.fail:
        msg: "{{ item.item }} not found -- nothing to seal."
      loop: "{{ land_stat.results }}"
      loop_control: { label: "{{ item.item }}" }
      when: not item.stat.exists

    - name: "1.1 | PROVE the tablet's own four proof obligations (UMN-PO-1..4) are named"
      ansible.builtin.shell: |
        set -e
        grep -qF "UMN-PO-1" "{{ tablet_file }}"
        grep -qF "UMN-PO-2" "{{ tablet_file }}"
        grep -qF "UMN-PO-3" "{{ tablet_file }}"
        grep -qF "UMN-PO-4" "{{ tablet_file }}"
        echo "PROVEN: UMN-PO-1..4 all present"
      register: prove_pos
      changed_when: false

    - name: "1.2 | PROVE the FUZZY-to-GOLDEN/DEAD lifecycle is sealed verbatim"
      ansible.builtin.shell: |
        set -e
        grep -qF "FUZZY → GOLDEN" "{{ tablet_file }}"
        grep -qF "FUZZY → DEAD" "{{ tablet_file }}"
        grep -qF "auto-routes to DEAD as" "{{ tablet_file }}"
        echo "PROVEN: the FUZZY-to-GOLDEN/DEAD lifecycle and LAPSED auto-route are sealed"
      register: prove_lifecycle
      changed_when: false

    - name: "1.3 | PROVE all six seats are named"
      ansible.builtin.shell: |
        set -e
        grep -qF "SEAT I · KULLA" "{{ tablet_file }}"
        grep -qF "SEAT II · ASKUPPU" "{{ tablet_file }}"
        grep -qF "SEAT III · MUMMU" "{{ tablet_file }}"
        grep -qF "SEAT IV · EṬEMMU" "{{ tablet_file }}"
        grep -qF "SEAT V · KANĪKU" "{{ tablet_file }}"
        grep -qF "SEAT VI · THE KING'S SEAL" "{{ tablet_file }}"
        echo "PROVEN: all six review seats are named"
      register: prove_seats
      changed_when: false

    - name: "1.4 | PROVE the unanimous-gate quorum and the Complexity Budget are sealed"
      ansible.builtin.shell: |
        set -e
        grep -qF "vote as **gates, unanimously — AND, never majority**" "{{ tablet_file }}"
        grep -qF "clause budget" "{{ tablet_file }}"
        grep -qF "one-in, one-out" "{{ tablet_file }}"
        echo "PROVEN: unanimous gating and the Complexity Budget are sealed"
      register: prove_budget
      changed_when: false

    - name: "1.5 | PROVE the Sala court renders a full sitting and three named-seat refusals"
      ansible.builtin.shell: |
        set -e
        grep -qF "FUZZY dock" "{{ court_file }}"
        grep -qF "GOLDEN dais" "{{ court_file }}"
        grep -qF "house of the DEAD" "{{ court_file }}"
        grep -qF "dies at KULLA" "{{ court_file }}"
        grep -qF "ASKUPPU" "{{ court_file }}"
        grep -qF "MUMMU" "{{ court_file }}"
        echo "PROVEN: the Ummânu Court renders the crescent and three crafted refusals"
      register: prove_court
      changed_when: false

    - name: "2.1 | Report"
      ansible.builtin.debug:
        msg: >
          PB-599 complete. GL-HSQ-002 sealed: every HeptaScript
          proposal enters FUZZY and exits only through GOLDEN (all six
          seats pass, King seals via CSR-08) or DEAD (any seat refuses,
          archived with its reason forever); seats vote as unanimous
          gates in a fixed order; a per-era Complexity Budget forces
          one-in-one-out growth; the NĀRU journal remembers every
          sitting. Renumbered from the source deposit's PB-HSQ-002; see
          shala-prototypes/batch21_shetu_tirku_ummanu/README.md for the
          full renumbering table and the open note on EN-DDB-004
          (Eṭemmu), named as a parent but not yet landed.
