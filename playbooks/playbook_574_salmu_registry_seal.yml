# =============================================================================
# PB-574 — The Ṣalmu Registry: Concept Seal (GL-SHP-001)
# BahyWay.Ecosystem v4.0 — 2026-08-21
#
# WHY THIS PLAYBOOK EXISTS
#   Seals GL-SHP-001, the closed registry of eight named simplicial
#   standard shapes (RĪQU/EPERU/ŠIBIRTU/ḪARRĀNU/KIPPATU/MAŠTABBA/
#   USKARU/KIRṢU), each with a BWVL glyph, three witness classes
#   (Betti at ε, the Barû persistence sweep, mass geometry), and the
#   Apsu Vacancy Principle: in Orbit-Oriented Ontology the center is
#   empty by law, so a filled interior (KIRṢU) is never a style -- it
#   is a fabricated-interior finding demanding per-particle provenance
#   before the GL-DST-004 bench may approve. The sealed classification
#   order (chambers tested before elongation) makes every tribe
#   classify to exactly one glyph, deterministically.
#
#   Landed from a parallel Claude session's Sun20260816 thread,
#   evaluated file-by-file against this repo before landing and
#   RENUMBERED per this repo's standing rule: the other session's own
#   PB-335 -> PB-574 here. See
#   shala-prototypes/batch13_sunday_shape_labiru_courts/README.md for
#   the full renumbering table.
#
# WHAT THIS PLAYBOOK DOES
#   PROVEs the tablet's own four stated law tests (L17-L20) are
#   present, PROVEs all eight registry entries and the Apsu Vacancy
#   Principle are sealed, and PROVEs the Sala gallery renders all
#   eight glyph names. Deposits nothing new -- docs and Sala tab are
#   committed directly into docs/ and shala-prototypes/, this playbook
#   is a pointer/verification record.
#
# Running this playbook = CSR-08 confirmation. Review -> --check -> live.
# =============================================================================

- name: "PB-574 | Seal the Ṣalmu Registry (GL-SHP-001)"
  hosts: localhost
  connection: local
  become: false
  vars:
    repo_root: "{{ playbook_dir }}/.."
    tablet_file: "{{ repo_root }}/docs/09_observatory/GL-SHP-001_Salmu_Registry.md"
    court_file: "{{ repo_root }}/shala-prototypes/batch13_sunday_shape_labiru_courts/shala_salmu_gallery.html"

  tasks:

    - name: "0.1 | Confirm the tablet and the Sala gallery are landed"
      ansible.builtin.stat:
        path: "{{ item }}"
      register: land_stat
      loop:
        - "{{ tablet_file }}"
        - "{{ court_file }}"
      loop_control: { label: "{{ item }}" }

    - name: "FAIL | required file missing"
      ansible.builtin.fail:
        msg: "{{ item.item }} not found -- nothing to seal."
      loop: "{{ land_stat.results }}"
      loop_control: { label: "{{ item.item }}" }
      when: not item.stat.exists

    - name: "1.1 | PROVE the tablet's own four law tests (L17-L20) are sealed"
      ansible.builtin.shell: |
        set -e
        grep -qF "L17" "{{ tablet_file }}"
        grep -qF "L18" "{{ tablet_file }}"
        grep -qF "L19" "{{ tablet_file }}"
        grep -qF "L20" "{{ tablet_file }}"
        grep -qF "hoop→KIPPATU" "{{ tablet_file }}"
        grep -qF "crescent→USKARU, never KIRṢU" "{{ tablet_file }}"
        grep -qF "history flips EPERU→ŠIBIRTU" "{{ tablet_file }}"
        echo "PROVEN: L17-L20 all present with their named assertions"
      register: prove_law_tests
      changed_when: false

    - name: "1.2 | PROVE all eight registry entries and the Apsu Vacancy Principle are sealed"
      ansible.builtin.shell: |
        set -e
        for glyph in RĪQU EPERU ŠIBIRTU ḪARRĀNU KIPPATU MAŠTABBA USKARU KIRṢU; do
          grep -qF "$glyph" "{{ tablet_file }}"
        done
        grep -qF "Apsu Vacancy Principle" "{{ tablet_file }}"
        grep -qF "center occupation is a finding, not a style" "{{ tablet_file }}"
        echo "PROVEN: all eight registry entries and the Apsu Vacancy Principle are sealed"
      register: prove_registry
      changed_when: false

    - name: "1.3 | PROVE the Sala gallery renders all eight named forms"
      ansible.builtin.shell: |
        set -e
        for glyph in RĪQU EPERU ŠIBIRTU ḪARRĀNU KIPPATU MAŠTABBA USKARU KIRṢU; do
          grep -qF "$glyph" "{{ court_file }}"
        done
        grep -qF "Apsu" "{{ court_file }}"
        echo "PROVEN: all eight forms and the Apsu center render in the deployed gallery"
      register: prove_gallery
      changed_when: false

    - name: "2.1 | Report"
      ansible.builtin.debug:
        msg: >
          PB-574 complete. GL-SHP-001 sealed: the eight-form closed
          registry with its BWVL glyphs, the three witness classes
          (Betti/Barû sweep/mass geometry), the Apsu Vacancy Principle
          (a filled orbit center is a fabricated-interior finding, not
          a style), the history-aware EPERU/ŠIBIRTU split, the
          USKARU-never-KIRṢU distinction, and the sealed total
          classification order all hold, proven against the tablet's
          own four stated law tests L17-L20. The Sala gallery renders
          all eight forms with the Apsu center. Renumbered from the
          source session's PB-335; see
          shala-prototypes/batch13_sunday_shape_labiru_courts/README.md
          for the full renumbering table.
