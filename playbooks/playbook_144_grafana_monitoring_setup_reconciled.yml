---
# ════════════════════════════════════════════════════════════════════════════
#  playbook_144_grafana_monitoring_setup_reconciled.yml
#  BahyWay.Ecosystem v4.0 — PB-144 Reconciled: configs written locally,
#  remote deploy gated on real reachability
#
#  SCP to EriduOS-VDI then run:
#    ansible-playbook playbook_144_grafana_monitoring_setup_reconciled.yml -i "localhost," -c local -v
#
#  Why this file exists (there are now TWO playbook_144 files in the repo):
#    - playbook_144_grafana_monitoring_setup.yml (already in repo, fixed by
#      an earlier session): honest but minimal — only pings SSH/port 3000
#      on dubsar-workstation and reports reachable/not-reachable. Writes
#      nothing.
#    - The newly uploaded playbook_144_grafana_monitoring_setup.yml:
#      unconditionally SSHes `sudo tee` config into dubsar-workstation with
#      ignore_errors: true on every task and no reachability check first —
#      so on a host that isn't provisioned yet, every task silently
#      "succeeds" while doing nothing, which is worse than the existing
#      honest version.
#    This reconciled version keeps what's useful from both: it always
#    writes the real Prometheus scrape config + 3 Grafana dashboard JSONs
#    + datasource/provisioner config as local artifacts under
#    config/grafana/ (so they're ready to deploy the moment the hardware
#    exists — genuinely useful prep work, no infra required). It only
#    attempts the SSH deploy + service restart if dubsar-workstation is
#    confirmed reachable on SSH and the target ports; otherwise it reports
#    BLOCKED honestly, same as the existing repo playbook_144, instead of
#    masking failures with ignore_errors.
# ════════════════════════════════════════════════════════════════════════════
- name: "PB-144 (Reconciled) | Grafana+Prometheus configs generated, deploy gated on reachability"
  hosts: localhost
  connection: local
  gather_facts: true

  vars:
    forge_root:         "{{ ansible_env.HOME }}/Forge/EnkiDB"
    config_dir:         "{{ forge_root }}/config/grafana"
    docs_dir:            "{{ forge_root }}/docs/SHEDU"
    session_date:        "{{ ansible_date_time.date }}"
    report_file:         "{{ docs_dir }}/PB144_RECONCILED_{{ session_date }}.txt"

    monitoring_ip:       "192.168.122.121"   # dubsar-workstation — monitoring ONLY
    node_write_ip:       "192.168.122.101"
    node_read_ip:        "192.168.122.107"
    eriduous_ip:         "192.168.122.214"

    grafana_port:        3000
    prometheus_port:     9090
    enkidb_metrics_port: 7002

    prom_config:         "/etc/prometheus/prometheus.yml"
    grafana_ds_dir:      "/etc/grafana/provisioning/datasources"
    grafana_dash_dir:    "/etc/grafana/provisioning/dashboards"
    grafana_json_dir:    "/var/lib/grafana/dashboards"

  tasks:

    - name: "PREP  | Ensure local config + docs dirs exist"
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ config_dir }}"
        - "{{ docs_dir }}"

    # ── Always write local artifacts — no infra required ────────────────────
    - name: "WRITE | prometheus.yml (local artifact)"
      ansible.builtin.copy:
        dest: "{{ config_dir }}/prometheus.yml"
        mode: "0644"
        content: |
          # BahyWay.Ecosystem v4.0 — Prometheus scrape config
          # Generated by PB-144 (reconciled) on {{ session_date }}
          global:
            scrape_interval:     15s
            evaluation_interval: 15s
            external_labels:
              bahyway_version: "v4.0"
              environment:     "sovereign"

          scrape_configs:
            - job_name: "enkidb_node_write"
              static_configs:
                - targets: ["{{ node_write_ip }}:{{ enkidb_metrics_port }}"]
                  labels: { node_role: "write", tribe: "cqrs_write" }
            - job_name: "enkidb_node_read"
              static_configs:
                - targets: ["{{ node_read_ip }}:{{ enkidb_metrics_port }}"]
                  labels: { node_role: "read", tribe: "cqrs_read" }
            - job_name: "eriduous_vdi"
              static_configs:
                - targets: ["{{ eriduous_ip }}:9100"]
                  labels: { node_role: "dev_control_plane" }
            - job_name: "dubsar_workstation"
              static_configs:
                - targets: ["localhost:9100"]
                  labels: { node_role: "monitoring" }

    - name: "WRITE | Grafana Prometheus datasource (local artifact)"
      ansible.builtin.copy:
        dest: "{{ config_dir }}/bahyway_prometheus_datasource.yaml"
        mode: "0644"
        content: |
          apiVersion: 1
          datasources:
            - name:      BahyWay_Prometheus
              type:      prometheus
              url:       http://localhost:{{ prometheus_port }}
              isDefault: true
              access:    proxy
              jsonData:
                timeInterval: "15s"

    - name: "WRITE | Grafana dashboard provisioner config (local artifact)"
      ansible.builtin.copy:
        dest: "{{ config_dir }}/bahyway_dashboards_provisioner.yaml"
        mode: "0644"
        content: |
          apiVersion: 1
          providers:
            - name:            BahyWay_v4
              folder:          BahyWay v4.0
              type:            file
              disableDeletion: true
              options:
                path: {{ grafana_json_dir }}

    - name: "WRITE | Grafana dashboard — EnkiDB CQRS Health (local artifact)"
      ansible.builtin.copy:
        dest: "{{ config_dir }}/bahyway_enkidb_cqrs.json"
        mode: "0644"
        content: |
          {
            "title": "BahyWay v4.0 — EnkiDB CQRS Health",
            "uid":   "bahyway-enkidb-cqrs",
            "tags":  ["bahyway", "enkidb", "cqrs"],
            "panels": [
              {"title": "KISPU Commit Rate (write node)", "type": "stat",
               "targets": [{"expr": "rate(enkidb_kispu_commits_total{node_role=\"write\"}[1m])"}]},
              {"title": "Query Latency p99 (read node)", "type": "gauge",
               "targets": [{"expr": "enkidb_query_latency_p99{node_role=\"read\"}"}]},
              {"title": "NĀRU Journal Entry Rate", "type": "graph",
               "targets": [{"expr": "rate(enkidb_naru_entries_total[5m])"}]}
            ]
          }

    - name: "WRITE | Grafana dashboard — ENKI-TERRA Module Status (local artifact)"
      ansible.builtin.copy:
        dest: "{{ config_dir }}/bahyway_enki_terra.json"
        mode: "0644"
        content: |
          {
            "title": "BahyWay v4.0 — ENKI-TERRA Module Status",
            "uid":   "bahyway-enki-terra",
            "tags":  ["bahyway", "nanshe", "ashnan"],
            "panels": [
              {"title": "ASHNAN CMI — Diyala (24h max)", "type": "gauge",
               "targets": [{"expr": "max_over_time(ashnan_cmi{tribe_id=\"ashnan_diyala\"}[24h])"}]},
              {"title": "NANSHE BMI — Diyala River", "type": "gauge",
               "targets": [{"expr": "nanshe_bmi{tribe_id=\"nanshe_diyala\"}"}]}
            ]
          }
      # NOTE (reconciled): the uploaded original also included ESARHADDON SMI
      # and INANA Tribe Gravity panels. Those metrics have no source — the
      # ESARHADDON and INANA crates referenced (PB-119-136) do not exist in
      # this repo (see docs/13_changelog/RM-001_ADDENDUM_PB111-145_VERIFIED_2026-07-01.md).
      # Dropped those two panels rather than ship a dashboard that queries
      # metrics nothing will ever emit.

    - name: "WRITE | Grafana dashboard — UrNammu Security Events (local artifact)"
      ansible.builtin.copy:
        dest: "{{ config_dir }}/bahyway_urnammu_security.json"
        mode: "0644"
        content: |
          {
            "title": "BahyWay v4.0 — UrNammu Security Events",
            "uid":   "bahyway-urnammu",
            "tags":  ["bahyway", "urnammu", "shedu", "security"],
            "panels": [
              {"title": "Boot Attestation Result (last 24h)", "type": "stat",
               "targets": [{"expr": "urnammu_attestation_result"}]},
              {"title": "Kittu Alert Delivery Rate", "type": "graph",
               "targets": [{"expr": "rate(kittu_alerts_delivered_total[5m])"}]}
            ]
          }
      # NOTE (reconciled): dropped the "usbguard Block Events" panel from the
      # original — urnammu-attestationd (PB-137, real) has no usbguard
      # integration; that metric has no emitter.

    # ── Gate remote deploy on real reachability ─────────────────────────────
    - name: "CHECK | dubsar-workstation SSH reachable"
      ansible.builtin.wait_for: { host: "{{ monitoring_ip }}", port: 22, timeout: 3 }
      register: dubsar_ssh
      ignore_errors: true

    - name: "CHECK | Grafana port reachable, if host is up"
      ansible.builtin.wait_for: { host: "{{ monitoring_ip }}", port: "{{ grafana_port }}", timeout: 3 }
      register: grafana_live
      ignore_errors: true
      when: dubsar_ssh is succeeded

    - name: "CHECK | Prometheus port reachable, if host is up"
      ansible.builtin.wait_for: { host: "{{ monitoring_ip }}", port: "{{ prometheus_port }}", timeout: 3 }
      register: prom_live
      ignore_errors: true
      when: dubsar_ssh is succeeded

    - name: "DEPLOY| Copy configs to dubsar-workstation (only if reachable)"
      ansible.builtin.shell: |
        scp -o StrictHostKeyChecking=no "{{ config_dir }}/prometheus.yml" bahaa@{{ monitoring_ip }}:/tmp/prometheus.yml
        ssh -o StrictHostKeyChecking=no bahaa@{{ monitoring_ip }} "sudo mv /tmp/prometheus.yml {{ prom_config }} && \
          sudo mkdir -p {{ grafana_ds_dir }} {{ grafana_dash_dir }} {{ grafana_json_dir }}"
        scp -o StrictHostKeyChecking=no "{{ config_dir }}/bahyway_prometheus_datasource.yaml" bahaa@{{ monitoring_ip }}:/tmp/
        scp -o StrictHostKeyChecking=no "{{ config_dir }}/bahyway_dashboards_provisioner.yaml" bahaa@{{ monitoring_ip }}:/tmp/
        scp -o StrictHostKeyChecking=no "{{ config_dir }}"/bahyway_*.json bahaa@{{ monitoring_ip }}:/tmp/
        ssh -o StrictHostKeyChecking=no bahaa@{{ monitoring_ip }} "\
          sudo mv /tmp/bahyway_prometheus_datasource.yaml {{ grafana_ds_dir }}/ && \
          sudo mv /tmp/bahyway_dashboards_provisioner.yaml {{ grafana_dash_dir }}/ && \
          sudo mv /tmp/bahyway_*.json {{ grafana_json_dir }}/ && \
          sudo systemctl restart prometheus grafana-server"
      register: deploy_result
      when: dubsar_ssh is succeeded and grafana_live is succeeded and prom_live is succeeded
      failed_when: deploy_result.rc is defined and deploy_result.rc != 0

    - name: "PRINT | PB-144 status"
      ansible.builtin.debug:
        msg: |
          Local configs written to: {{ config_dir }}/
          dubsar-workstation SSH : {{ 'reachable' if dubsar_ssh is succeeded else 'NOT reachable' }}
          {{ 'Deployed to dubsar-workstation and services restarted.'
             if (dubsar_ssh is succeeded and grafana_live is succeeded and prom_live is succeeded)
             else 'BLOCKED — dubsar-workstation not provisioned with Prometheus/Grafana yet. Configs are ready in ' + config_dir + '/ for manual or future deploy.' }}

    - name: "WRITE | Report"
      ansible.builtin.copy:
        dest: "{{ report_file }}"
        mode: "0644"
        content: |
          BahyWay.Ecosystem v4.0 — PB-144 Reconciled Report
          Date    : {{ session_date }}
          Configs : {{ config_dir }}/ (prometheus.yml, datasource, provisioner, 3 dashboard JSONs)
          Remote  : dubsar-workstation ({{ monitoring_ip }})
            SSH reachable      : {{ dubsar_ssh is succeeded }}
            Deployed this run  : {{ (dubsar_ssh is succeeded and grafana_live is succeeded and prom_live is succeeded) | default(false) }}

          Dropped panels (no real metric source in this repo):
            ESARHADDON SMI, INANA Tribe Gravity (PB-119-136 do not exist —
            see docs/13_changelog/RM-001_ADDENDUM_PB111-145_VERIFIED_2026-07-01.md)
            usbguard Block Events (no usbguard integration in urnammu-attestationd)

          NOTE: /metrics endpoints on EnkiDB nodes still require a Prometheus
          exporter — enkidb-query-server does not expose /metrics yet.

    - name: "DONE  | PB-144 Reconciled COMPLETE"
      ansible.builtin.debug:
        msg: "PB-144 reconciled — configs generated locally, remote deploy honestly gated on reachability. Report: {{ report_file }}"
