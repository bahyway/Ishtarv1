# =============================================================================
# PB-241 -- HeptaScript historical-background tablet: Sebettu, Gudea
# Cylinder B, the Erra/Utukkū Sebettu dual aspect, and Inanna's Descent
# judges, corrected against a real historical-background Q&A upload
# and landed into docs/components/HEPTASCRIPT_GLOSSARY.md.
# BahyWay.Ecosystem v4.0 -- 2026-07-25
#
# WHY THIS PLAYBOOK EXISTS: an uploaded draft Q&A conflated several
# distinct historical claims (the Sebettu as a numeral vs. a named
# group; Gudea's seven-day Cylinder B dedication; the Erra Epic's
# seven warrior-gods vs. the Utukkū Lemnūtu "evil Seven" incantation
# series as if they were symmetric "good team / bad team" counterparts
# rather than one Seven's dual aspect; the apkallū's real role as
# doorway-figurine protectors and DUB.SAR's scribal ancestors; and
# overstated astronomy/ziggurat-tier claims). The corrected version
# keeps the real, checkable links -- Gudea 1.0 as this ecosystem's own
# founding era naming already ties to Cylinder B's seven-day warrant,
# and Inanna's Descent's seven Anunnaki judges are the genuine
# myth-to-architecture bridge to HeptaScript's seven-dimensional
# judgment model -- while cutting the overstated ones. This playbook
# lands no new code; it verifies the corrected section is present in
# the glossary this ecosystem already ships and treats "running this
# playbook" as the CSR-08 Architect confirmation of that text, per the
# same pattern every other GL-*/PH-*/SPEC-* tablet in this ecosystem
# uses.
#
# GOVERNING LAW NOTICE: Gated behind PB-160 completion law. Running
# this playbook = CSR-08 Architect confirmation of the corrected
# HeptaScript "Historical Background — Why Seven" section.
#
# USAGE (run from eriduous-vdi, inside a checkout of this repo, after
# `git pull origin claude/iphone-playbooks-crosstribe-eval-nbc5sw`):
#   ansible-playbook playbooks/playbook_241_heptascript_historical_background.yml
# =============================================================================

- name: "PB-241 -- HeptaScript historical-background tablet"
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    repo_root: "{{ playbook_dir }}/../workspace/bahyway_v4"
    glossary_path: "{{ playbook_dir }}/../docs/components/HEPTASCRIPT_GLOSSARY.md"

  tasks:
    - name: "Confirm the HeptaScript glossary is present (committed source, not authored here)"
      ansible.builtin.stat:
        path: "{{ glossary_path }}"
      register: glossary_check

    - name: "Fail clearly if the glossary is missing"
      ansible.builtin.fail:
        msg: >-
          {{ glossary_path }} not found. Run
          `git pull origin claude/iphone-playbooks-crosstribe-eval-nbc5sw`
          first -- this playbook only verifies committed source.
      when: not glossary_check.stat.exists

    - name: "Slurp the glossary to confirm the corrected historical-background section landed"
      ansible.builtin.slurp:
        src: "{{ glossary_path }}"
      register: glossary_contents

    - name: "Fail clearly if the corrected section (or any of its load-bearing claims) is missing"
      ansible.builtin.fail:
        msg: >-
          docs/components/HEPTASCRIPT_GLOSSARY.md is missing the
          "{{ item }}" marker expected in the corrected "Historical
          Background -- Why Seven" section. Re-run
          `git pull origin claude/iphone-playbooks-crosstribe-eval-nbc5sw`
          and confirm the branch is up to date.
      loop:
        - "Historical Background"
        - "Gudea"
        - "Sebettu"
        - "apkall"
        - "Inanna"
        - "Anunnaki"
      when: item not in (glossary_contents.content | b64decode)

    - name: "Report"
      ansible.builtin.debug:
        msg: >-
          PB-241 complete -- the corrected HeptaScript historical-
          background section is confirmed landed in
          docs/components/HEPTASCRIPT_GLOSSARY.md: the Sebettu/numeral
          distinction, Gudea Cylinder B's seven-day dedication tied to
          this ecosystem's own Gudea 1.0 founding era, the Erra/Utukkū
          Sebettu as one Seven's dual aspect (not a symmetric good/evil
          pair) with the apkallū correctly placed as doorway-figurine
          protectors and DUB.SAR's scribal ancestors, and Inanna's
          Descent's seven Anunnaki judges as the explicit myth-to-
          architecture link to HeptaScript's seven-dimensional
          judgment model. Astronomy/ziggurat-tier claims were softened
          to their real, checkable status rather than overstated. No
          code changed by this playbook -- running it is the CSR-08
          Architect confirmation of this text, per this ecosystem's
          standing GL-*/PH-*/SPEC-* tablet pattern.
