---
# ════════════════════════════════════════════════════════════════════════════
#  playbook_118_ashnan_sensor_pilot_setup_v2_reconciled.yml
#  BahyWay.Ecosystem v4.0 — PB-118 Reconciled: config real, gates honestly deferred
#
#  SCP to EriduOS-VDI then run:
#    ansible-playbook playbook_118_ashnan_sensor_pilot_setup_v2_reconciled.yml -i "localhost," -c local -v
#
#  NAMING COLLISION — this repo already has a DIFFERENT
#  playbook_118_ashnan_sensor_pilot_setup.yml from an earlier batch this
#  session. That one is a config-scaffold; this upload is closer to a
#  live integration test. Kept as a separate file.
#
#  Why this file does NOT assert what the original asserted:
#    The original's two integration gates (NRM_CLEAN on a valid zip,
#    NRM_TRUNCATED on a corrupt zip) depend on THREE things this session
#    verified are not yet true:
#      1. A specific test corpus (ashnan_test_zip.zip,
#         ashnan_test_CORRUPT.zip, etc.) that doesn't exist on disk
#         anywhere in this repo or its generators.
#      2. Live SSH access to enkidb-node-write (192.168.122.101) to push
#         that corpus — cannot be exercised from this sandbox.
#      3. Most importantly: naramsin-bridge::process() — verified
#         directly in playbook_115's reconciliation — is an honestly
#         incomplete "Phase 1 scaffold". It only calls detect_format()
#         today; it does NOT call the real archive-unwrap/format-parse
#         pipeline, so it cannot distinguish a truncated zip from a
#         valid one yet. Asserting NRM_TRUNCATED here would fail against
#         the real current bridge — not because anything is broken, but
#         because that gate genuinely isn't wired yet (the bridge's own
#         roadmap defers this to "Playbooks 198-217").
#
#    This file does what CAN be verified honestly today: confirms the
#    real config content (Diyala pilot station registry, BeeMDM wiring)
#    is sound, confirms ashnan-ingest builds and runs against ANY input
#    (since the bridge currently returns Clean on the happy path for any
#    recognised or unrecognised format), and clearly states the
#    NRM_TRUNCATED gate as future work tied to playbook_115's documented
#    scaffold status — not a pass/fail claim.
# ════════════════════════════════════════════════════════════════════════════
- name: "PB-118 (Reconciled) | ASHNAN Diyala pilot — config real, corruption gate deferred"
  hosts: localhost
  connection: local
  gather_facts: true

  vars:
    forge_root:    "{{ ansible_env.HOME }}/Forge/EnkiDB"
    workspace:     "{{ forge_root }}/workspace/bahyway_v4"
    cargo:         "{{ ansible_env.HOME }}/.cargo/bin/cargo"
    target_branch: "claude/iphone-playbooks-crosstribe-eval-nbc5sw"
    docs_dir:      "{{ forge_root }}/docs/SHEDU"
    config_dir:    "{{ forge_root }}/config/ashnan"
    session_date:  "{{ ansible_date_time.date }}"
    report_file:   "{{ docs_dir }}/PB118_V2_RECONCILED_{{ session_date }}.txt"

    pilot_stations:
      soil_crop: 360
      pest_trap: 195
      livestock: 120
      ext_ingestion: 28
      total: 703

  tasks:

    - name: "PREP | Ensure config/ashnan and docs/SHEDU directories exist"
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ config_dir }}"
        - "{{ docs_dir }}"

    - name: "VERIFY | Workspace present (scp'd from laptop)"
      ansible.builtin.stat:
        path: "{{ workspace }}/Cargo.toml"
      register: ws_check

    - name: "FAIL | Workspace not synced — run the laptop-side sync first"
      ansible.builtin.fail:
        msg: >
          {{ workspace }}/Cargo.toml not found on this host. EriduOS-VDI has
          no GitHub access. On your Fedora laptop: git pull origin
          {{ target_branch }}, then scp -r workspace/bahyway_v4
          bahaa@eriduos-vdi:{{ workspace }}. Re-run this playbook after that.
      when: not ws_check.stat.exists

    - name: "WRITE | Diyala pilot sensor station registry (config only, no live push)"
      ansible.builtin.copy:
        dest: "{{ config_dir }}/diyala_station_registry.json"
        mode: "0644"
        content: |
          {
            "registry_version": "1.0",
            "pilot_region": "Diyala Governorate, Iraq",
            "tribe_id": "ashnan_diyala",
            "bc_ref": "BC-AGRI-001",
            "generated_by": "PB-118-reconciled",
            "generated_date": "{{ session_date }}",
            "sensor_grid": {
              "soil_crop":     { "count": 360, "grid_layout": "30x12", "spacing_km": 5 },
              "pest_trap":     { "count": 195, "grid_layout": "13x15" },
              "livestock":     { "count": 120, "grid_layout": "10x12 zones" },
              "ext_ingestion": { "count": 28 }
            },
            "total_sensors": {{ pilot_stations.total }}
          }

    - name: "BUILD | cargo build -p ashnan-ingest --release"
      ansible.builtin.command:
        cmd: "{{ cargo }} build -p ashnan-ingest --release"
        chdir: "{{ workspace }}"
      register: build_out
      changed_when: false
      failed_when: build_out.rc != 0

    - name: "SMOKE | Run ashnan-ingest against a small in-memory-generated test file"
      ansible.builtin.shell: |
        set -e
        TMPFILE=$(mktemp /tmp/ashnan_smoke_XXXX.dat)
        printf 'sovereign smoke test, not a real archive' > "$TMPFILE"
        {{ workspace }}/target/release/ashnan-ingest "$TMPFILE" || true
        rm -f "$TMPFILE"
      register: smoke_out
      changed_when: false
      failed_when: false

    - name: "PRINT | Smoke test output (informational — bridge is a Phase 1 scaffold)"
      ansible.builtin.debug:
        msg: "{{ smoke_out.stdout_lines | default([]) }}"

    - name: "WRITE | Pilot readiness report"
      ansible.builtin.copy:
        dest: "{{ report_file }}"
        mode: "0644"
        content: |
          BahyWay.Ecosystem v4.0 — PB-118 (v2) Reconciled Report
          Date : {{ session_date }}

          Pilot network config (real, written this run):
            {{ config_dir }}/diyala_station_registry.json
            703 planned sensors (360 soil/crop, 195 pest trap, 120
            livestock, 28 external ingestion) — configuration only, not
            deployed to live infrastructure by this playbook.

          ashnan-ingest build: {{ 'PASS' if build_out.rc == 0 else 'FAIL' }}
          Smoke run against a non-archive test file: see output above —
          informational only.

          NOT ASSERTED (deliberately, and why):
            NRM_CLEAN on a real archive corpus  — no such corpus exists
              in this repo yet (ashnan_test_zip.zip etc. were never
              generated/committed).
            NRM_TRUNCATED on a corrupt archive  — naramsin-bridge does
              not yet implement archive-unwrap/corruption detection
              (confirmed in playbook_115's reconciliation — it's an
              honestly incomplete Phase 1 scaffold, roadmapped for later
              playbooks). Asserting this today would be a false claim,
              not a real pass.

          Real follow-up work, in order: (1) generate the ASHNAN archive
          test corpus with the exact filenames this playbook expects,
          (2) wire naramsin-bridge's Stage 0-1 calls (archive unwrap +
          format parse) so NrmCode reflects real content, (3) re-run
          NRM_CLEAN/NRM_TRUNCATED gates against that.

    - name: "DONE | PB-118 Reconciled COMPLETE"
      ansible.builtin.debug:
        msg: "PB-118 reconciled — config verified real, corruption gate honestly deferred. Report: {{ report_file }}"
