# =============================================================================
# PB-589 — The Napharu Theorem: Concept Seal (GL-ALG-002)
# BahyWay.Ecosystem v4.0 — 2026-08-23
#
# WHY THIS PLAYBOOK EXISTS
#   Seals GL-ALG-002, the apex tablet of the GL-ALG series: every
#   lawful BahyWay judgment is the threshold-crossing of a deficit
#   functional 𝒟_Θ over Hepta Space, attested by at least two
#   independent witnesses, bounded below by the Fadam Floor ε,
#   discrete and never averaged, with stage/deficit/thresholds bound
#   by the triality condition. All fifty-three existing algebra
#   members become corollaries; no future calculus needs a new axiom,
#   only its (Θ, 𝒟, T, witnesses) quadruple.
#
#   Promoted from docs/fri20260821-incoming/Napharun_Theorem/ into
#   docs/09_observatory/ (2026-08-23), after the Architect supplied
#   the tablet's own origin Q&A transcript confirming it was
#   deliberately sealed the same session as the tablets landed in
#   batch15/16/17 -- all of which name GL-ALG-002 as their shared
#   grandparent and were landed in this repo with that dependency
#   flagged open. This playbook closes that gap. See
#   shala-prototypes/batch18_napharu_kaniku_gate/README.md for the
#   full account of what was promoted and what was deliberately left
#   in place.
#
# WHAT THIS PLAYBOOK DOES
#   PROVEs the tablet's own five stated proof obligations (PO-1
#   through PO-5) are named, PROVEs the Theorem statement (§8), the
#   Verdict Schema's Never-Averaged promotion (§4), the Fadam Floor
#   (§6), and the Triality Condition (§7) are sealed verbatim. PROVEs
#   the Sala court (already present at
#   docs/fri20260821-incoming/Napharun_Theorem/sala_gl_alg_002_napharu.html,
#   now also mirrored into shala-prototypes/) renders the five tier
#   shells and the ε/WITHHELD ring. Deposits nothing new -- docs and
#   Sala tab are committed directly into docs/ and shala-prototypes/,
#   this playbook is a pointer/verification record.
#
# Running this playbook = CSR-08 confirmation. Review -> --check -> live.
# =============================================================================

- name: "PB-589 | Seal the Napharu Theorem (GL-ALG-002)"
  hosts: localhost
  connection: local
  become: false
  vars:
    repo_root: "{{ playbook_dir }}/.."
    tablet_file: "{{ repo_root }}/docs/09_observatory/GL-ALG-002_Napharu_Theorem.md"
    court_file: "{{ repo_root }}/shala-prototypes/batch18_napharu_kaniku_gate/sala_gl_alg_002_napharu.html"

  tasks:

    - name: "0.1 | Confirm the tablet and the Sala court are landed"
      ansible.builtin.stat:
        path: "{{ item }}"
      register: land_stat
      loop:
        - "{{ tablet_file }}"
        - "{{ court_file }}"
      loop_control: { label: "{{ item }}" }

    - name: "FAIL | required file missing"
      ansible.builtin.fail:
        msg: "{{ item.item }} not found -- nothing to seal."
      loop: "{{ land_stat.results }}"
      loop_control: { label: "{{ item.item }}" }
      when: not item.stat.exists

    - name: "1.1 | PROVE the tablet's own five proof obligations (PO-1..5) are named"
      ansible.builtin.shell: |
        set -e
        grep -qF "**PO-1**" "{{ tablet_file }}"
        grep -qF "**PO-2**" "{{ tablet_file }}"
        grep -qF "**PO-3**" "{{ tablet_file }}"
        grep -qF "**PO-4**" "{{ tablet_file }}"
        grep -qF "**PO-5**" "{{ tablet_file }}"
        echo "PROVEN: PO-1..5 all present"
      register: prove_pos
      changed_when: false

    - name: "1.2 | PROVE the Theorem statement (§8) is sealed verbatim"
      ansible.builtin.shell: |
        set -e
        grep -qF "Every lawful BahyWay judgment is the threshold-crossing of a deficit" "{{ tablet_file }}"
        grep -qF "with stage, deficit, and thresholds bound by the triality condition" "{{ tablet_file }}"
        echo "PROVEN: the Napharu Theorem statement is sealed"
      register: prove_theorem
      changed_when: false

    - name: "1.3 | PROVE Never-Averaged is promoted to structural axiom and the Fadam Floor is sealed"
      ansible.builtin.shell: |
        set -e
        grep -qF "hereby promoted from member to structural axiom" "{{ tablet_file }}"
        grep -qF "the lawful verdict is always" "{{ tablet_file }}"
        grep -qF "**WITHHELD**, never a forced regime" "{{ tablet_file }}"
        echo "PROVEN: Never-Averaged and the Fadam Floor are sealed"
      register: prove_floor
      changed_when: false

    - name: "1.4 | PROVE the Triality Condition and the admission gate (§12) are sealed"
      ansible.builtin.shell: |
        set -e
        grep -qF "## §7 — The Triality Condition" "{{ tablet_file }}"
        grep -qF "determine the third up to gauge" "{{ tablet_file }}"
        grep -qF "is refused at the gate" "{{ tablet_file }}"
        echo "PROVEN: triality and the quadruple admission gate are sealed"
      register: prove_triality
      changed_when: false

    - name: "1.5 | PROVE the Sala court renders the five tier shells and the ε/WITHHELD ring"
      ansible.builtin.shell: |
        set -e
        grep -qF "Fifty-three corollaries orbit one deficit functional" "{{ court_file }}"
        grep -qF "the Fadam Floor" "{{ court_file }}"
        grep -qF "Never-Averaged" "{{ court_file }}"
        grep -qF "triality" "{{ court_file }}"
        grep -qF "WITHHELD" "{{ court_file }}"
        echo "PROVEN: the court renders the tier shells, the theorem, and the ε ring"
      register: prove_court
      changed_when: false

    - name: "2.1 | Report"
      ansible.builtin.debug:
        msg: >
          PB-589 complete. GL-ALG-002 sealed: every lawful BahyWay
          judgment is a threshold-crossing of 𝒟_Θ over Hepta Space,
          two independent witnesses, floored by ε (WITHHELD below it),
          discrete and never averaged, bound by triality — all fifty-
          three existing algebra members standing as corollaries.
          Promoted from docs/fri20260821-incoming/Napharun_Theorem/;
          see shala-prototypes/batch18_napharu_kaniku_gate/README.md.
          This tablet was the shared grandparent every tablet in
          batch15/16/17 named as a parent while it sat unsealed in
          docs/09_observatory/ — that gap is now closed.
