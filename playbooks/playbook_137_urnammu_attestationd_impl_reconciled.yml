---
# ════════════════════════════════════════════════════════════════════════════
#  playbook_137_urnammu_attestationd_impl_reconciled.yml
#  BahyWay.Ecosystem v4.0 — PB-137 Reconciled: implemented for real, zero new deps
#
#  SCP to EriduOS-VDI then run:
#    ansible-playbook playbook_137_urnammu_attestationd_impl_reconciled.yml -i "localhost," -c local -v
#
#  Why this file exists (not the original playbook_137_urnammu_attestationd_impl.yml):
#    The stub crate (all 5 functions as todo!()) was built for real this
#    session in the PB-110 reconciliation. This upload correctly targets
#    that real crate and fills in the same 5 responsibilities with a
#    sound design — but its Cargo.toml adds hex/dirs/chrono dependencies
#    the current crate doesn't have.
#
#    Implemented the same design this session, deliberately without
#    adding those three dependencies:
#      - hex crate -> replaced with a 6-line hand-rolled hex decoder
#        (tpm.rs), since decoding a handful of PCR hex digests doesn't
#        need a whole crate
#      - dirs crate -> replaced with std::env::var("HOME") directly
#        (baseline.rs) — the only thing dirs::home_dir() was doing here
#      - chrono -> replaced with std::time::SystemTime unix-epoch
#        timestamps (kaki.rs) — a boot-time attestation daemon benefits
#        from a minimal, fast-compiling dependency footprint
#
#    Same 5 files (tpm.rs/baseline.rs/kaki.rs/gate.rs/main.rs), same 3
#    systemd units, same provision/boot/runtime modes — built, tested:
#      urnammu-attestationd : 11 passed
# ════════════════════════════════════════════════════════════════════════════
- name: "PB-137 (Reconciled) | UrNammu attestationd — implemented, zero new deps"
  hosts: localhost
  connection: local
  gather_facts: true

  vars:
    forge_root:       "{{ ansible_env.HOME }}/Forge/EnkiDB"
    workspace:         "{{ forge_root }}/workspace/bahyway_v4"
    cargo:             "{{ ansible_env.HOME }}/.cargo/bin/cargo"
    target_branch:     "claude/iphone-playbooks-crosstribe-eval-nbc5sw"
    docs_dir:          "{{ forge_root }}/docs/SHEDU"
    systemd_user_dir:  "{{ ansible_env.HOME }}/.config/systemd/user"
    session_date:      "{{ ansible_date_time.date }}"
    report_file:       "{{ docs_dir }}/PB137_RECONCILED_{{ session_date }}.txt"

  tasks:

    - name: "PREP | Ensure directories exist"
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ docs_dir }}"
        - "{{ systemd_user_dir }}"

    - name: "VERIFY | Workspace present (scp'd from laptop)"
      ansible.builtin.stat:
        path: "{{ workspace }}/Cargo.toml"
      register: ws_check

    - name: "FAIL | Workspace not synced — run the laptop-side sync first"
      ansible.builtin.fail:
        msg: >
          {{ workspace }}/Cargo.toml not found on this host. EriduOS-VDI has
          no GitHub access. On your Fedora laptop: git pull origin
          {{ target_branch }}, then scp -r workspace/bahyway_v4
          bahaa@eriduos-vdi:{{ workspace }}. Re-run this playbook after that.
      when: not ws_check.stat.exists

    - name: "VERIFY | urnammu-attestationd/src/tpm.rs exists (built this session)"
      ansible.builtin.stat:
        path: "{{ workspace }}/crates/urnammu-attestationd/src/tpm.rs"
      register: tpm_file

    - name: "FAIL | tpm.rs not found — stale sync — re-run the laptop scp step"
      ansible.builtin.fail:
        msg: "crates/urnammu-attestationd/src/tpm.rs not found after sync."
      when: not tpm_file.stat.exists

    - name: "TEST | cargo test -p urnammu-attestationd"
      ansible.builtin.command:
        cmd: "{{ cargo }} test -p urnammu-attestationd"
        chdir: "{{ workspace }}"
      register: test_out
      changed_when: false
      failed_when: test_out.rc != 0

    - name: "PARSE | test_out passed-test count"
      ansible.builtin.set_fact:
        test_out_passed_count: "{{ (test_out.stdout | regex_search('([0-9]+) passed', '\\1') | first) | int }}"

    - name: "ASSERT | urnammu-attestationd reports 11 passed"
      ansible.builtin.assert:
        that:
          - "'0 failed' in test_out.stdout"
          - test_out_passed_count >= 11
        fail_msg: >-
          Expected at least 11 passed, 0 failed. Got {{ test_out_passed_count }}
          passed. Full output: {{ test_out.stdout }}
        success_msg: >-
          urnammu-attestationd: {{ test_out_passed_count }} passed, 0 failed (>= baseline 11).

    # ── systemd units (real, written here — same as original design) ──────
    - name: "WRITE | systemd user service — urnammu-attestationd.service"
      ansible.builtin.copy:
        dest: "{{ systemd_user_dir }}/urnammu-attestationd.service"
        mode: "0644"
        content: |
          [Unit]
          Description=UrNammu Engine - Boot Attestation Daemon (BC-SEC-001)
          After=tpm2-abrmd.service
          Requires=tpm2-abrmd.service

          [Service]
          Type=oneshot
          ExecStart={{ workspace }}/target/release/urnammu-attestationd boot
          RemainAfterExit=no

          [Install]
          WantedBy=default.target

    - name: "WRITE | systemd user timer — urnammu-runtime.timer"
      ansible.builtin.copy:
        dest: "{{ systemd_user_dir }}/urnammu-runtime.timer"
        mode: "0644"
        content: |
          [Unit]
          Description=UrNammu Engine - Runtime Recheck Timer (every 5 min)

          [Timer]
          OnBootSec=5min
          OnUnitActiveSec=5min
          Unit=urnammu-runtime.service

          [Install]
          WantedBy=timers.target

    - name: "WRITE | systemd user service — urnammu-runtime.service"
      ansible.builtin.copy:
        dest: "{{ systemd_user_dir }}/urnammu-runtime.service"
        mode: "0644"
        content: |
          [Unit]
          Description=UrNammu Engine - Runtime Attestation Recheck

          [Service]
          Type=oneshot
          ExecStart={{ workspace }}/target/release/urnammu-attestationd runtime

    - name: "BUILD | cargo build -p urnammu-attestationd --release"
      ansible.builtin.command:
        cmd: "{{ cargo }} build -p urnammu-attestationd --release"
        chdir: "{{ workspace }}"
      register: build_out
      changed_when: false
      failed_when: build_out.rc != 0

    - name: "WRITE | Report"
      ansible.builtin.copy:
        dest: "{{ report_file }}"
        mode: "0644"
        content: |
          BahyWay.Ecosystem v4.0 — PB-137 Reconciled Report
          Date : {{ session_date }}

          Implemented for real this session, without adding hex/dirs/
          chrono dependencies the original proposed (hand-rolled hex
          decode, std::env::var("HOME"), unix-epoch timestamps instead).

          Verified this run:
            urnammu-attestationd : 11/11 tests PASS
            release build         : {{ 'PASS' if build_out.rc == 0 else 'FAIL' }}

          systemd units written to {{ systemd_user_dir }}/ (not enabled —
          run `systemctl --user enable --now urnammu-runtime.timer`
          manually when ready; requires a real TPM2 + tpm2-tools on this
          host, which this playbook does not verify).

    - name: "DONE | PB-137 Reconciled COMPLETE"
      ansible.builtin.debug:
        msg: "PB-137 reconciled — real implementation verified. Report: {{ report_file }}"
