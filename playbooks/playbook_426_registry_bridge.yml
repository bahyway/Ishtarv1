---
# PB-426 · registry bridge: Najaf tribes, permits, lineage, ABAC · DRAFT (GL-NAV-001 Annex A)
# Sections and family plots = tribes · records = particles · the cemetery is a NUZI made physical.
#
# 2026-08-23, found live, two issues:
#   1. enkimdb/enkiddb hardcoded the RETIRED enkidb-node-write IP
#      (192.168.122.101 -- superseded by uruk-node-write at .111, see
#      ansible/inventory.ini's own history note). Fixed below to resolve
#      the live write node instead of a fixed, now-dead address.
#   2. `hepta-run` and `akkadi-rules` are genuinely missing external CLI
#      tools -- neither is a [[bin]] target of any crate in
#      workspace/bahyway_v4/crates (checked: hepta, hepta-score,
#      hepta-sec-*, heptascript all have no src/bin/). Not a code bug this
#      repo can fix; needs the Architect to either build/install those
#      tools or point this playbook at whatever already provides that rite
#      -- left as LIVE failures until then, same class as PB-311/312's own
#      "TODO native tool" markers.
- name: "PB-426 · bridge the field vault into BahyWay v4.0"
  hosts: uruk
  vars:
    enkimdb: "{{ hostvars[groups['enkidb_write'][0]].ansible_host }}:7006"
    enkiddb: "{{ hostvars[groups['enkidb_write'][0]].ansible_host }}:7007"
  tasks:
    - name: Najaf tribe schema decree (sections + family plots) → EnkiMDB
      ansible.builtin.command: >
        hepta-run --at {{ enkimdb }} --rite decrees/najaf_tribes.hepta
      # PRESENT/EMIT rites inside: tribe per cemetery section, sub-tribe per family plot,
      # NUZI lineage bindings, Ḫubullu glosses at sealing time.

    - name: permit & register ingestion rite → EnkiDDB (Simtu/Šasû/Eṭemmu laws)
      ansible.builtin.command: >
        hepta-run --at {{ enkiddb }} --rite decrees/najaf_permits_ingest.hepta

    - name: ABAC decrees via AkkadiRulesEngine (family-plot read roles per the Authority)
      ansible.builtin.command: >
        akkadi-rules --decree decrees/najaf_abac.rules --seal ed25519

    - name: export-rite registration — field anomalies may enter EnkiSDB only through this gate
      ansible.builtin.lineinfile:
        path: /var/lib/bahyway/gates/G4.registry
        line: "hendursaga.anomalies → EnkiSDB:7001 · dual seal required · FUZZY on entry"
        create: yes
