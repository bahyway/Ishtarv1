# =============================================================================
# PB-186 — Internal Mandatory vs. External Optional Attributes reference
# BahyWay.Ecosystem v4.0 — 2026-07-13
#
# CONTEXT: after evaluating GL-EAV-001 (an iPhone-session document proposing
# an Optional Attribute Registry + Subject Area taxonomy for EnkiDDB) and
# finding one factual error (κ[7] does not carry a Business/Technical/
# Operational trichotomy — that byte is Kishib/Zikru/Parzu, already spoken
# for) plus one internal contradiction (two competing B11 formulas), the
# Architect asked a direct clarifying question: is there anything wrong with
# the underlying Mandatory-vs-Optional-attribute approach itself, given that
# EnkiDDB particles have long-stated mandatory attributes (state, freshness,
# ColorID RGB shade from the tribe root color as it moves through BeeMDM
# stations, a steward/username on the DubSar PDM-shape service, SLA via the
# Fuzzy Logic Engine + Score Engine) distinct from Subject-Area-specific
# optional ones.
#
# ANSWER: no objection — the split is sound, and most of the mandatory side
# already exists in sealed code under a name the Architect hadn't been told
# about: "The Hepta of Universal Assessments" (story-engine/src/projection.rs
# and projected_state.rs, §4.2) — seven mandatory universal EAV attributes
# (state, quality, color_rgb, freshness, Snapshot_Date, Snapshot_State,
# Snapshot_Frequency) present on every particle before any Subject Area is
# even assigned. GL-EAV-001's registry (Subject Areas + optional attributes)
# is a real, separate, correctly-scoped Layer 2 that governs everything
# else — it does not compete with the Hepta-7.
#
# WHAT WAS BUILT: docs/06_governance_parzu/MANDATORY_VS_OPTIONAL_ATTRIBUTES.md — a
# three-layer model, every claim grounded in a real file:line citation:
#   Layer 0  — KAKI 16-byte immutable header (not an attribute at all)
#   Layer 1  — the Hepta-7 (sealed, real, verified against story-engine)
#   Layer 2  — GL-EAV-001's Subject-Area optional attribute registry
#
# Also traced the Architect's specific examples to real code:
#   - "shade from the tribe root color, changed via BeeMDM stations" ->
#     diagnosis-engine::color_drift.rs (RGB Euclidean distance from tribe
#     root color, R=severity G=quality B=freshness) + score-engine::
#     compute_color() (domain_byte, quality*255, freshness*255) — real,
#     tested, and the mechanism is genuinely "shade drifts as a consequence
#     of station writes," not direct color-editing.
#   - "freshness" -> score-engine::FreshnessDecay, three real decay profiles
#     (civil_registry ~365d, operational ~30d, sensor_stream ~1h).
#
# HONEST GAPS FOUND (not invented, not silently filled):
#   - No ATTR_STEWARD / ATTR_CREATED_BY / ATTR_USERNAME exists anywhere
#     (verified by grep, zero hits). Proposed as a new "Provenance" class
#     alongside (not inside) the Hepta-7, since Hepta is fixed at seven
#     throughout this ecosystem's naming (HeptaScript, Hepta metric,
#     HeptaShell's 7D lattice) and growing it to eight would break that.
#   - sla-engine is real (SlaEvaluator -> SlaReport{overall_b11,...}) but its
#     Cargo.toml shows zero dependency on fuzzy-engine or score-engine — it
#     computes its own, independent B11. Flagged as a real integration gap:
#     SLA cannot be trusted as reflecting particle quality until this is
#     wired, one way or the other.
#
# STILL OPEN: whether/how to mint real ATTR_* hashes for the proposed
# Provenance class, and whether to wire sla-engine into score-engine's
# ScoreResult — both deliberately left as open questions for the Architect,
# not decided unilaterally in this playbook.
# =============================================================================
---
- name: "PB-186 | Record — Mandatory vs. Optional attributes reference"
  hosts: localhost
  connection: local
  become: false
  tasks:
    - name: "PB-186.1 | Pointer to the actual document"
      ansible.builtin.debug:
        msg: >-
          See docs/06_governance_parzu/MANDATORY_VS_OPTIONAL_ATTRIBUTES.md on
          claude/iphone-playbooks-crosstribe-eval-nbc5sw, 2026-07-13. The
          Hepta-7 (state, quality, color_rgb, freshness, Snapshot_Date,
          Snapshot_State, Snapshot_Frequency) is real and sealed
          (story-engine §4.2) -- GL-EAV-001's Subject-Area registry is a
          correctly-scoped Layer 2 alongside it, not a replacement for it.
          Steward/username Provenance and SLA-to-score-engine wiring remain
          open, unbuilt questions for the Architect.
