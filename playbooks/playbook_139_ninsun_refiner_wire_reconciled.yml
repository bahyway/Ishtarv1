---
# ════════════════════════════════════════════════════════════════════════════
#  playbook_139_ninsun_refiner_wire_reconciled.yml
#  BahyWay.Ecosystem v4.0 — PB-139 Reconciled: exact match, already built
#
#  SCP to EriduOS-VDI then run:
#    ansible-playbook playbook_139_ninsun_refiner_wire_reconciled.yml -i "localhost," -c local -v
#
#  NAMING COLLISION — this repo already has a DIFFERENT
#  playbook_139_ninsun_namtar_ereskigal_ashnan_regional.yml from an
#  earlier batch this session (which covers NINSUN alongside NAMTAR/
#  ERESKIGAL/ASHNAN regional modules together). This upload is scoped
#  to NINSUN alone. Kept as a separate file.
#
#  Why this file exists (not the original playbook_139_ninsun_refiner_wire.yml):
#    It doesn't need to scaffold anything — checked crates/ninsun-agent
#    directly and it is, field-for-field, doc-comment-for-doc-comment,
#    an EXACT match for this upload's design: RefineProposal struct
#    (identical fields), analyze() entry point, drift.rs/explain.rs/
#    emit.rs/error.rs module layout, even the same "NINSUN proposes, the
#    Sovereign decides" phrasing in the header comment. This was already
#    built and verified once this session (playbook_139_ninsun_namtar_
#    ereskigal_ashnan_regional.yml, 7/7 tests). This file just confirms
#    it again under this upload's own name for traceability.
#      ninsun-agent : 7 passed
# ════════════════════════════════════════════════════════════════════════════
- name: "PB-139 (Reconciled) | NINSUN Agent — exact match, already real"
  hosts: localhost
  connection: local
  gather_facts: true

  vars:
    forge_root:    "{{ ansible_env.HOME }}/Forge/EnkiDB"
    workspace:     "{{ forge_root }}/workspace/bahyway_v4"
    cargo:         "{{ ansible_env.HOME }}/.cargo/bin/cargo"
    target_branch: "claude/iphone-playbooks-crosstribe-eval-nbc5sw"
    docs_dir:      "{{ forge_root }}/docs/SHEDU"
    session_date:  "{{ ansible_date_time.date }}"
    report_file:   "{{ docs_dir }}/PB139_RECONCILED_{{ session_date }}.txt"

  tasks:

    - name: "PREP | Ensure report dir exists"
      ansible.builtin.file: { path: "{{ docs_dir }}", state: directory, mode: "0755" }

    - name: "VERIFY | Workspace present (scp'd from laptop)"
      ansible.builtin.stat:
        path: "{{ workspace }}/Cargo.toml"
      register: ws_check

    - name: "FAIL | Workspace not synced — run the laptop-side sync first"
      ansible.builtin.fail:
        msg: >
          {{ workspace }}/Cargo.toml not found on this host. EriduOS-VDI has
          no GitHub access. On your Fedora laptop: git pull origin
          {{ target_branch }}, then scp -r workspace/bahyway_v4
          bahaa@eriduos-vdi:{{ workspace }}. Re-run this playbook after that.
      when: not ws_check.stat.exists

    - name: "TEST | cargo test -p ninsun-agent"
      ansible.builtin.command:
        cmd: "{{ cargo }} test -p ninsun-agent"
        chdir: "{{ workspace }}"
      register: test_out
      changed_when: false
      failed_when: test_out.rc != 0

    - name: "PARSE | test_out passed-test count"
      ansible.builtin.set_fact:
        test_out_passed_count: "{{ (test_out.stdout | regex_search('([0-9]+) passed', '\\1') | first) | int }}"

    - name: "ASSERT | ninsun-agent reports 7 passed"
      ansible.builtin.assert:
        that:
          - "'0 failed' in test_out.stdout"
          - test_out_passed_count >= 7
        fail_msg: >-
          Expected at least 7 passed, 0 failed. Got {{ test_out_passed_count }}
          passed. Full output: {{ test_out.stdout }}
        success_msg: >-
          ninsun-agent: {{ test_out_passed_count }} passed, 0 failed (>= baseline 7).

    - name: "WRITE | Report"
      ansible.builtin.copy:
        dest: "{{ report_file }}"
        mode: "0644"
        content: |
          BahyWay.Ecosystem v4.0 — PB-139 Reconciled Report
          Date : {{ session_date }}

          Original PB-139 proposed ninsun-agent — confirmed an EXACT
          match against the already-real crate (same struct, same
          fields, same module layout, same doc comments). Nothing new
          to build. Already verified once this session under a
          different playbook name.

          Verified this run:
            ninsun-agent : 7/7 tests PASS

    - name: "DONE | PB-139 Reconciled COMPLETE"
      ansible.builtin.debug:
        msg: "PB-139 reconciled — exact match confirmed. Report: {{ report_file }}"
