# =============================================================================
# PB-587 — The Šēdu Law: Concept Seal (GL-SIM-001)
# BahyWay.Ecosystem v4.0 — 2026-08-23
#
# WHY THIS PLAYBOOK EXISTS
#   Seals GL-SIM-001: judgment extended to what does not yet exist. A
#   candidate facility is minted as a rehearsal citizen (a full Named
#   Lattice under GL-LAT-001, banner-marked, physically separate from
#   production). Every quantity it produces is classed SIMULATED, a
#   new rung below ADVISED on the GL-NIM-001 epistemic ladder that may
#   inform a verdict but never masquerade upward. The Court verdicts
#   per particle -- REFUSED / CONDITIONED / ADMITTED / WITHHELD --
#   never averaged across a site. Passage to production is a formal
#   Threshold Gate: the Šala particle dies, the production particle is
#   born inheriting the simulation history as pre-birth nasab. The
#   Šēdu Ledger scores every prophecy against later witness.
#
#   Landed from a standalone Architect-supplied upload (2026-08-23),
#   evaluated file-by-file against this repo before landing and
#   RENUMBERED per this repo's standing rule: the source deposit's own
#   PB-SIM-001 -> PB-587 here. See
#   shala-prototypes/batch17_shedu_temu_sky_courts/README.md for the
#   full renumbering table. This tablet was the missing law for the
#   three Šēdu Court rehearsals already landed in batch14
#   (shala-prototypes/batch14_shedu_kulla_courts/) before this tablet
#   existed in this repo -- this playbook proves it against the v1
#   court already landed there (the delivered copy in this upload
#   differs from batch14's only by one unused local variable, not
#   re-landed as a duplicate; see the batch17 README).
#
# WHAT THIS PLAYBOOK DOES
#   PROVEs the tablet's own four stated proof obligations (SIM-PO-1
#   through SIM-PO-4) are named, PROVEs the Rehearsal Citizen, the
#   SIMULATED register, the four-way Verdict Schema, and the Threshold
#   Gate's pre-birth nasab are sealed verbatim. PROVEs the Sala court
#   (already landed in batch14) renders per-particle SIMULATED
#   verdicts and the pre-birth nasab certificate. Deposits nothing new
#   -- docs and Sala tab are committed directly into docs/ and
#   shala-prototypes/, this playbook is a pointer/verification record.
#
# Running this playbook = CSR-08 confirmation. Review -> --check -> live.
# =============================================================================

- name: "PB-587 | Seal the Šēdu Law (GL-SIM-001)"
  hosts: localhost
  connection: local
  become: false
  vars:
    repo_root: "{{ playbook_dir }}/.."
    tablet_file: "{{ repo_root }}/docs/09_observatory/GL-SIM-001_Shedu_Law.md"
    court_file: "{{ repo_root }}/shala-prototypes/batch14_shedu_kulla_courts/sala_gl_sim_001_shedu_court.html"

  tasks:

    - name: "0.1 | Confirm the tablet and the Sala court are landed"
      ansible.builtin.stat:
        path: "{{ item }}"
      register: land_stat
      loop:
        - "{{ tablet_file }}"
        - "{{ court_file }}"
      loop_control: { label: "{{ item }}" }

    - name: "FAIL | required file missing"
      ansible.builtin.fail:
        msg: "{{ item.item }} not found -- nothing to seal."
      loop: "{{ land_stat.results }}"
      loop_control: { label: "{{ item.item }}" }
      when: not item.stat.exists

    - name: "1.1 | PROVE the tablet's own four proof obligations (SIM-PO-1..4) are named"
      ansible.builtin.shell: |
        set -e
        grep -qF "SIM-PO-1" "{{ tablet_file }}"
        grep -qF "SIM-PO-2" "{{ tablet_file }}"
        grep -qF "SIM-PO-3" "{{ tablet_file }}"
        grep -qF "SIM-PO-4" "{{ tablet_file }}"
        echo "PROVEN: SIM-PO-1..4 all present"
      register: prove_pos
      changed_when: false

    - name: "1.2 | PROVE the Rehearsal Citizen and the SIMULATED register are sealed"
      ansible.builtin.shell: |
        set -e
        grep -qF "minted as a **rehearsal citizen**" "{{ tablet_file }}"
        grep -qF "MEASURED > DERIVED > ESTIMATED > ADVISED > **SIMULATED**" "{{ tablet_file }}"
        grep -qF "it may never masquerade upward" "{{ tablet_file }}"
        echo "PROVEN: the Rehearsal Citizen and the SIMULATED rung are sealed"
      register: prove_citizen
      changed_when: false

    - name: "1.3 | PROVE the four-way Verdict Schema is sealed, discrete and never averaged"
      ansible.builtin.shell: |
        set -e
        grep -qF "**REFUSED**" "{{ tablet_file }}"
        grep -qF "**CONDITIONED**" "{{ tablet_file }}"
        grep -qF "**ADMITTED**" "{{ tablet_file }}"
        grep -qF "**WITHHELD**" "{{ tablet_file }}"
        grep -qF "kindergarten inside the oil-reach refuses the site; the Never-Averaged" "{{ tablet_file }}"
        echo "PROVEN: the four-way per-particle verdict schema is sealed"
      register: prove_schema
      changed_when: false

    - name: "1.4 | PROVE the Threshold Gate and pre-birth nasab are sealed"
      ansible.builtin.shell: |
        set -e
        grep -qF "the Šala particle" "{{ tablet_file }}"
        grep -qF "**dies**, and the production particle is" "{{ tablet_file }}"
        grep -qF "pre-birth nasab" "{{ tablet_file }}"
        grep -qF "the Šēdu Ledger" "{{ tablet_file }}"
        echo "PROVEN: the Threshold Gate, pre-birth nasab, and the Šēdu Ledger are sealed"
      register: prove_gate
      changed_when: false

    - name: "1.5 | PROVE the Sala court renders per-particle SIMULATED verdicts and the pre-birth nasab certificate"
      ansible.builtin.shell: |
        set -e
        grep -qF "EVERY FIGURE CLASSED SIMULATED" "{{ court_file }}"
        grep -qF "REFUSED" "{{ court_file }}"
        grep -qF "CONDITIONED" "{{ court_file }}"
        grep -qF "ADMITTED" "{{ court_file }}"
        grep -qF "pre-birth nasab" "{{ court_file }}"
        grep -qF "prescription KAKI" "{{ court_file }}"
        echo "PROVEN: the court renders the per-particle verdict schema and the pre-birth nasab certificate"
      register: prove_court
      changed_when: false

    - name: "2.1 | Report"
      ansible.builtin.debug:
        msg: >
          PB-587 complete. GL-SIM-001 sealed: candidate facilities are
          minted as rehearsal citizens under the new SIMULATED rung,
          judged per particle into REFUSED/CONDITIONED/ADMITTED/
          WITHHELD with no averaging across a site, and pass to
          production only through the Threshold Gate's pre-birth
          nasab, scored forever in the Šēdu Ledger. Renumbered from
          the source deposit's PB-SIM-001; see
          shala-prototypes/batch17_shedu_temu_sky_courts/README.md for
          the full renumbering table. This tablet was the missing law
          for the three Šēdu Court rehearsals already landed in
          batch14, proven here against that batch's own v1 file.
