# ============================================================================
# PB-301 — Flight-to-Location Law: Concept Seal (GL-NAV-001)
# BahyWay.Ecosystem v4.0 — SSE (Nabû) · NaviEngine · Hubble-Zooming
# ----------------------------------------------------------------------------
# PURPOSE:
#   Seals the three-engine "Flight to Location" pipeline as sovereign law:
#   a vague human sentence becomes a target (Nabû/SSE), a descent path and
#   neighborhood context (NaviEngine), and a cinematic zoom-flight rendered
#   level-by-level (Hubble-Zooming). Domain-neutral: the same pipeline finds
#   a grave in Wādī al-Salām (NajafEngine) or a defect node in a water net
#   (WPDEngine / EGDEngine).
#
#   Seals the LAYERED-BASEMAP architecture as its guarded boundary: the
#   world's public basemaps (OSM) carry the APPROACH to the gate; the
#   sovereign Hubble grave/defect layer, fed by EnkiDB, owns the INTERIOR.
#   The hand-off between them is law, not a rendering detail.
#
#   CONCEPT DOCUMENT ONLY — no runtime code, no renderer built.
#   Implementation deferred behind the PB-150..PB-160 testing gate,
#   per the Governing Law. CSR-08: running this playbook is the
#   Architect's confirmation to inscribe the concept — nothing more.
#
# GUARDED BOUNDARIES (three, stated as law in the document):
#   1. Basemap boundary — public tiles carry the approach; sovereign
#      data owns the interior; the LOD hand-off is explicit.
#   2. Truth boundary — GeoEngine remains the single mathematical truth
#      source; NaviEngine plots, Hubble renders, neither computes truth.
#   3. Performance boundary — the flight (camera easing) and the
#      billion-particle law (field masking / LOD streaming) are DISTINCT
#      guarantees and must not be conflated.
#
# NAMING (NL-001):
#   - Nabû — god of scribes & the written word — governs the SSE engine.
#   - NaviEngine — descriptive-acronym class — lawful.
#   - Hubble-Zooming — descriptive class — lawful (existing engine).
#   - Najaf / the water net — cities/structures — name structures only.
#
# TARGET: uruk (bare-metal Fedora Workstation 44; was eriduous-vdi before
# Phase 2 reconciliation retired that alias -- see ansible/inventory.ini)
#
# CHANGED during Phase 2 integration (2026-08-14): this playbook originally
# deployed GL-NAV-001 by an Ansible `copy:` task to a remote $HOME path.
# Per the PB-197+ convention (sealed docs are committed directly into
# docs/, not Ansible-copied to a machine), the document now lives at
# docs/09_observatory/GL-NAV-001-flight-to-location.md and this playbook is a pointer,
# matching playbook_197's style. See docs/phase2-incoming/RENUMBERING_MAP.md.
# ============================================================================

- name: "PB-301 | Record — Flight-to-Location Law (GL-NAV-001) landed"
  hosts: localhost
  connection: local
  become: false
  tasks:

    - name: "PB-301.1 | Pointer to the actual document"
      ansible.builtin.debug:
        msg: >-
          GL-NAV-001 — Flight-to-Location Law — is committed at
          docs/09_observatory/GL-NAV-001-flight-to-location.md (three-engine Nabû /
          NaviEngine / Hubble-Zooming contract, three guarded boundaries:
          layered basemap, truth, and the two separate performance laws).
          docs/09_observatory/GL-NAV-001-AnnexA-hendursaga-charter_DRAFT.md is its Annex A
          (Wādī al-Salām field architecture). Status per source: SEALED
          (concept); implementation remains BLOCKED behind PB-150..PB-160
          testing, per the Governing Law. Documentation only -- no Rust
          code changed by this playbook.
