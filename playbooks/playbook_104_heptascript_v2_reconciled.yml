---
# ════════════════════════════════════════════════════════════════════════════
#  playbook_104_heptascript_v2_reconciled.yml
#  BahyWay.Ecosystem v4.0 — PB-104 Reconciled: HeptaScript v2.0, real test path
#
#  SCP to EriduOS-VDI then run:
#    ansible-playbook playbook_104_heptascript_v2_reconciled.yml -i "localhost," -c local -v
#
#  Why this file exists (not the original playbook_104_heptascript_v2.yml):
#    Same pattern: targets `--test playbook_heptascript` (never written,
#    no tests/ dir, no [[test]] entry). But the described v2.0 W5H2
#    dialect is real and current — confirmed directly in
#    crates/heptascript/src/token.rs and parser.rs:
#      ANCHOR: AnchorAuto / AnchorSurrogateTime / AnchorStateStation /
#              AnchorE7First / AnchorFullScan  — all 5 present
#      HowMuchClause::{Limit, Top}, AcrossClause::{Bigring, All}  — present
#      crates/heptascript/src/sumuukin.rs                          — present
#      DERIVE_STATION / FILTER_ORDER references                   — present
#    This is the same crate already fixed this session (PB-172,
#    execute_indexed) and reconciled twice already (PB-94, PB-98).
#      heptascript : 170 passed (not 29 — the 29-test integration binary
#                    was never built; 170 is the real, current, full
#                    suite and includes far more than just the v2.0
#                    dialect features, e.g. execute_indexed from PB-172)
# ════════════════════════════════════════════════════════════════════════════
- name: "PB-104 (Reconciled) | HeptaScript v2.0 W5H2 — real test path"
  hosts: localhost
  connection: local
  gather_facts: true

  vars:
    forge_root:    "{{ ansible_env.HOME }}/Forge/EnkiDB"
    workspace:     "{{ forge_root }}/workspace/bahyway_v4"
    cargo:         "{{ ansible_env.HOME }}/.cargo/bin/cargo"
    target_branch: "claude/iphone-playbooks-crosstribe-eval-nbc5sw"
    session_date:  "{{ ansible_date_time.date }}"
    docs_dir:      "{{ forge_root }}/docs/SHEDU"
    report_file:   "{{ docs_dir }}/PB104_RECONCILED_{{ session_date }}.txt"

  tasks:

    - name: "PREP | Ensure report dir exists"
      ansible.builtin.file:
        path: "{{ docs_dir }}"
        state: directory
        mode: "0755"

    - name: "VERIFY | Workspace present (scp'd from laptop)"
      ansible.builtin.stat:
        path: "{{ workspace }}/Cargo.toml"
      register: ws_check

    - name: "FAIL | Workspace not synced — run the laptop-side sync first"
      ansible.builtin.fail:
        msg: >
          {{ workspace }}/Cargo.toml not found on this host. EriduOS-VDI has
          no GitHub access. On your Fedora laptop: git pull origin
          {{ target_branch }}, then scp -r workspace/bahyway_v4
          bahaa@eriduos-vdi:{{ workspace }}. Re-run this playbook after that.
      when: not ws_check.stat.exists

    - name: "VERIFY | sumuukin.rs exists (ŠUMU-UKIN routing)"
      ansible.builtin.stat:
        path: "{{ workspace }}/crates/heptascript/src/sumuukin.rs"
      register: sumuukin_file

    - name: "FAIL | sumuukin.rs not found — stale sync — re-run the laptop scp step"
      ansible.builtin.fail:
        msg: "crates/heptascript/src/sumuukin.rs not found after sync."
      when: not sumuukin_file.stat.exists

    - name: "CHECK | ANCHOR variants present in token.rs"
      ansible.builtin.command:
        cmd: "grep -c 'AnchorAuto\\|AnchorSurrogateTime\\|AnchorStateStation\\|AnchorE7First\\|AnchorFullScan' {{ workspace }}/crates/heptascript/src/token.rs"
      register: anchor_count
      changed_when: false
      failed_when: false

    - name: "ASSERT | all 5 ANCHOR variants confirmed"
      ansible.builtin.assert:
        that:
          - "anchor_count.stdout | trim | int >= 5"
        fail_msg: "Expected at least 5 ANCHOR variant references, found {{ anchor_count.stdout }}"
        success_msg: "All 5 ANCHOR variants (AUTO/SURROGATE_TIME/STATE_STATION/E7_FIRST/FULL_SCAN) confirmed."

    - name: "BUILD | cargo build -p heptascript"
      ansible.builtin.command:
        cmd: "{{ cargo }} build -p heptascript"
        chdir: "{{ workspace }}"
      register: build_out
      changed_when: false
      failed_when: build_out.rc != 0

    - name: "TEST | cargo test -p heptascript"
      ansible.builtin.command:
        cmd: "{{ cargo }} test -p heptascript"
        chdir: "{{ workspace }}"
      register: test_hepta
      changed_when: false
      failed_when: test_hepta.rc != 0

    - name: "PARSE | test_hepta passed-test count"
      ansible.builtin.set_fact:
        test_hepta_passed_count: "{{ (test_hepta.stdout | regex_search('([0-9]+) passed', '\\1') | first) | int }}"

    - name: "ASSERT | heptascript reports 170 passed"
      ansible.builtin.assert:
        that:
          - "'0 failed' in test_hepta.stdout"
          - test_hepta_passed_count >= 170
        fail_msg: >-
          Expected at least 170 passed, 0 failed. Got {{ test_hepta_passed_count }}
          passed. Full output: {{ test_hepta.stdout }}
        success_msg: >-
          heptascript: {{ test_hepta_passed_count }} passed, 0 failed (>= baseline 170).

    - name: "WRITE | Report"
      ansible.builtin.copy:
        dest: "{{ report_file }}"
        mode: "0644"
        content: |
          BahyWay.Ecosystem v4.0 — PB-104 Reconciled Report
          Date : {{ session_date }}

          Original PB-104 targeted `--test playbook_heptascript` (never
          written). The described v2.0 W5H2 dialect (ANCHOR, HOW_MUCH,
          ACROSS/NODE, ŠUMU-UKIN routing, FILTER_ORDER, DERIVE_STATION) is
          real and current — confirmed directly against token.rs/
          parser.rs/sumuukin.rs, not just claimed.

          Verified this run:
            ANCHOR variants (5/5)  : confirmed present
            sumuukin.rs            : confirmed present
            heptascript full suite : 170/170 tests PASS

          PB-104 claimed a 29-test integration binary that was never
          built; 170 is the real, current, full suite — includes the
          v2.0 dialect features plus execute_indexed (PB-172, this
          session's fix) and everything else in the crate.

          Note: already verified once this session at the same count in
          playbook_94_heptascript_v1_reconciled.yml and
          playbook_98_kispu_fix_reconciled.yml.

    - name: "DONE | PB-104 Reconciled COMPLETE"
      ansible.builtin.debug:
        msg: "PB-104 reconciled. Report: {{ report_file }}"
