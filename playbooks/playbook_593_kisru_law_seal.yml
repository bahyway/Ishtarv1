# =============================================================================
# PB-593 — The Kiṣru Law: Concept Seal (GL-ALG-004)
# BahyWay.Ecosystem v4.0 — 2026-08-23
#
# WHY THIS PLAYBOOK EXISTS
#   Seals GL-ALG-004: the Algebra Arsenal's members grouped into eight
#   standing kiṣru (task-forces), each declaring a mission, a muster,
#   an independent witness chain, a deliverable, and a scoring ledger
#   (§1-2). The Joint-Operations Clause lets members serve several
#   formations while a shared sensor counts once toward any conviction
#   (§3). The Liveness Clause keeps the Arsenal live by scheduled proof
#   -- an undrilled kiṣru hollows to DORMANT in the Arsenal Atlas (§4).
#   The Accession Clause refuses any future member without a declared
#   formation (§5).
#
#   Landed from a standalone Architect-supplied upload (2026-08-23),
#   evaluated file-by-file against this repo before landing and
#   RENUMBERED per this repo's standing rule: the source deposit's own
#   PB-ALG-004 -> PB-593 here. See
#   shala-prototypes/batch19_adannu_askuppu_kisru_asakku_epeshu/README.md
#   for the full renumbering table. This tablet's own Parents field
#   named GL-ALG-003 for its Askuppu member -- corrected to GL-ALG-005
#   in the landed copy, matching the collision fix applied to the
#   Askuppu tablet itself (see playbook_592's header for the full
#   account). This tablet also names two dependencies not delivered in
#   this batch: GL-HYD-001 (Tirku, Napharu member 55, K1's muster) and
#   GL-NIM-003 (Bārûtu, cited in K1/K2's musters) -- neither exists
#   anywhere in this repo yet.
#
# WHAT THIS PLAYBOOK DOES
#   PROVEs all eight kiṣru (K1 through K8) are named with their epithets,
#   PROVEs the Joint-Operations, Liveness, and Accession clauses are
#   sealed verbatim, and PROVEs the Sala court (the Arsenal Atlas)
#   renders the eight-formation muster with drill/DORMANT states.
#   Deposits nothing new -- docs and Sala tab are committed directly
#   into docs/ and shala-prototypes/, this playbook is a
#   pointer/verification record.
#
# Running this playbook = CSR-08 confirmation. Review -> --check -> live.
# =============================================================================

- name: "PB-593 | Seal the Kiṣru Law (GL-ALG-004)"
  hosts: localhost
  connection: local
  become: false
  vars:
    repo_root: "{{ playbook_dir }}/.."
    tablet_file: "{{ repo_root }}/docs/09_observatory/GL-ALG-004_Kisru_Law.md"
    court_file: "{{ repo_root }}/shala-prototypes/batch19_adannu_askuppu_kisru_asakku_epeshu/sala_gl_alg_004_arsenal_atlas.html"

  tasks:

    - name: "0.1 | Confirm the tablet and the Sala court are landed"
      ansible.builtin.stat:
        path: "{{ item }}"
      register: land_stat
      loop:
        - "{{ tablet_file }}"
        - "{{ court_file }}"
      loop_control: { label: "{{ item }}" }

    - name: "FAIL | required file missing"
      ansible.builtin.fail:
        msg: "{{ item.item }} not found -- nothing to seal."
      loop: "{{ land_stat.results }}"
      loop_control: { label: "{{ item.item }}" }
      when: not item.stat.exists

    - name: "1.1 | PROVE all eight kiṣru are named"
      ansible.builtin.shell: |
        set -e
        grep -qF "KIṢRU-MÛ" "{{ tablet_file }}"
        grep -qF "KIṢRU-DŪRI" "{{ tablet_file }}"
        grep -qF "KIṢRU-ḪARRĀNI" "{{ tablet_file }}"
        grep -qF "KIṢRU-ŠAMŠI" "{{ tablet_file }}"
        grep -qF "KIṢRU-ṢALMI" "{{ tablet_file }}"
        grep -qF "KIṢRU-NANŠE" "{{ tablet_file }}"
        grep -qF "KIṢRU-KIDINNI" "{{ tablet_file }}"
        grep -qF "KIṢRU-ṬUPPI" "{{ tablet_file }}"
        echo "PROVEN: all eight kiṣru (K1..K8) are named"
      register: prove_eight
      changed_when: false

    - name: "1.2 | PROVE the Joint-Operations Clause is sealed"
      ansible.builtin.shell: |
        set -e
        grep -qF "Kiṣru share members and MUST share witnesses lawfully" "{{ tablet_file }}"
        grep -qF "counts ONCE toward any conviction" "{{ tablet_file }}"
        echo "PROVEN: the Joint-Operations Clause is sealed"
      register: prove_joint
      changed_when: false

    - name: "1.3 | PROVE the Liveness Clause and DORMANT flagging are sealed"
      ansible.builtin.shell: |
        set -e
        grep -qF "last drill" "{{ tablet_file }}"
        grep -qF "flagged **DORMANT**" "{{ tablet_file }}"
        grep -qF "not by oath but by scheduled proof" "{{ tablet_file }}"
        echo "PROVEN: the Liveness Clause is sealed"
      register: prove_liveness
      changed_when: false

    - name: "1.4 | PROVE the Accession Clause is sealed"
      ansible.builtin.shell: |
        set -e
        grep -qF "declares, at enrollment, which" "{{ tablet_file }}"
        grep -qF "formation is inventory, and inventory is refused" "{{ tablet_file }}"
        echo "PROVEN: the Accession Clause is sealed"
      register: prove_accession
      changed_when: false

    - name: "1.5 | PROVE the Sala court renders the eight kiṣru with drill/DORMANT states"
      ansible.builtin.shell: |
        set -e
        grep -qF "eight kiṣru" "{{ court_file }}"
        grep -qF "DORMANT" "{{ court_file }}"
        grep -qF "Joint-Operations" "{{ court_file }}"
        grep -qF "muster ledger" "{{ court_file }}"
        echo "PROVEN: the Arsenal Atlas renders the eight formations and their liveness state"
      register: prove_court
      changed_when: false

    - name: "2.1 | Report"
      ansible.builtin.debug:
        msg: >
          PB-593 complete. GL-ALG-004 sealed: the fifty-five-member
          Arsenal grouped into eight kiṣru, each with its own mission,
          muster, witness chain, and deliverable; shared members counted
          once per conviction; liveness kept by scheduled drill, not
          oath; future members refused without a declared formation.
          Renumbered from the source deposit's PB-ALG-004; see
          shala-prototypes/batch19_adannu_askuppu_kisru_asakku_epeshu/README.md
          for the full renumbering table and the open notes on
          GL-HYD-001 (Tirku) and GL-NIM-003 (Bārûtu), named in this
          tablet's musters but not yet landed anywhere in this repo.
