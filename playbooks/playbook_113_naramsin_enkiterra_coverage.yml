---
# ════════════════════════════════════════════════════════════════════════════
#  playbook_113_naramsin_enkiterra_coverage.yml
#  PB-113/114/115/116 coverage confirmation (NARAMSIN family + ENKI-TERRA ingest)
#
#  Run: ansible-playbook playbook_113_naramsin_enkiterra_coverage.yml -i "localhost," -c local -v
#
#  Per RM-001_ADDENDUM_PB111-145_VERIFIED_2026-07-01.md:
#    113 naramsin_engine_formalise — not needed, covered by the crates below
#    114 naramsin_format_layer     — already implemented, tested
#    115 naramsin_mashsharu_bridge — already implemented (Phase 1 scaffold)
#    116 enki_terra_suite_wire     — redesigned + implemented that session
#  This playbook re-verifies all four claims against today's actual code in
#  one pass, with real counts asserted, not assumed from the 2026-07-01 doc.
#
#  Honest note on naramsin-bridge (PB-115): it is real but thin -- 81 lines,
#  0 dedicated tests as of this writing. This playbook does NOT assert a
#  test count for it (there are none to assert); it only confirms the crate
#  builds. Treat PB-115 as a real scaffold, not a finished item.
# ════════════════════════════════════════════════════════════════════════════
- name: "PB-113 | NARAMSIN + ENKI-TERRA Ingest Coverage Confirmation"
  hosts: localhost
  connection: local
  gather_facts: true
  vars:
    forge_root:    "{{ ansible_env.HOME }}/Forge/EnkiDB"
    workspace:     "{{ forge_root }}/workspace/bahyway_v4"
    cargo:         "{{ ansible_env.HOME }}/.cargo/bin/cargo"
    target_branch: "claude/iphone-playbooks-crosstribe-eval-nbc5sw"
    session_date:  "{{ ansible_date_time.date }}"
    report_file:   "{{ forge_root }}/docs/PB113_REPORT_{{ session_date }}.txt"

  tasks:
    # ── Sync verification — NO git on this host ────────────────────────────
    # EriduOS-VDI is not a GitHub-connected clone. GitHub lives on the
    # laptop (Fedora host). Workflow: laptop runs git pull, then scp -r
    # the updated workspace/bahyway_v4 to this host at {{ workspace }}.
    # This playbook only verifies that sync already happened.
    - name: "VERIFY | Workspace present (scp'd from laptop)"
      ansible.builtin.stat:
        path: "{{ workspace }}/Cargo.toml"
      register: ws_check

    - name: "FAIL | Workspace not synced — run the laptop-side sync first"
      ansible.builtin.fail:
        msg: >
          {{ workspace }}/Cargo.toml not found on this host. EriduOS-VDI has
          no GitHub access. On your Fedora laptop: git pull origin
          {{ target_branch }}, then scp -r workspace/bahyway_v4
          bahaa@eriduos-vdi:{{ workspace }}. Re-run this playbook after that.
      when: not ws_check.stat.exists

    - name: "TEST | naramsin-format (PB-114)"
      ansible.builtin.command: {cmd: "{{ cargo }} test -p naramsin-format", chdir: "{{ workspace }}"}
      register: t_fmt
      changed_when: false
      failed_when: t_fmt.rc != 0
    - {name: "ASSERT | naramsin-format 2 passed", ansible.builtin.assert: {that: ["((t_fmt.stdout | regex_search('([0-9]+) passed', '\\\\1') | first | int) >= 2)"], fail_msg: "{{ t_fmt.stdout }}"}}

    - name: "BUILD | naramsin-bridge (PB-115, scaffold, no dedicated tests yet)"
      ansible.builtin.command: {cmd: "{{ cargo }} build -p naramsin-bridge", chdir: "{{ workspace }}"}
      register: b_bridge
      changed_when: false
      failed_when: b_bridge.rc != 0

    - name: "TEST | naramsin-archive, naramsin-audit, naramsin-integrity (PB-113 coverage)"
      ansible.builtin.command: {cmd: "{{ cargo }} test -p naramsin-archive -p naramsin-audit -p naramsin-integrity", chdir: "{{ workspace }}"}
      register: t_narsuite
      changed_when: false
      failed_when: t_narsuite.rc != 0

    - name: "TEST | nanshe-ingest + esarhaddon-ingest + ashnan-ingest (PB-116)"
      ansible.builtin.command: {cmd: "{{ cargo }} test -p nanshe-ingest -p esarhaddon-ingest -p ashnan-ingest", chdir: "{{ workspace }}"}
      register: t_terra
      changed_when: false
      failed_when: t_terra.rc != 0
    - {name: "ASSERT | ENKI-TERRA ingest family 9 passed total", ansible.builtin.assert: {that: ["((t_terra.stdout | regex_search('([0-9]+) passed', '\\\\1') | first | int) >= 9) or (t_terra.stdout.count('3 passed') == 3)"], fail_msg: "{{ t_terra.stdout }}"}}

    - name: "BUILD | cargo build --workspace"
      ansible.builtin.command: {cmd: "{{ cargo }} build --workspace", chdir: "{{ workspace }}"}
      register: build_ws
      changed_when: false
      failed_when: build_ws.rc != 0

    - name: "PRINT | PB-113/114/115/116 verdict"
      ansible.builtin.debug:
        msg: |
          ╔═══════════════════════════════════════════════════════════════════╗
          ║  PB-114 naramsin-format          : 2/2 PASS                        ║
          ║  PB-115 naramsin-bridge          : builds (scaffold, no tests yet) ║
          ║  PB-113 naramsin-archive/audit/integrity : PASS                    ║
          ║  PB-116 nanshe/esarhaddon/ashnan-ingest  : 9/9 PASS                ║
          ║  workspace build                 : CLEAN                          ║
          ╚═══════════════════════════════════════════════════════════════════╝

    - name: "WRITE | Report"
      ansible.builtin.copy:
        dest: "{{ report_file }}"
        mode: "0644"
        content: |
          PB-113/114/115/116 — {{ session_date }} — {{ ansible_hostname }}
          naramsin-format: {{ t_fmt.stdout }}
          naramsin-bridge build: {{ 'CLEAN' if b_bridge.rc == 0 else 'FAILED' }}
          naramsin-archive/audit/integrity: {{ t_narsuite.stdout }}
          ENKI-TERRA ingest family: {{ t_terra.stdout }}
          workspace build: {{ 'CLEAN' if build_ws.rc == 0 else 'FAILED' }}

    - {name: "DONE", ansible.builtin.debug: {msg: "PB-113 complete — report at {{ report_file }}"}}
