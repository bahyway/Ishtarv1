# =============================================================================
# PB-586 — The Puluḫtu Law: Concept Seal (GL-RU-001)
# BahyWay.Ecosystem v4.0 — 2026-08-23
#
# WHY THIS PLAYBOOK EXISTS
#   Seals GL-RU-001, minting Puluḫtu (Pu) as the Ecosystem's one risk
#   currency: born per (particle, hazard, horizon) from a declared
#   quadruple (Impact, Likelihood with named basis, epistemic Register,
#   PRACTICAL/THEORETICAL class), never a composite average. A
#   THEORETICAL Pu is capped below the lowest action floor and can only
#   convert to PRACTICAL by witnessed evidence. Across particles, Pu
#   composes by MAXIMUM only -- a site's Pu is its worst-served
#   particle's Pu -- making the Never-Averaged axiom (Napharu §4) into
#   the unit's own arithmetic. The RU Ledger keeps every prophesied Pu
#   falsifiable against witnessed outcome.
#
#   Landed from a standalone Architect-supplied upload (2026-08-23),
#   evaluated file-by-file against this repo before landing and
#   RENUMBERED per this repo's standing rule: the source deposit's own
#   PB-RU-001 -> PB-586 here. See
#   shala-prototypes/batch16_saadoun_family_puluhtu_deploygate/README.md
#   for the full renumbering table and the open dependency-gap note
#   (this tablet's parent GL-ALG-002/Napharu is not yet sealed in
#   docs/09_observatory/, same gap noted for the Saadoun family
#   tablets landed alongside it in this batch).
#
# WHAT THIS PLAYBOOK DOES
#   PROVEs the tablet's own four stated proof obligations (RU-PO-1
#   through RU-PO-4) are named, PROVEs the Minting Quadruple, the
#   Theoretical Cap, and Composition by Maximum are sealed verbatim,
#   and PROVEs the Sala court stages the minting act and contrasts the
#   industry average against the Puluḫtu way. Deposits nothing new --
#   docs and Sala tab are committed directly into docs/ and
#   shala-prototypes/, this playbook is a pointer/verification record.
#
# Running this playbook = CSR-08 confirmation. Review -> --check -> live.
# =============================================================================

- name: "PB-586 | Seal the Puluḫtu Law (GL-RU-001)"
  hosts: localhost
  connection: local
  become: false
  vars:
    repo_root: "{{ playbook_dir }}/.."
    tablet_file: "{{ repo_root }}/docs/09_observatory/GL-RU-001_Puluhtu_Law.md"
    court_file: "{{ repo_root }}/shala-prototypes/batch16_saadoun_family_puluhtu_deploygate/sala_gl_ru_001_puluhtu_court.html"

  tasks:

    - name: "0.1 | Confirm the tablet and the Sala court are landed"
      ansible.builtin.stat:
        path: "{{ item }}"
      register: land_stat
      loop:
        - "{{ tablet_file }}"
        - "{{ court_file }}"
      loop_control: { label: "{{ item }}" }

    - name: "FAIL | required file missing"
      ansible.builtin.fail:
        msg: "{{ item.item }} not found -- nothing to seal."
      loop: "{{ land_stat.results }}"
      loop_control: { label: "{{ item.item }}" }
      when: not item.stat.exists

    - name: "1.1 | PROVE the tablet's own four proof obligations (RU-PO-1..4) are named"
      ansible.builtin.shell: |
        set -e
        grep -qF "RU-PO-1" "{{ tablet_file }}"
        grep -qF "RU-PO-2" "{{ tablet_file }}"
        grep -qF "RU-PO-3" "{{ tablet_file }}"
        grep -qF "RU-PO-4" "{{ tablet_file }}"
        echo "PROVEN: RU-PO-1..4 all present"
      register: prove_pos
      changed_when: false

    - name: "1.2 | PROVE the Minting Quadruple and universal standing are sealed"
      ansible.builtin.shell: |
        set -e
        grep -qF "MUST emit its risk findings in" "{{ tablet_file }}"
        grep -qF "Impact ordinal (1–5)" "{{ tablet_file }}"
        grep -qF "Likelihood ordinal (1–5)" "{{ tablet_file }}"
        grep -qF "the epistemic register" "{{ tablet_file }}"
        grep -qF "PRACTICAL" "{{ tablet_file }}"
        grep -qF "THEORETICAL" "{{ tablet_file }}"
        echo "PROVEN: the Minting Quadruple (I, L, R, C) and mandatory Pu standing are sealed"
      register: prove_quadruple
      changed_when: false

    - name: "1.3 | PROVE the Theoretical Cap is sealed"
      ansible.builtin.shell: |
        set -e
        grep -qF "The Theoretical Cap" "{{ tablet_file }}"
        grep -qF "capped at a declared ceiling" "{{ tablet_file }}"
        echo "PROVEN: the Theoretical Cap is sealed"
      register: prove_cap
      changed_when: false

    - name: "1.4 | PROVE Composition by Maximum is sealed verbatim"
      ansible.builtin.shell: |
        set -e
        grep -qF "Pu composes by MAXIMUM — never by sum, mean, or weighted blend" "{{ tablet_file }}"
        grep -qF "A single blended index is forbidden" "{{ tablet_file }}"
        echo "PROVEN: Composition by Maximum is sealed"
      register: prove_composition
      changed_when: false

    - name: "1.5 | PROVE the RU Ledger calibration obligation is sealed"
      ansible.builtin.shell: |
        set -e
        grep -qF "The **RU Ledger**" "{{ tablet_file }}"
        grep -qF "Every prophesied Pu is a falsifiable claim" "{{ tablet_file }}"
        echo "PROVEN: the RU Ledger calibration obligation is sealed"
      register: prove_ledger
      changed_when: false

    - name: "1.6 | PROVE the Sala court stages minting and the industry-average vs. Puluḫtu-way contrast"
      ansible.builtin.shell: |
        set -e
        grep -qF "MINT THE PU" "{{ court_file }}"
        grep -qF "THE WRONG WAY" "{{ court_file }}"
        grep -qF "THE PULUḪTU WAY" "{{ court_file }}"
        grep -qF "distribution" "{{ court_file }}"
        echo "PROVEN: the court stages minting and the average-vs-maximum contrast"
      register: prove_court
      changed_when: false

    - name: "2.1 | Report"
      ansible.builtin.debug:
        msg: >
          PB-586 complete. GL-RU-001 sealed: Puluḫtu (Pu) mints per
          particle from a declared (Impact, Likelihood, Register,
          Class) quadruple, caps THEORETICAL findings below the action
          floor, composes strictly by MAXIMUM across particles and
          services (never sum, mean, or blend), and keeps every
          prophesied Pu falsifiable in the RU Ledger. Renumbered from
          the source deposit's PB-RU-001; see
          shala-prototypes/batch16_saadoun_family_puluhtu_deploygate/README.md
          for the full renumbering table and the open note that this
          tablet's parent, GL-ALG-002 (Napharu), remains unsealed in
          docs/09_observatory/.
