# =============================================================================
# PB-561 — Nimrud Observatory: Verdict Indicators Seal (GL-NIM-001)
# BahyWay.Ecosystem v4.0 — 2026-08-20
#
# WHY THIS PLAYBOOK EXISTS
#   Seals GL-NIM-001, the twelve-indicator W5H2 decree for a leak
#   verdict (location, onset, duration, release class, pattern, cause,
#   loss rate, volume, crack size, deterioration rate, solution, cost),
#   each stamped with one of four epistemic classes -- MEASURED /
#   DERIVED / ESTIMATED / ADVISED -- so an estimate is never rendered as
#   a measurement (the failure this doctrine names and forbids: Yan et
#   al. 2024 JSTARS, cited in GL-STK-001 Clause C5). Doctrine under
#   GL-STK-001 (PB-560). CONCEPT DOCUMENT ONLY, landed as a Sala
#   rehearsal -- production truth remains sovereign egui/WGPU.
#
#   Landed from the same Thu20260820 "Nimrud Stack" thread as PB-560,
#   renumbered from the source session's PB-354 per this repo's
#   standing rule -- see shala-prototypes/batch10_nimrud_stack/README.md.
#
# GUARDED BOUNDARY:
#   An ESTIMATED or ADVISED value is never rendered as MEASURED --
#   this is the dashboard's own version of a self-minted negative.
#
# WHAT THIS PLAYBOOK DOES
#   PROVEs the Epistemic Stamp Law (N1), the twelve W5H2 indicators
#   (N2), the FAVAD frozen-constants clause (N4), and the Sala
#   observatory's REHEARSAL banner + the DIRECT CRACK OBSERVATION
#   refusal record (N5, L83-L86) are present. Pointer/verification
#   record only, matching playbook_559/560's own precedent.
#
# Running this playbook = CSR-08 confirmation. Review -> --check -> live.
# =============================================================================

- name: "PB-561 | Seal the Nimrud Observatory (GL-NIM-001)"
  hosts: localhost
  connection: local
  become: false
  vars:
    repo_root: "{{ playbook_dir }}/.."
    tablet_file: "{{ repo_root }}/docs/09_observatory/GL-NIM-001_Nimrud_Verdict_Indicators.md"
    observatory_file: "{{ repo_root }}/shala-prototypes/batch10_nimrud_stack/shala_nimrud_observatory.html"

  tasks:

    - name: "0.1 | Confirm the tablet and the Sala observatory are landed"
      ansible.builtin.stat:
        path: "{{ item }}"
      register: land_stat
      loop:
        - "{{ tablet_file }}"
        - "{{ observatory_file }}"
      loop_control: { label: "{{ item }}" }

    - name: "FAIL | required file missing"
      ansible.builtin.fail:
        msg: "{{ item.item }} not found -- nothing to seal."
      loop: "{{ land_stat.results }}"
      loop_control: { label: "{{ item.item }}" }
      when: not item.stat.exists

    - name: "1.1 | PROVE N1 -- the Epistemic Stamp Law's four classes are present in the tablet"
      ansible.builtin.shell: |
        set -e
        grep -q "MEASURED" "{{ tablet_file }}"
        grep -q "DERIVED" "{{ tablet_file }}"
        grep -q "ESTIMATED" "{{ tablet_file }}"
        grep -q "ADVISED" "{{ tablet_file }}"
        grep -q "never rendered as MEASURED" "{{ tablet_file }}"
        echo "PROVEN: all four epistemic classes present, self-minted-negative prohibition stated"
      register: prove_n1
      changed_when: false

    - name: "1.2 | PROVE N2 -- all twelve W5H2 indicators are present in the tablet"
      ansible.builtin.shell: |
        set -e
        for word in Location "Onset epoch" Duration "Release class" Pattern Cause "Loss rate" "Volume lost" "Crack size" "Deterioration rate" "Solution + replacement" Cost; do
          grep -q "$word" "{{ tablet_file }}" || { echo "MISSING: $word"; exit 1; }
        done
        echo "PROVEN: all twelve indicators present"
      register: prove_n2
      changed_when: false

    - name: "1.3 | PROVE N4 -- the FAVAD frozen-constants clause is present"
      ansible.builtin.shell: |
        set -e
        grep -q "FAVAD" "{{ tablet_file }}"
        grep -q "never refitted" "{{ tablet_file }}"
        echo "PROVEN: FAVAD constants clause present, refitting explicitly forbidden"
      register: prove_n4
      changed_when: false

    - name: "1.4 | PROVE L83-L86 -- the Sala observatory carries all four classes, the REHEARSAL banner, and the DIRECT CRACK OBSERVATION refusal"
      ansible.builtin.shell: |
        set -e
        grep -q "MEASURED" "{{ observatory_file }}"
        grep -q "DERIVED" "{{ observatory_file }}"
        grep -q "ESTIMATED" "{{ observatory_file }}"
        grep -q "ADVISED" "{{ observatory_file }}"
        grep -q "REHEARSAL DATA" "{{ observatory_file }}"
        grep -qi "DIRECT CRACK OBSERVATION" "{{ observatory_file }}"
        echo "PROVEN: all four epistemic chips render, REHEARSAL banner present, crack-observation refusal record present"
      register: prove_court
      changed_when: false

    - name: "2.1 | Report"
      ansible.builtin.debug:
        msg: >
          PB-561 complete. GL-NIM-001 sealed: the Epistemic Stamp Law's
          four classes (MEASURED/DERIVED/ESTIMATED/ADVISED) govern all
          twelve W5H2 verdict indicators, FAVAD constants are frozen and
          cited rather than refitted, and the Sala observatory
          (shala_nimrud_observatory.html) renders every chip honestly
          with a REHEARSAL DATA banner and a refusal record for the one
          thing no sensor can see directly -- crack geometry.
          Renumbered from the source session's PB-354; see
          shala-prototypes/batch10_nimrud_stack/README.md.
