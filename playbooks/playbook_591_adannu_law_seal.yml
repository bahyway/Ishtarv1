# =============================================================================
# PB-591 — The Adannu Law: Concept Seal (GL-TPL-001)
# BahyWay.Ecosystem v4.0 — 2026-08-23
#
# WHY THIS PLAYBOOK EXISTS
#   Seals GL-TPL-001: a template is not a place, it is a place × its
#   conditions (§2) -- every template carries a mandatory adannu-stamp
#   set at S0. Templates of one spot form a NUZI lineage (§3, succession
#   never overwrite) around persistent roots (§4). The Many-Faces
#   Theorem names the Timeless-Scene Fallacy -- averaging epochs into
#   one face -- inadmissible anywhere in the Ecosystem (§5), with
#   cross-adannu HeptaScript queries as first-class standing (§6) and
#   template subtraction firing Nanshe Events (§7).
#
#   Landed from a standalone Architect-supplied upload (2026-08-23),
#   evaluated file-by-file against this repo before landing and
#   RENUMBERED per this repo's standing rule: the source deposit's own
#   PB-TPL-001 -> PB-591 here. See
#   shala-prototypes/batch19_adannu_askuppu_kisru_asakku_epeshu/README.md
#   for the full renumbering table and the open dependency-gap note
#   (this tablet's parent GL-CLR-001/SafaaHarmony was not delivered in
#   this batch and is not yet landed anywhere in this repo).
#
# WHAT THIS PLAYBOOK DOES
#   PROVEs the tablet's own four stated proof obligations (TPL-PO-1
#   through TPL-PO-4) are named, PROVEs the Template Doctrine, the
#   Lineage Clause, Root Persistence, and the Many-Faces
#   Theorem/Timeless-Scene Fallacy are sealed verbatim. PROVEs the Sala
#   court (the Adannu Wheel) renders the still-axle roots and the
#   Fallacy dying by sight across six epochs. Deposits nothing new --
#   docs and Sala tab are committed directly into docs/ and
#   shala-prototypes/, this playbook is a pointer/verification record.
#
# Running this playbook = CSR-08 confirmation. Review -> --check -> live.
# =============================================================================

- name: "PB-591 | Seal the Adannu Law (GL-TPL-001)"
  hosts: localhost
  connection: local
  become: false
  vars:
    repo_root: "{{ playbook_dir }}/.."
    tablet_file: "{{ repo_root }}/docs/09_observatory/GL-TPL-001_Adannu_Law.md"
    court_file: "{{ repo_root }}/shala-prototypes/batch19_adannu_askuppu_kisru_asakku_epeshu/sala_gl_tpl_001_adannu_wheel.html"

  tasks:

    - name: "0.1 | Confirm the tablet and the Sala court are landed"
      ansible.builtin.stat:
        path: "{{ item }}"
      register: land_stat
      loop:
        - "{{ tablet_file }}"
        - "{{ court_file }}"
      loop_control: { label: "{{ item }}" }

    - name: "FAIL | required file missing"
      ansible.builtin.fail:
        msg: "{{ item.item }} not found -- nothing to seal."
      loop: "{{ land_stat.results }}"
      loop_control: { label: "{{ item.item }}" }
      when: not item.stat.exists

    - name: "1.1 | PROVE the tablet's own four proof obligations (TPL-PO-1..4) are named"
      ansible.builtin.shell: |
        set -e
        grep -qF "TPL-PO-1" "{{ tablet_file }}"
        grep -qF "TPL-PO-2" "{{ tablet_file }}"
        grep -qF "TPL-PO-3" "{{ tablet_file }}"
        grep -qF "TPL-PO-4" "{{ tablet_file }}"
        echo "PROVEN: TPL-PO-1..4 all present"
      register: prove_pos
      changed_when: false

    - name: "1.2 | PROVE the Template Doctrine is sealed verbatim"
      ansible.builtin.shell: |
        set -e
        grep -qF "A template is not a place. A template is a place" "{{ tablet_file }}"
        grep -qF "without an adannu-stamp is void" "{{ tablet_file }}"
        echo "PROVEN: the Template Doctrine is sealed"
      register: prove_doctrine
      changed_when: false

    - name: "1.3 | PROVE the Lineage Clause and Root Persistence are sealed"
      ansible.builtin.shell: |
        set -e
        grep -qF "the drought template does not correct the spring template" "{{ tablet_file }}"
        grep -qF "the roots persist" "{{ tablet_file }}"
        grep -qF "The center of the wheel does not turn" "{{ tablet_file }}"
        echo "PROVEN: succession-not-overwrite and root persistence are sealed"
      register: prove_lineage
      changed_when: false

    - name: "1.4 | PROVE the Many-Faces Theorem and the Timeless-Scene Fallacy are sealed"
      ansible.builtin.shell: |
        set -e
        grep -qF "One spot lawfully owns many ontographs" "{{ tablet_file }}"
        grep -qF "Timeless-Scene Fallacy" "{{ tablet_file }}"
        grep -qF "is inadmissible reasoning anywhere in the" "{{ tablet_file }}"
        echo "PROVEN: the Many-Faces Theorem and the Timeless-Scene Fallacy are sealed"
      register: prove_fallacy
      changed_when: false

    - name: "1.5 | PROVE the Sala court renders the still axle and the six-epoch wheel"
      ansible.builtin.shell: |
        set -e
        grep -qF "The roots never move; the world does" "{{ court_file }}"
        grep -qF "still axle" "{{ court_file }}"
        grep -qF "NUZI" "{{ court_file }}"
        grep -qF "Timeless-Scene Fallacy" "{{ court_file }}"
        echo "PROVEN: the Wheel renders the still axle, NUZI lineage, and the dying Fallacy"
      register: prove_court
      changed_when: false

    - name: "2.1 | Report"
      ansible.builtin.debug:
        msg: >
          PB-591 complete. GL-TPL-001 sealed: a template is a place
          times its conditions, mandatory adannu-stamped at S0; NUZI
          lineages hold successive templates without overwrite around
          persistent roots; the Timeless-Scene Fallacy is named and
          refused; cross-adannu queries are first-class HeptaScript.
          Renumbered from the source deposit's PB-TPL-001; see
          shala-prototypes/batch19_adannu_askuppu_kisru_asakku_epeshu/README.md
          for the full renumbering table and the open note that this
          tablet's parent GL-CLR-001 (SafaaHarmony) is not yet landed.
