# =============================================================================
# PB-579 — The Miṣru Rite: Concept Seal (GL-LBR-001-A2)
# BahyWay.Ecosystem v4.0 — 2026-08-21
#
# WHY THIS PLAYBOOK EXISTS
#   Seals GL-LBR-001-A2, the Miṣru Theorem: when two remarkably similar
#   tribes are governed by two remarkably similar rules, volatility
#   concentrates on the contested boundary (the rounding threshold, the
#   NULL branch, the truncation edge) -- jugglers are born on the
#   miṣru, nowhere else. The no-decay clause makes the demonstration
#   unanswerable: no global slackening is injected, every uncontested
#   mooring stays at theta_0, and the shape still loses its name from
#   contest alone. The lawful stakeholder claim is conditional
#   inevitability -- collapse is a scheduled event with a measured
#   countdown (median T_shape, P(collapse <= tau)) UNLESS the
#   harmonization decree is issued -- naming the mechanism,
#   quantifying the horizon, and demonstrating the remedy in the same
#   instrument, never an unfalsifiable claim of unconditional doom.
#
#   Landed from a parallel Claude session's Sun20260816 thread,
#   evaluated file-by-file against this repo before landing and
#   RENUMBERED per this repo's standing rule: the other session's own
#   PB-340 -> PB-579 here. See
#   shala-prototypes/batch13_sunday_shape_labiru_courts/README.md for
#   the full renumbering table.
#
# WHAT THIS PLAYBOOK DOES
#   PROVEs the tablet's own four stated law tests (L37-L40) are
#   present, PROVEs the Miṣru Theorem's three sealed claims (birth,
#   no-decay, conditional inevitability) are sealed verbatim, and
#   PROVEs the Sala court renders the contested band, the T_shape
#   ensemble, and the decree lever. Deposits nothing new -- docs and
#   Sala tab are committed directly into docs/ and shala-prototypes/,
#   this playbook is a pointer/verification record.
#
# Running this playbook = CSR-08 confirmation. Review -> --check -> live.
# =============================================================================

- name: "PB-579 | Seal the Miṣru Rite (GL-LBR-001-A2)"
  hosts: localhost
  connection: local
  become: false
  vars:
    repo_root: "{{ playbook_dir }}/.."
    tablet_file: "{{ repo_root }}/docs/09_observatory/GL-LBR-001-A2_Misru_Rite.md"
    court_file: "{{ repo_root }}/shala-prototypes/batch13_sunday_shape_labiru_courts/shala_misru_court.html"

  tasks:

    - name: "0.1 | Confirm the tablet and the Sala court are landed"
      ansible.builtin.stat:
        path: "{{ item }}"
      register: land_stat
      loop:
        - "{{ tablet_file }}"
        - "{{ court_file }}"
      loop_control: { label: "{{ item }}" }

    - name: "FAIL | required file missing"
      ansible.builtin.fail:
        msg: "{{ item.item }} not found -- nothing to seal."
      loop: "{{ land_stat.results }}"
      loop_control: { label: "{{ item.item }}" }
      when: not item.stat.exists

    - name: "1.1 | PROVE the tablet's own four law tests (L37-L40) are named"
      ansible.builtin.shell: |
        set -e
        grep -qF "L37" "{{ tablet_file }}"
        grep -qF "L38" "{{ tablet_file }}"
        grep -qF "L39" "{{ tablet_file }}"
        grep -qF "L40" "{{ tablet_file }}"
        echo "PROVEN: L37-L40 all present"
      register: prove_law_tests
      changed_when: false

    - name: "1.2 | PROVE the Miṣru Theorem's three sealed claims are present"
      ansible.builtin.shell: |
        set -e
        grep -qF "Birth clause" "{{ tablet_file }}"
        grep -qF "jugglers are born on the miṣru, nowhere else" "{{ tablet_file }}"
        grep -qF "No-decay clause" "{{ tablet_file }}"
        grep -qF "every uncontested mooring stays at θ₀" "{{ tablet_file }}"
        grep -qF "Conditional inevitability" "{{ tablet_file }}"
        grep -qF "Shape Horizon T_shape is finite for every seed" "{{ tablet_file }}"
        echo "PROVEN: the birth clause, no-decay clause, and conditional-inevitability claim are all sealed"
      register: prove_theorem
      changed_when: false

    - name: "1.3 | PROVE the lawful stakeholder claim rejects unconditional doom"
      ansible.builtin.shell: |
        set -e
        grep -qF "UNLESS the harmonization decree is issued" "{{ tablet_file }}"
        grep -qF "Unconditional doom claims are a breach of the Honesty Clause" "{{ tablet_file }}"
        echo "PROVEN: the conditional-inevitability sentence is sealed and unconditional doom is named a breach"
      register: prove_claim
      changed_when: false

    - name: "1.4 | PROVE the Sala court renders the contested band, the ensemble, and the decree lever"
      ansible.builtin.shell: |
        set -e
        grep -qF "miṣru" "{{ court_file }}"
        grep -qF "nabalkutu" "{{ court_file }}"
        grep -qF "ensemble" "{{ court_file }}"
        grep -qF "T_shape" "{{ court_file }}"
        grep -qF "DECREE" "{{ court_file }}"
        grep -qF "harmonization" "{{ court_file }}"
        echo "PROVEN: the contested band, nabalkutu jugglers, ensemble run, T_shape marker, and decree lever all render"
      register: prove_court
      changed_when: false

    - name: "2.1 | Report"
      ansible.builtin.debug:
        msg: >
          PB-579 complete. GL-LBR-001-A2 sealed: the Miṣru Theorem
          (jugglers are born on the contested rule boundary, nowhere
          else; no global decay is injected, only contest; the Shape
          Horizon T_shape is finite for every seed absent a decree,
          and holds through the window once the decree issues) and the
          lawful stakeholder claim (conditional inevitability, never
          unfalsifiable unconditional doom) all hold, proven against
          the tablet's own four stated law tests L37-L40. The Sala
          court renders the contested band, the T_shape ensemble
          histogram, and the decree lever that reruns the same seeds
          held. Renumbered from the source session's PB-340; see
          shala-prototypes/batch13_sunday_shape_labiru_courts/README.md
          for the full renumbering table.
