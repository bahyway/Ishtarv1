# =============================================================================
# PB-575 — Land the Story Membrane Court (particle picker + churn diagnosis)
# BahyWay.Ecosystem v4.0 — 2026-08-21
#
# WHY THIS PLAYBOOK EXISTS
#   Registers the Story Membrane Court: a 3D particle picker over two
#   interlocked tribes (the Ṣabātu bounce-to-select signal, needed
#   exactly where tribes interlock and a flat click is ambiguous), the
#   selected particle's StoryEngine life read from NĀRU, and a
#   membrane scar-profile projection where wounds and strengthenings
#   dent the surface and a membership band shows tribe ping-pong
#   before any classifier names it. The churn verdict distinguishes
#   PING-PONG (>=2 alternating actors -- a rule conflict, naming a
#   missing GL-MDM-001 harmonization decree, never bad data or a bad
#   steward), one-way DRIFT, and STABLE.
#
#   NO DEDICATED GL LAW TABLET -- the source thread states this
#   instrument serves the already-landed GL-STY-001 (StoryEngine
#   Journal), GL-MDM-001 (Harmonization), and GL-DST-004 (Bell Veto
#   bench, PB-573) rather than proposing new sealed doctrine. This
#   playbook is therefore a landing/verification record, matching
#   playbook_559's and playbook_564's own precedent, not a law seal.
#
#   Landed from a parallel Claude session's Sun20260816 thread,
#   evaluated file-by-file against this repo before landing and
#   RENUMBERED per this repo's standing rule: the other session's own
#   PB-336 -> PB-575 here. Its source YAML materializes a
#   `story-churn` Rust crate on a remote host via Ansible copy tasks;
#   this playbook does not replicate that pattern (see
#   shala-prototypes/batch13_sunday_shape_labiru_courts/README.md,
#   "Materialization note") -- it verifies the landed Sala court's own
#   content instead.
#
# WHAT THIS PLAYBOOK DOES
#   PROVEs the Sala court renders the bounce-select signal, the
#   StoryEngine journal read, and the scar-profile membership band,
#   and PROVEs the PING-PONG verdict names the missing GL-MDM-001
#   decree rather than blaming the data or the steward -- the source
#   crate's own doctrinal sentence (verified against this repo's
#   already-landed GL-MDM-001-harmonization-survey.md, confirming the
#   cross-reference is not a dangling citation). Deposits nothing new
#   -- the Sala tab is committed directly into shala-prototypes/, this
#   playbook is a pointer/verification record.
#
# Running this playbook = CSR-08 confirmation. Review -> --check -> live.
# =============================================================================

- name: "PB-575 | Land the Story Membrane Court"
  hosts: localhost
  connection: local
  become: false
  vars:
    repo_root: "{{ playbook_dir }}/.."
    court_file: "{{ repo_root }}/shala-prototypes/batch13_sunday_shape_labiru_courts/shala_story_membrane_court.html"
    mdm_law: "{{ repo_root }}/docs/06_governance_parzu/GL-MDM-001-harmonization-survey.md"

  tasks:

    - name: "0.1 | Confirm the Sala court and the GL-MDM-001 cross-reference are both landed"
      ansible.builtin.stat:
        path: "{{ item }}"
      register: land_stat
      loop:
        - "{{ court_file }}"
        - "{{ mdm_law }}"
      loop_control: { label: "{{ item }}" }

    - name: "FAIL | required file missing"
      ansible.builtin.fail:
        msg: "{{ item.item }} not found -- nothing to seal."
      loop: "{{ land_stat.results }}"
      loop_control: { label: "{{ item.item }}" }
      when: not item.stat.exists

    - name: "1.1 | PROVE the bounce-select signal and StoryEngine journal read are staged"
      ansible.builtin.shell: |
        set -e
        grep -qF "Ṣabātu" "{{ court_file }}"
        grep -qF "bounce" "{{ court_file }}"
        grep -qF "StoryEngine" "{{ court_file }}"
        echo "PROVEN: the Ṣabātu grab-signal bounce and StoryEngine journal read are staged"
      register: prove_picker
      changed_when: false

    - name: "1.2 | PROVE the membrane scar-profile and PING-PONG verdict are staged"
      ansible.builtin.shell: |
        set -e
        grep -qF "scar" "{{ court_file }}"
        grep -qF "PING-PONG" "{{ court_file }}"
        grep -qF "GL-MDM-001" "{{ court_file }}"
        echo "PROVEN: the scar-profile membrane and the PING-PONG-names-the-missing-decree verdict are staged"
      register: prove_scar
      changed_when: false

    - name: "1.3 | PROVE the GL-MDM-001 cross-reference is not a dangling citation"
      ansible.builtin.command: "grep -c harmonization {{ mdm_law }}"
      register: prove_mdm
      changed_when: false
      failed_when: prove_mdm.stdout | int == 0

    - name: "2.1 | Report"
      ansible.builtin.debug:
        msg: >
          PB-575 complete. Story Membrane Court landed: the 3D
          interlocked-tribe stage with its Ṣabātu bounce-select signal,
          the StoryEngine life read from NĀRU on selection, and the
          membrane scar-profile projection whose PING-PONG verdict
          names a missing GL-MDM-001 harmonization decree as the
          finding -- never bad data, never a bad steward. GL-MDM-001
          confirmed already landed in this repo at
          docs/06_governance_parzu/, not a dangling citation. No
          dedicated GL law tablet for this instrument -- it serves the
          already-landed GL-STY-001/GL-MDM-001/GL-DST-004(PB-573).
          Renumbered from the source session's PB-336; see
          shala-prototypes/batch13_sunday_shape_labiru_courts/README.md
          for the full renumbering table.
