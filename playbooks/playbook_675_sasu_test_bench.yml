---
# PB-409 · Šasû Test Bench · a candidate is judged by the shape it leaves, at four scales
# GL-KRN-001 §3 (the ladder) · §4 (no decimation) · §5 (confidence visible) · §6 (the unknown is drawn) · §11 (the scene never writes)
- name: PB-409 stand up the Šasû test bench
  hosts: girsu
  vars:
    bahyway_provides: ["bench:sasu", "gate:shape_regression"]
    bahyway_requires: ["law:GL-KRN-001", "law:GL-LYF-001", "law:GL-SEG-001", "engine:LamassuEngine"]
    sala: "{{ ansible_env.HOME }}/bahyway/sala/tabs"
    out: "{{ ansible_env.HOME }}/bahyway/bench"
    tab: sala_sasu_test_bench_v1.html
    scales: [tribe, tribes, bigring, federation]
    thresholds: {locality_max_delta: 2.0, tau_max_delta: 0.05, beta0_max_delta: 0}
  tasks:
    - name: Ensure directories
      ansible.builtin.file: {path: "{{ item }}", state: directory, mode: "0750"}
      loop: ["{{ sala }}", "{{ out }}"]

    - name: Place the bench
      ansible.builtin.copy: {src: "{{ tab }}", dest: "{{ sala }}/{{ tab }}", mode: "0644"}

    - name: Gate B1 · the bench parses
      ansible.builtin.shell: |
        node -e "const h=require('fs').readFileSync('{{ sala }}/{{ tab }}','utf8');
                 new Function(h.split('<script>')[1].split('</script>')[0]);console.log('green');"
      changed_when: false

    - name: Gate B2 · the bench never writes and never touches a store
      ansible.builtin.shell: |
        ! grep -Eq 'fetch\(|XMLHttpRequest|localStorage|sessionStorage' "{{ sala }}/{{ tab }}"
        echo "B2 green - it simulates and proposes; PB-410 would execute"
      changed_when: false

    # ---- the part that runs in CI, not in the browser ----
    - name: Baseline the shape of the estate BEFORE the candidate
      ansible.builtin.command: >
        bahyway-lamassu shape --scope {{ item }} --emit beta0,beta1,g,locality,tau,layer_states --json
      loop: "{{ scales }}"
      register: base
      changed_when: false

    - name: Apply the candidate in a rehearsal store (never the Golden Store)
      ansible.builtin.command: >
        bahyway-enkidb rehearse --candidate {{ candidate | default('HEAD') }}
        --into rehearsal --from-snapshot latest --no-write-golden
      register: reh
      changed_when: "'REHEARSED' in reh.stdout | default('')"
      failed_when: false

    - name: Shape the estate AFTER the candidate, at every scale
      ansible.builtin.command: >
        bahyway-lamassu shape --store rehearsal --scope {{ item }}
        --emit beta0,beta1,g,locality,tau,layer_states --json
      loop: "{{ scales }}"
      register: after
      changed_when: false

    - name: Compose the shape difference and judge it
      ansible.builtin.shell: |
        python3 - <<'PY'
        import json, pathlib, sys
        B = {{ base.results  | map(attribute='stdout') | list | to_json }}
        A = {{ after.results | map(attribute='stdout') | list | to_json }}
        S = {{ scales | to_json }}
        TH = {{ thresholds | to_json }}
        rep, fail = [], []
        for scope, b, a in zip(S, B, A):
            try: bj, aj = json.loads(b or "{}"), json.loads(a or "{}")
            except Exception: continue
            d = {"scope": scope,
                 "d_beta0": (aj.get("beta0", 0) - bj.get("beta0", 0)),
                 "d_beta1": (aj.get("beta1", 0) - bj.get("beta1", 0)),
                 "d_locality": round(aj.get("locality", 0) - bj.get("locality", 0), 2),
                 "d_tau": round(aj.get("tau", 0) - bj.get("tau", 0), 3),
                 "unknown_layers": aj.get("layer_states", {}).get("UNKNOWN", 0),
                 "dead_layers": aj.get("layer_states", {}).get("DEAD", 0)}
            rep.append(d)
            if d["d_beta0"] > TH["beta0_max_delta"]: fail.append((scope, "a tribe split: beta0 rose"))
            if d["d_locality"] > TH["locality_max_delta"]: fail.append((scope, f"orbit locality worsened by {d['d_locality']}"))
            if d["d_tau"] > TH["tau_max_delta"]: fail.append((scope, f"tau rose by {d['d_tau']} — the estate became less measured"))
            if d["unknown_layers"]: fail.append((scope, f"{d['unknown_layers']} layer(s) became UNKNOWN"))
        pathlib.Path("{{ out }}/shape_diff.json").write_text(json.dumps({"report": rep, "failures": fail}, indent=2))
        for r in rep: print(r)
        for f in fail: print("SHAPE REGRESSION", f[0], "-", f[1])
        print("a change that returns the same totals can still be a shape regression")
        sys.exit(1 if fail else 0)
        PY
      register: diff
      changed_when: true
      failed_when: false

    - name: Gate B3 · declared intent must cover every observed effect
      ansible.builtin.shell: |
        python3 - <<'PY'
        import json, pathlib, sys
        d = json.load(open("{{ out }}/shape_diff.json"))
        intent = {{ intent | default([]) | to_json }}     # -e intent='["locality","tau"]'
        uncovered = []
        for f in d["failures"]:
            key = "beta0" if "beta0" in f[1] else "locality" if "locality" in f[1] else "tau" if "tau" in f[1] else "unknown"
            if key not in intent: uncovered.append(f)
        for u in uncovered: print("UNDECLARED EFFECT", u[0], "-", u[1])
        print("an effect the intent did not claim is the finding — not the speed-up that was claimed")
        sys.exit(1 if uncovered else 0)
        PY
      changed_when: false
      failed_when: false

    - name: Report
      ansible.builtin.debug: {msg: "{{ diff.stdout_lines | default([]) }}"}

    - name: Court journal
      ansible.builtin.lineinfile:
        path: "{{ ansible_env.HOME }}/bahyway/sala/court_journal.log"
        create: true
        line: "{{ ansible_date_time.iso8601 }} PB-409 Sasu bench - candidate judged at four scales by shape, not by totals"
