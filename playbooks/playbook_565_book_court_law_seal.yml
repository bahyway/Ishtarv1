# =============================================================================
# PB-565 — Book Court: Concept Seal (GL-LIT-001)
# BahyWay.Ecosystem v4.0 — 2026-08-21
#
# WHY THIS PLAYBOOK EXISTS
#   Seals GL-LIT-001, the Book Court: literature read as structured
#   corpus rather than referee'd for correctness. Five rites (Stage ->
#   Lattice -> Pick -> Mint with Provenance -> Gate Before Service),
#   the two-witness clause applied to mathematics itself (the book's
#   statement is one witness, independent Lean4/Z3 proof or a
#   property-tested Rust kernel is the second), and the structure-only
#   clause (theorem identifiers and dependency edges are stored, the
#   text of the work never is). Two registrations are landed alongside
#   the tablet: a Dorst-Fontijne-Mann Geometric Algebra rehearsal (the
#   founding corpus, GL-LIT-001 Sec.8) and a second corpus registration
#   over the Spieksma/Spreij stochastic-calculus shelf, with explicit
#   BahyWay bindings back into GL-NSR-001 (OU) and GL-ALG-003 (hitting
#   time).
#
#   Landed from a parallel Claude session's Sat20260815 thread,
#   evaluated file-by-file against this repo before landing and
#   RENUMBERED per this repo's standing rule: the other session's own
#   PB-325 -> PB-565 here. See
#   shala-prototypes/batch12_nasaru_saturday_courts/README.md for the
#   full renumbering table and the source session's own PB-323
#   collision note (GL-LIT-001 Sec.9), which is in the source material
#   only and does not implicate this repo's numbering.
#
# WHAT THIS PLAYBOOK DOES
#   PROVEs the five rites and the structure-only/two-witness clauses
#   are present in the landed tablet, and PROVEs both Sala
#   registrations (the GA rehearsal and the stochastic-calculus shelf)
#   carry their documented content markers. Deposits nothing new --
#   docs and Sala tabs are committed directly into docs/ and
#   shala-prototypes/, this playbook is a pointer/verification record.
#
# Running this playbook = CSR-08 confirmation. Review -> --check -> live.
# =============================================================================

- name: "PB-565 | Seal the Book Court Law (GL-LIT-001)"
  hosts: localhost
  connection: local
  become: false
  vars:
    repo_root: "{{ playbook_dir }}/.."
    tablet_file: "{{ repo_root }}/docs/09_observatory/GL-LIT-001_Book_Court_Law.md"
    batch_dir: "{{ repo_root }}/shala-prototypes/batch12_nasaru_saturday_courts"

  tasks:

    - name: "0.1 | Confirm the tablet and both Sala registrations are landed"
      ansible.builtin.stat:
        path: "{{ item }}"
      register: land_stat
      loop:
        - "{{ tablet_file }}"
        - "{{ batch_dir }}/shala_book_court_dfm_rehearsal.html"
        - "{{ batch_dir }}/BookCourt_002_Stochastic_Shelf.md"
        - "{{ batch_dir }}/shala_stochastic_shelf.html"
      loop_control: { label: "{{ item }}" }

    - name: "FAIL | required file missing"
      ansible.builtin.fail:
        msg: "{{ item.item }} not found -- nothing to seal."
      loop: "{{ land_stat.results }}"
      loop_control: { label: "{{ item.item }}" }
      when: not item.stat.exists

    - name: "1.1 | PROVE the five rites are sealed in the tablet"
      ansible.builtin.shell: |
        set -e
        grep -qF "Rite I — Stage" "{{ tablet_file }}"
        grep -qF "Rite II — Lattice" "{{ tablet_file }}"
        grep -qF "Rite III — Pick" "{{ tablet_file }}"
        grep -qF "Rite IV — Mint with Provenance" "{{ tablet_file }}"
        grep -qF "Rite V — Gate Before Service" "{{ tablet_file }}"
        echo "PROVEN: all five rites present"
      register: prove_rites
      changed_when: false

    - name: "1.2 | PROVE the two-witness and structure-only clauses are sealed"
      ansible.builtin.shell: |
        set -e
        grep -qF "One witness mints; two witnesses serve" "{{ tablet_file }}"
        grep -qF "structure and pointers, never prose" "{{ tablet_file }}"
        grep -qF "A literature pattern is never born GOLDEN" "{{ tablet_file }}"
        echo "PROVEN: two-witness clause and structure-only (no prose stored) clause both sealed"
      register: prove_clauses
      changed_when: false

    - name: "1.3 | PROVE the DFM rehearsal stages the founding corpus's own three rites"
      ansible.builtin.shell: |
        set -e
        grep -qF "Dorst" "{{ batch_dir }}/shala_book_court_dfm_rehearsal.html"
        grep -qF "Rite I" "{{ batch_dir }}/shala_book_court_dfm_rehearsal.html"
        grep -qF "Rite II" "{{ batch_dir }}/shala_book_court_dfm_rehearsal.html"
        grep -qF "Rite III" "{{ batch_dir }}/shala_book_court_dfm_rehearsal.html"
        echo "PROVEN: Rite I-III staged against the Dorst-Fontijne-Mann founding corpus"
      register: prove_dfm
      changed_when: false

    - name: "1.4 | PROVE the stochastic shelf registers both source corpora and binds back to GL-NSR-001/GL-ALG-003"
      ansible.builtin.shell: |
        set -e
        grep -qF "Spieksma" "{{ batch_dir }}/BookCourt_002_Stochastic_Shelf.md"
        grep -qF "Spreij" "{{ batch_dir }}/BookCourt_002_Stochastic_Shelf.md"
        grep -qF "GL-NSR-001 MARKASU" "{{ batch_dir }}/BookCourt_002_Stochastic_Shelf.md"
        grep -qF "GL-ALG-003 Abūbu" "{{ batch_dir }}/BookCourt_002_Stochastic_Shelf.md"
        grep -qF "Spieksma" "{{ batch_dir }}/shala_stochastic_shelf.html"
        echo "PROVEN: both corpora registered, BahyWay bindings to Markasu and Abūbu present in the doc, rehearsal HTML matches"
      register: prove_shelf
      changed_when: false

    - name: "2.1 | Report"
      ansible.builtin.debug:
        msg: >
          PB-565 complete. GL-LIT-001 sealed: the Book Court's five
          rites (Stage/Lattice/Pick/Mint/Gate), the two-witness clause
          applied to mathematics, and the structure-only (no prose
          stored) clause all hold. Two registrations landed: the
          founding Dorst-Fontijne-Mann Geometric Algebra rehearsal and
          the Spieksma/Spreij stochastic-calculus shelf, the latter
          carrying explicit BahyWay bindings into GL-NSR-001 (Markasu's
          OU model) and GL-ALG-003 (Abūbu's hitting-time horizon).
          Renumbered from the source session's PB-325; see
          shala-prototypes/batch12_nasaru_saturday_courts/README.md for
          the full renumbering table.
