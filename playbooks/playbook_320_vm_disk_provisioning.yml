# 2026-08-24, closing the deferred gap this playbook's own header used to
# note ("uruk-node-vault deliberately NOT included yet -- vault_hot's
# guest-side mount path is still undecided"): group_vars/all.yml already
# settles it implicitly -- PB-310's ship_target_dir (/vault/hot/ledger_
# segments) and PB-311's vault_mount (/nuzivault, a separate dataset root)
# both already assume a real filesystem lives at /vault/hot on
# uruk-node-vault, the same "dedicated LV mounted at the path other
# playbooks already write into" pattern ledger_dir/projections_dir use
# above. Mounting the vault_hot LV there (not a new/different path) is
# what actually backs those existing paths with real, dedicated storage
# instead of the vault's root disk. Safe to run any time: mkfs.xfs is
# blkid-guarded exactly like PB-320b/c, and PB-310's own "ensure
# ship_target_dir exists" task (delegate_to the vault) recreates
# ledger_segments/ under the new mount automatically -- there is nothing
# real under /vault/hot yet to lose (PB-310's most recent clean run
# reported "no .seg segments yet", i.e. nothing has ever actually shipped
# there). Re-run PB-310/PB-311 after this to confirm their paths still
# resolve once the mount is live.
- name: "PB-320d | Format + mount the vault-hot disk on uruk-node-vault"
  hosts: enkidb_vault
  become: true
  vars_files:
    - "{{ playbook_dir }}/../inventories/uruk/group_vars/all.yml"
  vars:
    vault_hot_dir: /vault/hot
  tasks:
    - name: "Wait for SSH to come back up after the virsh start above"
      ansible.builtin.wait_for_connection:
        timeout: 120

    - name: "Check if /dev/vdb already has a filesystem (never re-format a disk that might hold real data)"
      ansible.builtin.command: blkid -o value -s TYPE /dev/vdb
      register: vdb_fstype
      failed_when: false
      changed_when: false

    - name: "Format the vault-hot disk as XFS (only when blkid found nothing on it)"
      ansible.builtin.command: mkfs.xfs /dev/vdb
      when: vdb_fstype.rc != 0

    - name: "Ensure {{ vault_hot_dir }} exists"
      ansible.builtin.file: { path: "{{ vault_hot_dir }}", state: directory, mode: "0750" }

    - name: "Check if /dev/vdb is already mounted at {{ vault_hot_dir }}"
      ansible.builtin.command: mountpoint -q {{ vault_hot_dir }}
      register: vault_hot_mounted
      failed_when: false
      changed_when: false

    - name: "Mount /dev/vdb at {{ vault_hot_dir }}"
      ansible.builtin.command: mount /dev/vdb {{ vault_hot_dir }}
      when: vault_hot_mounted.rc != 0

    - name: "Persist the mount in /etc/fstab (idempotent -- never duplicates the line)"
      ansible.builtin.lineinfile:
        path: /etc/fstab
        regexp: '^/dev/vdb\s'
        line: "/dev/vdb {{ vault_hot_dir }} xfs defaults 0 0"

    - name: Mark host as playbook-built (PB-315 assertion target)
      ansible.builtin.file: { path: /etc/bahyway_built_by_playbook, state: touch }
