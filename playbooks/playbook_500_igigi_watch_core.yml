---
# PB-500 · igigi_watch_core · DRAFT (BahyWay.Ecosystem v4.0 finalization suite)
# Running this playbook is the Architect's CSR-08 confirmation. Nothing is law until run.
- name: "PB-500 · scaffold igigi-watch (pure Rust): three-bells evaluator core · GL-MON-001"
  hosts: uruk
  tasks:
    - name: ensure Forge workspace root
      ansible.builtin.file: { path: "{{ playbook_dir }}/../workspace/bahyway_v4", state: directory, mode: "0755" }
      check_mode: false
    - name: cargo new
      ansible.builtin.command:
        cmd: "cargo new --lib igigi-watch"
        creates: "{{ playbook_dir }}/../workspace/bahyway_v4/crates/igigi-watch/Cargo.toml"
        chdir: "{{ playbook_dir }}/../workspace/bahyway_v4/crates"
    # 2026-08-24, found live: lib.rs below declares `pub mod bells;
    # pub mod headroom; pub mod sentinels;` but nothing ever created those
    # three files -- same class of gap as PB-428/429, found via the same
    # `cargo fmt --all` failure. Stub files added, same DRAFT-stub style
    # as PB-420's contract.rs.
    - name: "src/bells.rs stub"
      ansible.builtin.copy:
        dest: "{{ playbook_dir }}/../workspace/bahyway_v4/crates/igigi-watch/src/bells.rs"
        content: |
          //! Shape / Balance / Breath -- the three bells (DRAFT stub -- signatures only)
          pub enum Bell {
              Shape,
              Balance,
              Breath,
          }

    - name: "src/headroom.rs stub"
      ansible.builtin.copy:
        dest: "{{ playbook_dir }}/../workspace/bahyway_v4/crates/igigi-watch/src/headroom.rs"
        content: |
          //! Breath: headroom < 3x the ENLIL law (DRAFT stub -- signatures only)
          pub struct Headroom {
              pub current: f64,
              pub enlil_law: f64,
          }

    - name: "src/sentinels.rs stub"
      ansible.builtin.copy:
        dest: "{{ playbook_dir }}/../workspace/bahyway_v4/crates/igigi-watch/src/sentinels.rs"
        content: |
          //! Alarms on acceleration, not level -- weather is not climate (DRAFT stub)
          pub struct Sentinel {
              pub name: String,
              pub tripped: bool,
          }

    - name: doctrine
      ansible.builtin.copy:
        dest: "{{ playbook_dir }}/../workspace/bahyway_v4/crates/igigi-watch/src/lib.rs"
        content: |
          //! THE IGIGI WATCH · GL-MON-001 candidate · shapes, not metrics
          //! Three Bells only: Shape (Betti change) · Balance (Δ≠0 or weir crossed) · Breath (headroom < 3× ENLIL law)
          //! Alarms on acceleration — weather is not climate. Everything else is testimony.
          pub mod bells;
          pub mod headroom;
          pub mod sentinels;
    - name: journal (NARU discipline)
      ansible.builtin.lineinfile:
        path: "{{ playbook_dir }}/../workspace/bahyway_v4/NARU.journal"
        line: "{{ ansible_date_time.iso8601 }} · PB-500 · igigi-watch core scaffolded"
        create: yes
