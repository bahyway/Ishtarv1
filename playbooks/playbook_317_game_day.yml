---
# 𒁾 PB-317 — GAME DAY: THE FULL MUSTER (GL-OPS-001/002)
# Simulate loss of the write node mid-stream; promote; rebuild reads; restore a
# tier; measure RTO/RPO against sealed targets. Truth Before Beauty applies to
# our own outages most of all: the report hides nothing.
- name: PB-317 | Game day orchestration
  hosts: host_forge
  become: true
  vars:
    gameday_report: "{{ bahyway_root | default('/var/lib/bahyway') }}/gameday_{{ ansible_date_time.date }}.log"
  tasks:
    - name: T0 | record start, then simulate write-node loss
      ansible.builtin.shell: |
        echo "GAMEDAY START $(date -Is)" > {{ gameday_report }}
        virsh destroy enki-write || true
        echo "T0 write node destroyed $(date -Is)" >> {{ gameday_report }}

    - name: T1 | promotion ceremony (imported; seal prompted inside)
      ansible.builtin.command: ansible-playbook -i inventories/uruk pb313_promotion_ceremony.yml
      register: t1
      failed_when: false
    - ansible.builtin.shell: echo "T1 promotion rc={{ t1.rc }} $(date -Is)" >> {{ gameday_report }}
      name: log T1

    - name: T2 | read-node rebuild rite
      ansible.builtin.command: ansible-playbook -i inventories/uruk pb312_read_node_rebuild.yml
      register: t2
      failed_when: false
    - ansible.builtin.shell: echo "T2 rebuild rc={{ t2.rc }} $(date -Is)" >> {{ gameday_report }}
      name: log T2

    - name: T3 | restore one tier from the vault (muster)
      ansible.builtin.command: ansible-playbook -i inventories/uruk pb314_backup_muster.yml
      register: t3
      failed_when: false
    - ansible.builtin.shell: echo "T3 muster rc={{ t3.rc }} $(date -Is)" >> {{ gameday_report }}
      name: log T3

    - name: GATE | reads and writes live at ceremony's end
      ansible.builtin.shell: |
        set -e
        curl -sf http://enki-write:{{ enkidb_ports.db }}/health
        curl -sf http://192.168.122.107:{{ enkidb_ports.db }}/health
        echo "GATE reads+writes live $(date -Is)" >> {{ gameday_report }}
      failed_when: false   # advisory until health endpoints exist; then flip hard

    - name: Game-day KAKI — every measured number, every surprise
      ansible.builtin.shell: |
        PREV=$(tail -n1 {{ kaki_runs }} 2>/dev/null | sha256sum | cut -d' ' -f1)
        R=$(sha256sum {{ gameday_report }} | cut -d' ' -f1)
        echo "{\"pb\":\"PB-317\",\"adannu\":\"$(date -Is)\",\"prev\":\"$PREV\",\"report_sha\":\"$R\",\"gate\":\"ecosystem-serving\"}" >> {{ kaki_runs }}
