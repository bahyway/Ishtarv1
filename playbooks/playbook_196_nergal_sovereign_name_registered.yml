# =============================================================================
# PB-196 — Nergal registered as a real sovereign name in EnkiDDB's concept
# registry: the AV/firewall defender, never a Hepta Gate
# BahyWay.Ecosystem v4.0 — 2026-07-19
#
# CONTEXT: direct follow-up to PB-195. After confirming Nergal is not one
# of the 7 sealed Hepta Gates, the Architect stated plainly what it
# actually is: "my Internal Anti-Virus and the Shelled Defender for the
# Firewall of www.bahyway.com website." This matches, and grounds, what
# was already real in the codebase but never formally registered as a
# concept: `dubsar-visualizer::panels::nergal` (the Nergal AV panel,
# reading real SDB malware-hit/quarantine counters) and
# `storage-sector::SOVEREIGN_NAME = "irkalla"` (the jail Nergal feeds).
#
# WHAT WAS ADDED: `ConceptRegistry::with_known_sovereign_names()`
# (crates/enkiddb/src/concepts.rs), mirroring `with_known_gates`'s shape.
# Seeded with every sovereign name this Ecosystem has a real coded
# constant for -- Tigris (`enkiddb::readnode::SOVEREIGN_NAME`), Euphrates
# (`enkimdb::readnode::SOVEREIGN_NAME`), Anu
# (`enkidb-indexes::SOVEREIGN_NAME`), IRKALLA
# (`storage-sector::SOVEREIGN_NAME`), NUZI (`bahyway-fabric::NUZI`) --
# plus **Nergal**, the Architect-confirmed sovereign name that, like
# IRKALLA before PB-188, has real, deliberate, live UI usage but no coded
# identity constant of its own yet anywhere in the codebase. That gap is
# noted honestly in the doc comment, not silently papered over -- adding
# a real `SOVEREIGN_NAME`-style const for Nergal, and deciding which crate
# it belongs in (not `storage-sector`, since Nergal is the defender, not
# the jail itself), is flagged as a natural next step if the Architect
# wants that same pattern applied here.
#
# WHY THIS MATTERS FOR THE EXPOSURE PREVIEW (PB-194): Nergal is exactly
# the kind of security-sensitive internal concept the access-grant
# exposure preview exists to catch. Before this fix, a document
# describing the AV/firewall defender would have scanned clean --
# `exposure_preview` would have reported nothing security-relevant about
# it, understating the real impact of granting a stakeholder group access
# to documentation that mentions it. Now it's correctly flagged as a
# SovereignName concept, same tier as Tigris/Euphrates/IRKALLA.
#
# VERIFIED: `finds_all_known_sovereign_names_including_nergal` (new test)
#   asserts Tigris, Euphrates, Anu, IRKALLA, NUZI, and Nergal are all
#   scannable and correctly tagged `ConceptKind::SovereignName`. The
#   shared test `registry()` helper now uses `with_known_sovereign_names()`
#   directly (was manually listing only two of the five real names) --
#   `finds_multiple_distinct_concepts_in_one_document` updated accordingly
#   (Euphrates now correctly matches text that already mentioned it).
#
# VERIFICATION: cargo build --workspace clean. cargo test --workspace:
#   3498 passed, 0 failed (up from PB-195's 3497 by the one new test;
#   zero regressions).
# =============================================================================
