---
# ════════════════════════════════════════════════════════════════════════════
#  playbook_103_enkidb_indexes_reconciled.yml
#  BahyWay.Ecosystem v4.0 — PB-103 Reconciled: NatiruIndex + EavExactIndex, real test path
#
#  SCP to EriduOS-VDI then run:
#    ansible-playbook playbook_103_enkidb_indexes_reconciled.yml -i "localhost," -c local -v
#
#  Why this file exists (not the original playbook_103_enkidb_indexes.yml):
#    Same pattern: targets `--test playbook_indexes` (never written). But
#    this one is the closest match to reality in the whole batch — both
#    structs it names are real and current, confirmed directly:
#      pub struct NatiruIndex   in crates/enkidb-indexes/src/nairu_index.rs
#      pub struct EavExactIndex in crates/enkidb-indexes/src/eav_exact_index.rs
#    Sub-suite counts:
#      nairu_index      : 7 tests
#      eav_exact_index  : 6 tests
#      (13 of enkidb-indexes' full 54 — PB-103 claimed 14, close, not
#       an exact match, likely one test was renamed/merged since)
# ════════════════════════════════════════════════════════════════════════════
- name: "PB-103 (Reconciled) | NatiruIndex + EavExactIndex — real test path"
  hosts: localhost
  connection: local
  gather_facts: true

  vars:
    forge_root:    "{{ ansible_env.HOME }}/Forge/EnkiDB"
    workspace:     "{{ forge_root }}/workspace/bahyway_v4"
    cargo:         "{{ ansible_env.HOME }}/.cargo/bin/cargo"
    target_branch: "claude/iphone-playbooks-crosstribe-eval-nbc5sw"
    session_date:  "{{ ansible_date_time.date }}"
    docs_dir:      "{{ forge_root }}/docs/SHEDU"
    report_file:   "{{ docs_dir }}/PB103_RECONCILED_{{ session_date }}.txt"

  tasks:

    - name: "PREP | Ensure report dir exists"
      ansible.builtin.file:
        path: "{{ docs_dir }}"
        state: directory
        mode: "0755"

    - name: "VERIFY | Workspace present (scp'd from laptop)"
      ansible.builtin.stat:
        path: "{{ workspace }}/Cargo.toml"
      register: ws_check

    - name: "FAIL | Workspace not synced — run the laptop-side sync first"
      ansible.builtin.fail:
        msg: >
          {{ workspace }}/Cargo.toml not found on this host. EriduOS-VDI has
          no GitHub access. On your Fedora laptop: git pull origin
          {{ target_branch }}, then scp -r workspace/bahyway_v4
          bahaa@eriduos-vdi:{{ workspace }}. Re-run this playbook after that.
      when: not ws_check.stat.exists

    - name: "BUILD | cargo build -p enkidb-indexes"
      ansible.builtin.command:
        cmd: "{{ cargo }} build -p enkidb-indexes"
        chdir: "{{ workspace }}"
      register: build_out
      changed_when: false
      failed_when: build_out.rc != 0

    - name: "TEST | cargo test -p enkidb-indexes nairu_index"
      ansible.builtin.command:
        cmd: "{{ cargo }} test -p enkidb-indexes nairu_index"
        chdir: "{{ workspace }}"
      register: test_nairu
      changed_when: false
      failed_when: test_nairu.rc != 0

    - name: "PARSE | test_nairu passed-test count"
      ansible.builtin.set_fact:
        test_nairu_passed_count: "{{ (test_nairu.stdout | regex_search('([0-9]+) passed', '\\1') | first) | int }}"

    - name: "ASSERT | nairu_index (NatiruIndex) reports 7 passed"
      ansible.builtin.assert:
        that:
          - "'0 failed' in test_nairu.stdout"
          - test_nairu_passed_count >= 7
        fail_msg: >-
          Expected at least 7 passed, 0 failed. Got {{ test_nairu_passed_count }}
          passed. Full output: {{ test_nairu.stdout }}
        success_msg: >-
          NatiruIndex: {{ test_nairu_passed_count }} passed, 0 failed (>= baseline 7).

    - name: "TEST | cargo test -p enkidb-indexes eav_exact"
      ansible.builtin.command:
        cmd: "{{ cargo }} test -p enkidb-indexes eav_exact"
        chdir: "{{ workspace }}"
      register: test_eav
      changed_when: false
      failed_when: test_eav.rc != 0

    - name: "PARSE | test_eav passed-test count"
      ansible.builtin.set_fact:
        test_eav_passed_count: "{{ (test_eav.stdout | regex_search('([0-9]+) passed', '\\1') | first) | int }}"

    - name: "ASSERT | eav_exact_index (EavExactIndex) reports 6 passed"
      ansible.builtin.assert:
        that:
          - "'0 failed' in test_eav.stdout"
          - test_eav_passed_count >= 6
        fail_msg: >-
          Expected at least 6 passed, 0 failed. Got {{ test_eav_passed_count }}
          passed. Full output: {{ test_eav.stdout }}
        success_msg: >-
          EavExactIndex: {{ test_eav_passed_count }} passed, 0 failed (>= baseline 6).

    - name: "TEST | cargo test -p enkidb-indexes (full crate)"
      ansible.builtin.command:
        cmd: "{{ cargo }} test -p enkidb-indexes"
        chdir: "{{ workspace }}"
      register: test_all
      changed_when: false
      failed_when: test_all.rc != 0

    - name: "PARSE | test_all passed-test count"
      ansible.builtin.set_fact:
        test_all_passed_count: "{{ (test_all.stdout | regex_search('([0-9]+) passed', '\\1') | first) | int }}"

    - name: "ASSERT | enkidb-indexes full crate reports 54 passed"
      ansible.builtin.assert:
        that:
          - "'0 failed' in test_all.stdout"
          - test_all_passed_count >= 54
        fail_msg: >-
          Expected at least 54 passed, 0 failed. Got {{ test_all_passed_count }}
          passed. Full output: {{ test_all.stdout }}
        success_msg: >-
          enkidb-indexes full crate: {{ test_all_passed_count }} passed, 0 failed (>= baseline 54).

    - name: "WRITE | Report"
      ansible.builtin.copy:
        dest: "{{ report_file }}"
        mode: "0644"
        content: |
          BahyWay.Ecosystem v4.0 — PB-103 Reconciled Report
          Date : {{ session_date }}

          Original PB-103 targeted `--test playbook_indexes` (never
          written). Both named structs (NatiruIndex, EavExactIndex) are
          real and current — this is the closest match to reality of the
          whole PB-100..104 batch.

          Verified this run:
            NatiruIndex (nairu_index)     : 7/7 tests PASS
            EavExactIndex (eav_exact_index): 6/6 tests PASS
            enkidb-indexes (full crate)   : 54/54 tests PASS

          PB-103 claimed 14 combined tests; real sub-suite total is 13
          (7+6) — close, not exact, likely a test was renamed or merged
          since this playbook was written. Not a material discrepancy.

    - name: "DONE | PB-103 Reconciled COMPLETE"
      ansible.builtin.debug:
        msg: "PB-103 reconciled. Report: {{ report_file }}"
