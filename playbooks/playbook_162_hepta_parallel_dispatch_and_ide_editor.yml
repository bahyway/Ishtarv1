- name: "PB-162 | Record — no ansible action, git history is the source of truth"
  hosts: localhost
  connection: local
  become: false
  tasks:
    - name: "PB-162.1 | Pointer to the actual change"
      ansible.builtin.debug:
        msg: >-
          See commit history on claude/iphone-playbooks-crosstribe-eval-nbc5sw,
          2026-07-10, for the real diff. This playbook is a record, not an
          installer — the files were authored directly in this session's
          checkout, not templated by Ansible.
