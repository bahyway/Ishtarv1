# =============================================================================
# PB-197 — The Onion Layers Design: a real dependency map of the whole
# Ecosystem, as a document and a visual artifact
# BahyWay.Ecosystem v4.0 — 2026-07-19
#
# CONTEXT: the Architect's dilemma, stated plainly: "I cannot build one and
# only one piece of BahyWay.Ecosystem like EnkiDDB, because everything is
# related to another in the Ecosystem just like a Human Body... Patterns
# within Patterns, just like the Russian Baboshkas, or an Onion Layers."
# This is real, not overstated -- and it deserved a real answer, not
# reassurance. The answer: the circularity is real at the concept level,
# but Rust's own compiler forbids it from existing at the code level, and
# this session had already been resolving exactly that gap every time it
# came up (story-sentinel born to break the alert-engine/story-engine
# cycle; lamassu-engine/nisaba::orchestrator consulting rather than
# reimplementing). The Architect asked for that structure made visible:
# a design guide and an SVG artifact, kept like the earlier BIGRING SVG.
#
# WHAT WAS BUILT, grounded in the real, sealed layer structure that
# `workspace/bahyway_v4/Cargo.toml` already encodes in its own member-list
# comments -- not invented, transcribed:
#
#  1. docs/09_observatory/BAHYWAY_ONION_LAYERS_DESIGN.md -- the text/table reference.
#     States the Four Laws (inner layers never know outer layers exist;
#     KAKI is the circulatory system; a third crate is born when two real
#     things need each other; a sealed name is not a built crate), then
#     the full 25-layer / 163-member table transcribed directly from
#     Cargo.toml. Documents the Ghost Layer -- AkkadiSafeEngine,
#     AkkadiRulesEngine, AkkadiCipherEngine (locked in PB-88, no
#     implementation anywhere), and Nergal-as-a-crate (Architect-confirmed
#     real, no coded identity yet) -- including an explicit correction of
#     this session's own earlier wrong claim that the first two "don't
#     appear anywhere in the codebase."
#
#  2. docs/09_observatory/BAHYWAY_ONION_LAYERS.html -- the published SVG artifact (same
#     file, copied into the repo for a durable record). A radial
#     cross-section: 25 real concentric rings sized by dependency depth,
#     color-banded into 5 functional groups (Foundation/Identity=gold,
#     Engines/Intelligence=cyan, Security/Pipeline=ember,
#     Languages/Protocol=green, Runtime/UI/Theater=violet), plus a
#     dashed, desaturated ghost ring for the 4 sealed-not-built names.
#     Leader-line labels in two columns give every layer's real name and
#     member count; a full reference table below gives every real crate
#     name, none summarized away. Typography: an old-style serif display
#     face (gravitas suited to "sealed law") paired with a monospace data
#     face (crate names, counts) -- both theme-aware (light/dark, honoring
#     the viewer's own preference, not a single fixed look).
#
# HONORED THE EXISTING SYSTEM, not invented: the palette is
# `dubsar-visualizer::theme.rs`'s own real constants (BG_DARK #060610,
# GOLD #FFD700, CYAN #00FFFF, GREEN #00FF88, VIOLET #CC44FF, ORANGE
# #FF8C00 / here "ember"), not a new scheme -- this diagram is meant to
# feel like it belongs next to the real EriduOS panels, not like a
# separate marketing artifact.
#
# VERIFIED VISUALLY, not assumed: rendered with the real headless
# Chromium already provisioned in this sandbox (no Playwright package
# needed -- the raw `chrome --headless --screenshot` binary at
# /opt/pw-browsers/chromium-1194/chrome-linux/chrome sufficed), in both
# light and dark theme, at full page height. Caught and fixed one real
# bug before publishing: the initial viewBox math put the leader-line
# labels off-canvas for the outer rings; corrected by recomputing the
# canvas half-width against the real label text length rather than
# guessing a round number.
#
# WHAT THIS DOES NOT CLAIM: the ghost layer's AkkadiCipherEngine-equals-
# kupru mapping is stated as a hypothesis grounded in a real phrase match
# (PB-88's exact sentence appears verbatim in sumer-engine's real code),
# not asserted as decided -- that decision belongs to the Architect, not
# to this diagram.
# =============================================================================
