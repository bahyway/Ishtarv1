        marker: "<!-- {mark} PB-160 §E -->"
        block: |
          ## E. Federated State-Scope Law
          1. Canonical states ONLY: GOLDEN / FUZZY / DEAD. Render colours
             (GREEN, BLUE, RED, GRAY, GOLD…) are unrepresentable in any
             state predicate (HS-EXT-003 L: ColourAsState parse error).
             Truth Before Beauty: the cube/orbit colour is derived FROM
             the state, never the reverse.
          2. Explicit scope at seal time: a Template that spans ≥2 engines
             MUST declare its state scope, e.g. WHAT STATE(GOLDEN, FUZZY).
             No default and no inference — a federated Template without an
             explicit state scope is REFUSED at seal time. Forgetting is a
             loud compile error, never a silently skewed result.
          3. Engine truth notes recorded in the sealed plan:
             - EnkiDB holds GOLDEN only (by construction) — the GOLDEN
               term is a no-op there and documents intent.
             - EnkiODB contributes FUZZY (in-processing, the "green"
               orbit band in ShoWEngine renderings) and any GOLDEN.
             - DEAD is excluded unless explicitly named; DEAD-inclusive
               Templates are audit/forensic class and are WITNESSed to
               NĀRU on every execution.
