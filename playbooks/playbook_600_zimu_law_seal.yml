# =============================================================================
# PB-600 — The Zīmu Law: Concept Seal (GL-CLR-001)
# BahyWay.Ecosystem v4.0 — 2026-08-23
#
# WHY THIS PLAYBOOK EXISTS
#   Seals GL-CLR-001, chartering SafaaHarmony (صفاء) as the official
#   BahyWay ETL State Coloring Harmony Mechanism across stations
#   S0-S8: every spectral particle's colour splits into a luminance
#   surface and a colour mask (§2); ColourID names a root, a Nalbanu
#   casting -- a particle does not have a colour, it descends from one
#   (§3); shed degree is the continuous, measured deviation from that
#   root, earned only by hyperspectral continuity, RGB metamers ruled
#   inadmissible (§4-5); the Fixed-Schema Theorem makes the per-particle
#   EAV schema band-count independent forever (§6); the Unnamed-Residual
#   Guardian refuses to force the inexpressible into a shed degree
#   (§7); and no image becomes a sealed template except through the
#   Transit Rite's per-Tribe HARMONIOUS/CONDITIONED/UNNAMED-RICH
#   verdicts (§8).
#
#   Landed from a standalone Architect-supplied upload (2026-08-23),
#   the fourth zip round from Sat20260822. Evaluated file-by-file
#   against this repo before landing and RENUMBERED per this repo's
#   standing rule: the source deposit's own PB-CLR-001 -> PB-600 here.
#   See shala-prototypes/batch22_zimu_safaaharmony_agu_lineage/README.md
#   for the full round. This tablet closes the single most
#   frequently-cited open dependency gap in this session -- GL-CLR-001
#   was named as a parent by GL-TPL-001 (Adannu, batch19), GL-ALG-005
#   (Askuppu, batch19), GL-HYD-001 (Tirku, batch21), and GL-LAT-002
#   (Šētu, batch21) -- every one of which cited it before it existed.
#
# WHAT THIS PLAYBOOK DOES
#   PROVEs the tablet's own four stated proof obligations (CLR-PO-1
#   through CLR-PO-4) are named, PROVEs the surface-times-mask
#   decomposition, ColourID-as-root, the Fixed-Schema Theorem, the
#   Unnamed-Residual Guardian, and the KAKI Clause are sealed verbatim.
#   PROVEs the Sala court (the SafaaHarmony Transit Court) renders the
#   decompose/transit/quarantine/fix-and-approve four-act rite with all
#   three per-Tribe verdicts. Deposits nothing new -- docs and Sala tab
#   are committed directly into docs/ and shala-prototypes/, this
#   playbook is a pointer/verification record.
#
# Running this playbook = CSR-08 confirmation. Review -> --check -> live.
# =============================================================================

- name: "PB-600 | Seal the Zīmu Law (GL-CLR-001)"
  hosts: localhost
  connection: local
  become: false
  vars:
    repo_root: "{{ playbook_dir }}/.."
    tablet_file: "{{ repo_root }}/docs/09_observatory/GL-CLR-001_Zimu_Law.md"
    court_file: "{{ repo_root }}/shala-prototypes/batch22_zimu_safaaharmony_agu_lineage/sala_gl_clr_001_safaa_harmony.html"

  tasks:

    - name: "0.1 | Confirm the tablet and the Sala court are landed"
      ansible.builtin.stat:
        path: "{{ item }}"
      register: land_stat
      loop:
        - "{{ tablet_file }}"
        - "{{ court_file }}"
      loop_control: { label: "{{ item }}" }

    - name: "FAIL | required file missing"
      ansible.builtin.fail:
        msg: "{{ item.item }} not found -- nothing to seal."
      loop: "{{ land_stat.results }}"
      loop_control: { label: "{{ item.item }}" }
      when: not item.stat.exists

    - name: "1.1 | PROVE the tablet's own four proof obligations (CLR-PO-1..4) are named"
      ansible.builtin.shell: |
        set -e
        grep -qF "CLR-PO-1" "{{ tablet_file }}"
        grep -qF "CLR-PO-2" "{{ tablet_file }}"
        grep -qF "CLR-PO-3" "{{ tablet_file }}"
        grep -qF "CLR-PO-4" "{{ tablet_file }}"
        echo "PROVEN: CLR-PO-1..4 all present"
      register: prove_pos
      changed_when: false

    - name: "1.2 | PROVE the surface-times-mask decomposition and ColourID-as-root are sealed"
      ansible.builtin.shell: |
        set -e
        grep -qF "particle = luminance × ( Σₖ abundanceₖ · moldₖ )" "{{ tablet_file }}"
        grep -qF "A particle does not *have* a colour; it" "{{ tablet_file }}"
        echo "PROVEN: the decomposition and root-of-Tribe clause are sealed"
      register: prove_decomp
      changed_when: false

    - name: "1.3 | PROVE the Fixed-Schema Theorem and the Unnamed-Residual Guardian are sealed"
      ansible.builtin.shell: |
        set -e
        grep -qF "The per-particle EAV schema of a spectral image is fixed and" "{{ tablet_file }}"
        grep -qF "never the schema" "{{ tablet_file }}"
        grep -qF "The residual is sacred" "{{ tablet_file }}"
        grep -qF "a lie wearing a" "{{ tablet_file }}"
        echo "PROVEN: the Fixed-Schema Theorem and the Unnamed-Residual Guardian are sealed"
      register: prove_theorem
      changed_when: false

    - name: "1.4 | PROVE the Transit Rite's three verdicts and the KAKI Clause are sealed"
      ansible.builtin.shell: |
        set -e
        grep -qF "**HARMONIOUS**" "{{ tablet_file }}"
        grep -qF "**CONDITIONED**" "{{ tablet_file }}"
        grep -qF "**UNNAMED-RICH**" "{{ tablet_file }}"
        grep -qF "FIXED AND APPROVED" "{{ tablet_file }}"
        grep -qF "Without KAKI v4.0, SafaaHarmony would be an opinion" "{{ tablet_file }}"
        echo "PROVEN: the Transit Rite verdicts and the KAKI Clause are sealed"
      register: prove_transit
      changed_when: false

    - name: "1.5 | PROVE the Sala court renders the four-act rite with all three verdicts"
      ansible.builtin.shell: |
        set -e
        grep -qF "① DECOMPOSE" "{{ court_file }}"
        grep -qF "② TRANSIT THE TRIBES" "{{ court_file }}"
        grep -qF "③ QUARANTINE UNNAMED" "{{ court_file }}"
        grep -qF "HARMONIOUS" "{{ court_file }}"
        grep -qF "UNNAMED-RICH" "{{ court_file }}"
        echo "PROVEN: the Transit Court renders decompose/transit/quarantine and all three verdicts"
      register: prove_court
      changed_when: false

    - name: "2.1 | Report"
      ansible.builtin.debug:
        msg: >
          PB-600 complete. GL-CLR-001 sealed: SafaaHarmony splits every
          spectral particle into luminance surface and colour mask,
          names ColourID as descent from a sealed root, measures shed
          degree continuously (earned by hyperspectral continuity
          alone), fixes the EAV schema band-count-independent forever,
          refuses to force the inexpressible into a false shed degree,
          and gates every template through the Transit Rite's per-Tribe
          verdicts. Renumbered from the source deposit's PB-CLR-001;
          see
          shala-prototypes/batch22_zimu_safaaharmony_agu_lineage/README.md.
          Closes the most frequently-cited open dependency gap of this
          session: GL-CLR-001 was named unlanded by GL-TPL-001,
          GL-ALG-005, GL-HYD-001, and GL-LAT-002, all landed before it.
