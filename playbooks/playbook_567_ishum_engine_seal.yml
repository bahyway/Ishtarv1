# =============================================================================
# PB-567 — IshumEngine Founding: Concept Seal (GL-ISM-001)
# BahyWay.Ecosystem v4.0 — 2026-08-21
#
# WHY THIS PLAYBOOK EXISTS
#   Seals GL-ISM-001, the founding tablet of IshumEngine -- the herald
#   who knows the roads: offline navigation over sacred ground. Five
#   organs: Skeleton (Voronoi/medial skeleton of free space, weighted
#   by clearance), Filtration (sublevel connectivity on the clearance
#   field, exact disconnect-width bisection), Constellation (GNSS-free
#   re-localization by the ground's own grave-pattern fingerprint,
#   two-witness owner identity), Pack (offline sealed per-sector packs,
#   Kidinnu degradation ladder), and Route (clearance-preferring,
#   refusal buffers treated as walls, never as passages). IshumEngine
#   consumes GL-NJF-001's grave layer and never contradicts it; it is
#   an Engine (stateful) where Abūbu is a calculus, because navigation
#   holds custody of route state.
#
#   Landed from a parallel Claude session's Sat20260815 thread,
#   evaluated file-by-file against this repo before landing and
#   RENUMBERED per this repo's standing rule: the other session's own
#   PB-329 -> PB-567 here. See
#   shala-prototypes/batch12_nasaru_saturday_courts/README.md for the
#   full renumbering table.
#
# WHAT THIS PLAYBOOK DOES
#   PROVEs the tablet's own four stated law tests (L1-L4, named in
#   GL-ISM-001 Sec.4) are present, and PROVEs both Sala court builds
#   (v1 "The Herald Who Knows the Roads" and v2 "The Guide of the
#   Valley") render the skeleton/clearance/constellation organs.
#   Deposits nothing new -- docs and Sala tab are committed directly
#   into docs/ and shala-prototypes/, this playbook is a pointer/
#   verification record.
#
# Running this playbook = CSR-08 confirmation. Review -> --check -> live.
# =============================================================================

- name: "PB-567 | Seal the IshumEngine Founding Tablet (GL-ISM-001)"
  hosts: localhost
  connection: local
  become: false
  vars:
    repo_root: "{{ playbook_dir }}/.."
    tablet_file: "{{ repo_root }}/docs/09_observatory/GL-ISM-001_IshumEngine_Founding.md"
    batch_dir: "{{ repo_root }}/shala-prototypes/batch12_nasaru_saturday_courts"

  tasks:

    - name: "0.1 | Confirm the tablet and both court builds are landed"
      ansible.builtin.stat:
        path: "{{ item }}"
      register: land_stat
      loop:
        - "{{ tablet_file }}"
        - "{{ batch_dir }}/shala_ishum_court.html"
        - "{{ batch_dir }}/shala_ishum_court_v2.html"
      loop_control: { label: "{{ item }}" }

    - name: "FAIL | required file missing"
      ansible.builtin.fail:
        msg: "{{ item.item }} not found -- nothing to seal."
      loop: "{{ land_stat.results }}"
      loop_control: { label: "{{ item.item }}" }
      when: not item.stat.exists

    - name: "1.1 | PROVE the tablet's own four law tests (L1-L4) are sealed"
      ansible.builtin.shell: |
        set -e
        grep -qF "law tests L1 (monotone severance), L2 (buffers block), L3 (bisection = scan), L4 (fingerprints distinguish neighbors)" "{{ tablet_file }}"
        echo "PROVEN: L1-L4 all named"
      register: prove_law_tests
      changed_when: false

    - name: "1.2 | PROVE the five organs (Skeleton/Filtration/Constellation/Pack/Route) are sealed"
      ansible.builtin.shell: |
        set -e
        grep -qF "I — Skeleton" "{{ tablet_file }}"
        grep -qF "II — Filtration" "{{ tablet_file }}"
        grep -qF "III — Constellation" "{{ tablet_file }}"
        grep -qF "IV — Pack" "{{ tablet_file }}"
        grep -qF "V — Route" "{{ tablet_file }}"
        grep -qF "refusal buffers as walls" "{{ tablet_file }}"
        echo "PROVEN: all five organs present, refusal-buffers-as-walls clause sealed"
      register: prove_organs
      changed_when: false

    - name: "1.3 | PROVE both court builds render the skeleton/clearance organs"
      ansible.builtin.shell: |
        set -e
        grep -qF "clearance" "{{ batch_dir }}/shala_ishum_court.html"
        grep -qF "Voronoi" "{{ batch_dir }}/shala_ishum_court.html"
        grep -qF "constellation" "{{ batch_dir }}/shala_ishum_court_v2.html"
        echo "PROVEN: v1 renders Voronoi skeleton + clearance, v2 renders the constellation re-localization organ"
      register: prove_court
      changed_when: false

    - name: "2.1 | Report"
      ansible.builtin.debug:
        msg: >
          PB-567 complete. GL-ISM-001 sealed: IshumEngine's five organs
          (Skeleton, Filtration, Constellation, Pack, Route), the
          monotone-severance connectivity law, the refusal-buffers-are-
          walls clause, and the two-witness owner-identity rule all
          hold, proven against the tablet's own four named law tests
          L1-L4. Both Sala court builds render the skeleton/clearance/
          constellation organs. Renumbered from the source session's
          PB-329; see
          shala-prototypes/batch12_nasaru_saturday_courts/README.md for
          the full renumbering table.
