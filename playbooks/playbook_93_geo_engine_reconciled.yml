---
# ════════════════════════════════════════════════════════════════════════════
#  playbook_93_geo_engine_reconciled.yml
#  BahyWay.Ecosystem v4.0 — PB-93 Reconciled: geo-engine → enkidb-indexes::hepta_shell
#
#  SCP to EriduOS-VDI then run:
#    ansible-playbook playbook_93_geo_engine_reconciled.yml -i "localhost," -c local -v
#
#  Why this file exists (not the original playbook_93_geo_engine.yml):
#    The uploaded PB-93 scaffolds a standalone "geo-engine" crate depending
#    on kaki-types (which doesn't exist). geo-engine does not exist under
#    that name in this repo — its HeptaMap E7 spatial index design
#    (ZoneId, HeptaShellIndex, 126 zones / 7 bands x 18 sectors) was
#    absorbed into enkidb-indexes::hepta_shell, confirmed present at
#    crates/enkidb-indexes/src/hepta_shell.rs (a single file, not a
#    submodule directory).
#
#    This file verifies the real successor module:
#      enkidb-indexes (hepta_shell subset) : 5 passed (of 58 total in the crate)
#
#  2026-07-25 FIX: the VERIFY task stat'd "src/hepta_shell" (implying a
#  directory) -- the real module is "hepta_shell.rs", so the check
#  always reported not-found and the playbook failed at the FAIL task
#  immediately after, even though the module was genuinely present
#  (same bug class found and fixed the same day in
#  playbook_90_zakaru_natiru_reconciled.yml's nairu_index check). Fixed
#  the stat path, and switched the ASSERT from a hard "5 passed" string
#  match to a ">= baseline 5" check (same pattern used elsewhere in
#  this batch of fixes) so future test additions to this module don't
#  require editing this file again.
# ════════════════════════════════════════════════════════════════════════════
- name: "PB-93 (Reconciled) | HeptaMap E7 spatial index — enkidb-indexes::hepta_shell"
  hosts: localhost
  connection: local
  gather_facts: true

  vars:
    forge_root:    "{{ ansible_env.HOME }}/Forge/EnkiDB"
    workspace:     "{{ forge_root }}/workspace/bahyway_v4"
    cargo:         "{{ ansible_env.HOME }}/.cargo/bin/cargo"
    target_branch: "claude/iphone-playbooks-crosstribe-eval-nbc5sw"
    session_date:  "{{ ansible_date_time.date }}"
    docs_dir:      "{{ forge_root }}/docs/SHEDU"
    report_file:   "{{ docs_dir }}/PB93_RECONCILED_{{ session_date }}.txt"

  tasks:

    - name: "PREP | Ensure report dir exists"
      ansible.builtin.file:
        path: "{{ docs_dir }}"
        state: directory
        mode: "0755"

    # ── Sync verification — NO git on this host ────────────────────────────
    # EriduOS-VDI is not a GitHub-connected clone. GitHub lives on the
    # laptop (Fedora host). Workflow: laptop runs git pull, then scp -r
    # the updated workspace/bahyway_v4 to this host at {{ workspace }}.
    # This playbook only verifies that sync already happened.
    - name: "VERIFY | Workspace present (scp'd from laptop)"
      ansible.builtin.stat:
        path: "{{ workspace }}/Cargo.toml"
      register: ws_check

    - name: "FAIL | Workspace not synced — run the laptop-side sync first"
      ansible.builtin.fail:
        msg: >
          {{ workspace }}/Cargo.toml not found on this host. EriduOS-VDI has
          no GitHub access. On your Fedora laptop: git pull origin
          {{ target_branch }}, then scp -r workspace/bahyway_v4
          bahaa@eriduos-vdi:{{ workspace }}. Re-run this playbook after that.
      when: not ws_check.stat.exists

    - name: "VERIFY | enkidb-indexes/src/hepta_shell.rs exists"
      ansible.builtin.stat:
        path: "{{ workspace }}/crates/enkidb-indexes/src/hepta_shell.rs"
      register: hepta_shell_module

    - name: "FAIL | hepta_shell module not found — stale sync — re-run the laptop scp step"
      ansible.builtin.fail:
        msg: "crates/enkidb-indexes/src/hepta_shell.rs not found after sync."
      when: not hepta_shell_module.stat.exists

    - name: "TEST | cargo test -p enkidb-indexes hepta_shell"
      ansible.builtin.command:
        cmd: "{{ cargo }} test -p enkidb-indexes hepta_shell"
        chdir: "{{ workspace }}"
      register: test_hepta_shell
      changed_when: false
      failed_when: test_hepta_shell.rc != 0

    - name: "PARSE | hepta_shell passed-test count"
      ansible.builtin.set_fact:
        hepta_shell_passed_count: "{{ (test_hepta_shell.stdout | regex_search('([0-9]+) passed', '\\1') | first) | int }}"

    - name: "ASSERT | hepta_shell has zero failures and at least the PB-93 baseline of passing tests"
      ansible.builtin.assert:
        that:
          - "'0 failed' in test_hepta_shell.stdout"
          - hepta_shell_passed_count >= 5
        fail_msg: >-
          Expected at least 5 passed, 0 failed. Got {{ hepta_shell_passed_count }}
          passed. Full output: {{ test_hepta_shell.stdout }}
        success_msg: >-
          enkidb-indexes::hepta_shell: {{ hepta_shell_passed_count }} passed,
          0 failed (>= baseline 5).

    - name: "WRITE | Report"
      ansible.builtin.copy:
        dest: "{{ report_file }}"
        mode: "0644"
        content: |
          BahyWay.Ecosystem v4.0 — PB-93 Reconciled Report
          Date : {{ session_date }}

          Original PB-93 (standalone "geo-engine" crate, kaki-types dep):
          SUPERSEDED — absorbed into enkidb-indexes::hepta_shell.

          Real successor verified this run:
            enkidb-indexes::hepta_shell : {{ hepta_shell_passed_count }} passed, 0 failed
            (subset of enkidb-indexes' full test suite; original baseline 5 of 54)

          HeptaMap E7 design intent (126 zones, 7 polar bands x 18 azimuthal
          sectors, ZoneId <-> centroid) preserved, same module now lives
          inside the consolidated index crate rather than standalone.

    - name: "DONE | PB-93 Reconciled COMPLETE"
      ansible.builtin.debug:
        msg: "PB-93 reconciled and verified against real repo state. Report: {{ report_file }}"
