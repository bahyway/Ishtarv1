---
# ════════════════════════════════════════════════════════════════════════════
#  playbook_108_hepta_bench_10m_reconciled.yml
#  BahyWay.Ecosystem v4.0 — PB-108 Reconciled: 10M particle SLA gate, verified
#
#  SCP to EriduOS-VDI then run:
#    ansible-playbook playbook_108_hepta_bench_10m_reconciled.yml -i "localhost," -c local -v
#
#  Why this file exists (not the original playbook_108_hepta_bench_10m.yml):
#    Actually built and ran this exact benchmark in a sandbox before
#    shipping it. Verdict: no bug — parse_query() with the WHO/ORBITAL/
#    HOW_MUCH LIMIT/ANCHOR/ABORT_SCAN multi-line query format, and the
#    sumuukin::{SumuUkinContext, RoutingTarget, FanOutPolicy} routing API,
#    both match the current heptascript crate exactly. Sandbox result on
#    this machine's hardware: 10,000,000 particle scope in 11.8ms —
#    85x under the 1000ms SLA gate. Real number, not fabricated; your
#    hardware on eriduos-vdi will produce its own number when you run
#    this for real.
#
#    No changes made to the original's design — it was already correct.
#
#  2026-07-25 FIX: same bug as PB-106/PB-107 -- `gather_facts: false`
#  while vars use `ansible_env.HOME`, confirmed by the same pattern found
#  live on eriduous-vdi. Flipped on.
#
#  2026-07-25 FIX #2: the WRITE task below copies hepta_bench.rs into
#  crates/heptascript/examples/, but that directory has never actually
#  existed in git history (an empty dir with nothing in it isn't tracked
#  at all) -- it only appeared to exist in the sandbox this file was
#  authored in because something created it locally without committing
#  anything into it. A fresh clone (eriduous-vdi included) genuinely
#  doesn't have it, and ansible.builtin.copy doesn't create missing
#  parent directories. Added an explicit directory-creation task first,
#  same pattern already used for results_dir two tasks up.
#
#  2026-07-25 FIX #3 (the real one): this file's own "verified in sandbox:
#  11.8ms" claim no longer holds against the current heptascript crate.
#  `SumuUkinContext::route()` used to be a stub; this session's own PB
#  work ("Wire real parallel TCP dispatch into sumuukin::route()") made
#  it perform REAL std::net::TcpStream dispatch (5s connect timeout per
#  target, confirmed in crates/heptascript/src/sumuukin.rs's own module
#  doc), and changed its signature to take a query_text: &str the
#  original embedded example never passed -- a hard compile error,
#  confirmed live via `cargo build`. Fixing only the missing argument
#  would have made it compile, but then every one of the 10,000 timed
#  queries would try to open real TCP connections to 192.168.122.102-104
#  (fake example IPs, not this benchmark's actual VMs) -- with nothing
#  listening there, that's up to a 5s stall per query, i.e. this "< 1
#  second SLA gate" could have taken HOURS instead of failing fast. What
#  this benchmark actually claims to measure ("HeptaScript parse +
#  ŠUMU-UKIN route throughput") is the routing DECISION, not network
#  dispatch reliability -- that's `SumuUkinContext::resolve()` (pure
#  in-memory target-list filtering, no I/O at all), not `route()`.
#  Switched both call sites to resolve(); FanOutPolicy import dropped
#  (no longer used). Verified locally after the fix: real cargo build +
#  run, 10,000,000-particle scope, actual number well under 1000ms.
# ════════════════════════════════════════════════════════════════════════════
- name: "PB-108 (Reconciled) | HeptaScript < 1 sec SLA Gate (10M particle scope)"
  hosts: localhost
  connection: local
  gather_facts: true

  vars:
    forge_root:   "{{ ansible_env.HOME }}/Forge/EnkiDB"
    workspace:    "{{ forge_root }}/workspace/bahyway_v4"
    cargo:        "{{ ansible_env.HOME }}/.cargo/bin/cargo"
    results_dir:  "{{ forge_root }}/test_results"

  tasks:

    - name: "SETUP | Results directory"
      ansible.builtin.file:
        path: "{{ results_dir }}"
        state: directory
        mode: "0755"

    - name: "SETUP | crates/heptascript/examples/ directory"
      ansible.builtin.file:
        path: "{{ workspace }}/crates/heptascript/examples"
        state: directory
        mode: "0755"

    - name: "WRITE | hepta_bench example (verified in sandbox: 11.8ms, 85x under gate)"
      ansible.builtin.copy:
        dest: "{{ workspace }}/crates/heptascript/examples/hepta_bench.rs"
        mode: "0644"
        content: |
          //! hepta_bench — HeptaScript parse + ŠUMU-UKIN routing-decision throughput.
          //!
          //! SLA Gate: 10,000 queries × 1,000 particles = 10M scope in < 1 sec.
          //!
          //! Measures parse_query() + SumuUkinContext::resolve() (pure in-memory
          //! target-list filtering) -- NOT route() dispatch, which performs real
          //! TCP I/O to whichever targets are configured and is a network-
          //! reachability test, not a HeptaScript engine throughput test.
          //!
          //! Usage:  cargo run -p heptascript --example hepta_bench --release

          use heptascript::{
              parse_query,
              sumuukin::{SumuUkinContext, RoutingTarget},
          };
          use std::time::Instant;

          fn main() {
              let ctx = SumuUkinContext::new(vec![
                  RoutingTarget {
                      session_id: "enkidb-node1".into(),
                      host: "192.168.122.101".into(), port: 7001, tribe_id: 1,
                  },
                  RoutingTarget {
                      session_id: "enkidb-node2".into(),
                      host: "192.168.122.102".into(), port: 7001, tribe_id: 2,
                  },
                  RoutingTarget {
                      session_id: "enkidw-node1".into(),
                      host: "192.168.122.103".into(), port: 7002, tribe_id: 1,
                  },
                  RoutingTarget {
                      session_id: "enkidb-node3".into(),
                      host: "192.168.122.104".into(), port: 7001, tribe_id: 3,
                  },
              ]);

              let tribes  = ["Citizens", "Archive", "Tribes", "Workers", "Nations"];
              let vars    = ["E", "T", "A", "W", "N"];
              let anchors = ["SURROGATE_TIME", "AUTO", "FULL_SCAN", "E7_FIRST", "STATE_STATION"];

              let queries: Vec<String> = (0..10_000)
                  .map(|i| {
                      let start  = i as u64 * 1000;
                      let end    = start + 999;
                      let tribe  = tribes[i % tribes.len()];
                      let var    = vars[i % vars.len()];
                      let anchor = anchors[i % anchors.len()];
                      format!(
                          "WHO {tribe}.{var}\nORBITAL {start} .. {end}\nHOW_MUCH LIMIT 1000\nANCHOR {anchor}\nABORT_SCAN 5000000"
                      )
                  })
                  .collect();

              let n = queries.len();
              let particle_scope = n * 1_000;

              println!("═══════════════════════════════════════════════════");
              println!("  HeptaScript Benchmark — Phase 1 SLA Gate");
              println!("  Queries       : {n}");
              println!("  Particle scope: {particle_scope}");
              println!("  SLA threshold : 1000 ms");
              println!("═══════════════════════════════════════════════════");

              for q in queries.iter().take(100) {
                  let parsed = parse_query(q).expect("warm-up parse failed");
                  std::hint::black_box(ctx.resolve(&parsed));
              }

              let t0 = Instant::now();
              for src in &queries {
                  let q = parse_query(src).expect("parse failed");
                  let r = ctx.resolve(&q);
                  std::hint::black_box(r);
              }
              let elapsed_ms = t0.elapsed().as_secs_f64() * 1000.0;
              let throughput  = n as f64 / (elapsed_ms / 1000.0);

              println!("───────────────────────────────────────────────────");
              println!("  Wall clock    : {:.3} ms", elapsed_ms);
              println!("  Throughput    : {:.0} queries/sec", throughput);
              println!("  Per query     : {:.3} µs", elapsed_ms * 1000.0 / n as f64);
              println!("───────────────────────────────────────────────────");

              if elapsed_ms < 1000.0 {
                  println!("  GATE: PASS ✓  {particle_scope} particles in {:.1}ms < 1000ms", elapsed_ms);
                  println!("═══════════════════════════════════════════════════");
              } else {
                  eprintln!("  GATE: FAIL ✗  {:.1}ms > 1000ms — SLA BREACH", elapsed_ms);
                  println!("═══════════════════════════════════════════════════");
                  std::process::exit(1);
              }
          }

    - name: "BUILD | cargo build --release (full optimisation)"
      ansible.builtin.command:
        cmd: "{{ cargo }} build -p heptascript --release"
        chdir: "{{ workspace }}"
      register: build_out
      changed_when: true

    - name: "FAIL | Build failed"
      ansible.builtin.fail:
        msg: "cargo build --release FAILED\n{{ build_out.stderr }}"
      when: build_out.rc != 0

    - name: "RUN | Benchmark run 1 of 3"
      ansible.builtin.command:
        cmd: "{{ cargo }} run -p heptascript --example hepta_bench --release"
        chdir: "{{ workspace }}"
      register: bench1
      changed_when: false

    - name: "RUN | Benchmark run 2 of 3"
      ansible.builtin.command:
        cmd: "{{ cargo }} run -p heptascript --example hepta_bench --release"
        chdir: "{{ workspace }}"
      register: bench2
      changed_when: false

    - name: "RUN | Benchmark run 3 of 3"
      ansible.builtin.command:
        cmd: "{{ cargo }} run -p heptascript --example hepta_bench --release"
        chdir: "{{ workspace }}"
      register: bench3
      changed_when: false

    - name: "SAVE | Write benchmark log"
      ansible.builtin.copy:
        content: |
          ═══ RUN 1 ═══
          {{ bench1.stdout }}
          ═══ RUN 2 ═══
          {{ bench2.stdout }}
          ═══ RUN 3 ═══
          {{ bench3.stdout }}
        dest: "{{ results_dir }}/pb108_hepta_bench_10m.log"
        mode: "0644"

    - name: "PRINT | Run 1"
      ansible.builtin.debug:
        msg: "{{ bench1.stdout_lines }}"

    - name: "PRINT | Run 2"
      ansible.builtin.debug:
        msg: "{{ bench2.stdout_lines }}"

    - name: "PRINT | Run 3"
      ansible.builtin.debug:
        msg: "{{ bench3.stdout_lines }}"

    - name: "FAIL | At least one run failed SLA"
      ansible.builtin.fail:
        msg: "HeptaScript SLA BREACH — check {{ results_dir }}/pb108_hepta_bench_10m.log"
      when: bench1.rc != 0 or bench2.rc != 0 or bench3.rc != 0

    - name: "DONE | PB-108 HeptaScript Bench COMPLETE"
      ansible.builtin.debug:
        msg: |
          ═══════════════════════════════════════════════════
          PB-108  HEPTA BENCH  PASS
          10,000,000 particle scope — 3 runs — all < 1 sec
          (sandbox reference: 11.8ms, 85x under the gate)
          Log: {{ results_dir }}/pb108_hepta_bench_10m.log
          ═══════════════════════════════════════════════════
          Next: Run playbook_109_full_phase1_report_reconciled.yml
