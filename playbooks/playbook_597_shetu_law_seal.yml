# =============================================================================
# PB-597 — The Šētu Law: Concept Seal (GL-LAT-002)
# BahyWay.Ecosystem v4.0 — 2026-08-23
#
# WHY THIS PLAYBOOK EXISTS
#   Seals GL-LAT-002: one deterministic, addressable lattice cast over
#   every civil surface -- PLANE (facades), RIBBON (roads/alleys),
#   CYLINDER (pipes), ARRAY (solar tables) -- so a facade, an alley, a
#   buried main, and a photovoltaic array become ONE data structure
#   walked by the same algebra (§2). The Fixed-Address Theorem makes
#   every cell's schema identical across chart classes (§3); the Seam
#   Clause forbids gaps or double claims where charts meet (§4);
#   Harranu navigation, water-grid isolation, and solar-farm detection
#   all reduce to lattice walks (§5); and the Master-Key Clause makes
#   every enrolled structure a ring in the Civil BigRing (§7).
#
#   Landed from a standalone Architect-supplied upload (2026-08-23),
#   the third zip round from Sat20260822. Evaluated file-by-file
#   against this repo before landing and RENUMBERED per this repo's
#   standing rule: the source deposit's own PB-LAT-002 -> PB-597 here.
#   See shala-prototypes/batch21_shetu_tirku_ummanu/README.md for the
#   full renumbering table and the open dependency-gap note (this
#   tablet's parent GL-MAP-001/HeptaSpaceMap, and GL-PHO-001/Ṣalmu,
#   remain undelivered and unsealed anywhere in this repo).
#
# WHAT THIS PLAYBOOK DOES
#   PROVEs the tablet's own four stated proof obligations (LAT2-PO-1
#   through LAT2-PO-4) are named, PROVEs the sole-addressing clause,
#   the Fixed-Address Theorem, the Seam Clause, and the Master-Key
#   Clause are sealed verbatim. PROVEs the Sala court (the Šētu City)
#   renders the cast net across all four chart classes on one alley
#   scene. Deposits nothing new -- docs and Sala tab are committed
#   directly into docs/ and shala-prototypes/, this playbook is a
#   pointer/verification record.
#
# Running this playbook = CSR-08 confirmation. Review -> --check -> live.
# =============================================================================

- name: "PB-597 | Seal the Šētu Law (GL-LAT-002)"
  hosts: localhost
  connection: local
  become: false
  vars:
    repo_root: "{{ playbook_dir }}/.."
    tablet_file: "{{ repo_root }}/docs/09_observatory/GL-LAT-002_Shetu_Law.md"
    court_file: "{{ repo_root }}/shala-prototypes/batch21_shetu_tirku_ummanu/sala_gl_lat_002_shetu_city.html"

  tasks:

    - name: "0.1 | Confirm the tablet and the Sala court are landed"
      ansible.builtin.stat:
        path: "{{ item }}"
      register: land_stat
      loop:
        - "{{ tablet_file }}"
        - "{{ court_file }}"
      loop_control: { label: "{{ item }}" }

    - name: "FAIL | required file missing"
      ansible.builtin.fail:
        msg: "{{ item.item }} not found -- nothing to seal."
      loop: "{{ land_stat.results }}"
      loop_control: { label: "{{ item.item }}" }
      when: not item.stat.exists

    - name: "1.1 | PROVE the tablet's own four proof obligations (LAT2-PO-1..4) are named"
      ansible.builtin.shell: |
        set -e
        grep -qF "LAT2-PO-1" "{{ tablet_file }}"
        grep -qF "LAT2-PO-2" "{{ tablet_file }}"
        grep -qF "LAT2-PO-3" "{{ tablet_file }}"
        grep -qF "LAT2-PO-4" "{{ tablet_file }}"
        echo "PROVEN: LAT2-PO-1..4 all present"
      register: prove_pos
      changed_when: false

    - name: "1.2 | PROVE the sole-addressing clause and the four chart classes are sealed"
      ansible.builtin.shell: |
        set -e
        grep -qF "the SOLE lawful addressing scheme for civil-service particles" "{{ tablet_file }}"
        grep -qF "**PLANE**" "{{ tablet_file }}"
        grep -qF "**RIBBON**" "{{ tablet_file }}"
        grep -qF "**CYLINDER**" "{{ tablet_file }}"
        grep -qF "**ARRAY**" "{{ tablet_file }}"
        echo "PROVEN: sole addressing and the four chart classes are sealed"
      register: prove_charts
      changed_when: false

    - name: "1.3 | PROVE the Fixed-Address Theorem and the Seam Clause are sealed"
      ansible.builtin.shell: |
        set -e
        grep -qF "The Fixed-Address Theorem:" "{{ tablet_file }}"
        grep -qF "SAME KIND OF CITIZEN" "{{ tablet_file }}"
        grep -qF "An unstitched seam is an open wound in the net" "{{ tablet_file }}"
        echo "PROVEN: the Fixed-Address Theorem and the Seam Clause are sealed"
      register: prove_theorem
      changed_when: false

    - name: "1.4 | PROVE the Master-Key Clause is sealed"
      ansible.builtin.shell: |
        set -e
        grep -qF "narrowness becomes arithmetic" "{{ tablet_file }}"
        grep -qF "makes the city ONE data structure" "{{ tablet_file }}"
        echo "PROVEN: the Master-Key Clause is sealed"
      register: prove_masterkey
      changed_when: false

    - name: "1.5 | PROVE the Sala court renders all four chart classes on one scene"
      ansible.builtin.shell: |
        set -e
        grep -qF "CAST THE NET" "{{ court_file }}"
        grep -qF "PLANE charts" "{{ court_file }}"
        grep -qF "RIBBON chart" "{{ court_file }}"
        grep -qF "CYLINDER lattice" "{{ court_file }}"
        grep -qF "ARRAY chart" "{{ court_file }}"
        grep -qF "passability verdict in cells" "{{ court_file }}"
        echo "PROVEN: the Šētu City renders all four chart classes with a passability verdict"
      register: prove_court
      changed_when: false

    - name: "2.1 | Report"
      ansible.builtin.debug:
        msg: >
          PB-597 complete. GL-LAT-002 sealed: one deterministic net
          (PLANE/RIBBON/CYLINDER/ARRAY charts) is now the sole lawful
          addressing scheme for every civil-service particle, with a
          fixed per-cell schema across chart classes, a governed seam
          clause, and navigation/water-grid/solar-farm detection all
          reduced to lattice walks on the Civil BigRing. Renumbered
          from the source deposit's PB-LAT-002; see
          shala-prototypes/batch21_shetu_tirku_ummanu/README.md for the
          full renumbering table and the open notes on GL-MAP-001 and
          GL-PHO-001, named as parents but not yet landed.
