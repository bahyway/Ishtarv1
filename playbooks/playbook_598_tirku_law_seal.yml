# =============================================================================
# PB-598 — The Tirku Law: Concept Seal (GL-HYD-001)
# BahyWay.Ecosystem v4.0 — 2026-08-23
#
# WHY THIS PLAYBOOK EXISTS
#   Seals GL-HYD-001: the Assay Clause (§1) corrects a submitted
#   pseudo-parabolic leak-detection proposal's two physics errors
#   before sealing anything -- the standard water-hammer model is
#   HYPERBOLIC, not parabolic, and the proposed operator was
#   dimensionally a chimera -- then recognizes two honest organs: the
#   Interior Stroke (§2, a damped viscoelastic wave equation with
#   Kelvin-Voigt memory) and the Ground Plume (§5, the true
#   Barenblatt-Zheltov-Kochina pseudo-parabolic equation, governing the
#   SafaaHarmony moisture witness's lag). The Model-Confession Clause
#   (§4) makes the residual itself the false-positive discriminator --
#   witnessed at sealing as a 29,701x confession. Enrolled as Napharu
#   member 55.
#
#   Landed from a standalone Architect-supplied upload (2026-08-23),
#   the third zip round from Sat20260822. Evaluated file-by-file
#   against this repo before landing and RENUMBERED per this repo's
#   standing rule: the source deposit's own PB-HYD-001 -> PB-598 here.
#   See shala-prototypes/batch21_shetu_tirku_ummanu/README.md for the
#   full renumbering table. This tablet closes the GL-HYD-001 gap
#   reported in batch19's README (named there as a Kiṣru K1 muster
#   member and Napharu member 55, never delivered until now). Its own
#   parent GL-NIM-003 (Bārûtu) and GL-CLR-001 (SafaaHarmony) remain
#   unsealed in this repo.
#
# WHAT THIS PLAYBOOK DOES
#   PROVEs the tablet's own four stated proof obligations (HYD-PO-1
#   through HYD-PO-4) are named, PROVEs the Assay Clause's two named
#   faults, the Interior Stroke equation, the Model-Confession Clause's
#   witnessed 29,701x ratio, and the two-witness compliance clause are
#   sealed verbatim. PROVEs the Sala court (the Tirku Wave Court)
#   renders the live pseudo-parabolic stroke deforming the membrane and
#   the grid-scan inverse naming the wound. Deposits nothing new --
#   docs and Sala tab are committed directly into docs/ and
#   shala-prototypes/, this playbook is a pointer/verification record.
#
# Running this playbook = CSR-08 confirmation. Review -> --check -> live.
# =============================================================================

- name: "PB-598 | Seal the Tirku Law (GL-HYD-001)"
  hosts: localhost
  connection: local
  become: false
  vars:
    repo_root: "{{ playbook_dir }}/.."
    tablet_file: "{{ repo_root }}/docs/09_observatory/GL-HYD-001_Tirku_Law.md"
    court_file: "{{ repo_root }}/shala-prototypes/batch21_shetu_tirku_ummanu/sala_gl_hyd_001_tirku_wave_court.html"

  tasks:

    - name: "0.1 | Confirm the tablet and the Sala court are landed"
      ansible.builtin.stat:
        path: "{{ item }}"
      register: land_stat
      loop:
        - "{{ tablet_file }}"
        - "{{ court_file }}"
      loop_control: { label: "{{ item }}" }

    - name: "FAIL | required file missing"
      ansible.builtin.fail:
        msg: "{{ item.item }} not found -- nothing to seal."
      loop: "{{ land_stat.results }}"
      loop_control: { label: "{{ item.item }}" }
      when: not item.stat.exists

    - name: "1.1 | PROVE the tablet's own four proof obligations (HYD-PO-1..4) are named"
      ansible.builtin.shell: |
        set -e
        grep -qF "HYD-PO-1" "{{ tablet_file }}"
        grep -qF "HYD-PO-2" "{{ tablet_file }}"
        grep -qF "HYD-PO-3" "{{ tablet_file }}"
        grep -qF "HYD-PO-4" "{{ tablet_file }}"
        echo "PROVEN: HYD-PO-1..4 all present"
      register: prove_pos
      changed_when: false

    - name: "1.2 | PROVE the Assay Clause's two named faults are sealed"
      ansible.builtin.shell: |
        set -e
        grep -qF "FAULT 1 — the strawman inverted" "{{ tablet_file }}"
        grep -qF "FAULT 2 — the chimera operator" "{{ tablet_file }}"
        echo "PROVEN: both assayed faults are sealed"
      register: prove_assay
      changed_when: false

    - name: "1.3 | PROVE the Interior Stroke equation and the Model-Confession ratio are sealed"
      ansible.builtin.shell: |
        set -e
        grep -qF "∂²P/∂t² = c² ∂²P/∂x² + η ∂³P/∂x²∂t" "{{ tablet_file }}"
        grep -qF "29,701" "{{ tablet_file }}"
        echo "PROVEN: the interior-stroke equation and the witnessed confession ratio are sealed"
      register: prove_stroke
      changed_when: false

    - name: "1.4 | PROVE the Ground Plume and Two-Witness Compliance clauses are sealed"
      ansible.builtin.shell: |
        set -e
        grep -qF "∂u/∂t = a ∂²u/∂z² + η_g ∂³u/∂z²∂t" "{{ tablet_file }}"
        grep -qF "The stroke names; witnesses convict" "{{ tablet_file }}"
        echo "PROVEN: the Ground Plume equation and Two-Witness Compliance are sealed"
      register: prove_plume
      changed_when: false

    - name: "1.5 | PROVE the Sala court renders the live stroke, the deforming membrane, and the named wound"
      ansible.builtin.shell: |
        set -e
        grep -qF "Membrane Motion Doctrine" "{{ court_file }}"
        grep -qF "FIRE THE STROKE" "{{ court_file }}"
        grep -qF "N9 Cinematic Camera" "{{ court_file }}"
        grep -qF "grid-scan inverse" "{{ court_file }}"
        echo "PROVEN: the Wave Court renders the live stroke as membrane deformation and names the wound"
      register: prove_court
      changed_when: false

    - name: "2.1 | Report"
      ansible.builtin.debug:
        msg: >
          PB-598 complete. GL-HYD-001 sealed: two honest organs replace
          the submitted proposal's chimera -- the interior stroke
          (damped viscoelastic wave, Kelvin-Voigt memory) and the
          ground plume (true BZK pseudo-parabolic, governing the
          moisture witness's lag) -- with the residual itself refusing
          wrong-physics fits (29,701x witnessed) and the stroke's
          estimate always requiring a second independent witness to
          convict. Enrolled as Napharu member 55. Renumbered from the
          source deposit's PB-HYD-001; see
          shala-prototypes/batch21_shetu_tirku_ummanu/README.md for the
          full renumbering table. Closes the GL-HYD-001 gap first
          reported in batch19.
