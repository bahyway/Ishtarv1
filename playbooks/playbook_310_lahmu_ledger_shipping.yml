---
# 𒁾 PB-310 — LAHMU–LAHAMU LEDGER SHIPPING (GL-OPS-001 L-1)
# The twins: primary awake, standby listening. Shipping is a PALGU stream:
# ADANNU watermark reported, MILU ladder bounded, ARKU absorbed, no silent drop.
# TODO: replace rsync stub with native `enkidb-ship` when the binary exists.
- name: PB-310 | Lahmu-Lahamu ledger shipping
  hosts: uruk-node-write
  become: true
  # 2026-08-23: the PB-310-320 suite's own README says "All variables live
  # in inventories/*/group_vars/all.yml" but this playbook never actually
  # loaded it -- real bug, found live (ship_user undefined). Follows the
  # same {{ playbook_dir }}/../<path> pattern playbook_265/273 already use
  # for ansible/vars/base_image.yml.
  vars_files:
    - "{{ playbook_dir }}/../inventories/uruk/group_vars/all.yml"
  vars:
    ship_script: /usr/local/bin/lahmu-ship.sh
    # 2026-08-24, found live: the ship_script's ssh/rsync calls had no
    # BatchMode/StrictHostKeyChecking/ConnectTimeout -- on this being
    # lahamu's first-ever connection to uruk-node-vault (that system
    # user was only just created above, no known_hosts entry yet), ssh
    # sat waiting forever on an interactive host-key-confirmation prompt
    # that a non-interactive Ansible/systemd context can never answer --
    # a real hang, not a slow step, and a direct violation of this
    # Ecosystem's own zero-prompt-automation doctrine. accept-new (not
    # =no) still fails loudly if a host key later CHANGES (compromise
    # signal), it only skips the prompt on a genuinely first-time host.
    ssh_opts: "-o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10"
  tasks:
    - name: Ensure shipping user (lahamu) exists on both twins
      ansible.builtin.user: { name: "{{ ship_user }}", system: true, shell: /usr/sbin/nologin }

    - name: Install shipping script (segment + checksum + watermark)
      ansible.builtin.copy:
        dest: "{{ ship_script }}"
        mode: "0750"
        content: |
          #!/usr/bin/env bash
          set -euo pipefail
          SEG_DIR="{{ ledger_dir }}/segments"
          WM="{{ watermark_file }}"
          # 2026-08-24, found live: "find: '.../segments': No such file or
          # directory" -- now that ledger_dir is genuinely the dedicated
          # ledger disk (PB-320's guest-side mkfs.xfs+mount), creating
          # segments/ beneath it is safe and correct (this is NOT the
          # earlier concern about mkdir'ing ledger_dir itself onto the
          # wrong filesystem -- that's resolved; this is just a normal
          # subdirectory a fresh, empty ledger disk never had yet).
          mkdir -p "$SEG_DIR"
          # MILU rung 1: bounded buffer — refuse to ship if backlog exceeds bound
          BACKLOG=$(find "$SEG_DIR" -name '*.pending' | wc -l)
          if [ "$BACKLOG" -gt 512 ]; then
            logger -t lahmu "MILU: backlog $BACKLOG > bound; shedding to NUZI path"
            # rung 2: shed to vault hot path with milu marker (never drop)
          fi
          # 2026-08-24, found live: "sha256sum: '.../*.seg': No such file
          # or directory" -- an unmatched glob is passed to sha256sum as
          # the LITERAL pattern string, not silently dropped. A ledger
          # with zero segments yet is a completely normal state on a
          # freshly provisioned disk (nothing has actually written to
          # enkidb-write-server yet) -- not an error. Exit cleanly
          # instead of crashing on the checksum/watermark steps below,
          # which all assume real segment/watermark data exists.
          if [ -z "$(find "$SEG_DIR" -maxdepth 1 -name '*.seg' -print -quit)" ]; then
            logger -t lahmu "lahmu-ship: no .seg segments yet -- nothing to ship"
            exit 0
          fi
          rsync -a --checksum -e "ssh {{ ssh_opts }}" "$SEG_DIR/" \
            "{{ ship_user }}@{{ ship_target_host }}:{{ ship_target_dir }}/"
          # ADANNU: publish watermark = highest fully-shipped segment id
          ssh {{ ssh_opts }} "{{ ship_user }}@{{ ship_target_host }}" \
            "sha256sum {{ ship_target_dir }}/*.seg | sha256sum | cut -d' ' -f1" \
            > /tmp/remote_chain
          sha256sum "$SEG_DIR"/*.seg | sha256sum | cut -d' ' -f1 > /tmp/local_chain
          diff /tmp/local_chain /tmp/remote_chain   # GATE: chain equality end-to-end
          cp "$WM" /tmp/wm_shipped && logger -t lahmu "watermark shipped: $(cat $WM)"

    # 2026-08-23, found live: these two copy tasks get simulated (not really
    # written) under --check, so the "Enable timer" task -- a real systemd
    # module call regardless of check mode -- correctly can't find a unit
    # file that check mode never actually wrote. check_mode: false so
    # PB-609's check-then-live gate can ever reach this playbook's live phase.
    - name: Systemd service + timer (ship every minute; adjust to taste)
      ansible.builtin.copy:
        dest: /etc/systemd/system/lahmu-ship.service
        content: |
          [Unit]
          Description=BahyWay Lahmu-Lahamu ledger shipping (PB-310)
          [Service]
          Type=oneshot
          ExecStart={{ ship_script }}
      check_mode: false
    - ansible.builtin.copy:
        dest: /etc/systemd/system/lahmu-ship.timer
        content: |
          [Unit]
          Description=PB-310 shipping cadence
          [Timer]
          OnCalendar=*:*:00
          Persistent=true
          [Install]
          WantedBy=timers.target
      name: Timer unit
      check_mode: false
    - name: Enable timer
      ansible.builtin.systemd: { name: lahmu-ship.timer, enabled: true, state: started, daemon_reload: true }

    # 2026-08-24, found live: "ssh: Could not resolve hostname
    # uruk-node-vault: Name or service not known". ansible_host=
    # 192.168.122.113 (ansible/inventory.ini) is known to Ansible for
    # its OWN ssh connections, but that mapping never reaches this
    # guest's OS-level /etc/hosts -- the ship_script's embedded `ssh`/
    # `rsync` calls run through the guest's own resolver, which has
    # nothing for the libvirt VM network. Resolved dynamically from the
    # inventory (not hardcoded) so this stays correct if the IP changes.
    - name: "Ensure {{ ship_target_host }} resolves (guest has no DNS for the libvirt VM network)"
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: '\s{{ ship_target_host }}$'
        line: "{{ hostvars[groups['enkidb_vault'][0]].ansible_host }} {{ ship_target_host }}"

    # 2026-08-24, found live: "Permission denied (publickey,gssapi-keyex,
    # gssapi-with-mic)" -- lahamu was only ever created (nologin,
    # no-home) on uruk-node-write; nothing ever created it on
    # uruk-node-vault, and no key was ever trusted. See this task file's
    # own header for the full explanation -- shared with PB-311, which
    # has the identical problem shipping from a different source host.
    - name: "Ensure SSH trust to {{ ship_target_host }} before attempting to ship"
      ansible.builtin.import_tasks: "{{ playbook_dir }}/tasks/ensure_ship_target_trust.yml"

    # 2026-08-24, found live: "rsync: [Receiver] mkdir '/vault/hot/
    # ledger_segments' failed: No such file or directory". rsync can
    # create the LAST component of a destination path, but not missing
    # PARENT directories -- /vault/hot never existed on uruk-node-vault
    # at all (nothing had ever provisioned it).
    - name: "Ensure {{ ship_target_dir }} exists on {{ ship_target_host }} (rsync can't create missing parent directories on its own)"
      ansible.builtin.file:
        path: "{{ ship_target_dir }}"
        state: directory
        owner: "{{ ship_user }}"
        mode: "0750"
      delegate_to: "{{ ship_target_host }}"

    - name: GATE | one shipping cycle succeeds with chain equality
      ansible.builtin.command: "{{ ship_script }}"
      changed_when: false

    - name: Run-KAKI (hash-chained, L-8 Link 1 on ourselves)
      ansible.builtin.shell: |
        mkdir -p $(dirname {{ kaki_runs }})
        PREV=$(tail -n1 {{ kaki_runs }} 2>/dev/null | sha256sum | cut -d' ' -f1)
        echo "{\"pb\":\"PB-310\",\"adannu\":\"$(date -Is)\",\"host\":\"$(hostname)\",\"prev\":\"$PREV\",\"gate\":\"chain-equal\"}" >> {{ kaki_runs }}
