# =============================================================================
# PB-582 — The Kulla Law: Concept Seal (GL-LAT-001)
# BahyWay.Ecosystem v4.0 — 2026-08-23
#
# WHY THIS PLAYBOOK EXISTS
#   Seals GL-LAT-001: every node and strut of an architected or
#   stochastic lattice is a born KAKI citizen with the full seven
#   dimensions (Identity, Belonging, Temporal, Integrity, Quality,
#   OrbitalPosition, ColourID); ColourID is the mechanical class
#   (STRETCH-DOMINATED / BEND-DOMINATED / TRANSITIONAL) by Maxwell
#   counting against a declared rigidity threshold; a realization that
#   violates its own declared generator law is REFUSED by the
#   Generator Fingerprint (S4); a lawful stochastic lattice is stored
#   as generator law + seed + membrane -- the decree, not the shape --
#   and regenerates deterministically (S5); the Bārûtu Charter (S6)
#   prophesies SHELL-CROSS per strut and fires CASCADE-WATCH over a
#   node's Belonging neighborhood when a rupture changes its class.
#
#   Landed from a standalone Architect-supplied upload (2026-08-23),
#   evaluated file-by-file against this repo before landing and
#   RENUMBERED per this repo's standing rule: the source deposit's own
#   PB-LAT-001 -> PB-582 here. See
#   shala-prototypes/batch15_alaa_kinu_kulla_harvest/README.md for the
#   full renumbering table, the open dependency-gap note (this
#   tablet's parents GL-ALG-002/Napharu and GL-ISR-002-A2/Ṭēmu are not
#   yet landed in docs/09_observatory/), and the note on the second,
#   differently-staged Kulla Court rehearsal already landed in
#   shala-prototypes/batch14_shedu_kulla_courts/.
#
# WHAT THIS PLAYBOOK DOES
#   PROVEs the tablet's own four stated proof obligations (LAT-PO-1
#   through LAT-PO-4) are named, PROVEs the Citizen Decree's seven
#   dimensions and the ColourID Mechanical-Class Law are sealed
#   verbatim, and PROVEs the Sala court renders the crowd/Tribe split,
#   the Generator Fingerprint refusal, and the Cascade Clause. Deposits
#   nothing new -- docs and Sala tab are committed directly into docs/
#   and shala-prototypes/, this playbook is a pointer/verification
#   record.
#
# Running this playbook = CSR-08 confirmation. Review -> --check -> live.
# =============================================================================

- name: "PB-582 | Seal the Kulla Law (GL-LAT-001)"
  hosts: localhost
  connection: local
  become: false
  vars:
    repo_root: "{{ playbook_dir }}/.."
    tablet_file: "{{ repo_root }}/docs/09_observatory/GL-LAT-001_Kulla_Law.md"
    court_file: "{{ repo_root }}/shala-prototypes/batch15_alaa_kinu_kulla_harvest/sala_gl_lat_001_kulla_court.html"

  tasks:

    - name: "0.1 | Confirm the tablet and the Sala court are landed"
      ansible.builtin.stat:
        path: "{{ item }}"
      register: land_stat
      loop:
        - "{{ tablet_file }}"
        - "{{ court_file }}"
      loop_control: { label: "{{ item }}" }

    - name: "FAIL | required file missing"
      ansible.builtin.fail:
        msg: "{{ item.item }} not found -- nothing to seal."
      loop: "{{ land_stat.results }}"
      loop_control: { label: "{{ item.item }}" }
      when: not item.stat.exists

    - name: "1.1 | PROVE the tablet's own four proof obligations (LAT-PO-1..4) are named"
      ansible.builtin.shell: |
        set -e
        grep -qF "LAT-PO-1" "{{ tablet_file }}"
        grep -qF "LAT-PO-2" "{{ tablet_file }}"
        grep -qF "LAT-PO-3" "{{ tablet_file }}"
        grep -qF "LAT-PO-4" "{{ tablet_file }}"
        echo "PROVEN: LAT-PO-1..4 all present"
      register: prove_pos
      changed_when: false

    - name: "1.2 | PROVE the Citizen Decree's seven dimensions are sealed"
      ansible.builtin.shell: |
        set -e
        grep -qF "full seven dimensions" "{{ tablet_file }}"
        grep -qF "**Identity**" "{{ tablet_file }}"
        grep -qF "**Belonging**" "{{ tablet_file }}"
        grep -qF "**Temporal**" "{{ tablet_file }}"
        grep -qF "**Integrity**" "{{ tablet_file }}"
        grep -qF "**Quality (EAV)**" "{{ tablet_file }}"
        grep -qF "**OrbitalPosition**" "{{ tablet_file }}"
        grep -qF "**ColourID**" "{{ tablet_file }}"
        grep -qF "crowds have no standing before Kulla's court" "{{ tablet_file }}"
        echo "PROVEN: the seven-dimension Citizen Decree is sealed, and the crowd/citizen distinction stands"
      register: prove_decree
      changed_when: false

    - name: "1.3 | PROVE the ColourID Mechanical-Class Law and the Generator Fingerprint are sealed"
      ansible.builtin.shell: |
        set -e
        grep -qF "STRETCH-DOMINATED" "{{ tablet_file }}"
        grep -qF "BEND-DOMINATED" "{{ tablet_file }}"
        grep -qF "TRANSITIONAL" "{{ tablet_file }}"
        grep -qF "realization **violates its declared generator" "{{ tablet_file }}"
        grep -qF "law is REFUSED**" "{{ tablet_file }}"
        grep -qF "geometry itself refuses the false brick as it" "{{ tablet_file }}"
        echo "PROVEN: the three-class ColourID law and the fingerprint REFUSAL gate are sealed"
      register: prove_colourid
      changed_when: false

    - name: "1.4 | PROVE the Regeneration Clause and the Bārûtu Cascade Clause are sealed"
      ansible.builtin.shell: |
        set -e
        grep -qF "the decree, not the shape" "{{ tablet_file }}"
        grep -qF "the shape dies," "{{ tablet_file }}"
        grep -qF "CASCADE-WATCH" "{{ tablet_file }}"
        grep -qF "the failure's future read through the tribe's" "{{ tablet_file }}"
        echo "PROVEN: store-the-decree regeneration and the fatigue Cascade Clause are sealed"
      register: prove_regen
      changed_when: false

    - name: "1.5 | PROVE the Sala court renders the crowd/Tribe split, the fingerprint refusal, and cascade"
      ansible.builtin.shell: |
        set -e
        grep -qF "crowd" "{{ court_file }}"
        grep -qF "Tribe" "{{ court_file }}"
        grep -qF "REFUSED" "{{ court_file }}"
        grep -qF "generator law" "{{ court_file }}"
        grep -qF "CASCADE-WATCH" "{{ court_file }}"
        grep -qF "law shifted around it" "{{ court_file }}"
        echo "PROVEN: the crowd/Tribe comparison, the misprint refusal, and the cascade all render"
      register: prove_court
      changed_when: false

    - name: "2.1 | Report"
      ansible.builtin.debug:
        msg: >
          PB-582 complete. GL-LAT-001 sealed: every lattice node/strut
          is a born seven-dimension KAKI citizen or the lattice is a
          crowd with no standing; ColourID classes by declared Maxwell
          counting; a realization violating its own generator law is
          REFUSED by geometry itself; a lawful stochastic lattice is
          stored as decree (law + seed + membrane), never as shape, and
          regenerates deterministically; and the Bārûtu Cascade Clause
          fires CASCADE-WATCH over a node's neighborhood the moment a
          rupture changes its mechanical class. Renumbered from the
          source deposit's PB-LAT-001; see
          shala-prototypes/batch15_alaa_kinu_kulla_harvest/README.md
          for the full renumbering table, the open note that this
          tablet's parents (Napharu, Ṭēmu) are not yet landed in
          docs/09_observatory/, and the cross-reference to the second
          Kulla Court rehearsal already landed in batch14 (a distinct
          railway-bridge staging of the same law).
