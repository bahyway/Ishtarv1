# =============================================================================
# PB-585 — SaadounShape: Concept Seal (GL-ISR-002)
# BahyWay.Ecosystem v4.0 — 2026-08-23
#
# WHY THIS PLAYBOOK EXISTS
#   Seals GL-ISR-002, the fourth son of the Saadoun Calculus:
#   SaadounShape inverts the field's usual judgment and reads
#   structured asymmetry as the informant rather than a defect to
#   compensate away. Three independent witnesses -- harmonic asymmetry
#   (positions), visibility asymmetry (hull, with honest Unnamed
#   Surface where aspect coverage never reached), amplitude asymmetry
#   (normals) -- jointly carve total 3D shape, minted as a Masku
#   membrane. WITHHELD-FLAT refuses a fabricated third coordinate from
#   genuinely symmetric single-axis motion.
#
#   Landed from a standalone Architect-supplied upload (2026-08-23),
#   evaluated file-by-file against this repo before landing and
#   RENUMBERED per this repo's standing rule: the source deposit's own
#   PB-ISR-002 -> PB-585 here. See
#   shala-prototypes/batch16_saadoun_family_puluhtu_deploygate/README.md
#   for the full renumbering table. This tablet is the direct parent
#   this repo was missing for GL-ISR-002-A1 (the Alaa Doctrine, landed
#   in batch15) -- closing that batch's open dependency-gap note for
#   Alaa's immediate parent (GL-ALG-002/Napharu, the grandparent of
#   both, remains unsealed in docs/09_observatory/, still only in
#   docs/fri20260821-incoming/).
#
# WHAT THIS PLAYBOOK DOES
#   PROVEs the tablet's own four stated proof obligations (ISR-PO-5
#   through ISR-PO-8) are named, PROVEs the Inversion Doctrine and the
#   three witnesses are sealed verbatim, and PROVEs the Sala court
#   stages the WITHHELD-FLAT symmetric case, the asymmetric carving,
#   and the honest Unnamed Surface. Deposits nothing new -- docs and
#   Sala tab are committed directly into docs/ and shala-prototypes/,
#   this playbook is a pointer/verification record.
#
# Running this playbook = CSR-08 confirmation. Review -> --check -> live.
# =============================================================================

- name: "PB-585 | Seal SaadounShape (GL-ISR-002)"
  hosts: localhost
  connection: local
  become: false
  vars:
    repo_root: "{{ playbook_dir }}/.."
    tablet_file: "{{ repo_root }}/docs/09_observatory/GL-ISR-002_SaadounShape.md"
    court_file: "{{ repo_root }}/shala-prototypes/batch16_saadoun_family_puluhtu_deploygate/sala_gl_isr_002_saadoun_shape.html"

  tasks:

    - name: "0.1 | Confirm the tablet and the Sala court are landed"
      ansible.builtin.stat:
        path: "{{ item }}"
      register: land_stat
      loop:
        - "{{ tablet_file }}"
        - "{{ court_file }}"
      loop_control: { label: "{{ item }}" }

    - name: "FAIL | required file missing"
      ansible.builtin.fail:
        msg: "{{ item.item }} not found -- nothing to seal."
      loop: "{{ land_stat.results }}"
      loop_control: { label: "{{ item.item }}" }
      when: not item.stat.exists

    - name: "1.1 | PROVE the tablet's own four proof obligations (ISR-PO-5..8) are named"
      ansible.builtin.shell: |
        set -e
        grep -qF "ISR-PO-5" "{{ tablet_file }}"
        grep -qF "ISR-PO-6" "{{ tablet_file }}"
        grep -qF "ISR-PO-7" "{{ tablet_file }}"
        grep -qF "ISR-PO-8" "{{ tablet_file }}"
        echo "PROVEN: ISR-PO-5..8 all present"
      register: prove_pos
      changed_when: false

    - name: "1.2 | PROVE the Inversion Doctrine is sealed verbatim"
      ansible.builtin.shell: |
        set -e
        grep -qF "this tablet inverts the judgment — **the asymmetry is the" "{{ tablet_file }}"
        grep -qF "relational asymmetries between scatterer curves are evidence" "{{ tablet_file }}"
        echo "PROVEN: the Inversion Doctrine is sealed"
      register: prove_inversion
      changed_when: false

    - name: "1.3 | PROVE the three independent witnesses and the Unnamed Surface doctrine are sealed"
      ansible.builtin.shell: |
        set -e
        grep -qF "First Witness: Harmonic Asymmetry" "{{ tablet_file }}"
        grep -qF "Second Witness: Visibility Asymmetry" "{{ tablet_file }}"
        grep -qF "Third Witness: Amplitude Asymmetry" "{{ tablet_file }}"
        grep -qF "Unnamed Surface doctrine." "{{ tablet_file }}"
        grep -qF "the Two-Witness floor of GL-NIM-002 is exceeded by design" "{{ tablet_file }}"
        echo "PROVEN: the three witnesses and the Unnamed Surface doctrine are sealed"
      register: prove_witnesses
      changed_when: false

    - name: "1.4 | PROVE WITHHELD-FLAT and the Masku membrane mint are sealed"
      ansible.builtin.shell: |
        set -e
        grep -qF "**WITHHELD-FLAT.** If motion is genuinely single-axis" "{{ tablet_file }}"
        grep -qF "a third coordinate claimed from a symmetric" "{{ tablet_file }}"
        grep -qF "**Masku membrane** (EN-MDB-001)" "{{ tablet_file }}"
        echo "PROVEN: WITHHELD-FLAT and the membrane mint are sealed"
      register: prove_membrane
      changed_when: false

    - name: "1.5 | PROVE the Sala court stages the symmetric refusal, the asymmetric carving, and the Unnamed Surface"
      ansible.builtin.shell: |
        set -e
        grep -qF "WITHHELD-FLAT" "{{ court_file }}"
        grep -qF "one coordinate per resolved harmonic" "{{ court_file }}"
        grep -qF "UNNAMED SURFACE" "{{ court_file }}"
        grep -qF "three witnesses, one surface" "{{ court_file }}"
        echo "PROVEN: the three-act court stages symmetric refusal, asymmetric carving, and the honest Unnamed Surface"
      register: prove_court
      changed_when: false

    - name: "2.1 | Report"
      ansible.builtin.debug:
        msg: >
          PB-585 complete. GL-ISR-002 sealed: SaadounShape reads
          structured asymmetry as informant, not defect; harmonic,
          visibility, and amplitude witnesses jointly carve 3D shape
          into a Masku membrane; WITHHELD-FLAT refuses a fabricated
          coordinate from genuinely symmetric motion; unwitnessed hull
          regions stay honestly Unnamed Surface. Renumbered from the
          source deposit's PB-ISR-002; see
          shala-prototypes/batch16_saadoun_family_puluhtu_deploygate/README.md
          for the full renumbering table. This tablet resolves the
          dependency gap batch15 reported for GL-ISR-002-A1 (Alaa)'s
          immediate parent.
