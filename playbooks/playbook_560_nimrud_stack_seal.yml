# =============================================================================
# PB-560 — Nimrud Stack: Concept Seal (GL-STK-001)
# BahyWay.Ecosystem v4.0 — 2026-08-20
#
# WHY THIS PLAYBOOK EXISTS
#   Seals GL-STK-001, the four-member judgment-and-action arc for water-
#   network leak detection: WITNESS (SUSA-fed observation court) -> JUDGE
#   (Enbilulu/WPDEngine, localization under a Cramer-Rao gate) -> MOVE
#   (SilaEngine/Harranu, crew routing) -> STAGE (sovereign GIS shell).
#   Its complement, Enuma Elis (GL-EE-001), is the creation arc that
#   births the particles this Stack judges -- the two meet at exactly
#   one point, OntoGraph. CONCEPT DOCUMENT ONLY, landed as a Sala
#   rehearsal (shala_nimrud_ee_court.html) -- production truth remains
#   sovereign egui/WGPU (Way-of-Work rule 5).
#
#   Landed from a parallel Claude session's Thu20260820 "Nimrud Stack"
#   thread, evaluated file-by-file against this repo before landing
#   (nothing here duplicates existing content) and RENUMBERED per this
#   repo's standing rule: the other session's own PB numbers are
#   irrelevant to it, so PB-353 -> PB-560 here. See
#   shala-prototypes/batch10_nimrud_stack/README.md for the full
#   renumbering table, the WPDEngine cross-reference (this repo already
#   has real, tested Enbilulu/Phi_Enbi Rust code the source thread didn't
#   know about), and the external dependencies (GL-MAP-001, GL-EE-001,
#   PB-347) this tablet cites but that are not yet landed here.
#
# GUARDED BOUNDARY:
#   The Stack never creates, only judges. EEEngine and KAKIGISv4.0 are
#   explicitly NOT members (an idle court is scope-bleed wearing a
#   grand name) -- see GL-STK-001 Sec. 1.
#
# WHAT THIS PLAYBOOK DOES
#   PROVEs the six law clauses (C1-C7, L77-L82) are present in the
#   landed tablet and PROVEs the Sala court's four canonical
#   interactions + unborn refusal records render in the deployed HTML.
#   Deposits nothing new -- docs and Sala tab are committed directly
#   into docs/ and shala-prototypes/, this playbook is a pointer/
#   verification record, matching playbook_559's own precedent.
#
# Running this playbook = CSR-08 confirmation. Review -> --check -> live.
# =============================================================================

- name: "PB-560 | Seal the Nimrud Stack (GL-STK-001)"
  hosts: localhost
  connection: local
  become: false
  vars:
    repo_root: "{{ playbook_dir }}/.."
    tablet_file: "{{ repo_root }}/docs/09_observatory/GL-STK-001_Nimrud_Stack.md"
    court_file: "{{ repo_root }}/shala-prototypes/batch10_nimrud_stack/shala_nimrud_ee_court.html"

  tasks:

    - name: "0.1 | Confirm the tablet and the Sala court are landed"
      ansible.builtin.stat:
        path: "{{ item }}"
      register: land_stat
      loop:
        - "{{ tablet_file }}"
        - "{{ court_file }}"
      loop_control: { label: "{{ item }}" }

    - name: "FAIL | required file missing"
      ansible.builtin.fail:
        msg: "{{ item.item }} not found -- nothing to seal."
      loop: "{{ land_stat.results }}"
      loop_control: { label: "{{ item.item }}" }
      when: not item.stat.exists

    - name: "1.1 | PROVE L77-L81 -- the six law clauses are present in the tablet"
      ansible.builtin.shell: |
        set -e
        grep -q "Four Members, Four Verbs" "{{ tablet_file }}"
        grep -q "EEEngine (EnumaElishEngine) is NOT a member" "{{ tablet_file }}"
        grep -q "Born-Particles-Only" "{{ tablet_file }}"
        grep -q "Adapa + OntoGraph" "{{ tablet_file }}"
        grep -q "Frozen-Constants Clause" "{{ tablet_file }}"
        grep -q "No Self-Minted Negatives" "{{ tablet_file }}"
        grep -q "PCA never localizes" "{{ tablet_file }}"
        echo "PROVEN: C1 (four members, EE excluded), C2 (born-particles-only), C3 (Adapa+OntoGraph), C4/C5 (frozen constants, no self-minted negatives), C7 (PCA never localizes) all present"
      register: prove_clauses
      changed_when: false

    - name: "1.2 | PROVE L82 -- the Sala court renders OntoGraph as the shared spine and the three unborn refusal records"
      ansible.builtin.shell: |
        set -e
        grep -q "ONTOGRAPH" "{{ court_file }}"
        grep -qi "NEBUCHADNEZZAR" "{{ court_file }}"
        grep -qi "ENKIDO" "{{ court_file }}"
        grep -qi "TRAINED CLASSIFIER" "{{ court_file }}"
        echo "PROVEN: OntoGraph spine and all three unborn/refused stations (Nebuchadnezzar, Enkido, trained classifier) render in the deployed court"
      register: prove_court
      changed_when: false

    - name: "2.1 | Verify the WPDEngine cross-reference note landed"
      ansible.builtin.command: >-
        grep -c 'already has a real, tested'
        {{ repo_root }}/shala-prototypes/batch10_nimrud_stack/README.md
      register: wpd_check
      changed_when: false
      failed_when: wpd_check.stdout | int == 0

    - name: "3.1 | Report"
      ansible.builtin.debug:
        msg: >
          PB-560 complete. GL-STK-001 sealed: the Nimrud Stack's four
          members (WITNESS/JUDGE/MOVE/STAGE) own four non-overlapping
          verbs, EEEngine stands beside it as the creation-arc
          complement (not a member), OntoGraph is the shared spine
          named Adapa + OntoGraph in the sage register, frozen
          constants and no-self-minted-negatives hold the witness
          doctrine, and PCA is confined to early-warning and testimony,
          never localization. The Sala court (shala_nimrud_ee_court.html)
          renders both arcs meeting at OntoGraph with refusal records for
          Nebuchadnezzar, Enkido, and the trained classifier. Renumbered
          from the source session's PB-353; see
          shala-prototypes/batch10_nimrud_stack/README.md for the full
          renumbering table, the real crates/wpd-engine cross-reference,
          and the still-unlanded GL-MAP-001/GL-EE-001/PB-347 dependencies
          this tablet cites.
