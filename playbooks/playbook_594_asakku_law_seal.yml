# =============================================================================
# PB-594 — The Asakku Law: Concept Seal (GL-NER-001)
# BahyWay.Ecosystem v4.0 — 2026-08-23
#
# WHY THIS PLAYBOOK EXISTS
#   Seals GL-NER-001, the Transparent Anti-Virus doctrine of the
#   Nergal Court: sector sight names which sector is attacked and the
#   compromised extent as a witnessed field, never an enumeration
#   (§1); the Fragment Inquest pinpoints totally-corrupted data and
#   renders its NUZI backup verdict -- BACKUP-HELD or UNBACKED -- to
#   the steward, never withheld (§2); the Asakku Threshold halts and
#   seals DubSar Theater, DubSar PDM, and Girsu IDE the moment any VM's
#   infected density crosses 30%, liftable only by the steward and
#   only once the density has genuinely fallen -- the steward may
#   confirm the plague's passing, never overrule it (§3); and the
#   Disclosure Clause forbids any private ledger -- what Nergal knows,
#   the stakeholder sees (§4).
#
#   Landed from a standalone Architect-supplied upload (2026-08-23),
#   evaluated file-by-file against this repo before landing and
#   RENUMBERED per this repo's standing rule: the source deposit's own
#   PB-NER-001 -> PB-594 here. See
#   shala-prototypes/batch19_adannu_askuppu_kisru_asakku_epeshu/README.md
#   for the full renumbering table. Note the tablet's own header reads
#   "PROPOSED -> sealed by CSR-08" rather than "SEALED · APPEND-ONLY"
#   like its sibling tablets in this batch -- carried verbatim, not
#   normalized, per this repo's practice of landing a tablet's own
#   stated status rather than silently upgrading it.
#
# WHAT THIS PLAYBOOK DOES
#   PROVEs Sector Sight's witnessed-extent clause, the Fragment
#   Inquest's two backup verdicts, the Asakku Threshold's halt/lift
#   asymmetry, and the Disclosure Clause are all sealed verbatim.
#   PROVEs the Sala court (the Nergal AV Membrane v2) renders the VM
#   storage gauges at the 30% covenant and the workshop-seal state.
#   Deposits nothing new -- docs and Sala tab are committed directly
#   into docs/ and shala-prototypes/, this playbook is a
#   pointer/verification record.
#
# Running this playbook = CSR-08 confirmation. Review -> --check -> live.
# =============================================================================

- name: "PB-594 | Seal the Asakku Law (GL-NER-001)"
  hosts: localhost
  connection: local
  become: false
  vars:
    repo_root: "{{ playbook_dir }}/.."
    tablet_file: "{{ repo_root }}/docs/09_observatory/GL-NER-001_Asakku_Law.md"
    court_file: "{{ repo_root }}/shala-prototypes/batch19_adannu_askuppu_kisru_asakku_epeshu/sala_nergal_av_membrane.html"

  tasks:

    - name: "0.1 | Confirm the tablet and the Sala court are landed"
      ansible.builtin.stat:
        path: "{{ item }}"
      register: land_stat
      loop:
        - "{{ tablet_file }}"
        - "{{ court_file }}"
      loop_control: { label: "{{ item }}" }

    - name: "FAIL | required file missing"
      ansible.builtin.fail:
        msg: "{{ item.item }} not found -- nothing to seal."
      loop: "{{ land_stat.results }}"
      loop_control: { label: "{{ item.item }}" }
      when: not item.stat.exists

    - name: "1.1 | PROVE Sector Sight's witnessed-extent clause is sealed"
      ansible.builtin.shell: |
        set -e
        grep -qF "the EXTENT of compromised space within that sector, rendered as a" "{{ tablet_file }}"
        grep -qF "extent_q" "{{ tablet_file }}"
        echo "PROVEN: extent is a witnessed field, never an enumeration"
      register: prove_sight
      changed_when: false

    - name: "1.2 | PROVE the Fragment Inquest's two backup verdicts are sealed"
      ansible.builtin.shell: |
        set -e
        grep -qF "BACKUP-HELD" "{{ tablet_file }}"
        grep -qF "UNBACKED" "{{ tablet_file }}"
        grep -qF "No fragment verdict may be withheld from the steward" "{{ tablet_file }}"
        echo "PROVEN: the Fragment Inquest's backup verdicts are sealed"
      register: prove_inquest
      changed_when: false

    - name: "1.3 | PROVE the Asakku Threshold's halt/lift asymmetry is sealed"
      ansible.builtin.shell: |
        set -e
        grep -qF "SEAL ALL WORKING ENVIRONMENTS" "{{ tablet_file }}"
        grep -qF "DubSar Theater IDE, DubSar PDM IDE" "{{ tablet_file }}"
        grep -qF "steward may not overrule the plague, only confirm its passing" "{{ tablet_file }}"
        echo "PROVEN: the halt/lift asymmetry is sealed"
      register: prove_threshold
      changed_when: false

    - name: "1.4 | PROVE the Disclosure Clause is sealed"
      ansible.builtin.shell: |
        set -e
        grep -qF "The court does not possess a private ledger" "{{ tablet_file }}"
        grep -qF "What Nergal knows, the" "{{ tablet_file }}"
        echo "PROVEN: the Disclosure Clause is sealed"
      register: prove_disclosure
      changed_when: false

    - name: "1.5 | PROVE the Sala court renders the VM gauges and the ASAKKU halt"
      ansible.builtin.shell: |
        set -e
        grep -qF "VM STORAGE UNITS" "{{ court_file }}"
        grep -qF "COVENANT 30%" "{{ court_file }}"
        grep -qF "ASAKKU" "{{ court_file }}"
        echo "PROVEN: the Nergal AV Membrane renders the VM density gauges and the Asakku halt"
      register: prove_court
      changed_when: false

    - name: "2.1 | Report"
      ansible.builtin.debug:
        msg: >
          PB-594 complete. GL-NER-001 sealed: Nergal's court names the
          attacked sector and its extent as a witnessed field, renders
          every corrupted fragment's backup verdict to the steward,
          halts and seals the three IDEs the instant any VM crosses
          30% infected density, and holds no private ledger. Renumbered
          from the source deposit's PB-NER-001; see
          shala-prototypes/batch19_adannu_askuppu_kisru_asakku_epeshu/README.md
          for the full renumbering table.
