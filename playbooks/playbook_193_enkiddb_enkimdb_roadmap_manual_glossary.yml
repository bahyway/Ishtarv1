# =============================================================================
# PB-193 — EnkiDDB + EnkiMDB Roadmap, Manual, Glossary: the production
# Implementation-phase Basic Materials
# BahyWay.Ecosystem v4.0 — 2026-07-18
#
# CONTEXT: direct follow-up to PB-192. After the real Podman deployment
# playbook landed, the Architect's request had one part left: "new
# Roadmaps, Manuals, Glossaries that will be the basic Materials for the
# Implementations phase (production-level) to EnkiDDB & EnkiMDB as its
# basic Patterns." Three scoping questions were asked and answered before
# writing a word of content, since guessing wrong on production
# documentation structure wastes real effort:
#   1. Scope: EnkiDDB + EnkiMDB only (not a speculative 7-Type master doc).
#   2. Audience: engineers implementing/operating this Ecosystem --
#      production-runbook tone, same register as the existing
#      *_PODMAN_DEPLOYMENT.md docs, not an executive-summary layer.
#   3. Doc count: a separate Roadmap/Manual/Glossary set per system --
#      six files, not a shared pair.
#
# WHAT WAS WRITTEN, six real documents, every fact in them checked against
# real code/tests rather than invented:
#   - docs/EnkiDDB_ROADMAP.md  -- Phase 0 (COMPLETE, cites exactly what
#     PB-176-181/192 built), Phase 1 (durability -- enkidb-replication,
#     not wired in, honestly flagged), Phase 2 (a real gap found while
#     writing this: `WriteNode::ingest_directory_categorized` exists and
#     is tested at the library level, but nothing exposes it over the
#     wire or as a CLI -- not previously documented anywhere), Phase 3
#     (populate with this very Implementation-phase material), Phase 4
#     (ENLIL/HeptaScript v2.0, tracked as still blocked per
#     docs/OTAP_PIPELINE.md).
#   - docs/EnkiDDB_MANUAL.md -- deploy (points at PODMAN_DEPLOYMENT.md,
#     doesn't duplicate), ingest wire protocol, query/search with the
#     WHAT E[*] placeholder-hash gotcha restated, the categorization
#     taxonomy (`infer_collection`) traced through its real three-rule
#     precedence, and a troubleshooting table.
#   - docs/EnkiDDB_GLOSSARY.md -- foundational Ecosystem terms (KAKI,
#     Identity/Event-Kaki, EAV, Journal, Data Files, CQRS, epoch,
#     generation) plus EnkiDDB-specific ones (Tigris, DocOrbit,
#     meta.collection, Section, RagIndex, WriteNode/ReadNode,
#     FLUSH_EVERY/RELOAD_SECS, ADR-012) -- self-contained, no assumed
#     prior session context.
#   - docs/EnkiMDB_ROADMAP.md -- same phase structure, EnkiMDB-specific
#     gaps: no deduplication across re-scans (real, found while writing
#     this -- SCAN_CRATES/SCAN_PLAYBOOKS re-journal every artifact every
#     call), no scheduled refresh trigger, and an explicit open question
#     (not silently resolved) on whether documentation artifacts should
#     ever become a third ArtifactKind here or stay EnkiDDB's job, per
#     the Architect's own "code to EnkiMDB, documentation to EnkiDDB"
#     framing.
#   - docs/EnkiMDB_MANUAL.md -- deploy, the SCAN_CRATES/SCAN_PLAYBOOKS/
#     FLUSH protocol with the real PB-192 smoke-test numbers (151 crates,
#     88 playbooks, verified at that point in time) as a worked example,
#     query with the same WHAT E[*] caveat re-verified against EnkiMDB's
#     own real output, and a troubleshooting table.
#   - docs/EnkiMDB_GLOSSARY.md -- foundational terms restated (not just
#     cross-referenced, so this file stands alone) plus EnkiMDB-specific
#     ones (Euphrates, ArtifactProfile, ArtifactKind, scan_crates/
#     scan_playbooks, ArtifactEmitter, SCAN_CRATES/SCAN_PLAYBOOKS).
#
# VERIFIED WHILE WRITING (not just narrated): the crate count cited in
# both Roadmaps/Manuals (151) was re-checked against
# `ls workspace/bahyway_v4/crates/*/ | wc -l` at write time and matches
# exactly. The playbook count (88) is stated as the real PB-192 smoke-test
# result at the moment that scan ran, before this very playbook existed --
# framed as a point-in-time fact, not a claim about the current total.
#
# WHAT THIS IS NOT: these six documents are themselves EnkiDDB material --
# per `EnkiDDB_ROADMAP.md`'s own Phase 3, they are NOT YET ingested into a
# running EnkiDDB instance. No directory-ingest CLI exists yet (the exact
# gap Phase 2 names) to do that ingestion as one call; ingesting them
# today would mean six individual `<collection>\n<markdown>` calls against
# `enkiddb-write-server`, which this pass does not perform against any
# live deployment (there is no live deployment in this sandbox to ingest
# them into -- see PB-192's own verification-scope note).
#
# VERIFICATION: no Rust code changed in this pass (documentation only) --
#   `cargo build --workspace`/`cargo test --workspace` are unaffected from
#   PB-192's baseline (3481 passed, 0 failed).
# =============================================================================
