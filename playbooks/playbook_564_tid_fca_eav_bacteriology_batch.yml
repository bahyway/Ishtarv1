# =============================================================================
# PB-564 — Land the TID/FCA/EAV Unified Pattern batch (bacteriology worked example)
# BahyWay.Ecosystem v4.0 — 2026-08-20
#
# WHY THIS PLAYBOOK EXISTS
#   Registers shala-prototypes/batch11_tid_fca_eav_bacteriology/, landed
#   from a parallel Claude session's Fri20260814 thread: Metamodeling +
#   Formal Concept Analysis fed by an on-the-fly EAV schema, discovering
#   a "Unified Pattern" for any data domain -- demonstrated on a public
#   bacteriology dataset across nine successive Sala prototype
#   iterations (epsilon-filtration -> hierarchical zoom -> 3D Three.js
#   lattice -> hand-rolled 3D deep-zoom engine with no external graphics
#   dependency), plus an enhanced navigable evolution of the
#   already-landed sala-realm-map.html and a spatial-temporal-hypergraph
#   design thread (concept only, no code).
#
#   PURE REHEARSAL/RESEARCH MATERIAL -- no GL law tablet exists for this
#   batch (unlike batch9/PB-558 or batch10/PB-560..563) because the
#   source thread never proposed sealed doctrine, only exploratory Sala
#   prototypes and two research documents. This playbook is therefore a
#   plain landing/verification record, matching playbook_559's own
#   precedent, not a law seal.
#
# WHAT THIS PLAYBOOK DOES
#   PROVEs the full 16-file manifest is landed and spot-checks one
#   distinguishing content marker per prototype stage in the nine-file
#   HTML lineage, so a future reader can trust the batch is complete
#   without re-reading every file.
#
# Running this playbook = CSR-08 confirmation. Review -> --check -> live.
# =============================================================================

- name: "PB-564 | Land the TID/FCA/EAV Unified Pattern batch"
  hosts: localhost
  connection: local
  become: false
  vars:
    repo_root: "{{ playbook_dir }}/.."
    batch_dir: "{{ repo_root }}/shala-prototypes/batch11_tid_fca_eav_bacteriology"

  tasks:

    - name: "0.1 | Confirm the full 16-file manifest is landed"
      ansible.builtin.stat:
        path: "{{ batch_dir }}/{{ item }}"
      register: manifest_stat
      loop:
        - "00_Google_TID.md"
        - "01_Google_TID.md"
        - "02_Build_Nebuchadnezzar_Unified_Pattern.md"
        - "03_Gimini_All_Visualization_Techniques.md"
        - "microbiology_bacteriology_shapes.csv"
        - "sala_realm_map_navigable.html"
        - "shala_tab_tid_epsilon_filtration.html"
        - "shala_tab_tid_hierarchical_zoom.html"
        - "shala_tab_tid_3d_lattice_threejs.html"
        - "shala_tab_tid_colony_2tab.html"
        - "shala_tab_tid_colony_3tab_clinical_eav.html"
        - "shala_tab_tid_colony_v1_basic.html"
        - "shala_tab_tid_colony_v2_clinical_sankey.html"
        - "shala_tab_tid_colony_v3_birdfly.html"
        - "shala_tab_tid_colony_3d_deep_zoom.html"
        - "shala_tab_multiscale_technique_cards.html"
      loop_control: { label: "{{ item }}" }

    - name: "FAIL | manifest file missing"
      ansible.builtin.fail:
        msg: "{{ item.item }} not found under {{ batch_dir }} -- batch incomplete."
      loop: "{{ manifest_stat.results }}"
      loop_control: { label: "{{ item.item }}" }
      when: not item.stat.exists

    - name: "1.1 | PROVE the epsilon-filtration prototype carries live Vietoris-Rips math"
      ansible.builtin.shell: |
        set -e
        grep -q "Vietoris-Rips" "{{ batch_dir }}/shala_tab_tid_epsilon_filtration.html"
        grep -q "epsilon-range" "{{ batch_dir }}/shala_tab_tid_epsilon_filtration.html"
        echo "PROVEN: live epsilon-threshold slider driving the Vietoris-Rips filtration demo"
      register: prove_epsilon
      changed_when: false

    - name: "1.2 | PROVE the hierarchical-zoom prototype carries breadcrumb navigation"
      ansible.builtin.shell: |
        set -e
        grep -q "breadcrumb" "{{ batch_dir }}/shala_tab_tid_hierarchical_zoom.html"
        grep -q "navigationStack" "{{ batch_dir }}/shala_tab_tid_hierarchical_zoom.html"
        echo "PROVEN: breadcrumb-tracked hierarchical zoom-in/out present"
      register: prove_hierarchical
      changed_when: false

    - name: "1.3 | PROVE the Three.js lattice prototype actually uses OrbitControls (the documented bug's own dependency)"
      ansible.builtin.command: >-
        grep -c OrbitControls
        {{ batch_dir }}/shala_tab_tid_3d_lattice_threejs.html
      register: prove_threejs
      changed_when: false
      failed_when: prove_threejs.stdout | int == 0

    - name: "1.4 | PROVE the final deep-zoom prototype dropped Three.js in favour of a hand-rolled camera"
      ansible.builtin.shell: |
        set -e
        grep -q "3D Deep Zoom TDA" "{{ batch_dir }}/shala_tab_tid_colony_3d_deep_zoom.html"
        grep -q "virtualCamZ" "{{ batch_dir }}/shala_tab_tid_colony_3d_deep_zoom.html"
        ! grep -q "OrbitControls" "{{ batch_dir }}/shala_tab_tid_colony_3d_deep_zoom.html"
        echo "PROVEN: hand-rolled camera projection present, OrbitControls dependency absent -- the lineage's own documented fix"
      register: prove_deepzoom
      changed_when: false

    - name: "1.5 | PROVE the navigable realm map carries sub-process dive views"
      ansible.builtin.shell: |
        set -e
        grep -q "diveInto" "{{ batch_dir }}/sala_realm_map_navigable.html"
        grep -q "SUB\[" "{{ batch_dir }}/sala_realm_map_navigable.html"
        echo "PROVEN: breadcrumb + sub-process dive interaction present, extending the already-landed sala-realm-map.html"
      register: prove_realm
      changed_when: false

    - name: "1.6 | PROVE the formal-context CSV is the real seed dataset (13 lines: header + 12 observations)"
      ansible.builtin.command: "wc -l {{ batch_dir }}/microbiology_bacteriology_shapes.csv"
      register: prove_csv
      changed_when: false
      failed_when: (prove_csv.stdout.split()[0] | int) < 13

    - name: "2.1 | Report"
      ansible.builtin.debug:
        msg: >
          PB-564 complete. batch11_tid_fca_eav_bacteriology landed:
          sixteen files spanning the TID/FCA/EAV Unified Pattern thread
          -- two research documents (TID math, the spatial-temporal
          meta-hypergraph proposal), one technique survey, the real
          formal-context CSV, an enhanced navigable evolution of the
          already-landed Sala realm map, and nine successive prototype
          iterations proven to run the documented arc from a live
          epsilon-threshold Vietoris-Rips demo through a buggy Three.js
          lattice to the final hand-rolled 3D deep-zoom engine that
          dropped the external OrbitControls dependency entirely. Pure
          rehearsal/research material -- no GL law tablet, this is a
          landing record, not a seal.
