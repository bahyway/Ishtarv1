# =============================================================================
# PB-592 — The Askuppu Law: Concept Seal (GL-ALG-005)
# BahyWay.Ecosystem v4.0 — 2026-08-23
#
# WHY THIS PLAYBOOK EXISTS
#   Seals GL-ALG-005, importing the Marchenko-Pastur random-matrix
#   threshold (credited whole, Hubullu-honest) as the sole lawful gate
#   for admitting collective eigenmodes anywhere in the Ecosystem: the
#   threshold stone lambda+ = sigma^2(1+sqrt(q))^2, sealed before
#   decomposition -- moving it after seeing the eigenvalues is a
#   corruption event of the first rank. Derives Nalbanu's mold count K
#   as admitted-mode count rather than a chosen number, identifies the
#   largest mode with the Kinu nuisance field (estimation may pool,
#   verdicts may not), and adds COLLECTIVE-ONSET as the Event canon's
#   sixth member -- a new eigenvalue crossing the stone between Adannu
#   campaigns names a mechanism organizing itself before it opens.
#
#   Landed from a standalone Architect-supplied upload (2026-08-23),
#   evaluated file-by-file against this repo before landing and
#   RENUMBERED TWICE: the source deposit's own PB-ALG-003 -> PB-592
#   here (this repo's playbook sequence), AND the tablet's own
#   self-declared id GL-ALG-003 -> GL-ALG-005 (a genuine GL-tablet-id
#   collision this repo's own docs/09_observatory/ already held --
#   GL-ALG-003_Abubu_Calculus.md, the Membrane Rupture calculus,
#   landed in an earlier, unrelated batch). See
#   shala-prototypes/batch19_adannu_askuppu_kisru_asakku_epeshu/README.md
#   for the full renumbering table, why GL-ALG-005 rather than GL-ALG-003
#   was chosen, and exactly which strings inside the tablet, the Kisru
#   tablet, and the Epeshu Court were corrected to match (the internal
#   ALG3-PO-1..4 proof-obligation labels were deliberately left as
#   delivered -- they do not collide with anything and renumbering them
#   too would be over-editing a sealed corpus for cosmetic symmetry).
#   No Sala court accompanied this delivery (the Mode Court arrived
#   under earlier "files_Askuppu_Law" narrative references, not this
#   upload) -- this playbook proved the tablet alone at first, with the
#   court check to be added when one arrived. It has: four Mode Court
#   versions landed 2026-08-23 in
#   shala-prototypes/batch23_mode_court_arsenal_atlas_v2/, each with the
#   delivered GL-ALG-003 lawtag corrected to GL-ALG-005 to match this
#   tablet. Task 1.6 below proves the most complete of the four
#   (v4, the Witness Workbench edition) carries the Guarded Stone and
#   COLLECTIVE-ONSET claims verbatim.
#
# WHAT THIS PLAYBOOK DOES
#   PROVEs the tablet's own stated proof obligations (ALG3-PO-1
#   through ALG3-PO-4, witnessed at sealing per the tablet's own §9)
#   are named, and PROVEs the Threshold Stone, the Lawful-K clause, the
#   Common-Mode Clause, and COLLECTIVE-ONSET are sealed verbatim.
#   Deposits nothing new -- the tablet is committed directly into
#   docs/, this playbook is a pointer/verification record.
#
# Running this playbook = CSR-08 confirmation. Review -> --check -> live.
# =============================================================================

- name: "PB-592 | Seal the Askuppu Law (GL-ALG-005)"
  hosts: localhost
  connection: local
  become: false
  vars:
    repo_root: "{{ playbook_dir }}/.."
    tablet_file: "{{ repo_root }}/docs/09_observatory/GL-ALG-005_Askuppu_Law.md"
    court_file: "{{ repo_root }}/shala-prototypes/batch23_mode_court_arsenal_atlas_v2/sala_gl_alg_005_mode_court_v4.html"

  tasks:

    - name: "0.1 | Confirm the tablet and its court are landed"
      ansible.builtin.stat:
        path: "{{ item }}"
      register: land_stat
      loop:
        - "{{ tablet_file }}"
        - "{{ court_file }}"

    - name: "FAIL | required file missing"
      ansible.builtin.fail:
        msg: "{{ item.item }} not found -- nothing to seal."
      when: not item.stat.exists
      loop: "{{ land_stat.results }}"

    - name: "1.1 | PROVE the tablet's own proof obligations (ALG3-PO-1..4) are named"
      ansible.builtin.shell: |
        set -e
        grep -qF "ALG3-PO-1" "{{ tablet_file }}"
        grep -qF "ALG3-PO-2" "{{ tablet_file }}"
        grep -qF "ALG3-PO-3" "{{ tablet_file }}"
        grep -qF "ALG3-PO-4" "{{ tablet_file }}"
        echo "PROVEN: ALG3-PO-1..4 all present"
      register: prove_pos
      changed_when: false

    - name: "1.2 | PROVE the Threshold Stone formula and its inviolability are sealed"
      ansible.builtin.shell: |
        set -e
        grep -qF "λ₊ = σ² (1 + √q)²" "{{ tablet_file }}"
        grep -qF "is a corruption event of the first" "{{ tablet_file }}"
        echo "PROVEN: the Threshold Stone and its sealed-before-decomposition clause are sealed"
      register: prove_stone
      changed_when: false

    - name: "1.3 | PROVE the Lawful-K clause and the Common-Mode Clause are sealed"
      ansible.builtin.shell: |
        set -e
        grep -qF "K := the number of admitted modes" "{{ tablet_file }}"
        grep -qF "estimation may pool; verdicts may not" "{{ tablet_file }}"
        echo "PROVEN: derived K and the common-mode removal clause are sealed"
      register: prove_k
      changed_when: false

    - name: "1.4 | PROVE COLLECTIVE-ONSET is sealed as the sixth Event"
      ansible.builtin.shell: |
        set -e
        grep -qF "COLLECTIVE-ONSET" "{{ tablet_file }}"
        grep -qF "the crack assembling before it opens" "{{ tablet_file }}"
        grep -qF "distinguishes a structural mechanism from" "{{ tablet_file }}"
        echo "PROVEN: COLLECTIVE-ONSET and its structural-mechanism claim are sealed"
      register: prove_event
      changed_when: false

    - name: "1.5 | PROVE the two witnessed proof obligations are recorded witnessed at sealing"
      ansible.builtin.shell: |
        set -e
        grep -qF "Witnessed at sealing" "{{ tablet_file }}"
        grep -qF "no false admission" "{{ tablet_file }}"
        grep -qF "recovered 40/40" "{{ tablet_file }}"
        echo "PROVEN: PO-1 and PO-2 are recorded witnessed, not merely open, at sealing"
      register: prove_witnessed
      changed_when: false

    - name: "1.6 | PROVE the Mode Court renders the guarded stone and COLLECTIVE-ONSET"
      ansible.builtin.shell: |
        set -e
        grep -qF "GL-ALG-005" "{{ court_file }}"
        grep -qF "GUARDED STONE" "{{ court_file }}"
        grep -qF "COLLECTIVE-ONSET" "{{ court_file }}"
        grep -qF "MEASURED DEPENDENCIES" "{{ court_file }}"
        grep -qF "WITNESS WORKBENCH" "{{ court_file }}"
        echo "PROVEN: the Mode Court (v4, Witness Workbench) carries the guarded stone, COLLECTIVE-ONSET, and the measured-dependency Workbench"
      register: prove_court
      changed_when: false

    - name: "2.1 | Report"
      ansible.builtin.debug:
        msg: >
          PB-592 complete. GL-ALG-005 sealed (renumbered from the
          delivered GL-ALG-003, which collided with this repo's own
          already-landed GL-ALG-003_Abubu_Calculus.md): the
          Marchenko-Pastur threshold stone gates every eigenmode
          admission in the Ecosystem, K is derived rather than chosen,
          the common mode is removed as Kinu nuisance before Tribe
          analysis, and COLLECTIVE-ONSET joins the Event canon.
          Renumbered from the source deposit's PB-ALG-003; see
          shala-prototypes/batch19_adannu_askuppu_kisru_asakku_epeshu/README.md
          for the full renumbering table and the GL-tablet-id collision
          this batch caught. The Mode Court, missing at first sealing,
          landed 2026-08-23 in four versions (v1-v4) in
          shala-prototypes/batch23_mode_court_arsenal_atlas_v2/ -- see
          that batch's own README for the feature lineage; this
          playbook now proves the fullest version (v4) carries the
          guarded stone and COLLECTIVE-ONSET verbatim.
