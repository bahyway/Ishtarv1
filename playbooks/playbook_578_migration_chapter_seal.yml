# =============================================================================
# PB-578 — The Migration Chapter: Concept Seal (GL-LBR-001-A1)
# BahyWay.Ecosystem v4.0 — 2026-08-21
#
# WHY THIS PLAYBOOK EXISTS
#   Seals GL-LBR-001-A1, the Two Scribes Rite: kīma labīrīšu applied
#   to warehouse migration validation. The inversion at its heart --
#   migration validation fails when it verifies the scribe's hand
#   (unit-testing thousands of new procedures) instead of the tablet
#   produced (confronting outputs on sealed inputs). Four rites: seal
#   the input (frozen, Kidinnu-sealed snapshot, never asserted-same);
#   the Two Scribes (Merkle-hash outputs hierarchically, one root
#   comparison acquits thousands of procedures, mismatches drill to
#   diverging row-groups in O(log) comparisons); Pattern Inquest never
#   Procedure Inquest (FCA closure over divergence signatures collapses
#   thousands of failures into few concepts); Decree or Bug (every
#   intended difference is a pre-registered, signed W5H2 decree, or it
#   is a bug by definition -- no excavating Confluence/Jira to divine
#   intent after the fact).
#
#   Landed from a parallel Claude session's Sun20260816 thread,
#   evaluated file-by-file against this repo before landing and
#   RENUMBERED per this repo's standing rule: the other session's own
#   PB-339 -> PB-578 here. This repo's own existing PB-339
#   (`playbook_339_parzu_case_particle.yml`) is an unrelated concept --
#   the collision confirms the source session's numbering carries no
#   meaning here. See
#   shala-prototypes/batch13_sunday_shape_labiru_courts/README.md for
#   the full renumbering table. No dedicated Sala rehearsal was
#   delivered for this amendment.
#
# WHAT THIS PLAYBOOK DOES
#   PROVEs the tablet's own five stated law tests (L32-L36) are named,
#   and PROVEs the four rites and the three-way per-procedure colophon
#   are sealed verbatim. Deposits nothing new -- the tablet is
#   committed directly into docs/, this playbook is a pointer/
#   verification record.
#
# Running this playbook = CSR-08 confirmation. Review -> --check -> live.
# =============================================================================

- name: "PB-578 | Seal the Migration Chapter (GL-LBR-001-A1)"
  hosts: localhost
  connection: local
  become: false
  vars:
    repo_root: "{{ playbook_dir }}/.."
    tablet_file: "{{ repo_root }}/docs/09_observatory/GL-LBR-001-A1_Migration_Chapter.md"
    base_tablet: "{{ repo_root }}/docs/09_observatory/GL-LBR-001_Labiru_Doctrine.md"

  tasks:

    - name: "0.1 | Confirm this amendment and the base Labīru tablet it amends are both landed"
      ansible.builtin.stat:
        path: "{{ item }}"
      register: land_stat
      loop:
        - "{{ tablet_file }}"
        - "{{ base_tablet }}"
      loop_control: { label: "{{ item }}" }

    - name: "FAIL | required file missing"
      ansible.builtin.fail:
        msg: "{{ item.item }} not found -- nothing to seal."
      loop: "{{ land_stat.results }}"
      loop_control: { label: "{{ item.item }}" }
      when: not item.stat.exists

    - name: "1.1 | PROVE the tablet's own law tests L32-L36 are named"
      ansible.builtin.shell: |
        set -e
        grep -qF "Law tests **L32–L36**" "{{ tablet_file }}"
        echo "PROVEN: L32-L36 named as the kernel's law test range"
      register: prove_law_tests
      changed_when: false

    - name: "1.2 | PROVE the four rites are sealed"
      ansible.builtin.shell: |
        set -e
        grep -qF "Rite I — Seal the Input" "{{ tablet_file }}"
        grep -qF "Rite II — The Two Scribes" "{{ tablet_file }}"
        grep -qF "Rite III — Pattern Inquest, never Procedure Inquest" "{{ tablet_file }}"
        grep -qF "Rite IV — Decree or Bug" "{{ tablet_file }}"
        grep -qF "the legacy system is the labīru" "{{ tablet_file }}"
        echo "PROVEN: all four rites present, the inversion (legacy system is the labīru) sealed"
      register: prove_rites
      changed_when: false

    - name: "1.3 | PROVE the Merkle drill and the decree-or-bug clause are sealed"
      ansible.builtin.shell: |
        set -e
        grep -qF "row-group → partition → table → warehouse root" "{{ tablet_file }}"
        grep -qF "a mismatch drills to the diverging row-groups in O(log) comparisons" "{{ tablet_file }}"
        grep -qF "undecreed divergence is a bug by definition" "{{ tablet_file }}"
        grep -qF "\"diverge here; the labīru carries the defect\"" "{{ tablet_file }}"
        echo "PROVEN: the Merkle hierarchical drill and the decree-or-bug clause (with the bug-compatibility escape) are sealed"
      register: prove_merkle
      changed_when: false

    - name: "1.4 | PROVE the three-way per-procedure colophon is sealed"
      ansible.builtin.shell: |
        set -e
        grep -qF "CONCORD" "{{ tablet_file }}"
        grep -qF "LAWFUL EVOLUTION" "{{ tablet_file }}"
        grep -qF "SILENT DRIFT" "{{ tablet_file }}"
        grep -qF "migration RIGMU" "{{ tablet_file }}"
        echo "PROVEN: the CONCORD/LAWFUL EVOLUTION/SILENT DRIFT-as-migration-RIGMU colophon is sealed"
      register: prove_colophon
      changed_when: false

    - name: "2.1 | Report"
      ansible.builtin.debug:
        msg: >
          PB-578 complete. GL-LBR-001-A1 sealed: the inversion (verify
          the tablet produced, not the scribe's hand), the four rites
          (seal the input / the Two Scribes Merkle confrontation with
          O(log) drill / pattern inquest via FCA closure over
          divergence signatures / decree-or-bug with the Book Court
          Semantic Gate pre-drafting candidates), and the three-way
          per-procedure colophon (CONCORD / LAWFUL EVOLUTION / SILENT
          DRIFT as a migration RIGMU) all hold, proven against the
          tablet's own named law tests L32-L36. Renumbered from the
          source session's PB-339 (this repo's own existing PB-339 is
          an unrelated concept, confirming the collision); see
          shala-prototypes/batch13_sunday_shape_labiru_courts/README.md
          for the full renumbering table.
