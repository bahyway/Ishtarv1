# =============================================================================
# PB-559 — Register the Šala Hub as the library's front door: rehearsal AND
# learning tool. BahyWay.Ecosystem v4.0 — 2026-08-20
#
# WHY THIS PLAYBOOK EXISTS
#   shala_hub_index.html landed silently as part of the original Phase 2
#   batch2 corpus and was indexed as a throwaway "tab hub/index shell" —
#   which undersold what it actually is: a canvas-animated, 7-act
#   cinematic argument (usual-way dashboards -> living orbits ->
#   proof-before-existence -> append-only truth -> one-cause-one-ticket ->
#   drift-seen-by-topology -> APSU) that teaches the ecosystem's sealed
#   laws by showing the same particle field morph under each one, then
#   opens an "Enter the Observatory" gate into the MARDUK and PDM tabs.
#   That makes it the first Šala artifact built explicitly for TEACHING,
#   not just rehearsal-before-sealing (Way-of-Work rule 5 stays intact —
#   this doesn't touch production surfaces, it's still Šala/HTML) — the
#   concrete realization of the BahyWayAcademy insight already landed at
#   shala-prototypes/batch9_eridu_scaffold/04_BahyWayAcademy.md ("rehearsal
#   and pedagogy are the same act"). This playbook is the numbered record
#   of that re-reading, per this repo's own "every correction is a
#   numbered playbook" discipline (see playbook_555's precedent).
#
# WHAT THIS PLAYBOOK DOES
#   1. Verifies shala_hub_index.html is landed where it should be
#      (shala-prototypes/batch2_pdm_orbit_selection/) and PROVES the
#      claimed teaching content is actually present in the file, not
#      assumed from description alone.
#   2. Verifies the two documentation corrections this re-reading
#      required are in place: the corrected INDEX.md entry (was a
#      one-line dismissal, now describes what the Hub actually does) and
#      the new SHALA-DESIGN-CHARTER.md Sec. 1a (Šala's second purpose).
#   3. Verifies the Hub's two gate links actually resolve to real,
#      landed sibling files (a dead link on the library's own front door
#      would be a bad first teaching moment).
#   4. Does NOT relocate shala_hub_index.html to a repo-wide top-level
#      path — its "Enter the Observatory" links are relative to its own
#      directory, and this repo has already learned once (EriduScaffold
#      landing, this session) that moving a Šala HTML file breaks its
#      sibling links when file:// paths and relative hrefs are involved.
#      It is registered in place; INDEX.md and this playbook are the
#      pointer to it, the same pattern the batch9/Arsenal Hub uses.
#
# Running this playbook = CSR-08 confirmation. Review -> --check -> live.
# =============================================================================

- name: "PB-559 | Register the Šala Hub as the library's front door"
  hosts: localhost
  connection: local
  become: false
  vars:
    repo_root: "{{ playbook_dir }}/.."
    hub_dir: "{{ repo_root }}/shala-prototypes/batch2_pdm_orbit_selection"
    hub_file: "{{ hub_dir }}/shala_hub_index.html"
    index_file: "{{ repo_root }}/shala-prototypes/INDEX.md"
    charter_file: "{{ repo_root }}/shala-prototypes/SHALA-DESIGN-CHARTER.md"

  tasks:

    - name: "0.1 | Confirm the Hub file is landed"
      ansible.builtin.stat:
        path: "{{ hub_file }}"
      register: hub_stat

    - name: "FAIL | Hub file missing"
      ansible.builtin.fail:
        msg: "{{ hub_file }} not found -- nothing to register."
      when: not hub_stat.stat.exists

    - name: "1.1 | PROVE the Hub is a teaching argument, not a bare tab shell"
      ansible.builtin.shell: |
        set -e
        grep -q "The usual way" "{{ hub_file }}"
        grep -q "APSU" "{{ hub_file }}"
        grep -q "Enter the Observatory" "{{ hub_file }}"
        grep -q "one cause, one ticket" "{{ hub_file }}"
        grep -q "ArrowRight" "{{ hub_file }}"
        echo "PROVEN: 7-act argument, APSU close, keyboard nav, and the Observatory gate are all present in the deployed file"
      register: prove_hub
      changed_when: false

    - name: "1.2 | PROVE the Hub's two gate links resolve to real landed files"
      ansible.builtin.stat:
        path: "{{ hub_dir }}/{{ item }}"
      register: gate_targets
      loop:
        - shala_tab_marduk_datamine_v6.html
        - shala_tab_pdm_modeler_v4.html
      loop_control: { label: "{{ item }}" }

    - name: "FAIL | a Hub gate card links to a file that isn't landed"
      ansible.builtin.fail:
        msg: "{{ item.item }} not found beside the Hub -- the Observatory gate would 404 on its own front door."
      loop: "{{ gate_targets.results }}"
      loop_control: { label: "{{ item.item }}" }
      when: not item.stat.exists

    - name: "2.1 | Verify INDEX.md carries the corrected Hub description"
      ansible.builtin.command: "grep -c 'front door of the whole' {{ index_file }}"
      register: index_check
      changed_when: false
      failed_when: index_check.stdout | int == 0

    - name: "2.2 | Verify the charter carries Sec. 1a (Šala's second purpose)"
      ansible.builtin.command: "grep -c 'Šala.s second purpose' {{ charter_file }}"
      register: charter_check
      changed_when: false
      failed_when: charter_check.stdout | int == 0

    - name: "3.1 | Report"
      ansible.builtin.debug:
        msg: >
          PB-559 complete. shala_hub_index.html is confirmed as the Šala
          library's front door: a 7-act cinematic argument teaching the
          ecosystem's sealed laws (living particles, proof-before-existence,
          append-only truth, one-cause-one-ticket, drift-seen-by-topology,
          APSU) before gating into MARDUK and PDM. Both gate links resolve.
          INDEX.md and SHALA-DESIGN-CHARTER.md Sec. 1a document Šala's
          second purpose -- rehearsal AND teaching, per the BahyWayAcademy
          insight -- without loosening Way-of-Work rule 5 (production
          truth still renders on DubSar egui/WGPU, never HTML). No file
          moved; the Hub's own relative links stay intact where they live.
