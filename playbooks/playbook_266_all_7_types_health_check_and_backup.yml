# =============================================================================
# PB-266 — All 7 EnkiDB Types: fleet health check + timestamped volume backup
# BahyWay.Ecosystem v4.0 — 2026-07-29
#
# WHY THIS EXISTS: PB-203 built the real, hard-won health-check + backup
# pattern (podman-unshare staging to dodge rootless-Podman's subuid remap,
# fresh-subdir-under-plain-parent to dodge the "tar: .: Permission denied"
# trap, fetch-back-to-control-node consolidation, age-based pruning) for
# EnkiDDB + EnkiMDB only. This playbook is that exact same pattern, not a
# new one, extended to cover all 7 EnkiDB Types' real containers/volumes/
# ports -- part of "Today's Build Steps" (step 4: "Let Backups bee for all
# 7Types EnkiDB Databases").
#
# REAL TOPOLOGY THIS PLAYBOOK BACKS UP (verified against source before
# writing this playbook -- not guessed):
#   - EnkiDB   (core, Golden Store) : write=enkidb-write@7011   read=enkidb-read@7001
#   - EnkiDW   (data warehouse)     : write=enkidw-write@7012   read=enkidw-read@7002
#   - EnkiSDB  (staging)            : write=enkisdb-write@7013  read=enkisdb-read@7003
#   - EnkiODB  (operational)        : write=SHARED (below)      read=enkiodb-read@7004
#   - EnkiQDB  (quarantine)         : write=SHARED (below)      read=enkiqdb-read@7005
#   - EnkiMDB  (metadata)           : write=enkimdb-write@7201  read=enkimdb-read@7202
#   - EnkiDDB  (documentation)      : write=enkiddb-write@7101  read=enkiddb-read@7102
#
# EnkiODB and EnkiQDB have NO dedicated write-server binary or container --
# this was investigated, not assumed. `enkisdb-write-server` is ONE process
# that owns all three write-side stages (EnkiSDB, EnkiODB, EnkiQDB), per
# playbook_222's own header: "`OdbStore::drain_from_sdb`, `QdbStore::
# drain_from_sdb` take `&SdbStore` by reference, an in-process design
# already baked into those crates" -- confirmed live in
# `workspace/bahyway_v4/bin/enkisdb-write-server/src/main.rs` (imports
# `enkiodb::OdbStore` and `enkiqdb::QdbStore` directly) and in PB-222's own
# deploy task (`enkisdb-write` container mounts THREE volumes:
# enkisdb-write-data, enkiodb-write-data, enkiqdb-write-data). So this
# playbook health-checks 12 distinct containers (5 write + 7 read) but
# backs up 15 distinct volumes (8 write-side + 7 read-side) -- EnkiODB and
# EnkiQDB each contribute one write-side volume with no matching
# write-side container of their own.
#
# EnkiDW is the one Type with TWO write-side volumes: `enkidw-write-data`
# (DATA_DIR, `/data/dw`, the same `current/entities.data` materialization
# shape every other Type uses) and `enkidw-persist-data`
# (`enkidb_persist::PersistedDb`'s own on-disk journal at `PERSIST_DIR`,
# `/data/dw/persist` -- a different on-disk layout, confirmed via
# `bin/enkidw-write-server/src/main.rs`'s own `persist_dir()`/`data_dir()`
# split). Both are backed up; only the DATA_DIR-shaped ones are checked
# for `current/entities.data` before backup (`materialization_check:
# true/false` per volume below) -- asserting a file-layout expectation on
# `enkidw-persist-data` that was never verified would be exactly the kind
# of guess this playbook's own honesty standard forbids.
#
# All 14 DATA_DIR-shaped read/write servers confirmed (grep, before
# writing this playbook) to share the identical `current/entities.data`
# materialization path: enkidb, enkidw, enkisdb, enkiodb, enkiqdb, enkimdb,
# enkiddb, both write- and read-side.
#
# HONEST SCOPE (same limitation PB-203 already documented, unchanged):
# this backs up MATERIALIZED Data Files (and, on write nodes, whatever the
# in-memory Journal/EtlPipeline has flushed so far) -- it does not and
# cannot back up unflushed in-memory state. Restoring from one of these
# archives recovers to "as of the last FLUSH before this backup ran," not
# to the exact moment of a crash. A dedicated restore-and-verify playbook
# (proving these archives actually restore, not just exist) is separate,
# deliberately-scoped follow-on work, not folded into this one.
#
# USAGE:
#   ansible-playbook playbooks/playbook_266_all_7_types_health_check_and_backup.yml \
#     -i ansible/inventory.ini
#   # override backup location/retention if wanted:
#   # -e backup_root=/mnt/backups -e backup_retain_days=14
#
# Same crontab-friendly, no-self-scheduling convention as PB-203.
# =============================================================================
---
- name: "PB-266 | All 7 EnkiDB Types -- fleet health check + backup"
  hosts: localhost
  connection: local
  become: false
  vars:
    backup_root: "{{ ansible_env.HOME }}/dbaas_backups"
    backup_retain_days: 7
    enkidb_write_host: "enkidb-node-write"
    enkidb_read_host: "enkidb-node-read"
    enkidb_write_ip: "192.168.122.101"
    enkidb_read_ip: "192.168.122.107"

    fleet_containers:
      # -- write side (5 real containers; EnkiODB/EnkiQDB share enkisdb-write) --
      - { name: enkidb-write,  host: "{{ enkidb_write_host }}", ip: "{{ enkidb_write_ip }}", port: 7011 }
      - { name: enkidw-write,  host: "{{ enkidb_write_host }}", ip: "{{ enkidb_write_ip }}", port: 7012 }
      - { name: enkisdb-write, host: "{{ enkidb_write_host }}", ip: "{{ enkidb_write_ip }}", port: 7013 }
      - { name: enkimdb-write, host: "{{ enkidb_write_host }}", ip: "{{ enkidb_write_ip }}", port: 7201 }
      - { name: enkiddb-write, host: "{{ enkidb_write_host }}", ip: "{{ enkidb_write_ip }}", port: 7101 }
      # -- read side (7 real containers, one per Type) --
      - { name: enkidb-read,   host: "{{ enkidb_read_host }}",  ip: "{{ enkidb_read_ip }}",  port: 7001 }
      - { name: enkidw-read,   host: "{{ enkidb_read_host }}",  ip: "{{ enkidb_read_ip }}",  port: 7002 }
      - { name: enkisdb-read,  host: "{{ enkidb_read_host }}",  ip: "{{ enkidb_read_ip }}",  port: 7003 }
      - { name: enkiodb-read,  host: "{{ enkidb_read_host }}",  ip: "{{ enkidb_read_ip }}",  port: 7004 }
      - { name: enkiqdb-read,  host: "{{ enkidb_read_host }}",  ip: "{{ enkidb_read_ip }}",  port: 7005 }
      - { name: enkimdb-read,  host: "{{ enkidb_read_host }}",  ip: "{{ enkidb_read_ip }}",  port: 7202 }
      - { name: enkiddb-read,  host: "{{ enkidb_read_host }}",  ip: "{{ enkidb_read_ip }}",  port: 7102 }

    fleet_volumes:
      # -- write side (8 volumes -- EnkiDW contributes 2, EnkiODB/EnkiQDB contribute
      #    1 each with no matching write-side container of their own) --
      - { name: enkidb-write-data,   host: "{{ enkidb_write_host }}", materialization_check: true }
      - { name: enkidw-write-data,   host: "{{ enkidb_write_host }}", materialization_check: true }
      - { name: enkidw-persist-data, host: "{{ enkidb_write_host }}", materialization_check: false }
      - { name: enkisdb-write-data,  host: "{{ enkidb_write_host }}", materialization_check: true }
      - { name: enkiodb-write-data,  host: "{{ enkidb_write_host }}", materialization_check: true }
      - { name: enkiqdb-write-data,  host: "{{ enkidb_write_host }}", materialization_check: true }
      - { name: enkimdb-write-data,  host: "{{ enkidb_write_host }}", materialization_check: true }
      - { name: enkiddb-write-data,  host: "{{ enkidb_write_host }}", materialization_check: true }
      # -- read side (7 volumes, one per Type) --
      - { name: enkidb-read-data,   host: "{{ enkidb_read_host }}", materialization_check: true }
      - { name: enkidw-read-data,   host: "{{ enkidb_read_host }}", materialization_check: true }
      - { name: enkisdb-read-data,  host: "{{ enkidb_read_host }}", materialization_check: true }
      - { name: enkiodb-read-data,  host: "{{ enkidb_read_host }}", materialization_check: true }
      - { name: enkiqdb-read-data,  host: "{{ enkidb_read_host }}", materialization_check: true }
      - { name: enkimdb-read-data,  host: "{{ enkidb_read_host }}", materialization_check: true }
      - { name: enkiddb-read-data,  host: "{{ enkidb_read_host }}", materialization_check: true }

  tasks:
    # ── 1. Health check ─────────────────────────────────────────────
    - name: "1.1 | Check container statuses on the real host each one runs on"
      ansible.builtin.command: "podman ps --filter name=^{{ item.name }}$ --format '{{ '{{' }}.Names{{ '}}' }}: {{ '{{' }}.Status{{ '}}' }}'"
      register: container_status
      changed_when: false
      delegate_to: "{{ item.host }}"
      loop: "{{ fleet_containers }}"
      loop_control:
        label: "{{ item.name }} @ {{ item.host }}"

    - name: "1.2 | Report every container's status"
      ansible.builtin.debug:
        msg: "{{ item.stdout if item.stdout | length > 0 else item.item.name + ' @ ' + item.item.host + ': NOT RUNNING' }}"
      loop: "{{ container_status.results }}"
      loop_control:
        label: "{{ item.item.name }}"

    - name: "1.3 | Fail loudly if any container isn't running"
      ansible.builtin.fail:
        msg: "{{ item.item.name }} is not running on {{ item.item.host }} (podman ps returned no match)."
      when: item.stdout | length == 0
      loop: "{{ container_status.results }}"
      loop_control:
        label: "{{ item.item.name }}"

    - name: "1.4 | Confirm all 12 real ports accept connections on their real host IPs"
      ansible.builtin.wait_for:
        host: "{{ item.ip }}"
        port: "{{ item.port }}"
        timeout: 10
      loop: "{{ fleet_containers }}"
      loop_control:
        label: "{{ item.name }} -> {{ item.ip }}:{{ item.port }}"

    - name: "1.5 | Resolve each real volume's host mountpoint"
      ansible.builtin.command: "podman volume inspect {{ item.name }} --format '{{ '{{' }}.Mountpoint{{ '}}' }}'"
      register: volume_mountpoints
      changed_when: false
      delegate_to: "{{ item.host }}"
      loop: "{{ fleet_volumes }}"
      loop_control:
        label: "{{ item.name }} @ {{ item.host }}"

    # Same PB-203.3 fix, same reason: rootless Podman's subuid remap makes
    # the volume's real content unreadable to the plain login user, so the
    # existence check has to run inside `podman unshare`. Only asserted for
    # volumes flagged `materialization_check: true` above -- `enkidw-persist-data`
    # is deliberately skipped rather than guessing its file layout matches.
    - name: "1.6 | Check for materialized Data Files under each DATA_DIR-shaped volume (podman unshare)"
      ansible.builtin.shell: >
        podman unshare test -f "{{ item.1.stdout }}/current/entities.data" && echo EXISTS || echo MISSING
      register: data_file_check
      changed_when: false
      delegate_to: "{{ item.1.item.host }}"
      loop: "{{ fleet_volumes | zip(volume_mountpoints.results) | list }}"
      loop_control:
        label: "{{ item.0.name }}"
      when: item.0.materialization_check

    - name: "1.7 | Report which nodes have real materialized data vs are still empty"
      ansible.builtin.debug:
        msg: >-
          {{ item.item.1.item.name }}:
          {{ 'has materialized Data Files' if 'EXISTS' in item.stdout
             else 'NOT YET MATERIALIZED (no current/entities.data -- run FLUSH or INGEST_DIR first)' }}
      loop: "{{ data_file_check.results }}"
      loop_control:
        label: "{{ item.item.1.item.name }}"
      when: item.item.0.materialization_check

    - name: "1.8 | Note the one volume deliberately skipped by the materialization check"
      ansible.builtin.debug:
        msg: >-
          enkidw-persist-data: skipped materialization check (PersistedDb's own
          on-disk journal layout under PERSIST_DIR, not the current/entities.data
          shape the other 14 volumes use) -- backed up regardless, below.

    # ── 2. Backup ────────────────────────────────────────────────────
    - name: "2.1 | Ensure backup destination exists on the control node"
      ansible.builtin.file:
        path: "{{ backup_root }}"
        state: directory
        mode: '0700'

    # Same PB-203.4 shape: never merge into a pre-existing dir. `podman
    # unshare cp -a` creates the "current" subdirectory FRESH under a plain
    # parent so the copy is owned by an identity that maps back to the real
    # login user, and ordinary `tar` only ever names that fresh subdirectory
    # explicitly -- it never `stat`s "." on anything `podman unshare` touched.
    - name: "2.2 | Stage each volume's content out via podman unshare (plain-owned copy, PB-213/258 shape)"
      ansible.builtin.shell: |
        set -euo pipefail
        podman unshare rm -rf /tmp/{{ item.item.name }}-backup-staging
        mkdir -p /tmp/{{ item.item.name }}-backup-staging
        podman unshare cp -a {{ item.stdout }}/current /tmp/{{ item.item.name }}-backup-staging/current
      delegate_to: "{{ item.item.host }}"
      loop: "{{ volume_mountpoints.results }}"
      loop_control:
        label: "{{ item.item.name }}"
      changed_when: true

    - name: "2.3 | Snapshot the staged (plain-owned) copy as a timestamped tarball"
      ansible.builtin.command: >
        tar czf /tmp/{{ item.item.name }}_{{ ansible_date_time.iso8601_basic_short }}.tar.gz
        -C /tmp/{{ item.item.name }}-backup-staging current
      delegate_to: "{{ item.item.host }}"
      loop: "{{ volume_mountpoints.results }}"
      loop_control:
        label: "{{ item.item.name }}"
      changed_when: true

    - name: "2.4 | Fetch each tarball back to backup_root on the control node"
      ansible.builtin.fetch:
        src: "/tmp/{{ item.item.name }}_{{ ansible_date_time.iso8601_basic_short }}.tar.gz"
        dest: "{{ backup_root }}/{{ item.item.name }}_{{ ansible_date_time.iso8601_basic_short }}.tar.gz"
        flat: true
      delegate_to: "{{ item.item.host }}"
      loop: "{{ volume_mountpoints.results }}"
      loop_control:
        label: "{{ item.item.name }}"

    - name: "2.5 | Clean up the remote staging dir and tarball now that it's been fetched"
      ansible.builtin.shell: |
        podman unshare rm -rf /tmp/{{ item.item.name }}-backup-staging
        rm -f /tmp/{{ item.item.name }}_{{ ansible_date_time.iso8601_basic_short }}.tar.gz
      delegate_to: "{{ item.item.host }}"
      loop: "{{ volume_mountpoints.results }}"
      loop_control:
        label: "{{ item.item.name }}"
      changed_when: true

    - name: "2.6 | Find backup archives past the retention window"
      ansible.builtin.find:
        paths: "{{ backup_root }}"
        age: "{{ backup_retain_days }}d"
        patterns: "*.tar.gz"
      register: aged_backups

    - name: "2.7 | Prune expired backup archives"
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ aged_backups.files }}"
      loop_control:
        label: "{{ item.path }}"

    - name: "2.8 | Report backup summary"
      ansible.builtin.debug:
        msg: >-
          Backed up {{ fleet_volumes | length }} volumes (all 7 EnkiDB Types,
          write + read side) to {{ backup_root }};
          pruned {{ aged_backups.files | length }} archive(s) older than {{ backup_retain_days }} day(s).
