# =============================================================================
# PB-581 — The Kīnu Network Amendment: Concept Seal (GL-HSI-001-A5)
# BahyWay.Ecosystem v4.0 — 2026-08-23
#
# WHY THIS PLAYBOOK EXISTS
#   Seals GL-HSI-001-A5, the fifth amendment to the Nanshe Hyperspectral
#   Court: pixels/particles are admitted to the Kīnu Network only by
#   demonstrated temporal stability over a declared epoch floor; the
#   nuisance field (illumination drift, atmosphere, view geometry) is
#   estimated on the Kīnu Network only and removed from all particles;
#   Tribes are admitted by a formal homogeneity verdict on full spectral
#   histories, never by clustering convenience; a Tribe's squeezed
#   signature is classed DERIVED (GL-NIM-001), never MEASURED. Seals
#   the structural axiom "Estimation may pool; verdicts may not" and
#   charters the PSI+HSI two-witness fusion toward Nimrud.
#
#   Landed from a standalone Architect-supplied upload (2026-08-23),
#   evaluated file-by-file against this repo before landing and
#   RENUMBERED per this repo's standing rule: the source deposit's own
#   PB-HSI-005 -> PB-581 here. See
#   shala-prototypes/batch15_alaa_kinu_kulla_harvest/README.md for the
#   full renumbering table and the open dependency-gap note (this
#   amendment's own parents, GL-HSI-001 and amendments A1-A4, sit only
#   in docs/wed20260819-incoming/ in this repo, not yet in
#   docs/09_observatory/).
#
# WHAT THIS PLAYBOOK DOES
#   PROVEs the Kīnu Network Selection Law (S2), Nuisance Field Removal
#   through the network (S3), Tribe Admission by homogeneity verdict
#   (S4), the Squeeze as DERIVED estimation (S5), and the
#   Estimation-Verdict structural axiom (S6) are all sealed verbatim.
#   PROVEs the Sala court renders epoch witnessing, Kīnu selection,
#   nuisance removal, and Tribe admission as its four acts. Deposits
#   nothing new -- docs and Sala tab are committed directly into docs/
#   and shala-prototypes/, this playbook is a pointer/verification
#   record.
#
# Running this playbook = CSR-08 confirmation. Review -> --check -> live.
# =============================================================================

- name: "PB-581 | Seal the Kīnu Network Amendment (GL-HSI-001-A5)"
  hosts: localhost
  connection: local
  become: false
  vars:
    repo_root: "{{ playbook_dir }}/.."
    tablet_file: "{{ repo_root }}/docs/09_observatory/GL-HSI-001-A5_Kinu_Network_Amendment.md"
    court_file: "{{ repo_root }}/shala-prototypes/batch15_alaa_kinu_kulla_harvest/sala_gl_hsi_001_a5_kinu_network.html"

  tasks:

    - name: "0.1 | Confirm the tablet and the Sala court are landed"
      ansible.builtin.stat:
        path: "{{ item }}"
      register: land_stat
      loop:
        - "{{ tablet_file }}"
        - "{{ court_file }}"
      loop_control: { label: "{{ item }}" }

    - name: "FAIL | required file missing"
      ansible.builtin.fail:
        msg: "{{ item.item }} not found -- nothing to seal."
      loop: "{{ land_stat.results }}"
      loop_control: { label: "{{ item.item }}" }
      when: not item.stat.exists

    - name: "1.1 | PROVE the Kīnu Network Selection Law is sealed"
      ansible.builtin.shell: |
        set -e
        grep -qF "admitted to the" "{{ tablet_file }}"
        grep -qF "Kīnu Network" "{{ tablet_file }}"
        grep -qF "demonstrated temporal stability" "{{ tablet_file }}"
        grep -qF "a Kīnu that drifts is demoted by the same" "{{ tablet_file }}"
        echo "PROVEN: Kīnu admission by demonstrated stability, and drift demotion, are sealed"
      register: prove_selection
      changed_when: false

    - name: "1.2 | PROVE nuisance removal is sealed as network-only"
      ansible.builtin.shell: |
        set -e
        grep -qF "field is estimated **on the Kīnu Network only**" "{{ tablet_file }}"
        grep -qF "removal that is not journaled is a mutation" "{{ tablet_file }}"
        echo "PROVEN: nuisance removal is sealed as Kīnu-only and journaled"
      register: prove_nuisance
      changed_when: false

    - name: "1.3 | PROVE Tribe admission by homogeneity verdict is sealed"
      ansible.builtin.shell: |
        set -e
        grep -qF "siblings in Belonging" "{{ tablet_file }}"
        grep -qF "a Tribe formed without the test is a crowd" "{{ tablet_file }}"
        echo "PROVEN: Tribe admission is sealed as a discrete, refusable verdict"
      register: prove_tribe
      changed_when: false

    - name: "1.4 | PROVE the Squeeze is sealed as DERIVED and the Estimation-Verdict axiom holds"
      ansible.builtin.shell: |
        set -e
        grep -qF "classed **DERIVED**" "{{ tablet_file }}"
        grep -qF "never MEASURED" "{{ tablet_file }}"
        grep -qF "Pooling is lawful in estimation; pooling is forbidden in verdicts" "{{ tablet_file }}"
        grep -qF "The Never-Averaged axiom stands untouched" "{{ tablet_file }}"
        echo "PROVEN: the Squeeze is sealed DERIVED and the Estimation-Verdict Distinction is sealed"
      register: prove_squeeze
      changed_when: false

    - name: "1.5 | PROVE the Sala court renders epoch witnessing, Kīnu selection, nuisance removal, and Tribe admission"
      ansible.builtin.shell: |
        set -e
        grep -qF "EPOCH" "{{ court_file }}"
        grep -qF "Kīnu Network" "{{ court_file }}"
        grep -qF "N_KINU" "{{ court_file }}"
        grep -qF "NUISANCE REMOVED" "{{ court_file }}"
        grep -qF "TRIBES ADMITTED" "{{ court_file }}"
        grep -qF "DERIVED" "{{ court_file }}"
        echo "PROVEN: the four acts (witness, select, remove, admit) all render, ending in a DERIVED signature"
      register: prove_court
      changed_when: false

    - name: "2.1 | Report"
      ansible.builtin.debug:
        msg: >
          PB-581 complete. GL-HSI-001-A5 sealed: the Kīnu Network
          admits particles only by demonstrated temporal stability over
          a declared epoch floor, the nuisance field is estimated on
          the network alone and every removal is journaled, Tribes are
          admitted only by a formal homogeneity verdict, the squeezed
          Tribe signature is classed DERIVED never MEASURED, and the
          Estimation-Verdict Distinction (pooling is lawful in
          estimation, forbidden in verdicts) stands beside the
          Never-Averaged axiom. Renumbered from the source deposit's
          PB-HSI-005; see
          shala-prototypes/batch15_alaa_kinu_kulla_harvest/README.md
          for the full renumbering table and the open note that this
          amendment's own parents (GL-HSI-001, A1-A4) sit only in
          docs/wed20260819-incoming/, not yet in docs/09_observatory/.
