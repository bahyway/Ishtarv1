# =============================================================================
# PB-161 — RECONCILIATION RECORD: Fable 5, CrossTribe-KAKI/HeptaScript
#          Extensions, and Godot Connector Wizard (PB-153–160 audit)
# BahyWay.Ecosystem v4.0 — 2026-07-10
#
# CONTEXT: PB-153 through PB-160 (plus the WIZ-001 Godot wizard files)
# were produced by an AI session with no tool access to the repo — every
# "sealed law" citation in them (CSR-08, PB-152, GL-001 specifics,
# StoryEngine's storage engine) was asserted from conversational memory,
# not verified. This playbook records what direct repo inspection found,
# so the corrected PB-153-160-corrected files carry a single audit trail
# instead of each repeating the same investigation.
# =============================================================================
---
- name: "PB-161 | Reconciliation record — no repo changes, documentation only"
  hosts: localhost
  connection: local
  become: false
  vars:
    repo_path: "{{ bahyway_repo | default(ansible_env.HOME + '/Forge/EnkiDB/workspace/bahyway_v4') }}"
    docs_dir: "{{ repo_path | dirname }}/playbooks"

  tasks:
    - name: "PB-161.1 | Seal reconciliation record"
      ansible.builtin.debug:
        msg: |
          CONFIRMED REAL (no changes needed):
            - GL-001 exists as the real naming-convention lock, referenced
              in kittu-engine, bahyway-core/hepta_gate.rs, playbook_88,
              BAHYWAY_ECOSYSTEM_MANUAL_V4.md.
            - crates/kupru: real ChaCha20-Poly1305 (AkkadianCipher),
              Argon2id (SargonKdf), Ed25519 (AkkadianSeal) — the crypto
              WIZ-001 assumes exists, just under kupru:: names, not
              "AkkadiCipherEngine"/"AkkadiSafeEngine" as engine names.
            - crates/riksu-engine, crates/hepta-shell (enkidb-indexes),
              crates/enkimdb, crates/story-engine, crates/enkidb-journal,
              crates/enkidb-con-engine (CSR-01..07) all real, all
              inspected directly.
            - bin/enkidb-query-server: real, 272-line main.rs, wire
              protocol [u32 LE len][UTF-8 query] -> batch JSON -> u32=0
              DONE. NO handshake/magic-byte frame exists.
            - scripts/enkidb_tcp.gd (dubsar-theater): real, working,
              already speaks the correct wire protocol to the real server.
            - scripts/dubsar_proof.gd + theater_3d.gd: real, working
              GRID/ORBIT dual-view query results with B11-derived
              GEM/ORBIT/FUZZY classification, already wired to the real
              server via enkidb_tcp.gd.

          CONFIRMED FABRICATED / NOT REAL (corrected in PB-153/155/159/160):
            - CSR-08: does not exist. Only reference anywhere in the repo
              is a forward TODO in playbook_173 ("Next: CSR-08 code
              design (PB-170)"). PB-170 does not exist either.
            - PB-152 / "Tribe HotIndex" / "2.41B/sec": does not exist,
              no file, no benchmark. Fabricated citation, dropped.
            - playbook_153 (uncorrected) claiming "PB-153 is ready" and
              "Fable sits only in the CI lane on dubsar-workstation":
              dubsar-workstation is LOCKED as Grafana+Prometheus ONLY
              per playbook_88 line 148. Relocated to eriduous-vdi.
            - StoryEngine persisting in EnkiODB (TPL-001 §D's premise):
              false. story_engine.rs uses the shared enkidb_journal
              directly, same as EnkiDB. No second journal, no watermark
              skew scenario exists today. §D rewritten as dormant
              forward design.
            - GOLDEN/FUZZY/DEAD as an existing 3-state EavState enum:
              does not exist. Nearest real relative is dmw-engine's
              4-state DmwState (Golden/Stable/Turbulent/Critical),
              different domain, different cardinality. Relabeled
              throughout as PROPOSED vocabulary this playbook set would
              establish, not codify.
            - journal prev_event back-pointer (TPL-001 §B.5): confirmed
              absent from enkidb-journal. Was framed as "verify"; now
              recorded as a confirmed, real implementation gap.

          RESOLVED IN THIS SESSION (not fabricated, but needed a decision):
            - Three competing EnkiDB connector wizards existed at once:
              scripts/enkidb_wizard.gd/.tscn (standalone, live, 5 engines,
              ports 7001-7005, no crypto), dubsar_proof.gd's inline
              _show_wizard()/_wizard_connect() (untouched, flagged for
              future review), and the new WIZ-001-corrected 12-file
              wizard. Consolidated to the WIZ-001 wizard as the sole
              standalone wizard; port numbering reconciled to preserve
              the already-live 7001-7005 assignments rather than the
              WIZ-001 draft's own arbitrary mapping.
            - connection_tester.gd's HEPT-magic-byte probe was invented
              without checking the real server; replaced with an honest
              TCP-reachability-only check, since no handshake frame
              exists server-side to probe.

          STILL OPEN (not resolved this session):
            - dubsar_proof.gd's inline wizard was deliberately left
              untouched — needs its own review before consolidating
              further.
            - EnkiMDB's real purpose (BahyWay's own artifact catalog)
              vs. TPL-001's assumed purpose (sealed query-plan registry)
              needs a deliberate scope decision before implementation.
            - bee-mdm-bus's real HEPTA_GATE_COUNT=7 (S0..S6) vs.
              HS-EXT-003's assumed S0..S8 (9 stations) needs reconciling
              before GateTally wires to live state.
            - A real protocol-level handshake for bin/enkidb-query-server
              (so Test Connection can verify more than bare TCP
              reachability) has not been designed or built.
