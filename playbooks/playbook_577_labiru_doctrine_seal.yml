# =============================================================================
# PB-577 — The Labīru Doctrine: Concept Seal (GL-LBR-001)
# BahyWay.Ecosystem v4.0 — 2026-08-21
#
# WHY THIS PLAYBOOK EXISTS
#   Seals GL-LBR-001, the mortality of GOLDEN: GOLDEN is not eternal
#   truth, it is truth witnessed at a time, held under watch, subject
#   to world-drift (the record stands still while the world moves) and
#   record-drift (the record moves while claiming stillness). The
#   Origin Deposit seals every particle's ingestion-time form into
#   NUZI, write-once, never updated -- a decree may lay a new labīru
#   beside the old, never over it. The Kīma Labīrīšu Rite periodically
#   confronts the living particle against its origin, computing a
#   Hepta-decomposed Divergence D(t) and routing to CONCORD, LAWFUL
#   EVOLUTION, or SILENT DRIFT (a RIGMU by definition). The Honesty
#   Clause forbids any BahyWay surface from calling GOLDEN eternal or
#   absolute -- claiming eternity accrues tau under TIAMAT.
#
#   Landed from a parallel Claude session's Sun20260816 thread,
#   evaluated file-by-file against this repo before landing and
#   RENUMBERED per this repo's standing rule: the other session's own
#   PB-338 -> PB-577 here. This repo's own existing PB-338
#   (`playbook_338_sibittu_jail.yml`) is an unrelated concept -- the
#   collision confirms the source session's numbering carries no
#   meaning here. See
#   shala-prototypes/batch13_sunday_shape_labiru_courts/README.md for
#   the full renumbering table. No dedicated Sala rehearsal was
#   delivered for this base tablet -- see PB-579/shala_misru_court.html
#   for the amendment family's staged instrument.
#
# WHAT THIS PLAYBOOK DOES
#   PROVEs the tablet's own four stated law tests (L28-L31) are
#   present, and PROVEs the Origin Deposit write-once clause and the
#   three-way colophon router are sealed verbatim. Deposits nothing
#   new -- the tablet is committed directly into docs/, this playbook
#   is a pointer/verification record.
#
# Running this playbook = CSR-08 confirmation. Review -> --check -> live.
# =============================================================================

- name: "PB-577 | Seal the Labīru Doctrine (GL-LBR-001)"
  hosts: localhost
  connection: local
  become: false
  vars:
    repo_root: "{{ playbook_dir }}/.."
    tablet_file: "{{ repo_root }}/docs/09_observatory/GL-LBR-001_Labiru_Doctrine.md"

  tasks:

    - name: "0.1 | Confirm the tablet is landed"
      ansible.builtin.stat:
        path: "{{ tablet_file }}"
      register: land_stat

    - name: "FAIL | tablet missing"
      ansible.builtin.fail:
        msg: "{{ tablet_file }} not found -- nothing to seal."
      when: not land_stat.stat.exists

    - name: "1.1 | PROVE the tablet's own four law tests (L28-L31) are sealed"
      ansible.builtin.shell: |
        set -e
        grep -qF "L28" "{{ tablet_file }}"
        grep -qF "the deposit is write-once" "{{ tablet_file }}"
        grep -qF "L29" "{{ tablet_file }}"
        grep -qF "fully journaled divergence" "{{ tablet_file }}"
        grep -qF "L30" "{{ tablet_file }}"
        grep -qF "one journal gap" "{{ tablet_file }}"
        grep -qF "L31" "{{ tablet_file }}"
        grep -qF "D = 0 exactly iff content and context are witness-identical" "{{ tablet_file }}"
        echo "PROVEN: L28-L31 all present with their named assertions"
      register: prove_law_tests
      changed_when: false

    - name: "1.2 | PROVE the mortality-of-GOLDEN doctrine and the Origin Deposit write-once clause are sealed"
      ansible.builtin.shell: |
        set -e
        grep -qF "GOLDEN is not eternal truth. GOLDEN is truth witnessed at a time, held under watch" "{{ tablet_file }}"
        grep -qF "World-drift" "{{ tablet_file }}"
        grep -qF "Record-drift" "{{ tablet_file }}"
        grep -qF "The Origin Deposit is **never updated**" "{{ tablet_file }}"
        grep -qF "the archive does not forget so that the present may be judged" "{{ tablet_file }}"
        echo "PROVEN: the mortality-of-GOLDEN doctrine, both drift channels, and the write-once Origin Deposit are sealed"
      register: prove_doctrine
      changed_when: false

    - name: "1.3 | PROVE the three-way colophon router and the Honesty Clause are sealed"
      ansible.builtin.shell: |
        set -e
        grep -qF "CONCORD" "{{ tablet_file }}"
        grep -qF "LAWFUL EVOLUTION" "{{ tablet_file }}"
        grep -qF "SILENT DRIFT" "{{ tablet_file }}"
        grep -qF "is a **RIGMU by definition**" "{{ tablet_file }}"
        grep -qF "No BahyWay surface, document, or ŠĀRU report may describe GOLDEN as permanent, absolute, or eternal" "{{ tablet_file }}"
        echo "PROVEN: CONCORD/LAWFUL EVOLUTION/SILENT DRIFT router and the Honesty Clause against eternal-truth claims are sealed"
      register: prove_honesty
      changed_when: false

    - name: "2.1 | Report"
      ansible.builtin.debug:
        msg: >
          PB-577 complete. GL-LBR-001 sealed: the mortality of GOLDEN
          (world-drift and record-drift as the two aging channels), the
          write-once Origin Deposit into NUZI, the Kīma Labīrīšu
          confrontation rite computing a Hepta-decomposed Divergence
          D(t), the three-way colophon router (CONCORD / LAWFUL
          EVOLUTION / SILENT DRIFT-as-RIGMU), and the Honesty Clause
          forbidding any claim of eternal truth all hold, proven
          against the tablet's own four stated law tests L28-L31.
          Renumbered from the source session's PB-338 (this repo's own
          existing PB-338 is an unrelated concept, confirming the
          collision); see
          shala-prototypes/batch13_sunday_shape_labiru_courts/README.md
          for the full renumbering table.
