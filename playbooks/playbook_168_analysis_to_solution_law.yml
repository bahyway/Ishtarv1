---
# ============================================================================
# PB-168 — Analysis-to-Solution Law: Amendment to GL-MRD-002 (Rev. 2)
# BahyWay.Ecosystem v4.0 — MardukEngine (DPMVAS) / Nabu Calculus
# ----------------------------------------------------------------------------
# LANDING NOTE (2026-07-11): originally authored in a separate session as
# "PB-163." Renumbered on landing because playbook_163 in this repo already
# holds different, real, tested work (Enbilulu Calculus). Also corrected:
# hosts and doc paths, same as PB-166/167. Depends on PB-167 (was PB-162).
#
# PURPOSE:
#   Amends GL-MRD-002 (Neberu Slicer) to seal the Analysis-to-Solution
#   Law: observation and pattern detection MUST flow into prediction and
#   prescriptive solution candidates. CONCEPT AMENDMENT ONLY -- no runtime
#   code. Implementation deferred until BeeMDM ETL General/Specific testing
#   completes.
#
# PRECEDENT:
#   Enbilulu Calculus already embodies the chain:
#   observation -> Tertu diagnosis -> Milu alert -- real and tested in
#   bahyway-algebra::enbilulu as of 2026-07-10.
#
# SOVEREIGNTY:
#   - Run by the Architect (DUB.SAR) from host -> eriduous-vdi (CSR-08).
#   - Solutions are ADVISORY-ONLY (NINSUN/Namtila pattern): the system
#     proposes; the Architect/commander decides. No blocking power.
#
# TARGET: eriduous-vdi
# ============================================================================

- name: "PB-168 | Verify GL-MRD-002 Rev. 2 (Analysis-to-Solution Law) landed"
  hosts: localhost
  connection: local
  become: false
  vars:
    forge_root:    "{{ ansible_env.HOME }}/Forge/EnkiDB"
    bahyway_docs_root: "{{ forge_root }}/docs/01_mathematics"
    doc_id: "GL-MRD-002"
    doc_file: "{{ bahyway_docs_root }}/GL-MRD-002-neberu-slicer.md"

  tasks:

    - name: "Verify GL-MRD-002 exists (PB-167 must have run/landed first)"
      ansible.builtin.stat:
        path: "{{ doc_file }}"
      register: base_doc

    - name: "Fail if GL-MRD-002 is missing"
      ansible.builtin.fail:
        msg: "GL-MRD-002 not found at {{ doc_file }}. Run PB-167 before PB-168."
      when: not base_doc.stat.exists

    - name: "Verify Rev. 2 (Section 7) is present in the landed document"
      ansible.builtin.command: grep -q "Analysis-to-Solution Law" "{{ doc_file }}"
      register: rev2_check
      changed_when: false
      failed_when: false

    - name: "Report amendment result"
      ansible.builtin.debug:
        msg: >
          {{ 'PB-168 confirmed: GL-MRD-002 Rev. 2 (DETECT -> PROVE -> PREDICT
             -> PRESCRIBE) is sealed in the landed document.'
             if rev2_check.rc == 0 else
             'PB-168 FAILED: Section 7 (Analysis-to-Solution Law) not found in '
             + doc_file + '.' }}
