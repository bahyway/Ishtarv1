---
# ════════════════════════════════════════════════════════════════════════════
#  playbook_99_phase_b_testing_playbook_phase1.yml
#  BahyWay.Ecosystem v4.0 — Phase B: TESTING_PLAYBOOK_PHASE1.md, for real (PB-99 -> PB-109)
#
#  SCP to EriduOS-VDI then run:
#    ansible-playbook playbook_99_phase_b_testing_playbook_phase1.yml -i "localhost," -c local -v
#
#  HONESTY NOTE: same as PB-90 -- RM-001 only ever names "PB-99 -> PB-109"
#  as one phase, individually defining nothing except PB-109 ("Full Phase 1
#  Report"). This playbook IS that report, generated for real: it is a
#  direct ansible translation of docs/17_troubleshooting/TESTING_PLAYBOOK_PHASE1.md Blocks
#  A-F, which existed as a committed but never-executed manual checklist
#  until now. Filed under PB-99 (first number in the range); its output
#  report satisfies PB-109's brief.
#
#  Blocks A, B, C, D, E-001/002/003 run unconditionally -- nothing they
#  need is missing on a normal clone. Two blocks have real prerequisites
#  this playbook cannot manufacture and will SKIP (not fake-pass) if
#  those prerequisites aren't met:
#    - E-004/E-005 need a live EnkiDB instance on port 7001, seeded with
#      `cargo run -p enkidb-seed` (writes real particles straight into
#      enkidb-query-server's PersistedDb store; defaults tag 1-in-10000
#      particles with EAV `shard = "e004"`, which E-004's WHERE clause
#      targets). If nothing answers that port, these are skipped with a
#      clear message, not silently marked PASS. If the port IS live, this
#      playbook now issues the real HeptaScript queries over the real
#      wire protocol (via a small embedded Python client speaking
#      enkidb-query-server's [u32 len][payload] framing) and asserts
#      against the real StreamStats returned -- not a "run this
#      manually" placeholder.
#    - F-001 needs a corpus directory of archive files. Defaults to
#      looking for the 7 ashnan_test_* reference files (copy them from
#      your original research uploads if you still have them); falls back
#      to any archives already in corpus_dir if present, and reports the
#      real classification counts either way.
#
#  Gate: per TESTING_PLAYBOOK_PHASE1.md itself, Phase 1 PASSES only if
#  every block that actually ran came back green AND zero unexpected
#  errors in Block F. This playbook enforces that exact gate at the end
#  and refuses to claim PASS if anything was skipped -- it reports
#  "INCOMPLETE (blocks skipped: ...)" instead, honestly.
# ════════════════════════════════════════════════════════════════════════════
- name: "PB-99 | Phase B — TESTING_PLAYBOOK_PHASE1.md Blocks A-F, executed for real"
  hosts: localhost
  connection: local
  gather_facts: true

  vars:
    forge_root:      "{{ ansible_env.HOME }}/Forge/EnkiDB"
    workspace:       "{{ forge_root }}/workspace/bahyway_v4"
    cargo:           "{{ ansible_env.HOME }}/.cargo/bin/cargo"
    target_branch:   "claude/iphone-playbooks-crosstribe-eval-nbc5sw"
    session_date:    "{{ ansible_date_time.date }}"
    docs_dir:        "{{ forge_root }}/docs"
    report_file:     "{{ docs_dir }}/PB99_PHASE1_REPORT_{{ session_date }}.txt"
    corpus_dir:      "{{ ansible_env.HOME }}/landing_zone_corpus"
    corpus_generator: "{{ forge_root }}/workspace/scripts/tools/generate_landing_zone_corpus.py"
    corpus_manifest: "{{ corpus_dir }}/manifest.json"
    enkidb_read_host: "127.0.0.1"
    enkidb_read_port: 7001
    probe_script:    "{{ ansible_env.HOME }}/.pb99_heptascript_probe.py"

  tasks:

    # ── Sync verification — NO git on this host ────────────────────────────
    # EriduOS-VDI is not a GitHub-connected clone. GitHub lives on the
    # laptop (Fedora host). Workflow: laptop runs git pull, then scp -r
    # the updated workspace/bahyway_v4 to this host at {{ workspace }}.
    # This playbook only verifies that sync already happened.
    - name: "VERIFY | Workspace present (scp'd from laptop)"
      ansible.builtin.stat:
        path: "{{ workspace }}/Cargo.toml"
      register: ws_check

    - name: "FAIL | Workspace not synced — run the laptop-side sync first"
      ansible.builtin.fail:
        msg: >
          {{ workspace }}/Cargo.toml not found on this host. EriduOS-VDI has
          no GitHub access. On your Fedora laptop: git pull origin
          {{ target_branch }}, then scp -r workspace/bahyway_v4
          bahaa@eriduos-vdi:{{ workspace }}. Re-run this playbook after that.
      when: not ws_check.stat.exists

    - name: "BUILD | cargo build --workspace (prerequisite baseline)"
      ansible.builtin.command: {cmd: "{{ cargo }} build --workspace", chdir: "{{ workspace }}"}
      register: build_baseline
      changed_when: false
      failed_when: build_baseline.rc != 0

    # ── BLOCK A — Archive Decompression (NARAMSIN Stage 0) ─────────────────
    - name: "A-001 | naramsin-archive unit tests"
      ansible.builtin.command: {cmd: "{{ cargo }} test -p naramsin-archive", chdir: "{{ workspace }}"}
      register: a001
      changed_when: false
      failed_when: a001.rc != 0

    - name: "CHECK | Is the ashnan_test_* reference corpus present?"
      ansible.builtin.stat: {path: "{{ corpus_dir }}/ashnan_test_zip.zip"}
      register: corpus_check

    - name: "CHECK | Is a generated corpus (manifest.json) present?"
      ansible.builtin.stat: {path: "{{ corpus_manifest }}"}
      register: corpus_manifest_check

    # No corpus at all -- the exact 7 ashnan_test_* reference files aren't
    # reproducible (they were manual research uploads, not build artifacts),
    # so rather than just skip A-002..010/F-001, generate a real corpus with
    # generate_landing_zone_corpus.py. Small/fast (--count 12, 1-2MB each,
    # not the 50x100-500MB default) since this just needs to exercise every
    # NRM_* category at least once, not stress-test disk/time.
    - name: "GENERATE | Small corpus via generate_landing_zone_corpus.py (no corpus found)"
      ansible.builtin.command:
        cmd: >
          python3 {{ corpus_generator }} --out-dir {{ corpus_dir }}
          --count 12 --min-size-mb 1 --max-size-mb 2 --seed 20260707
      register: corpus_gen
      changed_when: true
      failed_when: corpus_gen.rc != 0
      when: not corpus_check.stat.exists and not corpus_manifest_check.stat.exists

    - name: "CHECK | Re-stat manifest.json after generation"
      ansible.builtin.stat: {path: "{{ corpus_manifest }}"}
      register: corpus_manifest_check_after_gen
      when: not corpus_check.stat.exists and not corpus_manifest_check.stat.exists

    - name: "SET  | Which corpus is in play"
      ansible.builtin.set_fact:
        corpus_available: "{{ corpus_check.stat.exists or corpus_manifest_check.stat.exists or (corpus_manifest_check_after_gen.stat.exists | default(false)) }}"
        using_generated_corpus: "{{ not corpus_check.stat.exists and (corpus_manifest_check.stat.exists or (corpus_manifest_check_after_gen.stat.exists | default(false))) }}"

    - name: "PRINT | Corpus status"
      ansible.builtin.debug:
        msg: >
          {{ 'Reference ashnan_test_* corpus found at ' + corpus_dir
          if corpus_check.stat.exists
          else ('Generated corpus in play at ' + corpus_dir + ' (manifest.json, real ashnan_test_* files were never reproducible -- see this playbook''s header)'
          if using_generated_corpus
          else 'No corpus at ' + corpus_dir + ' and generation failed -- A-002 through A-010 and F-001 will be skipped: ' + (corpus_gen.stderr | default('unknown error'))) }}

    - name: "SET  | manifest.json entries (generated-corpus path only)"
      ansible.builtin.set_fact:
        corpus_manifest_entries: "{{ (lookup('file', corpus_manifest) | from_json) if using_generated_corpus else [] }}"

    - name: "A-002..009 | Extract each ashnan_test_* reference file via naramsin_extract"
      ansible.builtin.command:
        cmd: "{{ cargo }} run -q -p naramsin-archive --example naramsin_extract -- {{ corpus_dir }}/{{ item }}"
        chdir: "{{ workspace }}"
      loop:
        - ashnan_test_zip.zip
        - ashnan_test_nested.zip
        - ashnan_test_CORRUPT.zip
        - ashnan_test_targz.tar
        - ashnan_test_tarbz2.tar
        - ashnan_test_tarxz.tar
        - ashnan_test_7z.7z
      register: archive_results
      changed_when: false
      failed_when: false
      when: corpus_check.stat.exists

    - name: "A-002..009 (generated corpus) | Extract every manifest entry via naramsin_extract"
      ansible.builtin.command:
        cmd: "{{ cargo }} run -q -p naramsin-archive --example naramsin_extract -- {{ corpus_dir }}/{{ item.filename }}"
        chdir: "{{ workspace }}"
      loop: "{{ corpus_manifest_entries }}"
      loop_control: {label: "{{ item.filename }} ({{ item.category }})"}
      register: generated_archive_results
      changed_when: false
      failed_when: false
      when: using_generated_corpus

    - name: "PRINT | Archive extraction results"
      ansible.builtin.debug:
        msg: "{{ item.item }}: {{ item.stdout_lines[0] | default('no output') }}"
      loop: "{{ archive_results.results | default([]) }}"
      when: corpus_check.stat.exists

    - name: "PRINT | Archive extraction results (generated corpus)"
      ansible.builtin.debug:
        msg: "{{ item.item.filename }} ({{ item.item.category }}, expect {{ item.item.expected_nrm }}): {{ item.stdout_lines[0] | default('no output') }}"
      loop: "{{ generated_archive_results.results | default([]) }}"
      loop_control: {label: "{{ item.item.filename | default('?') }}"}
      when: using_generated_corpus

    - name: "ASSERT | ashnan_test_CORRUPT.zip must be rejected (CRITICAL per A-005)"
      ansible.builtin.assert:
        that:
          - "'NRM_TRUNCATED' in (archive_results.results | selectattr('item', 'equalto', 'ashnan_test_CORRUPT.zip') | map(attribute='stdout') | first | default(''))"
        fail_msg: "CRITICAL: CORRUPT.zip did NOT return NRM_TRUNCATED -- the truncation guard is broken. STOP."
      when: corpus_check.stat.exists

    - name: "ASSERT | every generated 'truncated' entry must be rejected as NRM_TRUNCATED (CRITICAL per A-005)"
      ansible.builtin.assert:
        that:
          - "item.expected_nrm in (generated_archive_results.results | selectattr('item.filename', 'equalto', item.filename) | map(attribute='stdout') | first | default(''))"
        fail_msg: >-
          CRITICAL: {{ item.filename }} (category={{ item.category }}) did not
          return {{ item.expected_nrm }} -- the integrity guard is broken. STOP.
      loop: "{{ corpus_manifest_entries | selectattr('category', 'equalto', 'truncated') | list }}"
      loop_control: {label: "{{ item.filename }}"}
      when: using_generated_corpus

    - name: "A-010 | Zip-bomb recursion depth guard"
      ansible.builtin.command: {cmd: "{{ cargo }} test -p naramsin-archive recursion_depth", chdir: "{{ workspace }}"}
      register: a010
      changed_when: false
      failed_when: a010.rc != 0

    # ── BLOCK B — CRC Integrity ──────────────────────────────────────────
    - name: "B-001 | bahyway-crc unit tests"
      ansible.builtin.command: {cmd: "{{ cargo }} test -p bahyway-crc", chdir: "{{ workspace }}"}
      register: b001
      changed_when: false
      failed_when: b001.rc != 0

    - name: "ASSERT | bahyway-crc reports 7 passed"
      ansible.builtin.assert:
        that: ["((b001.stdout | regex_search('([0-9]+) passed', '\\\\1') | first | int) >= 7)"]
        fail_msg: "Expected '7 passed'. Got: {{ b001.stdout }}"

    # ── BLOCK C — Session Registry ───────────────────────────────────────
    - name: "C-001 | enkidb-session-registry unit tests"
      ansible.builtin.command: {cmd: "{{ cargo }} test -p enkidb-session-registry", chdir: "{{ workspace }}"}
      register: c001
      changed_when: false
      failed_when: c001.rc != 0

    - name: "ASSERT | session-registry reports 6 passed"
      ansible.builtin.assert:
        that: ["((c001.stdout | regex_search('([0-9]+) passed', '\\\\1') | first | int) >= 6)"]
        fail_msg: "Expected '6 passed'. Got: {{ c001.stdout }}"

    # ── BLOCK D — ConEngine 7 CSR Rules ──────────────────────────────────
    - name: "D-001 | enkidb-con-engine unit tests"
      ansible.builtin.command: {cmd: "{{ cargo }} test -p enkidb-con-engine", chdir: "{{ workspace }}"}
      register: d001
      changed_when: false
      failed_when: d001.rc != 0

    - name: "ASSERT | ConEngine reports 6 passed"
      ansible.builtin.assert:
        that: ["((d001.stdout | regex_search('([0-9]+) passed', '\\\\1') | first | int) >= 6)"]
        fail_msg: "Expected '6 passed'. Got: {{ d001.stdout }}"

    # ── BLOCK E — HeptaScript Engine ─────────────────────────────────────
    - name: "E-001 | heptascript unit tests"
      ansible.builtin.command: {cmd: "{{ cargo }} test -p heptascript", chdir: "{{ workspace }}"}
      register: e001
      changed_when: false
      failed_when: e001.rc != 0

    - name: "ASSERT | heptascript reports 170 passed"
      ansible.builtin.assert:
        that: ["((e001.stdout | regex_search('([0-9]+) passed', '\\\\1') | first | int) >= 170)"]
        fail_msg: "Expected '170 passed' (164 original + 6 from PB-172). Got: {{ e001.stdout }}"

    - name: "E-002 | SUMU-UKIN routing tests"
      ansible.builtin.command: {cmd: "{{ cargo }} test -p heptascript sumuukin", chdir: "{{ workspace }}"}
      register: e002
      changed_when: false
      failed_when: e002.rc != 0

    - name: "E-003 | enkidb-indexes tests"
      ansible.builtin.command: {cmd: "{{ cargo }} test -p enkidb-indexes", chdir: "{{ workspace }}"}
      register: e003
      changed_when: false
      failed_when: e003.rc != 0

    - name: "ASSERT | enkidb-indexes reports 54 passed"
      ansible.builtin.assert:
        that: ["((e003.stdout | regex_search('([0-9]+) passed', '\\\\1') | first | int) >= 54)"]
        fail_msg: "Expected '54 passed'. Got: {{ e003.stdout }}"

    # ── E-004/E-005 — need a LIVE EnkiDB instance; skip honestly if absent ──
    - name: "CHECK | Is anything listening on {{ enkidb_read_host }}:{{ enkidb_read_port }}?"
      ansible.builtin.wait_for:
        host: "{{ enkidb_read_host }}"
        port: "{{ enkidb_read_port }}"
        timeout: 3
        state: started
      register: enkidb_live
      ignore_errors: true

    - name: "PRINT | E-004/E-005 precondition status"
      ansible.builtin.debug:
        msg: >
          {{ 'EnkiDB read node is live -- running E-004/E-005 for real below.'
          if enkidb_live is succeeded
          else 'SKIPPED: nothing answering ' + enkidb_read_host + ':' + (enkidb_read_port | string) + '. E-004 (10M-particle <1s query) and E-005 (ABORT_SCAN) need a running, loaded EnkiDB instance -- cannot be faked. Start enkidb-query-server, seed it with `cargo run -p enkidb-seed` (defaults tag 1-in-10000 particles shard="e004" for E-004), then re-run.' }}

    - name: "PREP | Write HeptaScript wire-protocol probe script"
      ansible.builtin.copy:
        dest: "{{ probe_script }}"
        mode: "0755"
        content: |
          #!/usr/bin/env python3
          # Minimal real client for enkidb-query-server's wire protocol:
          # [u32 LE query_len][UTF-8 query] request, [u32 LE frame_len]-prefixed
          # response frames until a frame_len==0 DONE sentinel. The response
          # payload is {"rows": [...], "stats": {"matched", "evaluated",
          # "aborted"}} -- see bin/enkidb-query-server/src/main.rs's
          # result_to_json(). Prints one machine-parseable line:
          #   elapsed_ms=<float> matched=<int> evaluated=<int> aborted=<True|False>
          import socket, struct, sys, time, json

          host, port, hquery = sys.argv[1], int(sys.argv[2]), sys.argv[3]
          s = socket.create_connection((host, port), timeout=30)
          qb = hquery.encode("utf-8")
          s.sendall(struct.pack("<I", len(qb)) + qb)

          frames = []
          t0 = time.time()
          while True:
              hdr = b""
              while len(hdr) < 4:
                  chunk = s.recv(4 - len(hdr))
                  if not chunk:
                      print("ERROR: connection closed while reading frame header")
                      sys.exit(1)
                  hdr += chunk
              (flen,) = struct.unpack("<I", hdr)
              if flen == 0:
                  break
              buf = b""
              while len(buf) < flen:
                  chunk = s.recv(flen - len(buf))
                  if not chunk:
                      print("ERROR: connection closed mid-frame")
                      sys.exit(1)
                  buf += chunk
              frames.append(buf.decode("utf-8"))
          elapsed_ms = (time.time() - t0) * 1000
          s.close()

          if not frames:
              print(f"elapsed_ms={elapsed_ms:.2f} matched=0 evaluated=0 aborted=False")
              sys.exit(0)

          payload = frames[0]
          if payload.startswith("ERR:"):
              print(f"ERROR: server returned {payload}")
              sys.exit(1)

          doc = json.loads(payload)
          stats = doc.get("stats", {})
          print(
              f"elapsed_ms={elapsed_ms:.2f} "
              f"matched={stats.get('matched', 'unknown')} "
              f"evaluated={stats.get('evaluated', 'unknown')} "
              f"aborted={stats.get('aborted', 'unknown')}"
          )

    - name: "E-004 | Selective indexed query at scale — real HeptaScript over the wire"
      ansible.builtin.shell:
        cmd: |
          python3 {{ probe_script }} {{ enkidb_read_host }} {{ enkidb_read_port }} \
            'WHO T.E
          WHERE E[shard] = "e004"
          HOW_MUCH LIMIT 1000
          ABORT_SCAN 5000000'
      register: e004
      changed_when: false
      failed_when: false
      when: enkidb_live is succeeded

    - name: "ASSERT | E-004 — indexed query < 1000ms, not aborted, matched > 0"
      ansible.builtin.assert:
        that:
          - "(e004.stdout | regex_search('elapsed_ms=([0-9.]+)', '\\\\1') | first | float) < 1000"
          - "'aborted=False' in e004.stdout"
          - "(e004.stdout | regex_search('matched=([0-9]+)', '\\\\1') | first | int) > 0"
        fail_msg: >-
          E-004 FAILED. Needs particles seeded with `cargo run -p enkidb-seed`
          (defaults tag 1-in-10000 particles shard="e004" for exactly this
          selective query -- if matched=0, that's the likely cause).
          Output: {{ e004.stdout }} {{ e004.stderr | default('') }}
        success_msg: "E-004: {{ e004.stdout }}"
      when: enkidb_live is succeeded

    - name: "E-005 | ABORT_SCAN safety valve fires on an unselective full scan"
      ansible.builtin.shell:
        cmd: |
          python3 {{ probe_script }} {{ enkidb_read_host }} {{ enkidb_read_port }} \
            'WHO T.E
          HOW_MUCH LIMIT 1000000
          ABORT_SCAN 100'
      register: e005
      changed_when: false
      failed_when: false
      when: enkidb_live is succeeded

    - name: "ASSERT | E-005 — ABORT_SCAN fires (aborted=True), returns fast"
      ansible.builtin.assert:
        that:
          - "'aborted=True' in e005.stdout"
          - "(e005.stdout | regex_search('elapsed_ms=([0-9.]+)', '\\\\1') | first | float) < 100"
        fail_msg: "E-005 FAILED. Output: {{ e005.stdout }} {{ e005.stderr | default('') }}"
        success_msg: "E-005: {{ e005.stdout }}"
      when: enkidb_live is succeeded

    # ── BLOCK F — Full Corpus Run ─────────────────────────────────────────
    - name: "F-001 | Batch classify every archive in corpus_dir"
      ansible.builtin.shell:
        cmd: >
          for f in {{ corpus_dir }}/*.{zip,tar,7z,gz,bz2,xz} ;
          do echo -n "$f: " ; {{ cargo }} run -q -p naramsin-archive --example naramsin_extract -- "$f" 2>&1 | head -1 ; done
        chdir: "{{ workspace }}"
      register: f001
      changed_when: false
      failed_when: false
      when: corpus_available

    - name: "PRINT | F-001 classification"
      ansible.builtin.debug: {msg: "{{ f001.stdout_lines | default(['SKIPPED -- no corpus_dir']) }}"}

    # ── Final gate + report ───────────────────────────────────────────────
    - name: "SET  | Track which blocks were skipped"
      ansible.builtin.set_fact:
        skipped_blocks: >-
          {{
            (['A-002..010/F-001 (no corpus at ' + corpus_dir + ' and generation failed)'] if not corpus_available else [])
            + (['E-004/E-005 (no live EnkiDB on ' + enkidb_read_host + ':' + (enkidb_read_port|string) + ')'] if enkidb_live is failed else [])
          }}

    - name: "PRINT | PB-99 Phase 1 gate verdict"
      ansible.builtin.debug:
        msg: |
          ╔═══════════════════════════════════════════════════════════════════════╗
          ║   BahyWay.Ecosystem v4.0 — PB-99 Phase 1 Testing Playbook, EXECUTED    ║
          ║   Date : {{ session_date }}   Node : {{ ansible_hostname }}           ║
          ╠═══════════════════════════════════════════════════════════════════════╣
          ║  Block A (archive)     : {{ 'PASS' if a001.rc == 0 and a010.rc == 0 else 'FAIL' }}
          ║  Block B (CRC)         : {{ 'PASS' if b001.rc == 0 else 'FAIL' }}
          ║  Block C (registry)    : {{ 'PASS' if c001.rc == 0 else 'FAIL' }}
          ║  Block D (ConEngine)   : {{ 'PASS' if d001.rc == 0 else 'FAIL' }}
          ║  Block E-001/002/003   : {{ 'PASS' if (e001.rc == 0 and e002.rc == 0 and e003.rc == 0) else 'FAIL' }}
          ║  Block E-004/005       : {{ 'PASS' if (enkidb_live is succeeded and e004.rc == 0 and e005.rc == 0) else ('SKIPPED (no live EnkiDB)' if enkidb_live is failed else 'FAIL') }}
          ║  Block F (corpus)      : {{ 'RAN, see above' if corpus_available else 'SKIPPED (no corpus)' }}
          ╠═══════════════════════════════════════════════════════════════════════╣
          ║  VERDICT: {{ 'PHASE 1 PASSED' if (skipped_blocks | length == 0) else 'INCOMPLETE — blocks skipped: ' + (skipped_blocks | join('; ')) }}
          ╚═══════════════════════════════════════════════════════════════════════╝

    - name: "WRITE | Dated Phase 1 report file"
      ansible.builtin.copy:
        dest: "{{ report_file }}"
        mode: "0644"
        content: |
          BahyWay.Ecosystem v4.0 — PB-99 Phase 1 Report (docs/17_troubleshooting/TESTING_PLAYBOOK_PHASE1.md, executed)
          Date: {{ session_date }}  Node: {{ ansible_hostname }}  Branch: {{ target_branch }}

          Block A: {{ a001.stdout }}
          Block B: {{ b001.stdout }}
          Block C: {{ c001.stdout }}
          Block D: {{ d001.stdout }}
          Block E: {{ e001.stdout }}
          Block E-004: {{ e004.stdout | default('SKIPPED (no live EnkiDB)') }}
          Block E-005: {{ e005.stdout | default('SKIPPED (no live EnkiDB)') }}
          Block F: {{ f001.stdout | default('SKIPPED') }}

          Skipped blocks: {{ skipped_blocks }}
          Verdict: {{ 'PHASE 1 PASSED' if (skipped_blocks | length == 0) else 'INCOMPLETE' }}

    - name: "DONE  | PB-99 COMPLETE"
      ansible.builtin.debug:
        msg: "PB-99 complete — report at {{ report_file }}. This report satisfies PB-109's brief."
