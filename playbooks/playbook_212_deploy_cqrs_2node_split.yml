      when: "'RECREATE' in enkimdb_read_status.stdout"
      changed_when: true

    - name: "3.4b | Ensure enkimdb-read is actually running (covers e.g. a stopped-but-not-recreated container)"
      ansible.builtin.command: podman start enkimdb-read
      changed_when: false
      failed_when: false

    # PB-212.5: same recreate-only-on-image-change dance as 3.1-3.4b above,
    # applied to the five newly-deployed types.
    - name: "3.6 | Check whether enkidb-read needs recreating"
      ansible.builtin.shell: |
        set -euo pipefail
        RUNNING_IMG=$(podman inspect enkidb-read --format '{% raw %}{{.Image}}{% endraw %}' 2>/dev/null || echo "MISSING")
        BUILT_IMG=$(podman inspect enkidb-read-server:latest --format '{% raw %}{{.Id}}{% endraw %}')
        if [ "$RUNNING_IMG" != "$BUILT_IMG" ]; then echo "RECREATE"; else echo "UP_TO_DATE"; fi
      register: enkidb_read_status
      changed_when: false

    - name: "3.6b | Stop + remove enkidb-read ONLY if it needs recreating"
      ansible.builtin.shell: podman stop enkidb-read 2>/dev/null; podman rm enkidb-read 2>/dev/null; true
      when: "'RECREATE' in enkidb_read_status.stdout"
      changed_when: true

    - name: "3.7 | Run enkidb-read (port 7001) if it needed recreating"
      ansible.builtin.command: >
        podman run -d --name enkidb-read
        -p 7001:7001
        -v enkidb-read-data:/data:Z
        -e RELOAD_SECS=30
        --restart=always
        enkidb-read-server:latest
      when: "'RECREATE' in enkidb_read_status.stdout"
      changed_when: true

    - name: "3.7b | Ensure enkidb-read is actually running"
      ansible.builtin.command: podman start enkidb-read
      changed_when: false
      failed_when: false

    - name: "3.8 | Check whether enkidw-read needs recreating"
      ansible.builtin.shell: |
        set -euo pipefail
        RUNNING_IMG=$(podman inspect enkidw-read --format '{% raw %}{{.Image}}{% endraw %}' 2>/dev/null || echo "MISSING")
        BUILT_IMG=$(podman inspect enkidw-read-server:latest --format '{% raw %}{{.Id}}{% endraw %}')
        if [ "$RUNNING_IMG" != "$BUILT_IMG" ]; then echo "RECREATE"; else echo "UP_TO_DATE"; fi
      register: enkidw_read_status
      changed_when: false

    - name: "3.8b | Stop + remove enkidw-read ONLY if it needs recreating"
      ansible.builtin.shell: podman stop enkidw-read 2>/dev/null; podman rm enkidw-read 2>/dev/null; true
      when: "'RECREATE' in enkidw_read_status.stdout"
      changed_when: true

    - name: "3.9 | Run enkidw-read (port 7002) if it needed recreating"
      ansible.builtin.command: >
        podman run -d --name enkidw-read
        -p 7002:7002
        -v enkidw-read-data:/data:Z
        -e RELOAD_SECS=30
        --restart=always
        enkidw-read-server:latest
      when: "'RECREATE' in enkidw_read_status.stdout"
      changed_when: true

    - name: "3.9b | Ensure enkidw-read is actually running"
      ansible.builtin.command: podman start enkidw-read
      changed_when: false
      failed_when: false

    - name: "3.10 | Check whether enkisdb-read needs recreating"
      ansible.builtin.shell: |
        set -euo pipefail
        RUNNING_IMG=$(podman inspect enkisdb-read --format '{% raw %}{{.Image}}{% endraw %}' 2>/dev/null || echo "MISSING")
        BUILT_IMG=$(podman inspect enkisdb-read-server:latest --format '{% raw %}{{.Id}}{% endraw %}')
        if [ "$RUNNING_IMG" != "$BUILT_IMG" ]; then echo "RECREATE"; else echo "UP_TO_DATE"; fi
      register: enkisdb_read_status
      changed_when: false

    - name: "3.10b | Stop + remove enkisdb-read ONLY if it needs recreating"
      ansible.builtin.shell: podman stop enkisdb-read 2>/dev/null; podman rm enkisdb-read 2>/dev/null; true
      when: "'RECREATE' in enkisdb_read_status.stdout"
      changed_when: true

    - name: "3.11 | Run enkisdb-read (port 7003) if it needed recreating"
      ansible.builtin.command: >
        podman run -d --name enkisdb-read
        -p 7003:7003
        -v enkisdb-read-data:/data:Z
        -e RELOAD_SECS=30
        --restart=always
        enkisdb-read-server:latest
      when: "'RECREATE' in enkisdb_read_status.stdout"
      changed_when: true

    - name: "3.11b | Ensure enkisdb-read is actually running"
      ansible.builtin.command: podman start enkisdb-read
      changed_when: false
      failed_when: false

    - name: "3.12 | Check whether enkiodb-read needs recreating"
      ansible.builtin.shell: |
        set -euo pipefail
        RUNNING_IMG=$(podman inspect enkiodb-read --format '{% raw %}{{.Image}}{% endraw %}' 2>/dev/null || echo "MISSING")
        BUILT_IMG=$(podman inspect enkiodb-read-server:latest --format '{% raw %}{{.Id}}{% endraw %}')
        if [ "$RUNNING_IMG" != "$BUILT_IMG" ]; then echo "RECREATE"; else echo "UP_TO_DATE"; fi
      register: enkiodb_read_status
