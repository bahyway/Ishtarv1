    - name: "3.12b | Stop + remove enkiodb-read ONLY if it needs recreating"
      ansible.builtin.shell: podman stop enkiodb-read 2>/dev/null; podman rm enkiodb-read 2>/dev/null; true
      when: "'RECREATE' in enkiodb_read_status.stdout"
      changed_when: true

    - name: "3.13 | Run enkiodb-read (port 7004) if it needed recreating"
      ansible.builtin.command: >
        podman run -d --name enkiodb-read
        -p 7004:7004
        -v enkiodb-read-data:/data:Z
        -e RELOAD_SECS=30
        --restart=always
        enkiodb-read-server:latest
      when: "'RECREATE' in enkiodb_read_status.stdout"
      changed_when: true

    - name: "3.13b | Ensure enkiodb-read is actually running"
      ansible.builtin.command: podman start enkiodb-read
      changed_when: false
      failed_when: false

    - name: "3.14 | Check whether enkiqdb-read needs recreating"
      ansible.builtin.shell: |
        set -euo pipefail
        RUNNING_IMG=$(podman inspect enkiqdb-read --format '{% raw %}{{.Image}}{% endraw %}' 2>/dev/null || echo "MISSING")
        BUILT_IMG=$(podman inspect enkiqdb-read-server:latest --format '{% raw %}{{.Id}}{% endraw %}')
        if [ "$RUNNING_IMG" != "$BUILT_IMG" ]; then echo "RECREATE"; else echo "UP_TO_DATE"; fi
      register: enkiqdb_read_status
      changed_when: false

    - name: "3.14b | Stop + remove enkiqdb-read ONLY if it needs recreating"
      ansible.builtin.shell: podman stop enkiqdb-read 2>/dev/null; podman rm enkiqdb-read 2>/dev/null; true
      when: "'RECREATE' in enkiqdb_read_status.stdout"
      changed_when: true

    - name: "3.15 | Run enkiqdb-read (port 7005) if it needed recreating"
      ansible.builtin.command: >
        podman run -d --name enkiqdb-read
        -p 7005:7005
        -v enkiqdb-read-data:/data:Z
        -e RELOAD_SECS=30
        --restart=always
        enkiqdb-read-server:latest
      when: "'RECREATE' in enkiqdb_read_status.stdout"
      changed_when: true

    - name: "3.15b | Ensure enkiqdb-read is actually running"
      ansible.builtin.command: podman start enkiqdb-read
      changed_when: false
      failed_when: false

    # ── 3.5 Open the published ports in the host firewall, if one's active ──
    # See PB-212a's own 3.5a/b/c comment for the full rationale (found
    # live: "No route to host" querying across the network despite the
    # container's port being published -- firewalld's default blocks
    # inbound traffic on anything but SSH). Ports here are the Read
    # side's: 7102/7202, needed for PB-213's cross-host QUERY/SEARCH and
    # any other client (TamuzAI, EaAgent, the DubSar notebook) reaching
    # this host from elsewhere on the network.
    - name: "3.5a | Check if firewalld is active"
      ansible.builtin.command: systemctl is-active firewalld
      register: firewalld_status
      changed_when: false
      failed_when: false

    - name: "3.5b | Open Read ports in firewalld"
      ansible.builtin.command: "firewall-cmd --permanent --add-port={{ item }}/tcp"
      become: true
      when: firewalld_status.stdout == "active"
      register: fw_add
      changed_when: "'ALREADY_ENABLED' not in (fw_add.stdout | default(''))"
      loop:
        - 7102
        - 7202
        - 7001
        - 7002
        - 7003
        - 7004
        - 7005

    - name: "3.5c | Reload firewalld to apply"
      ansible.builtin.command: firewall-cmd --reload
      become: true
      when: firewalld_status.stdout == "active" and (fw_add.changed | default(false))
      changed_when: true

    # ── 4. Prove all seven are listening ───────────────────────────
    - name: "4.1 | Wait for Read ports to accept connections"
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ item }}"
        timeout: 60
      loop:
        - 7102   # enkiddb-read
        - 7202   # enkimdb-read
        - 7001   # enkidb-read (core)
        - 7002   # enkidw-read
        - 7003   # enkisdb-read
        - 7004   # enkiodb-read
        - 7005   # enkiqdb-read


