---
# ════════════════════════════════════════════════════════════════════════════
#  playbook_110_session_deliverables_reconciled.yml
#  BahyWay.Ecosystem v4.0 — PB-110 Reconciled: UrNammu/Nisaba/Kittu deliverables
#
#  SCP to EriduOS-VDI then run:
#    ansible-playbook playbook_110_session_deliverables_reconciled.yml -i "localhost," -c local -v
#
#  Two versions of PB-110 were uploaded together this batch (a plain one
#  and one suffixed _OLD). Diffed them directly: the plain (newer) one
#  already fixed two real bugs the _OLD one had — it registers
#  urnammu-attestationd in the workspace Cargo.toml members list (the
#  _OLD version scaffolds the crate but never registers it, so
#  `cargo build --workspace` would silently skip it), and it uses a
#  `forge_branch` variable for the backup git-push target instead of a
#  hardcoded stale branch name. The plain version supersedes _OLD; this
#  file is built from it, with two more fixes on top:
#
#    1. forge_branch was still set to "claude/iphone-session-playbook-
#       review-pzrrr7" — a DIFFERENT branch from this session's
#       "claude/iphone-playbooks-crosstribe-eval-nbc5sw". Corrected.
#    2. Its backup instructions told you to run `git push` ON
#       ERIDUOS-VDI — which has no GitHub access (established and fixed
#       across every playbook earlier this session, e.g. PB-109
#       reconciled). Corrected: push happens from the laptop after
#       scp'ing results back.
#
#  Confirmed: crates/urnammu-attestationd does NOT exist in this repo —
#  this playbook's crate scaffold has never actually been run against
#  this checkout. Built and verified it compiles cleanly in a sandbox
#  before shipping this file (5 dead-code warnings expected — every
#  function is an intentional todo!() stub per BC-SEC-001 §6).
# ════════════════════════════════════════════════════════════════════════════
- name: "PB-110 (Reconciled) | Session Deliverables — UrNammu / Nisaba / Kittu"
  hosts: localhost
  connection: local
  gather_facts: true

  vars:
    forge_root:        "{{ ansible_env.HOME }}/Forge/EnkiDB"
    workspace:          "{{ forge_root }}/workspace/bahyway_v4"
    cargo:               "{{ ansible_env.HOME }}/.cargo/bin/cargo"
    crates_dir:          "{{ workspace }}/crates"
    docs_dir:            "{{ forge_root }}/docs/SHEDU"
    kickstart_dir:       "{{ forge_root }}/eriduos/kickstart/includes"
    session_date:        "{{ ansible_date_time.date }}"
    glossary_file:       "{{ docs_dir }}/GLOSSARY_ADDENDUM_{{ session_date }}.md"
    nisaba_kittu_file:   "{{ docs_dir }}/NISABA_KITTU_SECURITY_INTERFACE_{{ session_date }}.md"
    kickstart_fragment:  "{{ kickstart_dir }}/99-urnammu-hardware-trust.ks"
    attestation_crate:   "urnammu-attestationd"
    report_file:         "{{ docs_dir }}/PB110_SESSION_REPORT_{{ session_date }}.txt"
    forge_branch:        "claude/iphone-playbooks-crosstribe-eval-nbc5sw"

  tasks:

    - name: "PREP | Ensure docs/SHEDU directory exists"
      ansible.builtin.file: { path: "{{ docs_dir }}", state: directory, mode: "0755" }

    - name: "PREP | Ensure kickstart/includes directory exists"
      ansible.builtin.file: { path: "{{ kickstart_dir }}", state: directory, mode: "0755" }

    - name: "PREP | Ensure crates directory exists"
      ansible.builtin.file: { path: "{{ crates_dir }}", state: directory, mode: "0755" }

    - name: "VERIFY | Workspace present (scp'd from laptop)"
      ansible.builtin.stat:
        path: "{{ workspace }}/Cargo.toml"
      register: ws_check

    - name: "FAIL | Workspace not synced — run the laptop-side sync first"
      ansible.builtin.fail:
        msg: >
          {{ workspace }}/Cargo.toml not found on this host. EriduOS-VDI has
          no GitHub access. On your Fedora laptop: git pull origin
          {{ forge_branch }}, then scp -r workspace/bahyway_v4
          bahaa@eriduos-vdi:{{ workspace }}. Re-run this playbook after that.
      when: not ws_check.stat.exists

    # ── 1. Glossary Addendum ────────────────────────────────────────────────
    - name: "WRITE | Glossary Addendum"
      ansible.builtin.copy:
        dest: "{{ glossary_file }}"
        mode: "0644"
        content: |
          # BahyWay.Ecosystem v4.0 — Glossary Addendum
          Generated by PB-110 on {{ session_date }} | Node: {{ ansible_hostname }}
          Source: BC-SEC-001 (UrNammu Engine) + follow-on Nisaba/Kittu decisions

          | Term | Definition |
          |---|---|
          | **UrNammu Engine** | 4th SHEDU security pillar — Hardware Trust Layer. Boot integrity (Secure Boot + TPM measured boot), port/peripheral control (usbguard via AkkadiRulesEngine ABAC), DMA/Thunderbolt protection (IOMMU), runtime attestation written as KAKI Event particles via KISPU. Named for King Ur-Nammu, author of the earliest known law code. Document of record: BC-SEC-001. |
          | **Kittu Engine** | Notification/delivery engine. Consumes Nisaba's signed Alert Event KAKI particles and handles delivery — v1 is internal-only (dashboard via ShoWEngine + email, no telephony). Writes delivery confirmation back as its own KAKI Event. Named for the Mesopotamian god of truth/justice, attendant of Shamash. Deliberately NOT "Kakka" — phonetic collision with "KAKI" in Arabic, risk of stakeholder confusion. |
          | **Nisaba — expanded role** | Originally: sovereign agent generating TUPSARRU art at Stage 7 of E-DUBBA. NEW: also the sovereign interface/detector for the Security Layer — subscribes to Security-tribe KAKI particles in EnkiSDB, evaluates for rule violations, emits signed Alert Event KAKI on confirmation. Detects/declares only — does NOT handle delivery (that's Kittu Engine). |
          | **-Way -> -Engine (v4.0 naming convention)** | The "-Way" suffix is fully deprecated in v4.0. All components use "-Engine": AkkadiSafeEngine, AkkadiRulesEngine, AkkadiCipherEngine. ShoWEngine was already correctly named. |
          | **EnkiSDB — dual role** | "Stage Database" (ETL staging) also serves as the Security particle landing zone. No rename needed — KISPU's four-way atomic commit already matches the security-event shape. ETL-stage and security-stage particles are distinguished by tribe_id, not separate databases. |
          | **Security KAKI particle types** | TPM attestation -> kaki_type=0x02 Event, kaki_role=0x02 ZIKRU. usbguard device decision -> kaki_type=0x03 CrossTribe, kaki_role=0x03 PARZU. AkkadiCipherEngine seal/unseal -> kaki_type=0x02 Event, kaki_role=0x02 ZIKRU. AkkadiSafeEngine vault unlock attempt -> kaki_type=0x02 Event, kaki_role=0x01 KISHIB. |

          ---
          *Append-only addendum — does not replace the canonical KAKI v4.0 byte layout or core Glossary.*

    # ── 2. Nisaba <-> Kittu security-interface note ─────────────────────────
    - name: "WRITE | Nisaba <-> Kittu Security Interface Note"
      ansible.builtin.copy:
        dest: "{{ nisaba_kittu_file }}"
        mode: "0644"
        content: |
          # Nisaba <-> Kittu Engine — Security Alert Flow
          Standalone architecture note | {{ session_date }} | Node: {{ ansible_hostname }}
          Status: confirmed, not yet folded into BC-SEC-001

          ## Flow

          1. Security KAKI particle lands in EnkiSDB
          2. Nisaba evaluates — rule-violation pattern OR existing topological/colour anomaly trigger
          3. Violation confirmed -> Nisaba emits a signed Alert Event KAKI
          4. Kittu Engine consumes Alert Events
          5. Delivery (v1, internal-only): Dashboard via ShoWEngine + email, no telephony
          6. Delivery confirmation written back as its own KAKI Event -> closes the loop immutably

          ## Separation of concerns

          Nisaba: detection + declaration only.
          Kittu Engine: delivery only.

          ## Open items

          - Kittu Engine email/dashboard split implementation
          - Confirm whether Kittu Engine lives in SHEDU or as a standalone member
          - Decide whether/when to fold this note into BC-SEC-001 as a new section

    # ── 3. UrNammu kickstart fragment ───────────────────────────────────────
    - name: "WRITE | UrNammu hardware-trust kickstart fragment"
      ansible.builtin.copy:
        dest: "{{ kickstart_fragment }}"
        mode: "0644"
        content: |
          # 99-urnammu-hardware-trust.ks — EriduOS v4.0 UrNammu Engine kickstart include
          # Source: BC-SEC-001 §5

          %packages
          usbguard
          tpm2-tools
          tpm2-abrmd
          %end

          %post
          if grep -q "GenuineIntel" /proc/cpuinfo; then
            grubby --update-kernel=ALL --args="intel_iommu=on iommu=pt"
          elif grep -q "AuthenticAMD" /proc/cpuinfo; then
            grubby --update-kernel=ALL --args="amd_iommu=on iommu=pt"
          fi
          systemctl enable usbguard
          systemctl enable tpm2-abrmd
          %end

    # ── 4. Scaffold the boot-attestation daemon crate (verified compiles) ──
    - name: "CHECK | Does {{ attestation_crate }} crate already exist?"
      ansible.builtin.stat:
        path: "{{ crates_dir }}/{{ attestation_crate }}/Cargo.toml"
      register: crate_stat

    - name: "SCAFFOLD | cargo new --bin {{ attestation_crate }}"
      ansible.builtin.command:
        cmd: "{{ cargo }} new --bin {{ attestation_crate }}"
        chdir: "{{ crates_dir }}"
      when: not crate_stat.stat.exists
      register: cargo_new_result
      changed_when: cargo_new_result.rc == 0

    - name: "WRITE | Stub main.rs (BC-SEC-001 §6 responsibilities)"
      ansible.builtin.copy:
        dest: "{{ crates_dir }}/{{ attestation_crate }}/src/main.rs"
        mode: "0644"
        content: |
          //! urnammu-attestationd
          //! Boot-attestation daemon — UrNammu Engine (SHEDU sector)
          //! Source of truth: BC-SEC-001 §6
          #![forbid(unsafe_code)]

          fn read_pcr_state() -> Result<Vec<u8>, String> {
              todo!("read current TPM PCR state")
          }

          fn compare_to_baseline(_observed: &[u8]) -> bool {
              todo!("compare observed PCR state to sealed baseline")
          }

          fn emit_attestation_event_kaki(_result: bool) {
              todo!("emit Event KAKI via KISPU commit")
          }

          fn gate_boot_handoff(_attestation_passed: bool) {
              todo!("gate display-manager handoff on attestation result")
          }

          fn runtime_recheck_loop() {
              todo!("runtime attestation interval loop")
          }

          fn main() {
              println!("urnammu-attestationd: stub — see BC-SEC-001 S6 for design");
          }

    - name: "PATCH | Register {{ attestation_crate }} in workspace Cargo.toml members"
      ansible.builtin.lineinfile:
        path: "{{ workspace }}/Cargo.toml"
        insertafter: '^members = \['
        line: '    "crates/{{ attestation_crate }}",'
        state: present

    - name: "BUILD | cargo build -p {{ attestation_crate }}"
      ansible.builtin.command:
        cmd: "{{ cargo }} build -p {{ attestation_crate }}"
        chdir: "{{ workspace }}"
      register: build_out
      changed_when: false
      failed_when: build_out.rc != 0

    - name: "WRITE | Dated report file"
      ansible.builtin.copy:
        dest: "{{ report_file }}"
        mode: "0644"
        content: |
          BahyWay.Ecosystem v4.0 — PB-110 Session Deliverables Report (Reconciled)
          Date      : {{ session_date }}
          Node      : {{ ansible_hostname }}
          Workspace : {{ workspace }}

          Files written:
            {{ glossary_file }}
            {{ nisaba_kittu_file }}
            {{ kickstart_fragment }}
            {{ crates_dir }}/{{ attestation_crate }}/src/main.rs

          Workspace Cargo.toml updated: added "crates/{{ attestation_crate }}"
          Build result: {{ 'PASS' if build_out.rc == 0 else 'FAIL' }}

          Manual step still required:
            Copy BC-SEC-001_UrNammu_Engine.docx into {{ docs_dir }} if you want
            it alongside these files (not reproduced by this playbook).

    - name: "GIT | Status (informational only — no git push happens on this host)"
      ansible.builtin.command:
        cmd: "git status --short"
        chdir: "{{ forge_root }}"
      register: git_status
      changed_when: false
      failed_when: false

    - name: "PRINT | Git status"
      ansible.builtin.debug:
        msg: "{{ git_status.stdout_lines | default(['(git not usable here)']) }}"

    - name: "PRINT | Backup instructions (corrected — no git push on eriduos-vdi)"
      ansible.builtin.debug:
        msg: |
          ═══════════════════════════════════════════════════════════════════
          NEXT STEPS (run manually):
          ═══════════════════════════════════════════════════════════════════
          1. Copy these deliverables back to your laptop, then push from there:
               (on eriduos-vdi) scp -r {{ docs_dir }} {{ kickstart_dir }} \
                 {{ crates_dir }}/{{ attestation_crate }} <you>@<laptop>:~/Forge/EnkiDB/...
               (on laptop)      git add -A && git commit -m "PB-110 deliverables {{ session_date }}" \
                                 && git push origin {{ forge_branch }}
          2. Local backup, if you have a target mounted (adjust path):
               rsync -avz --progress {{ docs_dir }}/ /path/to/your/backup/target/
          Report saved to: {{ report_file }}
          ═══════════════════════════════════════════════════════════════════

    - name: "DONE | PB-110 Reconciled COMPLETE"
      ansible.builtin.debug:
        msg: "PB-110 complete — report at {{ report_file }}"
