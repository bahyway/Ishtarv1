# =============================================================================
# PB-580 — The Alaa Doctrine: Concept Seal (GL-ISR-002-A1)
# BahyWay.Ecosystem v4.0 — 2026-08-23
#
# WHY THIS PLAYBOOK EXISTS
#   Seals GL-ISR-002-A1, the Medium Independence Theorem: SaadounShape
#   (asymmetric response under multi-frequency excitation carving a
#   hidden form's membrane) binds over any wave-bearing medium M,
#   provided a per-medium quadruple (Theta_M, D_M, T_M, witnesses_M)
#   and floor epsilon_M are declared before witnessing -- the physics
#   of M is a parameter, never a change to the law. Charters two
#   daughter courts (Body, Ground) under an inviolable Clinician Clause
#   and a Dignity Clause for post-conflict ground, and keeps verdict
#   invariance (never-averaged, WITHHELD-FLAT, Unnamed Surface) across
#   every sea.
#
#   Landed from a standalone Architect-supplied upload (2026-08-23),
#   evaluated file-by-file against this repo before landing and
#   RENUMBERED per this repo's standing rule: the source deposit's own
#   PB-ISR-003 -> PB-580 here. See
#   shala-prototypes/batch15_alaa_kinu_kulla_harvest/README.md for the
#   full renumbering table and the open dependency-gap note (this
#   tablet amends GL-ISR-002, which is not yet landed in this repo).
#
# WHAT THIS PLAYBOOK DOES
#   PROVEs the tablet's own Medium Independence Theorem (S2), the
#   Excitation Clause (S3), the two daughter-court charters with their
#   inviolable clauses (S4-S5), and Verdict Invariance (S7) are sealed
#   verbatim. PROVEs the Sala court renders the three-seas proclamation
#   and the daughter-court acts. Deposits nothing new -- docs and Sala
#   tab are committed directly into docs/ and shala-prototypes/, this
#   playbook is a pointer/verification record.
#
# Running this playbook = CSR-08 confirmation. Review -> --check -> live.
# =============================================================================

- name: "PB-580 | Seal the Alaa Doctrine (GL-ISR-002-A1)"
  hosts: localhost
  connection: local
  become: false
  vars:
    repo_root: "{{ playbook_dir }}/.."
    tablet_file: "{{ repo_root }}/docs/09_observatory/GL-ISR-002-A1_Alaa_Doctrine.md"
    court_file: "{{ repo_root }}/shala-prototypes/batch15_alaa_kinu_kulla_harvest/sala_gl_isr_002_a1_alaa_three_seas.html"

  tasks:

    - name: "0.1 | Confirm the tablet and the Sala court are landed"
      ansible.builtin.stat:
        path: "{{ item }}"
      register: land_stat
      loop:
        - "{{ tablet_file }}"
        - "{{ court_file }}"
      loop_control: { label: "{{ item }}" }

    - name: "FAIL | required file missing"
      ansible.builtin.fail:
        msg: "{{ item.item }} not found -- nothing to seal."
      loop: "{{ land_stat.results }}"
      loop_control: { label: "{{ item.item }}" }
      when: not item.stat.exists

    - name: "1.1 | PROVE the Medium Independence Theorem is sealed verbatim"
      ansible.builtin.shell: |
        set -e
        grep -qF "SaadounShape binds over any wave-bearing medium M" "{{ tablet_file }}"
        grep -qF "parameter of the quadruple, never a change to the law" "{{ tablet_file }}"
        echo "PROVEN: the Medium Independence Theorem is sealed"
      register: prove_theorem
      changed_when: false

    - name: "1.2 | PROVE the Excitation Clause is sealed"
      ansible.builtin.shell: |
        set -e
        grep -qF "the informant to be read" "{{ tablet_file }}"
        grep -qF "no hand of the witness shaped the wave" "{{ tablet_file }}"
        echo "PROVEN: natural excitation over active sourcing is sealed"
      register: prove_excitation
      changed_when: false

    - name: "1.3 | PROVE the two daughter courts and their inviolable clauses are chartered"
      ansible.builtin.shell: |
        set -e
        grep -qF "Daughter Court I: The Body Court" "{{ tablet_file }}"
        grep -qF "The Clinician Clause (inviolable)" "{{ tablet_file }}"
        grep -qF "feeds evidence to clinicians" "{{ tablet_file }}"
        grep -qF "Daughter Court II: The Ground Court" "{{ tablet_file }}"
        grep -qF "The Dignity Clause:" "{{ tablet_file }}"
        grep -qF "The Ground Court serves families" "{{ tablet_file }}"
        echo "PROVEN: the Clinician Clause and the Dignity Clause are both sealed"
      register: prove_daughters
      changed_when: false

    - name: "1.4 | PROVE Verdict Invariance is sealed"
      ansible.builtin.shell: |
        set -e
        grep -qF "verdicts are discrete and never averaged" "{{ tablet_file }}"
        grep -qF "WITHHELD-FLAT" "{{ tablet_file }}"
        grep -qF "insufficient coverage yields Unnamed Surface, never interpolation" "{{ tablet_file }}"
        echo "PROVEN: verdict invariance holds across every medium"
      register: prove_invariance
      changed_when: false

    - name: "1.5 | PROVE the Sala court renders the three-seas proclamation and both daughter courts"
      ansible.builtin.shell: |
        set -e
        grep -qF "Alaa" "{{ court_file }}"
        grep -qF "BODY COURT" "{{ court_file }}"
        grep -qF "GROUND COURT" "{{ court_file }}"
        grep -qF "Dignity Clause" "{{ court_file }}"
        grep -qF "Clinician Clause" "{{ court_file }}"
        echo "PROVEN: the three-seas court renders the doctrine, both daughter courts, and their inviolable clauses"
      register: prove_court
      changed_when: false

    - name: "2.1 | Report"
      ansible.builtin.debug:
        msg: >
          PB-580 complete. GL-ISR-002-A1 sealed: SaadounShape is
          medium-independent by declared quadruple, natural excitation
          is read as informant rather than removed as noise, the Body
          and Ground daughter courts are chartered under their
          inviolable Clinician and Dignity clauses, and verdict
          invariance (never-averaged, WITHHELD-FLAT, Unnamed Surface)
          holds in every sea. Renumbered from the source deposit's
          PB-ISR-003; see
          shala-prototypes/batch15_alaa_kinu_kulla_harvest/README.md
          for the full renumbering table and the open note that this
          tablet's own parent, GL-ISR-002 (SaadounShape), is not yet
          landed in this repo's docs/09_observatory/.
