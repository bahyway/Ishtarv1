# =============================================================================
# PB-569 — Temennu Baseline & Rigmu Escalation: Concept Seal (GL-NSR-001-A1)
# BahyWay.Ecosystem v4.0 — 2026-08-21
#
# WHY THIS PLAYBOOK EXISTS
#   Seals GL-NSR-001-A1, amending MARKASU-01 (GL-NSR-001, PB-568) with
#   two doctrines. The Temennu Baseline replaces a universal theta_min
#   with a per-tribe foundation deposit (theta_0 = median, s_0 = MAD
#   over an enrollment window, Kidinnu-sealed, re-laid only by decree
#   -- automatic re-baselining is forbidden as the mechanism by which a
#   slackening system teaches its own watchman to sleep). The alert
#   witnesses are re-founded as relative/directional (LEVEL: theta <
#   kappa*theta_0; TREND: Mann-Kendall + Sen's slope, with horizon
#   T_theta journaled as a countdown). The Rigmu Escalation routes
#   severity by state class: FUZZY tribes ring MARKASU, GOLDEN tribes
#   ring RIGMU -- the great cry, which freezes Gate G4 promotions and
#   cannot be closed without a signed two-witness explanation particle.
#
#   Landed from a parallel Claude session's Sat20260815 thread,
#   evaluated file-by-file against this repo before landing and
#   RENUMBERED per this repo's standing rule: the other session's own
#   PB-331 -> PB-569 here. See
#   shala-prototypes/batch12_nasaru_saturday_courts/README.md for the
#   full renumbering table. No dedicated Sala rehearsal was delivered
#   for this amendment (it amends the Markasu court's underlying model,
#   not its rendering) -- see PB-568/shala_markasu_court*.html for the
#   staged instrument this amendment governs.
#
# WHAT THIS PLAYBOOK DOES
#   PROVEs the tablet's own four stated law tests (L5-L8, continuing
#   the base tablet's L1-L4 numbering) are present verbatim, and PROVEs
#   the Temennu immutability clause and the Rigmu freeze-and-explain
#   obligation are sealed. Deposits nothing new -- the tablet is
#   committed directly into docs/, this playbook is a pointer/
#   verification record.
#
# Running this playbook = CSR-08 confirmation. Review -> --check -> live.
# =============================================================================

- name: "PB-569 | Seal the Temennu Baseline & Rigmu Escalation (GL-NSR-001-A1)"
  hosts: localhost
  connection: local
  become: false
  vars:
    repo_root: "{{ playbook_dir }}/.."
    tablet_file: "{{ repo_root }}/docs/09_observatory/GL-NSR-001-A1_Temennu_Rigmu.md"
    base_tablet: "{{ repo_root }}/docs/09_observatory/GL-NSR-001_Markasu_Alert_Law.md"

  tasks:

    - name: "0.1 | Confirm this amendment and the base MARKASU tablet it amends are both landed"
      ansible.builtin.stat:
        path: "{{ item }}"
      register: land_stat
      loop:
        - "{{ tablet_file }}"
        - "{{ base_tablet }}"
      loop_control: { label: "{{ item }}" }

    - name: "FAIL | required file missing"
      ansible.builtin.fail:
        msg: "{{ item.item }} not found -- nothing to seal."
      loop: "{{ land_stat.results }}"
      loop_control: { label: "{{ item.item }}" }
      when: not item.stat.exists

    - name: "1.1 | PROVE the tablet's own four law tests (L5-L8) are sealed"
      ansible.builtin.shell: |
        set -e
        grep -qF "L5** Temennu never auto-relays" "{{ tablet_file }}"
        grep -qF "L6** trend-only or level-only never rings" "{{ tablet_file }}"
        grep -qF "L7** step-change fires the integrity flag" "{{ tablet_file }}"
        grep -qF "L8** RIGMU refuses to close without a signed explanation particle" "{{ tablet_file }}"
        echo "PROVEN: L5-L8 all present"
      register: prove_law_tests
      changed_when: false

    - name: "1.2 | PROVE the Temennu immutability clause is sealed"
      ansible.builtin.shell: |
        set -e
        grep -qF "θ₀ = median(θ̂)" "{{ tablet_file }}"
        grep -qF "re-laid" "{{ tablet_file }}"
        grep -qF "Automatic re-baselining is forbidden" "{{ tablet_file }}"
        echo "PROVEN: Temennu median/MAD founding and the automatic-re-baselining-forbidden clause sealed"
      register: prove_temennu
      changed_when: false

    - name: "1.3 | PROVE the Rigmu freeze-and-explain obligation is sealed"
      ansible.builtin.shell: |
        set -e
        grep -qF "GOLDEN tribes of EnkiDB·7004 or EnkiDW·7005 → RIGMU" "{{ tablet_file }}"
        grep -qF "Freeze:" "{{ tablet_file }}"
        grep -qF "no silent close" "{{ tablet_file }}"
        grep -qF "Architect- or Madanu-signed" "{{ tablet_file }}"
        echo "PROVEN: FUZZY-to-MARKASU/GOLDEN-to-RIGMU severity router, Gate G4 freeze, and no-silent-close obligation all sealed"
      register: prove_rigmu
      changed_when: false

    - name: "2.1 | Report"
      ansible.builtin.debug:
        msg: >
          PB-569 complete. GL-NSR-001-A1 sealed: the Temennu per-tribe
          baseline (median/MAD, Kidinnu-sealed, immutable except by
          Madanu or Shakkanakku-survey decree), the re-founded LEVEL/
          TREND witness pair with the T_theta countdown horizon, and
          the Rigmu Escalation (FUZZY tribes ring MARKASU; GOLDEN
          tribes ring RIGMU, freezing Gate G4 promotions and refusing
          to close without a signed two-witness W5H2 explanation) all
          hold, proven against the tablet's own four stated law tests
          L5-L8. Renumbered from the source session's PB-331; see
          shala-prototypes/batch12_nasaru_saturday_courts/README.md for
          the full renumbering table.
