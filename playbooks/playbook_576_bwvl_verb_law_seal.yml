# =============================================================================
# PB-576 — The BWVL Verb Law: Concept Seal (GL-VSL-001)
# BahyWay.Ecosystem v4.0 — 2026-08-21
#
# WHY THIS PLAYBOOK EXISTS
#   Seals GL-VSL-001, the constitution of BWVL as an acting language:
#   WITNESS (render what is, may enter NĀRU), REHEARSE (simulate what
#   may come, every frame watermarked SIMULATION, never journaled as
#   events, only as forecasts with epsilon -- introduces the Shape
#   Horizon T_shape, completing the countdown grammar alongside T* and
#   T_theta), and PROPOSE (draft repairs as dashed ghost previews --
#   MEND, EXCISE-UNWITNESSED, REWEAVE, RE-MOOR -- each terminating in
#   SEND-TO-BENCH). The law of the tablet: BWVL has no APPLY. A
#   visualization language that could mutate particles would be a
#   steward without a bench; the Bell Veto (GL-DST-004, PB-573) cannot
#   be painted over.
#
#   Landed from a parallel Claude session's Sun20260816 thread,
#   evaluated file-by-file against this repo before landing and
#   RENUMBERED per this repo's standing rule: the other session's own
#   PB-337 -> PB-576 here. See
#   shala-prototypes/batch13_sunday_shape_labiru_courts/README.md for
#   the full renumbering table.
#
# WHAT THIS PLAYBOOK DOES
#   PROVEs the tablet's own four stated law tests (L24-L27) are
#   present, PROVEs the no-APPLY law and the SEND-TO-BENCH termination
#   are sealed verbatim, and PROVEs the Sala theater renders all three
#   verb families plus the SIMULATION watermark. Deposits nothing new
#   -- docs and Sala tab are committed directly into docs/ and
#   shala-prototypes/, this playbook is a pointer/verification record.
#
# Running this playbook = CSR-08 confirmation. Review -> --check -> live.
# =============================================================================

- name: "PB-576 | Seal the BWVL Verb Law (GL-VSL-001)"
  hosts: localhost
  connection: local
  become: false
  vars:
    repo_root: "{{ playbook_dir }}/.."
    tablet_file: "{{ repo_root }}/docs/09_observatory/GL-VSL-001_BWVL_Verb_Law.md"
    court_file: "{{ repo_root }}/shala-prototypes/batch13_sunday_shape_labiru_courts/shala_bwvl_theater.html"

  tasks:

    - name: "0.1 | Confirm the tablet and the Sala theater are landed"
      ansible.builtin.stat:
        path: "{{ item }}"
      register: land_stat
      loop:
        - "{{ tablet_file }}"
        - "{{ court_file }}"
      loop_control: { label: "{{ item }}" }

    - name: "FAIL | required file missing"
      ansible.builtin.fail:
        msg: "{{ item.item }} not found -- nothing to seal."
      loop: "{{ land_stat.results }}"
      loop_control: { label: "{{ item.item }}" }
      when: not item.stat.exists

    - name: "1.1 | PROVE the tablet's own four law tests (L24-L27) are sealed"
      ansible.builtin.shell: |
        set -e
        grep -qF "L24" "{{ tablet_file }}"
        grep -qF "L25" "{{ tablet_file }}"
        grep -qF "L26" "{{ tablet_file }}"
        grep -qF "L27" "{{ tablet_file }}"
        grep -qF "a proposal cannot mutate the tribe" "{{ tablet_file }}"
        grep -qF "T_shape is monotone non-increasing in juggler fraction" "{{ tablet_file }}"
        echo "PROVEN: L24-L27 all present with their named assertions"
      register: prove_law_tests
      changed_when: false

    - name: "1.2 | PROVE the no-APPLY law and SEND-TO-BENCH termination are sealed"
      ansible.builtin.shell: |
        set -e
        grep -qF "BWVL has no APPLY" "{{ tablet_file }}"
        grep -qF "Every BWVL proposal terminates in SEND-TO-BENCH" "{{ tablet_file }}"
        grep -qF "The Bell Veto cannot be painted over" "{{ tablet_file }}"
        grep -qF "Shape Horizon T_shape" "{{ tablet_file }}"
        echo "PROVEN: the missing-APPLY law, SEND-TO-BENCH termination, and Shape Horizon T_shape are sealed"
      register: prove_verb_law
      changed_when: false

    - name: "1.3 | PROVE the Sala theater renders all three verb families and the SIMULATION watermark"
      ansible.builtin.shell: |
        set -e
        grep -qF "WITNESS" "{{ court_file }}"
        grep -qF "REHEARSE" "{{ court_file }}"
        grep -qF "PROPOSE" "{{ court_file }}"
        grep -qF "SIMULATION" "{{ court_file }}"
        grep -qF "T_shape" "{{ court_file }}"
        grep -qF "MEND" "{{ court_file }}"
        echo "PROVEN: WITNESS/REHEARSE/PROPOSE, the SIMULATION watermark, T_shape, and the MEND repair ghost all render"
      register: prove_theater
      changed_when: false

    - name: "2.1 | Report"
      ansible.builtin.debug:
        msg: >
          PB-576 complete. GL-VSL-001 sealed: the three verb families
          (WITNESS/REHEARSE/PROPOSE), the Shape Horizon T_shape
          completing the T*/T_theta countdown grammar, the four
          canonical repair proposals (MEND/EXCISE-UNWITNESSED/REWEAVE/
          RE-MOOR), and the missing fourth verb -- BWVL has no APPLY,
          every proposal terminates in SEND-TO-BENCH, the Bell Veto
          cannot be painted over -- all hold, proven against the
          tablet's own four stated law tests L24-L27. The Sala theater
          renders all three verb families with the SIMULATION
          watermark. Renumbered from the source session's PB-337; see
          shala-prototypes/batch13_sunday_shape_labiru_courts/README.md
          for the full renumbering table.
