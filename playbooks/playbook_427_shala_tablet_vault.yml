---
# PB-427 · shala_tablet_vault · DRAFT (BahyWay.Ecosystem v4.0 finalization suite)
# Running this playbook is the Architect's CSR-08 confirmation. Nothing is law until run.
#
# 2026-08-24: the SOURCE tablet drafts live in the Architect's own personal
# research area (Forge/bahyway_v4, a separate repo -- NOT this one), not in
# EnkiDB. Only the sealed OUTPUT (shala_vault) belongs inside this repo's
# workspace/bahyway_v4. Override dialyworks_root with -e if your drafts
# live somewhere else.
- name: "PB-427 · seal & deploy the Šala tablet vault (all prototype tablets + index + sha256)"
  hosts: uruk
  vars:
    dialyworks_root: /home/bfadam/Forge/bahyway_v4/docs/__DialyWorks
  tasks:
    - name: vault dir
      ansible.builtin.command:
        cmd: "mkdir -p {{ playbook_dir }}/../workspace/bahyway_v4/shala_vault"
        creates: "{{ playbook_dir }}/../workspace/bahyway_v4/shala_vault"
    - name: copy tablets
      ansible.builtin.command:
        cmd: "bash -c 'cp {{ dialyworks_root }}/Tu20260811/shala_*.html {{ playbook_dir }}/../workspace/bahyway_v4/shala_vault/'"
    - name: seal with sha256
      ansible.builtin.command:
        cmd: "bash -c 'cd {{ playbook_dir }}/../workspace/bahyway_v4/shala_vault && sha256sum shala_*.html > SEALS.sha256'"
    - name: index tablet
      ansible.builtin.copy:
        dest: "{{ playbook_dir }}/../workspace/bahyway_v4/shala_vault/INDEX.md"
        content: |
          # Šala Tablet Vault · v4.0 finalization
          Courts: tremor v1–5 · asalluhi v6–8 · structure v1–2 · catenoid · vgca · flight deck v1–2 · golden store v1–12 · igigi watch v1–2
          All tablets are PROTOTYPES (Way of Work rule 5); production = DubSar Theater.
    - name: journal (NARU discipline)
      ansible.builtin.lineinfile:
        path: "{{ playbook_dir }}/../workspace/bahyway_v4/NARU.journal"
        line: "{{ ansible_date_time.iso8601 }} · PB-427 · Šala vault sealed"
        create: yes
