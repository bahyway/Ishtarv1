---
# PB-427 · shala_tablet_vault · DRAFT (BahyWay.Ecosystem v4.0 finalization suite)
# Running this playbook is the Architect's CSR-08 confirmation. Nothing is law until run.
- name: "PB-427 · seal & deploy the Šala tablet vault (all prototype tablets + index + sha256)"
  hosts: uruk
  tasks:
    - name: vault dir
      ansible.builtin.command:
        cmd: "mkdir -p /home/bfadam/Forge/bahyway_v4/shala_vault"
        creates: /home/bfadam/Forge/bahyway_v4/shala_vault
    - name: copy tablets
      ansible.builtin.command:
        cmd: "bash -c 'cp /home/bfadam/Forge/bahyway_v4/docs/__DialyWorks/Tu20260811/shala_*.html /home/bfadam/Forge/bahyway_v4/shala_vault/'"
    - name: seal with sha256
      ansible.builtin.command:
        cmd: "bash -c 'cd /home/bfadam/Forge/bahyway_v4/shala_vault && sha256sum shala_*.html > SEALS.sha256'"
    - name: index tablet
      ansible.builtin.copy:
        dest: /home/bfadam/Forge/bahyway_v4/shala_vault/INDEX.md
        content: |
          # Šala Tablet Vault · v4.0 finalization
          Courts: tremor v1–5 · asalluhi v6–8 · structure v1–2 · catenoid · vgca · flight deck v1–2 · golden store v1–12 · igigi watch v1–2
          All tablets are PROTOTYPES (Way of Work rule 5); production = DubSar Theater.
    - name: journal (NARU discipline)
      ansible.builtin.lineinfile:
        path: /home/bfadam/Forge/bahyway_v4/NARU.journal
        line: "{{ ansible_date_time.iso8601 }} · PB-427 · Šala vault sealed"
        create: yes
