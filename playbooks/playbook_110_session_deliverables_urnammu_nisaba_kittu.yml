---
# ════════════════════════════════════════════════════════════════════════════
#  playbook_110_session_deliverables_urnammu_nisaba_kittu.yml
#  BahyWay.Ecosystem v4.0 — Session Deliverables Drop
#  (Glossary Addendum + Security-Layer Docs + Kickstart Fragment + Crate Scaffold)
#
#  SCP to EriduOS-VDI then run:
#    ansible-playbook playbook_110_session_deliverables_urnammu_nisaba_kittu.yml
#
#  Covers the UrNammu Engine (BC-SEC-001) design phase and the follow-on
#  Nisaba/Kittu security-interface decisions. This is a design-phase drop,
#  NOT a claimed ansible PB slot (see RM-001 §"A Note on Numbering" —
#  an earlier draft mislabeled this "Playbook 99"; that was corrected).
#
#  Revision note (this version, pre-first-run corrections):
#    - forge_root assumes ~/Forge/EnkiDB on the VDI is a git clone of
#      bahyway/enkidb, checked out on branch
#      claude/iphone-session-playbook-review-pzrrr7 — verify this before
#      running, or the GIT | Status task and backup instructions won't
#      point at the right branch.
#    - urnammu-attestationd is scaffolded as a standalone new crate only.
#      It is NOT wired into the existing shedu-engine or nisaba crates in
#      this repo (workspace/bahyway_v4/crates/) — that integration is
#      deliberately left for a later playbook.
#    - Added a task to register the new crate in the workspace Cargo.toml
#      members list (workspace/bahyway_v4/Cargo.toml uses an explicit
#      members array, not a glob — without this, `cargo build --workspace`
#      would silently skip the new crate).
#    - Fixed the backup-instructions git push target branch, which
#      previously hardcoded a stale/unrelated branch name.
#
#  What it does:
#    1. Creates docs/SHEDU and kickstart/includes directories if missing
#    2. Writes a Glossary Addendum (.md) — all new/renamed terms this session
#    3. Writes the Nisaba <-> Kittu security-interface note (.md)
#    4. Writes the UrNammu hardware-trust kickstart fragment (.ks)
#    5. Scaffolds the urnammu-attestationd Rust crate (cargo new + stubs)
#    6. Registers the new crate in the workspace Cargo.toml members list
#    7. Prints a consolidated deliverables report to terminal
#    8. Writes a dated report file
#    9. git status on the forge repo
#   10. Prints the backup command sequence (run manually on VMLAB SSD)
# ════════════════════════════════════════════════════════════════════════════
- name: "PB-110 | Session Deliverables — UrNammu / Nisaba / Kittu"
  hosts: localhost
  connection: local
  gather_facts: true

  vars:
    forge_root:        "{{ ansible_env.HOME }}/Forge/EnkiDB"
    workspace:          "{{ forge_root }}/workspace/bahyway_v4"
    cargo:               "{{ ansible_env.HOME }}/.cargo/bin/cargo"
    crates_dir:          "{{ workspace }}/crates"
    docs_dir:            "{{ forge_root }}/docs/SHEDU"
    kickstart_dir:       "{{ forge_root }}/eriduos/kickstart/includes"
    session_date:        "{{ ansible_date_time.date }}"
    glossary_file:       "{{ docs_dir }}/GLOSSARY_ADDENDUM_{{ session_date }}.md"
    nisaba_kittu_file:   "{{ docs_dir }}/NISABA_KITTU_SECURITY_INTERFACE_{{ session_date }}.md"
    kickstart_fragment:  "{{ kickstart_dir }}/99-urnammu-hardware-trust.ks"
    attestation_crate:   "urnammu-attestationd"
    report_file:         "{{ docs_dir }}/PB110_SESSION_REPORT_{{ session_date }}.txt"
    forge_branch:        "claude/iphone-session-playbook-review-pzrrr7"

  tasks:

    # ── Ensure target directories exist ────────────────────────────────────
    - name: "PREP  | Ensure docs/SHEDU directory exists"
      ansible.builtin.file:
        path: "{{ docs_dir }}"
        state: directory
        mode: "0755"

    - name: "PREP  | Ensure kickstart/includes directory exists"
      ansible.builtin.file:
        path: "{{ kickstart_dir }}"
        state: directory
        mode: "0755"

    - name: "PREP  | Ensure crates directory exists"
      ansible.builtin.file:
        path: "{{ crates_dir }}"
        state: directory
        mode: "0755"

    # ── 1. Glossary Addendum ────────────────────────────────────────────────
    - name: "WRITE | Glossary Addendum"
      ansible.builtin.copy:
        dest: "{{ glossary_file }}"
        mode: "0644"
        content: |
          # BahyWay.Ecosystem v4.0 — Glossary Addendum
          Generated by PB-110 on {{ session_date }} | Node: {{ ansible_hostname }}
          Source: BC-SEC-001 (UrNammu Engine) + follow-on Nisaba/Kittu decisions

          | Term | Definition |
          |---|---|
          | **UrNammu Engine** | 4th SHEDU security pillar — Hardware Trust Layer. Boot integrity (Secure Boot + TPM measured boot), port/peripheral control (usbguard via AkkadiRulesEngine ABAC), DMA/Thunderbolt protection (IOMMU), runtime attestation written as KAKI Event particles via KISPU. Named for King Ur-Nammu, author of the earliest known law code. Document of record: BC-SEC-001. |
          | **Kittu Engine** | Notification/delivery engine. Consumes Nisaba's signed Alert Event KAKI particles and handles delivery — v1 is internal-only (dashboard via ShoWEngine + email, no telephony). Writes delivery confirmation back as its own KAKI Event. Named for the Mesopotamian god of truth/justice, attendant of Shamash. Deliberately NOT "Kakka" — phonetic collision with "KAKI" in Arabic, risk of stakeholder confusion. |
          | **Nisaba — expanded role** | Originally: sovereign agent generating ṬUPŠARRU art at Stage 7 of É-DUBBA (triggers: β₁>0, β₀ deviation, ColourID hue variance). NEW: also the sovereign interface/detector for the Security Layer — subscribes to Security-tribe KAKI particles in EnkiSDB (UrNammu attestation events, AkkadiRulesEngine usbguard decisions, AkkadiCipherEngine seal/unseal events), evaluates for rule violations, emits signed Alert Event KAKI on confirmation. Detects/declares only — does NOT handle delivery (that's Kittu Engine). |
          | **-Way → -Engine (v4.0 naming convention)** | The "-Way" suffix is FULLY DEPRECATED in v4.0, including the prior exception for Security Policy Language files. All components use "-Engine": AkkadiSafeEngine, AkkadiRulesEngine, AkkadiCipherEngine. ShoWEngine was already correctly named. |
          | **EnkiSDB — dual role** | "Stage Database" (ETL staging) now also serves as the Security particle landing zone. No rename needed — KISPU's four-way atomic commit already matches the security-event shape (land → commit). ETL-stage and security-stage particles are distinguished by `tribe_id`, not by separate databases. |
          | **Security KAKI particle types** | TPM attestation → kaki_type=0x02 Event, kaki_role=0x02 ZIKRU. usbguard device decision → kaki_type=0x03 CrossTribe, kaki_role=0x03 PARZU. AkkadiCipherEngine seal/unseal → kaki_type=0x02 Event, kaki_role=0x02 ZIKRU. AkkadiSafeEngine vault unlock attempt → kaki_type=0x02 Event, kaki_role=0x01 KISHIB. |

          ---
          *Append-only addendum — does not replace the canonical KAKI v4.0 byte layout or core Glossary. See BC-SEC-001 for full Hardware Trust Layer architecture.*

    # ── 2. Nisaba <-> Kittu security-interface note ─────────────────────────
    - name: "WRITE | Nisaba <-> Kittu Security Interface Note"
      ansible.builtin.copy:
        dest: "{{ nisaba_kittu_file }}"
        mode: "0644"
        content: |
          # Nisaba <-> Kittu Engine — Security Alert Flow
          Standalone architecture note | {{ session_date }} | Node: {{ ansible_hostname }}
          Status: confirmed, not yet folded into BC-SEC-001

          ## Flow

          1. Security KAKI particle lands in EnkiSDB
             (UrNammu Engine attestation event / AkkadiRulesEngine usbguard decision /
             AkkadiCipherEngine seal-unseal event)
          2. Nisaba evaluates — rule-violation pattern OR existing topological/colour
             anomaly trigger (β₁>0, β₀ deviation, ColourID hue variance)
          3. Violation confirmed -> Nisaba emits a signed Alert Event KAKI
             (severity, rule_id, tribe_id, evidence particle refs)
          4. Kittu Engine consumes Alert Events
          5. Delivery (v1, internal-only):
             - Dashboard surfacing via ShoWEngine
             - Email to security team
             - NO telephony / external API in v1
          6. Delivery confirmation written back as its own KAKI Event
             -> closes the loop immutably

          ## Separation of concerns

          Nisaba: detection + declaration only.
          Kittu Engine: delivery only.
          This mirrors the single-responsibility pattern already used across the
          agent roster (TamuzAI = code, EaAgent = math, AdadAI = ingestion,
          NINSUN = healing/refinement).

          ## Example HeptaScript query (Anti-SQL — W5H2)

          ```
          PRESENT
            WHO:   tribe_id
            WHAT:  EAV.decision
            WHEN:  today
            WHERE: kaki_type = CrossTribe AND EAV.device_class = "mass_storage"
            HOW:   grouped by tribe_id
          ```

          ## Open items

          - Kittu Engine email/dashboard split implementation
          - Confirm whether Kittu Engine lives in SHEDU or as a standalone
            cross-sector notification member
          - Decide whether/when to fold this note into BC-SEC-001 as a new section

    # ── 3. UrNammu kickstart fragment ───────────────────────────────────────
    - name: "WRITE | UrNammu hardware-trust kickstart fragment"
      ansible.builtin.copy:
        dest: "{{ kickstart_fragment }}"
        mode: "0644"
        content: |
          # ════════════════════════════════════════════════════════════════
          # 99-urnammu-hardware-trust.ks
          # EriduOS v4.0 — UrNammu Engine kickstart include
          # Source: BC-SEC-001 §5
          # Include from the main EriduOS kickstart with: %include 99-urnammu-hardware-trust.ks
          # ════════════════════════════════════════════════════════════════

          %packages
          usbguard
          tpm2-tools
          tpm2-abrmd
          %end

          %post
          # Enable IOMMU at boot — branch on CPU vendor, do not hard-code one path
          if grep -q "GenuineIntel" /proc/cpuinfo; then
            grubby --update-kernel=ALL --args="intel_iommu=on iommu=pt"
          elif grep -q "AuthenticAMD" /proc/cpuinfo; then
            grubby --update-kernel=ALL --args="amd_iommu=on iommu=pt"
          fi

          # Default-deny usbguard policy; HID allowed, mass storage blocked
          systemctl enable usbguard

          # Enable TPM measured boot service
          systemctl enable tpm2-abrmd
          %end

    # ── 4. Scaffold the boot-attestation daemon crate ──────────────────────
    - name: "CHECK | Does {{ attestation_crate }} crate already exist?"
      ansible.builtin.stat:
        path: "{{ crates_dir }}/{{ attestation_crate }}/Cargo.toml"
      register: crate_stat

    - name: "SCAFFOLD | cargo new {{ attestation_crate }}"
      ansible.builtin.command:
        cmd: "{{ cargo }} new --bin {{ attestation_crate }}"
        chdir: "{{ crates_dir }}"
      when: not crate_stat.stat.exists
      register: cargo_new_result
      changed_when: cargo_new_result.rc == 0

    # GUARDED (fixed 2026-07-26): this used to run unconditionally on every
    # playbook_110 re-run, silently overwriting main.rs even after
    # playbook_137's reconcile work replaced this stub with a real
    # implementation (mod tpm/baseline/kaki/gate + 11 tests) -- reproduced
    # live on eriduous-vdi: a second PB-110 run clobbered the real main.rs
    # back down to this todo!() stub as an uncommitted local change, which
    # then made PB-137's reconciled playbook fail with "0 tests" for a
    # completely non-obvious reason. Only write the stub when the crate
    # doesn't exist yet; if it's already there (stub or real), leave it
    # alone -- PB-137's own reconcile playbook is what's responsible for
    # replacing a stub with the real implementation, not this one.
    - name: "WRITE | Stub main.rs (BC-SEC-001 §6 responsibilities) — only if the crate doesn't exist yet"
      ansible.builtin.copy:
        dest: "{{ crates_dir }}/{{ attestation_crate }}/src/main.rs"
        mode: "0644"
        content: |
          //! urnammu-attestationd
          //! Boot-attestation daemon — UrNammu Engine (SHEDU sector)
          //! Source of truth: BC-SEC-001 §6 (Boot-Attestation Daemon design sketch)
          //!
          //! Responsibilities (stubbed pending implementation):
          //!   1. Read current PCR state        (tpm2_pcrread via tpm2-tools)
          //!   2. Compare to sealed baseline     (constant-time hash comparison)
          //!   3. Emit Event KAKI                (KISPU four-way atomic commit)
          //!   4. Gate session start (boot path) (block display-manager handoff until PASS)
          //!   5. Re-check on interval (runtime) (systemd timer; failure -> AkkadiRulesEngine)
          #![forbid(unsafe_code)]

          fn read_pcr_state() -> Result<Vec<u8>, String> {
              // TODO: shell out to / bind tpm2-tools (tpm2_pcrread)
              todo!("read current TPM PCR state")
          }

          fn compare_to_baseline(_observed: &[u8]) -> bool {
              // TODO: constant-time comparison against provisioning-time sealed baseline
              todo!("compare observed PCR state to sealed baseline")
          }

          fn emit_attestation_event_kaki(_result: bool) {
              // TODO: construct Event KAKI (kaki_type=0x02, kaki_role=0x02 ZIKRU)
              // and hand to KISPU for the four-way atomic commit:
              // Event KAKI + NATIRU bitmap + zakaru journal + orbital position
              todo!("emit Event KAKI via KISPU commit")
          }

          fn gate_boot_handoff(_attestation_passed: bool) {
              // TODO: block handoff to display manager until commit confirms PASS
              todo!("gate display-manager handoff on attestation result")
          }

          fn runtime_recheck_loop() {
              // TODO: systemd timer-driven interval re-check;
              // failure triggers AkkadiRulesEngine severity policy
              todo!("runtime attestation interval loop")
          }

          fn main() {
              println!("urnammu-attestationd: stub — see BC-SEC-001 SS6 for design");
          }
      when: not crate_stat.stat.exists

    # ── 5. Register the new crate in the workspace Cargo.toml members list ──
    - name: "PATCH | Register {{ attestation_crate }} in workspace Cargo.toml members"
      ansible.builtin.lineinfile:
        path: "{{ workspace }}/Cargo.toml"
        insertafter: '^members = \['
        line: '    "crates/{{ attestation_crate }}",'
        state: present

    # ── Print consolidated deliverables report ──────────────────────────────
    - name: "PRINT | PB-110 Deliverables Report"
      ansible.builtin.debug:
        msg: |
          ╔═══════════════════════════════════════════════════════════════════════╗
          ║   BahyWay.Ecosystem v4.0 — PB-110 Session Deliverables               ║
          ║   Date : {{ session_date }}                                           ║
          ║   Node : {{ ansible_hostname }}                                       ║
          ╠═══════════════════════════════════════════════════════════════════════╣
          ║  DOC   Glossary Addendum            -> {{ glossary_file }}
          ║  DOC   Nisaba<->Kittu interface note -> {{ nisaba_kittu_file }}
          ║  CODE  UrNammu kickstart fragment   -> {{ kickstart_fragment }}
          ║  CODE  {{ attestation_crate }} crate scaffold -> {{ crates_dir }}/{{ attestation_crate }}/
          ║  CODE  Registered in workspace Cargo.toml members
          ╠═══════════════════════════════════════════════════════════════════════╣
          ║  Reminder: BC-SEC-001 (UrNammu Engine ADR, full .docx) was generated  ║
          ║  in-session and is NOT regenerated by this playbook — copy it from    ║
          ║  your downloads into {{ docs_dir }} manually if you want it alongside ║
          ║  these files.                                                         ║
          ╚═══════════════════════════════════════════════════════════════════════╝

    # ── Write dated report file ──────────────────────────────────────────────
    - name: "WRITE | Dated report file"
      ansible.builtin.copy:
        dest: "{{ report_file }}"
        mode: "0644"
        content: |
          BahyWay.Ecosystem v4.0 — PB-110 Session Deliverables Report
          Date      : {{ session_date }}
          Node      : {{ ansible_hostname }}
          Workspace : {{ workspace }}

          Files written:
            {{ glossary_file }}
            {{ nisaba_kittu_file }}
            {{ kickstart_fragment }}
            {{ crates_dir }}/{{ attestation_crate }}/src/main.rs

          Workspace Cargo.toml updated:
            {{ workspace }}/Cargo.toml (added "crates/{{ attestation_crate }}" to members)

          Manual step still required:
            Copy BC-SEC-001_UrNammu_Engine.docx into {{ docs_dir }}
            (generated in-session, not reproduced by this playbook)

    # ── git status ─────────────────────────────────────────────────────────
    - name: "GIT   | Status"
      ansible.builtin.command:
        cmd: "git status --short"
        chdir: "{{ forge_root }}"
      register: git_status
      changed_when: false

    - name: "PRINT | Git status"
      ansible.builtin.debug:
        msg: "{{ git_status.stdout_lines }}"

    # ── Backup instructions ───────────────────────────────────────────────
    - name: "PRINT | Backup instructions"
      ansible.builtin.debug:
        msg: |
          ═══════════════════════════════════════════════════════════════════
          BACKUP SEQUENCE (run manually when ready):
          ═══════════════════════════════════════════════════════════════════

          1. Push to GitHub (from Forge folder):
             cd {{ forge_root }}
             git add -A
             git commit -m "PB-110 session deliverables {{ session_date }}"
             git push origin {{ forge_branch }}

          2. Backup docs to VMLAB SSD:
             rsync -avz --progress \
               {{ docs_dir }}/ \
               /run/media/{{ ansible_env.USER }}/VMLAB/Forge/docs-SHEDU-{{ session_date }}/

          3. Backup kickstart includes:
             rsync -avz --progress \
               {{ kickstart_dir }}/ \
               /run/media/{{ ansible_env.USER }}/VMLAB/Forge/kickstart-includes-{{ session_date }}/

          4. Backup new crate:
             rsync -avz --progress \
               {{ crates_dir }}/{{ attestation_crate }}/ \
               /run/media/{{ ansible_env.USER }}/VMLAB/Forge/crates-{{ attestation_crate }}-{{ session_date }}/

          Report saved to: {{ report_file }}
          ═══════════════════════════════════════════════════════════════════

    - name: "DONE  | PB-110 Session Deliverables COMPLETE"
      ansible.builtin.debug:
        msg: "PB-110 complete — report at {{ report_file }}"
