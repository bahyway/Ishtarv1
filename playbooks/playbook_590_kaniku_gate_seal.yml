# =============================================================================
# PB-590 — Kanīku of the Gate: Concept Seal (GL-REL-001)
# BahyWay.Ecosystem v4.0 — 2026-08-23
#
# WHY THIS PLAYBOOK EXISTS
#   Seals GL-REL-001, the Release Law: open-sourcing is a SUSA act,
#   sealed until all five v4.0 internal completion gates stand green
#   (§3), confirmed only by a numbered playbook run by the Architect
#   on the Fedora bare-metal host (§4), with internal witness (NUZI)
#   always preceding external witness (SUSA, §5), no fragment of the
#   corpus ever crossing alone (§6). Declarations (the Zenodo
#   whitepaper, trademark filings, static sites) remain lawful while
#   the gate holds; disclosures do not (§7). Even fully green gates do
#   not open the arch — they only fire the drafting of GL-REL-002, the
#   Release Rite (§8).
#
#   Promoted from docs/fri20260821-incoming/GL_REL_001/ into
#   docs/09_observatory/ (2026-08-23), after the Architect supplied
#   the tablet's own origin Q&A transcript. See
#   shala-prototypes/batch18_napharu_kaniku_gate/README.md for the
#   full account of what was promoted and what was left in place.
#
# WHAT THIS PLAYBOOK DOES
#   PROVEs the SUSA boundary (§2), the five gate-conditions (§3), the
#   numbered-playbook-only confirmation act (§4), the NUZI-before-SUSA
#   witness order (§5), the no-fragment-crossing clause (§6), and the
#   GL-REL-002 trigger (§8) are all sealed verbatim. PROVEs the Sala
#   court (already present at
#   docs/fri20260821-incoming/GL_REL_001/sala_gl_rel_001_kaniku_gate.html,
#   now also mirrored into shala-prototypes/) renders the sealed arch,
#   the five orbiting gate-conditions, the refused-fragment warning
#   orbit, and the all-green-still-closed trigger. Deposits nothing
#   new -- docs and Sala tab are committed directly into docs/ and
#   shala-prototypes/, this playbook is a pointer/verification record.
#
# Running this playbook = CSR-08 confirmation. Review -> --check -> live.
# =============================================================================

- name: "PB-590 | Seal Kanīku of the Gate (GL-REL-001)"
  hosts: localhost
  connection: local
  become: false
  vars:
    repo_root: "{{ playbook_dir }}/.."
    tablet_file: "{{ repo_root }}/docs/09_observatory/GL-REL-001_Kaniku_of_the_Gate.md"
    court_file: "{{ repo_root }}/shala-prototypes/batch18_napharu_kaniku_gate/sala_gl_rel_001_kaniku_gate.html"

  tasks:

    - name: "0.1 | Confirm the tablet and the Sala court are landed"
      ansible.builtin.stat:
        path: "{{ item }}"
      register: land_stat
      loop:
        - "{{ tablet_file }}"
        - "{{ court_file }}"
      loop_control: { label: "{{ item }}" }

    - name: "FAIL | required file missing"
      ansible.builtin.fail:
        msg: "{{ item.item }} not found -- nothing to seal."
      loop: "{{ land_stat.results }}"
      loop_control: { label: "{{ item.item }}" }
      when: not item.stat.exists

    - name: "1.1 | PROVE the SUSA boundary and the no-partial-credit gate condition are sealed"
      ansible.builtin.shell: |
        set -e
        grep -qF "Open-sourcing is a **SUSA act**" "{{ tablet_file }}"
        grep -qF "The gate remains **sealed** until all v4.0 internal completion gates are green" "{{ tablet_file }}"
        grep -qF "There is no partial credit" "{{ tablet_file }}"
        echo "PROVEN: the SUSA boundary and the gate condition are sealed"
      register: prove_susa
      changed_when: false

    - name: "1.2 | PROVE the numbered-playbook-only confirmation act is sealed"
      ansible.builtin.shell: |
        set -e
        grep -qF "no release may occur except by a numbered PB" "{{ tablet_file }}"
        grep -qF "did not lawfully occur" "{{ tablet_file }}"
        echo "PROVEN: the confirmation act clause is sealed"
      register: prove_confirmation
      changed_when: false

    - name: "1.3 | PROVE the NUZI-before-SUSA witness order and no-fragment-crossing are sealed"
      ansible.builtin.shell: |
        set -e
        grep -qF "First witness (NUZI, inward)" "{{ tablet_file }}"
        grep -qF "Second witness (SUSA, outward)" "{{ tablet_file }}"
        grep -qF "may not testify before the first" "{{ tablet_file }}"
        grep -qF "The body crosses whole, or not at all" "{{ tablet_file }}"
        echo "PROVEN: the witness order and no-fragment-crossing clause are sealed"
      register: prove_witness
      changed_when: false

    - name: "1.4 | PROVE the GL-REL-002 trigger clause (§8) is sealed"
      ansible.builtin.shell: |
        set -e
        grep -qF "this law does not release" "{{ tablet_file }}"
        grep -qF "It instead **fires a trigger**" "{{ tablet_file }}"
        grep -qF "Until GL-REL-002 is" "{{ tablet_file }}"
        echo "PROVEN: the trigger clause is sealed — green gates fire GL-REL-002, they do not open the arch"
      register: prove_trigger
      changed_when: false

    - name: "1.5 | PROVE the Sala court renders the sealed arch, the five gates, and the still-closed trigger"
      ansible.builtin.shell: |
        set -e
        grep -qF "SUSA gate stands sealed" "{{ court_file }}"
        grep -qF "gate-conditions orbit" "{{ court_file }}"
        grep -qF "GL-REL-002" "{{ court_file }}"
        grep -qF "ALL GATES GREEN" "{{ court_file }}"
        grep -qF "The arch does not open" "{{ court_file }}"
        echo "PROVEN: the court renders the sealed arch, the five gates, and the all-green-still-closed rehearsal"
      register: prove_court
      changed_when: false

    - name: "2.1 | Report"
      ansible.builtin.debug:
        msg: >
          PB-590 complete. GL-REL-001 sealed: open-sourcing is a SUSA
          act sealed until five internal completion gates stand green,
          confirmed only by a numbered playbook, NUZI witness always
          before SUSA witness, no fragment ever crossing alone, and
          even a fully green gate only fires the GL-REL-002 trigger
          rather than opening the arch. Promoted from
          docs/fri20260821-incoming/GL_REL_001/; see
          shala-prototypes/batch18_napharu_kaniku_gate/README.md.
