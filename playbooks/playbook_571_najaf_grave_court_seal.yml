# =============================================================================
# PB-571 — The Najaf Grave Court: Concept Seal (GL-NJF-001)
# BahyWay.Ecosystem v4.0 — 2026-08-21
#
# WHY THIS PLAYBOOK EXISTS
#   Seals GL-NJF-001, the Wadi al-Salam chapter of the sensing law:
#   three instruments over a point process of profound density. (i)
#   The Capacity Equation -- Abūbu's horizon inverted (mu=0, graves
#   never release), giving a pure countdown T*_sector = (rho* - rho_0)
#   / lambda to sanctity-capacity exhaustion. (ii) The Qibla-Erosion
#   Rule for lawful vacancy -- dilate graves and buffers by clearance,
#   erode by the grave footprint at its lawful orientation (long axis
#   normal to the ~192° true Qibla bearing, a fixed constant of the
#   erosion, never a free parameter), subtract suitability layers,
#   mint discrete Kidinnu-sealed plots. (iii) The Refusal Clause -- the
#   dignity twin of the UXO clause: an unverifiable old-grave detection
#   is never declared absent or reclaimable; it becomes a protective
#   buffer excluded from vacancy until witnesses arrive or Madanu
#   decrees with the family's standing.
#
#   Landed from a parallel Claude session's Sat20260815 thread,
#   evaluated file-by-file against this repo before landing and
#   RENUMBERED per this repo's standing rule. Unlike the tablet's
#   sibling laws this batch, no source PB file was delivered for this
#   one -- GL-NJF-001 Sec.7 cites "PB-328" in prose only, and no
#   PB-328 file exists anywhere in the source uploads. This playbook
#   is therefore assigned fresh as PB-571 rather than renumbered from
#   an undelivered source. See
#   shala-prototypes/batch12_nasaru_saturday_courts/README.md.
#
# WHAT THIS PLAYBOOK DOES
#   PROVEs the three sealed instruments (capacity countdown,
#   Qibla-erosion construction, refusal clause with its three-state
#   ladder) are present in the tablet, and PROVEs the Sala rehearsal
#   renders the Qibla-erosion and accuracy-ladder content. Deposits
#   nothing new -- docs and Sala tab are committed directly into docs/
#   and shala-prototypes/, this playbook is a pointer/verification
#   record.
#
# Running this playbook = CSR-08 confirmation. Review -> --check -> live.
# =============================================================================

- name: "PB-571 | Seal the Najaf Grave Court (GL-NJF-001)"
  hosts: localhost
  connection: local
  become: false
  vars:
    repo_root: "{{ playbook_dir }}/.."
    tablet_file: "{{ repo_root }}/docs/09_observatory/GL-NJF-001_Najaf_Grave_Court.md"
    court_file: "{{ repo_root }}/shala-prototypes/batch12_nasaru_saturday_courts/shala_najaf_grave_court.html"

  tasks:

    - name: "0.1 | Confirm the tablet and the Sala court are landed"
      ansible.builtin.stat:
        path: "{{ item }}"
      register: land_stat
      loop:
        - "{{ tablet_file }}"
        - "{{ court_file }}"
      loop_control: { label: "{{ item }}" }

    - name: "FAIL | required file missing"
      ansible.builtin.fail:
        msg: "{{ item.item }} not found -- nothing to seal."
      loop: "{{ land_stat.results }}"
      loop_control: { label: "{{ item.item }}" }
      when: not item.stat.exists

    - name: "1.1 | PROVE the capacity countdown equation is sealed"
      ansible.builtin.shell: |
        set -e
        grep -qF "T\*_sector = (ρ\* − ρ₀) / λ" "{{ tablet_file }}"
        grep -qF "sanctity capacity" "{{ tablet_file }}"
        echo "PROVEN: the sanctity-capacity countdown equation (mu=0, graves never release) is sealed"
      register: prove_capacity
      changed_when: false

    - name: "1.2 | PROVE the Qibla-erosion construction is sealed with its fixed orientation"
      ansible.builtin.shell: |
        set -e
        grep -qF "normal to the Qibla bearing" "{{ tablet_file }}"
        grep -qF "192° true" "{{ tablet_file }}"
        grep -qF "Orientation is a constant of the erosion, never a free parameter" "{{ tablet_file }}"
        grep -qF "discrete lawful plots" "{{ tablet_file }}"
        echo "PROVEN: Qibla-erosion construction sealed, orientation fixed as a constant, plot-mint output sealed"
      register: prove_erosion
      changed_when: false

    - name: "1.3 | PROVE the three-state refusal clause is sealed (GOLDEN/FUZZY/DEAD)"
      ansible.builtin.shell: |
        set -e
        grep -qF "GOLDEN** — documented and surface-verified" "{{ tablet_file }}"
        grep -qF "FUZZY** — detected, single witness" "{{ tablet_file }}"
        grep -qF "DEAD — this court refuses to issue it" "{{ tablet_file }}"
        grep -qF "protective buffer" "{{ tablet_file }}"
        echo "PROVEN: GOLDEN/FUZZY/DEAD refusal ladder sealed, unverifiable detections route to protective buffer not erasure"
      register: prove_refusal
      changed_when: false

    - name: "1.4 | PROVE the Sala rehearsal renders the Qibla-erosion and accuracy-ladder content"
      ansible.builtin.shell: |
        set -e
        grep -qiF "Qibla" "{{ court_file }}"
        grep -qF "sanctity" "{{ court_file }}"
        grep -qiE "DEAD|GOLDEN|FUZZY" "{{ court_file }}"
        echo "PROVEN: Qibla erosion, sanctity capacity, and the GOLDEN/FUZZY/DEAD ladder render in the deployed court"
      register: prove_court
      changed_when: false

    - name: "2.1 | Report"
      ansible.builtin.debug:
        msg: >
          PB-571 complete. GL-NJF-001 sealed: the sanctity-capacity
          countdown (Abūbu's horizon inverted for a non-releasing
          point process), the Qibla-erosion lawful-vacancy construction
          with orientation fixed as a constant of the erosion, the
          honest accuracy ladder, and the three-state refusal clause
          (GOLDEN documented+verified / FUZZY single-witness-queued /
          DEAD refused-and-buffered, never erased) all hold. The Sala
          rehearsal renders the Qibla-erosion and GOLDEN/FUZZY/DEAD
          ladder. Freshly numbered PB-571 -- no source PB file was
          ever delivered for this tablet (GL-NJF-001 Sec.7 cites
          "PB-328" in prose only); see
          shala-prototypes/batch12_nasaru_saturday_courts/README.md.
