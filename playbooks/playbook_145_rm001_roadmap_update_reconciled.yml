          | 139 | ninsun_refiner_wire | NINSUN — progressive refiner | REAL (`ninsun-agent`, separate earlier session) |
          | 140 | edubba_seal_integration | É-DUBBA — 6-stage integration test | RECONCILED |
          | 141 | ashnan_regional_extension | ASHNAN — Jordan/Syria/Fertile Crescent | RECONCILED |
          | 142 | namtar_domain_scaffold | NAMTAR — sacred burial | IMPLEMENTED (namtar-kaki, 4 tests) |
          | 143 | ereskigal_domain_scaffold | EREŠKIGAL — informal settlement | IMPLEMENTED (ereskigal-kaki, 4 tests) |
          | 144 | grafana_monitoring_setup | Grafana+Prometheus on dubsar-workstation | CONFIGS READY, deploy BLOCKED (no live hardware) |
          | 145 | rm001_roadmap_update | This document (v2) | RECONCILED |

          ---

          ## Genuine remaining gaps (confirmed absent, not just unverified)

          1. **INANA series** — entirely fabricated in the original PB-145 draft. No crate, no doc, no design. Would need to be designed from scratch if wanted.
          2. **NARAMSIN regression pass** — no dedicated 7-archive-corpus regression suite exists as its own artifact.
          3. **DubSar Theater scenes** for ESARHADDON and ASHNAN — Godot visualization work, not started.
          4. **Field ruggedisation** — mesh radio transport, battery-backup field node — not started.
          5. **Real EnkiDDB (Documentation DB) and EnkiMDB (Metadata DB)** in the Architect's actual intended sense — `enkidb-recovery` and `enkidb-quantdb` are legitimate crates but were mislabeled onto those two port slots by a prior session; the real Documentation/Metadata databases (to back MetaEngine and TemplateEngine respectively) don't exist yet. Explicitly deferred by the Architect to a future session.
          6. **Nergal AV backend** — design-only: a manual spec (`BAHYWAY_ECOSYSTEM_MANUAL_V4.md` §16) and a client-side Three.js prototype exist; no scanning backend, no DubSar IDE freeze/jam hooks, no website firewall.
          7. **SLA Layer resolution** — naming conflict between `sla-engine` (app go-live governance) and `client-dq-profile` (the one actually wired into bee-watchdog, tagged "BeeMDM §SLA") never resolved.
          8. **EnkiDB storage engine rearchitecture** — `PersistedDb` still does full journal-replay on open, `MmapReader` is not actually memory-mapped (eager `fs::read()`). This is the real blocker for 1B+ particle scale, and it's exactly the scope of ADR-012 (Data Files Law) written earlier this session — architecture is documented, implementation has not started.

          ---

          *End of RM-001 Addendum v2 (Reconciled) — PB-111 to PB-145*

    # ── Deployment reference ────────────────────────────────────────────────
    - name: "WRITE | Deployment Reference (reconciled v2)"
      ansible.builtin.copy:
        dest: "{{ deploy_ref }}"
        mode: "0644"
        content: |
          # BahyWay.Ecosystem v4.0 — Playbook Deployment Reference (Reconciled v2)
          ## SCP Transfer + ansible-playbook Launch Commands
          Generated: {{ session_date }}

          This reference lists playbooks that actually exist in the repo as
          reconciled *_reconciled.yml files. It does not list PB-119-136 as
          playbook files (they never existed as files), but see the RM-001
          addendum v2 above for what content in that range is real anyway.

          ---

          ## Infrastructure Overview

          | Node | IP | Role | Run playbooks FROM |
          |------|----|------|--------------------|
          | Fedora laptop (Host) | — | GitHub remote, download point | — |
          | eriduous-vdi | {{ eriduous_ip }} | Dev control plane, ansible runner | FROM eriduous-vdi (scp'd from laptop) |
          | enkidb-node-write | {{ node_write_ip }} | CQRS write path | FROM eriduous-vdi |
          | enkidb-node-read  | {{ node_read_ip }} | CQRS read path  | FROM eriduous-vdi |
          | dubsar-workstation | {{ monitor_ip }} | Grafana+Prometheus ONLY | FROM eriduous-vdi |

          ## Sync convention

          eriduous-vdi has no GitHub access. Workflow is always:
            1. On the laptop: git pull origin {{ target_branch }}
            2. scp -r workspace/bahyway_v4 bahaa@eriduos-vdi:~/Forge/EnkiDB/workspace/bahyway_v4
            3. scp playbooks/*_reconciled.yml bahaa@eriduos-vdi:~/playbooks/
            4. ssh bahaa@eriduos-vdi, then: ansible-playbook <name>_reconciled.yml -i "localhost," -c local -v

          ## Playbooks confirmed to exist — PB-111 to PB-145

          111, 112, 113, 114, 115, 116, 117, 118 (blocked), 137, 138, 139, 140,
          141, 142, 143, 144 (configs ready, deploy blocked), 145.

          ## Special Notes

          **PB-98 MUST run before PB-111** — the KISPU fix is the prerequisite
          for the performance gate.

          **PB-144** generates real Grafana/Prometheus configs locally
          regardless of hardware; remote deploy only runs if dubsar-workstation
          is reachable on SSH + the target ports.

          **PB-140** requires both EnkiDB nodes running and the ASHNAN test
          corpus present.

          ---
          *BahyWay.Ecosystem v4.0 — Sovereign, Pure Rust, Offline*

    # ── NĀRU session-close record ───────────────────────────────────────────
    - name: "NĀRU  | Append session-close record"
      ansible.builtin.lineinfile:
        path: "{{ naru_journal }}"
        line: >-
          {{ session_date }}|SESSION_CLOSE|PB_SERIES=111-145|
          modules=NANSHE/ASHNAN/ESARHADDON/NARAMSIN/UrNammu/Kittu/NINSUN/NAMTAR/ERESKIGAL/BlackBoxStation/StorageSector|
          platform=E-DUBBA-6stage+CQRS+KISPU+enkidb-query-server+BIGRING|
          gap=INANA_FABRICATED,NARAMSIN_REGRESSION_SUITE,DUBSAR_THEATER_SCENES,FIELD_RUGGEDISATION,REAL_ENKIDDB_ENKIMDB,NERGAL_AV_BACKEND,SLA_LAYER,ENKIDB_STORAGE_ENGINE|
          status=RECONCILED_V2
        create: true
        mode: "0644"

    - name: "PRINT | PB-145 v2 Final Summary"
      ansible.builtin.debug:
        msg: |
          BahyWay.Ecosystem v4.0 — PB-145 Reconciled v2 RM-001 Roadmap Update
          Date : {{ session_date }}

          RM-001 addendum v2 : {{ rm001_addendum }}
          Deploy reference   : {{ deploy_ref }}
          NARU journal       : session-close record appended (corrected status)

          Corrected from v1: most of PB-119-136's intended content (ESARHADDON
          core, ASHNAN TIAMAT formulas, ingest wiring, quarantine routing,
          NINSUN) is REAL, built via a separate session's PR #17/#18 — not
          missing. INANA remains fully fabricated, no such work exists.

          BACKUP SEQUENCE (run on your LAPTOP, not eriduos-vdi — eriduos-vdi
          has no GitHub access):
            cd ~/Forge/EnkiDB
            git add -A
            git commit -m "PB-145 v2 reconciled roadmap update {{ session_date }}"
            git push origin {{ target_branch }}
          Then scp any new docs/config back down to eriduos-vdi if needed.

    - name: "WRITE | Deliverables report"
      ansible.builtin.copy:
        dest: "{{ report_file }}"
        mode: "0644"
        content: |
          BahyWay.Ecosystem v4.0 — PB-145 Reconciled v2 Report
          Date  : {{ session_date }}

          Deliverables:
            {{ rm001_addendum }}
            {{ deploy_ref }}
            NARU journal session-close record

          Corrected from v1 of this reconciliation:
            - Most of PB-119-136's content is REAL (ESARHADDON, ASHNAN
              TIAMAT, ingest wiring, BlackBox/Storage Sector, NINSUN),
              built via a separate session's PR #17/#18, re-verified
              directly against this repo (288 test suites, 0 failures)
            - INANA confirmed fully fabricated — no such work exists anywhere
            - Genuine remaining gaps listed explicitly, not lumped together
              with the work that's already done

    - name: "DONE  | PB-145 Reconciled v2 COMPLETE"
      ansible.builtin.debug:
        msg: "PB-145 reconciled v2 — corrected against real merged work. Report: {{ report_file }}"
