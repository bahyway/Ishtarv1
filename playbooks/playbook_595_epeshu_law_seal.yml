# =============================================================================
# PB-595 — The Epēšu Law: Concept Seal (GL-HSQ-001)
# BahyWay.Ecosystem v4.0 — 2026-08-23
#
# WHY THIS PLAYBOOK EXISTS
#   Seals GL-HSQ-001: every Arsenal member is enrolled as a GOLDEN
#   particle in EnkiMDB's algebra_schema, carrying its equation, gloss,
#   theorem, proof-obligation ledger, and source_sha umbilical (§1).
#   HeptaScript gains two sovereign clause families -- WITNESS LAW
#   (quote the shelf) and REIFY LAW AS ... (make it into one of five
#   lawfully-named vessels: SIPRU/NEPESU/LIBITTU/MASSARTU/SIKNU, §2-3)
#   -- with REIFY without PROVE refused outright (§4, "a snippet
#   without its obligations is a rumor"), reification always copying
#   rather than linking live so old vessels never silently change
#   their law (§5), and codegen strictly design-time via AkkadianAOL
#   with Z3 at G4 -- no runtime evaluation of equation text, ever (§6).
#
#   Landed from a standalone Architect-supplied upload (2026-08-23),
#   evaluated file-by-file against this repo before landing and
#   RENUMBERED per this repo's standing rule: the source deposit's own
#   PB-HSQ-001 -> PB-595 here. See
#   shala-prototypes/batch19_adannu_askuppu_kisru_asakku_epeshu/README.md
#   for the full renumbering table. This tablet's own embedded court
#   data referenced GL-ALG-003 for the Askuppu shelf entry -- corrected
#   to GL-ALG-005 in the landed copy, matching the collision fix
#   applied to the Askuppu tablet itself (see playbook_592's header).
#
# WHAT THIS PLAYBOOK DOES
#   PROVEs the tablet's own four stated proof obligations (HSQ-PO-1
#   through HSQ-PO-4) are named, PROVEs the GOLDEN Shelf Clause, the
#   Inherited-Proof Clause, the Copy-Bound Clause, and the Design-Time
#   Clause are sealed verbatim. PROVEs the Sala court (the Epēšu
#   Court) renders WITNESS LAW, REIFY LAW, and a refusal act with no
#   PROVE clause. Deposits nothing new -- docs and Sala tab are
#   committed directly into docs/ and shala-prototypes/, this playbook
#   is a pointer/verification record.
#
# Running this playbook = CSR-08 confirmation. Review -> --check -> live.
# =============================================================================

- name: "PB-595 | Seal the Epēšu Law (GL-HSQ-001)"
  hosts: localhost
  connection: local
  become: false
  vars:
    repo_root: "{{ playbook_dir }}/.."
    tablet_file: "{{ repo_root }}/docs/09_observatory/GL-HSQ-001_Epeshu_Law.md"
    court_file: "{{ repo_root }}/shala-prototypes/batch19_adannu_askuppu_kisru_asakku_epeshu/sala_gl_hsq_001_epeshu_court.html"

  tasks:

    - name: "0.1 | Confirm the tablet and the Sala court are landed"
      ansible.builtin.stat:
        path: "{{ item }}"
      register: land_stat
      loop:
        - "{{ tablet_file }}"
        - "{{ court_file }}"
      loop_control: { label: "{{ item }}" }

    - name: "FAIL | required file missing"
      ansible.builtin.fail:
        msg: "{{ item.item }} not found -- nothing to seal."
      loop: "{{ land_stat.results }}"
      loop_control: { label: "{{ item.item }}" }
      when: not item.stat.exists

    - name: "1.1 | PROVE the tablet's own four proof obligations (HSQ-PO-1..4) are named"
      ansible.builtin.shell: |
        set -e
        grep -qF "HSQ-PO-1" "{{ tablet_file }}"
        grep -qF "HSQ-PO-2" "{{ tablet_file }}"
        grep -qF "HSQ-PO-3" "{{ tablet_file }}"
        grep -qF "HSQ-PO-4" "{{ tablet_file }}"
        echo "PROVEN: HSQ-PO-1..4 all present"
      register: prove_pos
      changed_when: false

    - name: "1.2 | PROVE the GOLDEN Shelf Clause is sealed"
      ansible.builtin.shell: |
        set -e
        grep -qF "GOLDEN in the sealed EAV sense" "{{ tablet_file }}"
        grep -qF "amendments enroll NEW particles beside their" "{{ tablet_file }}"
        echo "PROVEN: the GOLDEN Shelf Clause is sealed"
      register: prove_shelf
      changed_when: false

    - name: "1.3 | PROVE the Inherited-Proof Clause is sealed verbatim"
      ansible.builtin.shell: |
        set -e
        grep -qF "REIFY without PROVE is refused" "{{ tablet_file }}"
        grep -qF "A snippet without its obligations is a rumor" "{{ tablet_file }}"
        echo "PROVEN: the Inherited-Proof Clause is sealed"
      register: prove_inherited
      changed_when: false

    - name: "1.4 | PROVE the Copy-Bound and Design-Time clauses are sealed"
      ansible.builtin.shell: |
        set -e
        grep -qF "Reification copies; it never links live" "{{ tablet_file }}"
        grep -qF "No runtime evaluation of equation text, ever" "{{ tablet_file }}"
        echo "PROVEN: the Copy-Bound and Design-Time clauses are sealed"
      register: prove_bound
      changed_when: false

    - name: "1.5 | PROVE the Sala court renders WITNESS LAW, REIFY LAW, and a PROVE-less refusal"
      ansible.builtin.shell: |
        set -e
        grep -qF "WITNESS LAW" "{{ court_file }}"
        grep -qF "REIFY LAW" "{{ court_file }}"
        grep -qF "GOLDEN" "{{ court_file }}"
        grep -qF "REFUSED" "{{ court_file }}"
        echo "PROVEN: the Epēšu Court renders the summon/make acts and the PROVE-less refusal"
      register: prove_court
      changed_when: false

    - name: "2.1 | Report"
      ansible.builtin.debug:
        msg: >
          PB-595 complete. GL-HSQ-001 sealed: every Arsenal law is a
          GOLDEN algebra_schema particle carrying its equation, theorem,
          and proof ledger; HeptaScript can WITNESS a law as a snippet
          or REIFY it into one of five sovereign vessels; REIFY without
          PROVE is refused outright; reification copies bind to a
          source_sha and never link live; codegen is design-time only,
          no runtime equation evaluation ever. Renumbered from the
          source deposit's PB-HSQ-001; see
          shala-prototypes/batch19_adannu_askuppu_kisru_asakku_epeshu/README.md
          for the full renumbering table.
