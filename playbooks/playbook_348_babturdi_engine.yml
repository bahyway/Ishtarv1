# =============================================================================
# PB-348 — BabTurdiEngine, verified (GL-NRG-001-A2)
# BahyWay.Ecosystem v4.0 — Nergal AV outer-ledger analytics
#
# CHANGED during landing (2026-08-21), same reasoning already applied
# throughout this integration — see docs/mon20260817-incoming/README.md
# and playbook_322's own header for precedent:
#   - Original draft targeted `hosts: bahyway_host` and assumed the repo
#     lives at /home/bahaa/BahyWay.Ecosystem/v4.0 — neither is real; the
#     actual repo resolves via playbook_dir, and the real host alias is
#     `uruk` (ansible/inventory.ini).
#   - Original draft scaffolded the crate under services/nergal/babturdi-
#     engine and deposited the tablet into a tablets/ directory — neither
#     convention exists elsewhere in this repo. Landed instead at
#     workspace/bahyway_v4/crates/babturdi-engine (workspace member) and
#     docs/18_security/GL-NRG-001-A2-babturdi-engine.md.
#   - One real bug found and fixed: `cohort_median` took the upper of the
#     two middle values for an even-sized cohort, which for exactly two
#     clients collapses the median to the costlier client's own cost —
#     that client could never exceed its own cost, so L63 always passed
#     it as LowCostEarned regardless of how costly it was. Fixed to
#     average the two middle values (the standard even-count median).
#   - Since the crate now exists as real, committed, compiling, tested
#     source under version control, this playbook does NOT re-materialize
#     it from embedded YAML text on every run. It verifies instead.
#
# Running this playbook = CSR-08 confirmation that the BabTurdiEngine is
# landed and its law tests pass — not a rubber-stamped deploy.
# =============================================================================
---
- name: "PB-348 | Verify — BabTurdiEngine (GL-NRG-001-A2) landed and passing"
  hosts: uruk
  become: false
  vars:
    repo_root: "{{ playbook_dir }}/.."
    ws: "{{ repo_root }}/workspace/bahyway_v4"
    crate_dir: "{{ ws }}/crates/babturdi-engine"

  tasks:

    - name: "VERIFY | crate files present"
      ansible.builtin.stat:
        path: "{{ crate_dir }}/{{ item }}"
      register: file_check
      loop:
        - Cargo.toml
        - src/lib.rs
        - tests/law_tests.rs
      loop_control: { label: "{{ item }}" }

    - name: "FAIL | a crate file is missing"
      ansible.builtin.fail:
        msg: "{{ item.item }} not found at {{ crate_dir }} -- crate incomplete."
      loop: "{{ file_check.results }}"
      loop_control: { label: "{{ item.item }}" }
      when: not item.stat.exists

    - name: "VERIFY | crate is a real workspace member"
      ansible.builtin.command: grep -q '"crates/babturdi-engine"' {{ ws }}/Cargo.toml
      register: member_check
      changed_when: false
      failed_when: member_check.rc != 0

    - name: "VERIFY | cargo test -p babturdi-engine passes"
      ansible.builtin.command: cargo test -p babturdi-engine
      args:
        chdir: "{{ ws }}"
      register: test_run
      changed_when: false

    - name: "FAIL | law tests did not pass"
      ansible.builtin.fail:
        msg: "cargo test -p babturdi-engine failed (rc={{ test_run.rc }}): {{ test_run.stdout }}"
      when: test_run.rc != 0

    - name: "DONE | PB-348 complete"
      ansible.builtin.debug:
        msg: >-
          BabTurdiEngine verified: {{ crate_dir }}, a real member of the
          bahyway_v4 workspace, cargo test -p babturdi-engine passing (4
          law tests: L61 no-contamination-boundary, L62 cost-carries-tau,
          L63 above-median-not-earned, L64 windows-never-averaged).
          GL-NRG-001-A2 is committed at
          docs/18_security/GL-NRG-001-A2-babturdi-engine.md.
