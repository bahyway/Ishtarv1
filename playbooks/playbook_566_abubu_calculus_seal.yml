# =============================================================================
# PB-566 — The Abūbu Calculus: Concept Seal (GL-ALG-003)
# BahyWay.Ecosystem v4.0 — 2026-08-21
#
# WHY THIS PLAYBOOK EXISTS
#   Seals GL-ALG-003, the membrane-rupture calculus: compliance
#   coefficient kappa_M bounded [0,1] with the Rigid Decree at 0 and
#   Yield Normalization at 1, the strain-regime ladder (Elastic ->
#   Plastic -> Rupture), the critical-density equation rho*, the
#   horizon equation T* (Ornstein-Uhlenbeck-adjacent breath dynamics),
#   and the quarantine clause that demotes high-rupture-risk verdicts
#   to FUZZY and routes them to EnkiQDB pending Madanu decree. Hosted
#   under NinurtaEngine's truth tier per GL-PHY-001; the theater-tier
#   Sala rehearsal (trembling springs) is explicitly never truth
#   (GL-DST-001).
#
#   Landed from a parallel Claude session's Sat20260815 thread,
#   evaluated file-by-file against this repo before landing and
#   RENUMBERED per this repo's standing rule: the other session's own
#   PB-327 -> PB-566 here. See
#   shala-prototypes/batch12_nasaru_saturday_courts/README.md for the
#   full renumbering table.
#
# WHAT THIS PLAYBOOK DOES
#   PROVEs the tablet's own six stated Law Tests (L1-L6) are present
#   verbatim, and PROVEs both Sala rehearsal builds (v1 and the
#   corrected v2) carry the regime-ladder and horizon-equation content
#   markers. Deposits nothing new -- docs and Sala tab are committed
#   directly into docs/ and shala-prototypes/, this playbook is a
#   pointer/verification record.
#
# Running this playbook = CSR-08 confirmation. Review -> --check -> live.
# =============================================================================

- name: "PB-566 | Seal the Abūbu Calculus (GL-ALG-003)"
  hosts: localhost
  connection: local
  become: false
  vars:
    repo_root: "{{ playbook_dir }}/.."
    tablet_file: "{{ repo_root }}/docs/09_observatory/GL-ALG-003_Abubu_Calculus.md"
    batch_dir: "{{ repo_root }}/shala-prototypes/batch12_nasaru_saturday_courts"

  tasks:

    - name: "0.1 | Confirm the tablet and both court builds are landed"
      ansible.builtin.stat:
        path: "{{ item }}"
      register: land_stat
      loop:
        - "{{ tablet_file }}"
        - "{{ batch_dir }}/shala_abubu_court.html"
        - "{{ batch_dir }}/shala_abubu_court_v2.html"
      loop_control: { label: "{{ item }}" }

    - name: "FAIL | required file missing"
      ansible.builtin.fail:
        msg: "{{ item.item }} not found -- nothing to seal."
      loop: "{{ land_stat.results }}"
      loop_control: { label: "{{ item.item }}" }
      when: not item.stat.exists

    - name: "1.1 | PROVE the tablet's own six Law Tests (L1-L6) are sealed verbatim"
      ansible.builtin.shell: |
        set -e
        grep -qF "L1 — Rigid Decree" "{{ tablet_file }}"
        grep -qF "L2 — Compliance monotonicity" "{{ tablet_file }}"
        grep -qF "L3 — Safe breath" "{{ tablet_file }}"
        grep -qF "L4 — Horizon monotonicity" "{{ tablet_file }}"
        grep -qF "L5 — Quarantine" "{{ tablet_file }}"
        grep -qF "L6 — Regime ladder" "{{ tablet_file }}"
        echo "PROVEN: L1-L6 all present"
      register: prove_law_tests
      changed_when: false

    - name: "1.2 | PROVE the compliance bounds and quarantine threshold are sealed as written"
      ansible.builtin.shell: |
        set -e
        grep -qF "κ_min = 0 — the Rigid Decree" "{{ tablet_file }}"
        grep -qF "κ_max = 1 — the Yield Normalization" "{{ tablet_file }}"
        grep -qF "default ε_Q = 0.05" "{{ tablet_file }}"
        echo "PROVEN: kappa_M bounds [0,1] and default quarantine threshold epsilon_Q=0.05 sealed"
      register: prove_bounds
      changed_when: false

    - name: "1.3 | PROVE both court builds render the regime ladder and the horizon countdown"
      ansible.builtin.shell: |
        set -e
        for f in shala_abubu_court.html shala_abubu_court_v2.html; do
          grep -qF "κ_M" "{{ batch_dir }}/$f"
          grep -qF "Rupture" "{{ batch_dir }}/$f"
          grep -qF "T\*" "{{ batch_dir }}/$f"
        done
        echo "PROVEN: kappa_M compliance field, Rupture regime label, and T* horizon countdown all render in v1 and v2"
      register: prove_court
      changed_when: false

    - name: "2.1 | Report"
      ansible.builtin.debug:
        msg: >
          PB-566 complete. GL-ALG-003 sealed: the compliance coefficient
          kappa_M with its Rigid Decree (kappa=0, never ruptures) and
          Yield Normalization (kappa=1) bounds, the Elastic/Plastic/
          Rupture regime ladder, the critical-density and horizon
          equations, and the quarantine clause (default epsilon_Q=0.05,
          demote to FUZZY, route to EnkiQDB, NĀRU-witnessed, Madanu
          decree required to release) all hold, proven against the
          tablet's own six stated law tests L1-L6. Both the buggy v1
          and corrected v2 Sala rehearsals render the regime ladder and
          horizon countdown. Renumbered from the source session's
          PB-327; see
          shala-prototypes/batch12_nasaru_saturday_courts/README.md for
          the full renumbering table.
