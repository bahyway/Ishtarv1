# =============================================================================
# PB-584 — The Saadoun Calculus: Concept Seal (GL-ISR-001)
# BahyWay.Ecosystem v4.0 — 2026-08-23
#
# WHY THIS PLAYBOOK EXISTS
#   Seals GL-ISR-001, founding the Saadoun Calculus (سعدون): three ISAR
#   methods as one family under GX-004 (Ancestors). SaadounFocus removes
#   Tribe drift with an honesty floor (WITHHELD-SHARP rather than a
#   fabricated sharper image). SaadounWitness mints a scatterer only on
#   two-independent-epoch threshold crossing, refusing one-epoch glint
#   ghosts outright. SaadounOrbit recognizes targets by orbit-bundle
#   topology, not pixels, verdicting the honest UNKNOWN-TRIBE rather
#   than a forced nearest class. All three: discrete verdicts, never
#   averaged (Napharu §4).
#
#   Landed from a standalone Architect-supplied upload (2026-08-23),
#   evaluated file-by-file against this repo before landing and
#   RENUMBERED per this repo's standing rule: the source deposit's own
#   PB-ISR-001 -> PB-584 here. A second, incomplete copy of the same
#   delivery (missing PB-ISR-001 itself) was also received and is not
#   landed separately -- see
#   shala-prototypes/batch16_saadoun_family_puluhtu_deploygate/README.md
#   for the full renumbering table and duplicate note. This tablet is
#   also the direct parent this repo was missing for GL-ISR-002
#   (SaadounShape, landed alongside it in this same batch) and,
#   transitively, for GL-ISR-002-A1 (the Alaa Doctrine, landed in
#   batch15) -- closing part of that batch's open dependency-gap note.
#
# WHAT THIS PLAYBOOK DOES
#   PROVEs the tablet's own four stated proof obligations (ISR-PO-1
#   through ISR-PO-4) are named, PROVEs each son's honesty clause
#   (WITHHELD-SHARP, two-epoch minting refusal, UNKNOWN-TRIBE) is
#   sealed verbatim, and PROVEs the Sala court stages all three sons in
#   family order. Deposits nothing new -- docs and Sala tab are
#   committed directly into docs/ and shala-prototypes/, this playbook
#   is a pointer/verification record.
#
# Running this playbook = CSR-08 confirmation. Review -> --check -> live.
# =============================================================================

- name: "PB-584 | Seal the Saadoun Calculus (GL-ISR-001)"
  hosts: localhost
  connection: local
  become: false
  vars:
    repo_root: "{{ playbook_dir }}/.."
    tablet_file: "{{ repo_root }}/docs/09_observatory/GL-ISR-001_Saadoun_Calculus.md"
    court_file: "{{ repo_root }}/shala-prototypes/batch16_saadoun_family_puluhtu_deploygate/sala_gl_isr_001_saadoun_sons.html"

  tasks:

    - name: "0.1 | Confirm the tablet and the Sala court are landed"
      ansible.builtin.stat:
        path: "{{ item }}"
      register: land_stat
      loop:
        - "{{ tablet_file }}"
        - "{{ court_file }}"
      loop_control: { label: "{{ item }}" }

    - name: "FAIL | required file missing"
      ansible.builtin.fail:
        msg: "{{ item.item }} not found -- nothing to seal."
      loop: "{{ land_stat.results }}"
      loop_control: { label: "{{ item.item }}" }
      when: not item.stat.exists

    - name: "1.1 | PROVE the tablet's own four proof obligations (ISR-PO-1..4) are named"
      ansible.builtin.shell: |
        set -e
        grep -qF "ISR-PO-1" "{{ tablet_file }}"
        grep -qF "ISR-PO-2" "{{ tablet_file }}"
        grep -qF "ISR-PO-3" "{{ tablet_file }}"
        grep -qF "ISR-PO-4" "{{ tablet_file }}"
        echo "PROVEN: ISR-PO-1..4 all present"
      register: prove_pos
      changed_when: false

    - name: "1.2 | PROVE GX-004 (Ancestors) and the nasab lineage rule are sealed"
      ansible.builtin.shell: |
        set -e
        grep -qF "GX-004 (Ancestors)" "{{ tablet_file }}"
        grep -qF "ancestors name method lineages" "{{ tablet_file }}"
        echo "PROVEN: GX-004 is sealed"
      register: prove_gx004
      changed_when: false

    - name: "1.3 | PROVE each son's honesty clause is sealed verbatim"
      ansible.builtin.shell: |
        set -e
        grep -qF "SaadounFocus returns **WITHHELD-SHARP**" "{{ tablet_file }}"
        grep -qF "One-epoch flickers are WITHHELD, never subtracted, never" "{{ tablet_file }}"
        grep -qF "verdict UNKNOWN-TRIBE" "{{ tablet_file }}"
        echo "PROVEN: the honesty clause of all three sons is sealed"
      register: prove_sons
      changed_when: false

    - name: "1.4 | PROVE the Family Law's never-averaged clause is sealed"
      ansible.builtin.shell: |
        set -e
        grep -qF "SaadounFocus prepares," "{{ tablet_file }}"
        grep -qF "discrete and never averaged (Napharu" "{{ tablet_file }}"
        echo "PROVEN: the Family Law is sealed"
      register: prove_family
      changed_when: false

    - name: "1.5 | PROVE the Sala court stages all three sons in family order"
      ansible.builtin.shell: |
        set -e
        grep -qF "SaadounFocus" "{{ court_file }}"
        grep -qF "SaadounWitness" "{{ court_file }}"
        grep -qF "SaadounOrbit" "{{ court_file }}"
        grep -qF "WITHHELD-SHARP" "{{ court_file }}"
        echo "PROVEN: the three-act court stages the family in order, ending WITHHELD-SHARP-honest"
      register: prove_court
      changed_when: false

    - name: "2.1 | Report"
      ansible.builtin.debug:
        msg: >
          PB-584 complete. GL-ISR-001 sealed: the Saadoun Calculus
          founds three ISAR methods as one family under GX-004 -
          SaadounFocus (drift removal, honest WITHHELD-SHARP floor),
          SaadounWitness (two-epoch scatterer minting, ghosts refused),
          SaadounOrbit (orbit-bundle topology recognition, honest
          UNKNOWN-TRIBE) - all discrete, never averaged. Renumbered
          from the source deposit's PB-ISR-001; see
          shala-prototypes/batch16_saadoun_family_puluhtu_deploygate/README.md
          for the full renumbering table. This tablet resolves part of
          the dependency gap batch15 reported for GL-ISR-002-A1 (Alaa):
          its grandparent is now sealed here.
