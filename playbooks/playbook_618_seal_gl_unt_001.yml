---
# PB-361 · Seal GL-UNT-001 · Tablet of the Four Units
# CSR-08: running this playbook IS the confirmation of the seal.
- name: PB-361 seal GL-UNT-001
  hosts: girsu
  gather_facts: true
  vars:
    law_root: "{{ ansible_env.HOME }}/bahyway/laws"
    tablet: GL-UNT-001_SEALED.md
    tablet_id: GL-UNT-001
    seal_key: "{{ ansible_env.HOME }}/bahyway/keys/akkadian_seal_ed25519"
  tasks:
    - name: Ensure law and seal directories
      ansible.builtin.file: {path: "{{ item }}", state: directory, mode: "0750"}
      loop: ["{{ law_root }}", "{{ law_root }}/sealed", "{{ law_root }}/receipts"]

    - name: Refuse to re-seal an already sealed tablet
      ansible.builtin.stat: {path: "{{ law_root }}/sealed/{{ tablet }}"}
      register: existing
    # FIXED 2026-08-26 (found live: a fatal `assert` here halts the
    # ENTIRE ansible-playbook run, not just this play -- proven
    # empirically -- so an already-sealed tablet (this gate working
    # exactly as designed) permanently blocked every later step of
    # PB-626's own multi-tablet rite). "Already sealed" is now a clean,
    # non-fatal stop for this one play, not a failure -- the same
    # no-silent-overwrite protection (nothing below this ever runs),
    # without poisoning any later, independent play in the same run.
    - name: Gate G0 · already sealed -- no silent overwrite, no action taken
      ansible.builtin.debug:
        msg: "{{ tablet_id }} is already sealed. Amendments require GL-UNT-001-A1 and a fresh CSR-08 rite. No action taken (idempotent no-op, not a failure)."
      when: existing.stat.exists

    - name: Gate G0 · end this play cleanly when already sealed
      ansible.builtin.meta: end_play
      when: existing.stat.exists

    - name: Gate G0 · tablet not yet sealed, proceeding
      ansible.builtin.debug:
        msg: "G0 green - tablet not yet sealed"
      when: not existing.stat.exists

    - name: Place the tablet
      ansible.builtin.copy: {src: "{{ tablet }}", dest: "{{ law_root }}/sealed/{{ tablet }}", mode: "0440"}

    - name: Gate G1 · required sections present
      ansible.builtin.shell: |
        set -e
        for s in "## §1" "## §2" "## §3" "## §4" "## §5" "## §6" "## §7"; do
          grep -q "$s" "{{ law_root }}/sealed/{{ tablet }}" || { echo "missing $s"; exit 1; }
        done
        echo "G1 green - seven sections"
      changed_when: false
      register: g1

    - name: Gate G2 · no SQL syntax anywhere in the tablet
      # Bare-keyword matching on SELECT/FROM/EXISTS false-positives on ordinary
      # English prose ("from the stage", "tablet exists") -- real SQL syntax
      # needs SELECT...FROM together, EXISTS(, or an INNER/LEFT JOIN phrase.
      ansible.builtin.shell: |
        ! grep -Eiq 'SELECT +[A-Za-z*].{0,200}\bFROM\b|INNER JOIN|LEFT JOIN|EXISTS *\(' "{{ law_root }}/sealed/{{ tablet }}"
      changed_when: false

    - name: Compute Ed25519 AkkadianSeal
      ansible.builtin.shell: |
        openssl pkeyutl -sign -rawin -inkey "{{ seal_key }}" \
          -in "{{ law_root }}/sealed/{{ tablet }}" | base64 -w0
      register: seal
      changed_when: true
      no_log: false

    - name: Write the Kanīku receipt
      ansible.builtin.copy:
        dest: "{{ law_root }}/receipts/{{ tablet_id }}.kaniku.yml"
        mode: "0440"
        content: |
          tablet: {{ tablet_id }}
          file: {{ tablet }}
          sha256: "{{ (lookup('pipe', 'sha256sum ' + law_root + '/sealed/' + tablet)).split()[0] }}"
          seal_ed25519: "{{ seal.stdout }}"
          sealed_on: "{{ ansible_date_time.iso8601 }}"
          sealed_by: "DUB.SAR"
          rite: CSR-08
          gates: {G0: green, G1: green, G2: green}

    - name: Register in the law registry
      ansible.builtin.lineinfile:
        path: "{{ law_root }}/REGISTRY.log"
        create: true
        mode: "0640"
        line: "{{ ansible_date_time.iso8601 }} SEALED {{ tablet_id }} sha256={{ (lookup('pipe', 'sha256sum ' + law_root + '/sealed/' + tablet)).split()[0] }}"

    - name: Court journal
      ansible.builtin.lineinfile:
        path: "{{ ansible_env.HOME }}/bahyway/sala/court_journal.log"
        create: true
        line: "{{ ansible_date_time.iso8601 }} PB-361 {{ tablet_id }} SEALED - RU and MLU enter the ecosystem"
