# PB-210 (2026-07-19): default inventory for every playbook in
# playbooks/, so `ansible-playbook playbooks/playbook_NNN_....yml -e ...`
# just works from the repo root, no `-i` flag needed on every invocation.
# See ansible/inventory.ini's own header comment for why this was missing
# and how it was discovered.
[defaults]
inventory = ansible/inventory.ini
host_key_checking = False
