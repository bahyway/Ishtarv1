 fill="#e8b23a" letter-spacing="5">THE FADAM FIELD CONDITION · CANDIDATE · AWAITING THE WORD</text>
<line x1="120" y1="86" x2="880" y2="86" stroke="#7a5c3a" stroke-width="1.4"/>
<text x="500.0" y="152" text-anchor="middle" font-family="Georgia, serif" font-style="italic"
 font-size="28" fill="#c9b28a">φ₇(c) → v  ⇔  ρ(c) ≤ ε(Θ)  ∧  h(c) = 0  ∧  ∂₇c ⊆ A  ∧  depth ∈ W*</text>
<text x="500.0" y="216" text-anchor="middle" font-family="Georgia, serif" font-style="italic"
 font-size="23" fill="#8a7a5e">ρ(c) = π₀ ∏(1−pᵥ) / [ π₀ ∏(1−pᵥ) + (1−π₀) ]   ·   Φ(A₇) ⇔ max ρ(c) ≤ ε(Θ)</text>
<line x1="120" y1="250" x2="880" y2="250" stroke="#7a5c3a" stroke-width="1.2"/>
<text x="150" y="296" font-family="Courier New, monospace" font-size="14.5" fill="#e8b23a">A₇ · GAPLESS CURVED TILING</text>
<text x="150" y="318" font-family="Georgia, serif" font-size="14.5" fill="#8a7a5e">worst cell, never the mean — no unowned ground</text>
<text x="560" y="296" font-family="Georgia, serif" font-size="15" fill="#e8b23a">∂₇c ⊆ A · THE HIGGS BORDER LAW</text>
<text x="560" y="318" font-family="Georgia, serif" font-size="14.5" fill="#8a7a5e">certification is relational — no island in ignorance</text>
<text x="150" y="362" font-family="Courier New, monospace" font-size="14.5" fill="#6fa8dc">h(c) = 0 · HUBURU: NOISE AS WITNESS</text>
<text x="150" y="384" font-family="Georgia, serif" font-size="14.5" fill="#8a7a5e">structured residue vetoes the certificate</text>
<text x="560" y="362" font-family="Georgia, serif" font-size="15" fill="#6fa8dc">depth ∈ W* · TYPED INDEPENDENT WITNESSES</text>
<text x="560" y="384" font-family="Georgia, serif" font-size="14.5" fill="#8a7a5e">the skin may summon; only depth may certify</text>
