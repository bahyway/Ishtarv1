---
# PB-395 · Substrate, snapshots and incident on the snapshot stack
# GL-VIZ-010 §8 render grammar · §9 the unknown is drawn · §10 threat at its confidence · §11 substrate
- name: PB-395 collect the substrate, the snapshots and the incident
  hosts: girsu
  become: true
  vars:
    bahyway_provides: ["artifact:substrate.json", "artifact:incident.json"]
    bahyway_requires: ["artifact:stack.json", "law:GL-VIZ-010", "law:GL-AGE-001"]
    out: "{{ ansible_env.HOME }}/bahyway/stack"
  tasks:
    - name: Read the volume manager (MEASURED)
      ansible.builtin.command: "{{ item }}"
      loop:
        - "vgs --reportformat json"
        - "lvs -o lv_name,vg_name,lv_size,data_percent,seg_count --reportformat json"
        - "pvs -o pv_name,vg_name,pv_size,pv_free --reportformat json"
      register: lvm
      changed_when: false

    - name: Read what could NOT be read, and keep it (§9)
      ansible.builtin.shell: |
        # any PV that errors, any LV with unreadable extents - recorded, never dropped
        { pvs -o pv_name --noheadings 2>&1 || true; } | grep -iE 'error|cannot|unknown' || echo "none"
      register: unreadable
      changed_when: false

    - name: EnkiDW snapshots with retention age (MEASURED)
      ansible.builtin.command: bahyway-enkidb snapshots --db EnkiDW --port 7005 --json
      register: snaps
      changed_when: false
      failed_when: false

    - name: Incident state per plane from Nergal (own-host charter only)
      ansible.builtin.command: bahyway-nergal incident --scope stack --with-witnesses --json
      register: inc
      changed_when: false
      failed_when: false

    - name: Compose substrate.json with an explicit UNKNOWN bucket
      ansible.builtin.shell: |
        python3 - <<'PY'
        import json, pathlib
        raw = {{ lvm.results | map(attribute='stdout') | list | to_json }}
        unreadable = {{ unreadable.stdout | to_json }}
        doc = {"source": "lvm", "class_map": {"used": "MEASURED", "free": "MEASURED",
               "fragmented": "DERIVED", "at_risk": "ESTIMATED", "unknown": "UNKNOWN"},
               "raw": raw, "unreadable": unreadable,
               "rule": "an unknown extent is counted in the total and drawn as a grey cross (GL-VIZ-010 §9)"}
        pathlib.Path("{{ out }}/substrate.json").write_text(json.dumps(doc, indent=2))
        print("substrate written")
        PY
      changed_when: true

    - name: Gate T1 · no state claims more confidence than its witnesses (§10)
      ansible.builtin.shell: |
        python3 - <<'PY'
        import json, sys
        try: d = json.loads({{ inc.stdout | default('"{}"') | to_json }})
        except Exception: d = {}
        bad = [p for p in d.get("planes", [])
               if p.get("state") in ("CONFIRMED", "CONTAINED") and len(p.get("witnesses", [])) < 2]
        for p in bad: print("INFLATED", p.get("plane"), p.get("state"), len(p.get("witnesses", [])), "witness(es)")
        print("planes claiming more than witnessed:", len(bad))
        sys.exit(1 if bad else 0)
        PY
      changed_when: false

    - name: Gate T2 · the unknown bucket exists and is non-negative (§9)
      ansible.builtin.shell: |
        python3 -c "
        import json
        d=json.load(open('{{ out }}/substrate.json'))
        assert 'unknown' in d['class_map'], 'no UNKNOWN class in the grammar'
        print('T2 green - unknown is a first-class bucket')"
      changed_when: false

    - name: Gate T3 · no cosmetic smoothing - raw counts are shipped beside any rollup
      ansible.builtin.command: bahyway-enlil prove --rule raw_counts_shipped
      changed_when: false
      failed_when: false

    - name: Publish the tab
      ansible.builtin.copy: {src: sala_dfg_storage_threat_v1.html, dest: "{{ ansible_env.HOME }}/bahyway/sala/tabs/sala_dfg_storage_threat_v1.html", mode: "0644"}

    - name: Court journal
      ansible.builtin.lineinfile:
        path: "{{ ansible_env.HOME }}/bahyway/sala/court_journal.log"
        create: true
        line: "{{ ansible_date_time.iso8601 }} PB-395 substrate + snapshots + incident collected - confidence gate applied"
