---
# PB-374 · Private cloud access · overlay network, no open ports, vendor relay off
# Doctrine: the NAS is never published to the internet. Reachability is granted per-device, not per-port.
# Law: GL-UNT-001 §3 (the disclosure boundary travels with the data) · SUSA is the only outward gate.
- name: PB-374 make the NAS reachable from outside without exposing it
  hosts: nas
  become: true
  vars:
    tailnet_tag: "tag:bahyway"
    allowed_services: [5443, 7001, 7002, 7003, 7004, 7005, 7006, 7007]   # UGOS UI + EnkiDB ports
    lan_cidr: "192.168.1.0/24"
  tasks:
    - name: Gate P0 · refuse to proceed if any NAS port is forwarded on the router
      ansible.builtin.debug:
        msg: >
          MANUAL CHECK REQUIRED - open the router and confirm there is NO port-forward and NO UPnP
          mapping pointing at this NAS. Overlay access replaces port forwarding; running both is worse
          than either. Abort this playbook if a forward exists.

    - name: Turn OFF the vendor remote-access relay and discovery (sovereignty)
      ansible.builtin.debug:
        msg: >
          MANUAL in UGOS Pro - Control Panel > Network > Cloud Connect - OFF (this relay routes your
          traffic through the vendor's servers). Uncheck Enable WebFind. Control Panel > General -
          usage analytics OFF. Then continue; the overlay below replaces all of it.

    - name: Tailscale via Docker (the supported path on UGOS)
      community.docker.docker_container:
        name: tailscale
        image: tailscale/tailscale:latest
        network_mode: host
        privileged: true
        restart_policy: unless-stopped
        devices: ["/dev/net/tun:/dev/net/tun"]
        capabilities: [NET_ADMIN, SYS_MODULE]
        env:
          TS_AUTHKEY: "{{ lookup('env','TS_AUTHKEY') }}"
          TS_STATE_DIR: "/var/lib/tailscale"
          TS_EXTRA_ARGS: "--advertise-tags={{ tailnet_tag }} --advertise-routes={{ lan_cidr }} --ssh"
          TS_ACCEPT_DNS: "true"
        volumes:
          - "/volume1/docker/tailscale:/var/lib/tailscale"

    - name: Host firewall · deny everything from the physical LAN interface except LAN itself
      ansible.builtin.debug:
        msg: >
          MANUAL in UGOS Pro firewall - allow {{ allowed_services | join(', ') }} from {{ lan_cidr }}
          and from 100.64.0.0/10 (the tailnet) ONLY. Deny all other sources. SMB, NFS, SSH and the
          management UI must never answer a public address.

    - name: Gate P1 · the NAS answers on the tailnet
      ansible.builtin.command: tailscale status --json
      register: ts
      changed_when: false
      failed_when: "'Self' not in ts.stdout"

    - name: Gate P2 · the NAS does NOT answer on its public address
      ansible.builtin.shell: |
        pub=$(curl -s https://api.ipify.org)
        for p in {{ allowed_services | join(' ') }} 22 445 2049; do
          timeout 3 bash -c "</dev/tcp/$pub/$p" 2>/dev/null && { echo "EXPOSED on $p"; exit 1; }
        done
        echo "P2 green - no service answers on $pub"
      changed_when: false

    - name: Gate P3 · 2FA enforced on every admin account
      ansible.builtin.debug:
        msg: "MANUAL - UGOS Pro > Control Panel > Users: 2FA required for every account with admin rights."

    - name: Court journal
      ansible.builtin.lineinfile:
        path: "/volume1/bahyway/court_journal.log"
        create: true
        line: "{{ ansible_date_time.iso8601 }} PB-374 private cloud access - overlay up, vendor relay off, no public ports"
