---
# PB-371 · CDSE Arsenal · fetch Copernicus products into the landing zone with receipts
# Law: GL-FLD-001 §5 (archive is the store; the field over it is a view) · GL-UNT-001 §3 (boundary travels with shared data)
- name: PB-371 land Copernicus archives
  hosts: girsu
  vars:
    lz: "{{ ansible_env.HOME }}/bahyway/landing_zone"
    collection: SENTINEL-2
    wkt: "POLYGON((4.72 52.28,5.02 52.28,5.02 52.43,4.72 52.43,4.72 52.28))"   # replace per target
    start: "2026-06-01"
    end: "2026-08-24"
    cloud: 30
    limit: 12
  tasks:
    - name: Ensure landing zone layout
      ansible.builtin.file: {path: "{{ lz }}/{{ item }}", state: directory, mode: "0750"}
      loop: [raw, receipts, derived, quarantine]

    - name: Place the arsenal tool
      ansible.builtin.copy: {src: arsenal.py, dest: "{{ lz }}/arsenal.py", mode: "0750"}

    - name: Gate L0 · credentials present (never stored in the playbook)
      ansible.builtin.assert:
        that:
          - lookup('env','CDSE_USER') | length > 0
          - lookup('env','CDSE_PASS') | length > 0
        fail_msg: "export CDSE_USER and CDSE_PASS before running PB-371"

    - name: Gate L1 · dry run first — refuse to land more than the free disk allows
      ansible.builtin.shell: >
        python3 {{ lz }}/arsenal.py --collection {{ collection }} --wkt "{{ wkt }}"
        --start {{ start }} --end {{ end }} --cloud {{ cloud }} --limit {{ limit }} --dry-run
      register: dry
      changed_when: false

    - name: Show the estimate
      ansible.builtin.debug: {msg: "{{ dry.stdout_lines }}"}

    - name: Assert free space is at least twice the estimate
      ansible.builtin.shell: |
        need=$(echo "{{ dry.stdout }}" | grep 'estimated landing size' | grep -oE '[0-9.]+')
        free=$(df -BG --output=avail "{{ lz }}" | tail -1 | tr -dc '0-9')
        python3 -c "import sys;sys.exit(0 if $free > 2*$need else 1)"
      changed_when: false

    - name: Land the archives
      ansible.builtin.shell: >
        python3 {{ lz }}/arsenal.py --collection {{ collection }} --wkt "{{ wkt }}"
        --start {{ start }} --end {{ end }} --cloud {{ cloud }} --limit {{ limit }}
        --out {{ lz }}/raw --recompress
      register: landed
      changed_when: "'landed' in landed.stdout"

    - name: Gate L2 · every archive has a Kaniku receipt with a KAKI and a sha256
      ansible.builtin.shell: |
        set -e
        n=$(ls {{ lz }}/raw/*.zip 2>/dev/null | wc -l)
        r=$(ls {{ lz }}/raw/receipts/*.kaniku.json 2>/dev/null | wc -l)
        [ "$n" = "$r" ] || { echo "archives=$n receipts=$r"; exit 1; }
        echo "L2 green - $n archives, $n receipts"
      changed_when: false

    - name: Gate L3 · verify every sha256 against the bytes on disk
      ansible.builtin.shell: |
        set -e
        for j in {{ lz }}/raw/receipts/*.kaniku.json; do
          f="{{ lz }}/raw/$(python3 -c "import json,sys;print(json.load(open('$j'))['archive'])")"
          w=$(python3 -c "import json;print(json.load(open('$j'))['sha256'])")
          h=$(sha256sum "$f" | cut -d' ' -f1)
          [ "$w" = "$h" ] || { echo "BROKEN $f"; exit 1; }
        done
        echo "L3 green - all archives verify"
      changed_when: false

    - name: Court journal
      ansible.builtin.lineinfile:
        path: "{{ ansible_env.HOME }}/bahyway/sala/court_journal.log"
        create: true
        line: "{{ ansible_date_time.iso8601 }} PB-371 CDSE arsenal landed {{ collection }} {{ start }}..{{ end }} - receipts verified"
