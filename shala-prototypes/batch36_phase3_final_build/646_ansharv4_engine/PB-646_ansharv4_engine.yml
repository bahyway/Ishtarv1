---
# =============================================================================
# PB-646 — ANŠARV4 ENGINE 𒀭𒊹 · THE KNOWLEDGE GRAPH ENGINE TAKES ITS BODY
# BahyWay.Ecosystem v4.+ · NL-001: gods name engines
# NAMING COLLISION -- RESOLVED at landing, per the Architect's instruction (2026-08-25):
#   any name colliding with an existing engine keeps the same name with a `v4` suffix.
#   The real, compiled engine at workspace/bahyway_v4/crates/bahyway-algebra/src/anshar.rs
#   defines `pub struct AnsharEngine` (Sigma_BW signature verification for Tribes) -- that
#   struct, crate, and file are untouched. This playbook's Knowledge Graph engine is now
#   `AnsharV4Engine`, in its own `engines/ansharv4` crate (Cargo package `ansharv4`), so the
#   two coexist under related, non-colliding names rather than reusing one god-name twice.
# CSR-08: running this playbook is Bahaa's confirmation act.
#
# "Anšarv4 — šar kali šarrī of graphs: the graph of all graphs." (Ḫubullu epithet)
#
# Delivers:
#   1. engines/ansharv4 crate — zero-dependency std-only Rust:
#      store.rs   · anšar-line ingest (NODE/EDGE/HYPER), duplicate & malformed
#                   refusals, the five-check integrity court
#      piristu.rs · conditional transparency rings PUBLIC/PARTNER/DUBSAR,
#                   visible_label, certify_monotone (higher sees superset — law)
#      orbit.rs   · orbit_layers (StoryEngine spine) + ride_path (summit→plain)
#      export.rs  · Pirištu-respecting JSON export — sealed names NEVER leave
#                   the engine; the veil is enforced below the UI
#   2. kg.ansar — bahyway_kg.json converted to anšar lines on the host
#   3. COMPILE + RUNTIME gates — blocking (5 tests incl. leak-proof export)
#   4. Šala pairing: sala_PB-646_ansharv4_registry.html (Engine Registry tab)
#
# Run order: after PB-363 (the chain is ordered acts).
# =============================================================================
- name: "PB-646 · AnšarV4Engine — the whole sky holds the whole graph"
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    # Default fixed 2026-08-26: the source session's own default
    # (~/BahyWay.Ecosystem-v4.0) is a standalone project root that doesn't
    # exist in this repo -- the real Gula chain (playbook_602-608) landed
    # engines/gula under this repo's own root ({{ playbook_dir }}/..), which
    # is where AnsharV4Engine's preflight check for usurtu.rs actually needs
    # to look. BAHYWAY_ROOT env var still overrides, for anyone deliberately
    # targeting a different tree.
    bahyway_root: "{{ lookup('env', 'BAHYWAY_ROOT') | default(playbook_dir + '/..', true) }}"
    ansharv4_dir: "{{ bahyway_root }}/engines/ansharv4"
    kg_json: "{{ bahyway_root }}/kg/bahyway_kg.json"
    naru_dir: "{{ bahyway_root }}/naru"

  tasks:
    - name: "Preflight · the Gula chain must stand (PB-363 ran)"
      ansible.builtin.stat:
        path: "{{ bahyway_root }}/engines/gula/src/usurtu.rs"
      register: gula_stat

    - name: "Preflight · refuse without the predecessor"
      ansible.builtin.assert:
        that: gula_stat.stat.exists
        fail_msg: "usurtu.rs not found — run PB-357..363 first. Playbooks are ordered acts."

    - name: "Preflight · cargo present"
      ansible.builtin.command: cargo --version
      changed_when: false

    - name: "Raise the engine's rooms"
      ansible.builtin.file:
        path: "{{ ansharv4_dir }}/src"
        state: directory
        mode: "0755"

    - name: "Write Cargo.toml"
      ansible.builtin.copy:
        dest: "{{ ansharv4_dir }}/Cargo.toml"
        mode: "0644"
        content: |
          [package]
          name = "ansharv4"
          version = "0.1.0"
          edition = "2021"
          description = "ANSHARV4 𒀭𒊹 — the Knowledge Graph engine: the whole sky holds the whole graph"

          [dependencies]
    - name: "Write src/lib.rs"
      ansible.builtin.copy:
        dest: "{{ ansharv4_dir }}/src/lib.rs"
        mode: "0644"
        content: |
          //! ANŠARV4 ENGINE 𒀭𒊹 — the whole sky holds the whole graph.
          //! "Anšarv4 — šar kali šarrī of graphs: the graph of all graphs." (Ḫubullu epithet)
          //! NL-001: gods name engines. Naming tablet: NL-001_Naming_Tablet_AnsharV4Engine.
          pub mod export;
          pub mod orbit;
          pub mod piristu;
          pub mod store;

          #[cfg(test)]
          mod tests {
              use crate::export::to_json;
              use crate::orbit::{orbit_layers, ride_path};
              use crate::piristu::{certify_monotone, sealed, visible_label};
              use crate::store::{AnsharV4Store, IngestVerdict};

              fn mini() -> AnsharV4Store {
                  let mut s = AnsharV4Store::default();
                  for l in [
                      "NODE ALG|THEOREM|GL-ALG-002|PUBLIC|C",
                      "NODE L_AGE|LAW|GL-AGE-001|PARTNER|C",
                      "NODE huburu|TERM|huburu|PARTNER|C",
                      "NODE zaqiqu|TERM|zaqiqu|DUBSAR|C",
                      "NODE g_noi|CRATE|gula::noise|DUBSAR|AC",
                      "NODE g_zaq|CRATE|gula::zaqiqu|DUBSAR|AC",
                      "NODE a362|APP|Agu Crown|PARTNER|BC",
                      "NODE a358|APP|Zaqiqu Veil|PARTNER|BC",
                      "EDGE ALG|L_AGE|governs|harranu",
                      "EDGE L_AGE|huburu|names|harranu",
                      "EDGE L_AGE|zaqiqu|names|harranu",
                      "EDGE huburu|g_noi|implemented_in|suqu",
                      "EDGE zaqiqu|g_zaq|implemented_in|suqu",
                      "EDGE g_noi|a362|exhibited_in|suqu",
                      "EDGE g_zaq|a358|exhibited_in|suqu",
                      "HYPER H_huburu|tribe|tribe of huburu|L_AGE,huburu,g_noi,a362",
                  ] {
                      assert_eq!(s.ingest_line(l), IngestVerdict::Accepted, "{l}");
                  }
                  s
              }

              #[test]
              fn ingest_refuses_duplicates_and_malformed() {
                  let mut s = mini();
                  assert!(matches!(
                      s.ingest_line("NODE ALG|THEOREM|dup|PUBLIC|C"),
                      IngestVerdict::RejectedDuplicate(_)));
                  assert!(matches!(
                      s.ingest_line("NODE broken"),
                      IngestVerdict::RejectedMalformed(_)));
              }

              #[test]
              fn integrity_court_passes_and_catches() {
                  let s = mini();
                  assert!(s.integrity().is_ok());
                  let mut bad = mini();
                  bad.ingest_line("EDGE ghost|ALG|haunts|kin");
                  assert!(bad.integrity().is_err(), "missing endpoint must be caught");
              }

              #[test]
              fn piristu_is_monotone_and_leaks_nothing() {
                  let s = mini();
                  assert!(certify_monotone(&s));
                  let z = &s.nodes["zaqiqu"];
                  assert!(sealed(z, 0) && sealed(z, 1) && !sealed(z, 2));
                  assert_eq!(visible_label(z, 0), "𒁾 pirištu");
                  let export_visitor = to_json(&s, 0);
                  assert!(!export_visitor.contains("zaqiqu\",\"sealed\":false"));
                  assert!(!export_visitor.contains("\"label\":\"zaqiqu\""),
                      "the engine's export must not carry the sealed name");
                  assert!(to_json(&s, 2).contains("\"label\":\"zaqiqu\""));
              }

              #[test]
              fn orbit_layers_span_the_terraces() {
                  let s = mini();
                  let l = orbit_layers(&s, "huburu");
                  assert!(l["LAW"].contains("L_AGE"));
                  assert!(l["CRATE"].contains("g_noi"));
                  assert!(l["APP"].contains("a362"));
              }

              #[test]
              fn every_ride_reaches_the_plain() {
                  let s = mini();
                  for start in ["huburu", "g_noi", "L_AGE", "zaqiqu"] {
                      let p = ride_path(&s, start);
                      assert_eq!(p[0], "ALG", "{start} starts at summit");
                      assert_eq!(s.nodes[p.last().unwrap()].ntype, "APP",
                          "{start} ends at an app: {:?}", p);
                  }
              }
          }
    - name: "Write src/store.rs"
      ansible.builtin.copy:
        dest: "{{ ansharv4_dir }}/src/store.rs"
        mode: "0644"
        content: |
          //! ANŠARV4 store — the whole sky holds the whole graph (PB-646).
          //! Ingest format: anšar lines (append-only, NĀRU-kin):
          //!   NODE id|type|label|clearance|p1p2   (pillars as letters, e.g. AC)
          //!   EDGE from|to|rel|line
          //!   HYPER id|kind|label|m1,m2,...
          use std::collections::{BTreeMap, BTreeSet};

          #[derive(Debug, Clone)]
          pub struct Node {
              pub id: String,
              pub ntype: String,
              pub label: String,
              pub clearance: String,
              pub pillars: Vec<char>,
          }
          #[derive(Debug, Clone)]
          pub struct Edge {
              pub from: String,
              pub to: String,
              pub rel: String,
              pub line: String,
          }
          #[derive(Debug, Clone)]
          pub struct Hyper {
              pub id: String,
              pub kind: String,
              pub label: String,
              pub members: Vec<String>,
          }

          #[derive(Debug, Default)]
          pub struct AnsharV4Store {
              pub nodes: BTreeMap<String, Node>,
              pub edges: Vec<Edge>,
              pub hyper: Vec<Hyper>,
          }

          #[derive(Debug, PartialEq)]
          pub enum IngestVerdict {
              Accepted,
              RejectedDuplicate(String),
              RejectedMalformed(String),
          }

          impl AnsharV4Store {
              pub fn ingest_line(&mut self, raw: &str) -> IngestVerdict {
                  let raw = raw.trim();
                  if raw.is_empty() || raw.starts_with('#') {
                      return IngestVerdict::Accepted;
                  }
                  let (kind, rest) = match raw.split_once(' ') {
                      Some(p) => p,
                      None => return IngestVerdict::RejectedMalformed(raw.into()),
                  };
                  let f: Vec<&str> = rest.split('|').collect();
                  match kind {
                      "NODE" if f.len() == 5 => {
                          if self.nodes.contains_key(f[0]) {
                              return IngestVerdict::RejectedDuplicate(f[0].into());
                          }
                          self.nodes.insert(f[0].into(), Node {
                              id: f[0].into(), ntype: f[1].into(), label: f[2].into(),
                              clearance: f[3].into(), pillars: f[4].chars().collect(),
                          });
                          IngestVerdict::Accepted
                      }
                      "EDGE" if f.len() == 4 => {
                          self.edges.push(Edge {
                              from: f[0].into(), to: f[1].into(),
                              rel: f[2].into(), line: f[3].into(),
                          });
                          IngestVerdict::Accepted
                      }
                      "HYPER" if f.len() == 4 => {
                          self.hyper.push(Hyper {
                              id: f[0].into(), kind: f[1].into(), label: f[2].into(),
                              members: f[3].split(',').map(|s| s.into()).collect(),
                          });
                          IngestVerdict::Accepted
                      }
                      _ => IngestVerdict::RejectedMalformed(raw.into()),
                  }
              }

              /// The integrity court — the five checks the Ziqqurratu swore.
              pub fn integrity(&self) -> Result<(), Vec<String>> {
                  let mut faults = Vec::new();
                  for e in &self.edges {
                      if !self.nodes.contains_key(&e.from) || !self.nodes.contains_key(&e.to) {
                          faults.push(format!("edge endpoint missing: {}->{}", e.from, e.to));
                      }
                  }
                  for h in &self.hyper {
                      if h.kind == "tribe" {
                          let types: BTreeSet<_> = h.members.iter()
                              .filter_map(|m| self.nodes.get(m).map(|n| n.ntype.clone()))
                              .collect();
                          if types.len() < 2 {
                              faults.push(format!("tribe {} spans <2 membranes", h.id));
                          }
                      }
                  }
                  for n in self.nodes.values() {
                      if n.ntype == "TERM"
                          && !self.edges.iter().any(|e| e.from == n.id && e.line == "suqu")
                      {
                          faults.push(format!("TERM {} rides no suqu", n.id));
                      }
                      if n.pillars.is_empty() {
                          faults.push(format!("station {} has no pillar", n.id));
                      }
                  }
                  if faults.is_empty() { Ok(()) } else { Err(faults) }
              }
          }
    - name: "Write src/piristu.rs"
      ansible.builtin.copy:
        dest: "{{ ansharv4_dir }}/src/piristu.rs"
        mode: "0644"
        content: |
          //! PIRIŠTU — conditional transparency, enforced at the engine.
          //! mūdû mūdâ likallim, lā mūdû ay īmur.
          use crate::store::{AnsharV4Store, Node};

          pub const RINGS: [&str; 3] = ["PUBLIC", "PARTNER", "DUBSAR"];

          pub fn ring(clearance: &str) -> usize {
              RINGS.iter().position(|r| *r == clearance).unwrap_or(0)
          }
          pub fn sealed(n: &Node, viewer: usize) -> bool {
              ring(&n.clearance) > viewer
          }
          /// Structure always; the label itself is inside the bucket.
          pub fn visible_label(n: &Node, viewer: usize) -> String {
              if sealed(n, viewer) { "𒁾 pirištu".into() } else { n.label.clone() }
          }
          /// Monotone disclosure: every higher ring sees a superset. Law, proven.
          pub fn certify_monotone(store: &AnsharV4Store) -> bool {
              store.nodes.values().all(|n| {
                  let v: Vec<bool> = (0..3).map(|w| !sealed(n, w)).collect();
                  !(v[0] && !v[1]) && !(v[1] && !v[2])
              })
          }
    - name: "Write src/orbit.rs"
      ansible.builtin.copy:
        dest: "{{ ansharv4_dir }}/src/orbit.rs"
        mode: "0644"
        content: |
          //! Orbit-layer queries + the sūqu ride — summit to the plain.
          use crate::store::AnsharV4Store;
          use std::collections::{BTreeMap, BTreeSet};

          /// Related stations grouped by membrane (StoryEngine's spine).
          pub fn orbit_layers(s: &AnsharV4Store, id: &str) -> BTreeMap<String, BTreeSet<String>> {
              let mut out: BTreeMap<String, BTreeSet<String>> = BTreeMap::new();
              let mut add = |out: &mut BTreeMap<String, BTreeSet<String>>, other: &str| {
                  if other == id { return; }
                  if let Some(o) = s.nodes.get(other) {
                      out.entry(o.ntype.clone()).or_default().insert(other.to_string());
                  }
              };
              for h in s.hyper.iter().filter(|h| h.kind != "pillar") {
                  if h.members.iter().any(|m| m == id) {
                      for m in &h.members { add(&mut out, m); }
                  }
              }
              for e in &s.edges {
                  if e.from == id { add(&mut out, &e.to); }
                  if e.to == id { add(&mut out, &e.from); }
              }
              out
          }

          /// Summit → … → APP through the given station. Every ride reaches the plain.
          pub fn ride_path(s: &AnsharV4Store, id: &str) -> Vec<String> {
              let up = |x: &str| -> Option<String> {
                  let n = s.nodes.get(x)?;
                  match n.ntype.as_str() {
                      "TERM" => s.edges.iter()
                          .find(|e| e.to == x && e.rel == "names").map(|e| e.from.clone()),
                      "LAW" => Some("ALG".into()),
                      "CRATE" | "APP" => s.edges.iter()
                          .find(|e| e.to == x && e.line == "suqu").map(|e| e.from.clone()),
                      _ => None,
                  }
              };
              let mut climb = Vec::new();
              let mut cur = id.to_string();
              let mut guard = 0;
              while cur != "ALG" && guard < 8 {
                  climb.insert(0, cur.clone());
                  match up(&cur) { Some(p) => cur = p, None => break }
                  guard += 1;
              }
              let mut chain = vec!["ALG".to_string()];
              chain.extend(climb);
              let mut guard = 0;
              loop {
                  let tail = chain.last().unwrap().clone();
                  let t = s.nodes.get(&tail).map(|n| n.ntype.clone()).unwrap_or_default();
                  if t == "APP" || guard > 8 { break; }
                  let next = s.edges.iter()
                      .find(|e| e.from == tail && e.line == "suqu"
                          && s.nodes.get(&e.to).map(|n| n.ntype != t).unwrap_or(false))
                      .map(|e| e.to.clone())
                      .or_else(|| s.edges.iter()
                          .find(|e| e.from == tail && e.line == "harranu"
                              && s.nodes.get(&e.to).map(|n| n.ntype == "TERM").unwrap_or(false))
                          .map(|e| e.to.clone()));
                  match next {
                      Some(n) if !chain.contains(&n) => chain.push(n),
                      _ => break,
                  }
                  guard += 1;
              }
              chain
          }
    - name: "Write src/export.rs"
      ansible.builtin.copy:
        dest: "{{ ansharv4_dir }}/src/export.rs"
        mode: "0644"
        content: |
          {% raw %}
          //! Pirištu-respecting export — the veil enforced at the ENGINE, not the UI.
          //! Sealed buckets leave the vault as structure only; the gloss never travels.
          use crate::piristu::{sealed, visible_label};
          use crate::store::AnsharV4Store;

          fn esc(s: &str) -> String {
              s.replace('\\', "\\\\").replace('"', "\\\"")
          }

          pub fn to_json(s: &AnsharV4Store, viewer: usize) -> String {
              let mut out = String::from("{\"nodes\":[");
              for (i, n) in s.nodes.values().enumerate() {
                  if i > 0 { out.push(','); }
                  out.push_str(&format!(
                      "{{\"id\":\"{}\",\"type\":\"{}\",\"label\":\"{}\",\"sealed\":{}}}",
                      esc(&n.id), esc(&n.ntype), esc(&visible_label(n, viewer)),
                      sealed(n, viewer)));
              }
              out.push_str("],\"edges\":[");
              for (i, e) in s.edges.iter().enumerate() {
                  if i > 0 { out.push(','); }
                  out.push_str(&format!(
                      "{{\"from\":\"{}\",\"to\":\"{}\",\"line\":\"{}\"}}",
                      esc(&e.from), esc(&e.to), esc(&e.line)));
              }
              out.push_str("]}");
              out
          }
          {% endraw %}

    - name: "Scribe the KG converter"
      ansible.builtin.copy:
        dest: "{{ ansharv4_dir }}/kg_to_ansar.py"
        mode: "0755"
        content: |
          import json,sys
          kg=json.load(open(sys.argv[1]))
          out=open(sys.argv[2],'w')
          out.write('# ANSHARV4 lines · generated from bahyway_kg.json · PB-646\n')
          for n in kg['nodes']:
              out.write('NODE %s|%s|%s|%s|%s\n'%(n['id'],n['type'],
                n['label'].replace('|','/'),n.get('clearance','PUBLIC'),
                ''.join(n.get('pillars',[]))))
          for e in kg['edges']:
              out.write('EDGE %s|%s|%s|%s\n'%(e['from'],e['to'],e['rel'],e['line']))
          for h in kg.get('hyperedges',[]):
              out.write('HYPER %s|%s|%s|%s\n'%(h['id'],h['kind'],
                h['label'].replace('|','/'),','.join(h['members'])))
          out.close()
          print('anshar lines written:',sys.argv[2])

    - name: "Convert bahyway_kg.json → kg.ansar (when the KG is present)"
      ansible.builtin.command: >-
        python3 {{ ansharv4_dir }}/kg_to_ansar.py {{ kg_json }} {{ ansharv4_dir }}/kg.ansar
      args:
        creates: "{{ ansharv4_dir }}/kg.ansar"
      register: convert_out
      failed_when: false
      changed_when: convert_out.rc == 0

    - name: "GATE · COMPILE (cargo build) — blocking"
      ansible.builtin.command: cargo build
      args:
        chdir: "{{ ansharv4_dir }}"
      changed_when: true

    - name: "GATE · RUNTIME (cargo test) — blocking"
      ansible.builtin.command: cargo test
      args:
        chdir: "{{ ansharv4_dir }}"
      changed_when: false

    - name: "NĀRU · record the act"
      ansible.builtin.lineinfile:
        path: "{{ naru_dir }}/playbook_acts.jsonl"
        create: true
        mode: "0644"
        line: >-
          {"pb":"PB-646","act":"anshar-engine-raised","name":"AnsharV4 𒀭𒊹",
          "law":"NL-001 gods-name-engines","epithet":"shar kali sharri of graphs",
          "piristu":"export veil enforced at engine",
          "gates":{"compile":"green","runtime":"green"},
          "sala":"sala_PB-646_ansharv4_registry.html"}

    - name: "Verdict"
      ansible.builtin.debug:
        msg:
          - "PB-646 complete. Both gates green."
          - "Anšarv4 is seated: the store ingests, the court judges, the rings"
          - "hold, the rides reach the plain — and no sealed name ever leaves"
          - "the engine. The whole sky holds the whole graph. 𒀭𒊹"
